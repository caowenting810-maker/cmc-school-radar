<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMC ChemPath</title>
<meta name="description" content="CMC 师说 G8–G12 中英双语化学学习与竞赛刷题系统 · Bilingual chemistry learning and olympiad practice">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface2:#F8F9F6; --ink:#17191B; --ink2:#5A6064; --ink3:#8A9094;
  --line:#E0E2DD; --accent:#F97E1C; --accent-ink:#B4520A; --accent-soft:#FEEBDB;
  --good:#23865A; --good-soft:#E1F3EA; --bad:#C9433A; --bad-soft:#FBE6E3; --warn:#B7800C;
  --shadow:0 1px 2px rgba(23,25,27,.05),0 4px 16px rgba(23,25,27,.05);
  --f-display:'Bricolage Grotesque','Noto Sans SC',system-ui,sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111314;--surface:#1A1D1F;--surface2:#16181A;--ink:#EDEEEA;--ink2:#A2A8AC;--ink3:#737A7F;
  --line:#2B2F32;--accent:#F98A30;--accent-ink:#FFA35A;--accent-soft:#3A230F;
  --good:#4CC28A;--good-soft:#16301F;--bad:#F07167;--bad-soft:#3A1A18;--warn:#E6B34A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111314;--surface:#1A1D1F;--surface2:#16181A;--ink:#EDEEEA;--ink2:#A2A8AC;--ink3:#737A7F;
  --line:#2B2F32;--accent:#F98A30;--accent-ink:#FFA35A;--accent-soft:#3A230F;
  --good:#4CC28A;--good-soft:#16301F;--bad:#F07167;--bad-soft:#3A1A18;--warn:#E6B34A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
sub,sup{font-size:.72em;line-height:0}
a{color:var(--accent-ink)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 14px 16px}
.brand{color:var(--ink);padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand svg{width:100%;height:auto;display:block}
.brand .prod{font:700 13px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);margin-top:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--ink2);font-weight:500}
.nav button .ic{width:30px;height:30px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font:700 12px/1 var(--f-display);color:var(--ink2);flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink)}
.nav button.on .ic{border-color:var(--accent);background:var(--accent);color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink3);padding:12px 8px 0;border-top:1px solid var(--line)}
.gradepick{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.gradepick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;font:600 12px var(--f-mono);color:var(--ink2)}
.gradepick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* main */
.main{min-width:0;padding-inline:clamp(16px,4vw,44px);padding-block:30px 90px}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
h1{font:800 clamp(28px,4vw,40px)/1.1 var(--f-display);letter-spacing:-.02em;margin:10px 0 8px;text-wrap:balance}
h2{font:700 21px/1.25 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 16px/1.3 var(--f-body);margin:0}
.lede{color:var(--ink2);max-width:62ch;margin:0}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--ink2)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--surface2);white-space:nowrap}
.chip.l1{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.chip.l2{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.chip.l3{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:16px 18px}
.stat b{display:block;font:700 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
/* element tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.tile{position:relative;min-height:132px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px 12px;text-align:left;min-height:122px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .z{font:600 11px/1 var(--f-mono);color:var(--ink3)}
.tile .sy{font:800 34px/1 var(--f-display);margin:8px 0 4px;letter-spacing:-.02em}
.tile .nm{font-size:12.5px;font-weight:500;line-height:1.3;color:var(--ink2)}
.tile .ms{position:absolute;top:9px;right:10px;font:600 11px/1 var(--f-mono);color:var(--ink3)}
.tile .bar{margin-top:auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:10px}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.hot{border-color:var(--accent)}
/* grid helpers */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.road .st{padding:16px;border-right:1px solid var(--line);cursor:pointer;background:var(--surface)}
.road .st:last-child{border-right:0}
.road .st.on{background:var(--accent-soft)}
.road .gr{font:800 26px/1 var(--f-display)}
.road .stage{font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--accent-ink);text-transform:uppercase}
.road .tt{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
/* question */
.qwrap{max-width:780px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.qstem{font-size:17px;line-height:1.7;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 14px;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt .k{font:700 13px/1 var(--f-mono);width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;margin-top:1px}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.expl{margin-top:16px;border-left:3px solid var(--accent);background:var(--surface2);padding:12px 16px;border-radius:0 8px 8px 0}
.expl .v{font:700 14px var(--f-body);margin-bottom:4px}
.expl .v.ok{color:var(--good)} .expl .v.no{color:var(--bad)}
.ai-out{white-space:pre-wrap;margin-top:10px;font-size:14.5px;border-top:1px dashed var(--line);padding-top:10px}
.ai-only{display:none!important}
.has-ai .ai-only{display:inline-flex!important}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* mock */
.mockbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qgrid button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 12px var(--f-mono)}
.qgrid button.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.qgrid button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.qgrid button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.paper{display:flex;flex-direction:column;gap:10px;height:100%}
.paper .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.paper .spec{font:600 12px var(--f-mono);color:var(--ink2)}
.paper button{margin-top:auto;align-self:flex-start}
/* topic detail */
.kp{margin:0;padding-left:1.1em}
.kp li{margin:5px 0}
.eqbox{font-family:var(--f-mono);font-size:13.5px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0}
.maptbl{width:100%;border-collapse:collapse;font-size:13.5px}
.maptbl td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.maptbl td:first-child{font:600 12px var(--f-mono);color:var(--ink2);width:92px}
.back{border:0;background:none;color:var(--ink2);padding:0;font-weight:500}
/* periodic */
.ptwrap{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));gap:3px;min-width:720px}
.el{aspect-ratio:1;border-radius:4px;border:1px solid var(--line);background:var(--surface);padding:3px;display:flex;flex-direction:column;justify-content:space-between;font-size:9px;line-height:1;text-align:left;color:var(--ink)}
.el b{font:700 14px/1 var(--f-display);text-align:center}
.el:hover,.el.on{border-color:var(--accent);background:var(--accent-soft)}
.el.c-a{background:color-mix(in srgb,#E8704A 16%,var(--surface))}
.el.c-ae{background:color-mix(in srgb,#E4A33B 18%,var(--surface))}
.el.c-t{background:color-mix(in srgb,#5B8BD6 14%,var(--surface))}
.el.c-p{background:color-mix(in srgb,#7C9C8C 16%,var(--surface))}
.el.c-m{background:color-mix(in srgb,#57A88A 18%,var(--surface))}
.el.c-n{background:color-mix(in srgb,#9BBF4E 20%,var(--surface))}
.el.c-h{background:color-mix(in srgb,#3FB0C2 18%,var(--surface))}
.el.c-g{background:color-mix(in srgb,#9A72D0 16%,var(--surface))}
.el.c-l{background:color-mix(in srgb,#D07AA8 14%,var(--surface))}
.el.c-ac{background:color-mix(in srgb,#C0708A 18%,var(--surface))}
.el.gap{visibility:hidden}
.elinfo{display:flex;gap:18px;align-items:center}
.elbig{width:92px;height:92px;border:2px solid var(--accent);border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:7px;flex:none}
.elbig b{font:800 34px/1 var(--f-display);text-align:center}
.mono{font-family:var(--f-mono)}
.ctbl{width:100%;border-collapse:collapse;font-size:14px}
.ctbl td{padding:8px 6px;border-top:1px solid var(--line)}
.ctbl td:last-child{font-family:var(--f-mono);text-align:right}
.exam{display:flex;flex-direction:column;gap:10px}
.exam .hd{display:flex;align-items:center;gap:12px}
.exam .badge{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 12px/1 var(--f-display);flex:none;text-align:center;padding:2px}
.exam ul{margin:0;padding-left:1.1em;font-size:14px}
.exam li{margin:4px 0}
.book{display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:var(--r)}
.topbar{display:none}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13.5px}
.brow .progress{height:8px}
.brow .num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.en{font-size:.82em;color:var(--ink3);margin-left:.4em;font-weight:500}
.enb{display:block;color:var(--ink2);font-size:.9em;margin-top:3px;font-weight:400}
h2 .enb,h3 .enb{font-size:.72em;font-weight:500}
.h1en{display:block;font:600 .46em/1.3 var(--f-display);color:var(--ink2);letter-spacing:0;margin-top:6px}
.nav button .en{display:block;margin-left:0;font-size:11.5px;line-height:1.2}
.nm-en{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.25}
.tb-en{font-size:9.5px;color:var(--ink3);line-height:1}
.stat .en{display:block;margin-left:0}
.btn .en{font-size:.78em;color:inherit;opacity:.75}
.kp li .enb{font-size:.88em}
.opt .enb{font-size:.9em}
#langSel,#gradeSel{padding:5px 6px;font-size:13px}
.chip.rf{cursor:pointer;padding:7px 11px;font-size:12.5px}
.chip.rf.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a.res{text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
a.res:hover{border-color:var(--accent);transform:translateY(-1px)}
a.res h3{overflow-wrap:anywhere}
.acc-free{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.acc-paid{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.acc-login{color:var(--ink2)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-ink);font-weight:600;font-size:13.5px}
.linkbtn.muted{color:var(--ink3);font-weight:500}
.linkbtn:hover{text-decoration:underline}
.cmc-nudge{display:flex;gap:14px;align-items:flex-start;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));border-radius:var(--r);padding:14px 16px}
.cmc-mark{width:40px;flex:none;color:var(--ink)} .cmc-mark svg{width:100%;height:auto;display:block}
.cmc-body{min-width:0}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink2);font-size:12.5px}
.foot-mark{width:28px;display:inline-block} .foot-mark svg{width:100%;height:auto;display:block}
#cmcModal{position:fixed;inset:0;z-index:60;background:rgba(10,11,12,.5);display:grid;place-items:center;padding:16px}
#cmcModal[hidden]{display:none!important}
.cmc-card{position:relative;background:var(--surface);color:var(--ink);border-radius:14px;max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.cmc-logo{width:220px;color:var(--ink)} .cmc-logo svg{width:100%;height:auto;display:block}
.cmc-x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:26px;line-height:1;color:var(--ink2);padding:4px 8px}
.cmc-grid{display:grid;grid-template-columns:1fr 196px;gap:18px;align-items:start}
.cmc-serv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cmc-serv li{display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:10px}
.cmc-qr{background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line);color:#17191B}
.cmc-qr img{display:block;width:100%;height:auto}
.cmc-qr .muted{color:#5A6064}
.cmc-red{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:560px){.cmc-grid{grid-template-columns:1fr}.cmc-qr{max-width:220px;margin:0 auto;order:-1}.cmc-card{padding:22px 18px}}
.side-cmc{margin-top:10px}
.syl-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:6px}
.syl-ring{display:flex;flex-direction:column;align-items:center;justify-content:center;width:112px;height:112px;border-radius:50%;border:6px solid var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);flex:none}
.syl-ring b{font:800 26px/1 var(--f-display)}
.syl-groups{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sylg{padding:0}
.sylg summary{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;flex-wrap:wrap;list-style:none}
.sylg summary::-webkit-details-marker{display:none}
.sylg summary::before{content:'▸';color:var(--ink3);font-size:12px}
.sylg[open] summary::before{content:'▾'}
.sylg-t{font-weight:700}
.sylg>.sylitems,.sylg>.row{padding:0 18px}
.sylg>.row{padding-bottom:16px}
.sylitems{display:flex;flex-direction:column}
.syli{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.syl-c{min-width:52px;color:var(--accent-ink);padding-top:2px}
.sa{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}
.sa1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.sa2{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.mchip{cursor:pointer}
.mchip:hover{border-color:var(--accent)}
.lvb{font-size:10.5px;padding:3px 6px;vertical-align:1px}
.lv-HL,.lv-A2{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.lv-AS,.lv-SL{color:var(--good)}
.refc{font-size:10.5px;padding:3px 6px;color:var(--accent-ink);vertical-align:1px}
.syl-home{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#homeSyl{max-width:220px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;font:12px var(--f-mono)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar svg{height:28px;width:auto;color:var(--ink)}
  .topbar{margin:-20px calc(-1 * clamp(16px,4vw,44px)) 18px}
  .main{padding-block:20px 100px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink2);padding:4px 0}
  .tabbar button .ic{width:26px;height:26px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font:700 11px/1 var(--f-display)}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on .ic{background:var(--accent);border-color:var(--accent);color:#fff}
  .stats{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .road{grid-template-columns:1fr}
  .road .st{border-right:0;border-bottom:1px solid var(--line)}
  .brow{grid-template-columns:90px 1fr 54px}
}
@media (min-width:901px){.tabbar{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

['gs',2,'What is the pressure of 0.500 mol of gas in a 10.0 L container at 300 K?',['0.123 atm','1.23 atm','12.3 atm','2.46 atm'],1,'P = nRT/V = 0.500 × 0.08206 × 300 ÷ 10.0 = 1.23 atm。'],
['gs',2,'Under identical conditions, how fast does He effuse compared with CH<sub>4</sub>?',['4 times as fast','2 times as fast','Half as fast','Equally fast'],1,'Graham 定律：r(He)/r(CH<sub>4</sub>) = √(16/4) = 2。'],
['gs',2,'Which substance has the highest boiling point?',['CH<sub>4</sub>','C<sub>2</sub>H<sub>6</sub>','CH<sub>3</sub>OH','CH<sub>3</sub>OCH<sub>3</sub>'],2,'CH<sub>3</sub>OH 分子间存在氢键（沸点 65 °C）。二甲醚有偶极但没有 O–H，不能形成分子间氢键（−24 °C）。'],
['gs',3,'Which gas deviates most from ideal behavior at high pressure?',['He','H<sub>2</sub>','N<sub>2</sub>','NH<sub>3</sub>'],3,'NH<sub>3</sub> 为极性分子，且能形成氢键，分子间吸引最强，van der Waals 常数 a 最大，偏离理想行为最明显。'],
['gs',2,'How many atoms are in one face-centred cubic (fcc) unit cell?',['1','2','4','6'],2,'8 个顶点 × 1/8 + 6 个面心 × 1/2 = 1 + 3 = 4。'],
['gs',3,'A metal crystallizes in a body-centred cubic lattice with edge length a. What is the atomic radius r?',['a/2','√2·a/4','√3·a/4','a/4'],2,'bcc 中原子沿体对角线相切：体对角线 √3·a = 4r，所以 r = √3·a/4。'],
['gs',1,'A mixture of 2.0 mol N<sub>2</sub> and 3.0 mol O<sub>2</sub> has total pressure 1.00 atm. What is the partial pressure of O<sub>2</sub>?',['0.40 atm','0.50 atm','0.60 atm','3.0 atm'],2,'x(O<sub>2</sub>) = 3.0/5.0 = 0.60，P(O<sub>2</sub>) = 0.60 × 1.00 atm = 0.60 atm。'],
// ---- SN ----
['sn',2,'What is the freezing point of a 0.100 m aqueous NaCl solution? (K<sub>f</sub> = 1.86 °C·kg/mol)',['−0.186 °C','−0.372 °C','−0.558 °C','+0.372 °C'],1,'NaCl 电离出 2 个离子，i = 2。ΔT<sub>f</sub> = 2 × 1.86 × 0.100 = 0.372 °C，凝固点为 −0.372 °C。'],
['sn',2,'Which 0.10 m aqueous solution has the highest boiling point?',['Glucose','Sucrose','NaCl','CaCl<sub>2</sub>'],3,'依数性只与粒子数有关。CaCl<sub>2</sub> 的 i ≈ 3，粒子浓度最大，沸点升高最多。'],
['sn',1,'50.0 mL of 6.0 M HCl is diluted to 300.0 mL. What is the new concentration?',['0.50 M','1.0 M','2.0 M','36 M'],1,'c<sub>1</sub>V<sub>1</sub> = c<sub>2</sub>V<sub>2</sub>：6.0 × 50.0 = c<sub>2</sub> × 300.0，c<sub>2</sub> = 1.0 M。'],
['sn',3,'What is the osmotic pressure of 0.010 M glucose at 25 °C?',['0.0205 atm','0.245 atm','2.45 atm','24.5 atm'],1,'π = MRT = 0.010 × 0.08206 × 298 = 0.245 atm。葡萄糖不电离，i = 1。'],
['sn',1,'Which solid dissolves best in hexane?',['NaCl','KNO<sub>3</sub>','I<sub>2</sub>','Glucose'],2,'相似相溶：I<sub>2</sub> 为非极性分子，易溶于非极性溶剂己烷。离子化合物和多羟基的葡萄糖更易溶于水。'],
['sn',3,'An ideal solution has x(benzene) = 0.40 and x(toluene) = 0.60. P°(benzene) = 100 torr, P°(toluene) = 30 torr. What is the mole fraction of benzene in the vapor?',['0.40','0.57','0.69','0.77'],2,'P(苯) = 0.40 × 100 = 40 torr；P(甲苯) = 0.60 × 30 = 18 torr；总压 58 torr。y(苯) = 40/58 = 0.69。气相中更易挥发的组分被富集，这是分馏的原理。'],
// ---- TH ----
['th',1,'Which process is endothermic?',['Water freezing','Methane burning','Ice melting','Steam condensing'],2,'熔化需要吸热以克服分子间作用力，ΔH > 0。凝固、冷凝、燃烧均放热。'],
['th',2,'How much heat is needed to warm 50.0 g of water from 20.0 °C to 30.0 °C? (c = 4.184 J g<sup>−1</sup> °C<sup>−1</sup>)',['209 J','2.09 kJ','20.9 kJ','4.18 kJ'],1,'q = mcΔT = 50.0 × 4.184 × 10.0 = 2092 J ≈ 2.09 kJ。'],
['th',2,'C(s) + O<sub>2</sub> → CO<sub>2</sub>, ΔH = −393.5 kJ; CO + ½O<sub>2</sub> → CO<sub>2</sub>, ΔH = −283.0 kJ. What is ΔH for C(s) + ½O<sub>2</sub> → CO?',['−676.5 kJ','−110.5 kJ','+110.5 kJ','−393.5 kJ'],1,'Hess 定律：第一式 − 第二式 = 目标反应。ΔH = −393.5 − (−283.0) = −110.5 kJ。'],
['th',2,'Using bond enthalpies H–H 436, Cl–Cl 243, H–Cl 432 kJ/mol, estimate ΔH for H<sub>2</sub> + Cl<sub>2</sub> → 2HCl.',['−247 kJ','−185 kJ','+185 kJ','−432 kJ'],1,'ΔH = 断键 − 成键 = (436 + 243) − 2 × 432 = −185 kJ。'],
['th',3,'50.0 mL of 1.00 M HCl is mixed with 50.0 mL of 1.00 M NaOH in a coffee-cup calorimeter; the temperature rises by 6.8 °C. Taking 100 g of solution and c = 4.18 J g<sup>−1</sup> °C<sup>−1</sup>, what is ΔH of neutralization?',['−2.84 kJ/mol','−28.4 kJ/mol','−56.8 kJ/mol','+56.8 kJ/mol'],2,'q = 100 × 4.18 × 6.8 = 2842 J；n(H<sub>2</sub>O) = 0.0500 mol。ΔH = −2.842 kJ ÷ 0.0500 mol = −56.8 kJ/mol（放热取负号）。'],
['th',3,'Which compound has the largest lattice energy (magnitude)?',['NaCl','KBr','CaO','MgO'],3,'晶格能 ∝ 离子电荷乘积 / 离子间距。MgO 与 CaO 都是 +2/−2，但 Mg<sup>2+</sup> 半径更小，所以 MgO 最大。'],
['th',2,'Which substance has a standard enthalpy of formation equal to zero?',['O<sub>3</sub>(g)','O<sub>2</sub>(g)','H<sub>2</sub>O(l)','C(diamond)'],1,'稳定单质在标准状态下的 ΔH°<sub>f</sub> = 0。氧的稳定形态是 O<sub>2</sub>(g)，碳的稳定形态是石墨而不是金刚石。'],
// ---- KN ----
['kn',2,'Doubling [A] quadruples the rate; doubling [B] has no effect. What is the rate law?',['rate = k[A][B]','rate = k[A]<sup>2</sup>','rate = k[A]<sup>2</sup>[B]','rate = k[A]'],1,'[A] ×2 → 速率 ×4，所以对 A 是二级；对 B 零级。rate = k[A]<sup>2</sup>。'],
['kn',2,'A first-order reaction has k = 0.0693 min<sup>−1</sup>. What is its half-life?',['0.0693 min','6.93 min','10.0 min','14.4 min'],2,'t<sub>½</sub> = ln2 / k = 0.693 ÷ 0.0693 = 10.0 min。'],
['kn',2,'What are the units of k for a second-order reaction?',['s<sup>−1</sup>','M s<sup>−1</sup>','M<sup>−1</sup> s<sup>−1</sup>','M<sup>−2</sup> s<sup>−1</sup>'],2,'速率单位 M s<sup>−1</sup> = k × M<sup>2</sup>，所以 k 的单位是 M<sup>−1</sup> s<sup>−1</sup>。'],
['kn',3,'A reaction rate doubles when the temperature rises from 300 K to 310 K. What is E<sub>a</sub>?',['5.4 kJ/mol','25 kJ/mol','53.6 kJ/mol','110 kJ/mol'],2,'ln2 = (E<sub>a</sub>/R)(1/300 − 1/310)。1/300 − 1/310 = 1.075×10<sup>−4</sup> K<sup>−1</sup>。E<sub>a</sub> = 0.693 × 8.314 ÷ 1.075×10<sup>−4</sup> ≈ 53.6 kJ/mol。这就是"温度升 10 度速率约翻倍"经验规律的来源。'],
['kn',2,'Adding a catalyst to a reaction',['increases ΔH','lowers E<sub>a</sub> and speeds up both forward and reverse reactions','increases K','shifts the equilibrium toward products'],1,'催化剂提供活化能更低的新路径，同等加快正、逆反应，不改变 ΔH、K 或平衡组成。'],
['kn',3,'Proposed mechanism: (1) NO + Br<sub>2</sub> ⇌ NOBr<sub>2</sub> (fast); (2) NOBr<sub>2</sub> + NO → 2NOBr (slow). What rate law does it predict?',['k[NO][Br<sub>2</sub>]','k[NOBr<sub>2</sub>][NO]','k[NO]<sup>2</sup>[Br<sub>2</sub>]','k[NO]<sup>2</sup>'],2,'决速步：rate = k<sub>2</sub>[NOBr<sub>2</sub>][NO]。中间体用快速预平衡消去：[NOBr<sub>2</sub>] = K<sub>1</sub>[NO][Br<sub>2</sub>]。得 rate = k[NO]<sup>2</sup>[Br<sub>2</sub>]。'],
['kn',2,'For a reaction A → products, a plot of 1/[A] vs. time is a straight line. The reaction is',['zero order','first order','second order','third order'],2,'二级积分速率方程：1/[A] = 1/[A]<sub>0</sub> + kt，1/[A] 对 t 成直线，斜率为 k。'],
// ---- EQ ----
['eq',2,'What is K<sub>c</sub> for N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g)?',['[NH<sub>3</sub>]/([N<sub>2</sub>][H<sub>2</sub>])','[NH<sub>3</sub>]<sup>2</sup>/([N<sub>2</sub>][H<sub>2</sub>]<sup>3</sup>)','[N<sub>2</sub>][H<sub>2</sub>]<sup>3</sup>/[NH<sub>3</sub>]<sup>2</sup>','2[NH<sub>3</sub>]/(3[H<sub>2</sub>])'],1,'K = 产物浓度幂之积 / 反应物浓度幂之积，指数为化学计量数。'],
['eq',2,'For N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub>, compressing the container at constant temperature',['shifts the equilibrium right','shifts it left','has no effect','increases K'],0,'增大压强，平衡移向气体分子数少的一侧（4 → 2），即向右。温度不变，K 不变。'],
['eq',2,'If the reaction quotient Q is less than K, the reaction',['is at equilibrium','proceeds forward','proceeds in reverse','cannot occur'],1,'Q < K 表示产物相对偏少，反应向正方向进行，直到 Q = K。'],
['eq',2,'For A ⇌ B, K = 4. What is K for 2B ⇌ 2A?',['1/16','1/8','8','16'],0,'反写：K → 1/4；系数乘 2：K → (1/4)<sup>2</sup> = 1/16。'],
['eq',3,'H<sub>2</sub> + I<sub>2</sub> ⇌ 2HI, K<sub>c</sub> = 64. Starting with 1.00 M H<sub>2</sub> and 1.00 M I<sub>2</sub>, what is [HI] at equilibrium?',['0.80 M','1.00 M','1.60 M','1.78 M'],2,'(2x)<sup>2</sup>/(1 − x)<sup>2</sup> = 64，开方得 2x/(1 − x) = 8，x = 0.80。[HI] = 2x = 1.60 M。'],
['eq',3,'For N<sub>2</sub>O<sub>4</sub>(g) ⇌ 2NO<sub>2</sub>(g), which relation is correct?',['K<sub>p</sub> = K<sub>c</sub>','K<sub>p</sub> = K<sub>c</sub>(RT)','K<sub>p</sub> = K<sub>c</sub>/(RT)','K<sub>p</sub> = K<sub>c</sub>(RT)<sup>2</sup>'],1,'K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup>，Δn = 2 − 1 = 1。'],
['eq',2,'For an endothermic reaction, raising the temperature',['decreases K','increases K','does not change K','makes K negative'],1,'吸热反应升温，平衡正向移动，K 增大。温度是唯一能改变 K 的因素。'],
// ---- AB ----
['ab',1,'What is the pH of 0.010 M HCl?',['1','2','10','12'],1,'HCl 为强酸，完全电离：[H<sup>+</sup>] = 0.010 M，pH = 2。'],
['ab',2,'What is the pH of 0.10 M acetic acid? (K<sub>a</sub> = 1.8×10<sup>−5</sup>)',['1.00','2.87','4.74','5.74'],1,'[H<sup>+</sup>] ≈ √(K<sub>a</sub>c) = √(1.8×10<sup>−6</sup>) = 1.34×10<sup>−3</sup> M，pH = 2.87。电离度约 1.3%，近似成立。'],
['ab',2,'A buffer contains 0.20 M HA and 0.10 M A<sup>−</sup> (pK<sub>a</sub> = 4.74). What is its pH?',['4.14','4.44','4.74','5.04'],1,'pH = pK<sub>a</sub> + log(0.10/0.20) = 4.74 − 0.30 = 4.44。'],
['ab',2,'What is the conjugate base of H<sub>2</sub>PO<sub>4</sub><sup>−</sup>?',['H<sub>3</sub>PO<sub>4</sub>','HPO<sub>4</sub><sup>2−</sup>','PO<sub>4</sub><sup>3−</sup>','H<sub>2</sub>PO<sub>4</sub>OH'],1,'共轭碱 = 酸失去一个 H<sup>+</sup>：H<sub>2</sub>PO<sub>4</sub><sup>−</sup> → HPO<sub>4</sub><sup>2−</sup>。'],
['ab',2,'Which is the strongest acid in water?',['HF','HCl','HBr','HI'],3,'氢卤酸酸性由 H–X 键强度主导：键越长越弱，越易电离。HI 最强，HF 为弱酸。'],
['ab',3,'The molar solubility of Ag<sub>2</sub>CrO<sub>4</sub> is 6.5×10<sup>−5</sup> M. What is K<sub>sp</sub>?',['4.2×10<sup>−9</sup>','2.7×10<sup>−13</sup>','1.1×10<sup>−12</sup>','8.5×10<sup>−9</sup>'],2,'[Ag<sup>+</sup>] = 2s，[CrO<sub>4</sub><sup>2−</sup>] = s。K<sub>sp</sub> = (2s)<sup>2</sup>s = 4s<sup>3</sup> = 4 × (6.5×10<sup>−5</sup>)<sup>3</sup> = 1.1×10<sup>−12</sup>。'],
['ab',2,'When a weak acid is titrated with a strong base, the pH at the equivalence point is',['less than 7','exactly 7','greater than 7','equal to pK<sub>a</sub>'],2,'当量点时溶液中是弱酸的共轭碱，它水解产生 OH<sup>−</sup>，所以 pH > 7。pH = pK<sub>a</sub> 出现在半当量点。'],
['ab',3,'What is the solubility of AgCl (K<sub>sp</sub> = 1.8×10<sup>−10</sup>) in 0.10 M NaCl?',['1.3×10<sup>−5</sup> M','1.8×10<sup>−9</sup> M','1.8×10<sup>−11</sup> M','1.8×10<sup>−10</sup> M'],1,'同离子效应：s = K<sub>sp</sub>/[Cl<sup>−</sup>] = 1.8×10<sup>−10</sup> ÷ 0.10 = 1.8×10<sup>−9</sup> M，比纯水中（1.3×10<sup>−5</sup> M）小约 7500 倍。'],
['ab',2,'Which species acts as a Lewis acid?',['NH<sub>3</sub>','BF<sub>3</sub>','OH<sup>−</sup>','H<sub>2</sub>O'],1,'Lewis 酸是电子对接受体。BF<sub>3</sub> 中 B 只有 6 个价电子，有空轨道，能接受电子对。'],
// ---- TD ----
['td',2,'What is the sign of ΔS for 2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(l)?',['Positive','Negative','Zero','Cannot be determined'],1,'3 mol 气体变成液体，混乱度大幅降低，ΔS < 0。'],
['td',2,'A reaction has ΔH > 0 and ΔS > 0. It is spontaneous',['at all temperatures','at no temperature','only at high temperature','only at low temperature'],2,'ΔG = ΔH − TΔS。T 足够大时 TΔS 超过 ΔH，ΔG < 0。'],
['td',2,'If K = 1 for a reaction, then ΔG° is',['negative','zero','positive','equal to ΔH°'],1,'ΔG° = −RT lnK，ln1 = 0，所以 ΔG° = 0。'],
['td',3,'For CaCO<sub>3</sub>(s) → CaO(s) + CO<sub>2</sub>(g), ΔH° = +178 kJ and ΔS° = +161 J/K. Above what temperature is it spontaneous?',['1.1 K','298 K','833 °C (1106 K)','1106 °C'],2,'T = ΔH/ΔS = 178 000 J ÷ 161 J/K = 1106 K ≈ 833 °C。注意 kJ 换成 J。'],
['td',3,'At 298 K a reaction has K = 1.0×10<sup>10</sup>. What is ΔG°?',['−24.8 kJ/mol','−57.0 kJ/mol','+57.0 kJ/mol','−5.70 kJ/mol'],1,'ΔG° = −RT lnK = −8.314 × 298 × ln(10<sup>10</sup>) = −8.314 × 298 × 23.03 ≈ −57.0 kJ/mol。'],
['td',1,'Which has the highest standard molar entropy?',['H<sub>2</sub>O(s)','H<sub>2</sub>O(l)','H<sub>2</sub>O(g)','They are equal'],2,'同一物质：气态 > 液态 > 固态。气体分子可占据的微观状态最多。'],
// ---- EC ----
['ec',1,'What is the oxidation number of Mn in KMnO<sub>4</sub>?',['+2','+4','+6','+7'],3,'K 为 +1，O 为 −2：+1 + x + 4(−2) = 0，x = +7。'],
['ec',2,'E°(Zn<sup>2+</sup>/Zn) = −0.76 V and E°(Cu<sup>2+</sup>/Cu) = +0.34 V. What is E°<sub>cell</sub> for the Daniell cell?',['0.42 V','1.10 V','−1.10 V','0.34 V'],1,'Cu<sup>2+</sup> 被还原（阴极），Zn 被氧化（阳极）：E° = 0.34 − (−0.76) = 1.10 V。'],
['ec',2,'In the balanced reaction of MnO<sub>4</sub><sup>−</sup> with Fe<sup>2+</sup> in acid, the mole ratio MnO<sub>4</sub><sup>−</sup> : Fe<sup>2+</sup> is',['1 : 1','1 : 3','1 : 5','2 : 5'],2,'Mn 从 +7 降到 +2，得 5e<sup>−</sup>；Fe 从 +2 升到 +3，失 1e<sup>−</sup>。电子守恒得 1 : 5。完整方程：MnO<sub>4</sub><sup>−</sup> + 5Fe<sup>2+</sup> + 8H<sup>+</sup> → Mn<sup>2+</sup> + 5Fe<sup>3+</sup> + 4H<sub>2</sub>O。'],
['ec',2,'In a galvanic cell,',['oxidation occurs at the cathode','electrons flow from anode to cathode through the wire','anions in the salt bridge move toward the cathode','E°<sub>cell</sub> is negative'],1,'阳极氧化、阴极还原；电子经外电路由阳极流向阴极。盐桥中阴离子移向阳极以平衡电荷。原电池 E° > 0。'],
['ec',3,'What mass of copper is deposited from Cu<sup>2+</sup>(aq) by a current of 2.00 A for 965 s?',['0.318 g','0.636 g','1.27 g','2.54 g'],1,'Q = It = 1930 C；n(e<sup>−</sup>) = 1930 ÷ 96485 = 0.0200 mol；n(Cu) = 0.0100 mol；m = 0.0100 × 63.55 = 0.636 g。'],
['ec',3,'For a cell with n = 2 and E° = 1.10 V, what is ΔG°?',['−106 kJ','−212 kJ','+212 kJ','−2.12 kJ'],1,'ΔG° = −nFE° = −2 × 96485 × 1.10 = −2.12×10<sup>5</sup> J = −212 kJ。'],
['ec',3,'A Daniell cell (E° = 1.10 V) has [Zn<sup>2+</sup>] = 1.0 M and [Cu<sup>2+</sup>] = 0.010 M at 25 °C. What is E?',['1.16 V','1.10 V','1.04 V','0.98 V'],2,'Q = [Zn<sup>2+</sup>]/[Cu<sup>2+</sup>] = 100。E = 1.10 − (0.0592/2) × log100 = 1.10 − 0.059 = 1.04 V。'],
// ---- OG ----
['og',1,'Which functional group is present in CH<sub>3</sub>COOH?',['Alcohol','Aldehyde','Carboxylic acid','Ester'],2,'–COOH 为羧基，CH<sub>3</sub>COOH 是乙酸（ethanoic acid）。'],
['og',2,'How many structural isomers does C<sub>5</sub>H<sub>12</sub> have?',['2','3','4','5'],1,'正戊烷、2-甲基丁烷（异戊烷）、2,2-二甲基丙烷（新戊烷），共 3 种。'],
['og',2,'Which substrate reacts fastest with OH<sup>−</sup> by an S<sub>N</sub>2 mechanism?',['CH<sub>3</sub>Br','CH<sub>3</sub>CH<sub>2</sub>Br','(CH<sub>3</sub>)<sub>2</sub>CHBr','(CH<sub>3</sub>)<sub>3</sub>CBr'],0,'S<sub>N</sub>2 为背面进攻，空间位阻越小越快：甲基 > 1° > 2° ≫ 3°。'],
['og',1,'What is the product of ethene reacting with Br<sub>2</sub>?',['Bromoethane','1,1-Dibromoethane','1,2-Dibromoethane','Ethyne'],2,'亲电加成：两个 Br 分别加到双键两端的碳上，生成 1,2-二溴乙烷。溴水褪色可用于检验不饱和键。'],
['og',2,'Which compound can exist as a pair of enantiomers?',['Propan-2-ol','Butan-2-ol','2-Methylpropan-2-ol','Butan-1-ol'],1,'丁-2-醇的 C2 连有 H、OH、CH<sub>3</sub>、C<sub>2</sub>H<sub>5</sub> 四个不同基团，是手性碳，存在一对对映异构体。'],
['og',2,'What is the major product when HBr adds to propene (no peroxides)?',['1-Bromopropane','2-Bromopropane','1,2-Dibromopropane','Propane'],1,'Markovnikov 规则：H 加到含 H 较多的碳上，经较稳定的仲碳正离子，生成 2-溴丙烷。'],

SYLX.push({syl:'ap', m:'at', ref:'1.2', zh:'元素质谱：每个峰对应一种同位素，横坐标为 m/z，峰的相对高度为同位素丰度，据此加权平均求相对原子质量。', en:'Mass spectrum of an element: each peak is one isotope at its m/z, relative peak height gives isotopic abundance, and the weighted average gives the average atomic mass.'});
SYLX.push({syl:'ap', m:'st', ref:'1.4', zh:'混合物组成可变：由元素分析或质量测定求某组分的质量分数（纯度），纯净物的元素质量比则固定（定组成定律）。', en:'Mixtures have variable composition: elemental analysis or mass data give the mass percent (purity) of a component, whereas a pure compound has a fixed mass ratio of elements (law of definite proportions).'});
SYLX.push({syl:'ap', m:'at', ref:'1.5', zh:'库仑定律：F ∝ q<sub>1</sub>q<sub>2</sub>/r<sup>2</sup>；有效核电荷越大、电子离核越近，电子受吸引越强，电离能越大；内层电子起屏蔽作用。', en:'Coulomb\'s law, F ∝ q<sub>1</sub>q<sub>2</sub>/r<sup>2</sup>: greater effective nuclear charge and smaller distance mean stronger attraction and higher ionization energy; core electrons shield valence electrons.'});
SYLX.push({syl:'ap', m:'at', ref:'1.6', zh:'光电子能谱（PES）：每个峰对应一个亚层，峰位（结合能）越大电子越靠内层，峰的相对高度正比于该亚层电子数。', en:'Photoelectron spectroscopy (PES): each peak is one subshell; higher binding energy means an inner (core) subshell, and relative peak height is proportional to the number of electrons in that subshell.'});
SYLX.push({syl:'ap', m:'at', ref:'1.8', zh:'主族元素通过得失价电子达到稀有气体构型：第 1、2 族分别形成 +1、+2 价离子，Al 为 +3，第 15、16、17 族分别为 −3、−2、−1。', en:'Main-group elements gain or lose valence electrons to reach a noble-gas configuration: groups 1 and 2 form +1 and +2 ions, Al forms +3, and groups 15, 16, 17 form −3, −2, −1 ions.'});
SYLX.push({syl:'ap', m:'bd', ref:'2.2', zh:'势能–核间距曲线：最低点对应键长，井深对应键能；键级越高，键越短越强；离子电荷越大、半径越小，库仑作用越强。', en:'Potential energy vs. internuclear distance: the minimum gives the bond length and the well depth the bond energy; higher bond order means shorter, stronger bonds; larger ionic charges and smaller radii mean stronger Coulombic attraction.'});
SYLX.push({syl:'ap', m:'gs', ref:'2.3', zh:'离子固体：阴阳离子交替排列的晶格，熔点高、硬而脆；固态不导电，熔融或溶于水后离子可移动而导电。', en:'Ionic solids: lattices of alternating cations and anions; high melting points, hard and brittle; non-conducting as solids but conducting when molten or dissolved, because ions become mobile.'});
SYLX.push({syl:'ap', m:'gs', ref:'2.4', zh:'金属键为"电子海"模型，故金属导电导热、有延展性；置换型合金由半径相近的原子替换（如黄铜 Cu–Zn），间隙型合金由小原子填入空隙（如钢中的 C），使合金更硬、延展性下降。', en:'Metallic bonding is a sea of delocalized electrons, giving conductivity, malleability and ductility; substitutional alloys replace atoms of similar radius (e.g. brass, Cu–Zn), interstitial alloys fit small atoms into holes (e.g. C in steel), making the metal harder and less ductile.'});
SYLX.push({syl:'ap', m:'bd', ref:'2.6', zh:'共振：当可写出多个合理 Lewis 结构时，真实结构是其杂化体，电子离域使键长平均化，如 NO<sub>3</sub><sup>−</sup> 中三个 N–O 键等长，键级均为 4/3。', en:'Resonance: when several valid Lewis structures exist, the real structure is their hybrid with delocalized electrons and averaged bond lengths, e.g. all three N–O bonds in NO<sub>3</sub><sup>−</sup> are equal with bond order 4/3.'});
SYLX.push({syl:'ap', m:'gs', ref:'3.1', zh:'色散力随电子数增多、电子云越易极化而增强（大分子的色散力可超过小分子的氢键）；离子与极性分子之间存在离子–偶极作用（如离子的水合）。', en:'Dispersion forces grow with the number of electrons and polarizability (in large molecules they can outweigh hydrogen bonding in small ones); ion–dipole forces act between ions and polar molecules, e.g. hydration of ions.'});
SYLX.push({syl:'ap', m:'gs', ref:'3.2', zh:'四类固体：离子晶体（高熔点、脆）、分子晶体（低熔点、不导电）、共价网络晶体（如金刚石、SiO<sub>2</sub>，极高熔点、极硬）、金属晶体（导电、有延展性）。', en:'Four solid types: ionic (high melting point, brittle), molecular (low melting point, non-conducting), covalent network (e.g. diamond, SiO<sub>2</sub>; very high melting point, very hard), and metallic (conducting, malleable).'});
SYLX.push({syl:'ap', m:'gs', ref:'3.3', zh:'蒸气压随温度升高而增大、随分子间力增强而减小；液体的蒸气压等于外压时沸腾。', en:'Vapor pressure increases with temperature and decreases with stronger intermolecular forces; a liquid boils when its vapor pressure equals the external pressure.'});
SYLX.push({syl:'ap', m:'gs', ref:'3.5', zh:'分子动理论：气体分子的平均动能正比于热力学温度；同温下摩尔质量越小，平均速率越大；升温使 Maxwell–Boltzmann 分布变宽并移向高速。', en:'Kinetic molecular theory: average kinetic energy is proportional to absolute temperature; at the same temperature lighter molecules move faster on average; raising T broadens the Maxwell–Boltzmann distribution and shifts it to higher speeds.'});
SYLX.push({syl:'ap', m:'lb', ref:'3.9', zh:'色谱：组分按与固定相、流动相作用力的差异分离；R<sub>f</sub> = 组分移动距离 / 溶剂前沿移动距离，在极性固定相上极性越强的组分 R<sub>f</sub> 越小；蒸馏则按沸点（分子间力）差异分离。', en:'Chromatography separates components by their different attractions to the stationary and mobile phases; R<sub>f</sub> = distance travelled by component / distance travelled by solvent front, and on a polar stationary phase more polar components have smaller R<sub>f</sub>; distillation separates by differences in boiling point (IMF strength).'});
SYLX.push({syl:'ap', m:'lb', ref:'3.11', zh:'电磁波与分子运动的对应：微波引起分子转动跃迁，红外引起分子振动跃迁，紫外–可见光引起电子能级跃迁。', en:'Regions of the electromagnetic spectrum and molecular motion: microwaves cause rotational transitions, infrared causes vibrational transitions, and UV–visible light causes electronic transitions.'});
SYLX.push({syl:'ap', m:'st', ref:'4.2', zh:'净离子方程式：强电解质写成离子，固体（沉淀）、气体、纯液体与弱电解质写成化学式，旁观离子不写，并同时满足原子守恒与电荷守恒。', en:'Net ionic equations: write strong electrolytes as ions, write solids (precipitates), gases, pure liquids and weak electrolytes as formulas, omit spectator ions, and balance both atoms and charge.'});
SYLX.push({syl:'ap', m:'st', ref:'4.4', zh:'物理变化不生成新物质（如相变），化学变化有旧键断裂、新键形成；离子化合物溶解涉及离子键断裂与离子–偶极作用形成，两类变化的界限并不总是清晰。', en:'Physical changes form no new substances (e.g. phase changes) while chemical changes break and form chemical bonds; dissolving an ionic solid breaks ionic interactions and forms ion–dipole ones, so the distinction is not always clear-cut.'});
SYLX.push({syl:'ap', m:'lb', ref:'4.6', zh:'滴定：用已知浓度的滴定剂与待测物按化学计量反应，达到当量点时两者物质的量符合化学计量比，由消耗体积求待测物浓度；终点由指示剂颜色变化判断。', en:'Titration: a titrant of known concentration reacts stoichiometrically with the analyte; at the equivalence point the moles are in the stoichiometric ratio, so the titrant volume gives the analyte amount; the end point is signaled by an indicator color change.'});
SYLX.push({syl:'ap', m:'st', ref:'4.7', zh:'三大反应类型：酸碱反应（质子转移）、氧化还原反应（电子转移，包括燃烧）、沉淀反应（生成难溶物）。', en:'Three main reaction types: acid–base (proton transfer), redox (electron transfer, including combustion), and precipitation (formation of an insoluble solid).'});
SYLX.push({syl:'ap', m:'ab', ref:'4.8', zh:'Brønsted–Lowry：酸给出 H<sup>+</sup>、碱接受 H<sup>+</sup>；共轭酸碱对相差一个 H<sup>+</sup>；水是两性物质，既可作酸也可作碱。', en:'Brønsted–Lowry: acids donate H<sup>+</sup> and bases accept H<sup>+</sup>; a conjugate acid–base pair differs by one H<sup>+</sup>; water is amphoteric and can act as either.'});
SYLX.push({syl:'ap', m:'kn', ref:'5.1', zh:'对 aA → 产物，速率 = −(1/a)Δ[A]/Δt；反应速率受浓度、温度、表面积与催化剂影响。', en:'For aA → products, rate = −(1/a)Δ[A]/Δt; rates depend on concentration, temperature, surface area and catalysts.'});
SYLX.push({syl:'ap', m:'kn', ref:'5.4', zh:'基元反应的速率方程可直接由分子数写出：单分子 rate = k[A]，双分子 rate = k[A][B]；三分子基元反应极少见。', en:'For an elementary reaction the rate law follows directly from molecularity: unimolecular rate = k[A], bimolecular rate = k[A][B]; termolecular steps are rare.'});
SYLX.push({syl:'ap', m:'kn', ref:'5.5', zh:'碰撞理论：只有能量 ≥ E<sub>a</sub> 且取向合适的碰撞才有效；升温使高能分子比例增大，速率显著增加。', en:'Collision model: only collisions with energy ≥ E<sub>a</sub> and proper orientation are effective; raising temperature increases the fraction of molecules above E<sub>a</sub>, so rate rises sharply.'});
SYLX.push({syl:'ap', m:'kn', ref:'5.6', zh:'反应能量曲线：过渡态位于能量最高点，E<sub>a</sub> 为反应物到过渡态的能量差；Arrhenius 方程 k = Ae<sup>−E<sub>a</sub>/RT</sup>，ln k 对 1/T 作图斜率为 −E<sub>a</sub>/R。', en:'Reaction energy profile: the transition state is the energy maximum and E<sub>a</sub> is the energy from reactants to it; Arrhenius equation k = Ae<sup>−E<sub>a</sub>/RT</sup>, and a plot of ln k vs 1/T has slope −E<sub>a</sub>/R.'});
SYLX.push({syl:'ap', m:'kn', ref:'5.10', zh:'多步反应能量曲线：每一步有各自的过渡态，中间体位于两峰之间的能量低谷；活化能最高的步骤为决速步。', en:'Multistep energy profile: each step has its own transition state, intermediates sit in energy wells between peaks, and the step with the highest activation barrier is rate-determining.'});
SYLX.push({syl:'ap', m:'th', ref:'6.3', zh:'热量由高温物体传向低温物体直至温度相等（热平衡）；孤立体系中 q<sub>放</sub> = −q<sub>吸</sub>。', en:'Heat flows from the hotter to the colder object until temperatures are equal (thermal equilibrium); in an isolated system q<sub>lost</sub> = −q<sub>gained</sub>.'});
SYLX.push({syl:'ap', m:'th', ref:'6.5', zh:'相变过程中温度不变，吸收或放出的热 q = nΔH<sub>fus</sub> 或 nΔH<sub>vap</sub>；熔化、汽化吸热，凝固、凝结放热。', en:'Temperature stays constant during a phase change and q = nΔH<sub>fus</sub> or nΔH<sub>vap</sub>; melting and vaporization are endothermic, freezing and condensation exothermic.'});
SYLX.push({syl:'ap', m:'eq', ref:'7.1', zh:'动态平衡：正反应速率 = 逆反应速率，各物质浓度保持不变（但一般不相等），宏观性质不再变化。', en:'Dynamic equilibrium: forward rate equals reverse rate, so concentrations stay constant (though generally not equal) and macroscopic properties no longer change.'});
SYLX.push({syl:'ap', m:'eq', ref:'7.5', zh:'K ≫ 1 时平衡时产物占优，K ≪ 1 时反应物占优；K 很小时可用"变化量 x 可忽略"近似简化计算。', en:'K ≫ 1 means products are favored at equilibrium and K ≪ 1 means reactants are favored; when K is very small, the small-x approximation simplifies calculations.'});
SYLX.push({syl:'ap', m:'ab', ref:'8.2', zh:'常见强酸：HCl、HBr、HI、HNO<sub>3</sub>、HClO<sub>4</sub>、H<sub>2</sub>SO<sub>4</sub>（第一步）；强碱：第 1 族氢氧化物及 Ca、Sr、Ba 的氢氧化物；25 °C 时 pH + pOH = 14。', en:'Common strong acids: HCl, HBr, HI, HNO<sub>3</sub>, HClO<sub>4</sub>, H<sub>2</sub>SO<sub>4</sub> (first proton); strong bases: group 1 hydroxides and Ca, Sr, Ba hydroxides; at 25 °C pH + pOH = 14.'});
SYLX.push({syl:'ap', m:'ab', ref:'8.3', zh:'弱酸电离度 = [H<sup>+</sup>]<sub>平衡</sub>/c<sub>0</sub> × 100%，溶液越稀电离度越大；弱碱用 K<sub>b</sub> 同理计算 [OH<sup>−</sup>]。', en:'Percent ionization of a weak acid = [H<sup>+</sup>]<sub>eq</sub>/c<sub>0</sub> × 100% and increases on dilution; for weak bases use K<sub>b</sub> analogously to find [OH<sup>−</sup>].'});
SYLX.push({syl:'ap', m:'ab', ref:'8.6', zh:'酸性与结构：H–A 键越弱、A 电负性越大、共轭碱越稳定（如共振离域的羧酸根），酸性越强；含氧酸中心原子相连的 O 越多酸性越强，如 HClO<sub>4</sub> > HClO<sub>3</sub> > HClO<sub>2</sub> > HClO。', en:'Acid strength and structure: weaker H–A bonds, more electronegative A, and more stable conjugate bases (e.g. resonance-delocalized carboxylates) give stronger acids; oxoacids with more O atoms on the central atom are stronger, e.g. HClO<sub>4</sub> > HClO<sub>3</sub> > HClO<sub>2</sub> > HClO.'});
SYLX.push({syl:'ap', m:'ab', ref:'8.7', zh:'pH < pK<sub>a</sub> 时以酸式 HA 为主，pH > pK<sub>a</sub> 时以共轭碱 A<sup>−</sup> 为主，pH = pK<sub>a</sub> 时两者相等。', en:'When pH < pK<sub>a</sub> the protonated form HA predominates, when pH > pK<sub>a</sub> the conjugate base A<sup>−</sup> predominates, and at pH = pK<sub>a</sub> they are equal.'});
SYLX.push({syl:'ap', m:'ab', ref:'8.10', zh:'缓冲容量：共轭酸碱对浓度越大，能抵抗的酸碱量越多；[HA] ≈ [A<sup>−</sup>] 时缓冲效果最好，有效缓冲范围约为 pK<sub>a</sub> ± 1。', en:'Buffer capacity: higher concentrations of the conjugate pair neutralize more added acid or base; buffering is best when [HA] ≈ [A<sup>−</sup>], with an effective range of about pK<sub>a</sub> ± 1.'});
SYLX.push({syl:'ap', m:'ab', ref:'8.11', zh:'阴离子为弱酸共轭碱的难溶盐（如 CaCO<sub>3</sub>、CaF<sub>2</sub>、Mg(OH)<sub>2</sub>）在酸性溶液中溶解度增大；阴离子为强酸共轭碱的盐（如 AgCl）溶解度基本不受 pH 影响。', en:'Sparingly soluble salts whose anion is the conjugate base of a weak acid (e.g. CaCO<sub>3</sub>, CaF<sub>2</sub>, Mg(OH)<sub>2</sub>) become more soluble as pH decreases; salts of strong-acid anions (e.g. AgCl) are essentially unaffected by pH.'});
SYLX.push({syl:'ap', m:'td', ref:'9.2', zh:'ΔS° = ΣS°(产物) − ΣS°(反应物)；单质的标准摩尔熵不为 0；同一物质 S(g) > S(l) > S(s)。', en:'ΔS° = ΣS°(products) − ΣS°(reactants); standard molar entropies of elements are not zero; for one substance S(g) > S(l) > S(s).'});
SYLX.push({syl:'ap', m:'td', ref:'9.4', zh:'热力学控制与动力学控制：ΔG° < 0 的反应若 E<sub>a</sub> 很高，速率可慢到观察不到反应（如金刚石转化为石墨、常温下 H<sub>2</sub> 与 O<sub>2</sub> 混合）。', en:'Thermodynamic vs. kinetic control: a reaction with ΔG° < 0 but a large E<sub>a</sub> may be too slow to observe (e.g. diamond → graphite, or H<sub>2</sub> and O<sub>2</sub> mixed at room temperature).'});
SYLX.push({syl:'ap', m:'td', ref:'9.6', zh:'溶解的自由能 ΔG<sub>溶</sub> = ΔH<sub>溶</sub> − TΔS<sub>溶</sub>，ΔH<sub>溶</sub> 取决于破坏溶质、溶剂间作用与形成溶质–溶剂作用的能量平衡；吸热溶解（如 NH<sub>4</sub>NO<sub>3</sub>）可因熵增而自发。', en:'Free energy of dissolution ΔG<sub>soln</sub> = ΔH<sub>soln</sub> − TΔS<sub>soln</sub>, where ΔH<sub>soln</sub> balances breaking solute and solvent interactions against forming solute–solvent ones; endothermic dissolution (e.g. NH<sub>4</sub>NO<sub>3</sub>) can be favorable because of the entropy increase.'});
SYLX.push({syl:'ap', m:'td', ref:'9.7', zh:'耦合反应：将 ΔG° > 0 的反应与 ΔG° 更负的反应相加（总 ΔG° 为两者之和且 < 0），即可驱动不利反应，如生物体内利用 ATP 水解；也可借外加电能或光能驱动。', en:'Coupled reactions: adding a ΔG° > 0 reaction to one with a more negative ΔG° gives an overall ΔG° (the sum) below zero, driving the unfavorable process, e.g. ATP hydrolysis in cells; external electrical or light energy can also drive it.'});
SYLX.push({syl:'ap', m:'ec', ref:'9.8', zh:'原电池 ΔG < 0 对外做功，电解池 ΔG > 0 需外加电源；盐桥中阴离子移向阳极、阳离子移向阴极，以保持两极溶液电中性。', en:'Galvanic cells have ΔG < 0 and do work, electrolytic cells have ΔG > 0 and need an external power source; in the salt bridge anions migrate toward the anode and cations toward the cathode to keep both solutions electrically neutral.'});
SYLX.push({syl:'ap', m:'ec', ref:'9.10', zh:'Q 增大时电动势减小，达平衡时 E = 0；浓差电池两极相同、E° = 0，25 °C 时 E = (0.0592/n)log(c<sub>浓</sub>/c<sub>稀</sub>)。', en:'Cell potential falls as Q increases and E = 0 at equilibrium; a concentration cell has identical electrodes with E° = 0 and, at 25 °C, E = (0.0592/n)log(c<sub>concentrated</sub>/c<sub>dilute</sub>).'});

SYLX.push({syl:'usnco', m:'gs', ref:'3.3', zh:'相图：三线交于三相点，气液线止于临界点；多数物质固–液线斜率为正，水的为负（冰密度小于水，加压熔点降低）。', en:'Phase diagrams: the three boundaries meet at the triple point and the liquid–gas line ends at the critical point; the solid–liquid line slopes positively for most substances but negatively for water (ice is less dense, so pressure lowers its melting point).'});
SYLX.push({syl:'usnco', m:'gs', ref:'3.2', zh:'Clausius–Clapeyron 方程：ln(P<sub>2</sub>/P<sub>1</sub>) = −(ΔH<sub>vap</sub>/R)(1/T<sub>2</sub> − 1/T<sub>1</sub>)，用于由两点蒸气压求汽化焓或沸点。', en:'Clausius–Clapeyron equation: ln(P<sub>2</sub>/P<sub>1</sub>) = −(ΔH<sub>vap</sub>/R)(1/T<sub>2</sub> − 1/T<sub>1</sub>), used to find ΔH<sub>vap</sub> or boiling points from two vapor pressures.'});
SYLX.push({syl:'usnco', m:'in', ref:'2.2', zh:'常见水溶液颜色：Cu<sup>2+</sup> 蓝、Ni<sup>2+</sup> 绿、Fe<sup>3+</sup> 黄棕、MnO<sub>4</sub><sup>−</sup> 紫、Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup> 橙、CrO<sub>4</sub><sup>2−</sup> 黄；Na<sup>+</sup>、K<sup>+</sup>、Zn<sup>2+</sup> 等为无色。', en:'Common aqueous colors: Cu<sup>2+</sup> blue, Ni<sup>2+</sup> green, Fe<sup>3+</sup> yellow-brown, MnO<sub>4</sub><sup>−</sup> purple, Cr<sub>2</sub>O<sub>7</sub><sup>2−</sup> orange, CrO<sub>4</sub><sup>2−</sup> yellow; Na<sup>+</sup>, K<sup>+</sup>, Zn<sup>2+</sup> are colorless.'});
SYLX.push({syl:'usnco', m:'in', ref:'2.1', zh:'碱金属与水反应生成 MOH 和 H<sub>2</sub>，自上而下反应越剧烈；活泼金属与稀酸反应放出 H<sub>2</sub>，碳酸盐与酸反应放出 CO<sub>2</sub>。', en:'Alkali metals react with water to give MOH and H<sub>2</sub>, more vigorously down the group; active metals release H<sub>2</sub> from dilute acids, and carbonates release CO<sub>2</sub> with acids.'});
SYLX.push({syl:'usnco', m:'ec', ref:'7.3', zh:'有 H<sup>+</sup> 参与的半反应电势随 pH 变化：由 Nernst 方程，pH 每升高 1，E 约降低 0.0592 × (m/n) V（m 为 H<sup>+</sup> 系数，n 为电子数）。', en:'Half-reactions involving H<sup>+</sup> have pH-dependent potentials: by the Nernst equation, E drops by about 0.0592 × (m/n) V per pH unit (m = H<sup>+</sup> coefficient, n = electrons).'});
SYLX.push({syl:'usnco', m:'og', ref:'10.2', zh:'环烷烃构象：环丙烷键角 60°、环张力大；环己烷椅式构象键角约 109.5°，几乎无张力，大取代基优先处于平伏键。', en:'Cycloalkane conformations: cyclopropane has 60° bond angles and high ring strain; chair cyclohexane has ~109.5° angles and is nearly strain-free, with bulky substituents preferring equatorial positions.'});

note_en:'The IB Chemistry guide (first assessment 2025) is organized into two strands, Structure and Reactivity, with 21 sub-topics; each has SL understandings plus Additional Higher Level (AHL, HL only) content, and Reactivity 1.4 (entropy and spontaneity) is entirely AHL. Ksp, colligative properties, the Nernst equation and molecular orbital theory are not in the syllabus. Tools 1–3 and Inquiry 1–3 run through the whole course.',
groups:[
 {code:'S1', en:'Structure 1. Models of the particulate nature of matter', zh:'结构 1 物质粒子性模型', items:[

  {c:'S1.2', en:'The nuclear atom', zh:'核式原子', m:['at'], hl:false, u_en:'Describe the atom as a dense positive nucleus of protons and neutrons with electrons outside, and define isotopes by differing neutron numbers.', u_zh:'描述原子由质子和中子构成的致密带正电原子核及核外电子组成，并以中子数不同定义同位素。'},

  {c:'S1.3 AHL', en:'Electron configurations (AHL)', zh:'电子排布（HL 附加）', m:['at'], hl:true, u_en:'Relate the convergence limit of an emission spectrum to ionization energy, and deduce electron configuration from successive ionization energy data.', u_zh:'将发射光谱高频端的会聚极限与电离能联系起来，并由逐级电离能数据推断电子排布。'},

  {c:'S1.5', en:'Ideal gases', zh:'理想气体', m:['gs'], hl:false, u_en:'State ideal-gas assumptions, explain deviations of real gases at low temperature and high pressure, and apply molar volume, PV = nRT and the combined gas law.', u_zh:'理解理想气体模型的假设，解释真实气体在低温高压下的偏离，并应用摩尔体积、PV = nRT 及联合气体定律。'}
 ]},
 {code:'S2', en:'Structure 2. Models of bonding and structure', zh:'结构 2 成键与结构模型', items:[
  {c:'S2.1', en:'The ionic model', zh:'离子模型', m:['bd'], hl:false, u_en:'Explain cation and anion formation, the ionic bond as electrostatic attraction, naming of binary ionic compounds, and ionic lattices represented by empirical formulas.', u_zh:'解释阳离子与阴离子的形成、离子键的静电吸引本质、二元离子化合物的命名，以及以实验式表示的三维离子晶格。'},
  {c:'S2.2', en:'The covalent model', zh:'共价模型', m:['bd','gs'], hl:false, u_en:'Cover covalent, multiple and coordination bonds, VSEPR shapes, bond and molecular polarity, carbon and silicon network structures, intermolecular forces (London < dipole–dipole < hydrogen bonding) and chromatography.', u_zh:'涵盖共价键、多重键与配位键，VSEPR 分子形状，键与分子的极性，碳与硅的共价网状结构，分子间作用力（色散力 < 偶极-偶极 < 氢键）以及色谱法。'},
  {c:'S2.2 AHL', en:'The covalent model (AHL)', zh:'共价模型（HL 附加）', m:['bd'], hl:true, u_en:'Cover resonance (including benzene), expanded octets, formal charge for choosing Lewis formulas, sigma and pi bond formation, and hybridization.', u_zh:'涵盖共振结构（含苯）、扩展八隅体、用形式电荷选择最优 Lewis 结构、σ 键与 π 键的形成以及杂化理论。'},
  {c:'S2.3', en:'The metallic model', zh:'金属模型', m:['bd'], hl:false, u_en:'Describe the metallic bond as attraction between a lattice of cations and delocalized electrons, with strength depending on ionic charge and radius.', u_zh:'将金属键描述为阳离子晶格与离域电子之间的静电吸引，其强度取决于离子电荷与离子半径。'},
  {c:'S2.3 AHL', en:'The metallic model (AHL)', zh:'金属模型（HL 附加）', m:['bd','in'], hl:true, u_en:'Explain properties of transition elements in terms of delocalized d-electrons.', u_zh:'用离域 d 电子解释过渡元素的金属性质。'},
  {c:'S2.4', en:'From models to materials', zh:'从模型到材料', m:['bd','og'], hl:false, u_en:'Place compounds on the bonding triangle as a continuum of ionic, covalent and metallic bonding, and explain alloys, polymers and addition polymerization.', u_zh:'用键型三角图把化合物看作离子键、共价键、金属键的连续体来定位，并解释合金、高分子与加聚反应。'},
  {c:'S2.4 AHL', en:'From models to materials (AHL)', zh:'从模型到材料（HL 附加）', m:['og'], hl:true, u_en:'Explain condensation polymers formed from functional groups with loss of a small molecule.', u_zh:'解释单体官能团间反应并脱去小分子形成的缩聚物。'}
 ]},
 {code:'S3', en:'Structure 3. Classification of matter', zh:'结构 3 物质的分类', items:[
  {c:'S3.1', en:'The periodic table: Classification of elements', zh:'周期表：元素的分类', m:['at','in'], hl:false, u_en:'Use periods, groups and blocks, periodic trends, group 1 and group 17 trends, the metal–non-metal continuum of oxides (basic–amphoteric–acidic) and oxidation states.', u_zh:'运用周期、族、区的结构，理解周期性变化规律、第 1 族与第 17 族的递变、金属到非金属氧化物（碱性—两性—酸性）的连续变化以及氧化态。'},
  {c:'S3.1 AHL', en:'The periodic table: Classification of elements (AHL)', zh:'周期表：元素的分类（HL 附加）', m:['at','in'], hl:true, u_en:'Explain discontinuities in first ionization energy across a period, and the incomplete d-sublevels, variable oxidation states and coloured complexes of transition elements (d-orbital splitting; the observed colour is complementary to the colour absorbed).', u_zh:'解释同周期第一电离能的不连续，以及过渡元素不充满的 d 亚层、可变氧化态和配合物显色（d 轨道分裂，所见颜色为吸收色的互补色）。'},
  {c:'S3.2', en:'Functional groups: Classification of organic compounds', zh:'官能团：有机化合物的分类', m:['og'], hl:false, u_en:'Represent organic compounds with different formula types, classify by functional group and homologous series, explain physical property trends, apply IUPAC nomenclature and identify structural isomers.', u_zh:'用多种结构式表示有机物，按官能团与同系物分类，解释物理性质的递变，运用 IUPAC 命名，并识别结构异构体。'},
  {c:'S3.2 AHL', en:'Functional groups: Classification of organic compounds (AHL)', zh:'官能团：有机化合物的分类（HL 附加）', m:['og','lb'], hl:true, u_en:'Identify stereoisomers and deduce structures by combining MS fragmentation, IR and <sup>1</sup>H NMR (including splitting) data.', u_zh:'识别立体异构体，并综合 MS 碎片、IR 与 <sup>1</sup>H NMR（含裂分）数据推断结构。'}
 ]},

 ]},
 {code:'R2', en:'Reactivity 2. How much, how fast and how far?', zh:'反应性 2 多少、多快、多远', items:[

SYLX.push({syl:'caie', m:'in', ref:'10.1', zh:'第 2 族：与水反应活性自上而下增强；Mg 与冷水反应很慢，在水蒸气中燃烧生成 MgO 和 H<sub>2</sub>；氢氧化物溶解度增大、硫酸盐溶解度减小（BaSO<sub>4</sub> 用于检验 SO<sub>4</sub><sup>2−</sup>）。', en:'Group 2: reactivity with water increases down the group; Mg reacts very slowly with cold water but burns in steam to give MgO + H<sub>2</sub>; hydroxide solubility increases and sulfate solubility decreases down the group (BaSO<sub>4</sub> is the test for SO<sub>4</sub><sup>2−</sup>).'});
SYLX.push({syl:'caie', m:'in', ref:'27.1', zh:'第 2 族碳酸盐、硝酸盐的热稳定性自上而下增强：阳离子半径增大、电荷密度降低，对阴离子电子云的极化减弱。', en:'The thermal stability of Group 2 carbonates and nitrates increases down the group because larger cations have lower charge density and polarise the anion electron cloud less.'});

SYLX.push({syl:'caie', m:'in', ref:'28.4', zh:'顺铂 cis-[Pt(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub>] 为平面四方，与 DNA 碱基配位而抗癌；含三个双齿配体的八面体配合物（如 [Ni(en)<sub>3</sub>]<sup>2+</sup>）有对映异构。', en:'Cisplatin, cis-[Pt(NH<sub>3</sub>)<sub>2</sub>Cl<sub>2</sub>], is square planar and acts as an anticancer drug by binding to DNA; octahedral complexes with three bidentate ligands, such as [Ni(en)<sub>3</sub>]<sup>2+</sup>, show optical isomerism.'});

SYLX.push({syl:'caie', m:'og', ref:'30.1', zh:'苯的离域 π 体系使其发生亲电取代而非加成；硝化：浓 HNO<sub>3</sub> + 浓 H<sub>2</sub>SO<sub>4</sub>、≤ 55 °C，亲电试剂 NO<sub>2</sub><sup>+</sup>；卤代需 AlCl<sub>3</sub> 或 FeBr<sub>3</sub> 催化；Friedel–Crafts 烷基化/酰基化用 AlCl<sub>3</sub>。', en:'Benzene\'s delocalised π system favours electrophilic substitution over addition; nitration uses conc HNO<sub>3</sub>/conc H<sub>2</sub>SO<sub>4</sub> at ≤ 55 °C (electrophile NO<sub>2</sub><sup>+</sup>); halogenation needs AlCl<sub>3</sub> or FeBr<sub>3</sub>; Friedel–Crafts alkylation/acylation uses AlCl<sub>3</sub>.'});
SYLX.push({syl:'caie', m:'og', ref:'30.1', zh:'定位效应：–CH<sub>3</sub>、–OH、–NH<sub>2</sub> 为 2,4-定位（活化苯环），–NO<sub>2</sub> 为 3-定位；甲苯侧链被热碱性 KMnO<sub>4</sub> 氧化后酸化得苯甲酸。', en:'Directing effects: –CH<sub>3</sub>, –OH and –NH<sub>2</sub> are 2,4-directing (activating), –NO<sub>2</sub> is 3-directing; the side chain of methylbenzene is oxidised by hot alkaline KMnO<sub>4</sub>, then acidified, to benzoic acid.'});
SYLX.push({syl:'caie', m:'og', ref:'31.1', zh:'氯苯难以发生亲核取代：Cl 的 p 孤对电子与苯环 π 体系重叠，C–Cl 键增强；水解难易：酰氯 > 卤代烷 > 卤代芳烃。', en:'Chlorobenzene resists nucleophilic substitution because a Cl p lone pair overlaps with the ring π system, strengthening C–Cl; ease of hydrolysis: acyl chloride > halogenoalkane > halogenoarene.'});
SYLX.push({syl:'caie', m:'og', ref:'32.2', zh:'苯酚酸性：比水和醇强（酚氧负离子电荷离域到环上），比羧酸弱，不与 Na<sub>2</sub>CO<sub>3</sub> 放出 CO<sub>2</sub>；与溴水在室温下生成白色 2,4,6-三溴苯酚沉淀。', en:'Phenol is more acidic than water and alcohols (phenoxide charge delocalised into the ring) but less than carboxylic acids, so gives no CO<sub>2</sub> with Na<sub>2</sub>CO<sub>3</sub>; with bromine water at room temperature it gives a white precipitate of 2,4,6-tribromophenol.'});
SYLX.push({syl:'caie', m:'og', ref:'33.1', zh:'羧酸酸性：吸电子取代基（如 Cl）稳定羧酸根，CH<sub>3</sub>COOH < ClCH<sub>2</sub>COOH < Cl<sub>2</sub>CHCOOH < Cl<sub>3</sub>CCOOH；甲酸和乙二酸可被酸性 KMnO<sub>4</sub> 氧化为 CO<sub>2</sub>。', en:'Electron-withdrawing groups such as Cl stabilise the carboxylate, so acidity increases CH<sub>3</sub>COOH < ClCH<sub>2</sub>COOH < Cl<sub>2</sub>CHCOOH < Cl<sub>3</sub>CCOOH; methanoic and ethanedioic acids are oxidised to CO<sub>2</sub> by acidified KMnO<sub>4</sub>.'});
SYLX.push({syl:'caie', m:'og', ref:'33.3', zh:'酰氯：室温下与水剧烈反应放出白雾 HCl 生成羧酸，与醇生成酯，与氨/胺生成酰胺，与苯酚生成酚酯（苯酚难以直接与羧酸酯化）。', en:'Acyl chlorides react vigorously at room temperature with water (steamy HCl fumes, carboxylic acid), alcohols (esters), ammonia/amines (amides) and phenol (phenyl esters, which phenol cannot form directly with carboxylic acids).'});
SYLX.push({syl:'caie', m:'og', ref:'34.1', zh:'碱性：乙胺 > NH<sub>3</sub> > 苯胺——烷基供电子使 N 孤对更易接受 H<sup>+</sup>，苯胺中 N 的孤对电子离域进苯环。', en:'Basicity: ethylamine > NH<sub>3</sub> > phenylamine, because alkyl groups donate electron density to the N lone pair, whereas in phenylamine the lone pair is delocalised into the ring.'});
SYLX.push({syl:'caie', m:'og', ref:'34.2', zh:'苯胺：硝基苯用 Sn/浓 HCl 加热还原后加 NaOH 得到；与 HNO<sub>2</sub>（NaNO<sub>2</sub> + HCl）在 < 10 °C 重氮化，重氮盐在碱性条件下与苯酚偶联生成有色偶氮染料（–N=N–）。', en:'Phenylamine is made by reducing nitrobenzene with Sn/conc HCl under reflux, then NaOH; with HNO<sub>2</sub> (NaNO<sub>2</sub> + HCl) below 10 °C it forms a diazonium salt, which couples with alkaline phenol to give a coloured azo dye (–N=N–).'});
SYLX.push({syl:'caie', m:'og', ref:'34.3', zh:'酰胺几乎无碱性：N 的孤对电子离域到 C=O 上；酰胺可在酸或碱中加热水解，LiAlH<sub>4</sub> 将其还原为胺。', en:'Amides are almost neutral because the N lone pair is delocalised onto C=O; they are hydrolysed by heating with acid or alkali and reduced to amines by LiAlH<sub>4</sub>.'});
SYLX.push({syl:'caie', m:'og', ref:'34.4', zh:'氨基酸以两性离子存在，熔点高、易溶于水；电泳中在给定 pH 下按电荷与大小分离，处于等电点的氨基酸不移动。', en:'Amino acids exist as zwitterions (high melting points, water-soluble); electrophoresis at a given pH separates them by charge and size, and an amino acid at its isoelectric point does not move.'});
SYLX.push({syl:'caie', m:'og', ref:'35.1', zh:'缩聚：二醇 + 二元羧酸（或二酰氯）→ 聚酯（如 PET），二胺 + 二元羧酸（或二酰氯）→ 聚酰胺（如尼龙-6,6），同时脱去 H<sub>2</sub>O 或 HCl；蛋白质是天然聚酰胺。', en:'Condensation polymerisation: diol + dicarboxylic acid (or dioyl chloride) → polyester such as PET; diamine + dicarboxylic acid (or dioyl chloride) → polyamide such as nylon-6,6, eliminating H<sub>2</sub>O or HCl; proteins are natural polyamides.'});
SYLX.push({syl:'caie', m:'og', ref:'35.3', zh:'聚酯、聚酰胺的酯键/酰胺键可水解，因而可生物降解；聚烯烃难降解，部分聚合物可设计为光降解。', en:'Polyesters and polyamides are biodegradable because their ester/amide links can be hydrolysed, whereas poly(alkenes) are not; some polymers are designed to be photodegradable.'});

SYLX.push({syl:'caie', m:'lb', ref:'22.2', zh:'由 [M+1]<sup>+</sup> 峰估算碳原子数：n = 100 × I(M+1) / (1.1 × I(M))。', en:'Estimate the number of carbon atoms from the [M+1]<sup>+</sup> peak: n = 100 × I(M+1)/(1.1 × I(M)).'});
SYLX.push({syl:'caie', m:'lb', ref:'37.1', zh:'TLC：R<sub>f</sub> = 斑点移动距离 / 溶剂前沿移动距离；按对固定相（硅胶/氧化铝）的吸附与在流动相中的溶解度分离；无色斑点用紫外灯或茚三酮/碘显色。', en:'TLC: R<sub>f</sub> = distance moved by spot / distance moved by solvent front; separation depends on adsorption to the stationary phase (silica/alumina) and solubility in the mobile phase; colourless spots are located with UV light or ninhydrin/iodine.'});
SYLX.push({syl:'caie', m:'lb', ref:'37.2', zh:'气液色谱：流动相为惰性载气，固定相为涂在载体上的高沸点液体；按保留时间定性，峰面积之比给出各组分的百分组成。', en:'Gas/liquid chromatography: the mobile phase is an inert carrier gas and the stationary phase a high-boiling liquid on a solid support; retention time identifies components and relative peak areas give percentage composition.'});
SYLX.push({syl:'caie', m:'lb', ref:'37.3', zh:'<sup>13</sup>C NMR：峰数 = 不同化学环境的碳原子种类数；按化学位移判断碳类型（C=O 约 160–220 ppm）；考试谱图无裂分。', en:'<sup>13</sup>C NMR: the number of peaks equals the number of carbon environments, chemical shift identifies the carbon type (C=O about 160–220 ppm), and exam spectra show no splitting.'});
SYLX.push({syl:'caie', m:'lb', ref:'37.4', zh:'<sup>1</sup>H NMR：以 TMS 为 δ = 0 参比（12 个等价 H、单峰、惰性、易挥发）；溶剂用 CDCl<sub>3</sub> 等氘代试剂；加 D<sub>2</sub>O 振荡后 O–H、N–H 峰消失。', en:'<sup>1</sup>H NMR: TMS is the δ = 0 reference (12 equivalent H, single peak, inert, volatile); deuterated solvents such as CDCl<sub>3</sub> are used; shaking with D<sub>2</sub>O removes O–H and N–H peaks.'});

SYLX.push({syl:'aqa', m:'in', ref:'3.2.6', zh:'金属水合离子的酸性：[M(H<sub>2</sub>O)<sub>6</sub>]<sup>3+</sup> 电荷密度大、极化水分子更强，酸性强于 [M(H<sub>2</sub>O)<sub>6</sub>]<sup>2+</sup>；故 M<sup>3+</sup> 与 Na<sub>2</sub>CO<sub>3</sub> 生成 M(OH)<sub>3</sub> 与 CO<sub>2</sub>，M<sup>2+</sup> 生成 MCO<sub>3</sub>。', en:'[M(H<sub>2</sub>O)<sub>6</sub>]<sup>3+</sup> ions are more acidic than [M(H<sub>2</sub>O)<sub>6</sub>]<sup>2+</sup> because their higher charge density polarises water more, so M<sup>3+</sup> with Na<sub>2</sub>CO<sub>3</sub> gives M(OH)<sub>3</sub> + CO<sub>2</sub> while M<sup>2+</sup> gives MCO<sub>3</sub>.'});
SYLX.push({syl:'aqa', m:'in', ref:'3.2.6', zh:'两性氢氧化物：Al(OH)<sub>3</sub> 溶于过量 NaOH 生成 [Al(OH)<sub>4</sub>]<sup>−</sup>；Cu(OH)<sub>2</sub> 不是两性的，它溶于过量浓氨水是配体取代，生成深蓝色 [Cu(NH<sub>3</sub>)<sub>4</sub>(H<sub>2</sub>O)<sub>2</sub>]<sup>2+</sup>。', en:'Al(OH)<sub>3</sub> is amphoteric and dissolves in excess NaOH to give [Al(OH)<sub>4</sub>]<sup>−</sup>; Cu(OH)<sub>2</sub> is not amphoteric: it dissolves in excess concentrated NH<sub>3</sub> by ligand substitution, giving deep-blue [Cu(NH<sub>3</sub>)<sub>4</sub>(H<sub>2</sub>O)<sub>2</sub>]<sup>2+</sup>.'});
SYLX.push({syl:'aqa', m:'og', ref:'3.3.13.4', zh:'DNA：由磷酸、脱氧核糖和碱基构成的核苷酸聚合而成，双螺旋两链间 A–T、C–G 碱基对以氢键配对。', en:'DNA is a polymer of nucleotides (phosphate, 2-deoxyribose and a base); the two strands of the double helix are held by hydrogen bonds between base pairs A–T and C–G.'});
SYLX.push({syl:'aqa', m:'kn', ref:'3.1.9.1', zh:'阿伦尼乌斯方程 k = Ae<sup>−E<sub>a</sub>/RT</sup>：以 ln k 对 1/T 作图，斜率 = −E<sub>a</sub>/R。', en:'Arrhenius equation k = Ae<sup>−E<sub>a</sub>/RT</sup>: plotting ln k against 1/T gives a gradient of −E<sub>a</sub>/R.'});
SYLX.push({syl:'ocr', m:'ec', ref:'5.2.3', zh:'燃料电池：氢氧燃料电池在碱性电解质中负极 H<sub>2</sub> + 2OH<sup>−</sup> → 2H<sub>2</sub>O + 2e<sup>−</sup>，正极 O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>−</sup> → 4OH<sup>−</sup>；只要持续供给燃料即可持续供电。', en:'In an alkaline hydrogen fuel cell the negative electrode reaction is H<sub>2</sub> + 2OH<sup>−</sup> → 2H<sub>2</sub>O + 2e<sup>−</sup> and the positive is O<sub>2</sub> + 2H<sub>2</sub>O + 4e<sup>−</sup> → 4OH<sup>−</sup>; it supplies electricity continuously while fuel is supplied.'});
SYLX.push({syl:'ocr', m:'ec', ref:'5.2.3', zh:'碘–硫代硫酸钠滴定：I<sub>2</sub> + 2S<sub>2</sub>O<sub>3</sub><sup>2−</sup> → 2I<sup>−</sup> + S<sub>4</sub>O<sub>6</sub><sup>2−</sup>，接近终点加淀粉，蓝黑色消失为终点；常用于测定 Cu<sup>2+</sup> 或氧化剂含量。', en:'Iodine–thiosulfate titration: I<sub>2</sub> + 2S<sub>2</sub>O<sub>3</sub><sup>2−</sup> → 2I<sup>−</sup> + S<sub>4</sub>O<sub>6</sub><sup>2−</sup>; starch is added near the end point and the blue-black colour disappears; used to find Cu<sup>2+</sup> or an oxidising agent.'});
SYLX.push({syl:'ocr', m:'og', ref:'6.2.4', zh:'碳–碳键形成：卤代烷 + CN<sup>−</sup> 或醛酮 + HCN 使碳链延长；苯环上用卤代烷/酰氯在 AlCl<sub>3</sub> 催化下 Friedel–Crafts 烷基化或酰基化。', en:'C–C bond formation: halogenoalkane + CN<sup>−</sup> or carbonyl + HCN extends the chain; on benzene, Friedel–Crafts alkylation or acylation uses a haloalkane or acyl chloride with an AlCl<sub>3</sub> catalyst.'});

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const view = $('#view');
const QS = QRAW.map((r,i)=>({id:'q'+i, t:r[0], l:r[1], q:r[2], o:r[3], a:r[4], e:r[5], ee:QEN[i]}));
const TMAP = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const KEYS = 'ABCD';

/* ---------- state (per-viewer, browser only) ---------- */
const SKEY = 'cmc-chempath-v1';
let S = {grade:'G10', lang:'bi', syl:'ap', sa:{}, ans:{}, star:{}, mocks:[], days:[]};
try { const raw = localStorage.getItem(SKEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
if (!S.lang) S.lang='bi'; if (!S.syl) S.syl='ap'; if (!S.sa) S.sa={};
function save(){ try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch(e){} }

/* ---------- i18n ---------- */
// inline: 中文 + small English ; block: 中文 then English line below
function same(a,b){ return !b || String(a).trim()===String(b).trim(); }
function t(zh, en){ if(S.lang==='zh'||(S.lang==='bi'&&same(zh,en))) return zh; if(S.lang==='en') return en; return `${zh}<span class="en">${en}</span>`; }
function tb(zh, en){ if(S.lang==='zh'||(S.lang==='bi'&&same(zh,en))) return zh; if(S.lang==='en') return en; return `${zh}<span class="enb">${en}</span>`; }
function tp(zh, en){ if(S.lang==='zh'||(S.lang==='bi'&&same(zh,en))) return zh; if(S.lang==='en') return en; return zh+' / '+en; } // plain text (options, toasts)
const LV = {1:['L1 基础','L1 Basic'],2:['L2 标准','L2 Standard'],3:['L3 竞赛','L3 Olympiad']};
const lv = l => tp(LV[l][0], LV[l][1]);
const LVTAG = {1:['IGCSE','G8–G9'],2:['AP','IB','A-Level'],3:['USNCO','UKChO','C3L6']};
const TE = id => TOPICS_EN[id] || {};
const tname = tp_ => t(tp_.zh, tp_.en);
const tnameP = tp_ => tp(tp_.zh, tp_.en);

function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function record(q, choice){
  const ok = choice===q.a;
  const r = S.ans[q.id] || {c:0,w:0};
  ok ? r.c++ : r.w++; r.last = ok; r.ts = Date.now();
  S.ans[q.id] = r;
  const d = today(); if (!S.days.includes(d)) S.days.push(d);
  save(); return ok;
}
function streak(){
  const set = new Set(S.days); let n=0; const d=new Date();
  if (!set.has(today())) d.setDate(d.getDate()-1);
  while(true){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(set.has(k)){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function topicStats(tid){
  const qs = QS.filter(q=>q.t===tid); let done=0, ok=0;
  qs.forEach(q=>{ const r=S.ans[q.id]; if(r){done++; if(r.last) ok++;} });
  return {total:qs.length, done, ok, pct: done? Math.round(ok/done*100):null, cover: Math.round(done/qs.length*100)};
}
function wrongList(){ return QS.filter(q=>S.ans[q.id] && S.ans[q.id].last===false); }
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeChem(s){ return esc(s).replace(/&lt;(\/?)(sub|sup|b|i)&gt;/g,'<$1$2>'); }
function plain(s){ const d=document.createElement('div'); d.innerHTML=s; return d.textContent; }

function sylStats(sid){
  const sy=SYLM[sid]; let n=0,m=0,l=0;
  sy.groups.forEach(g=>g.items.forEach(it=>{ n++; const v=S.sa[sKey(sid,g,it)]||0; if(v===2) m++; else if(v===1) l++; }));
  return {n,m,l,pct:n?Math.round(m/n*100):0};
}
function nextItem(sid){ const sy=SYLM[sid]; for(const g of sy.groups) for(const it of g.items) if((S.sa[sKey(sid,g,it)]||0)<2) return {g,it}; return null; }
function modAcc(ids){ let d=0,o=0; ids.forEach(id=>{ const st=topicStats(id); d+=st.done; o+=st.ok; }); return d?Math.round(o/d*100):null; }
function sylName(sid){ const sy=SYLM[sid]; return sy.short||sy.name; }

let P = null;
function buildPractice(arg){
  const f = {t:'all', l:'all', m:'seq'};
  if (arg) arg.split('|').forEach(p=>{ const [k,v]=p.split(':'); if(k==='t') f.t=v; if(k==='l') f.l=v; if(k==='m') f.m=v; if(k==='g'){ f.g=v; } if(k==='ts'){ f.ts=v.split(','); } });
  let list = QS.filter(q=>(f.t==='all'||q.t===f.t)&&(f.l==='all'||q.l==+f.l)&&(!f.ts||f.ts.includes(q.t)));
  if (f.g){ const r=ROADMAP.find(x=>x.g===f.g); list = list.filter(q=>r.topics.includes(q.t)); if(f.g==='G8'||f.g==='G9') list=list.filter(q=>q.l<=2); }
  if (f.m==='new') list = list.filter(q=>!S.ans[q.id]);
  if (f.m==='wrong') list = list.filter(q=>S.ans[q.id]&&S.ans[q.id].last===false);
  if (f.m==='star') list = list.filter(q=>S.star[q.id]);
  if (f.m==='rand') list = shuffle(list);
  P = {list, i:0, chosen:null, f};
}
function qCard(q, opts){
  const {chosen, reveal, idx, total} = opts;
  const x = TMAP[q.t];
  const expl = q.ee ? tb(q.e, q.ee) : q.e;
  return `<div class="qwrap">
    <div class="qmeta"><span class="chip">${idx!=null?`${idx+1} / ${total}`:tp('AI 新题','AI question')}</span><span class="chip">${x.sym} · ${tnameP(x)}</span><span class="chip l${q.l}">${lv(q.l)}</span>${LVTAG[q.l].map(y=>`<span class="chip">${y}</span>`).join('')}
      ${q.id?`<button class="chip" id="starBtn" style="cursor:pointer">${S.star[q.id]?(S.lang==='bi'?'★ 已收藏 Saved':tp('★ 已收藏','★ Saved')):(S.lang==='bi'?'☆ 收藏 Save':tp('☆ 收藏','☆ Save'))}</button>`:''}</div>
    <p class="qstem">${q.q}</p>
    <div class="opts">${q.o.map((o,i)=>{
      let c=''; if(reveal){ if(i===q.a) c='ok'; else if(i===chosen) c='no'; } else if(i===chosen) c='sel';
      return `<button class="opt ${c}" data-opt="${i}" ${reveal?'disabled':''}><span class="k">${KEYS[i]}</span><span>${o}</span></button>`;}).join('')}</div>
    ${reveal?`<div class="expl"><div class="v ${chosen===q.a?'ok':'no'}">${chosen===q.a?t('回答正确','Correct'):t('正确答案是 '+KEYS[q.a],'The answer is '+KEYS[q.a])}</div><div>${expl}</div>
      <div class="row" style="margin-top:10px"><button class="btn ai-only" id="aiExplain">${t('AI 老师深入讲解','AI tutor: explain more')}</button><button class="btn ai-only" id="aiMore">${t('AI 再出一道同类题','AI: similar question')}</button></div>
      <div class="ai-out" id="aiOut" hidden></div></div>`:''}
  </div>`;
}
function vPractice(){
  if (!P || routeArg!==P._arg){ buildPractice(routeArg); P._arg = routeArg; }
  const f=P.f;
  const filters = `<div class="filters">
    <select id="fT" aria-label="Topic"><option value="all">${tp('全部模块','All topics')}</option>${TOPICS.map(x=>`<option value="${x.id}" ${f.t===x.id?'selected':''}>${x.n}. ${tnameP(x)}</option>`).join('')}</select>
    <select id="fL" aria-label="Level"><option value="all">${tp('全部难度','All levels')}</option>${[1,2,3].map(l=>`<option value="${l}" ${f.l==l?'selected':''}>${lv(l)}</option>`).join('')}</select>
    <select id="fM" aria-label="Mode">${[['seq','顺序练习','In order'],['rand','随机打乱','Shuffled'],['new','只做新题','New only'],['wrong','只做错题','Mistakes only'],['star','我的收藏','Saved']].map(([k,z,e])=>`<option value="${k}" ${f.m===k?'selected':''}>${tp(z,e)}</option>`).join('')}</select>
  </div>`;
  const hd = head('Practice','题库刷题','Question Bank',`${QS.length} 道原创题，按 USNCO / AP / UKChO 风格编写。选择后立即判分并给出解析。`,`${QS.length} original questions in USNCO / AP / UKChO style. Each answer is marked instantly with an explanation.`) + filters;

      <button class="btn dark" id="nextQ">${P.i===P.list.length-1?tp('完成本组','Finish set'):tp('下一题','Next')+' →'}</button>

function bindPractice(){
  const setF = ()=>{ routeArg=`t:${$('#fT').value}|l:${$('#fL').value}|m:${$('#fM').value}`; render(); };
  ['#fT','#fL','#fM'].forEach(s=>{ const el=$(s); el && el.addEventListener('change', setF); });
  if (!P.list.length) return;
  const q = P.list[P.i];
  view.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{
    if (P.chosen!=null) return; P.chosen=+b.dataset.opt; record(q,P.chosen); render();
  }));
  $('#prevQ') && $('#prevQ').addEventListener('click',()=>{ P.i--; P.chosen=null; render(); });

    if (P.i<P.list.length-1){ P.i++; P.chosen=null; render(); }
    else { const n=P.list.filter(x=>S.ans[x.id]&&S.ans[x.id].last).length; toast(tp(`本组完成：${n} / ${P.list.length} 正确`,`Set complete: ${n} / ${P.list.length} correct`)); P.i=0; P.chosen=null; go('home'); }
  });
  bindStar(q); bindAI(q, P.chosen);
}
function bindStar(q){ const b=$('#starBtn'); if(!b) return; b.addEventListener('click',()=>{ if(S.star[q.id]) delete S.star[q.id]; else S.star[q.id]=1; save(); b.textContent=S.star[q.id]?(S.lang==='bi'?'★ 已收藏 Saved':tp('★ 已收藏','★ Saved')):(S.lang==='bi'?'☆ 收藏 Save':tp('☆ 收藏','☆ Save')); }); }
function aiLangRule(){ return S.lang==='en' ? 'Answer in English.' : S.lang==='zh' ? '用中文回答（关键术语保留英文）。' : '先用中文讲解，再给出对应的英文讲解（中英双语，两段）。'; }
function bindAI(q, chosen){
  const ex=$('#aiExplain'), more=$('#aiMore'), out=$('#aiOut'); if(!ex||!AI) return;
  const qtext = `Question: ${plain(q.q)}\nOptions: ${q.o.map((o,i)=>KEYS[i]+'. '+plain(o)).join('  ')}\nCorrect answer: ${KEYS[q.a]}\nStudent chose: ${chosen!=null?KEYS[chosen]:'none'}\nReference explanation: ${plain(q.ee||q.e)}`;
  ex.addEventListener('click', async ()=>{
    out.hidden=false; out.textContent=tp('AI 老师正在思考…','The AI tutor is thinking…'); ex.disabled=true;
    try{
      await AI(`You are a patient chemistry olympiad coach. The student is in ${S.grade} at an international school. Explain the question below: first point out the likely misconception, then give step-by-step reasoning, then one tip for similar problems. Max about 200 words per language, plain text, no Markdown. ${aiLangRule()}\n\n${qtext}`,
        {onText:({text})=>{ out.textContent=text; }});
    }catch(e){ out.textContent = e && e.code==='not_granted' ? tp('需要你同意使用 AI 功能后才能讲解。','Please allow the AI feature to use it.') : tp('AI 暂时不可用，请稍后再试。','AI is unavailable right now. Please try again later.'); }
    ex.disabled=false;
  });
  more.addEventListener('click', async ()=>{
    out.hidden=false; out.textContent=tp('正在出一道同类新题…','Writing a similar question…'); more.disabled=true;
    try{
      const r = await AI.json(`You write chemistry competition questions. Based on the topic and difficulty (${LV[q.l][1]}) of the reference question, write ONE new original 4-option multiple-choice question. Stem and options in English. Provide the explanation in both Chinese ("e") and English ("ee"). For sub/superscripts use only <sub></sub> and <sup></sup>, no other HTML. Make sure the answer is correct and all numbers are self-consistent. Output only JSON: {"q":"stem","o":["A","B","C","D"],"a":index 0-3,"e":"中文解析","ee":"English explanation"}\n\nReference:\n${qtext}`, {modelTier:'default'});
      if(!r||!Array.isArray(r.o)||r.o.length!==4||!(r.a>=0&&r.a<4)) throw new Error('bad');
      const nq = {id:null, t:q.t, l:q.l, q:safeChem(r.q), o:r.o.map(safeChem), a:r.a|0, e:safeChem(r.e||r.ee||''), ee:safeChem(r.ee||r.e||'')};
      showAIQ(nq, out);
    }catch(e){ out.textContent = e && e.code==='not_granted' ? tp('需要你同意使用 AI 功能后才能出题。','Please allow the AI feature to use it.') : tp('这次没能生成新题，请再试一次。','Could not generate a question this time. Please try again.'); }
    more.disabled=false;
  });
}
function showAIQ(nq, out){
  out.hidden=false; out.style.whiteSpace='normal';
  const draw=(ch)=>{ out.innerHTML = qCard(nq,{chosen:ch, reveal:ch!=null}) + `<p class="muted small" style="margin:8px 0 0">${tb('AI 生成题目，仅供拓展练习，不计入进度。','AI-generated for extra practice; not counted in your progress.')}</p>`;
    out.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>draw(+b.dataset.opt)));
    out.querySelectorAll('#aiExplain,#aiMore,#aiOut').forEach(x=>x.remove()); };
  draw(null);
}

let M = null, TIMER = null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function startMock(pid){
  const p = PAPERS.find(x=>x.id===pid); let pool = shuffle(QS.filter(p.pick));
  const by = {}; pool.forEach(q=>(by[q.t]=by[q.t]||[]).push(q));
  const out=[]; let k=0; const keys=shuffle(Object.keys(by));
  while(out.length<p.n && out.length<pool.length){ const tk=keys[k%keys.length]; if(by[tk].length) out.push(by[tk].shift()); k++; if(k>2000) break; }
  if (p.order) out.sort((a,b)=>TMAP[a.t].n-TMAP[b.t].n);
  M = {p, qs:out, ans:Array(out.length).fill(null), i:0, end:Date.now()+p.min*60000, done:false};
  go('mock');
}

function pos(z){

  for (const part of parts){
