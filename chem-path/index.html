    const c = parseGroup(body); for (const k in c){ comp[k]=(comp[k]||0)+c[k]*mult; }
  }
  for (const k in comp){ if(!ELBY[k]) throw new Error(tp('未知元素 ','Unknown element ')+k); total += ELBY[k].m*comp[k]; }
  if (!Object.keys(comp).length) throw new Error(tp('请输入化学式','Enter a formula'));
  return {total, comp};
}
function parseGroup(s){
  let i=0;
  function num(){ let n=''; while(i<s.length && /\d/.test(s[i])) n+=s[i++]; return n? +n : 1; }
  function group(){
    const c={};
    while(i<s.length){
      const ch=s[i];
      if(ch==='('||ch==='['){ i++; const g=group(); if(s[i]!==')'&&s[i]!==']') throw new Error(tp('括号不匹配','Unmatched bracket')); i++; const n=num(); for(const k in g) c[k]=(c[k]||0)+g[k]*n; }
      else if(ch===')'||ch===']') return c;
      else if(/[A-Z]/.test(ch)){ let sym=ch; i++; if(i<s.length && /[a-z]/.test(s[i])) sym+=s[i++]; const n=num(); c[sym]=(c[sym]||0)+n; }
      else throw new Error(tp('无法识别字符 ','Unrecognised character ')+'"'+ch+'"');
    }
    return c;
  }
  const r=group(); if(i<s.length) throw new Error(tp('括号不匹配','Unmatched bracket')); return r;
}

      cells.push(e?`<button class="el c-${cat(e.z)} ${e.z===selEl?'on':''}" data-el="${e.z}" title="${e.zh} ${e.name}"><span>${e.z}</span><b>${e.sym}</b><span>${e.m<200?e.m.toFixed(2):Math.round(e.m)}</span></button>`:`<div class="el gap"></div>`); } }
  const e = ELS[selEl-1]; const [pr,pc]=pos(e.z); const cn=CATN[cat(e.z)];
  const C = [['阿伏伽德罗常数','Avogadro constant','N<sub>A</sub>','6.022×10<sup>23</sup> mol<sup>−1</sup>'],['气体常数','Gas constant','R','8.314 J mol<sup>−1</sup> K<sup>−1</sup>'],['气体常数','Gas constant','R','0.08206 L atm mol<sup>−1</sup> K<sup>−1</sup>'],['法拉第常数','Faraday constant','F','96 485 C mol<sup>−1</sup>'],['普朗克常数','Planck constant','h','6.626×10<sup>−34</sup> J s'],['光速','Speed of light','c','2.998×10<sup>8</sup> m s<sup>−1</sup>'],['水的离子积（25 °C）','Ionic product of water (25 °C)','K<sub>w</sub>','1.0×10<sup>−14</sup>'],['标准大气压','Standard atmosphere','1 atm','101.325 kPa = 760 torr'],['水的比热容','Specific heat of water','c','4.184 J g<sup>−1</sup> °C<sup>−1</sup>'],['Nernst 系数（25 °C）','Nernst factor (25 °C)','2.303RT/F','0.0592 V']];
  return `${head('Toolkit','化学工具','Chemistry Toolkit','交互式周期表、摩尔质量计算器与常用常数，做题时随手查。','An interactive periodic table, a molar mass calculator and common constants for quick reference.')}
  <div class="sec card">
    <div class="elinfo" style="margin-bottom:14px"><div class="elbig"><span class="mono small">${e.z}</span><b>${e.sym}</b><span class="mono small" style="text-align:center">${e.m}</span></div>
      <div><h2>${S.lang==='en'?e.name:e.zh+' · '+e.name}</h2><div class="muted small">${S.lang==='en'?`Atomic number ${e.z} · Relative atomic mass ${e.m} · ${cn[1]}${pr<=7?` · Period ${pr}, Group ${pc}`:''}`:`原子序数 ${e.z} · 相对原子质量 ${e.m} · ${cn[0]}${S.lang==='bi'?' '+cn[1]:''}${pr<=7?` · 第 ${pr} 周期 第 ${pc} 族`:''}`}</div>
      <button class="btn" style="margin-top:8px" data-addel="${e.sym}">${t('加入计算器','Add to calculator')}</button></div></div>
    <div class="ptwrap"><div class="pt">${cells.join('')}</div></div>
  </div>
  <div class="sec g2">
    <div class="card"><h3>${t('摩尔质量计算器','Molar mass calculator')}</h3><p class="muted small" style="margin:4px 0 10px">${tb('支持括号与结晶水，例如','Supports brackets and hydrates, e.g.')} Ca(OH)2 · CuSO4·5H2O · K4[Fe(CN)6]</p>
      <input class="inp mono" id="mmIn" value="${esc(mmVal)}" style="width:100%" aria-label="formula">
      <div id="mmOut" style="margin-top:12px"></div></div>
    <div class="card"><h3 style="margin-bottom:4px">${t('常用常数','Constants')}</h3><table class="ctbl">
      ${C.map(c=>`<tr><td>${t(c[0],c[1])} ${c[2]}</td><td>${c[3]}</td></tr>`).join('')}</table></div>
  </div>`;
}
function bindTools(){
  const calc=()=>{
    const out=$('#mmOut');
    try{ const r=molar($('#mmIn').value);
      out.innerHTML = `<div style="font:700 26px var(--f-display)">${r.total.toFixed(2)} <span class="small muted">g/mol</span></div>
      <table class="ctbl" style="margin-top:6px">${Object.entries(r.comp).map(([k,n])=>`<tr><td>${S.lang==='en'?ELBY[k].name:ELBY[k].zh} ${k} × ${n}</td><td>${(ELBY[k].m*n).toFixed(2)} · ${(ELBY[k].m*n/r.total*100).toFixed(1)}%</td></tr>`).join('')}</table>`;
    }catch(e){ out.innerHTML=`<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`; }
  };
  view.querySelectorAll('[data-el]').forEach(b=>b.addEventListener('click',()=>{ selEl=+b.dataset.el; render(); }));
  $('#mmIn').addEventListener('input',()=>{ mmVal=$('#mmIn').value; calc(); }); calc();
  const add=$('[data-addel]'); add && add.addEventListener('click',()=>{ $('#mmIn').value += add.dataset.addel; mmVal=$('#mmIn').value; calc(); $('#mmIn').focus(); });
}

function vMore(){
  return `${head('Menu','全部功能','All features')}<div class="sec g2">${NAV.map(([k,ic,zh,en])=>`<button class="card row" data-go="${k}" style="text-align:left;gap:14px;flex-wrap:nowrap"><span class="elbig" style="width:52px;height:52px;padding:4px;justify-content:center"><b style="font-size:20px">${ic}</b></span><span><h3>${t(zh,en)}</h3></span></button>`).join('')}</div>`;
}

/* ---------- render ---------- */
function render(){
  renderNav();
  const navKey = route==='topic'?'learn':route;
  const tabKey = TABS.includes(navKey)?navKey:'more';
  document.querySelectorAll('#nav [data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===navKey));
  document.querySelectorAll('#tabbar [data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===tabKey));
  const V = {syllabus:vSyllabus,more:vMore,home:vHome,path:vPath,learn:vLearn,topic:vTopic,practice:vPractice,mock:vMock,review:vReview,exams:vExams,tools:vTools,books:vBooks}[route] || vHome;
  view.innerHTML = V() + footer();
  if (route==='practice') bindPractice();
  if (route==='mock') bindMock();
  if (route==='review') bindReview();
  if (route==='tools') bindTools();
  if (route==='books') bindBooks();
  if (route==='syllabus') bindSyllabus();
  if (route==='topic') bindTopicSyl();
  const hs2=$('#homeSyl'); hs2 && hs2.addEventListener('change',e=>{ S.syl=e.target.value; save(); render(); });
  view.querySelectorAll('.road .st').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter') el.click(); }));
}
const hs = (location.hash||'').slice(1); if (NAV.some(n=>n[0]===hs)) route=hs;
render();
})();

</script>

</body>
</html>
