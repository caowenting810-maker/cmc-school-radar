<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丘奖课题定位引擎</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F4EFE7;
  --ink:#23252C; --muted:#6B6E78; --faint:#9A9CA6;
  --border:#E8E1D6; --border2:#D6CDBF;
  --accent:#C96200; --accent-ink:#A85200; --accent-soft:#FDEFE0; --accent-bar:#F97E1C;
  --good:#2E7D4F; --good-soft:#E4F1E9; --warn:#8F7500; --warn-soft:#F5F0D6; --crit:#B3403A; --crit-soft:#F8E7E5;
  --shadow:0 1px 2px rgba(35,37,44,.06),0 4px 14px rgba(35,37,44,.05);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16151A; --surface:#1F1E25; --surface2:#26252E;
    --ink:#ECEAF2; --muted:#A5A2B0; --faint:#7C7987;
    --border:#33323C; --border2:#44424E;
    --accent:#F97E1C; --accent-ink:#FFA85C; --accent-soft:#3A2712; --accent-bar:#F97E1C;
    --good:#6FBF8F; --good-soft:#20301F; --warn:#D8C05A; --warn-soft:#333016; --crit:#E08079; --crit-soft:#3A2220;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#16151A; --surface:#1F1E25; --surface2:#26252E;
  --ink:#ECEAF2; --muted:#A5A2B0; --faint:#7C7987;
  --border:#33323C; --border2:#44424E;
  --accent:#F97E1C; --accent-ink:#FFA85C; --accent-soft:#3A2712; --accent-bar:#F97E1C;
  --good:#6FBF8F; --good-soft:#20301F; --warn:#D8C05A; --warn-soft:#333016; --crit:#E08079; --crit-soft:#3A2220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.65;margin:0}
.mono{font-family:'IBM Plex Mono','SF Mono',Consolas,monospace}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:40px;width:auto;flex:none}
.brandtxt{display:flex;flex-direction:column;gap:1px}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.05em}
.brand h1{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.2}
.brand .en{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 8px;border:1px solid var(--border2);border-radius:99px;color:var(--muted);background:var(--surface2)}
.chip.demo{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.spacer{flex:1}
.viewtoggle{display:flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.viewtoggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.viewtoggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.viewtoggle button.on{background:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .viewtoggle button.on{color:#16151A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .viewtoggle button.on{color:#16151A}}
main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 22px;max-width:1180px;margin:0 auto}
@media(max-width:840px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel-h h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.panel-b{padding:16px}
form label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 5px;letter-spacing:.04em}
form label:first-child{margin-top:0}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px}
textarea{min-height:88px;resize:vertical}
textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{margin:0;font-weight:400;color:var(--ink);font-size:13px;border:1px solid var(--border2);border-radius:99px;padding:4px 12px;cursor:pointer;letter-spacing:0}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.runbtn{width:100%;margin-top:18px;background:var(--accent);color:#fff;border:0;border-radius:9px;font:inherit;font-size:15px;font-weight:700;padding:11px;cursor:pointer;letter-spacing:.05em}
:root[data-theme="dark"] .runbtn{color:#16151A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .runbtn{color:#16151A}}
.runbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.formnote{font-size:12px;color:var(--faint);margin-top:10px}
#report{display:flex;flex-direction:column;gap:20px;min-width:0}
.sec-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;margin:0}
.sec-sub{font-size:12px;color:var(--muted)}
.barrow{display:grid;grid-template-columns:118px 1fr 44px;align-items:center;gap:10px;padding:5px 0}
.barrow .lab{font-size:13px;text-align:right;color:var(--ink)}
.barrow .lab small{display:block;font-size:11px;color:var(--faint);line-height:1.3}
.track{height:14px;background:var(--surface2);border-radius:4px;position:relative;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-bar);border-radius:0 4px 4px 0;transition:width .5s ease}
.barrow.top .fill{background:var(--accent)}
.barrow .val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.barrow.top .val{color:var(--accent-ink);font-weight:600}
.dimrow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--border)}
.dimrow:last-child{border-bottom:0}
.dimrow .dname{font-size:13px;font-weight:700}
.dimrow .dwhy{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.dots{display:flex;gap:4px;margin-top:5px}
.dot{width:22px;height:8px;border-radius:3px;background:var(--surface2);border:1px solid var(--border)}
.dot.f{background:var(--accent-bar);border-color:var(--accent-bar)}
.dot.f.weak{background:var(--warn);border-color:var(--warn)}
.dscore{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bandcard{border-radius:12px;padding:16px 18px;border:1px solid var(--border)}
.bandcard.bA{background:var(--good-soft);border-color:var(--good)}
.bandcard.bB{background:var(--accent-soft);border-color:var(--accent)}
.bandcard.bC{background:var(--warn-soft);border-color:var(--warn)}
.bandcard.bD{background:var(--crit-soft);border-color:var(--crit)}
.bandhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bandletter{font-family:'Noto Serif SC',serif;font-size:34px;font-weight:700;line-height:1}
.bA .bandletter{color:var(--good)}.bB .bandletter{color:var(--accent-ink)}.bC .bandletter{color:var(--warn)}.bD .bandletter{color:var(--crit)}
.bandname{font-size:15px;font-weight:700}
.bandrange{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.band4{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.band4 li{padding-left:1.4em;position:relative}
.band4 li::before{content:attr(data-k);position:absolute;left:0;font-weight:700;color:var(--muted);font-size:11px;top:2px}
.simItem{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);align-items:baseline}
.simItem:last-child{border-bottom:0}
.simItem .yr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);white-space:nowrap}
.simItem .tt{font-size:13px;flex:1;min-width:0}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted);white-space:nowrap}
.heat{font-size:12px;padding:8px 12px;border-radius:8px;margin-top:10px}
.heat.h{background:var(--warn-soft);color:var(--warn)}
.heat.l{background:var(--good-soft);color:var(--good)}
.acts{margin:0;padding:0;list-style:none;counter-reset:a;display:flex;flex-direction:column;gap:10px}
.acts li{counter-increment:a;position:relative;padding:10px 12px 10px 40px;background:var(--surface2);border-radius:8px;font-size:13px}
.acts li::before{content:counter(a);position:absolute;left:12px;top:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--accent-ink);font-size:13px}
.acts li b{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.warnbox{border-left:3px solid var(--crit);background:var(--crit-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px}
.warnbox b{color:var(--crit)}
.res-light{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500}
.res-light .bulb{width:14px;height:14px;border-radius:50%;flex:none}
.rg{background:var(--good-soft)}.rg .bulb{background:var(--good)}
.ry{background:var(--warn-soft)}.ry .bulb{background:var(--warn)}
.rr{background:var(--crit-soft)}.rr .bulb{background:var(--crit)}
.hook{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:12px;padding:16px 18px;font-size:13px}
.hook b{font-family:'Noto Serif SC',serif;font-size:15px;display:block;margin-bottom:6px;color:var(--accent-ink)}
.footnote{font-size:11px;color:var(--faint);text-align:center;padding:4px 0 28px}
.hidden-view{display:none!important}
.empty{color:var(--faint);text-align:center;padding:40px 0;font-size:13px}
</style>
</head>

        <label for="topic">课题想法（一两句话）</label>
        <textarea id="topic">想用低成本的肌电传感器加机器学习，做一个给独居老人用的跌倒风险预警手环，提前几秒发出提示。</textarea>

          <option value="self" selected>学生自己的观察/经历</option>

          <option value="news">新闻热点/看别人做过</option>

        </div>

        <div class="checks" id="resources">
          <label><input type="checkbox" value="lab">大学实验室</label>
          <label><input type="checkbox" value="mentor">对口方向导师</label>
          <label><input type="checkbox" value="data" checked>公开数据/自采数据</label>
          <label><input type="checkbox" value="compute" checked>算力/编程能力</label>
        </div>

        <label for="lit">读过这个方向的论文吗</label>
        <select id="lit"><option value="0">还没有</option><option value="1" selected>读过两三篇</option><option value="2">系统读过并做了笔记</option></select>

        <label for="eng">用英文讲清这个课题</label>
        <select id="eng"><option value="0">很吃力</option><option value="1" selected>能讲但不流利</option><option value="2">没问题</option></select>

        <label for="time">每周可投入</label>

/* ================= Demo 语料（真实获奖课题的题目层信息，用于相似对照展示） ================= */
const CORPUS=[

function analyze(){
  const topic=$("topic").value.trim();
  const methods=checked("methods"), res=checked("resources");
  const lit=+$("lit").value, eng=+$("eng").value, time=+$("time").value;
  const origin=$("origin").value;
  const resLevel=res.includes("lab")?2:(res.includes("data")||res.includes("compute")||res.includes("mentor"))?1:0;
  /* 方向匹配：词典命中 + 资源修正 */
  const scores=SUBJECTS.map(s=>{
    let hit=s.kw.reduce((a,w)=>a+(topic.includes(w)?1:0),0);
    let base=Math.min(1,hit/3)*0.7+0.15;
    if(s.dep>resLevel)base*=0.55;           // 资源撑不起该赛道
    return {sub:s,score:Math.min(.97,base)};
  }).sort((a,b)=>b.score-a.score);
  const top=scores[0];
  /* 相似课题 & 撞题热度 */
  const sims=ALL.map(p=>{
    let sc=(p.s===top.sub.k?2:0)+(scores[1]&&p.s===scores[1].sub.k?1:0);
    sc+=top.sub.kw.filter(w=>p.t.includes(w)&&topic.includes(w)).length*1.5;
    ["老人","跌倒","肌电","传感器","康复","预警"].forEach(w=>{if(topic.includes(w)&&p.t.includes(w))sc+=2});
    return {p,sc};
  }).sort((a,b)=>b.sc-a.sc).slice(0,5).filter(x=>x.sc>0);
  const cluster=sims[0]?sims[0].p.c:null;
  const heat=cluster?ALL.filter(p=>p.c===cluster).length:0;
  /* 六维（演示规则） */
  const d=[];
  d.push({v:origin==="self"?4:origin==="mentor"?2:1, why:origin==="self"?"问题来自学生自己的观察，能讲出来龙去脉":origin==="mentor"?"问题来自他人建议，需要学生把它变成“自己的”":"热点跟随型选题，独立性与差异化都会被追问"});
  d.push({v:[1,3,5][Math.min(methods.length,2)]||1, why:`当前占了 ${methods.length||0}/3 条腿（理论/实验/仿真），获奖论文普遍两条以上且互相验证`});
  d.push({v:lit*2, why:lit===0?"尚无文献意识，函评关很难过":lit===1?"有初步文献基础，需建立与已有工作的对话":"文献工作扎实"});
  d.push({v:Math.min(5,1+time+(origin==="self"?2:0)), why:"由投入时间与问题来源推断；最终以模拟答辩实测为准"});
  d.push({v:top.sub.dep>resLevel?1:resLevel>=top.sub.dep+1?5:3, why:top.sub.dep>resLevel?`该赛道资源依赖（${top.sub.depTxt}）超出当前条件，存在根本性错配`:"资源与赛道匹配，有余量"});
  d.push({v:eng*2+1, why:"总决赛为 30 分钟英文答辩，此维需长期专项训练"});
  const avg=d.reduce((a,x)=>a+x.v,0)/6;
  const min=Math.min(...d.map(x=>x.v));
  let band = min<=1 ? "D" : avg>=4.2 ? "A" : avg>=3.2 ? "B" : "C";
  if(band==="D"&&avg>=3)band="C";
  return {topic,scores,top,sims,cluster,heat,d,avg,band,resLevel};
}

        <h3 class="sec-title">资源匹配度</h3>
        <div class="res-light ${resCls}" style="margin-top:10px"><span class="bulb"></span>${resTxt}</div>
      </div></div>
      <div class="panel"><div class="panel-b">
        <h3 class="sec-title">这周可以先做的一件事</h3>
        <p style="margin:8px 0 0">${tips[weakest.i]}</p>
      </div></div>
      <div class="hook"><b>完整的六维评估要结合孩子的真实材料做</b>
        公众号后台回复「丘奖」：预约 30 分钟课题定位沟通（顾问一对一），并领取《两届 133 篇获奖课题全景清单》。
      </div>
      <p class="sec-sub" style="text-align:center">对外版不输出档位与概率 · 结果为方向参考，非获奖预测</p>`;
    return;
  }
  /* 内部完整版 */
  const B=BANDS[r.band];
  const dims=r.d.map((x,i)=>`
    <div class="dimrow">
      <div><div class="dname">${DIMS[i].k}</div><div class="sec-sub">${DIMS[i].q}</div>
        <div class="dots">${[1,2,3,4,5].map(n=>`<span class="dot${n<=x.v?" f":""}${x.v<=2&&n<=x.v?" weak":""}"></span>`).join("")}</div></div>
      <div class="dwhy">${x.why}</div>
      <div class="dscore">${x.v}<span style="color:var(--faint)">/5</span></div>
    </div>`).join("");
  const weak=r.d.map((x,i)=>({...x,i})).filter(x=>x.v<=3).sort((a,b)=>a.v-b.v).slice(0,3);
  const ACT={0:["问题所有权测试","让学生脱稿向非本方向的人讲 15 分钟课题并录像，标出所有卡壳点，两周后复测。"],
    1:["补齐第二条腿","当前方法单一。8 周内为课题加上理论建模或数值仿真中的一条，与已有数据互相验证。"],
    2:["文献对话训练","精读 5 篇同簇获奖论文+3 篇期刊论文，各写 200 字“它做了什么、我与它的差别”。"],
    3:["模拟函评+追问","顾问按五关流程做一次 30 分钟模拟追问，记录所有守不住的技术选择，逐条补课。"],
    4:["资源落地里程碑","4 周内落实实验条件/导师/数据三者中缺失项，落实前暂停投入，避免沉没成本。"],
    5:["英文答辩节奏训练","每周一次 5 分钟英文课题陈述，第 8 周做一次 30 分钟全流程模拟答辩。"]};
  const acts=weak.length?weak.map(x=>`<li><b>${DIMS[x.i].k} · 当前 ${x.v}/5</b>${ACT[x.i][1]}</li>`).join(""):'<li><b>无 ≤3 分维度</b>进入赛前冲刺流程：模拟答辩 ×3 + 论文格式终审。</li>';
  el.innerHTML=`
    <div class="panel"><div class="panel-h"><h2>Module A · 方向匹配</h2><span class="chip">双通道：词典 + 语料检索（演示）</span></div>
      <div class="panel-b">${bars}${heatHtml}<div class="heat l" style="margin-top:8px">五年趋势 · ${r.top.sub.k}：${TREND[r.top.sub.k]}</div></div></div>
    <div class="panel"><div class="panel-h"><h2>Module B · 六维评估</h2><span class="chip">锚定式 Rubric · 每分必附依据</span></div>
      <div class="panel-b">${dims}</div></div>
    <div class="panel"><div class="panel-h"><h2>Module C · 档位参考（内部口径）</h2></div>
      <div class="panel-b">
        <div class="bandcard b${r.band}">
          <div class="bandhead"><span class="bandletter">${r.band}</span>
            <div><div class="bandname">${B.name}</div><div class="bandrange">${B.range}</div></div></div>
          <ul class="band4">
            <li data-k="依据">六维均值 ${r.avg.toFixed(1)}/5；${B.note}</li>
            <li data-k="基线">2023 届：1235 篇有效论文 → 89 队入围总决赛（≈7.2%）→ 61 个奖项（≈4.9%）。档位是与获奖论文标准的差距测量。</li>
            <li data-k="不可控">同年撞题、评委构成、答辩临场属不可约不确定性，任何档位都不能消除。</li>
            <li data-k="声明">本档位非获奖预测或承诺；对家庭的表述必须使用话术模板并经顾问审定。</li>
          </ul>
        </div></div></div>
    <div class="panel"><div class="panel-h"><h2>同类获奖课题对照</h2><span class="chip">2019–2025 语料 Top5</span></div>
      <div class="panel-b">${simHtml}</div></div>
    <div class="panel"><div class="panel-h"><h2>Module D · 未来 8–12 周提升路径</h2></div>
      <div class="panel-b"><ol class="acts">${acts}</ol></div></div>
    <div class="warnbox"><b>合规硬提醒</b>　丘奖规定指导老师须来自中学/大学/科研院所，<b>不得由商业培训机构人员担任</b>，经机构参赛有取消资格风险。CMC 角色＝赛道选择与研究能力教练，不进入任何参赛署名环节。本报告为内部工作稿，导出给家庭前必须经顾问审定并走脱敏与合规复检。</div>`;
}
run();
</script>
