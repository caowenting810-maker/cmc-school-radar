<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>正在跳转...</title>
<style>body{display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;background:#f5f5f5;color:#666;font-size:18px}</style>
</head>
<body>
<p id="msg">正在跳转，请稍候...</p>
<script>
(function(){
  var UKEY='cmc_registered';
  var target='';
  var hash=location.hash.replace(/^#/,'');
  var params=new URLSearchParams(location.search);
  var redirectParam=params.get('redirect');
  
  // Set universal registration key
  try{localStorage.setItem(UKEY,'1');}catch(e){}
  
  // Determine target URL
  if(hash && hash.indexOf('http')===0){
    target=hash;
  } else if(redirectParam){
    target=redirectParam;
  }
  
  // Check if hash is a tool shortname and set tool-specific key
  var toolMap={
    'bio-drill':'cmc_reg_bio_drill',
    'phys-lab':'cmc_reg_phys_lab',
    'econ-lab':'cmc_reg_econ_lab',
    'econ-lab-zh':'cmc_reg_econ_lab_zh',
    'chem-path':'cmc_reg_chem_path',
    'college-map':'cmc_reg_college_map',
    'competition-planner':'cmc_reg_competition_planner',
    'major-compass':'cmc_reg_major_compass',
    'competition-engine':'cmc_reg_competition',
    'isef-compass':'cmc_reg_isef',
    'course-planner':'cmc_reg_course_planner',
    'us-college-map':'cmc_reg_us_college_map',
    'amc-ladder':'cmc_reg_amc_ladder'
  };
  var toolName=hash.split('/').filter(Boolean).pop() || hash;
  if(toolMap[toolName]){
    try{localStorage.setItem(toolMap[toolName],'1');}catch(e){}
    if(!target) target='https://cmcshishuo.cn/public/'+toolName+'/';
  }
  
  // Redirect
  if(target){
    window.location.replace(target);
  } else {
    window.location.replace('https://cmcshishuo.cn');
  }
})();
</script>
</body>
</html>
