<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>CMC 师说 · 验证中...</title>
<style>
body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.box{text-align:center;padding:40px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
h2{color:#333;margin-bottom:12px}
p{color:#888;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#4CAF50;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="box">
<div class="spinner"></div>
<h2>验证成功</h2>
<p>正在进入系统...</p>
</div>
<script>
(function(){
  try{localStorage.setItem('cmc_registered','1');}catch(e){}
  var target=location.hash?decodeURIComponent(location.hash.slice(1)):'';
  setTimeout(function(){
    window.location.replace(target||'https://cmcshishuo.cn');
  },800);
})();
</script>
</body></html>
