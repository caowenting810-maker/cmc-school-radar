:"可竞争市场","en":"Contestable Market","def":"进入和退出无沉没成本的市场；即使只有少数厂商，潜在进入威胁也迫使其定价接近平均成本。","def_en":"A market in which entry and exit involve no sunk costs; even with only a few firms, the threat of potential entry forces them to price close to average cost."},{"zh":"赫芬达尔指数","en":"Herfindahl–Hirschman Index (HHI)","def":"各厂商市场份额（百分数）平方之和，最高 10000（纯垄断）；美国司法部通常视 HHI > 2500 为高度集中（2023 年指引为 > 1800）。","def_en":"The sum of the squares of each firm's market share (in percent), with a maximum of 10000 (pure monopoly); the US Department of Justice usually regards an HHI > 2500 as highly concentrated (the 2023 guidelines use > 1800)."}],"formulas":[{"name":"利润最大化条件","f":"MR = MC（且 MC 从下向上穿过 MR）","note":"适用于所有市场结构。完全竞争中即 P = MC。","name_en":"Profit-maximisation condition","note_en":"Applies to all market structures. In perfect competition this means P = MC.","f_en":"MR = MC (with MC cutting MR from below)"},{"name":"线性需求的边际收益","f":"若 P = a − bQ，则 MR = a − 2bQ","note":"MR 与需求曲线纵截距相同，斜率为其 2 倍。","name_en":"Marginal revenue for linear demand","note_en":"MR has the same vertical intercept as the demand curve and twice its slope.","f_en":"If P = a − bQ, then MR = a − 2bQ"},{"name":"利润","f":"π = (P − ATC) × Q","note":"P < ATC 时为亏损。","name_en":"Profit","note_en":"When P < ATC, this is a loss."},{"name":"勒纳指数","f":"(P − MC) ÷ P = 1 ÷ |PED|","note":"垄断者总在需求富有弹性 (|PED| > 1) 的区段生产；弹性越小，加价越高。","name_en":"Lerner index","note_en":"A monopolist always produces on the elastic section of demand (|PED| > 1); the less elastic demand is, the higher the mark-up."},{"name":"集中度","f":"CR_n = 前 n 家份额之和 ;  HHI = Σ s_i²","note":"HHI 对大企业赋予更大权重。","name_en":"Concentration","note_en":"The HHI gives greater weight to large firms.","f_en":"CR_n = sum of the n largest shares ;  HHI = Σ s_i²"},{"name":"古诺双寡头（对称）","f":"P = a − Q, MC = c ⇒ q_i = (a − c) ÷ 3","note":"总产量 2(a−c)/3，介于垄断 (a−c)/2 与完全竞争 (a−c) 之间。","name_en":"Cournot duopoly (symmetric)","note_en":"Total output is 2(a−c)/3, between the monopoly output (a−c)/2 and the perfectly competitive output (a−c)."}],"sections":[{"h":"完全竞争：短期与长期","body":"单个厂商面对水平需求线 P = MR。它选择 **P = MC** 的产量：\n- 若 P > ATC：获得经济利润 → 长期吸引新厂商进入 → 市场供给右移、价格下降，直到 **P = 最低 ATC**。\n- 若 AVC ≤ P < ATC：短期亏损但继续生产。\n- 若 P < AVC 最低点：**停产**，亏损 = FC。\n因此厂商短期供给曲线是 **AVC 最低点以上的 MC 曲线**。\n长期均衡同时实现**配置效率** (P = MC) 和**生产效率** (P = 最低 ATC)。\n例：P = 12，在 P = MC 处 Q = 50、ATC = 10，则利润 = (12 − 10) × 50 = 100。","h_en":"Perfect competition: short run and long run","body_en":"The individual firm faces a horizontal demand line, P = MR. It chooses the output where **P = MC**:\n- If P > ATC: it earns economic profit → in the long run this attracts new firms → market supply shifts right and price falls until **P = minimum ATC**.\n- If AVC ≤ P < ATC: it makes a short-run loss but keeps producing.\n- If P is below the minimum of AVC: it **shuts down**, and its loss = FC.\nThe firm's short-run supply curve is therefore **the MC curve above the minimum of AVC**.\nLong-run equilibrium achieves both **allocative efficiency** (P = MC) and **productive efficiency** (P = minimum ATC).\nExample: P = 12, and at P = MC, Q = 50 and ATC = 10, so profit = (12 − 10) × 50 = 100."},{"h":"垄断：定价、效率与价格歧视","body":"垄断者面对市场需求曲线，因为要降价才能多卖，**MR < P**。\n例：需求 P = 100 − 2Q，MC = 20。MR = 100 − 4Q = 20 ⇒ Q = 20，P = 60。若为完全竞争则 P = MC = 20，Q = 40。**无谓损失** = ½ × (60 − 20) × (40 − 20) = 400。\n**价格歧视**条件：市场势力、能区分消费者、防止转售。\n- **一级（完全）价格歧视**：每单位按消费者保留价格出售，产量达到 P = MC 的有效水平，DWL = 0，但消费者剩余全部被厂商攫取。\n- **三级价格歧视**：各分市场分别令 MR_i = MC，**需求弹性较小的市场定价较高**（如机票商务 vs 学生、影院成人 vs 学生票）。","h_en":"Monopoly: pricing, efficiency and price discrimination","body_en":"The monopolist faces the market demand curve; because it must cut price to sell more, **MR < P**.\nExample: demand is P = 100 − 2Q and MC = 20. MR = 100 − 4Q = 20 ⇒ Q = 20, P = 60. Under perfect competition P = MC = 20 and Q = 40. **Deadweight loss** = ½ × (60 − 20) × (40 − 20) = 400.\nConditions for **price discrimination**: market power, the ability to tell consumers apart, and the ability to prevent resale.\n- **First-degree (perfect) price discrimination**: each unit is sold at the consumer's reservation price, output reaches the efficient level where P = MC, and DWL = 0, but all consumer surplus is captured by the firm.\n- **Third-degree price discrimination**: the firm sets MR_i = MC separately in each sub-market, and **the market with less elastic demand is charged the higher price** (e.g. business vs student air fares, adult vs student cinema tickets)."},{"h":"垄断竞争与寡头","body":"**垄断竞争**：产品差异化让厂商有一定定价权（需求向下倾斜），但自由进入使长期经济利润为 0：需求曲线与 ATC 相切，**P = ATC > MC**，产量低于 ATC 最低点对应产量（**过剩产能**）。\n**寡头**：少数厂商相互依存。\n- **卡特尔**（如 OPEC）共同限产、定垄断价，但每个成员都有偷偷增产的激励，因而不稳定（本质上是囚徒困境，见博弈论一课）。\n- **折弯需求曲线**：对手跟降价不跟涨价 → 需求在现价上方富有弹性、下方缺乏弹性 → MR 在折点处间断，MC 在此区间内变动时价格不变。\n- **古诺模型**（竞赛）：P = 120 − Q、MC = 0 的对称双寡头，每家生产 40，总产量 80，P = 40；垄断时 Q = 60、P = 60；完全竞争时 Q = 120、P = 0。","h_en":"Monopolistic competition and oligopoly","body_en":"**Monopolistic competition**: product differentiation gives firms some pricing power (demand slopes downward), but free entry drives long-run economic profit to 0: the demand curve is tangent to ATC, **P = ATC > MC**, and output is below the output at minimum ATC (**excess capacity**).\n**Oligopoly**: a few firms that are interdependent.\n- A **cartel** (e.g. OPEC) jointly restricts output and sets the monopoly price, but every member has an incentive to secretly raise its output, so cartels are unstable (in essence a prisoner's dilemma — see the Game Theory lesson).\n- **Kinked demand curve**: rivals match price cuts but not price rises → demand is elastic above the current price and inelastic below it → MR is discontinuous at the kink, so price does not change when MC moves within this gap.\n- **Cournot model** (competition level): in a symmetric duopoly with P = 120 − Q and MC = 0, each firm produces 40, total output is 80 and P = 40; under monopoly Q = 60 and P = 60; under perfect competition Q = 120 and P = 0."},{"h":"市场集中度与自然垄断管制","body":"**CR4** 为前四家份额之和；**HHI** 为全部厂商份额平方和。例：份额 40%、30%、20%、10% ⇒ CR4 = 100%，HHI = 1600 + 900 + 400 + 100 = 3000（高度集中）。\n**自然垄断**：LRATC 在整个市场需求范围内下降（如电网、自来水），一家厂商供应成本最低。管制选择：\n- **边际成本定价 P = MC**：配置有效，但由于 MC < ATC，厂商亏损，需要补贴。\n- **平均成本定价 P = ATC（公平回报）**：厂商获正常利润，但产量仍低于有效水平。\n- 不管制：垄断定价，产量最低。\n**可竞争市场**理论提醒我们：关键不在厂商数量，而在进入/退出是否无沉没成本。","h_en":"Market concentration and the regulation of natural monopoly","body_en":"**CR4** is the sum of the market shares of the four largest firms; the **HHI** is the sum of the squares of all firms' shares. Example: shares of 40%, 30%, 20%, 10% ⇒ CR4 = 100%, HHI = 1600 + 900 + 400 + 100 = 3000 (highly concentrated).\n**Natural monopoly**: LRATC is falling over the entire range of market demand (e.g. the electricity grid, water supply), so a single firm can supply at the lowest cost. Regulatory options:\n- **Marginal-cost pricing, P = MC**: allocatively efficient, but because MC < ATC the firm makes a loss and needs a subsidy.\n- **Average-cost pricing, P = ATC (fair return)**: the firm earns normal profit, but output is still below the efficient level.\n- No regulation: monopoly pricing, with the lowest output.\nThe theory of **contestable markets** reminds us that what matters is not the number of firms but whether entry and exit are free of sunk costs."}],"pitfalls":["垄断者“收取最高价格”——错！它在需求曲线上找 MR = MC 对应产量的价格，而非最高价。","认为完全竞争厂商在亏损时一定停产；只要 P ≥ AVC 就应继续生产。","把垄断价格读在 MR 曲线或 MC 曲线上，而非需求曲线上。","认为一级价格歧视降低效率——实际上它消除了 DWL，只是分配给厂商。","自然垄断实施 P = MC 管制后仍认为厂商有利润——实际会亏损。"],"exams":{"AP":"Micro Unit 3.5–3.9 & Unit 4","IB":"2.13 Market power (HL)","AL":"9708 A2 7.6–7.8, 8.1","IEO":"Market structure & competition policy","NEC":"Micro: market structures"},"diagram":"monopoly","summary_en":"This lesson compares four market structures ordered by degree of competition: perfect competition, monopolistic competition, oligopoly and monopoly. Every firm chooses its profit-maximising output where MR = MC, but price, efficiency and long-run profit differ sharply across structures. We also study price discrimination, measures of market concentration, and the regulation of natural monopoly.","pitfalls_en":["A monopolist \"charges the highest possible price\" — wrong! It charges the price on the demand curve corresponding to the output where MR = MC, not the highest price.","Thinking a perfectly competitive firm must shut down whenever it makes a loss; as long as P ≥ AVC it should keep producing.","Reading the monopoly price off the MR curve or the MC curve instead of the demand curve.","Thinking first-degree price discrimination reduces efficiency — in fact it eliminates DWL; the surplus simply goes to the firm.","Still believing the firm makes a profit after a natural monopoly is regulated at P = MC — it will actually make a loss."]},{"id":"m8","unit":"micro","title_zh":"博弈论","title_en":"Game Theory","level":"G10+","summary":"博弈论研究相互依赖的决策：每个参与者的最优选择取决于别人怎么做。本课学习读支付矩阵、占优策略、纳什均衡、囚徒困境、重复博弈、序贯博弈的逆向归纳以及混合策略，这是 IEO 与 NEC 的高频考点。","concepts":[{"zh":"支付矩阵","en":"Payoff Matrix","def":"列出每种策略组合下各参与者收益的表格；惯例是括号中第一个数属于行参与者。","def_en":"A table listing each player's payoff for every combination of strategies; by convention, the first number in each bracket belongs to the row player."},{"zh":"占优策略","en":"Dominant Strategy","def":"无论对手采取什么策略，都能给自己带来严格更高收益的策略。","def_en":"A strategy that gives a player a strictly higher payoff whatever strategy the opponent chooses."},{"zh":"纳什均衡","en":"Nash Equilibrium","def":"一个策略组合，在给定其他人策略时，没有任何参与者能通过单方面改变策略而获益。","def_en":"A combination of strategies in which, given the other players' strategies, no player can gain by unilaterally changing their own strategy."},{"zh":"囚徒困境","en":"Prisoner's Dilemma","def":"每人都有背叛的占优策略，但均衡结果对双方都劣于合作结果（纳什均衡非帕累托最优）。","def_en":"Each player has a dominant strategy to defect, yet the equilibrium outcome is worse for both than the cooperative outcome (the Nash equilibrium is not Pareto optimal)."},{"zh":"重复博弈","en":"Repeated Game","def":"同一博弈进行多次；若无限重复（或结束时间不确定）且参与者足够重视未来，合作可以成为均衡。","def_en":"The same game played many times; if it is repeated infinitely (or the end date is uncertain) and players care enough about the future, cooperation can be an equilibrium."},{"zh":"以牙还牙","en":"Tit-for-Tat","def":"第一轮合作，此后每轮模仿对手上一轮的行动；简单、宽容、可报复。","def_en":"Cooperate in the first round, then in each round copy the opponent's action from the previous round; simple, forgiving and retaliatory."},{"zh":"冷酷触发策略","en":"Grim Trigger","def":"一直合作，一旦对手背叛就永远背叛。","def_en":"Cooperate until the opponent defects, then defect forever."},{"zh":"逆向归纳","en":"Backward Induction","def":"在序贯博弈中从最后一步开始倒推每个决策点的最优行动，得到子博弈完美均衡 (SPNE)。","def_en":"In a sequential game, work backwards from the last move to find the optimal action at each decision point, giving the subgame-perfect Nash equilibrium (SPNE)."},{"zh":"可信威胁","en":"Credible Threat","def":"到了需要执行时，执行它确实对威胁者有利的威胁；不可信威胁会被理性对手忽略。","def_en":"A threat that, when the time comes to carry it out, it is genuinely in the threatener's interest to carry out; a rational opponent will ignore a non-credible threat."},{"zh":"混合策略","en":"Mixed Strategy","def":"以一定概率随机选择纯策略；均衡时每人的概率使对手在其纯策略间无差异。","def_en":"Choosing randomly among pure strategies with certain probabilities; in equilibrium, each player's probabilities make the opponent indifferent between their pure strategies."}],"formulas":[{"name":"无限重复博弈的合作条件（冷酷触发）","f":"π_C ÷ (1 − δ) ≥ π_D + δ·π_N ÷ (1 − δ)","note":"π_C 合作收益、π_D 背叛当期收益、π_N 惩罚期（纳什）收益、δ 为贴现因子。化简得 δ ≥ (π_D − π_C) ÷ (π_D − π_N)。","name_en":"Condition for cooperation in an infinitely repeated game (grim trigger)","note_en":"π_C is the payoff from cooperating, π_D the payoff in the period of defection, π_N the payoff in the punishment (Nash) phase, and δ the discount factor. This simplifies to δ ≥ (π_D − π_C) ÷ (π_D − π_N)."},{"name":"贴现因子与利率","f":"δ = 1 ÷ (1 + r)","note":"利率越高，未来越不值钱，合作越难维持。","name_en":"Discount factor and interest rate","note_en":"The higher the interest rate, the less the future is worth and the harder it is to sustain cooperation."},{"name":"混合策略无差异条件","f":"对手选 X 的期望收益 = 对手选 Y 的期望收益","note":"你的概率由“对手的”收益决定，而不是你自己的收益。","name_en":"Indifference condition for a mixed strategy","note_en":"Your probability is determined by your \"opponent's\" payoffs, not by your own payoffs.","f_en":"Opponent's expected payoff from X = expected payoff from Y"}],"sections":[{"h":"读矩阵：占优策略与纳什均衡","body":"找纳什均衡的实用方法——**划线法**：对每一列，在行参与者的最高收益下划线；对每一行，在列参与者的最高收益下划线；两个数都被划线的格子就是纯策略纳什均衡。\n例：两家公司选择高价 (High) 或低价 (Low)，收益（A, B）：HH (10,10)，HL (2,14)，LH (14,2)，LL (5,5)。\n- 若 B 选 High，A 选 Low 得 14 > 10；若 B 选 Low，A 选 Low 得 5 > 2 ⇒ **Low 是 A 的占优策略**，B 同理。\n- 唯一纳什均衡 (Low, Low)，收益 (5,5)，但 (High, High) 的 (10,10) 对双方都更好——这就是**囚徒困境**。\n注意：纳什均衡不一定存在占优策略；一个博弈也可能有多个纳什均衡（如协调博弈）或没有纯策略纳什均衡。","h_en":"Reading the matrix: dominant strategies and Nash equilibrium","body_en":"A practical way to find Nash equilibria — the **underlining method**: for each column, underline the row player's highest payoff; for each row, underline the column player's highest payoff; any cell in which both numbers are underlined is a pure-strategy Nash equilibrium.\nExample: two firms each choose a High or Low price, with payoffs (A, B): HH (10,10), HL (2,14), LH (14,2), LL (5,5).\n- If B chooses High, A gets 14 > 10 by choosing Low; if B chooses Low, A gets 5 > 2 by choosing Low ⇒ **Low is A's dominant strategy**, and likewise for B.\n- The unique Nash equilibrium is (Low, Low) with payoffs (5,5), yet (High, High) with (10,10) is better for both — this is the **prisoner's dilemma**.\nNote: a Nash equilibrium need not involve dominant strategies; a game may also have several Nash equilibria (e.g. a coordination game) or no pure-strategy Nash equilibrium at all."},{"h":"重复博弈：合作如何维持","body":"**有限次重复且终点已知**：最后一轮等同一次性博弈，大家背叛；倒推下去，每一轮都背叛（逆向归纳）。\n**无限重复**：用冷酷触发策略维持合作。沿用上例：合作每期 10；背叛当期 14，此后永远 5。\n合作条件：10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14 − 9δ ⇒ **δ ≥ 4/9 ≈ 0.44**。\n- δ 越大（越有耐心、利率越低、互动越频繁），卡特尔越稳定。\n- **以牙还牙**在阿克塞尔罗德 (Axelrod) 的计算机锦标赛中表现出色：善良、可报复、宽容、清晰。","h_en":"Repeated games: how cooperation is sustained","body_en":"**Finitely repeated with a known end point**: the last round is the same as a one-shot game, so everyone defects; working backwards, everyone defects in every round (backward induction).\n**Infinitely repeated**: cooperation is sustained with a grim-trigger strategy. Using the example above: cooperating gives 10 per period; defecting gives 14 in that period and 5 forever after.\nCondition for cooperation: 10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14 − 9δ ⇒ **δ ≥ 4/9 ≈ 0.44**.\n- The larger δ is (more patient players, lower interest rates, more frequent interaction), the more stable the cartel.\n- **Tit-for-tat** performed outstandingly in Axelrod's computer tournaments: it is nice, retaliatory, forgiving and clear."},{"h":"序贯博弈与先动优势","body":"用**博弈树**表示，按**逆向归纳**求解。\n例：潜在进入者先决定是否进入；若进入，在位者选择“打价格战”或“容纳”。收益（进入者, 在位者）：不进入 (0,10)；进入-打 (−2,2)；进入-容纳 (3,5)。\n- 倒推：若进入，在位者比较 2 与 5，选择容纳。\n- 进入者预期得 3 > 0，选择进入。SPNE：（进入，容纳）。\n- 在位者“你敢进来我就打”是**不可信威胁**。若在位者事先投资过剩产能等**承诺 (commitment)**，使打价格战变得有利，威胁才可信——这正是**先动优势**的来源之一（Stackelberg 领导者先定产量也获得更高利润）。","h_en":"Sequential games and first-mover advantage","body_en":"These are represented by a **game tree** and solved by **backward induction**.\nExample: a potential entrant first decides whether to enter; if it enters, the incumbent chooses to \"start a price war\" or \"accommodate\". Payoffs (entrant, incumbent): stay out (0,10); enter–fight (−2,2); enter–accommodate (3,5).\n- Working backwards: if entry occurs, the incumbent compares 2 with 5 and chooses to accommodate.\n- The entrant expects to get 3 > 0, so it enters. SPNE: (enter, accommodate).\n- The incumbent's \"if you dare to come in, I'll fight\" is a **non-credible threat**. Only if the incumbent makes a prior **commitment**, such as investing in excess capacity, so that a price war becomes profitable, does the threat become credible — this is one source of **first-mover advantage** (a Stackelberg leader that sets its output first also earns higher profit)."},{"h":"混合策略（竞赛）","body":"当没有纯策略纳什均衡时（如“猜硬币”、点球门将与射手），参与者会随机化。求解关键：**我的概率要让对手无差异**。\n例：行玩家选 T/B，列玩家选 L/R。列玩家收益：TL 0、TR 2、BL 3、BR 0。设行玩家以 p 选 T：列选 L 期望收益 = 3(1−p)，选 R = 2p；令其相等得 **p = 3/5**。\n常见错误是用行玩家自己的收益去求自己的概率。","h_en":"Mixed strategies (competition level)","body_en":"When there is no pure-strategy Nash equilibrium (e.g. \"matching pennies\", or a goalkeeper and a penalty taker), players randomise. The key to solving these games: **my probabilities must make my opponent indifferent**.\nExample: the row player chooses T/B and the column player chooses L/R. The column player's payoffs are: TL 0, TR 2, BL 3, BR 0. Let the row player choose T with probability p: the column player's expected payoff from L = 3(1−p), and from R = 2p; setting these equal gives **p = 3/5**.\nA common mistake is to use the row player's own payoffs to find the row player's own probability."}],"pitfalls":["认为纳什均衡一定是对双方最好的结果——囚徒困境恰恰相反。","把“占优策略”与“纳什均衡”混为一谈：占优策略均衡一定是纳什均衡，反之不然。","在序贯博弈中相信不可信威胁，而不是用逆向归纳检验。","有限次（终点已知）重复博弈中认为可以一直合作。","求混合策略概率时用自己的收益而非对手的收益列方程。"],"exams":{"AP":"Micro Unit 4.5 (Oligopoly & Game Theory)","IB":"2.13 HL (oligopoly, game theory)","AL":"9708 A2 7.6 (oligopoly)","IEO":"Strategic interaction / game theory","NEC":"Micro: oligopoly & game theory"},"diagram":null,"summary_en":"Game theory studies interdependent decisions: each player's best choice depends on what the others do. In this lesson you will learn to read payoff matrices and work with dominant strategies, Nash equilibrium, the prisoner's dilemma, repeated games, backward induction in sequential games and mixed strategies — all frequently tested topics in the IEO and NEC.","pitfalls_en":["Thinking a Nash equilibrium must be the best outcome for both players — the prisoner's dilemma shows exactly the opposite.","Treating \"dominant strategy\" and \"Nash equilibrium\" as the same thing: a dominant-strategy equilibrium is always a Nash equilibrium, but not vice versa.","Believing non-credible threats in sequential games instead of testing them with backward induction.","Thinking cooperation can be sustained throughout a finitely repeated game (with a known end point).","Setting up the equation for mixed-strategy probabilities with your own payoffs rather than your opponent's."]},{"id":"m9","unit":"micro","title_zh":"要素市场","title_en":"Factor Markets","level":"G10+","summary":"劳动、资本等生产要素的需求是派生需求——源于人们对最终产品的需求。厂商按 MRP = MRC 决定雇佣量，并用最小成本法则组合各种投入。本课还分析买方垄断、最低工资在不同市场中的效应以及工资差异与人力资本。","concepts":[{"zh":"派生需求","en":"Derived Demand","def":"对生产要素的需求来源于对其生产的最终产品的需求。","def_en":"The demand for a factor of production comes from the demand for the final product it helps to produce."},{"zh":"劳动边际产量","en":"Marginal Product of Labour (MPL)","def":"多雇一名工人带来的额外产出。","def_en":"The extra output from hiring one more worker."},{"zh":"边际收益产品","en":"Marginal Revenue Product (MRP)","def":"多雇一单位要素带来的总收益增量，MRP = MP × MR；产品市场完全竞争时 MR = P，MRP = MP × P。","def_en":"The increase in total revenue from employing one more unit of a factor, MRP = MP × MR; when the product market is perfectly competitive, MR = P, so MRP = MP × P."},{"zh":"边际要素成本","en":"Marginal Resource Cost (MRC / MFC)","def":"多雇一单位要素带来的总成本增量；要素市场完全竞争时 MRC = 工资 W。","def_en":"The increase in total cost from employing one more unit of a factor; when the factor market is perfectly competitive, MRC = the wage W."},{"zh":"雇佣法则","en":"Hiring Rule","def":"利润最大化厂商雇佣要素直到 MRP = MRC。","def_en":"A profit-maximising firm employs a factor up to the point where MRP = MRC."},{"zh":"最小成本法则","en":"Least-Cost Rule","def":"MP_L/W = MP_K/r，即每元花在各要素上的边际产量相等。","def_en":"MP_L/W = MP_K/r, i.e. the marginal product per dollar spent is equal across all factors."},{"zh":"买方垄断","en":"Monopsony","def":"要素市场中只有一个买者（如小镇唯一的大雇主）；面对向上倾斜的劳动供给曲线，MRC > W。","def_en":"A factor market with only one buyer (e.g. the only large employer in a small town); it faces an upward-sloping labour supply curve, so MRC > W."},{"zh":"补偿性工资差异","en":"Compensating Wage Differential","def":"为弥补工作的危险、辛苦或不愉快而支付的更高工资。","def_en":"A higher wage paid to compensate for work that is dangerous, arduous or unpleasant."},{"zh":"人力资本","en":"Human Capital","def":"通过教育、培训积累的知识与技能，能提高劳动生产率和工资。","def_en":"The knowledge and skills accumulated through education and training, which raise labour productivity and wages."}],"formulas":[{"name":"边际收益产品","f":"MRP = MP × MR（竞争性产品市场：MRP = MP × P）","note":"垄断厂商的 MRP 更低，因为 MR < P。","name_en":"Marginal revenue product","note_en":"A monopolist's MRP is lower, because MR < P.","f_en":"MRP = MP × MR (competitive product market: MRP = MP × P)"},{"name":"雇佣法则","f":"MRP = MRC；竞争性劳动市场中 MRP = W","note":"离散表格中雇佣到 MRP ≥ W 的最后一名工人。","name_en":"Hiring rule","note_en":"In a discrete table, hire up to the last worker for whom MRP ≥ W.","f_en":"MRP = MRC; in a competitive labour market MRP = W"},{"name":"最小成本法则","f":"MP_L ÷ W = MP_K ÷ r","note":"若左边更大，应多用劳动、少用资本。","name_en":"Least-cost rule","note_en":"If the left-hand side is larger, use more labour and less capital."},{"name":"利润最大化要素组合","f":"MRP_L ÷ W = MRP_K ÷ r = 1","note":"满足利润最大化必然满足成本最小化，反之不然。","name_en":"Profit-maximising combination of factors","note_en":"Profit maximisation necessarily implies cost minimisation, but not vice versa."},{"name":"买方垄断的 MRC（线性供给）","f":"若 W = a + bL，则 MRC = a + 2bL","note":"与垄断的 MR 类似：斜率为供给曲线的 2 倍。","name_en":"Monopsonist's MRC (linear supply)","note_en":"Analogous to the monopolist's MR: its slope is twice that of the supply curve.","f_en":"If W = a + bL, then MRC = a + 2bL"}],"sections":[{"h":"派生需求与 MRP","body":"企业雇工人不是因为喜欢工人，而是因为工人能生产可出售的产品。因此**劳动需求曲线就是 MRP 曲线**（向下倾斜，因为边际收益递减）。\n例：产品价格 P = 4，工资 W = 30。L = 1…6 时 TP = 12, 22, 30, 36, 40, 42。\n- MP = 12, 10, 8, 6, 4, 2；MRP = 48, 40, 32, 24, 16, 8。\n- 第 3 名工人 MRP = 32 ≥ 30，第 4 名 MRP = 24 < 30 ⇒ 雇 **3 人**。\n劳动需求移动的原因：产品价格变化、劳动生产率变化（技术、培训）、其他要素价格变化（替代品或互补品）。","h_en":"Derived demand and MRP","body_en":"Firms do not hire workers because they like workers, but because workers produce output that can be sold. The **labour demand curve is therefore the MRP curve** (downward sloping because of diminishing marginal returns).\nExample: product price P = 4, wage W = 30. For L = 1…6, TP = 12, 22, 30, 36, 40, 42.\n- MP = 12, 10, 8, 6, 4, 2; MRP = 48, 40, 32, 24, 16, 8.\n- The 3rd worker has MRP = 32 ≥ 30; the 4th has MRP = 24 < 30 ⇒ hire **3 workers**.\nCauses of shifts in labour demand: changes in the product price, changes in labour productivity (technology, training), and changes in the prices of other factors (substitutes or complements)."},{"h":"最小成本组合","body":"厂商使用多种要素时，要让**每一元钱**在各要素上的边际产量相等：MP_L/W = MP_K/r。\n例：MP_L = 20，W = 10 ⇒ 每元 2 单位；MP_K = 30，r = 20 ⇒ 每元 1.5 单位。劳动更“划算”，应**多用劳动、少用资本**，直至比值相等（边际收益递减使 MP_L 下降、MP_K 上升）。","h_en":"The least-cost combination","body_en":"When a firm uses several factors, it should make the marginal product of **every dollar** equal across factors: MP_L/W = MP_K/r.\nExample: MP_L = 20 and W = 10 ⇒ 2 units per dollar; MP_K = 30 and r = 20 ⇒ 1.5 units per dollar. Labour is the \"better deal\", so the firm should **use more labour and less capital** until the ratios are equal (diminishing marginal returns make MP_L fall and MP_K rise)."},{"h":"买方垄断与最低工资","body":"**竞争性劳动市场**：设定高于均衡工资的最低工资 → 劳动需求量下降、供给量上升 → **就业减少、失业（劳动过剩）**。例：L_d = 100 − 2W，L_s = 3W − 25，均衡 W = 25、L = 50。最低工资 30 ⇒ L_d = 40、L_s = 65，就业减少 10，过剩 25。\n**买方垄断**：雇主要提高所有工人的工资才能多雇一人，MRC 在供给曲线上方。例：供给 W = 10 + 2L，MRC = 10 + 4L，MRP = 70 − 2L。\n- MRC = MRP ⇒ L = 10，再到**供给曲线**上读工资 W = 30（低于 MRP = 50，存在“剥削”）。\n- 竞争性结果：供给 = MRP ⇒ L = 15，W = 40。\n- 设最低工资 36：在 L ≤ 13 内 MRC = 36（水平），雇主雇到 MRP = 36 或供给约束处 ⇒ L = min(13, 17) = **13**，就业**增加**。最低工资设在竞争性工资 40 时就业最大 (15)。","h_en":"Monopsony and the minimum wage","body_en":"**Competitive labour market**: setting a minimum wage above the equilibrium wage → quantity of labour demanded falls and quantity supplied rises → **employment falls and there is unemployment (a surplus of labour)**. Example: L_d = 100 − 2W, L_s = 3W − 25, equilibrium W = 25, L = 50. A minimum wage of 30 ⇒ L_d = 40, L_s = 65, so employment falls by 10 and the surplus is 25.\n**Monopsony**: to hire one more worker the employer must raise the wage for all workers, so MRC lies above the supply curve. Example: supply W = 10 + 2L, MRC = 10 + 4L, MRP = 70 − 2L.\n- MRC = MRP ⇒ L = 10; then read the wage off the **supply curve**: W = 30 (below MRP = 50, so there is \"exploitation\").\n- Competitive outcome: supply = MRP ⇒ L = 15, W = 40.\n- With a minimum wage of 36: for L ≤ 13, MRC = 36 (horizontal), and the employer hires up to where MRP = 36 or up to the supply constraint ⇒ L = min(13, 17) = **13**, so employment **rises**. Employment is maximised (15) when the minimum wage is set at the competitive wage of 40."},{"h":"工资差异与人力资本","body":"工资差异来源：\n- **补偿性差异**：危险、夜班、偏远地区。\n- **人力资本差异**：教育和培训提高生产率（贝克尔人力资本理论）；信号理论 (signalling) 认为学历也在向雇主传递能力信息。\n- **市场势力**：工会（提高工资但可能减少就业）、买方垄断。\n- **歧视**与信息不对称。\n**超级明星效应**：技术与全球市场让少数顶尖者获得不成比例的收入，这也与收入分配一课相关。","h_en":"Wage differentials and human capital","body_en":"Sources of wage differentials:\n- **Compensating differentials**: danger, night shifts, remote locations.\n- **Differences in human capital**: education and training raise productivity (Becker's human capital theory); signalling theory argues that qualifications also convey information about ability to employers.\n- **Market power**: trade unions (which raise wages but may reduce employment), monopsony.\n- **Discrimination** and asymmetric information.\n**The superstar effect**: technology and global markets allow a small number of top performers to earn disproportionately large incomes; this also links to the lesson on income distribution."}],"pitfalls":["买方垄断中把工资读在 MRC 曲线或 MRP 曲线上；工资应在劳动供给曲线上读取。","认为最低工资必然减少就业——在买方垄断市场中适度最低工资可提高就业。","垄断产品市场中仍用 MP × P 计算 MRP，应使用 MP × MR。","最小成本法则比较的是 MP/价格，而不是单纯比较 MP 大小。","混淆劳动需求的“移动”与“沿曲线移动”：工资变化只引起沿曲线移动。"],"exams":{"AP":"Micro Unit 5 (Factor Markets)","IB":"2.8 (minimum wage as price floor)","AL":"9708 A2 8.3","IEO":"Labour markets","NEC":"Micro: factor markets"},"diagram":"floor","summary_en":"The demand for labour, capital and other factors of production is a derived demand — it comes from people's demand for final products. Firms decide how much to hire using MRP = MRC, and combine different inputs using the least-cost rule. This lesson also analyses monopsony, the effects of a minimum wage in different markets, and wage differentials and human capital.","pitfalls_en":["Reading the monopsony wage off the MRC curve or the MRP curve; the wage should be read off the labour supply curve.","Thinking a minimum wage must always reduce employment — in a monopsony market a moderate minimum wage can raise employment.","Still calculating MRP as MP × P when the product market is a monopoly; you should use MP × MR.","The least-cost rule compares MP/price, not simply the size of MP.","Confusing a \"shift\" of labour demand with a \"movement along\" the curve: a change in the wage causes only a movement along the curve."]},{"id":"m10","unit":"micro","title_zh":"市场失灵与收入分配","title_en":"Market Failure & Income Distribution","level":"G9+","summary":"当市场自发结果不能实现资源有效配置时就出现市场失灵：外部性、公共物品、公共资源和信息不对称都是典型原因。本课学习庇古税/补贴、科斯定理、排污权交易等纠正手段，并用洛伦兹曲线、基尼系数和税制累进性分析收入分配问题。","concepts":[{"zh":"负外部性","en":"Negative Externality","def":"生产或消费给第三方带来未被补偿的成本（如污染）；MSC = MPC + MEC > MPC，市场产量过多。","def_en":"Production or consumption imposes an uncompensated cost on third parties (e.g. pollution); MSC = MPC + MEC > MPC, so the market produces too much."},{"zh":"正外部性","en":"Positive Externality","def":"给第三方带来未被支付的收益（如疫苗、教育）；MSB = MPB + MEB > MPB，市场产量过少。","def_en":"Production or consumption creates an unpaid-for benefit for third parties (e.g. vaccines, education); MSB = MPB + MEB > MPB, so the market produces too little."},{"zh":"庇古税/补贴","en":"Pigouvian Tax / Subsidy","def":"按社会最优产量处的边际外部成本（收益）征税（补贴），使外部性内部化。","def_en":"A tax (subsidy) set equal to the marginal external cost (benefit) at the socially optimal output, which internalises the externality."},{"zh":"科斯定理","en":"Coase Theorem","def":"若产权明确且交易成本足够低，各方私下谈判可达到有效结果，且与产权初始归属无关（但分配结果有关）。","def_en":"If property rights are clearly defined and transaction costs are sufficiently low, private bargaining between the parties will reach the efficient outcome, regardless of who is initially assigned the property rights (although the distributional outcome does depend on it)."},{"zh":"公共物品","en":"Public Good","def":"非竞争性 (non-rival) 且非排他性 (non-excludable) 的物品，如国防、灯塔；市场会因搭便车问题而供给不足。","def_en":"A good that is non-rival and non-excludable, such as national defence or a lighthouse; the market under-provides it because of the free-rider problem."},{"zh":"搭便车问题","en":"Free-Rider Problem","def":"人们可以不付费享受物品，于是隐藏真实偏好、不愿付费。","def_en":"People can enjoy a good without paying for it, so they conceal their true preferences and are unwilling to pay."},{"zh":"公地悲剧","en":"Tragedy of the Commons","def":"竞争性但非排他性的公共资源（渔场、牧场）被过度使用。","def_en":"A common-pool resource that is rival but non-excludable (a fishery, a pasture) is overused."},{"zh":"逆向选择","en":"Adverse Selection","def":"交易前的信息不对称：高风险或低质量的一方更愿意参与交易（二手车“柠檬”市场、保险）。","def_en":"Asymmetric information before a transaction: the high-risk or low-quality party is more willing to trade (the used-car \"market for lemons\", insurance)."},{"zh":"道德风险","en":"Moral Hazard","def":"交易后的隐藏行为：一方在受保护后改变行为、承担更多风险（投保后疏于防范）。","def_en":"Hidden action after a transaction: once protected, one party changes its behaviour and takes on more risk (becoming careless after buying insurance)."},{"zh":"基尼系数","en":"Gini Coefficient","def":"洛伦兹曲线与绝对平等线之间面积占平等线下方三角形面积的比例，0 为完全平等，1 为完全不平等。","def_en":"The area between the Lorenz curve and the line of perfect equality as a proportion of the area of the triangle under the line of equality; 0 means perfect equality and 1 means perfect inequality."}],"formulas":[{"name":"社会成本与社会收益","f":"MSC = MPC + MEC ;  MSB = MPB + MEB","note":"社会最优产量：MSB = MSC。","name_en":"Social cost and social benefit","note_en":"Socially optimal output: MSB = MSC."},{"name":"庇古税","f":"t = MEC（在社会最优产量 Q* 处取值）","note":"若 MEC 不变，税额即为每单位外部成本。","name_en":"Pigouvian tax","note_en":"If MEC is constant, the tax is simply the external cost per unit.","f_en":"t = MEC (evaluated at the socially optimal Q*)"},{"name":"无谓损失（负外部性）","f":"DWL = ½ × (Q_市场 − Q*) × (MSC − MSB 在 Q_市场 处的差)","note":"线性情形下为三角形面积。","name_en":"Deadweight loss (negative externality)","note_en":"In the linear case this is the area of a triangle.","f_en":"DWL = ½ × (Q_market − Q*) × (MSC − MSB at Q_market)"},{"name":"公共物品的最优供给","f":"ΣMB_i = MC（需求曲线垂直加总）","note":"私人物品是水平加总。","name_en":"Optimal provision of a public good","note_en":"Private goods are summed horizontally.","f_en":"ΣMB_i = MC (vertical summation of demand)"},{"name":"基尼系数","f":"G = A ÷ (A + B)","note":"A 为平等线与洛伦兹曲线之间面积，A + B = 0.5（单位正方形中）。","name_en":"Gini coefficient","note_en":"A is the area between the line of equality and the Lorenz curve; A + B = 0.5 (in a unit square)."},{"name":"排污权交易效率条件","f":"MAC_1 = MAC_2 = 许可证价格","note":"边际减排成本相等时，总减排成本最低。","name_en":"Efficiency condition for emissions trading","note_en":"When marginal abatement costs are equal, the total cost of abatement is minimised.","f_en":"MAC_1 = MAC_2 = permit price"}],"sections":[{"h":"外部性与庇古税","body":"负外部性使 **MSC > MPC**，市场按 MPB = MPC 生产，**产量过多、价格过低**。\n例：需求 MPB = MSB = 50 − Q，私人成本 MPC = 10 + Q，每单位污染造成外部成本 6。\n- 市场：50 − Q = 10 + Q ⇒ Q = 20。\n- 社会最优：50 − Q = 16 + Q ⇒ Q* = 17。\n- 无谓损失 = ½ × 6 × (20 − 17) = 9。\n- **庇古税** t = 6/单位，使私人成本等于社会成本，市场产量降至 17。\n正外部性（教育、疫苗）则相反：市场产量不足，适合**庇古补贴**或政府直接提供。","h_en":"Externalities and Pigouvian taxes","body_en":"A negative externality means **MSC > MPC**; the market produces where MPB = MPC, so **output is too high and price is too low**.\nExample: demand MPB = MSB = 50 − Q, private cost MPC = 10 + Q, and each unit of pollution causes an external cost of 6.\n- Market: 50 − Q = 10 + Q ⇒ Q = 20.\n- Social optimum: 50 − Q = 16 + Q ⇒ Q* = 17.\n- Deadweight loss = ½ × 6 × (20 − 17) = 9.\n- A **Pigouvian tax** of t = 6 per unit makes private cost equal to social cost, and market output falls to 17.\nPositive externalities (education, vaccines) are the reverse: the market under-produces, which calls for a **Pigouvian subsidy** or direct government provision."},{"h":"科斯定理与排污权交易","body":"**科斯定理**：工厂污染邻近洗衣店，若安装过滤器成本 200，洗衣店损失 300。交易成本为零时：\n- 若洗衣店有权要求清洁空气：工厂安装过滤器（200 < 赔偿 300）。\n- 若工厂有污染权：洗衣店愿付 200–300 之间的金额让工厂安装。\n两种情况下**过滤器都会安装**（有效率），但**谁付钱**不同。现实中涉及人数多、交易成本高，科斯方案常失效。\n**碳定价**：碳税固定价格、排放量不确定；**总量管制与交易 (cap-and-trade)** 固定排放总量、价格由市场决定。许可证交易使**边际减排成本 (MAC) 相等**，以最低总成本完成减排。例：MAC_A = 2a，MAC_B = 4b，需减排 30 ⇒ 2a = 4b 且 a + b = 30 ⇒ a = 20、b = 10，许可证价格 40。","h_en":"The Coase theorem and emissions trading","body_en":"**Coase theorem**: a factory pollutes a nearby laundry. Installing a filter costs 200, and the laundry's loss is 300. With zero transaction costs:\n- If the laundry has the right to clean air: the factory installs the filter (200 < compensation of 300).\n- If the factory has the right to pollute: the laundry is willing to pay an amount between 200 and 300 for the factory to install it.\nIn both cases **the filter is installed** (the efficient outcome), but **who pays** differs. In reality, when many people are involved and transaction costs are high, Coasian solutions often fail.\n**Carbon pricing**: a carbon tax fixes the price and leaves the quantity of emissions uncertain; **cap-and-trade** fixes the total quantity of emissions and lets the market determine the price. Trading permits **equalises marginal abatement costs (MAC)**, achieving the reduction at the lowest total cost. Example: MAC_A = 2a, MAC_B = 4b, and emissions must be cut by 30 ⇒ 2a = 4b and a + b = 30 ⇒ a = 20, b = 10, and the permit price is 40."},{"h":"公共物品、公共资源与信息不对称","body":"按两个特征分类：\n- 竞争 + 排他：私人物品（面包）\n- 非竞争 + 排他：俱乐部物品（付费电视、收费公路）\n- 竞争 + 非排他：**公共资源**（渔场）→ 公地悲剧，对策：配额、产权、许可证\n- 非竞争 + 非排他：**公共物品**（国防）→ 搭便车，对策：政府用税收提供\n公共物品最优数量由**垂直加总**的边际收益等于边际成本决定。例：三位居民对一盏路灯分别估值 40、25、15，总计 80 > 成本 70，应安装——即使没有任何一人愿单独付 70。\n**信息不对称**：逆向选择（交易前，如健康差的人更愿买保险）→ 对策：强制参保、信号、筛选；道德风险（交易后，如有存款保险的银行冒更大风险）→ 对策：免赔额、共同保险、监管。","h_en":"Public goods, common-pool resources and asymmetric information","body_en":"Classification by two characteristics:\n- Rival + excludable: private goods (bread)\n- Non-rival + excludable: club goods (pay TV, toll roads)\n- Rival + non-excludable: **common-pool resources** (fisheries) → tragedy of the commons; remedies: quotas, property rights, permits\n- Non-rival + non-excludable: **public goods** (national defence) → free riding; remedy: government provision financed by taxation\nThe optimal quantity of a public good is where the **vertically summed** marginal benefit equals marginal cost. Example: three residents value a streetlight at 40, 25 and 15 respectively; the total of 80 > the cost of 70, so it should be installed — even though no one is willing to pay 70 on their own.\n**Asymmetric information**: adverse selection (before the transaction, e.g. people in poor health are keener to buy insurance) → remedies: compulsory insurance, signalling, screening; moral hazard (after the transaction, e.g. banks covered by deposit insurance take bigger risks) → remedies: deductibles, co-insurance, regulation."},{"h":"收入分配：洛伦兹曲线与税制","body":"**洛伦兹曲线**把人口按收入由低到高排列，画出累计人口比例对应的累计收入比例。曲线越向下弯离 45° 平等线，分配越不平等。\n**基尼系数** G = A/(A + B)。若 A = 0.15，则 G = 0.15/0.5 = 0.30。\n税制分类（看**平均税率**随收入如何变化）：\n- **累进税**：收入越高，平均税率越高（个人所得税）。\n- **比例税**：平均税率不变。\n- **累退税**：收入越高，平均税率越低（多数消费税、销售税实际上是累退的，因为低收入者消费占收入比例更高）。\n例：收入 20000 纳税 2000（10%），收入 100000 纳税 8000（8%）⇒ 累退，尽管高收入者缴纳的绝对金额更多。","h_en":"Income distribution: the Lorenz curve and the tax system","body_en":"The **Lorenz curve** ranks the population from lowest to highest income and plots the cumulative share of income against the cumulative share of the population. The further the curve bows down away from the 45° line of equality, the more unequal the distribution.\n**Gini coefficient** G = A/(A + B). If A = 0.15, then G = 0.15/0.5 = 0.30.\nClassifying taxes (look at how the **average tax rate** changes with income):\n- **Progressive tax**: the higher the income, the higher the average tax rate (personal income tax).\n- **Proportional tax**: the average tax rate is constant.\n- **Regressive tax**: the higher the income, the lower the average tax rate (most excise and sales taxes are in effect regressive, because low-income households spend a larger share of their income).\nExample: an income of 20000 pays 2000 in tax (10%), and an income of 100000 pays 8000 (8%) ⇒ regressive, even though the higher earner pays a larger absolute amount."}],"pitfalls":["庇古税应等于社会最优产量处的边际外部成本，而不是市场产量处的。","把“免费”或“政府提供”等同于公共物品——判断标准是非竞争性和非排他性。","混淆逆向选择（交易前隐藏信息）与道德风险（交易后隐藏行动）。","按纳税绝对额判断累进/累退，应看平均税率。","认为科斯定理下产权分配无关紧要——效率结果相同，但收入分配不同。"],"exams":{"AP":"Micro Unit 6 (Market Failure & Role of Government)","IB":"2.9–2.12, 3.6","AL":"9708 AS 1.5, 3; A2 7.3–7.4, 8.1–8.2","IEO":"Market failure, environment & inequality","NEC":"Micro: externalities, public goods, distribution"},"diagram":"ext_neg","summary_en":"Market failure occurs when the market's spontaneous outcome does not allocate resources efficiently: externalities, public goods, common-pool resources and asymmetric information are the classic causes. This lesson covers corrective tools such as Pigouvian taxes and subsidies, the Coase theorem and emissions trading, and uses the Lorenz curve, the Gini coefficient and the progressivity of the tax system to analyse income distribution.","pitfalls_en":["A Pigouvian tax should equal the marginal external cost at the socially optimal output, not at the market output.","Equating \"free\" or \"provided by the government\" with a public good — the test is non-rivalry and non-excludability.","Confusing adverse selection (hidden information before the transaction) with moral hazard (hidden action after the transaction).","Judging whether a tax is progressive or regressive by the absolute amount paid; you should look at the average tax rate.","Thinking that under the Coase theorem the allocation of property rights does not matter at all — the efficient outcome is the same, but the distribution of income differs."]},{"id":"m11","unit":"micro","title_zh":"企业目标、效率与政府失灵","title_en":"Firms' Objectives, Efficiency & Government Failure","level":"G10+","summary":"传统理论假设企业追求利润最大化，但现实中的企业还可能追求收入最大化、销售最大化或“满意化”，这与所有权和控制权分离带来的委托–代理问题 (principal–agent problem) 密切相关。本课还讲企业如何成长、经济学中各种效率的含义，以及政府用竞争政策、价格管制和私有化/国有化干预市场时，为何也可能出现政府失灵 (government failure)。","summary_en":"Traditional theory assumes firms maximise profit, but real firms may instead pursue revenue maximisation, sales maximisation or \"satisficing\", which is closely linked to the principal–agent problem created by the separation of ownership and control. This lesson also covers how firms grow, the meaning of the different types of efficiency, and why government intervention through competition policy, price regulation and privatisation/nationalisation can itself lead to government failure.","concepts":[{"zh":"利润最大化","en":"Profit maximisation","def":"在边际成本等于边际收益 (MC = MR) 且 MC 从下方穿过 MR 的产量上生产，使总利润 TR − TC 最大。","def_en":"Producing the output where marginal cost equals marginal revenue (MC = MR), with MC cutting MR from below, so that total profit TR − TC is as large as possible."},{"zh":"收入最大化","en":"Revenue maximisation","def":"在边际收益为零 (MR = 0) 的产量上生产，使总收益最大；此时需求价格弹性为 1（单位弹性）。","def_en":"Producing the output where marginal revenue is zero (MR = 0), so that total revenue is at its maximum; at this point price elasticity of demand equals 1 (unit elastic)."},{"zh":"销售最大化","en":"Sales maximisation","def":"在不亏损（只赚正常利润）的约束下使销量最大，即在平均收益等于平均成本 (AR = AC) 处生产。","def_en":"Maximising the volume of sales subject to not making a loss (earning only normal profit), i.e. producing where average revenue equals average cost (AR = AC)."},{"zh":"满意化","en":"Satisficing","def":"企业不追求任何单一目标的最大化，而是让各方利益相关者 (stakeholders) 都达到“足够满意”的水平，例如赚取令股东满意的最低利润。","def_en":"The firm does not maximise any single objective but aims for results that are \"good enough\" for its various stakeholders, e.g. earning a level of profit that keeps shareholders content."},{"zh":"委托–代理问题","en":"Principal–agent problem","def":"委托人（如股东）委托代理人（如经理）行事，但双方目标不一致且存在信息不对称，代理人可能追求自身利益（高薪、规模、声望）而非委托人的利益。","def_en":"A principal (e.g. shareholders) hires an agent (e.g. managers) to act on its behalf, but their objectives differ and information is asymmetric, so the agent may pursue its own interests (high pay, size, prestige) instead of the principal's."},{"zh":"横向、纵向与混合一体化","en":"Horizontal, vertical & conglomerate integration","def":"横向：同一生产阶段的企业合并；纵向：不同生产阶段合并（向后靠近原料、向前靠近消费者）；混合：不相关行业的企业合并。","def_en":"Horizontal: firms at the same stage of production combine; vertical: firms at different stages combine (backward towards raw materials, forward towards consumers); conglomerate: firms in unrelated industries combine."},{"zh":"范围经济","en":"Economies of scope","def":"一家企业同时生产多种产品的总成本低于分别由专门企业生产的成本之和，通常源于共享的投入、品牌或分销网络。","def_en":"When one firm producing several products together has a lower total cost than specialist firms producing each product separately, usually because of shared inputs, brands or distribution networks."},{"zh":"生产效率与配置效率","en":"Productive & allocative efficiency","def":"生产效率：在最低平均成本 (min AC) 处生产；配置效率：在价格等于边际成本 (P = MC) 处生产，此时资源配置最符合社会的偏好。","def_en":"Productive efficiency: producing at minimum average cost (min AC); allocative efficiency: producing where price equals marginal cost (P = MC), so that resources are allocated in line with society's preferences."},{"zh":"动态效率与X-无效率","en":"Dynamic efficiency & X-inefficiency","def":"动态效率指随时间通过研发与创新降低成本、改进产品；X-无效率指因缺乏竞争压力，企业的实际成本高于其可达到的最低成本（在成本曲线上方生产）。","def_en":"Dynamic efficiency means reducing costs and improving products over time through R&D and innovation; X-inefficiency means that, because of a lack of competitive pressure, a firm's actual costs are above the lowest attainable costs (it produces above its cost curve)."},{"zh":"政府失灵","en":"Government failure","def":"政府干预反而使资源配置更差、净福利下降的情形，原因包括信息不足、意外后果、监管俘获 (regulatory capture)、政治动机和行政成本。","def_en":"A situation in which government intervention makes resource allocation worse and reduces net welfare, owing to causes such as imperfect information, unintended consequences, regulatory capture, political motives and administrative costs."}],"formulas":[{"name":"利润最大化","f":"MC = MR","note":"且 MC 从下方穿过 MR。","name_en":"Profit maximisation","note_en":"And MC must cut MR from below."},{"name":"收入最大化","f":"MR = 0 (|PED| = 1)","note":"线性需求 P = a − bQ 时，MR = a − 2bQ，故 Q = a ÷ 2b。","name_en":"Revenue maximisation","note_en":"With linear demand P = a − bQ, MR = a − 2bQ, so Q = a ÷ 2b."},{"name":"销售最大化","f":"AR = AC","note":"取满足条件的较大产量，此时只赚正常利润。","name_en":"Sales maximisation","note_en":"Take the larger output that satisfies the condition; the firm then earns only normal profit."},{"name":"配置效率","f":"P = MC","note":"","name_en":"Allocative efficiency","note_en":""},{"name":"价格上限管制","f":"Max % price change = RPI − X","note":"X 为监管者要求的效率提升百分比；RPI 为零售价格指数通胀率。","name_en":"Price-cap regulation","note_en":"X is the efficiency gain (%) required by the regulator; RPI is retail price index inflation."},{"name":"范围经济程度","f":"SC = [C(q_1) + C(q_2) − C(q_1, q_2)] ÷ C(q_1, q_2)","note":"SC > 0 表示存在范围经济。","name_en":"Degree of economies of scope","note_en":"SC > 0 indicates economies of scope."}],"sections":[{"h":"企业追求什么？四种目标的比较","body":"传统理论假设**利润最大化**（MC = MR），但在大公司中所有权（股东）与控制权（经理）分离，经理可能有别的目标：\n- **收入最大化**（MR = 0）：经理薪酬常与营业额挂钩（鲍莫尔 Baumol 模型）\n- **销售最大化**（AR = AC）：追求市场份额，只要求正常利润，可用于阻止进入\n- **满意化**：在多方利益相关者（员工、顾客、社区、政府）之间折中，赚取“足够”的利润\n**数值示例**：需求 P = 100 − 2Q，MC = AC = 20。利润最大化：MR = 100 − 4Q = 20 ⇒ Q = 20，P = 60；收入最大化：MR = 0 ⇒ Q = 25，P = 50；销售最大化：100 − 2Q = 20 ⇒ Q = 40，P = 20。可见产量排序为：利润最大化 < 收入最大化 < 销售最大化。\n**委托–代理问题**的解决办法：股票期权、与利润挂钩的奖金、董事会监督、收购威胁 (threat of takeover)。","h_en":"What do firms aim for? Comparing four objectives","body_en":"Traditional theory assumes **profit maximisation** (MC = MR), but in large companies ownership (shareholders) is separated from control (managers), and managers may have other goals:\n- **Revenue maximisation** (MR = 0): managers' pay is often linked to turnover (the Baumol model)\n- **Sales maximisation** (AR = AC): pursuing market share while requiring only normal profit, which can also deter entry\n- **Satisficing**: compromising among stakeholders (employees, customers, communities, government) and earning \"enough\" profit\n**Numerical example**: demand P = 100 − 2Q, MC = AC = 20. Profit maximisation: MR = 100 − 4Q = 20 ⇒ Q = 20, P = 60; revenue maximisation: MR = 0 ⇒ Q = 25, P = 50; sales maximisation: 100 − 2Q = 20 ⇒ Q = 40, P = 20. So the ranking of output is: profit max < revenue max < sales max.\nRemedies for the **principal–agent problem**: share options, profit-related bonuses, board oversight, and the threat of takeover."},{"h":"企业成长：内部成长与外部成长","body":"**内部成长**（有机增长）：投资新产能、开发新产品、开拓新市场，速度较慢但风险可控。\n**外部成长**：兼并 (merger) 与收购 (takeover)，速度快，分三类：\n- **横向一体化**：如两家超市合并，获得规模经济和市场势力，但可能削弱竞争\n- **纵向一体化**：向后（车企收购电池厂）保障供应；向前（酿酒厂收购酒吧）控制渠道\n- **混合一体化**：进入不相关行业以分散风险，可获**范围经济**，但管理难度大\n**小企业为何能生存**：市场规模小或需求高度个性化、提供利基产品 (niche)、灵活与个性化服务、大企业外包、政府扶持、进入壁垒低，以及规模不经济限制了大企业。","h_en":"Growth of firms: internal vs external growth","body_en":"**Internal growth** (organic growth): investing in new capacity, developing new products and entering new markets; slower but with controllable risk.\n**External growth**: mergers and takeovers; fast, and of three kinds:\n- **Horizontal integration**: e.g. two supermarkets merge, gaining economies of scale and market power but possibly reducing competition\n- **Vertical integration**: backward (a carmaker buys a battery maker) to secure supply; forward (a brewery buys pubs) to control distribution\n- **Conglomerate integration**: entering unrelated industries to spread risk, possibly gaining **economies of scope**, but harder to manage\n**Why small firms survive**: small or highly individualised markets, niche products, flexibility and personal service, subcontracting by large firms, government support, low barriers to entry, and diseconomies of scale that limit large firms."},{"h":"效率的五种含义","body":"- **生产效率**：在 min AC 处生产，没有浪费投入\n- **配置效率**：P = MC，边际收益（社会评价）等于边际成本，总剩余最大\n- **动态效率**：通过研发、创新长期降低成本；垄断利润可能为研发提供资金（熊彼特 Schumpeter 观点）\n- **X-无效率**：缺乏竞争导致管理松懈，成本高于成本曲线\n- **帕累托效率**：不可能在不使任何人变差的前提下使某人变好；完全竞争长期均衡同时满足生产效率与配置效率\n**示例**：垄断者面对 P = 100 − 2Q，MC = 20，选择 Q = 20、P = 60；配置效率要求 Q = 40。无谓损失 (deadweight loss) = ½ × (60 − 20) × (40 − 20) = 400。","h_en":"Five meanings of efficiency","body_en":"- **Productive efficiency**: producing at min AC, with no wasted inputs\n- **Allocative efficiency**: P = MC, marginal benefit (society's valuation) equals marginal cost, and total surplus is maximised\n- **Dynamic efficiency**: lowering costs over time through R&D and innovation; monopoly profit may fund R&D (the Schumpeterian view)\n- **X-inefficiency**: lack of competition leads to managerial slack, so costs are above the cost curve\n- **Pareto efficiency**: it is impossible to make anyone better off without making someone worse off; long-run equilibrium in perfect competition achieves both productive and allocative efficiency\n**Example**: a monopolist facing P = 100 − 2Q with MC = 20 chooses Q = 20, P = 60; allocative efficiency requires Q = 40. Deadweight loss = ½ × (60 − 20) × (40 − 20) = 400."},{"h":"竞争政策、价格管制与所有制","body":"**竞争政策**：审查兼并（市场份额过高时可禁止或附条件批准）、打击卡特尔与滥用支配地位，并通过降低进入壁垒使市场更接近**可竞争市场** (contestable market)。\n**价格上限 RPI − X**：若 RPI = 5%、X = 3%，受管制企业每年最多涨价 2%。企业若降本超过 X% 可保留超额利润，因而有提效激励；难点是 X 定多少。\n**自然垄断定价**：边际成本定价 (P = MC) 实现配置效率但企业亏损（因 AC > MC），需补贴；平均成本定价 (P = AC) 企业收支平衡，但产量低于配置效率水平。\n**私有化**的理由：利润动机与竞争提高效率、减轻财政负担、股东监督；**国有化**的理由：自然垄断、战略产业、外部性与公平、避免重复建设。评价时要看是否同时引入竞争与有效监管。","h_en":"Competition policy, price regulation and ownership","body_en":"**Competition policy**: reviewing mergers (blocking or approving with conditions when market share is too high), fighting cartels and abuse of dominance, and lowering entry barriers to make markets closer to **contestable markets**.\n**RPI − X price cap**: if RPI = 5% and X = 3%, the regulated firm may raise prices by at most 2% a year. If it cuts costs by more than X% it keeps the extra profit, so it has an incentive to be efficient; the difficulty is choosing X.\n**Natural monopoly pricing**: marginal-cost pricing (P = MC) achieves allocative efficiency but the firm makes a loss (because AC > MC) and needs a subsidy; average-cost pricing (P = AC) lets the firm break even, but output is below the allocatively efficient level.\nArguments for **privatisation**: the profit motive and competition raise efficiency, fiscal burdens fall, shareholders monitor managers; arguments for **nationalisation**: natural monopoly, strategic industries, externalities and equity, avoiding duplication of infrastructure. Evaluation depends on whether competition and effective regulation are introduced at the same time."},{"h":"政府失灵：干预也可能出错","body":"市场失灵是干预的必要条件，但不是充分条件。政府失灵的主要来源：\n- **信息不足**：难以准确估计外部成本，税率或补贴定错\n- **意外后果**：如租金管制导致住房短缺、高税导致走私和黑市\n- **监管俘获**：监管机构逐渐代表被监管行业的利益\n- **公共选择理论**：政客追求选票、官僚追求预算，导致短视政策（如选举前减税）\n- **行政与执行成本**：监管和执法成本可能超过所纠正的福利损失","h_en":"Government failure: intervention can go wrong too","body_en":"Market failure is a necessary but not a sufficient condition for intervention. The main sources of government failure:\n- **Imperfect information**: external costs are hard to estimate, so taxes or subsidies are set at the wrong level\n- **Unintended consequences**: e.g. rent controls cause housing shortages; high taxes encourage smuggling and black markets\n- **Regulatory capture**: the regulator comes to serve the interests of the industry it regulates\n- **Public choice theory**: politicians seek votes and bureaucrats seek bigger budgets, leading to short-termist policies (e.g. tax cuts before elections)\n- **Administrative and enforcement costs**: the cost of regulation and enforcement may exceed the welfare loss being corrected"}],"pitfalls":["把收入最大化条件写成 MC = MR 或 P = MC——收入最大化只看需求侧，条件是 MR = 0，与成本无关。","认为销售最大化就是 MR = 0。销售最大化 (AR = AC) 的产量高于收入最大化 (MR = 0) 的产量。","混淆生产效率 (min AC) 与配置效率 (P = MC)；垄断者可能在 min AC 附近生产但仍缺乏配置效率。","认为私有化必然提高效率——若私有化后仍是无竞争的垄断，只是把公共垄断变成私人垄断。","看到市场失灵就断定政府应干预，而忽略干预本身的成本与政府失灵的可能。"],"pitfalls_en":["Writing the revenue-maximisation condition as MC = MR or P = MC — revenue maximisation depends only on the demand side, and the condition is MR = 0, independent of costs.","Thinking sales maximisation means MR = 0. Output under sales maximisation (AR = AC) is higher than output under revenue maximisation (MR = 0).","Confusing productive efficiency (min AC) with allocative efficiency (P = MC); a monopolist may produce near min AC and still be allocatively inefficient.","Assuming privatisation always raises efficiency — if the privatised firm is still a monopoly with no competition, a public monopoly has simply become a private one.","Concluding that government should intervene whenever there is market failure, while ignoring the costs of intervention and the possibility of government failure."],"exams":{"AP":"Micro Unit 4 (monopoly efficiency, regulation)","IB":"2.7 (HL firm objectives/market power), 2.11","AL":"9708 A2 7.3, 7.7, 7.8, 8.1","IEO":"Firm behaviour & government intervention","NEC":"Micro: market structures & government"},"diagram":"monopoly"},{"id":"M1","unit":"macro","title_zh":"宏观经济指标","title_en":"Macroeconomic Indicators","level":"G9+","summary":"宏观经济用三组核心指标来“体检”一个经济体：产出 (GDP)、价格水平 (CPI、GDP平减指数) 与就业 (失业率、劳动参与率)。本课讲清各指标的定义、计算方法与局限，并把它们放进经济周期 (business cycle) 的框架里理解。","concepts":[{"zh":"国内生产总值","en":"Gross Domestic Product (GDP)","def":"一定时期内一国境内生产的所有最终产品和服务 (final goods and services) 的市场价值。只算“最终”产品以避免重复计算 (double counting)。","def_en":"The market value of all final goods and services produced within a country's borders in a given period. Only \"final\" goods are counted, to avoid double counting."},{"zh":"支出法","en":"Expenditure approach","def":"GDP = C + I + G + NX，即消费、投资、政府购买与净出口之和。注意 I 指实物资本投资（厂房、设备、新住房、存货变动），不是买股票。","def_en":"GDP = C + I + G + NX, the sum of consumption, investment, government purchases and net exports. Note that I means investment in physical capital (factories, equipment, new housing, changes in inventories), not buying shares."},{"zh":"收入法","en":"Income approach","def":"把生产过程中产生的收入相加：工资、租金、利息、利润，再加上间接税减补贴、折旧等调整项，理论上等于支出法 GDP。","def_en":"Adds up the incomes generated in production: wages, rent, interest and profit, plus adjustments such as indirect taxes minus subsidies and depreciation. In theory it equals expenditure-approach GDP."},{"zh":"名义GDP与实际GDP","en":"Nominal vs Real GDP","def":"名义GDP按当年价格计算；实际GDP按基年价格计算，剔除了价格变化，只反映产量变化。","def_en":"Nominal GDP is measured at current-year prices; real GDP is measured at base-year prices, which removes the effect of price changes so that it reflects only changes in output."},{"zh":"GDP平减指数","en":"GDP deflator","def":"名义GDP ÷ 实际GDP × 100，衡量国内生产的所有最终产品的整体价格水平。","def_en":"Nominal GDP ÷ Real GDP × 100; it measures the overall price level of all final goods and services produced domestically."},{"zh":"消费者价格指数","en":"Consumer Price Index (CPI)","def":"一篮子固定的典型消费品在当期的成本相对基期成本的比值 × 100，用来计算通货膨胀率。","def_en":"The cost of a fixed basket of typical consumer goods in the current period relative to its cost in the base period, × 100. It is used to calculate the inflation rate."},{"zh":"失业率","en":"Unemployment rate","def":"失业人数 ÷ 劳动力 (labor force) × 100%。失业者必须是没有工作、且在积极找工作的人。","def_en":"Number unemployed ÷ labor force × 100%. To count as unemployed, a person must be without a job and actively looking for work."},{"zh":"劳动参与率","en":"Labor force participation rate (LFPR)","def":"劳动力 ÷ 16岁以上（工作年龄）非机构人口 × 100%。","def_en":"Labor force ÷ non-institutional population aged 16 and over (working-age population) × 100%."},{"zh":"自然失业率","en":"Natural rate of unemployment","def":"摩擦性失业 (frictional) + 结构性失业 (structural)，即周期性失业 (cyclical) 为零、产出处于潜在水平时的失业率。","def_en":"Frictional unemployment + structural unemployment; the unemployment rate when cyclical unemployment is zero and output is at its potential level."},{"zh":"经济周期","en":"Business cycle","def":"实际GDP围绕长期趋势的短期波动，依次经历扩张 (expansion)、峰顶 (peak)、收缩/衰退 (contraction/recession)、谷底 (trough)。","def_en":"Short-run fluctuations of real GDP around its long-run trend, passing in turn through expansion, peak, contraction/recession and trough."}],"formulas":[{"name":"支出法GDP","f":"GDP = C + I + G + (X − M)","note":"转移支付 (transfer payments) 不计入 G。","name_en":"GDP (expenditure approach)","note_en":"Transfer payments are not included in G."},{"name":"GDP平减指数","f":"Deflator = Nominal GDP ÷ Real GDP × 100","note":"基年的平减指数 = 100。","name_en":"GDP deflator","note_en":"The deflator in the base year = 100."},{"name":"实际GDP","f":"Real GDP = Nominal GDP ÷ (Deflator ÷ 100)","note":"近似：实际增长率 ≈ 名义增长率 − 通胀率。","name_en":"Real GDP","note_en":"Approximation: real growth rate ≈ nominal growth rate − inflation rate."},{"name":"CPI与通胀率","f":"CPI_t = 篮子成本_t ÷ 篮子成本_基年 × 100；π = (CPI_t − CPI_t−1) ÷ CPI_t−1 × 100%","note":"通胀率是两个指数之间的百分比变化，不是指数减100（除非上期正好是基年）。","name_en":"CPI and the inflation rate","note_en":"The inflation rate is the percentage change between two index values, not the index minus 100 (unless the previous period happens to be the base year).","f_en":"CPI_t = basket cost_t ÷ basket cost_base × 100; π = (CPI_t − CPI_t−1) ÷ CPI_t−1 × 100%"},{"name":"失业率","f":"u = 失业人数 ÷ 劳动力 × 100%；劳动力 = 就业 + 失业","note":"分母是劳动力，不是总人口。","name_en":"Unemployment rate","note_en":"The denominator is the labor force, not the total population.","f_en":"u = unemployed ÷ labour force × 100%; labour force = employed + unemployed"},{"name":"劳动参与率","f":"LFPR = 劳动力 ÷ 工作年龄人口 × 100%","note":"","name_en":"Labor force participation rate","note_en":"","f_en":"LFPR = labour force ÷ working-age population × 100%"}],"sections":[{"h":"GDP：算什么，不算什么","body":"GDP衡量的是**当期、境内、最终**产品与服务的市场价值。\n- **计入**：新生产的汽车、新建住房（计入投资 I）、企业存货增加（计入 I）、政府修路和支付公务员工资（计入 G）。\n- **不计入**：二手商品交易（不是当期生产）、股票债券买卖（金融资产转移）、转移支付如失业救济金和养老金（没有对应的产出）、中间产品（已包含在最终产品价值中）、非市场活动（家务劳动）与地下经济。\n支出法、收入法与增加值法 (value-added) 三种算法在理论上相等，因为一笔支出就是另一方的收入。","h_en":"GDP: what counts and what doesn't","body_en":"GDP measures the market value of **current-period, domestically produced, final** goods and services.\n- **Included**: newly produced cars, newly built houses (counted in investment, I), increases in firms' inventories (counted in I), and the government building roads and paying civil servants' salaries (counted in G).\n- **Excluded**: second-hand sales (not produced in the current period), buying and selling stocks and bonds (transfers of financial assets), transfer payments such as unemployment benefits and pensions (no corresponding output), intermediate goods (already included in the value of final goods), non-market activity (household work) and the underground economy.\nThe expenditure, income and value-added approaches are equal in theory, because every dollar of spending is someone else's income."},{"h":"名义、实际与价格指数","body":"**例题**：某年名义GDP为 2,310，GDP平减指数为 105（基年 = 100）。实际GDP = 2,310 ÷ 1.05 = **2,200**。若基年（上一年）GDP为 2,000，则实际增长率 = 2,200 ÷ 2,000 − 1 = **10%**；而名义增长率为 15.5%，近似式 15.5% − 5% = 10.5%，与精确值略有差异。\n**CPI与平减指数的区别**：\n- CPI 用固定篮子，只含消费品（包括进口消费品）；平减指数覆盖所有国内生产的最终产品，权重随当期产量变化。\n- CPI 常被认为高估通胀：替代偏差 (substitution bias)、新产品偏差、质量改进偏差。","h_en":"Nominal, real and price indices","body_en":"**Worked example**: In a given year nominal GDP is 2,310 and the GDP deflator is 105 (base year = 100). Real GDP = 2,310 ÷ 1.05 = **2,200**. If GDP in the base year (the previous year) was 2,000, the real growth rate = 2,200 ÷ 2,000 − 1 = **10%**; the nominal growth rate is 15.5%, and the approximation 15.5% − 5% = 10.5% differs slightly from the exact value.\n**How the CPI differs from the deflator**:\n- The CPI uses a fixed basket and includes only consumer goods (including imported consumer goods); the deflator covers all domestically produced final goods, with weights that change with current output.\n- The CPI is generally thought to overstate inflation because of substitution bias, new-product bias and quality-improvement bias."},{"h":"就业统计：谁是失业者","body":"工作年龄人口分成三类：就业、失业、非劳动力 (not in labor force)。\n**例题**：工作年龄人口 2.5 亿，劳动力 1.6 亿，就业 1.48 亿。失业 = 0.12 亿；失业率 = 12 ÷ 160 = **7.5%**；LFPR = 160 ÷ 250 = **64%**。\n**沮丧工人 (discouraged workers)** 放弃找工作后退出劳动力：失业人数和劳动力同时减少，失业率下降，但这并不代表就业形势变好——这是失业率的主要局限之一。兼职但想全职的人 (underemployed) 也被算作就业。","h_en":"Employment statistics: who counts as unemployed","body_en":"The working-age population is divided into three groups: employed, unemployed, and not in the labor force.\n**Worked example**: The working-age population is 250 million, the labor force is 160 million and 148 million are employed. Unemployed = 12 million; unemployment rate = 12 ÷ 160 = **7.5%**; LFPR = 160 ÷ 250 = **64%**.\n**Discouraged workers** who give up looking for work leave the labor force: the number unemployed and the labor force both fall, so the unemployment rate falls, yet this does not mean the job market has improved — one of the main limitations of the unemployment rate. People working part-time who want full-time work (the underemployed) are also counted as employed."},{"h":"失业类型与经济周期","body":"- **摩擦性失业**：换工作、刚毕业找工作期间的短暂失业，信息不完全导致，总是存在。\n- **结构性失业**：技能或地区与岗位不匹配，例如技术变革淘汰了某些岗位。\n- **周期性失业**：由衰退时总需求不足造成，经济扩张时消失。\n- **季节性失业**常归入摩擦性。\n自然失业率 = 摩擦性 + 结构性。实际失业率高于自然失业率时，实际GDP低于潜在GDP，存在**衰退缺口**；奥肯定律 (Okun's law) 的经验法则：周期性失业每高出1个百分点，产出约低于潜在水平2%。","h_en":"Types of unemployment and the business cycle","body_en":"- **Frictional unemployment**: short spells of unemployment while changing jobs or looking for a first job after graduating, caused by imperfect information; it always exists.\n- **Structural unemployment**: a mismatch between workers' skills or location and the available jobs, e.g. when technological change makes certain jobs obsolete.\n- **Cyclical unemployment**: caused by insufficient aggregate demand in a recession; it disappears when the economy expands.\n- **Seasonal unemployment** is usually classified as frictional.\nNatural rate of unemployment = frictional + structural. When the actual unemployment rate is above the natural rate, real GDP is below potential GDP and there is a **recessionary gap**. Okun's law rule of thumb: for every 1 percentage point of cyclical unemployment, output is roughly 2% below its potential level."}],"pitfalls":["把买股票、买二手车或政府发放的失业救济金算进GDP。","计算失业率时用总人口或工作年龄人口作分母，而不是劳动力。","把CPI指数值（如117.9）直接等同于通胀率，或忘了通胀率要用上一期指数作分母。","认为失业率下降一定意味着就业增加——可能只是沮丧工人退出了劳动力。","以为自然失业率为零；充分就业时仍存在摩擦性和结构性失业。"],"exams":{"AP":"Macro Unit 2 (2.1–2.7)","IB":"3.1, 3.3","AL":"9708 AS 4.1, 4.5–4.6; A2 9.1, 9.4","IEO":"Macroeconomic measurement: GDP, inflation, unemployment","NEC":"Macro: economic indicators"},"diagram":null,"summary_en":"Macroeconomics uses three sets of core indicators to give an economy a \"health check\": output (GDP), the price level (CPI, GDP deflator) and employment (unemployment rate, labor force participation rate). This lesson explains how each indicator is defined and calculated, what its limitations are, and how they fit into the framework of the business cycle.","pitfalls_en":["Counting purchases of shares, second-hand cars or government unemployment benefits in GDP.","Using the total population or the working-age population as the denominator when calculating the unemployment rate, instead of the labor force.","Treating a CPI index value (e.g. 117.9) as if it were the inflation rate, or forgetting that the inflation rate uses the previous period's index as the denominator.","Assuming that a fall in the unemployment rate must mean more people are employed — it may simply be that discouraged workers have left the labor force.","Thinking the natural rate of unemployment is zero; at full employment there is still frictional and structural unemployment."]},{"id":"M2","unit":"macro","title_zh":"总需求与总供给","title_en":"Aggregate Demand & Aggregate Supply","level":"G10+","summary":"AD–AS 模型是分析短期波动与长期均衡的核心工具。本课解释总需求为什么向下倾斜、哪些因素使AD与SRAS移动、LRAS为何垂直，以及衰退缺口/通胀缺口如何通过工资调整自我修正。","concepts":[{"zh":"总需求","en":"Aggregate Demand (AD)","def":"在各个价格水平下，家庭、企业、政府和外国对本国实际产出的总需求量，AD = C + I + G + NX。","def_en":"The total quantity of the country's real output demanded by households, firms, the government and foreigners at each price level; AD = C + I + G + NX."},{"zh":"财富效应","en":"Wealth (real balances) effect","def":"价格水平下降使货币与名义资产的实际购买力上升，家庭增加消费。","def_en":"A fall in the price level raises the real purchasing power of money and nominal assets, so households increase consumption."},{"zh":"利率效应","en":"Interest-rate effect","def":"价格水平下降使货币需求减少、利率下降，从而刺激投资和耐用品消费。","def_en":"A fall in the price level reduces money demand and lowers interest rates, which stimulates investment and spending on consumer durables."},{"zh":"汇率/国际替代效应","en":"Exchange-rate (foreign purchases) effect","def":"本国价格水平下降使本国商品相对外国商品更便宜，净出口增加。","def_en":"A fall in the domestic price level makes domestic goods cheaper relative to foreign goods, so net exports increase."},{"zh":"短期总供给","en":"Short-run Aggregate Supply (SRAS)","def":"向上倾斜，因为短期内名义工资和部分投入品价格具有粘性 (sticky)，价格水平上升会提高企业利润与产量。","def_en":"Slopes upward because in the short run nominal wages and some input prices are sticky, so a higher price level raises firms' profits and output."},{"zh":"长期总供给","en":"Long-run Aggregate Supply (LRAS)","def":"在潜在产出 (potential output, Y_f) 处垂直：长期所有价格和工资完全调整，产出由资源和技术决定，与价格水平无关。","def_en":"Vertical at potential output (Y_f): in the long run all prices and wages fully adjust, and output is determined by resources and technology, independent of the price level."},{"zh":"衰退缺口","en":"Recessionary (negative output) gap","def":"实际产出低于潜在产出，失业率高于自然失业率。","def_en":"Actual output is below potential output and the unemployment rate is above the natural rate."},{"zh":"通胀缺口","en":"Inflationary (positive output) gap","def":"实际产出高于潜在产出，失业率低于自然失业率，工资和物价面临上涨压力。","def_en":"Actual output is above potential output and the unemployment rate is below the natural rate, putting upward pressure on wages and prices."},{"zh":"需求拉动型通胀","en":"Demand-pull inflation","def":"AD 右移导致价格水平上升，同时产出增加。","def_en":"A rightward shift of AD raises the price level while output also increases."},{"zh":"成本推动型通胀与滞胀","en":"Cost-push inflation & stagflation","def":"SRAS 左移（如油价上涨）导致价格水平上升而产出下降、失业上升，即滞胀。","def_en":"A leftward shift of SRAS (e.g. a rise in oil prices) raises the price level while output falls and unemployment rises — stagflation."}],"formulas":[{"name":"总需求","f":"AD = C + I + G + (X − M)","note":"价格水平变化引起沿AD曲线移动；其他因素变化使AD曲线移动。","name_en":"Aggregate demand","note_en":"A change in the price level causes a movement along the AD curve; changes in other factors shift the AD curve."},{"name":"产出缺口","f":"Output gap = (Y − Y_f) ÷ Y_f × 100%","note":"负值为衰退缺口，正值为通胀缺口。","name_en":"Output gap","note_en":"A negative value is a recessionary gap; a positive value is an inflationary gap."},{"name":"线性AD–AS均衡","f":"AD: Y = a − bP；SRAS: Y = c + dP ⇒ P* = (a − c) ÷ (b + d)","note":"竞赛常考代数形式。","name_en":"Linear AD–AS equilibrium","note_en":"The algebraic form is frequently tested in competitions."}],"sections":[{"h":"AD：为什么向下倾斜、什么让它移动","body":"AD向下倾斜**不是**因为微观的替代效应，而是三个宏观效应：**财富效应、利率效应、汇率效应**。\n使AD**右移**的因素：\n- 消费者信心上升、家庭财富增加、减税（C↑）\n- 企业预期改善、利率下降（I↑）\n- 政府购买增加（G↑）\n- 外国收入上升、本币贬值（NX↑）\n本币升值、利率上升、信心下降则使AD左移。","h_en":"AD: why it slopes downward and what shifts it","body_en":"AD slopes downward **not** because of the microeconomic substitution effect, but because of three macroeconomic effects: the **wealth effect, the interest-rate effect and the exchange-rate effect**.\nFactors that shift AD to the **right**:\n- Higher consumer confidence, greater household wealth, tax cuts (C↑)\n- Improved business expectations, lower interest rates (I↑)\n- Higher government purchases (G↑)\n- Higher foreign incomes, a depreciation of the domestic currency (NX↑)\nAn appreciation of the domestic currency, higher interest rates or falling confidence shift AD to the left."},{"h":"SRAS 与 LRAS","body":"SRAS 移动的主要原因是**单位生产成本**变化：名义工资、原材料/能源价格、生产率、营业税与补贴、供给冲击。\n- 油价上涨、名义工资上升 → SRAS 左移\n- 生产率提高、投入品价格下降 → SRAS 右移\nLRAS 由资源数量与质量（劳动、资本、人力资本）、技术和制度决定。技术进步或人力资本增加使 LRAS（和SRAS）右移，代表潜在产出增长。价格水平变化只会沿曲线移动。","h_en":"SRAS and LRAS","body_en":"SRAS shifts mainly because of changes in **per-unit production costs**: nominal wages, raw material/energy prices, productivity, business taxes and subsidies, and supply shocks.\n- Higher oil prices, higher nominal wages → SRAS shifts left\n- Higher productivity, lower input prices → SRAS shifts right\nLRAS is determined by the quantity and quality of resources (labor, capital, human capital), technology and institutions. Technological progress or more human capital shifts LRAS (and SRAS) to the right, representing growth in potential output. A change in the price level only causes a movement along the curves."},{"h":"均衡、缺口与自我调整","body":"短期均衡在 AD 与 SRAS 交点，长期均衡还要求该点位于 LRAS 上。\n**例题**：AD: Y = 1200 − 4P，SRAS: Y = 200 + 6P，潜在产出 Y_f = 900。均衡 1200 − 4P = 200 + 6P ⇒ P = 100，Y = 800，存在 100 的衰退缺口。若要靠扩张AD回到900：SRAS 上 Y = 900 时 P = 116.7，所需AD水平移动 ≈ **166.7**（大于缺口100，因为价格上升会“吃掉”一部分扩张）。\n**自我调整 (self-correction)**：衰退缺口时失业高于自然率，名义工资最终下降，SRAS 右移，价格下降、产出回到 Y_f；通胀缺口时工资上涨，SRAS 左移，价格进一步上升、产出回落到 Y_f。凯恩斯学派强调工资向下粘性使这一过程可能很慢，因此主张政策干预。","h_en":"Equilibrium, gaps and self-correction","body_en":"Short-run equilibrium is where AD intersects SRAS; long-run equilibrium also requires that this point lie on LRAS.\n**Worked example**: AD: Y = 1200 − 4P, SRAS: Y = 200 + 6P, potential output Y_f = 900. Equilibrium: 1200 − 4P = 200 + 6P ⇒ P = 100, Y = 800, so there is a recessionary gap of 100. To return to 900 by expanding AD: on SRAS, Y = 900 when P = 116.7, so the required horizontal shift of AD ≈ **166.7** (larger than the gap of 100, because the rise in prices \"eats up\" part of the expansion).\n**Self-correction**: in a recessionary gap unemployment is above the natural rate, so nominal wages eventually fall, SRAS shifts right, the price level falls and output returns to Y_f; in an inflationary gap wages rise, SRAS shifts left, the price level rises further and output falls back to Y_f. Keynesians stress that downward wage stickiness can make this process very slow, and therefore argue for policy intervention."},{"h":"通胀的两种来源与滞胀困境","body":"- **需求拉动**：AD 右移 → P↑、Y↑、失业↓。\n- **成本推动**：SRAS 左移 → P↑、Y↓、失业↑（**滞胀 stagflation**）。\n滞胀给政策制定者带来两难：若扩张AD以恢复产出，价格水平会进一步上升；若收缩AD以压通胀，产出和就业会进一步下降。这也说明供给侧政策（提高生产率）的重要性。","h_en":"Two sources of inflation and the stagflation dilemma","body_en":"- **Demand-pull**: AD shifts right → P↑, Y↑, unemployment↓.\n- **Cost-push**: SRAS shifts left → P↑, Y↓, unemployment↑ (**stagflation**).\nStagflation presents policymakers with a dilemma: if they expand AD to restore output, the price level rises further; if they contract AD to curb inflation, output and employment fall further. This also shows the importance of supply-side policies (raising productivity)."}],"pitfalls":["用微观的替代效应/收入效应解释AD向下倾斜。","把价格水平变化当作使AD或SRAS移动的因素（它只引起沿曲线移动）。","认为需求冲击能长期提高产出——长期产出回到LRAS，只剩价格水平变化。","混淆SRAS与LRAS的移动因素：名义工资变化只移动SRAS，不移动LRAS。","代数题中把所需AD移动量直接等同于产出缺口，忽略了SRAS的斜率。"],"exams":{"AP":"Macro Unit 3 (3.1, 3.3–3.7)","IB":"3.2","AL":"9708 AS 4.3","IEO":"Aggregate demand & aggregate supply","NEC":"Macro: AD–AS model"},"diagram":"adas","summary_en":"The AD–AS model is the core tool for analysing short-run fluctuations and long-run equilibrium. This lesson explains why aggregate demand slopes downward, what shifts AD and SRAS, why LRAS is vertical, and how recessionary and inflationary gaps correct themselves through wage adjustment.","pitfalls_en":["Using the microeconomic substitution/income effects to explain why AD slopes downward.","Treating a change in the price level as a factor that shifts AD or SRAS (it only causes a movement along the curve).","Believing a demand shock can raise output permanently — in the long run output returns to LRAS and only the price level changes.","Confusing the determinants of SRAS and LRAS: a change in nominal wages shifts only SRAS, not LRAS.","In algebra questions, equating the required shift in AD with the output gap and ignoring the slope of SRAS."]},{"id":"M3","unit":"macro","title_zh":"财政政策","title_en":"Fiscal Policy","level":"G10+","summary":"财政政策指政府通过调整购买与税收来影响总需求。本课推导支出乘数、税收乘数和平衡预算乘数，区分自动稳定器与相机抉择政策，并讨论赤字与债务、挤出效应和政策时滞等局限。","concepts":[{"zh":"边际消费倾向","en":"Marginal propensity to consume (MPC)","def":"可支配收入每增加1元中用于消费的比例，MPC = ΔC ÷ ΔYd；MPS = 1 − MPC。","def_en":"The fraction of each extra dollar of disposable income that is spent on consumption; MPC = ΔC ÷ ΔYd; MPS = 1 − MPC."},{"zh":"支出乘数","en":"Spending multiplier","def":"自主支出（G、I 等）每变化1元引起的均衡产出最大变化，= 1 ÷ MPS。","def_en":"The maximum change in equilibrium output caused by each $1 change in autonomous spending (G, I, etc.); = 1 ÷ MPS."},{"zh":"税收乘数","en":"Tax multiplier","def":"= −MPC ÷ MPS。税收变化先影响可支配收入，第一轮只有MPC部分被消费，所以绝对值比支出乘数小1。","def_en":"= −MPC ÷ MPS. A tax change first affects disposable income, and in the first round only the MPC share is spent, so its absolute value is 1 smaller than the spending multiplier."},{"zh":"平衡预算乘数","en":"Balanced-budget multiplier","def":"G 与 T 同时等额增加时，产出增加量等于该变化额，乘数 = 1（简单模型）。","def_en":"When G and T increase by the same amount at the same time, output increases by exactly that amount; the multiplier = 1 (in the simple model)."},{"zh":"相机抉择财政政策","en":"Discretionary fiscal policy","def":"政府主动通过立法改变支出或税率，如经济刺激计划。","def_en":"The government actively changes spending or tax rates through legislation, e.g. an economic stimulus package."},{"zh":"自动稳定器","en":"Automatic stabilizers","def":"无需新立法就会逆周期变化的制度安排，如累进所得税和失业保险。","def_en":"Institutional arrangements that change counter-cyclically without any new legislation, such as progressive income taxes and unemployment insurance."},{"zh":"预算赤字与国债","en":"Budget deficit vs national debt","def":"赤字是一年内支出超过税收的流量 (flow)；国债是历年赤字减盈余累积的存量 (stock)。","def_en":"The deficit is a flow: the amount by which spending exceeds tax revenue in one year. The national debt is a stock: the accumulation of past deficits minus surpluses."},{"zh":"挤出效应","en":"Crowding out","def":"政府借款增加推高实际利率，减少私人投资（及利率敏感的消费），削弱扩张性财政政策的效果。","def_en":"Increased government borrowing pushes up real interest rates, reducing private investment (and interest-sensitive consumption) and weakening the effect of expansionary fiscal policy."},{"zh":"政策时滞","en":"Policy lags","def":"识别时滞 (recognition)、决策/立法时滞 (decision/legislative)、执行与生效时滞 (implementation/impact)，财政政策的内部时滞通常较长。","def_en":"The recognition lag, the decision/legislative lag and the implementation/impact lag; the inside lags of fiscal policy are usually long."}],"formulas":[{"name":"支出乘数","f":"k = 1 ÷ (1 − MPC) = 1 ÷ MPS","note":"ΔY = k × ΔG（或 ΔI）。","name_en":"Spending multiplier","note_en":"ΔY = k × ΔG (or ΔI)."},{"name":"税收乘数","f":"k_T = −MPC ÷ MPS","note":"ΔY = k_T × ΔT；减税时 ΔT 为负。","name_en":"Tax multiplier","note_en":"ΔY = k_T × ΔT; for a tax cut ΔT is negative."},{"name":"平衡预算乘数","f":"ΔG = ΔT ⇒ ΔY = ΔG","note":"乘数为1。","name_en":"Balanced-budget multiplier","note_en":"The multiplier is 1."},{"name":"开放经济含税乘数","f":"k = 1 ÷ [1 − MPC × (1 − t) + MPM]","note":"t 为边际税率，MPM 为边际进口倾向；也可写成 1 ÷ (MPS + MPT + MPM) 形式（按收入定义）。","name_en":"Open-economy multiplier with taxes","note_en":"t is the marginal tax rate and MPM is the marginal propensity to import; it can also be written as 1 ÷ (MPS + MPT + MPM) (when defined relative to income)."},{"name":"所需政策规模","f":"所需 ΔG = 产出缺口 ÷ k；所需 ΔT = 产出缺口 ÷ k_T","note":"是缺口除以乘数，不是缺口本身。","name_en":"Required policy size","note_en":"It is the gap divided by the multiplier, not the gap itself.","f_en":"Required ΔG = output gap ÷ k; required ΔT = output gap ÷ k_T"}],"sections":[{"h":"乘数原理","body":"政府多花1元，就成为某人的收入，其中 MPC 部分被再次花掉，如此循环：ΔY = ΔG × (1 + MPC + MPC² + …) = ΔG ÷ (1 − MPC)。\n**例题**：MPC = 0.8，存在 150 亿美元的衰退缺口。\n- 支出乘数 = 1 ÷ 0.2 = 5，需 ΔG = 150 ÷ 5 = **30**。\n- 税收乘数 = −0.8 ÷ 0.2 = −4，需减税 150 ÷ 4 = **37.5**。\n- 若 G 与 T 同时增加 50，ΔY = 50 × 5 − 50 × 4 = **50**（平衡预算乘数 = 1）。\n当考虑所得税和进口“漏出” (leakages) 时乘数变小：MPC = 0.8、t = 0.25、MPM = 0.1 ⇒ k = 1 ÷ (1 − 0.6 + 0.1) = 2。","h_en":"The multiplier principle","body_en":"Each extra dollar the government spends becomes someone's income, of which the MPC share is spent again, and so on: ΔY = ΔG × (1 + MPC + MPC² + …) = ΔG ÷ (1 − MPC).\n**Worked example**: MPC = 0.8 and there is a recessionary gap of 150 (in units of $100 million).\n- Spending multiplier = 1 ÷ 0.2 = 5, so ΔG = 150 ÷ 5 = **30** is needed.\n- Tax multiplier = −0.8 ÷ 0.2 = −4, so a tax cut of 150 ÷ 4 = **37.5** is needed.\n- If G and T both increase by 50, ΔY = 50 × 5 − 50 × 4 = **50** (balanced-budget multiplier = 1).\nOnce income taxes and imports are taken into account as \"leakages\", the multiplier becomes smaller: MPC = 0.8, t = 0.25, MPM = 0.1 ⇒ k = 1 ÷ (1 − 0.6 + 0.1) = 2."},{"h":"扩张性与紧缩性财政政策","body":"- **衰退缺口**：增加政府购买、减税、增加转移支付 → AD 右移（扩张性）。\n- **通胀缺口**：减少政府购买、增税 → AD 左移（紧缩性）。\n**自动稳定器**：衰退时收入下降，累进税使税收自动减少、失业救济自动增加，缓冲可支配收入下降；繁荣时相反。它们不需要立法，因此没有决策时滞，但力度有限。","h_en":"Expansionary and contractionary fiscal policy","body_en":"- **Recessionary gap**: increase government purchases, cut taxes, increase transfer payments → AD shifts right (expansionary).\n- **Inflationary gap**: reduce government purchases, raise taxes → AD shifts left (contractionary).\n**Automatic stabilizers**: in a recession incomes fall, so under progressive taxation tax revenue falls automatically and unemployment benefits rise automatically, cushioning the fall in disposable income; in a boom the opposite happens. They require no legislation, so there is no decision lag, but their strength is limited."},{"h":"赤字、债务与挤出","body":"赤字 = G + 转移支付 − 税收（某一年）；债务 = 累积赤字 − 累积盈余。例如初始债务 500，之后三年赤字 40、赤字 30、盈余 10，债务 = 500 + 40 + 30 − 10 = **560**。\n政府为赤字融资需在可贷资金市场借款，推高实际利率，挤出私人投资 (crowding out)，长期可能降低资本积累和经济增长。挤出程度在经济深度衰退、利率接近零时较小，在接近充分就业时较大。\n**李嘉图等价 (Ricardian equivalence)**：若家庭预期今天的举债减税意味着未来增税，会把减税全部储蓄起来，减税对消费无影响——这是竞赛常考的理论极端情形。","h_en":"Deficits, debt and crowding out","body_en":"Deficit = G + transfer payments − taxes (in a given year); debt = accumulated deficits − accumulated surpluses. For example, with initial debt of 500 followed by three years with a deficit of 40, a deficit of 30 and a surplus of 10, debt = 500 + 40 + 30 − 10 = **560**.\nTo finance a deficit the government must borrow in the loanable funds market, which pushes up real interest rates and crowds out private investment; in the long run this may reduce capital accumulation and economic growth. Crowding out is small when the economy is in a deep recession with interest rates near zero, and large when the economy is close to full employment.\n**Ricardian equivalence**: if households expect that a debt-financed tax cut today means higher taxes in the future, they will save the entire tax cut, so the tax cut has no effect on consumption — a theoretical extreme case that is often tested in competitions."},{"h":"财政政策的局限","body":"- **时滞**：识别问题、立法讨论、项目执行都需时间，刺激可能在经济已复苏时才生效，反而加剧波动。\n- **挤出效应**与**开放经济漏出**（进口）削弱乘数。\n- **政治约束**：增加支出容易、削减困难，可能形成赤字偏向 (deficit bias)。\n- **债务可持续性**：债务/GDP 过高会提高利息负担和融资风险。","h_en":"Limitations of fiscal policy","body_en":"- **Lags**: recognising the problem, debating legislation and implementing projects all take time, so a stimulus may only take effect once the economy has already recovered, making fluctuations worse.\n- **Crowding out** and **open-economy leakages** (imports) weaken the multiplier.\n- **Political constraints**: raising spending is easy but cutting it is hard, which can create a deficit bias.\n- **Debt sustainability**: a very high debt-to-GDP ratio raises the interest burden and financing risk."}],"pitfalls":["把税收乘数与支出乘数混为一谈：税收乘数绝对值 = MPC ÷ MPS，比支出乘数小 1。","计算所需政策规模时直接用缺口数额，而忘了除以乘数。","认为平衡预算（G、T 等额增加）对产出没有影响——简单模型下乘数是1。","混淆赤字（流量）与债务（存量）。","把中央银行的公开市场操作当作财政政策，或把自动稳定器说成相机抉择政策。"],"exams":{"AP":"Macro Unit 3 (3.2, 3.8–3.9); Unit 5 (5.4–5.5)","IB":"3.6 (HL: multiplier)","AL":"9708 AS 5.1; A2 9.2, 10.1","IEO":"Fiscal policy & government budget","NEC":"Macro: fiscal policy"},"diagram":"adas","summary_en":"Fiscal policy means the government changing its purchases and taxes to influence aggregate demand. This lesson derives the spending multiplier, the tax multiplier and the balanced-budget multiplier, distinguishes automatic stabilizers from discretionary policy, and discusses limitations such as deficits and debt, crowding out and policy lags.","pitfalls_en":["Confusing the tax multiplier with the spending multiplier: the absolute value of the tax multiplier = MPC ÷ MPS, which is 1 smaller than the spending multiplier.","Using the size of the gap directly when calculating the required policy change, and forgetting to divide by the multiplier.","Believing a balanced budget change (equal increases in G and T) has no effect on output — in the simple model the multiplier is 1.","Confusing the deficit (a flow) with the debt (a stock).","Treating the central bank's open market operations as fiscal policy, or describing automatic stabilizers as discretionary policy."]},{"id":"M4","unit":"macro","title_zh":"货币与银行","title_en":"Money & Banking","level":"G10+","summary":"货币是经济运行的“润滑剂”。本课介绍货币的职能与层次 (M1/M2)，用T形账户演示部分准备金银行如何通过贷款创造货币，并建立货币市场模型和货币数量论 MV = PY，解释名义利率和长期通胀的决定。","concepts":[{"zh":"货币的职能","en":"Functions of money","def":"交换媒介 (medium of exchange)、计价单位 (unit of account)、价值储藏 (store of value)，有时加上延期支付标准。","def_en":"Medium of exchange, unit of account and store of value; sometimes a standard of deferred payment is added."},{"zh":"M1","en":"M1","def":"流动性最强的货币：流通中的现金、活期/支票存款 (checkable deposits)，2020年后美联储也把储蓄存款计入M1。","def_en":"The most liquid money: currency in circulation and checkable (demand) deposits; since 2020 the Federal Reserve has also included savings deposits in M1."},{"zh":"M2","en":"M2","def":"M1 加上小额定期存款 (sm
