 trade area (FTA)**: tariffs removed between members, each keeping its own external tariffs (rules of origin needed), e.g. USMCA and the ASEAN Free Trade Area.\n- **Customs union**: FTA + a **common external tariff**, e.g. Mercosur.\n- **Common market**: customs union + free movement of labour and capital.\n- **Economic and monetary union**: common market + a single currency and monetary policy, e.g. the eurozone.\n**Trade creation vs trade diversion**: if country A levies a 20% tariff on all imports, non-member C's cost is 100 (120 with the tariff) and partner B's cost is 110; after an FTA with B, A switches to importing from B (110 < 120), so the consumer price falls by 10, but the government loses tariff revenue of 20 and the world uses 10 more in resources per unit — this is **trade diversion**.\n**WTO principles**: non-discrimination (MFN, national treatment), reciprocity, bound tariffs, transparency, and dispute settlement (panels → the Appellate Body, which has been paralysed since 2019 because of vacancies).\n**Globalisation**: driven by falling transport and communication costs, liberalisation of trade and capital, and MNCs' global value chains; the benefits are efficiency, technology diffusion, lower prices and poverty reduction; the costs are structural unemployment, wider inequality, environmental pressure, contagion of financial crises and limits on sovereignty."}],"pitfalls":["把关税收入计算为关税 × 征税前的进口量；应使用征税后（较少的）进口量。","把消费者剩余的全部损失当作社会净损失；其中一部分转移给了生产者和政府，净损失只有两个 DWL 三角形。","认为配额和关税福利完全相同；配额租金可能归外国出口商，使本国损失更大，且配额下需求增加不会增加进口。","把贸易条件“改善”等同于贸易差额改善；ToT 是价格比率，不是出口量或贸易余额。","认为所有自贸区都提高福利；若贸易转移效应大于贸易创造效应，一体化可能降低成员国福利。"],"pitfalls_en":["Calculating tariff revenue as the tariff × pre-tariff imports; the post-tariff (smaller) volume of imports must be used.","Treating the whole loss of consumer surplus as the net social loss; part of it is transferred to producers and the government, and the net loss is only the two DWL triangles.","Believing quotas and tariffs have identical welfare effects; quota rents may go to foreign exporters, making the home loss larger, and under a quota an increase in demand does not raise imports.","Equating an \"improvement\" in the terms of trade with an improvement in the trade balance; the ToT is a price ratio, not export volume or the trade balance.","Assuming every free trade area raises welfare; if trade diversion outweighs trade creation, integration can reduce members' welfare."],"exams":{"AP":"Micro 2.9 (international trade & public policy)","IB":"4.1–4.4","AL":"9708 AS 6.1–6.2; A2 11.6","IEO":"Protectionism & trade policy","NEC":"International economics"},"diagram":"tariff"},{"id":"F1","unit":"finance","title_zh":"货币时间价值","title_en":"Time Value of Money","level":"G9+","summary":"今天的 1 元比一年后的 1 元更值钱，因为今天的钱可以投资赚取利息，而且未来存在不确定性与通胀。本课学习单利与复利、终值与现值、有效年利率、年金与贷款月供、NPV 与 IRR 项目决策，以及名义与实际收益率——这是 IEO 金融部分与所有投资决策的基础。","concepts":[{"zh":"单利","en":"Simple Interest","def":"只对本金计息，利息不再生息。利息 = 本金 × 利率 × 年数。","def_en":"Interest is paid only on the principal; interest does not itself earn interest. Interest = principal × rate × number of years."},{"zh":"复利","en":"Compound Interest","def":"利息加入本金继续计息（利滚利），期数越长、复利频率越高，终值越大。","def_en":"Interest is added to the principal and itself earns interest (interest on interest); the longer the period and the more frequent the compounding, the larger the future value."},{"zh":"终值与现值","en":"Future Value / Present Value","def":"终值是今天一笔钱在未来某时点的价值；现值是未来一笔钱折算到今天的价值，折现是复利的逆运算。","def_en":"Future value is what a sum of money today will be worth at some future date; present value is what a future sum is worth in today's terms. Discounting is the reverse of compounding."},{"zh":"有效年利率","en":"Effective Annual Rate (EAR)","def":"考虑一年内复利次数后的真实年化利率；名义年利率 (APR) 相同时，复利越频繁 EAR 越高。","def_en":"The true annualised interest rate once the number of compounding periods within a year is taken into account; for the same nominal annual rate (APR), the more frequent the compounding, the higher the EAR."},{"zh":"年金","en":"Annuity","def":"在固定期数内每期金额相等的一串现金流，如房贷月供、养老金领取；永续年金 (perpetuity) 则无限期支付。","def_en":"A series of equal cash flows paid each period over a fixed number of periods, such as mortgage repayments or pension payouts; a perpetuity pays forever."},{"zh":"净现值","en":"Net Present Value (NPV)","def":"所有未来现金流按折现率折现后的现值之和减去初始投资；NPV > 0 表示项目创造价值。","def_en":"The sum of the present values of all future cash flows, discounted at the discount rate, minus the initial investment; NPV > 0 means the project creates value."},{"zh":"内部收益率","en":"Internal Rate of Return (IRR)","def":"使项目 NPV 恰好等于 0 的折现率；IRR 高于资本成本时项目可接受。","def_en":"The discount rate at which a project's NPV is exactly zero; a project is acceptable if its IRR exceeds the cost of capital."},{"zh":"实际利率","en":"Real Interest Rate","def":"扣除通胀后的利率，衡量购买力的真实增长；费雪方程 (Fisher equation) 描述名义利率、实际利率与通胀的关系。","def_en":"The interest rate after adjusting for inflation, measuring the true growth in purchasing power; the Fisher equation describes the relationship between the nominal interest rate, the real interest rate and inflation."},{"zh":"72 法则","en":"Rule of 72","def":"资金翻倍所需年数 ≈ 72 ÷ 年利率（百分数），在 6%–10% 附近最准确。","def_en":"Years for money to double ≈ 72 ÷ annual interest rate (as a percentage); most accurate for rates around 6%–10%."}],"formulas":[{"name":"复利终值","f":"FV = PV × (1 + r)^n","note":"n 为期数，r 为每期利率；单利则为 FV = PV × (1 + r×n)。","name_en":"Future Value with Compound Interest","note_en":"n is the number of periods and r the interest rate per period; with simple interest, FV = PV × (1 + r×n)."},{"name":"现值","f":"PV = FV ÷ (1 + r)^n","note":"折现率越高、时间越远，现值越小。","name_en":"Present Value","note_en":"The higher the discount rate and the further away the cash flow, the smaller the present value."},{"name":"有效年利率","f":"EAR = (1 + APR/m)^m − 1","note":"m 为每年复利次数；连续复利时 EAR = e^APR − 1。","name_en":"Effective Annual Rate","note_en":"m is the number of compounding periods per year; with continuous compounding, EAR = e^APR − 1."},{"name":"年金现值与贷款还款额","f":"PV = PMT × [1 − (1 + r)^(−n)] ÷ r ；PMT = PV × r ÷ [1 − (1 + r)^(−n)]","note":"月供要用月利率 r = APR/12、期数 n = 年数×12。永续年金 PV = PMT ÷ r。","name_en":"Present Value of an Annuity and Loan Payment","note_en":"For monthly payments, use the monthly rate r = APR/12 and the number of periods n = years × 12. For a perpetuity, PV = PMT ÷ r."},{"name":"净现值","f":"NPV = −C_0 + Σ CF_t ÷ (1 + r)^t","note":"IRR 是令 NPV = 0 的 r，一般需试算或插值求得。","name_en":"Net Present Value","note_en":"The IRR is the r that makes NPV = 0; it usually has to be found by trial and error or interpolation."},{"name":"费雪方程","f":"(1 + i) = (1 + r)(1 + π) ；近似 r ≈ i − π","note":"i 名义利率，r 实际利率，π 通胀率；通胀较高时要用精确式。","name_en":"Fisher Equation","note_en":"i is the nominal interest rate, r the real interest rate and π the inflation rate; when inflation is high, use the exact form.","f_en":"(1 + i) = (1 + r)(1 + π) ; approx. r ≈ i − π"}],"sections":[{"h":"为什么钱有时间价值","body":"钱有时间价值有三个原因：\n- **机会成本 (opportunity cost)**：今天的钱可以存银行或投资赚取收益；\n- **通胀 (inflation)**：未来同样数额的钱能买到的东西更少；\n- **风险 (risk)**：未来的承诺可能无法兑现。\n因此比较不同时点的现金流时，必须先把它们换算到同一时点（通常是今天），再比较大小。这就是**折现 (discounting)**。","h_en":"Why Money Has a Time Value","body_en":"Money has a time value for three reasons:\n- **Opportunity cost**: money today can be deposited in a bank or invested to earn a return;\n- **Inflation**: the same amount of money in the future will buy less;\n- **Risk**: a promise of future payment may not be kept.\nSo when comparing cash flows at different points in time, we must first convert them to the same point in time (usually today) before comparing them. This is **discounting**."},{"h":"单利、复利与有效年利率","body":"把 1,000 元以 5% 年利率存 3 年：\n- 单利：1,000 × (1 + 0.05×3) = **1,150 元**；\n- 复利：1,000 × 1.05³ = **1,157.63 元**。\n差额 7.63 元就是“利息的利息”。期限越长，复利的威力越大——这也是信用卡欠款越滚越多的原因。\n**APR 与 EAR**：银行常报名义年利率 (APR)。若 APR = 12%、按月复利，每月利率 1%，EAR = 1.01¹² − 1 ≈ **12.68%**。比较贷款或存款产品时，应比较 EAR 而非 APR。\n**72 法则**：年收益 8% 时，资金约 72 ÷ 8 = 9 年翻倍（精确值 ln2 ÷ ln1.08 ≈ 9.01 年）。","h_en":"Simple Interest, Compound Interest and the Effective Annual Rate","body_en":"Deposit $1,000 at 5% per year for 3 years:\n- Simple interest: 1,000 × (1 + 0.05×3) = **$1,150**;\n- Compound interest: 1,000 × 1.05³ = **$1,157.63**.\nThe $7.63 difference is \"interest on interest\". The longer the period, the more powerful compounding becomes — which is also why credit card debt snowballs.\n**APR vs EAR**: banks usually quote a nominal annual rate (APR). If APR = 12% compounded monthly, the monthly rate is 1% and EAR = 1.01¹² − 1 ≈ **12.68%**. When comparing loan or savings products, compare EARs, not APRs.\n**Rule of 72**: at an 8% annual return, money doubles in about 72 ÷ 8 = 9 years (exact value ln2 ÷ ln1.08 ≈ 9.01 years)."},{"h":"年金与贷款：月供是怎么算出来的","body":"贷款的本质是：银行今天给你的钱 = 你未来所有还款的现值。\n**例**：借 20,000 元，年利率 6%，分 3 年每年末等额还款：\nPMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ **7,482.20 元/年**。\n第 1 年利息 = 20,000 × 6% = 1,200 元，所以第一笔还款中只有 6,282.20 元用于偿还本金；越往后，利息占比越小、本金占比越大（**等额本息摊还表 amortization schedule**）。\n**永续年金**：每年永远支付 500 元、折现率 5%，现值 = 500 ÷ 0.05 = 10,000 元。","h_en":"Annuities and Loans: How Repayments Are Calculated","body_en":"In essence, a loan means: the money the bank gives you today = the present value of all your future repayments.\n**Example**: borrow $20,000 at 6% per year, repaid in equal instalments at the end of each year over 3 years:\nPMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ **$7,482.20 per year**.\nYear-1 interest = 20,000 × 6% = $1,200, so only $6,282.20 of the first payment goes towards repaying principal; over time the interest share falls and the principal share rises (an **amortization schedule** with equal payments).\n**Perpetuity**: $500 paid every year forever at a 5% discount rate has a present value of 500 ÷ 0.05 = $10,000."},{"h":"NPV 与 IRR：该不该投这个项目？","body":"**NPV 规则**：接受 NPV > 0 的项目；在互斥项目 (mutually exclusive projects) 中选 NPV 最大者。\n**例**：今天投 1,000，第 1、2 年末各回收 600，折现率 10%：\nNPV = −1,000 + 600/1.1 + 600/1.21 = −1,000 + 545.45 + 495.87 = **41.32 > 0**，应投资。\n**IRR 规则**：IRR > 资本成本即接受。IRR 直观但有缺陷：\n- 互斥项目规模或时点不同时，IRR 高的项目 NPV 未必高——**应以 NPV 为准**；\n- 现金流正负号多次变化时，可能存在多个 IRR。\n折现率上升时 NPV 下降，这就是加息会抑制企业投资 (investment) 的微观基础。","h_en":"NPV and IRR: Should We Invest in This Project?","body_en":"**NPV rule**: accept projects with NPV > 0; among mutually exclusive projects, choose the one with the highest NPV.\n**Example**: invest 1,000 today and receive 600 at the end of each of years 1 and 2, with a 10% discount rate:\nNPV = −1,000 + 600/1.1 + 600/1.21 = −1,000 + 545.45 + 495.87 = **41.32 > 0**, so invest.\n**IRR rule**: accept if IRR > cost of capital. IRR is intuitive but flawed:\n- when mutually exclusive projects differ in scale or timing, the project with the higher IRR does not necessarily have the higher NPV — **NPV should take precedence**;\n- when the sign of the cash flows changes more than once, there may be multiple IRRs.\nWhen the discount rate rises, NPV falls — this is the microeconomic foundation for why interest rate rises dampen business investment."},{"h":"通胀与实际收益","body":"名义收益 7%、通胀 3% 时，实际收益并非精确的 4%，而是 1.07 ÷ 1.03 − 1 ≈ **3.88%**。通胀低时近似式足够，通胀高时差距明显。\n对家庭而言：存款利率低于通胀意味着**实际利率为负**，现金的购买力在缩水；对借款人而言，意外的高通胀减轻了固定利率债务的实际负担——财富从贷款人转移到借款人。\n做项目决策时要保持一致：**名义现金流配名义折现率，实际现金流配实际折现率**。","h_en":"Inflation and Real Returns","body_en":"With a nominal return of 7% and inflation of 3%, the real return is not exactly 4% but 1.07 ÷ 1.03 − 1 ≈ **3.88%**. When inflation is low the approximation is good enough; when inflation is high the gap becomes noticeable.\nFor households, a deposit rate below inflation means a **negative real interest rate** — the purchasing power of cash is shrinking. For borrowers, unexpectedly high inflation reduces the real burden of fixed-rate debt — wealth is transferred from lenders to borrowers.\nBe consistent in project decisions: **discount nominal cash flows at a nominal rate, and real cash flows at a real rate**."}],"pitfalls":["把 APR 当成 EAR 比较产品：按月复利 12% 的贷款实际成本约 12.68%，高于按年复利的 12.5%。","算月供时用了年利率和年数，而没有换成月利率 (APR/12) 和月数。","用 IRR 在互斥项目间做选择：规模不同的项目应比较 NPV。","名义现金流用实际折现率折现（或反过来），导致 NPV 系统性偏高或偏低。","费雪方程在高通胀时仍用 r ≈ i − π 近似，误差可能超过 1 个百分点。"],"exams":{"AP":"Macro Unit 4（名义/实际利率，部分）","IB":"—","AL":"—","IEO":"Finance: time value of money, NPV","NEC":"Macro（real vs nominal interest，部分）"},"diagram":null,"summary_en":"A dollar today is worth more than a dollar a year from now, because money today can be invested to earn interest, and the future brings uncertainty and inflation. This lesson covers simple and compound interest, future and present value, the effective annual rate, annuities and loan repayments, NPV and IRR for project decisions, and nominal versus real returns — the foundation of the IEO finance section and of every investment decision.","pitfalls_en":["Comparing products using APR instead of EAR: a loan at 12% compounded monthly actually costs about 12.68%, more than one at 12.5% compounded annually.","Calculating monthly payments with the annual rate and number of years instead of converting to the monthly rate (APR/12) and number of months.","Using IRR to choose between mutually exclusive projects: for projects of different sizes, compare NPVs.","Discounting nominal cash flows at a real discount rate (or vice versa), which systematically overstates or understates NPV.","Still using the approximation r ≈ i − π in the Fisher equation when inflation is high; the error can exceed 1 percentage point."]},{"id":"F2","unit":"finance","title_zh":"金融市场与投资","title_en":"Financial Markets & Investing","level":"G10+","summary":"金融市场把储蓄者的资金配置给需要资金的企业和政府。本课讲解股票与债券定价的核心逻辑（尤其是债券价格与收益率反向变动）、风险与收益的权衡、分散化与 CAPM 的 β、期权收益结构，以及市场有效性与套利——这些是 IEO 金融选择题的高频考点。","concepts":[{"zh":"债券","en":"Bond","def":"发行人承诺按期支付票息 (coupon) 并在到期日偿还面值 (face value) 的债务工具。","def_en":"A debt instrument whose issuer promises to pay coupons on schedule and repay the face value at maturity."},{"zh":"到期收益率","en":"Yield to Maturity (YTM)","def":"按当前价格买入并持有到期所获得的年化收益率，即使债券未来现金流现值等于市价的折现率。","def_en":"The annualised return earned by buying at the current price and holding to maturity; that is, the discount rate at which the present value of the bond's future cash flows equals its market price."},{"zh":"股票与股利","en":"Stock & Dividend","def":"股票代表公司的所有权份额；股东获得股利 (dividend) 和资本利得 (capital gain)，但对公司资产的求偿权排在债权人之后。","def_en":"A share represents a fraction of ownership in a company; shareholders receive dividends and capital gains, but their claim on the company's assets ranks behind that of creditors."},{"zh":"市盈率","en":"Price-to-Earnings Ratio (P/E)","def":"股价 ÷ 每股收益 (EPS)，反映投资者为每 1 元利润愿付的价格，高 P/E 通常意味着市场预期高增长。","def_en":"Share price ÷ earnings per share (EPS); it shows how much investors are willing to pay for each $1 of profit. A high P/E usually signals that the market expects strong growth."},{"zh":"期望收益与方差","en":"Expected Return & Variance","def":"期望收益是各情形收益按概率加权的平均；方差（及标准差 σ）衡量收益围绕期望值的波动，即风险。","def_en":"Expected return is the probability-weighted average of returns across scenarios; variance (and standard deviation σ) measures how much returns fluctuate around the expected value — that is, risk."},{"zh":"系统性风险与特有风险","en":"Systematic vs Idiosyncratic Risk","def":"系统性风险影响整个市场（经济衰退、利率变动），无法分散；特有风险只影响单个公司，可通过分散化消除。","def_en":"Systematic risk affects the whole market (recessions, interest rate changes) and cannot be diversified away; idiosyncratic risk affects only an individual company and can be eliminated through diversification."},{"zh":"贝塔系数","en":"Beta (β)","def":"资产收益对市场收益的敏感度；β = 1 与市场同步，β > 1 波动更大。CAPM 认为只有 β 所代表的系统性风险才会获得风险溢价。","def_en":"The sensitivity of an asset's return to the market return; β = 1 moves in line with the market, β > 1 is more volatile. According to CAPM, only the systematic risk captured by β earns a risk premium."},{"zh":"看涨/看跌期权","en":"Call / Put Option","def":"看涨期权赋予持有人以行权价 (strike) 买入标的的权利而非义务；看跌期权赋予以行权价卖出的权利。","def_en":"A call option gives the holder the right, but not the obligation, to buy the underlying asset at the strike price; a put option gives the right to sell at the strike price."},{"zh":"有效市场假说","en":"Efficient Market Hypothesis (EMH)","def":"价格已反映可获得的信息：弱式（历史价格）、半强式（所有公开信息）、强式（包括内幕信息）。","def_en":"Prices already reflect available information: weak form (past prices), semi-strong form (all public information), strong form (including insider information)."},{"zh":"套利","en":"Arbitrage","def":"利用同一资产（或等价现金流）的价格差异，无风险、零净投入地获利；套利行为会推动价格趋于一致（一价定律 law of one price）。","def_en":"Earning a risk-free profit with zero net investment by exploiting price differences for the same asset (or equivalent cash flows); arbitrage activity pushes prices into line (the law of one price)."}],"formulas":[{"name":"债券价格","f":"P = Σ C ÷ (1 + y)^t + F ÷ (1 + y)^N","note":"C 票息，F 面值，y 到期收益率；y 上升 → P 下降。票面利率 > y 时溢价发行，< y 时折价。","name_en":"Bond Price","note_en":"C is the coupon, F the face value and y the yield to maturity; as y rises, P falls. A bond trades at a premium when the coupon rate > y and at a discount when it is < y."},{"name":"期望收益与方差","f":"E(R) = Σ p_i R_i ；σ² = Σ p_i (R_i − E(R))²","note":"标准差 σ = √σ²。","name_en":"Expected Return and Variance","note_en":"Standard deviation σ = √σ²."},{"name":"两资产组合方差","f":"σ_p² = w_A²σ_A² + w_B²σ_B² + 2 w_A w_B ρ σ_A σ_B","note":"相关系数 ρ < 1 时，组合 σ 小于各资产 σ 的加权平均——这就是分散化的好处。","name_en":"Variance of a Two-Asset Portfolio","note_en":"When the correlation coefficient ρ < 1, portfolio σ is less than the weighted average of the individual assets' σ — this is the benefit of diversification."},{"name":"资本资产定价模型","f":"E(R_i) = R_f + β_i × [E(R_m) − R_f]","note":"E(R_m) − R_f 为市场风险溢价 (market risk premium)。","name_en":"Capital Asset Pricing Model (CAPM)","note_en":"E(R_m) − R_f is the market risk premium."},{"name":"期权到期收益","f":"看涨 = max(S − K, 0) ；看跌 = max(K − S, 0)","note":"净利润还要减去期权费 (premium)。","name_en":"Option Payoff at Expiry","note_en":"To get the net profit, also subtract the option premium.","f_en":"Call = max(S − K, 0) ; Put = max(K − S, 0)"},{"name":"市盈率与股息率","f":"P/E = P ÷ EPS ；股息率 = DPS ÷ P","note":"EPS 每股收益，DPS 每股股利。","name_en":"P/E Ratio and Dividend Yield","note_en":"EPS is earnings per share; DPS is dividends per share.","f_en":"P/E = P ÷ EPS ; dividend yield = DPS ÷ P"}],"sections":[{"h":"债券：价格与收益率为什么反向变动","body":"债券的票息和面值是固定的。当市场利率上升，新发行债券提供更高票息，旧债券只有**降价**才能让新买家获得同样的收益率。因此**债券价格与收益率反向变动 (inverse relationship)**。\n**例**：3 年期债券，面值 1,000，年票息 5%（每年 50），市场收益率 6%：\nP = 50/1.06 + 50/1.06² + 1,050/1.06³ ≈ **973.27**，低于面值，即折价 (discount) 交易。\n期限越长的债券，对利率变化越敏感（久期 duration 越长）。这也是央行加息时长期债券价格跌得更多的原因。","h_en":"Bonds: Why Prices and Yields Move in Opposite Directions","body_en":"A bond's coupon and face value are fixed. When market interest rates rise, newly issued bonds offer higher coupons, so existing bonds can only give new buyers the same yield by **falling in price**. Hence **bond prices and yields have an inverse relationship**.\n**Example**: a 3-year bond with a face value of 1,000 and a 5% annual coupon (50 per year), with a market yield of 6%:\nP = 50/1.06 + 50/1.06² + 1,050/1.06³ ≈ **973.27**, below face value, so it trades at a discount.\nThe longer a bond's maturity, the more sensitive it is to interest rate changes (the longer its duration). This is why long-term bond prices fall more when the central bank raises rates."},{"h":"风险、收益与分散化","body":"投资者厌恶风险，因此高风险资产必须提供更高的**期望收益**作为补偿。\n**例**：某股票在繁荣/正常/衰退三种情形下收益为 20%、5%、−10%，概率 0.3、0.5、0.2，则 E(R) = 6 + 2.5 − 2 = **6.5%**。\n**分散化 (diversification)**：把资金分散到相关性不完全的资产上，组合波动小于各资产波动的加权平均。持有足够多的股票后，**特有风险 (idiosyncratic risk)** 基本被抵消，剩下的是无法分散的**系统性风险 (systematic risk)**。\n两资产相关系数 ρ = −1 时，甚至可以构造出零风险组合。","h_en":"Risk, Return and Diversification","body_en":"Investors are risk-averse, so riskier assets must offer a higher **expected return** as compensation.\n**Example**: a stock returns 20%, 5% and −10% in boom, normal and recession scenarios, with probabilities 0.3, 0.5 and 0.2, so E(R) = 6 + 2.5 − 2 = **6.5%**.\n**Diversification**: spreading money across assets that are not perfectly correlated makes the portfolio's volatility lower than the weighted average of the individual assets' volatilities. Once you hold enough stocks, **idiosyncratic risk** is largely cancelled out, leaving only **systematic risk**, which cannot be diversified away.\nWith a correlation coefficient of ρ = −1 between two assets, it is even possible to construct a zero-risk portfolio."},{"h":"CAPM 与 β：市场只奖励系统性风险","body":"既然特有风险可以免费分散掉，市场就不会为它支付溢价。CAPM 说资产的期望收益只取决于 β：\nE(R) = R_f + β × (E(R_m) − R_f)。\n**例**：无风险利率 3%，市场期望收益 8%，某股票 β = 1.5，则要求收益 = 3% + 1.5 × 5% = **10.5%**。\n若分析师预测该股期望收益只有 9%，低于 CAPM 要求，则说明它**被高估**（α 为负），理性投资者会卖出，价格下跌直到期望收益回到 10.5%。","h_en":"CAPM and Beta: The Market Rewards Only Systematic Risk","body_en":"Since idiosyncratic risk can be diversified away for free, the market will not pay a premium for bearing it. CAPM says an asset's expected return depends only on β:\nE(R) = R_f + β × (E(R_m) − R_f).\n**Example**: with a risk-free rate of 3%, an expected market return of 8% and a stock with β = 1.5, the required return = 3% + 1.5 × 5% = **10.5%**.\nIf analysts forecast an expected return of only 9% for this stock, below what CAPM requires, the stock is **overvalued** (negative α). Rational investors will sell it, and its price will fall until the expected return rises back to 10.5%."},{"h":"股票估值、期权与市场有效性","body":"- **P/E**：股价 60、EPS 4，P/E = 15；若每股股利 1.8，股息率 = 3%。\n- **期权**：买入行权价 50 的看涨期权、期权费 3。到期股价 58 时收益 = 8，净利润 = 5；股价低于 50 时放弃行权，最大损失为期权费 3。看跌期权则在股价下跌时获利，常用于**对冲 (hedging)**。\n- **有效市场假说**：在半强式有效市场中，公开信息（财报、新闻）发布后会迅速反映到价格里，因此根据公开信息交易无法持续获得超额收益，这也是低成本指数基金 (index fund) 流行的理论依据。\n- **套利**：若一项资产一年后确定支付 110、无风险利率 5%，它的公允价值为 110/1.05 ≈ 104.76。若市价只有 102，就可以借钱买入，锁定无风险利润——套利者的买入会把价格推回 104.76。","h_en":"Stock Valuation, Options and Market Efficiency","body_en":"- **P/E**: share price 60, EPS 4, so P/E = 15; with a dividend per share of 1.8, the dividend yield = 3%.\n- **Options**: buy a call with a strike price of 50 for a premium of 3. If the share price at expiry is 58, the payoff = 8 and the net profit = 5; if the price is below 50, you do not exercise, and your maximum loss is the premium of 3. A put option profits when the share price falls and is often used for **hedging**.\n- **Efficient market hypothesis**: in a semi-strong-form efficient market, public information (earnings reports, news) is quickly reflected in prices once released, so trading on public information cannot consistently earn excess returns — this is the theoretical basis for the popularity of low-cost index funds.\n- **Arbitrage**: if an asset will pay a certain 110 in one year and the risk-free rate is 5%, its fair value is 110/1.05 ≈ 104.76. If its market price is only 102, you can borrow to buy it and lock in a risk-free profit — arbitrageurs' buying pushes the price back up to 104.76."}],"pitfalls":["以为利率上升时债券价格也上升——恰好相反，价格与收益率反向变动。","认为分散化可以消除所有风险：它只能消除特有风险，系统性风险（β）无法分散。","用总波动 σ 而不是 β 来判断 CAPM 下的要求收益。","期权到期收益与净利润混淆：净利润 = 到期收益 − 期权费。","把“市场有效”理解为“价格永远正确”：EMH 只说无法用已有信息系统性获利，不代表不会出现泡沫。"],"exams":{"AP":"Macro Unit 4（financial assets；bond prices & interest rates）","IB":"—","AL":"—","IEO":"Finance: financial markets, risk & return, portfolio","NEC":"Macro（bond prices & interest rates，部分）"},"diagram":null,"summary_en":"Financial markets channel savers' funds to the firms and governments that need them. This lesson explains the core logic of pricing stocks and bonds (especially why bond prices and yields move in opposite directions), the trade-off between risk and return, diversification and CAPM beta, option payoffs, and market efficiency and arbitrage — all high-frequency topics in IEO finance multiple-choice questions.","pitfalls_en":["Thinking bond prices rise when interest rates rise — the opposite is true: prices and yields move inversely.","Believing diversification can eliminate all risk: it removes only idiosyncratic risk; systematic risk (β) cannot be diversified away.","Using total volatility σ rather than β to determine the required return under CAPM.","Confusing an option's payoff at expiry with its net profit: net profit = payoff − premium.","Taking \"efficient markets\" to mean \"prices are always right\": the EMH only says you cannot systematically profit from existing information; it does not rule out bubbles."]},{"id":"F3","unit":"finance","title_zh":"个人理财与金融素养","title_en":"Personal Finance & Financial Literacy","level":"G8+","summary":"个人理财是把经济学工具用于自己的生活：做预算、管理信用与债务、用保险转移风险、为养老储蓄、理解税收与通胀对家庭的影响，并识别诈骗与自身的行为偏差。IEO 金融部分常以“为一个家庭做理财规划”的模拟形式出现，需要把这些知识综合运用。","concepts":[{"zh":"预算","en":"Budget","def":"对收入与支出的计划。常用 50/30/20 法则：税后收入的 50% 用于必需品，30% 用于可选消费，20% 用于储蓄和还债。","def_en":"A plan for income and spending. A common guideline is the 50/30/20 rule: 50% of after-tax income for needs, 30% for wants, and 20% for saving and paying off debt."},{"zh":"应急基金","en":"Emergency Fund","def":"通常为 3–6 个月生活费的高流动性储蓄，用于应对失业、疾病等冲击，避免被迫借高息债。","def_en":"Highly liquid savings, usually 3–6 months of living expenses, used to cope with shocks such as job loss or illness so that you are not forced into high-interest borrowing."},{"zh":"信用评分","en":"Credit Score","def":"贷款方评估借款人违约风险的分数；按时还款记录 (payment history) 和信用额度使用率 (credit utilization) 是最重要的因素。","def_en":"A score lenders use to assess a borrower's risk of default; payment history and credit utilization are the most important factors."},{"zh":"复利债务","en":"Compound Debt","def":"未还清的信用卡余额会按月复利计息；只还最低还款额 (minimum payment) 可能需要多年才能还清并支付大量利息。","def_en":"Unpaid credit card balances accrue interest compounded monthly; paying only the minimum payment can mean taking many years to clear the debt and paying a great deal of interest."},{"zh":"保险：保费与免赔额","en":"Insurance: Premium & Deductible","def":"保费是购买保险的价格；免赔额是损失中由投保人自付的部分，免赔额越高，保费通常越低。","def_en":"The premium is the price of buying insurance; the deductible is the part of a loss the policyholder pays themselves. The higher the deductible, the lower the premium usually is."},{"zh":"期望损失","en":"Expected Loss","def":"损失概率 × 损失金额。精算公平保费 (actuarially fair premium) 等于期望损失；风险厌恶者愿意支付高于期望损失的保费。","def_en":"Probability of loss × size of loss. The actuarially fair premium equals the expected loss; a risk-averse person is willing to pay a premium above the expected loss."},{"zh":"养老金与退休储蓄","en":"Pension & Retirement Saving","def":"通过雇主或个人账户长期储蓄。越早开始，复利时间越长；雇主配缴 (employer match) 相当于即时的高回报。","def_en":"Long-term saving through an employer or individual account. The earlier you start, the longer compounding has to work; an employer match is equivalent to an immediate high return."},{"zh":"边际税率与平均税率","en":"Marginal vs Average Tax Rate","def":"边际税率是最后一元收入适用的税率；平均税率是总税额 ÷ 总收入。累进税制下，进入更高档只对超出部分征收更高税率。","def_en":"The marginal tax rate is the rate applied to the last dollar of income; the average tax rate is total tax ÷ total income. Under a progressive tax system, moving into a higher bracket means only the income above the threshold is taxed at the higher rate."},{"zh":"行为偏差","en":"Behavioral Biases","def":"系统性偏离理性决策的倾向，如损失厌恶 (loss aversion)、过度自信 (overconfidence)、从众 (herding)、现时偏好 (present bias)。","def_en":"Systematic tendencies to deviate from rational decision-making, such as loss aversion, overconfidence, herding and present bias."},{"zh":"庞氏骗局","en":"Ponzi Scheme","def":"用新投资者的钱支付老投资者“收益”的诈骗；典型特征是承诺高额且稳定的回报、业务不透明、催促投资、鼓励拉人头。","def_en":"A fraud in which money from new investors is used to pay \"returns\" to earlier investors; typical signs are promises of high and steady returns, an opaque business, pressure to invest quickly, and incentives to recruit new members."}],"formulas":[{"name":"期望损失","f":"E(Loss) = p × L","note":"p 为损失概率，L 为损失额；有免赔额 D 时保险赔付 = max(L − D, 0)（不超过保额）。","name_en":"Expected Loss","note_en":"p is the probability of loss and L the size of the loss; with a deductible D, the insurance payout = max(L − D, 0) (up to the policy limit)."},{"name":"信用卡欠款增长","f":"余额_n = B × (1 + APR/12)^n","note":"不还款也不新增消费时，n 个月后的余额。","name_en":"Growth of Credit Card Debt","note_en":"The balance after n months, assuming no repayments and no new spending.","f_en":"Balance_n = B × (1 + APR/12)^n"},{"name":"定期定额储蓄终值","f":"FV = PMT × [(1 + r)^n − 1] ÷ r","note":"每期末存入 PMT，年金终值。","name_en":"Future Value of Regular Savings","note_en":"Deposit PMT at the end of each period; this is the future value of an annuity."},{"name":"实际购买力变化","f":"实际收益 = (1 + i) ÷ (1 + π) − 1","note":"存款利率 i 低于通胀 π 时为负。","name_en":"Change in Real Purchasing Power","note_en":"Negative when the deposit rate i is below inflation π.","f_en":"Real return = (1 + i) ÷ (1 + π) − 1"}],"sections":[{"h":"预算、应急基金与“先付给自己”","body":"理财的第一步是知道钱去了哪里。**50/30/20 法则**：税后月收入 4,000 元，则约 2,000 元用于房租、食物等必需品，1,200 元用于可选消费，**800 元**用于储蓄与还债。\n顺序很重要：\n- 先建立 3–6 个月生活费的**应急基金**；\n- 再还清高息债务（信用卡利率常高于任何投资的稳定收益）；\n- 然后争取雇主养老金配缴，再做长期投资。\n**先付给自己 (pay yourself first)**：发工资当天自动转入储蓄账户，用制度对抗现时偏好 (present bias)。","h_en":"Budgeting, Emergency Funds and \"Pay Yourself First\"","body_en":"The first step in managing money is knowing where it goes. **The 50/30/20 rule**: with a monthly after-tax income of $4,000, about $2,000 goes on needs such as rent and food, $1,200 on wants, and **$800** on saving and debt repayment.\nOrder matters:\n- first build an **emergency fund** of 3–6 months' living expenses;\n- then pay off high-interest debt (credit card rates are often higher than the steady return on any investment);\n- then take up any employer pension match, and only then invest for the long term.\n**Pay yourself first**: transfer money to a savings account automatically on payday, using a system to counter present bias."},{"h":"信用、信用卡与复利债务","body":"信用卡 APR 18%、按月复利，3,000 元欠款一年不还：3,000 × 1.015¹² ≈ **3,586.85 元**，EAR 约 19.56%。\n只还最低还款额的危险在于：大部分还款都在付利息，本金下降极慢。\n维护信用评分：\n- 按时还款（最重要）；\n- 信用额度使用率保持较低（如 30% 以下）；\n- 不要短时间内频繁申请新贷款。\n良好的信用评分意味着更低的房贷、车贷利率——这本身就是一笔可观的“收益”。","h_en":"Credit, Credit Cards and Compound Debt","body_en":"With a credit card APR of 18% compounded monthly, a $3,000 balance left unpaid for a year becomes 3,000 × 1.015¹² ≈ **$3,586.85**, an EAR of about 19.56%.\nThe danger of paying only the minimum is that most of each payment goes on interest, so the principal falls extremely slowly.\nTo maintain your credit score:\n- pay on time (the most important factor);\n- keep credit utilization low (e.g. below 30%);\n- avoid applying for lots of new credit in a short period.\nA good credit score means lower mortgage and car loan rates — a sizeable \"return\" in its own right."},{"h":"保险：用小额确定支出换取大额不确定损失","body":"保险的经济学基础是**风险厌恶 (risk aversion)** 与**风险汇集 (risk pooling)**。\n**例**：你的车一年内有 2% 概率发生 20,000 元的损失，期望损失 = 0.02 × 20,000 = **400 元**。精算公平保费为 400 元；保险公司还要覆盖管理费和利润，所以实际保费更高，而风险厌恶的你仍然愿意购买。\n**免赔额**：免赔额 500 元，损失 3,000 元时保险公司赔 2,500 元。提高免赔额可以降低保费，也减少了**道德风险 (moral hazard)**——投保人会更小心。\n原则：为你**承受不起**的大损失投保（医疗、房屋、责任险），小损失自己承担。","h_en":"Insurance: Swapping a Small Certain Cost for a Large Uncertain Loss","body_en":"The economics of insurance rests on **risk aversion** and **risk pooling**.\n**Example**: your car has a 2% chance of a $20,000 loss within a year, so the expected loss = 0.02 × 20,000 = **$400**. The actuarially fair premium is $400; the insurer must also cover administrative costs and profit, so the actual premium is higher — yet as a risk-averse person you are still willing to buy.\n**Deductible**: with a $500 deductible and a $3,000 loss, the insurer pays $2,500. Raising the deductible lowers the premium and also reduces **moral hazard** — policyholders become more careful.\nPrinciple: insure against large losses you **cannot afford** (health, home and liability insurance) and bear small losses yourself."},{"h":"养老、税收与通胀","body":"**越早越好**：每年存 3,000 元、年收益 6%，存 40 年终值 ≈ 464,286 元；推迟 10 年只存 30 年 ≈ 237,175 元。少存了 30,000 元本金，终值却少了约 227,111 元——这就是复利时间的威力。\n**累进税 (progressive tax)**：进入更高税档只对超出部分适用更高的**边际税率**，“加薪反而到手变少”的说法在标准累进税制下不成立。\n**通胀与家庭**：存款利率 2%、通胀 5% 时，实际购买力每年下降约 2.86%。央行 (central bank) 加息以抑制通胀时，存款利率和贷款利率都会上升——浮动利率房贷的月供会增加，储蓄者则受益。","h_en":"Retirement, Taxes and Inflation","body_en":"**The earlier the better**: saving $3,000 a year at a 6% annual return for 40 years gives a future value of ≈ $464,286; starting 10 years later and saving for only 30 years gives ≈ $237,175. Only $30,000 less in principal, yet about $227,111 less at the end — that is the power of time in compounding.\n**Progressive tax**: moving into a higher tax bracket applies the higher **marginal tax rate** only to the income above the threshold, so the claim that \"a pay rise can leave you with less take-home pay\" does not hold under a standard progressive tax system.\n**Inflation and households**: with a deposit rate of 2% and inflation of 5%, real purchasing power falls by about 2.86% a year. When the central bank raises interest rates to curb inflation, both deposit and loan rates rise — monthly payments on variable-rate mortgages go up, while savers benefit."},{"h":"诈骗红旗与投资中的行为偏差","body":"**诈骗红旗 (red flags)**：\n- 承诺“保本高收益”“稳赚不赔”；\n- 催促马上决定、要求保密；\n- 业务模式说不清，靠拉新人获利；\n- 要求用加密货币、礼品卡或转账到个人账户付款。\n**常见行为偏差**：\n- **损失厌恶 / 处置效应 (disposition effect)**：过早卖出赚钱的股票、死扛亏损的股票；\n- **过度自信**：频繁交易，交易成本吞噬收益；\n- **从众**：追涨杀跌，在泡沫顶部买入；\n- **沉没成本谬误 (sunk cost fallacy)**：因为“已经亏了那么多”而不愿止损。\n对策：设定规则、分散投资、低成本长期持有。","h_en":"Scam Red Flags and Behavioural Biases in Investing","body_en":"**Scam red flags**:\n- promises of \"guaranteed principal with high returns\" or \"can't-lose\" profits;\n- pressure to decide immediately, or demands for secrecy;\n- a business model that cannot be clearly explained and profits from recruiting new people;\n- requests for payment in cryptocurrency, gift cards or transfers to a personal account.\n**Common behavioural biases**:\n- **Loss aversion / the disposition effect**: selling winning stocks too early and hanging on to losing stocks;\n- **Overconfidence**: trading too often, so trading costs eat up returns;\n- **Herding**: buying as prices rise and selling as they fall, and buying at the top of a bubble;\n- **Sunk cost fallacy**: refusing to cut losses because \"I've already lost so much\".\nRemedies: set rules, diversify, and hold low-cost investments for the long term."}],"pitfalls":["以为收入进入更高税档后全部收入都按高税率征税——只有超出部分适用更高边际税率。","把保费和期望损失混为一谈：商业保费通常高于期望损失，但为大额风险投保依然合理。","有高息信用卡欠款时却优先投资——还清 20% 利率的债务相当于获得 20% 的无风险收益。","只看名义存款利率而忽略通胀，误以为存款在“增值”。","把“过去收益很高”当成未来收益的保证（外推偏差 extrapolation）。"],"exams":{"AP":"Macro Unit 2.4–2.6, 4.1（通胀成本、金融资产，部分）","IB":"—","AL":"—","IEO":"Finance: personal financial planning (simulation)","NEC":"—"},"diagram":null,"summary_en":"Personal finance applies the tools of economics to your own life: budgeting, managing credit and debt, transferring risk through insurance, saving for retirement, understanding how taxes and inflation affect households, and recognising scams and your own behavioural biases. The IEO finance section often takes the form of a simulation — \"build a financial plan for a family\" — which requires you to apply all of this knowledge together.","pitfalls_en":["Thinking that once your income enters a higher tax bracket, all of it is taxed at the higher rate — only the portion above the threshold is subject to the higher marginal rate.","Confusing the premium with the expected loss: commercial premiums are usually higher than the expected loss, but insuring against large risks is still sensible.","Investing first while carrying high-interest credit card debt — paying off debt at 20% interest is equivalent to earning a risk-free 20% return.","Looking only at the nominal deposit rate and ignoring inflation, mistakenly believing your savings are \"growing\".","Treating \"high returns in the past\" as a guarantee of future returns (extrapolation bias)."]},{"id":"F4","unit":"finance","title_zh":"商业案例与企业决策","title_en":"Business Cases & Firm Decisions","level":"G9+","summary":"IEO 团队商业案例与 NEC 决赛的批判性思维轮都要求学生在有限时间内分析真实商业问题并向评委陈述。本课提供结构化框架（利润树、市场规模估算、4P、波特五力、SWOT）、单位经济学（CAC、LTV、边际贡献、盈亏平衡）、定价策略、三张财务报表的基础，以及如何做一场有说服力的陈述。","concepts":[{"zh":"利润树","en":"Profitability Tree","def":"利润 = 收入 − 成本；收入 = 价格 × 销量，成本 = 固定成本 + 单位变动成本 × 销量。用于定位利润下滑的根源。","def_en":"Profit = revenue − costs; revenue = price × quantity, and costs = fixed costs + variable cost per unit × quantity. Used to pinpoint the root cause of falling profits."},{"zh":"市场规模估算","en":"Market Sizing","def":"用自上而下 (top-down) 或自下而上 (bottom-up) 的假设链条估算市场总量，重在逻辑清晰、假设合理。","def_en":"Estimating total market size through a chain of top-down or bottom-up assumptions; what matters is clear logic and reasonable assumptions."},{"zh":"边际贡献","en":"Contribution Margin","def":"单价 − 单位变动成本，即每多卖一件对覆盖固定成本和利润的贡献；边际贡献率 = 边际贡献 ÷ 单价。","def_en":"Price − variable cost per unit: what each additional unit sold contributes towards covering fixed costs and profit; contribution margin ratio = contribution margin ÷ price."},{"zh":"盈亏平衡点","en":"Break-even Point","def":"总收入等于总成本时的销量：固定成本 ÷ 单位边际贡献。","def_en":"The quantity at which total revenue equals total cost: fixed costs ÷ contribution margin per unit."},{"zh":"获客成本与用户终身价值","en":"CAC & LTV","def":"CAC 是获取一个新客户的平均营销和销售支出；LTV 是一个客户在整个生命周期内贡献的边际贡献（常按 月边际贡献 ÷ 月流失率 估算）。LTV/CAC ≥ 3 常被视为健康。","def_en":"CAC is the average marketing and sales spending needed to acquire one new customer; LTV is the contribution margin a customer generates over their entire lifetime (often estimated as monthly contribution margin ÷ monthly churn rate). An LTV/CAC ≥ 3 is often regarded as healthy."},{"zh":"波特五力","en":"Porter's Five Forces","def":"分析行业吸引力的五种力量：现有竞争者的竞争、新进入者威胁、替代品威胁、供应商议价能力、买方议价能力。","def_en":"Five forces that determine an industry's attractiveness: rivalry among existing competitors, the threat of new entrants, the threat of substitutes, the bargaining power of suppliers, and the bargaining power of buyers."},{"zh":"SWOT 分析","en":"SWOT","def":"内部优势 (Strengths)、劣势 (Weaknesses)，外部机会 (Opportunities)、威胁 (Threats)。","def_en":"Internal Strengths and Weaknesses; external Opportunities and Threats."},{"zh":"营销 4P","en":"Marketing Mix 4P","def":"产品 (Product)、价格 (Price)、渠道 (Place)、推广 (Promotion)。","def_en":"Product, Price, Place, Promotion."},{"zh":"三张财务报表","en":"Financial Statements","def":"利润表 (income statement) 反映一段时期的盈利；资产负债表 (balance sheet) 反映某一时点的资产 = 负债 + 所有者权益；现金流量表 (cash flow statement) 反映现金的实际流入流出。","def_en":"The income statement shows profit over a period; the balance sheet shows, at a point in time, that assets = liabilities + owners' equity; the cash flow statement shows actual cash inflows and outflows."}],"formulas":[{"name":"利润","f":"π = (P − AVC) × Q − FC","note":"P 单价，AVC 单位变动成本，FC 固定成本。","name_en":"Profit","note_en":"P is price, AVC is variable cost per unit, and FC is fixed costs."},{"name":"盈亏平衡销量","f":"Q_BE = FC ÷ (P − AVC)","note":"目标利润 T 时：Q = (FC + T) ÷ (P − AVC)；税后目标利润需先除以 (1 − 税率)。","name_en":"Break-even Quantity","note_en":"For a target profit T: Q = (FC + T) ÷ (P − AVC); an after-tax target profit must first be divided by (1 − tax rate)."},{"name":"盈亏平衡收入","f":"Revenue_BE = FC ÷ 边际贡献率","note":"边际贡献率 = (P − AVC) ÷ P。","name_en":"Break-even Revenue","note_en":"Contribution margin ratio = (P − AVC) ÷ P.","f_en":"Revenue_BE = FC ÷ contribution margin ratio"},{"name":"用户终身价值","f":"LTV ≈ 每期边际贡献 × (1 ÷ 每期流失率)","note":"1 ÷ 流失率 = 平均客户寿命（期数）；回本期 = CAC ÷ 每期边际贡献。","name_en":"Customer Lifetime Value","note_en":"1 ÷ churn rate = average customer lifetime (in periods); payback period = CAC ÷ contribution margin per period.","f_en":"LTV ≈ contribution per period × (1 ÷ churn rate per period)"},{"name":"会计恒等式","f":"资产 = 负债 + 所有者权益","note":"每笔交易都保持两边相等。","name_en":"Accounting Identity","note_en":"Every transaction keeps both sides equal.","f_en":"Assets = Liabilities + Owners' equity"}],"sections":[{"h":"拆解问题：利润树与市场规模","body":"面对“公司利润下降，怎么办？”先拆成**收入端**与**成本端**：\n- 收入 = 价格 × 销量：是降价了，还是销量减少？销量减少是市场萎缩还是份额丢失？\n- 成本 = 固定成本 + 变动成本：哪一项在上升？是原材料涨价还是效率下降？\n**市场规模例**：某城市 800 万人，平均每户 2.5 人 → 320 万户；40% 养狗 → 128 万户；每户每月买 1 袋狗粮 → 每年约 **1,536 万袋**。评委看重的是假设链条是否清晰、可检验，而不是精确数字。","h_en":"Breaking Down the Problem: Profitability Trees and Market Sizing","body_en":"Faced with \"The company's profits are falling — what should it do?\", first split the problem into the **revenue side** and the **cost side**:\n- Revenue = price × quantity: has the price fallen, or has volume fallen? If volume has fallen, is the market shrinking or is the firm losing share?\n- Costs = fixed costs + variable costs: which one is rising? Are raw materials more expensive, or has efficiency fallen?\n**Market sizing example**: a city has 8 million people, with an average of 2.5 people per household → 3.2 million households; 40% own a dog → 1.28 million households; each household buys 1 bag of dog food a month → about **15.36 million bags** a year. Judges care about whether the chain of assumptions is clear and testable, not about a precise number."},{"h":"单位经济学：边际贡献、盈亏平衡、CAC 与 LTV","body":"**盈亏平衡例**：奶茶店固定成本每月 12,000 元，每杯售价 20 元、变动成本 8 元，边际贡献 12 元 → 盈亏平衡 = 12,000 ÷ 12 = **1,000 杯/月**。\n**订阅制例**：用户每月付 30 元、毛利率 60%，月流失率 5% → 平均寿命 20 个月，LTV = 30 × 60% × 20 = **360 元**；若 CAC = 120 元，LTV/CAC = 3，回本期 = 120 ÷ 18 ≈ 6.7 个月。\n关键洞察：高增长但 LTV < CAC 的企业“卖得越多亏得越多”。改善方法包括降低流失 (churn)、提高客单价、降低获客成本（如转介绍 referral）。","h_en":"Unit Economics: Contribution Margin, Break-even, CAC and LTV","body_en":"**Break-even example**: a bubble-tea shop has fixed costs of $12,000 a month; each cup sells for $20 with a variable cost of $8, so the contribution margin is $12 → break-even = 12,000 ÷ 12 = **1,000 cups per month**.\n**Subscription example**: a user pays $30 a month at a 60% gross margin, with a monthly churn rate of 5% → an average lifetime of 20 months, LTV = 30 × 60% × 20 = **$360**; if CAC = $120, LTV/CAC = 3 and the payback period = 120 ÷ 18 ≈ 6.7 months.\nKey insight: a fast-growing business with LTV < CAC \"loses more the more it sells\". Ways to improve include reducing churn, raising the average order value, and lowering acquisition costs (e.g. through referrals)."},{"h":"战略框架：五力、SWOT、4P 与定价","body":"- **波特五力**判断行业是否值得进入：进入壁垒低、替代品多、买方议价能力强的行业利润率通常较低。\n- **SWOT** 把内部能力与外部环境对应起来，形成 SO（用优势抓机会）、WT（弥补劣势规避威胁）等策略。\n- **4P** 用于设计进入市场的方案。\n**定价策略**：成本加成 (cost-plus)、价值定价 (value-based)、渗透定价 (penetration)、撇脂定价 (skimming)、价格歧视 (price discrimination)。\n**降价是否划算？** 售价 10、变动成本 6，目前卖 5,000 件，总边际贡献 20,000。降价到 9 后单位边际贡献只剩 3，需要卖 **6,667 件（+33%）** 才能保持利润不变——这取决于需求价格弹性 (PED)。","h_en":"Strategic Frameworks: Five Forces, SWOT, the 4Ps and Pricing","body_en":"- **Porter's Five Forces** help judge whether an industry is worth entering: industries with low barriers to entry, many substitutes and strong buyer bargaining power usually have low profit margins.\n- **SWOT** matches internal capabilities with the external environment to form strategies such as SO (use strengths to seize opportunities) and WT (address weaknesses and avoid threats).\n- **The 4Ps** are used to design a go-to-market plan.\n**Pricing strategies**: cost-plus, value-based, penetration, skimming, and price discrimination.\n**Is a price cut worth it?** With a price of 10 and a variable cost of 6, the firm currently sells 5,000 units for a total contribution of 20,000. After cutting the price to 9, the unit contribution margin is only 3, so it must sell **6,667 units (+33%)** just to keep profit unchanged — whether that happens depends on the price elasticity of demand (PED)."},{"h":"读懂财务报表","body":"- **利润表**：收入 − 销售成本 = 毛利；再减经营费用、折旧、利息、税 = 净利润。\n- **资产负债表**：资产 = 负债 + 所有者权益。借款买设备：资产（设备）增加，负债增加，权益不变。\n- **现金流量表**：经营、投资、筹资三类现金流。\n**利润 ≠ 现金**：赊销 1,000 元商品（成本 600），利润表确认利润 400，但现金尚未收到——应收账款 (accounts receivable) 增加 1,000，存货减少 600。很多盈利的公司因为现金流断裂而倒闭；折旧 (depreciation) 则相反，减少利润但不消耗当期现金。","h_en":"Reading Financial Statements","body_en":"- **Income statement**: revenue − cost of sales = gross profit; then subtract operating expenses, depreciation, interest and tax = net profit.\n- **Balance sheet**: assets = liabilities + owners' equity. Borrowing to buy equipment: assets (equipment) rise, liabilities rise, and equity is unchanged.\n- **Cash flow statement**: three types of cash flow — operating, investing and financing.\n**Profit ≠ cash**: sell $1,000 of goods on credit (cost $600) and the income statement records a profit of $400, but no cash has yet been received — accounts receivable rise by 1,000 and inventory falls by 600. Many profitable companies go bust because their cash runs out; depreciation works the other way, reducing profit without using up any cash in the current period."},{"h":"如何向评委陈述（IEO 商业案例 / NEC 决赛）","body":"- **结论先行 (answer first)**：第一分钟就给出建议，再用 3 个论点支撑（金字塔原理 pyramid principle）。\n- **用数字说话**：每个论点配一个关键数据（盈亏平衡点、LTV/CAC、市场规模）。\n- **明确假设和风险**：列出最敏感的假设，并说明如果它错了怎么办（情景分析 scenario analysis）。\n- **可执行的下一步**：时间表、负责人、衡量成功的指标 (KPI)。\n- **回答提问**：先复述问题，承认不确定性，再给出你的判断；不要被评委的挑战动摇到放弃主结论，除非对方指出了关键错误。","h_en":"How to Present to Judges (IEO Business Case / NEC Finals)","body_en":"- **Answer first**: give your recommendation in the first minute, then support it with 3 arguments (the pyramid principle).\n- **Let the numbers speak**: back each argument with one key figure (break-even point, LTV/CAC, market size).\n- **State assumptions and risks clearly**: list your most sensitive assumptions and explain what you would do if they turned out to be wrong (scenario analysis).\n- **Actionable next steps**: a timeline, owners, and metrics for measuring success (KPIs).\n- **Handling questions**: restate the question first, acknowledge uncertainty, then give your judgement; don't let a judge's challenge shake you into abandoning your main conclusion unless they have pointed out a critical error."}],"pitfalls":["盈亏平衡计算时用单价而不是单位边际贡献去除固定成本。","把利润等同于现金流，忽略应收账款、存货和资本支出的影响。","只看收入增长，不看 LTV/CAC——获客越多亏损越大的模式不可持续。","框架套用过度：把 SWOT 四格都填满却没有得出任何建议。","陈述时先讲过程最后才给结论，评委在前两分钟就失去了注意力。"],"exams":{"AP":"Micro Unit 3（costs, profit，部分）","IB":"—（厂商理论见 HL 微观，部分）","AL":"9708 A Level 7（firm objectives & costs，部分）","IEO":"Business case (team round)","NEC":"Finals critical-thinking case"},"diagram":"costs","summary_en":"Both the IEO team business case and the critical-thinking round of the NEC finals require students to analyse a real business problem under time pressure and present to judges. This lesson provides structured frameworks (the profitability tree, market sizing, the 4Ps, Porter's Five Forces, SWOT), unit economics (CAC, LTV, contribution margin, break-even), pricing strategies, the basics of the three financial statements, and how to deliver a persuasive presentation.","pitfalls_en":["Dividing fixed costs by the price rather than by the contribution margin per unit when calculating break-even.","Treating profit as the same as cash flow and ignoring the effects of accounts receivable, inventory and capital expenditure.","Looking only at revenue growth and not at LTV/CAC — a model in which acquiring more customers means bigger losses is unsustainable.","Over-applying frameworks: filling in all four boxes of a SWOT without reaching any recommendation.","Walking through the process first and giving the conclusion only at the end of a presentation — the judges will have lost interest within the first two minutes."]},{"id":"F5","unit":"finance","title_zh":"制度与经济思想","title_en":"Institutions & Economic Thought","level":"G9+","summary":"市场运转依赖制度：产权、合同、法律与规范决定了人们面对的激励。本课讲解产权与公地悲剧、委托–代理问题与激励合同（CORE《The Economy》的核心框架），梳理从斯密到弗里德曼的经济思想脉络与关键争论，并示范如何用经济学推理分析通胀、关税、人工智能与劳动力市场等时事话题——这正是 IEO 与 NEC 决赛偏爱的题型。","concepts":[{"zh":"制度","en":"Institutions","def":"约束人们互动的“游戏规则”，包括正式制度（法律、产权、合同）与非正式制度（社会规范）；决定了激励与收益分配。","def_en":"The \"rules of the game\" that constrain how people interact, including formal institutions (laws, property rights, contracts) and informal institutions (social norms); they determine incentives and how gains are distributed."},{"zh":"产权","en":"Property Rights","def":"对资源使用、获益与转让的受法律保护的权利。产权清晰可激励投资与保护资源，缺失则易导致公地悲剧 (tragedy of the commons)。","def_en":"Legally protected rights to use, benefit from and transfer a resource. Clear property rights encourage investment and conservation of resources; without them, a tragedy of the commons easily results."},{"zh":"委托–代理问题","en":"Principal–Agent Problem","def":"代理人（如员工、CEO）的行动无法被委托人（雇主、股东）完全观察，且双方利益不一致，导致代理人不按委托人利益行事。","def_en":"The principal (e.g. an employer or shareholders) cannot fully observe the actions of the agent (e.g. an employee or CEO), and their interests differ, so the agent does not act in the principal's interest."},{"zh":"道德风险与逆向选择","en":"Moral Hazard & Adverse Selection","def":"道德风险是签约后隐藏行动（如投保后不再小心）；逆向选择是签约前隐藏信息（如高风险者更愿意买保险）。","def_en":"Moral hazard is a hidden action after a contract is signed (e.g. becoming less careful once insured); adverse selection is hidden information before a contract is signed (e.g. high-risk people being more willing to buy insurance)."},{"zh":"就业租金","en":"Employment Rent","def":"CORE 术语：工人从当前工作中获得的收益超过次优选择（保留选择 reservation option）的部分；就业租金越大，工人越努力以避免失业。","def_en":"A CORE term: the amount by which a worker's gain from their current job exceeds their next best alternative (the reservation option); the larger the employment rent, the harder the worker works to avoid losing the job."},{"zh":"比较优势","en":"Comparative Advantage","def":"李嘉图 (Ricardo) 提出：机会成本更低的一方应专业化生产该商品，即使另一方在所有商品上都有绝对优势，贸易仍能互利。","def_en":"Proposed by Ricardo: the party with the lower opportunity cost should specialise in producing a good; even if one party has an absolute advantage in every good, trade can still benefit both."},{"zh":"看不见的手","en":"Invisible Hand","def":"斯密 (Adam Smith) 的比喻：在竞争市场中，个人追求自身利益可能在无意中促进社会整体福利。","def_en":"Adam Smith's metaphor: in competitive markets, individuals pursuing their own self-interest may unintentionally promote the welfare of society as a whole."},{"zh":"有效需求","en":"Effective Demand","def":"凯恩斯 (Keynes) 强调总需求不足会导致持续失业，政府可通过财政政策稳定经济。","def_en":"Keynes stressed that insufficient aggregate demand can cause persistent unemployment, and that the government can stabilise the economy through fiscal policy."},{"zh":"知识问题","en":"Knowledge Problem","def":"哈耶克 (Hayek) 认为经济所需信息分散在无数个人手中，价格体系是汇总这些信息的机制，中央计划者无法替代。","def_en":"Hayek argued that the information an economy needs is dispersed among countless individuals; the price system is the mechanism that aggregates this information, and central planners cannot replace it."},{"zh":"货币主义","en":"Monetarism","def":"弗里德曼 (Friedman) 主张“通胀无论何时何地都是一种货币现象”，强调稳定货币增长规则。","def_en":"Friedman argued that \"inflation is always and everywhere a monetary phenomenon\" and advocated a rule of steady money supply growth."}],"formulas":[{"name":"货币数量论","f":"M × V = P × Y ；%ΔM + %ΔV ≈ %ΔP + %ΔY","note":"V 稳定时，通胀率 ≈ 货币增速 − 实际产出增速。","name_en":"Quantity Theory of Money","note_en":"When V is stable, inflation ≈ money growth − real output growth."},{"name":"就业租金","f":"就业租金 = 工作的净收益 − 保留选择的净收益","note":"按周或按小时计；乘以预期失业持续期可得失业的总损失。","name_en":"Employment Rent","note_en":"Measured per week or per hour; multiply by the expected duration of unemployment to get the total cost of job loss.","f_en":"Employment rent = net benefit of the job − net benefit of the next best option"},{"name":"机会成本（比较优势）","f":"生产 X 的机会成本 = 放弃的 Y 数量 ÷ 生产的 X 数量","note":"机会成本较低的一方拥有比较优势。","name_en":"Opportunity Cost (Comparative Advantage)","note_en":"The party with the lower opportunity cost has the comparative advantage.","f_en":"OC of producing X = Y given up ÷ X produced"}],"sections":[{"h":"制度、产权与激励","body":"为什么有的国家富裕、有的贫穷？CORE《The Economy》的回答之一是**制度**：同样的人，在不同规则下会做出不同选择。\n- **产权 (property rights)** 清晰时，农民愿意改良土地、企业愿意投资，因为收益归自己；\n- **开放获取资源 (open-access resource)**（如公海渔场）没有所有者，每个渔民都只考虑自己的收益而忽略对他人的影响，导致过度捕捞——**公地悲剧**；\n- 解决方案：界定产权（可交易捕捞配额 ITQs）、政府管制，或奥斯特罗姆 (Elinor Ostrom) 所研究的社区自治规则。","h_en":"Institutions, Property Rights and Incentives","body_en":"Why are some countries rich and others poor? One of the answers in CORE's The Economy is **institutions**: the same people make different choices under different rules.\n- When **property rights** are clear, farmers are willing to improve their land and firms are willing to invest, because they keep the returns;\n- An **open-access resource** (such as an ocean fishery) has no owner, so each fisher considers only their own gain and ignores the effect on others, leading to overfishing — the **tragedy of the commons**;\n- Solutions: define property rights (individual transferable quotas, ITQs), government regulation, or the community self-governance rules studied by Elinor Ostrom."},{"h":"委托–代理与激励合同","body":"当努力无法被观察时，合同就要设计激励：\n- **计件工资 / 提成**：激励强，但让工人承担收入风险；\n- **股票期权**：让 CEO 的收益与股价挂钩，缓解股东与经理人的利益冲突，但可能诱发短期行为；\n- **效率工资 (efficiency wage)**：CORE 的劳动纪律模型中，雇主支付高于工人保留选择的工资，创造**就业租金**，工人因害怕失去这份租金而努力工作。\n**例**：周薪 600，失业时保留选择价值 450/周，就业租金 = 150/周；若预期失业持续 10 周，被解雇的损失为 **1,500**。失业率越高、失业救济越低，就业租金越大，雇主就能以更低工资激励努力——这解释了为什么均衡中总存在一定失业。","h_en":"Principal–Agent Problems and Incentive Contracts","body_en":"When effort cannot be observed, contracts must be designed to provide incentives:\n- **Piece rates / commission**: strong incentives, but workers bear income risk;\n- **Stock options**: link the CEO's rewards to the share price, easing the conflict of interest between shareholders and managers, but may encourage short-termism;\n- **Efficiency wages**: in CORE's labour discipline model, employers pay a wage above the worker's reservation option, creating an **employment rent**; workers work hard for fear of losing this rent.\n**Example**: with a weekly wage of 600 and a reservation option worth 450 per week when unemployed, the employment rent = 150 per week; if unemployment is expected to last 10 weeks, the cost of being fired is **1,500**. The higher the unemployment rate and the lower unemployment benefits, the larger the employment rent, and the lower the wage employers can pay while still motivating effort — which explains why some unemployment always exists in equilibrium."},{"h":"经济思想简史与关键争论","body":"- **亚当·斯密 (1776《国富论》)**：分工与“看不见的手”，同时警惕商人合谋。\n- **大卫·李嘉图 (1817)**：比较优势与自由贸易；地租理论。\n- **卡尔·马克思**：资本主义的动态与冲突，关注劳动者与资本所有者之间的分配和权力关系。\n- **凯恩斯 (1936《通论》)**：大萧条中总需求不足导致持续失业，主张逆周期财政政策。\n- **哈耶克**：价格体系汇总分散知识，批评中央计划。\n- **弗里德曼**：货币主义、自然失业率与预期；“通胀是货币现象”。\n**持久的争论**：市场 vs 政府的边界、规则 vs 相机抉择 (rules vs discretion)、效率 vs 公平。好的答案不是“站队”，而是说明在什么条件下哪种观点更适用。","h_en":"A Brief History of Economic Thought and Key Debates","body_en":"- **Adam Smith (1776, The Wealth of Nations)**: the division of labour and the \"invisible hand\", along with a warning against collusion among merchants.\n- **David Ricardo (1817)**: comparative advantage and free trade; the theory of rent.\n- **Karl Marx**: the dynamics and conflicts of capitalism, focusing on the distribution of income and power between workers and the owners of capital.\n- **Keynes (1936, The General Theory)**: in the Great Depression, insufficient aggregate demand caused persistent unemployment; he advocated countercyclical fiscal policy.\n- **Hayek**: the price system aggregates dispersed knowledge; a critic of central planning.\n- **Friedman**: monetarism, the natural rate of unemployment and expectations; \"inflation is a monetary phenomenon\".\n**Enduring debates**: the boundary between markets and government, rules vs discretion, efficiency vs equity. A good answer doesn't \"pick a side\" but explains under what conditions each view is more applicable."},{"h":"用经济学推理分析时事","body":"NEC 与 IEO 喜欢考“用模型解释新闻”。通用步骤：**识别冲击 → 选择模型 → 判断方向 → 讨论谁得谁失 → 指出不确定性**。\n- **通胀episode**：区分需求拉动 (demand-pull，如大规模刺激) 与成本推动 (cost-push，如能源或供应链冲击)。用 MV = PY 做粗略检验：货币增速 8%、实际增长 3%、V 稳定 → 通胀约 5%。\n- **关税 (tariff)**：国内价格上升，国内生产者与政府（关税收入）获益，消费者与使用该产品作为投入品的下游产业受损，产生无谓损失 (deadweight loss)；还可能引发报复。\n- **人工智能与劳动力市场**：用**任务视角 (task-based view)**——AI 替代部分任务（替代效应），同时提高生产率、创造新任务（生产率效应、新任务效应）。与 AI 互补的技能工资可能上升，被替代任务集中的岗位面临压力；总体就业影响取决于这些效应的相对大小以及制度（培训、社会保障）。","h_en":"Applying Economic Reasoning to Current Events","body_en":"The NEC and IEO like to ask you to \"use a model to explain the news\". General steps: **identify the shock → choose a model → determine the direction of change → discuss who gains and who loses → point out the uncertainties**.\n- **Inflation episodes**: distinguish demand-pull inflation (e.g. large-scale stimulus) from cost-push inflation (e.g. energy or supply-chain shocks). Use MV = PY as a rough check: money growth of 8%, real growth of 3% and a stable V → inflation of about 5%.\n- **Tariffs**: domestic prices rise; domestic producers and the government (tariff revenue) gain, while consumers and downstream industries that use the product as an input lose, and a deadweight loss arises; tariffs may also provoke retaliation.\n- **AI and the labour market**: take a **task-based view** — AI replaces some tasks (the displacement effect) while also raising productivity and creating new tasks (the productivity effect and the new-task effect). Wages for skills complementary to AI may rise, while jobs concentrated in displaced tasks come under pressure; the overall effect on employment depends on the relative size of these effects and on institutions (training, social safety nets)."}],"pitfalls":["把“看不见的手”理解为斯密主张政府完全不干预——斯密也讨论了公共品、教育与垄断问题。","混淆比较优势与绝对优势：贸易模式由机会成本决定。","认为关税由外国出口商全部承担：在多数情况下国内消费者和下游企业承担了相当部分。","把道德风险（签约后隐藏行动）与逆向选择（签约前隐藏信息）弄反。","时事题只写立场不写机制：必须说明冲击通过哪条渠道影响哪些变量。"],"exams":{"AP":"Micro Unit 1（comparative advantage）；Macro 5（monetary theory，部分）","IB":"Unit 1 Introduction（1.3 economic thought）；4.2（trade）","AL":"9708 AS 1（basic economic ideas）；AS 6（trade，部分）","IEO":"CORE The Economy: institutions, incentives, contracts, labour discipline","NEC":"Micro / International core；Finals current-events case"},"diagram":"ppc","summary_en":"Markets depend on institutions: property rights, contracts, laws and norms determine the incentives people face. This lesson covers property rights and the tragedy of the commons, the principal–agent problem and incentive contracts (a core framework in CORE's The Economy), traces the history of economic thought from Smith to Friedman and its key debates, and shows how to apply economic reasoning to current issues such as inflation, tariffs, and AI and the labour market — exactly the type of question the IEO and the NEC finals favour.","pitfalls_en":["Reading the \"invisible hand\" as Smith arguing for no government intervention at all — Smith also discussed public goods, education and monopoly.","Confusing comparative advantage with absolute advantage: patterns of trade are determined by opportunity cost.","Believing a tariff is paid entirely by foreign exporters: in most cases, domestic consumers and downstream firms bear a substantial share.","Mixing up moral hazard (hidden action after the contract) and adverse selection (hidden information before the contract).","Stating only a position, not the mechanism, in current-events questions: you must explain through which channel the shock affects which variables."]},{"id":"F6","unit":"finance","title_zh":"银行、保险与金融科技","title_en":"Banking, Insurance & Fintech","level":"G9+","summary":"银行把储户的存款变成贷款并赚取利差，存款保险和中央银行共同防止挤兑；保险通过风险汇聚 (risk pooling) 把个人的不确定损失变成确定的保费，但要应对逆向选择与道德风险。本课还覆盖金融诈骗识别、众筹、加密货币与区块链、移动支付等金融科技话题，对应 IEO 金融大纲中尚未覆盖的条目。","summary_en":"Banks turn depositors' money into loans and earn the interest spread, while deposit insurance and the central bank together guard against bank runs; insurance uses risk pooling to turn an individual's uncertain loss into a certain premium, but must deal with adverse selection and moral hazard. This lesson also covers spotting financial fraud, crowdfunding, cryptocurrencies and blockchain, and mobile payments and other fintech topics — the IEO finance syllabus items not covered elsewhere.","concepts":[{"zh":"活期存款与定期存款","en":"Demand vs Time Deposits","def":"活期存款可随时支取、利率低，主要用于支付；定期存款约定期限、利率较高，提前支取通常只按活期利率计息或被罚息。","def_en":"Demand deposits can be withdrawn at any time and pay low interest; they are mainly used for payments. Time deposits have a fixed term and a higher rate, and early withdrawal usually earns only the demand-deposit rate or incurs a penalty."},{"zh":"存贷利差","en":"Interest Rate Spread","def":"银行贷款利率与存款利率之差，是商业银行最主要的利润来源（净利息收入），需覆盖运营成本和坏账损失。","def_en":"The difference between a bank's lending rate and its deposit rate. It is a commercial bank's main source of profit (net interest income) and must cover operating costs and loan losses."},{"zh":"存款保险","en":"Deposit Insurance","def":"银行倒闭时由保险机构在限额内偿付存款。中国为每位存款人在同一家银行本息合计最高 50 万元；美国 FDIC 为每位存款人、每家银行、每种账户所有权类别 25 万美元。","def_en":"If a bank fails, an insurer repays deposits up to a limit. In China the cap is 500,000 yuan of principal plus interest per depositor per bank; the US FDIC covers $250,000 per depositor, per insured bank, per ownership category."},{"zh":"银行挤兑","en":"Bank Run","def":"大量储户因担心银行无法兑付而同时取款。银行实行部分准备金制度，流动资产不足以应付集中提款，被迫低价变卖资产，恐慌可能自我实现。","def_en":"Many depositors withdraw at the same time because they fear the bank cannot pay. Under fractional reserve banking the bank lacks enough liquid assets for mass withdrawals and must sell assets at fire-sale prices, so the panic can become self-fulfilling."},{"zh":"保费、免赔额、共付比例与保额上限","en":"Premium, Deductible, Co-payment & Coverage Limit","def":"保费是保险的价格；免赔额是先由投保人自付的部分；共付比例 (co-insurance) 是超过免赔额后投保人仍需承担的比例；保额上限是保险公司最多赔付的金额。","def_en":"The premium is the price of insurance; the deductible is the part the policyholder pays first; co-payment (co-insurance) is the share the policyholder still bears above the deductible; the coverage limit is the most the insurer will pay."},{"zh":"风险汇聚","en":"Risk Pooling","def":"把大量独立风险集中在一起，由大数定律使平均损失变得可预测，保险公司据此定价；每人支付接近期望损失的保费，就能避免个人承担巨额损失。","def_en":"Combining many independent risks so that, by the law of large numbers, the average loss becomes predictable and the insurer can price it; each person pays a premium close to the expected loss and avoids bearing a huge loss alone."},{"zh":"逆向选择与道德风险","en":"Adverse Selection & Moral Hazard","def":"逆向选择发生在签约前：高风险者更愿意投保，导致保费上升、低风险者退出；道德风险发生在签约后：投保人因有保障而降低防范。","def_en":"Adverse selection happens before the contract: high-risk people are keener to buy insurance, pushing up premiums and driving low-risk people out. Moral hazard happens after the contract: the insured take less care because they are protected."},{"zh":"庞氏骗局与传销","en":"Ponzi & Pyramid Schemes","def":"庞氏骗局用后来投资者的钱支付先前投资者的“收益”；传销（金字塔骗局）靠发展下线收取入门费。二者都依赖新资金持续流入，终将崩盘。","def_en":"A Ponzi scheme pays earlier investors \"returns\" out of later investors' money; a pyramid scheme earns from recruits' joining fees. Both depend on a continuous inflow of new money and must eventually collapse."},{"zh":"众筹","en":"Crowdfunding","def":"通过互联网向大量小额出资者筹资，分为奖励型、捐赠型、股权型和债权型（P2P 网贷）四类，风险依次涉及项目失败、信息不对称和平台违约。","def_en":"Raising money from many small backers over the internet. The four types are reward, donation, equity and debt (P2P lending); risks include project failure, information asymmetry and platform default."},{"zh":"区块链、加密货币与 CBDC","en":"Blockchain, Cryptocurrency & CBDC","def":"区块链是由多方共同维护、按时间链接且难以篡改的分布式账本；加密货币是运行于其上的数字资产；央行数字货币 (CBDC，如数字人民币 e-CNY) 则是中央银行的负债，属于法定货币。","def_en":"A blockchain is a distributed ledger maintained by many parties, linked in time order and hard to tamper with; cryptocurrencies are digital assets running on it; a central bank digital currency (CBDC, such as the e-CNY) is a liability of the central bank and is legal tender."}],"formulas":[{"name":"净利息收入","f":"NII = r_L × 贷款 − r_D × 存款","note":"忽略坏账与运营成本；净息差 NIM = NII ÷ 生息资产。","name_en":"Net Interest Income","note_en":"Ignores loan losses and operating costs; net interest margin NIM = NII ÷ interest-earning assets.","f_en":"NII = r_L × Loans − r_D × Deposits"},{"name":"存款保险未保障金额","f":"未保障额 = Σ_每家银行 max(该行存款本息 − 限额, 0)","note":"限额按“每人每行”计算，在不同银行分散存款可提高总保障额。","name_en":"Uninsured Deposits","note_en":"The limit applies per depositor per bank, so spreading deposits across banks raises total coverage.","f_en":"Uninsured = Σ_each bank max(principal + interest at that bank − cap, 0)"},{"name":"保险赔付","f":"赔付 = min[(1 − c) × max(L − D, 0), 上限]","note":"L 损失，D 免赔额，c 共付比例；投保人自付 = L − 赔付。","name_en":"Insurance Payout","note_en":"L is the loss, D the deductible, c the co-payment share; the policyholder pays L − payout.","f_en":"Payout = min[(1 − c) × max(L − D, 0), Limit]"},{"name":"投保人期望总成本","f":"E(成本) = 保费 + Σ p_i × 自付_i","note":"比较保单时，风险中性者选期望总成本最低者；风险厌恶者还会看最坏情况。","name_en":"Policyholder's Expected Total Cost","note_en":"When comparing policies, a risk-neutral buyer picks the lowest expected total cost; a risk-averse buyer also looks at the worst case.","f_en":"E(Cost) = Premium + Σ p_i × Out-of-pocket_i"},{"name":"月收益折年","f":"年化 = (1 + r_月)^12 − 1","note":"“每月 2%”对应年化约 26.8%，远高于任何无风险利率，是典型诈骗信号。","name_en":"Annualising a Monthly Return","note_en":"\"2% a month\" is about 26.8% a year — far above any risk-free rate and a classic fraud warning sign.","f_en":"Annual = (1 + r_monthly)^12 − 1"}],"sections":[{"h":"银行如何赚钱：存款、利差与挤兑","body":"商业银行是**金融中介 (financial intermediary)**：吸收短期、可随时支取的存款，发放长期贷款，这叫**期限转换 (maturity transformation)**。\n例：某银行吸收存款 1,000 亿元（平均利率 1.5%），留 10% 作准备金，其余 900 亿元以 4.5% 贷出。\n- 利息收入 = 900 亿 × 4.5% = 40.5 亿元；\n- 利息支出 = 1,000 亿 × 1.5% = 15 亿元；\n- **净利息收入 = 25.5 亿元**，再扣除运营成本和坏账才是利润。\n期限转换的代价是脆弱性：若大量储户同时取款，银行只能**折价变卖 (fire sale)** 贷款，即使原本有偿付能力 (solvent) 也可能倒闭——这就是**挤兑 (bank run)**。2007 年英国北岩银行、2023 年美国硅谷银行 (SVB) 都出现过典型挤兑，后者的储户大多超出保险限额，通过手机在一天内转走巨额存款。","h_en":"How Banks Make Money: Deposits, Spreads and Runs","body_en":"A commercial bank is a **financial intermediary**: it takes short-term deposits that can be withdrawn at any time and makes long-term loans — this is called **maturity transformation**.\nExample: a bank takes in 100 billion yuan of deposits (average rate 1.5%), keeps 10% as reserves and lends the remaining 90 billion at 4.5%.\n- Interest income = 90 billion × 4.5% = 4.05 billion yuan;\n- Interest expense = 100 billion × 1.5% = 1.5 billion yuan;\n- **Net interest income = 2.55 billion yuan**; profit comes only after operating costs and loan losses are deducted.\nThe price of maturity transformation is fragility: if many depositors withdraw at once, the bank must sell loans at a discount (**fire sale**) and can fail even if it was originally solvent — this is a **bank run**. Northern Rock in the UK in 2007 and Silicon Valley Bank (SVB) in the US in 2023 are classic runs; most SVB depositors were above the insurance limit and moved huge sums out within a day using their phones."},{"h":"存款保险：保护储户也改变激励","body":"**存款保险**让小储户不必“抢先取款”，从根源上削弱挤兑的动机。中国《存款保险条例》规定：同一存款人在同一家投保银行的存款本息合计**最高赔付 50 万元**；美国 FDIC 为 **25 万美元**（按每人、每行、每种所有权类别计算）。\n计算要点：\n- 按“每人 × 每行”分别计算，活期和定期**合并**计算；\n- 例：在 A 行有活期 35 万 + 定期 30 万，在 B 行有 20 万。A 行保障 50 万，未保障 15 万；B 行全额保障；\n- 把超出部分转存到另一家银行即可全额受保。\n代价是**道德风险**：储户不再监督银行，银行可能冒更大风险。因此存款保险常配合**资本充足率监管**和按风险定价的保费。","h_en":"Deposit Insurance: Protecting Depositors, Changing Incentives","body_en":"**Deposit insurance** means small depositors need not \"run first\", removing the root incentive for a run. China's Deposit Insurance Regulations set the cap at **500,000 yuan** of principal plus interest per depositor per insured bank; the US FDIC covers **$250,000** (per depositor, per bank, per ownership category).\nKey points for calculations:\n- compute per depositor × per bank, with demand and time deposits **added together**;\n- example: 350,000 demand + 300,000 time deposits at Bank A and 200,000 at Bank B. Bank A is covered up to 500,000, leaving 150,000 uninsured; Bank B is fully covered;\n- moving the excess to another bank makes everything insured.\nThe cost is **moral hazard**: depositors stop monitoring banks, and banks may take bigger risks. Deposit insurance is therefore paired with **capital adequacy regulation** and risk-based premiums."},{"h":"保险合同与如何选保单","body":"保险的本质是**风险汇聚**：1 万名车主各有 2% 概率损失 5 万元，每人期望损失 1,000 元；保险公司收取略高于 1,000 元的保费（附加费用 loading 覆盖成本与利润），就能赔付所有出险者。\n比较两份保单时计算**期望总成本 = 保费 + 期望自付**：\n- 保单 A：保费 1,200，免赔额 500；保单 B：保费 800，免赔额 2,000；出险概率 20%，损失 6,000；\n- A = 1,200 + 0.2 × 500 = **1,300**；B = 800 + 0.2 × 2,000 = **1,200**；\n- B 期望成本更低，但最坏情况 B 需付 2,800，A 只需 1,700。风险厌恶程度高、现金储备少的人可能仍选 A。\n**逆向选择**：投保人比保险公司更了解自身风险，高风险者更愿意买，导致“死亡螺旋 (death spiral)”，对策是体检、分级定价、强制参保。**道德风险**：投保后更少防范，对策是免赔额、共付比例、无赔款优待 (no-claims bonus)。","h_en":"Insurance Contracts and Choosing a Policy","body_en":"The essence of insurance is **risk pooling**: if 10,000 drivers each face a 2% chance of a 50,000-yuan loss, each has an expected loss of 1,000 yuan; by charging a premium slightly above 1,000 (the loading covers costs and profit), the insurer can pay everyone who has an accident.\nTo compare two policies, compute **expected total cost = premium + expected out-of-pocket cost**:\n- Policy A: premium 1,200, deductible 500; Policy B: premium 800, deductible 2,000; probability of a claim 20%, loss 6,000;\n- A = 1,200 + 0.2 × 500 = **1,300**; B = 800 + 0.2 × 2,000 = **1,200**;\n- B has the lower expected cost, but in the worst case B costs 2,800 versus only 1,700 for A. Someone very risk-averse or with little cash may still choose A.\n**Adverse selection**: policyholders know their own risk better than the insurer, so high-risk people are keener to buy, which can cause a \"death spiral\"; remedies include medical checks, risk-based pricing and compulsory insurance. **Moral hazard**: people take less care once insured; remedies include deductibles, co-payments and a no-claims bonus."},{"h":"识别金融诈骗","body":"经济学直觉是最好的防骗工具：**高收益必然伴随高风险**，“保本高收益”违背了风险—收益权衡。\n- **庞氏骗局**：用新钱付旧账。承诺“每月 2%”即年化 (1.02)^12 − 1 ≈ **26.8%**，远超存款利率；一旦新资金放缓即崩盘（如麦道夫案）；\n- **传销/金字塔骗局**：收益主要来自发展下线而非真实产品；每层人数指数增长，很快超过总人口；\n- **拉高出货 (pump-and-dump)**：操纵者在社交媒体炒作低市值股票或代币，价格被推高后抛售，后来者接盘；\n- **网络钓鱼 (phishing)**：冒充银行、快递或客服，诱骗点击链接、提供验证码或密码。\n红旗信号：保证收益、催促“名额有限”、要求转账到个人账户、无法解释盈利来源、无牌照经营。保护身份：不泄露验证码，开启双重验证，只通过官方渠道联系金融机构。","h_en":"Spotting Financial Fraud","body_en":"Economic intuition is the best defence: **high returns always come with high risk**, and \"guaranteed high returns with no risk to principal\" violates the risk–return trade-off.\n- **Ponzi scheme**: pays old investors with new money. A promise of \"2% a month\" is an annual (1.02)^12 − 1 ≈ **26.8%**, far above deposit rates; it collapses once new money slows (e.g. the Madoff case);\n- **Pyramid scheme**: income comes mainly from recruiting others rather than from real products; the number of people at each level grows exponentially and soon exceeds the whole population;\n- **Pump-and-dump**: manipulators hype a small-cap stock or token on social media, sell once the price has been pushed up, and latecomers are left holding the losses;\n- **Phishing**: impersonating a bank, courier or customer service to trick people into clicking links or giving away verification codes or passwords.\nRed flags: guaranteed returns, pressure because \"places are limited\", requests to transfer money to a personal account, no explanation of where profits come from, no licence. Protect your identity: never share verification codes, turn on two-factor authentication, and contact financial institutions only through official channels."},{"h":"众筹、加密货币与数字支付","body":"**众筹**四类：奖励型（出资换产品，如预售）、捐赠型（无回报）、股权型（换取初创公司股份，高风险低流动性）、债权型/P2P（借给个人或企业收利息）。中国 P2P 网贷行业因大量平台违约和欺诈，已于 2020 年前后被清理归零，说明信息不对称与监管缺位的风险。\n**区块链**是分布式账本：每个区块包含前一区块的哈希值，改动历史记录需要重算后续所有区块并获得多数节点认可。达成共识的方式有**工作量证明 (PoW)**（矿工耗费算力竞争记账，比特币采用）与**权益证明 (PoS)**（按质押的代币数量选择验证者，能耗低得多）。\n- 加密货币价格**波动剧烈**，缺乏内在现金流，难以胜任价值尺度和价值储藏职能；\n- **稳定币 (stablecoin)** 试图锚定美元等法币，其稳定性取决于储备资产的质量与透明度，算法稳定币曾出现脱锚崩盘；\n- **央行数字货币 (CBDC)** 如数字人民币 (e-CNY) 是央行负债，与现金等价，不同于私人加密货币；\n- 各国监管差异大：有的禁止交易与挖矿（中国内地），有的对交易所发牌照监管。\n**移动支付**（支付宝、微信支付的二维码支付）降低了交易成本，推动了普惠金融 (financial inclusion)，但也带来数据隐私和平台集中度问题。","h_en":"Crowdfunding, Crypto and Digital Payments","body_en":"**Crowdfunding** comes in four types: reward (money in exchange for a product, e.g. pre-sales), donation (no return), equity (shares in a start-up; high risk, low liquidity) and debt/P2P (lending to individuals or firms for interest). China's P2P lending sector was wound down to zero around 2020 after widespread platform defaults and fraud, showing the risks of information asymmetry and weak regulation.\nA **blockchain** is a distributed ledger: each block contains the hash of the previous block, so changing past records requires recomputing every later block and winning acceptance from most nodes. Consensus is reached by **proof of work (PoW)** (miners spend computing power competing to add blocks; used by Bitcoin) or **proof of stake (PoS)** (validators are chosen according to the tokens they stake, using far less energy).\n- Cryptocurrency prices are **highly volatile** and have no underlying cash flows, so they perform poorly as a unit of account and store of value;\n- **Stablecoins** try to peg to a fiat currency such as the US dollar; their stability depends on the quality and transparency of the reserve assets, and algorithmic stablecoins have lost their pegs and collapsed;\n- A **central bank digital currency (CBDC)** such as the e-CNY is a central bank liability equivalent to cash, unlike private cryptocurrencies;\n- Regulation varies widely: some jurisdictions ban trading and mining (mainland China), others license and supervise exchanges.\n**Mobile payments** (QR-code payments via Alipay and WeChat Pay) cut transaction costs and have boosted financial inclusion, but raise concerns about data privacy and platform concentration."}],"pitfalls":["以为存款保险 50 万元是“每人总共”——实际是每人在每家银行分别计算，且活期定期、本金利息合并计算。","把道德风险与逆向选择混淆：签约前隐藏信息 (hidden information) 是逆向选择；签约后隐藏行为 (hidden action) 是道德风险。","只比较保费高低选保单，忽略免赔额、共付比例带来的期望自付和最坏情况。","把“每月 2%”简单乘 12 当作年化 24%，忽略复利；更重要的是忘了追问高收益从何而来。","把稳定币或数字人民币等同于比特币：CBDC 是央行负债、法定货币，稳定币依赖储备，比特币没有发行方兜底。"],"pitfalls_en":["Thinking the 500,000-yuan deposit insurance cap is \"per person in total\" — it is calculated separately per depositor per bank, with demand and time deposits, and principal and interest, added together.","Mixing up moral hazard and adverse selection: hidden information before the contract is adverse selection; hidden action after the contract is moral hazard.","Choosing a policy only by comparing premiums, ignoring the expected out-of-pocket cost and worst case created by deductibles and co-payments.","Treating \"2% a month\" as simply 24% a year by multiplying by 12, ignoring compounding — and, more importantly, forgetting to ask where such high returns come from.","Treating stablecoins or the e-CNY as the same as Bitcoin: a CBDC is a central bank liability and legal tender, a stablecoin depends on its reserves, and Bitcoin has no issuer standing behind it."],"exams":{"AP":"Macro Unit 4（banks & fractional reserve，部分）","IB":"—（3.5 货币政策涉及商业银行，部分）","AL":"9708 A Level（money & banking，部分）","IEO":"Finance: banking & deposits, insurance, fraud prevention, crowdfunding, crypto & blockchain","NEC":"CEE Standards 10–12（institutions, money & banks, interest rates）"},"diagram":null},{"id":"F7","unit":"finance","title_zh":"经济学研究方法与数据分析","title_en":"Economic Methods & Data","level":"G9+","summary":"经济学家如何用模型和数据回答“是否”“多少”的问题？本课讲实证与规范表述、模型与“其他条件不变”假设、相关与因果的区别，以及随机对照试验、自然实验、双重差分和回归等识别因果的方法；同时训练指数、实际与名义、百分比与百分点、复合年增长率等读数基本功，对应 IEO“前沿问题与数据驱动研究方法”和 IB/A-Level 方法论。","summary_en":"How do economists use models and data to answer \"whether\" and \"how much\" questions? This lesson covers positive vs normative statements, models and the ceteris paribus assumption, the difference between correlation and causation, and methods for identifying causal effects — randomised controlled trials, natural experiments, difference-in-differences and regression. It also drills basic data skills: index numbers, real vs nominal, percent vs percentage points and compound annual growth rates, matching IEO's \"frontiers and data-driven research methods\" and IB/A-Level methodology.","concepts":[{"zh":"实证与规范表述","en":"Positive vs Normative Statements","def":"实证表述描述“是什么”，原则上可用数据检验；规范表述涉及“应该怎样”，包含价值判断，无法仅凭数据证伪。","def_en":"Positive statements describe \"what is\" and can in principle be tested with data; normative statements concern \"what ought to be\", involve value judgements and cannot be refuted by data alone."},{"zh":"模型与其他条件不变","en":"Models & Ceteris Paribus","def":"模型是对现实的简化，用假设突出关键关系；“其他条件不变”指分析一个变量的影响时保持其他因素固定。","def_en":"A model is a simplification of reality that uses assumptions to highlight key relationships; ceteris paribus means holding other factors constant while analysing the effect of one variable."},{"zh":"相关与因果","en":"Correlation vs Causation","def":"两个变量一起变动不代表一个导致另一个；可能存在遗漏变量 (omitted variable)、反向因果 (reverse causality) 或纯属巧合。","def_en":"Two variables moving together does not mean one causes the other; there may be an omitted variable, reverse causality, or pure coincidence."},{"zh":"选择偏差","en":"Selection Bias","def":"接受“处理”的个体与未接受者本身就不同（如主动报名补习的学生），直接比较两组结果会混淆处理效应与原有差异。","def_en":"Those who receive a \"treatment\" differ from those who do not (e.g. students who choose to sign up for tutoring), so directly comparing the two groups confuses the treatment effect with pre-existing differences."},{"zh":"随机对照试验","en":"Randomised Controlled Trial (RCT)","def":"随机分配处理组与对照组，使两组在平均意义上除处理外完全相同，因此结果差异可归因于处理。发展经济学中广泛使用。","def_en":"Randomly assigning a treatment and a control group makes the groups identical on average apart from the treatment, so differences in outcomes can be attributed to it. Widely used in development economics."},{"zh":"自然实验与双重差分","en":"Natural Experiments & Difference-in-Differences","def":"自然实验利用政策或事件造成的“近似随机”变化；双重差分 (DiD) 用处理组前后变化减去对照组前后变化，关键假设是平行趋势 (parallel trends)。","def_en":"A natural experiment exploits \"as-if random\" variation created by a policy or event; difference-in-differences (DiD) subtracts the control group's before–after change from the treatment group's, relying on the parallel trends assumption."},{"zh":"回归分析","en":"Regression Analysis","def":"用直线（或曲线）拟合数据，斜率表示解释变量变动 1 单位时因变量平均变动多少；R² 表示模型解释了因变量变异的比例；统计显著指结果不太可能纯属偶然。","def_en":"Fitting a line (or curve) to data; the slope shows how much the dependent variable changes on average when the explanatory variable rises by 1 unit; R² is the share of variation in the dependent variable the model explains; statistically significant means the result is unlikely to be due to chance alone."},{"zh":"指数与基期","en":"Index Numbers & Base Year","def":"指数 = 当期值 ÷ 基期值 × 100，基期指数为 100；更换基期 (rebasing) 时把各期数值都除以新基期的数值再乘 100。","def_en":"Index = current value ÷ base-period value × 100, with the base period set to 100; rebasing divides every period's value by the new base period's value and multiplies by 100."},{"zh":"百分比与百分点","en":"Percent vs Percentage Point","def":"比率从 4% 升到 5% 是上升 1 个百分点 (percentage point)，但相对上升 25%（百分比变化）。","def_en":"A rate rising from 4% to 5% is a rise of 1 percentage point, but a relative rise of 25% (a percentage change)."},{"zh":"复合年增长率","en":"Compound Annual Growth Rate (CAGR)","def":"多年间每年平均的复合增长率，考虑了复利效应，比简单平均更准确。","def_en":"The average compound growth rate per year over several years; it accounts for compounding and is more accurate than a simple average."}],"formulas":[{"name":"双重差分估计","f":"DiD = (Y_处理,后 − Y_处理,前) − (Y_对照,后 − Y_对照,前)","note":"对照组的变化代表“若无政策会发生什么”；需满足平行趋势假设。","name_en":"Difference-in-Differences Estimate","note_en":"The control group's change represents \"what would have happened without the policy\"; requires the parallel trends assumption.","f_en":"DiD = (Y_treat,after − Y_treat,before) − (Y_control,after − Y_control,before)"},{"name":"复合年增长率","f":"CAGR = (终值 ÷ 初值)^(1/n) − 1","note":"n 为年数；简单平均 (总增长 ÷ n) 会高估复合增长率。","name_en":"Compound Annual Growth Rate","note_en":"n is the number of years; a simple average (total growth ÷ n) overstates the compound rate.","f_en":"CAGR = (End value ÷ Start value)^(1/n) − 1"},{"name":"更换基期","f":"新指数_t = 旧指数_t ÷ 旧指数_新基期 × 100","note":"只改变参照点，不改变各期之间的相对变化。","name_en":"Rebasing an Index","note_en":"Changes only the reference point, not the relative changes between periods.","f_en":"New index_t = Old index_t ÷ Old index_new base × 100"},{"name":"实际增长率","f":"1 + 实际 = (1 + 名义) ÷ (1 + 通胀)","note":"近似：实际 ≈ 名义 − 通胀；通胀较高时应使用精确公式。","name_en":"Real Growth Rate","note_en":"Approximation: real ≈ nominal − inflation; use the exact formula when inflation is high.","f_en":"1 + real = (1 + nominal) ÷ (1 + inflation)"},{"name":"对数—对数回归中的弹性","f":
