ed value for 2020, not 2024."},{"id":"F7-04","t":"F7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Between two years, a worker's nominal monthly wage rises from 5,000 to 5,600 while the consumer price index rises from 100 to 108. By approximately how much did the worker's real wage change?","o":["Rose by 12%","Rose by 20%","Rose by about 3.7%","Fell by about 8%"],"a":2,"e":"名义工资增长 = 5,600 ÷ 5,000 − 1 = 12%；通胀 = 8%。实际工资增长 = 1.12 ÷ 1.08 − 1 ≈ **3.7%**（近似法 12% − 8% = 4%）。选 12% 忽略了通胀；20% 把通胀加上而非减去；“下降 8%”只看到了物价上涨。","e_en":"Nominal wage growth = 5,600 ÷ 5,000 − 1 = 12%; inflation = 8%. Real wage growth = 1.12 ÷ 1.08 − 1 ≈ **3.7%** (approximation: 12% − 8% = 4%). 12% ignores inflation; 20% adds inflation instead of subtracting it; \"fell by 8%\" looks only at the price rise."},{"id":"F7-05","t":"F7","lv":2,"ex":["IEO"],"q":"In 2024 Region T introduced a free school-lunch programme; Region C did not. The table shows average attendance rates. Using difference-in-differences, what is the estimated effect of the programme on attendance?","tbl":[["Region","2023 (before)","2025 (after)"],["T (treated)","80%","88%"],["C (control)","82%","85%"]],"o":["+8 percentage points","+11 percentage points","+3 percent","+5 percentage points"],"a":3,"e":"DiD = 处理组变化 − 对照组变化 = (88 − 80) − (85 − 82) = 8 − 3 = **+5 个百分点**。选 +8 只看处理组前后变化，把共同趋势（对照组也上升 3 点）也算成了政策效果；+11 把两者相加；+3 只是对照组的变化，而且单位应为百分点而非百分比。","e_en":"DiD = change in treatment group − change in control group = (88 − 80) − (85 − 82) = 8 − 3 = **+5 percentage points**. +8 looks only at the treated region's before–after change, counting the common trend (the control also rose 3 points) as a policy effect; +11 adds the two changes; +3 is just the control group's change, and the unit should be percentage points, not percent."},{"id":"F7-06","t":"F7","lv":3,"ex":["IEO","AL"],"q":"A country's real GDP grew from 800 billion to 1,200 billion over 6 years. What was its compound annual growth rate (CAGR), to one decimal place?","o":["8.3%","7.0%","6.0%","50.0%"],"a":1,"e":"CAGR = (1,200 ÷ 800)^(1/6) − 1 = 1.5^(1/6) − 1 ≈ **7.0%**。验证：1.07^6 ≈ 1.50。选 8.3% 是简单平均 50% ÷ 6，忽略了复利，所以高估；50% 是 6 年总增长；6.0% ≈ 1.5^(1/7) − 1，把首尾年份都算上误用了 7 年。","e_en":"CAGR = (1,200 ÷ 800)^(1/6) − 1 = 1.5^(1/6) − 1 ≈ **7.0%**. Check: 1.07^6 ≈ 1.50. 8.3% is the simple average 50% ÷ 6, which ignores compounding and so overstates growth; 50% is the total growth over 6 years; 6.0% ≈ 1.5^(1/7) − 1, wrongly counting 7 years by including both end years."},{"id":"F7-07","t":"F7","lv":2,"ex":["IB","AL","IEO"],"q":"A survey finds that students who attend after-school tutoring have LOWER average exam scores than students who do not. The MOST likely reason this does NOT show that tutoring harms learning is:","o":["Reverse causality/selection: students with weaker scores are more likely to sign up for tutoring","The sample is too large to be reliable","Exam scores cannot be measured objectively","Tutoring is a normative issue, so it cannot be studied with data"],"a":0,"e":"成绩差的学生更可能去补习，即**反向因果 (reverse causality)** / **选择偏差 (selection bias)**：两组本来就不同，不能把差异归因于补习。更好的方法是随机分配补习机会 (RCT) 或比较同一学生补习前后相对于对照组的变化 (DiD)。样本大反而更可靠；成绩可以客观测量；补习效果是实证问题，可以用数据研究。","e_en":"Weaker students are more likely to seek tutoring — **reverse causality / selection bias**: the two groups differ to begin with, so the gap cannot be attributed to tutoring. Better approaches are randomly assigning tutoring places (an RCT) or comparing the same students' changes before and after tutoring relative to a control group (DiD). A large sample is more reliable, not less; scores can be measured objectively; the effect of tutoring is a positive question that can be studied with data."},{"id":"F7-08","t":"F7","lv":3,"ex":["IEO","AP","IB"],"q":"Using data from 200 stores, an analyst estimates the regression ln(Q) = 5.2 − 0.8 × ln(P), where Q is weekly sales and P is price. Assuming the estimate is causal, which conclusion is correct?","o":["A 1-yuan price increase lowers weekly sales by 0.8 units","Demand is price elastic, so raising the price will reduce total revenue","A 10% price increase lowers sales by about 80%","A 10% price increase lowers sales by about 8%, so raising the price would increase total revenue"],"a":3,"e":"对数—对数 (log–log) 回归的斜率就是弹性：PED ≈ −0.8，价格上涨 10%，销量约下降 8%。|PED| < 1，需求缺乏弹性 (inelastic)，涨价使总收益上升（约 1.10 × 0.92 ≈ 1.012）。选 A 把弹性误读为线性斜率（单位变化）；B 把 0.8 误判为富有弹性；C 把 −0.8 当成了 −8。","e_en":"In a log–log regression the slope is the elasticity: PED ≈ −0.8, so a 10% price rise lowers sales by about 8%. |PED| < 1, so demand is inelastic and a price rise increases total revenue (about 1.10 × 0.92 ≈ 1.012). A misreads the elasticity as a linear slope (unit change); B wrongly treats 0.8 as elastic; C treats −0.8 as −8."},{"id":"F7-09","t":"F7","lv":2,"ex":["IB","AL","IEO"],"q":"A regression on 1,000 workers estimates: Annual wage = 20,000 + 3,000 × (years of schooling), with R² = 0.25 and the slope statistically significant at the 1% level. Which interpretation is correct?","o":["Each extra year of schooling definitely causes wages to rise by exactly 3,000","On average, one more year of schooling is associated with a 3,000 higher annual wage, and schooling explains about 25% of the variation in wages","Because R² is only 0.25, the relationship is not statistically significant","A worker with 10 years of schooling earns 25% more than one with no schooling"],"a":1,"e":"斜率 3,000 表示受教育年限每多 1 年，工资**平均**高 3,000 元，这是相关 (association)——可能存在能力等遗漏变量，未必是因果；R² = 0.25 表示模型解释了工资变异的 25%。A 错在“一定导致”“恰好”；C 混淆了拟合优度与显著性：R² 低也可以显著；D：10 年对应 20,000 + 30,000 = 50,000，比 20,000 高 150%，而非 25%。","e_en":"The slope of 3,000 means each extra year of schooling is associated with a wage 3,000 higher **on average** — an association that may reflect omitted variables such as ability, not necessarily causation; R² = 0.25 means the model explains 25% of the variation in wages. A is wrong about \"definitely causes\" and \"exactly\"; C confuses goodness of fit with significance — a low R² can still be significant; D: 10 years gives 20,000 + 30,000 = 50,000, which is 150% more than 20,000, not 25%."},{"id":"F7-10","t":"F7","lv":3,"ex":["IEO"],"q":"Researchers use difference-in-differences to study a tax cut introduced in Province P, using neighbouring Province N as the control. Which finding would MOST undermine the credibility of their estimate?","o":["Province P has a higher average income level than Province N","The sample includes several thousand firms","In the five years before the tax cut, investment in Province P was already growing much faster than in Province N","The tax cut was announced in the national media"],"a":2,"e":"DiD 的关键假设是**平行趋势 (parallel trends)**：若无政策，两地变化幅度相同。政策前 P 省投资增速已明显快于 N 省，说明两地趋势本不平行，DiD 会把原有的更快增长误算为政策效果。A 错：DiD 允许两组“水平”不同，只要求“趋势”相同；B 样本量大是优点；D 公开宣布本身不破坏识别（除非引发预期效应，但不是最主要的威胁）。","e_en":"The key DiD assumption is **parallel trends**: without the policy, both provinces would have changed by the same amount. If investment in P was already growing much faster than in N before the policy, the trends were not parallel and DiD would wrongly count the pre-existing faster growth as a policy effect. A is wrong: DiD allows the groups to differ in levels, requiring only the same trends; B, a large sample, is a strength; D, public announcement, does not by itself break identification (anticipation effects are possible but not the main threat)."}],"problems":[{"id":"P-m1-1","t":"m1","title":"Rice, Steel and the Gains from Trade","stem":"Alpha and Beta each produce rice and steel using only labor, with constant labor requirements. In Alpha, 1 ton of rice requires 2 labor-hours and 1 ton of steel requires 6 labor-hours. In Beta, 1 ton of rice requires 4 labor-hours and 1 ton of steel requires 8 labor-hours. Alpha has 1,200 labor-hours and Beta has 1,600 labor-hours available. Before trade, each country devotes half of its labor to each good.","parts":[{"q":"(a) Which country has an absolute advantage in each good? Which country has a comparative advantage in each good? Show opportunity costs.","sol":"绝对优势 (absolute advantage)：Alpha 生产 1 吨大米只需 2 小时（Beta 4 小时），1 吨钢只需 6 小时（Beta 8 小时），Alpha 在两种商品上都有绝对优势。\n机会成本（注意题目给的是单位工时，要用工时之比）：\n- Alpha：1 钢 = 6/2 = 3 米；1 米 = 1/3 钢。\n- Beta：1 钢 = 8/4 = 2 米；1 米 = 1/2 钢。\nBeta 生产钢的机会成本更低（2 < 3），在钢上有比较优势 (comparative advantage)；Alpha 生产大米的机会成本更低（1/3 < 1/2），在大米上有比较优势。","sol_en":"Absolute advantage: Alpha needs only 2 hours to produce 1 ton of rice (Beta needs 4 hours) and only 6 hours to produce 1 ton of steel (Beta needs 8 hours), so Alpha has an absolute advantage in both goods.\nOpportunity costs (note that the question gives labor-hours per unit, so use the ratio of labor-hours):\n- Alpha: 1 steel = 6/2 = 3 rice; 1 rice = 1/3 steel.\n- Beta: 1 steel = 8/4 = 2 rice; 1 rice = 1/2 steel.\nBeta has the lower opportunity cost of producing steel (2 < 3), so it has a comparative advantage in steel; Alpha has the lower opportunity cost of producing rice (1/3 < 1/2), so it has a comparative advantage in rice."},{"q":"(b) Calculate each country's autarky output and world output. Then calculate world output if each country specializes completely according to comparative advantage.","sol":"自给自足 (autarky)，各用一半劳动：\n- Alpha：大米 600/2 = 300 吨，钢 600/6 = 100 吨。\n- Beta：大米 800/4 = 200 吨，钢 800/8 = 100 吨。\n世界产量：大米 500 吨，钢 200 吨。\n完全专业化：Alpha 全部生产大米 1200/2 = 600 吨；Beta 全部生产钢 1600/8 = 200 吨。\n世界产量：大米 600 吨，钢 200 吨——钢不变，大米多出 100 吨，这就是专业化带来的产出增加。","sol_en":"Autarky, with each country using half its labor on each good:\n- Alpha: rice 600/2 = 300 tons, steel 600/6 = 100 tons.\n- Beta: rice 800/4 = 200 tons, steel 800/8 = 100 tons.\nWorld output: 500 tons of rice, 200 tons of steel.\nComplete specialization: Alpha produces only rice, 1200/2 = 600 tons; Beta produces only steel, 1600/8 = 200 tons.\nWorld output: 600 tons of rice, 200 tons of steel — steel is unchanged and there are 100 more tons of rice; this is the increase in output from specialization."},{"q":"(c) What range of terms of trade (tons of rice per ton of steel) benefits both countries? Suppose trade occurs at 1 steel = 2.5 rice and Beta exports 100 tons of steel. Compare each country's consumption with autarky.","sol":"互利贸易条件必须位于两国钢的机会成本之间：2 < 1 钢的价格 < 3 米。\n按 1 钢 = 2.5 米，Beta 出口 100 吨钢换回 250 吨米：\n- Alpha 消费：大米 600 − 250 = 350 吨，钢 100 吨（自给自足时 300 米、100 钢）→ 多 50 吨大米。\n- Beta 消费：大米 250 吨，钢 200 − 100 = 100 吨（自给自足时 200 米、100 钢）→ 多 50 吨大米。\n两国都获益，总收益 100 吨大米，正好等于 (b) 中专业化带来的产出增加。","sol_en":"Mutually beneficial terms of trade must lie between the two countries' opportunity costs of steel: 2 < price of 1 steel < 3 rice.\nAt 1 steel = 2.5 rice, Beta exports 100 tons of steel in exchange for 250 tons of rice:\n- Alpha's consumption: rice 600 − 250 = 350 tons, steel 100 tons (under autarky, 300 rice and 100 steel) → 50 more tons of rice.\n- Beta's consumption: rice 250 tons, steel 200 − 100 = 100 tons (under autarky, 200 rice and 100 steel) → 50 more tons of rice.\nBoth countries gain; the total gain is 100 tons of rice, exactly equal to the increase in output from specialization in (b)."},{"q":"(d) Suppose a new irrigation technology halves the labor needed for rice in Beta (to 2 hours per ton), with everything else unchanged. How does the pattern of comparative advantage change, and what is the new range of mutually beneficial terms of trade?","sol":"Beta 的新机会成本：1 钢 = 8/2 = 4 米（1 米 = 1/4 钢）。Alpha 仍为 1 钢 = 3 米（1 米 = 1/3 钢）。\n现在 Alpha 生产钢的机会成本更低（3 < 4），比较优势发生逆转：Alpha 应专业化生产钢，Beta 专业化生产大米。\n新的互利贸易条件：3 米 < 1 钢 < 4 米。\n启示：比较优势取决于相对生产率，一国某部门的技术进步可能改变整个贸易格局，这也说明即使绝对优势不变（此时两国大米生产率相同），比较优势仍可能改变。","sol_en":"Beta's new opportunity cost: 1 steel = 8/2 = 4 rice (1 rice = 1/4 steel). Alpha's is still 1 steel = 3 rice (1 rice = 1/3 steel).\nAlpha now has the lower opportunity cost of producing steel (3 < 4), so comparative advantage is reversed: Alpha should specialize in steel and Beta in rice.\nNew mutually beneficial terms of trade: 3 rice < 1 steel < 4 rice.\nLesson: comparative advantage depends on relative productivity, and technological progress in one sector of a country can change the entire pattern of trade. This also shows that comparative advantage can change even when absolute advantage does not (here the two countries are now equally productive in rice)."}]},{"id":"P-m4-1","t":"m4","title":"Who Really Pays the Tax?","stem":"In a competitive market, demand is Qd = 240 − 4P and supply is Qs = 6P − 60, where P is in dollars and Q in thousands of units. The government is considering a per-unit tax collected from sellers.","parts":[{"q":"(a) Find the equilibrium price and quantity, consumer surplus and producer surplus before the tax.","sol":"令 240 − 4P = 6P − 60 → 10P = 300 → P* = 30，Q* = 240 − 120 = 120。\n需求价格截距：Qd = 0 → P = 60；供给价格截距：Qs = 0 → P = 10。\nCS = ½ × (60 − 30) × 120 = 1,800；PS = ½ × (30 − 10) × 120 = 1,200（单位：千美元）。总剩余 3,000。","sol_en":"Set 240 − 4P = 6P − 60 → 10P = 300 → P* = 30, Q* = 240 − 120 = 120.\nDemand price intercept: Qd = 0 → P = 60; supply price intercept: Qs = 0 → P = 10.\nCS = ½ × (60 − 30) × 120 = 1,800; PS = ½ × (30 − 10) × 120 = 1,200 (in thousands of dollars). Total surplus 3,000."},{"q":"(b) A tax of $5 per unit is imposed on sellers. Find the price paid by consumers, the price received by producers, the new quantity, tax revenue and deadweight loss.","sol":"税后供给：Qs = 6(P − 5) − 60 = 6P − 90。令 240 − 4P = 6P − 90 → 10P = 330 → P_c = 33，Q = 240 − 132 = 108，P_s = 33 − 5 = 28。\n消费者每单位多付 3，生产者每单位少得 2。\n税收 = 5 × 108 = 540；DWL = ½ × 5 × (120 − 108) = 30（千美元）。","sol_en":"After-tax supply: Qs = 6(P − 5) − 60 = 6P − 90. Set 240 − 4P = 6P − 90 → 10P = 330 → P_c = 33, Q = 240 − 132 = 108, P_s = 33 − 5 = 28.\nConsumers pay 3 more per unit, and producers receive 2 less per unit.\nTax revenue = 5 × 108 = 540; DWL = ½ × 5 × (120 − 108) = 30 (in thousands of dollars)."},{"q":"(c) Compute the price elasticities of demand and supply at the original equilibrium and show that the formula consumer share = PES ÷ (PES + |PED|) matches your answer to (b).","sol":"PED = (dQ/dP) × (P/Q) = −4 × 30/120 = −1；PES = 6 × 30/120 = 1.5。\n消费者承担比例 = 1.5 ÷ (1.5 + 1) = 0.6，即 0.6 × 5 = 3，与 (b) 中消费者价格上升 3 完全一致；生产者承担 0.4 × 5 = 2。\n对线性模型，这等价于 d ÷ (b + d) = 6 ÷ 10 = 0.6：供给越有弹性（相对需求），消费者承担越多。","sol_en":"PED = (dQ/dP) × (P/Q) = −4 × 30/120 = −1; PES = 6 × 30/120 = 1.5.\nConsumer share = 1.5 ÷ (1.5 + 1) = 0.6, i.e. 0.6 × 5 = 3, which matches exactly the rise of 3 in the consumer price in (b); producers bear 0.4 × 5 = 2.\nFor a linear model, this is equivalent to d ÷ (b + d) = 6 ÷ 10 = 0.6: the more elastic supply is (relative to demand), the more consumers bear."},{"q":"(d) Write tax revenue as a function of the tax t. Which tax maximizes revenue, and what is the deadweight loss at that tax? Comment on the trade-off.","sol":"一般地：240 − 4P_c = 6(P_c − t) − 60 → P_c = 30 + 0.6t，Q(t) = 240 − 4(30 + 0.6t) = 120 − 2.4t。\n税收 R(t) = t(120 − 2.4t) = 120t − 2.4t²；dR/dt = 120 − 4.8t = 0 → t = 25。\n此时 Q = 60，R = 25 × 60 = 1,500；DWL = ½ × 25 × (120 − 60) = 750。\n对比：t = 5 时 DWL 只有 30，但收入为 540。税额扩大 5 倍，DWL 扩大 25 倍（DWL = 1.2t²，随税率平方增长），而收入不到 3 倍。政府若在意效率，不应把税率推到收入最大化水平；超过 t = 25 后提税反而减少收入（拉弗曲线的微观版本）。","sol_en":"In general: 240 − 4P_c = 6(P_c − t) − 60 → P_c = 30 + 0.6t, Q(t) = 240 − 4(30 + 0.6t) = 120 − 2.4t.\nTax revenue R(t) = t(120 − 2.4t) = 120t − 2.4t²; dR/dt = 120 − 4.8t = 0 → t = 25.\nAt this tax, Q = 60, R = 25 × 60 = 1,500; DWL = ½ × 25 × (120 − 60) = 750.\nComparison: at t = 5, DWL is only 30, but revenue is 540. Multiplying the tax by 5 multiplies DWL by 25 (DWL = 1.2t², growing with the square of the tax), while revenue less than triples. If the government cares about efficiency, it should not push the tax up to the revenue-maximizing level; beyond t = 25, raising the tax actually reduces revenue (a microeconomic version of the Laffer curve)."}]},{"id":"P-m7-1","t":"m7","title":"Monopoly Pricing and Price Discrimination","stem":"A pharmaceutical company holds a patent on a drug. Domestic demand is P = 200 − 2Q (Q in thousands of doses, P in $). Marginal cost and average cost are constant at $40 per dose (no fixed costs).","parts":[{"q":"(a) Find the profit-maximizing quantity, price and profit for the monopolist in the domestic market.","sol":"MR = 200 − 4Q（线性需求的 MR 斜率加倍）。令 MR = MC：200 − 4Q = 40 ⇒ Q = 40（千剂）。代入需求曲线：P = 200 − 80 = 120 美元。利润 = (P − AC) × Q = (120 − 40) × 40 = 3200（千美元）。","sol_en":"MR = 200 − 4Q (for linear demand, the MR curve has twice the slope). Setting MR = MC: 200 − 4Q = 40 ⇒ Q = 40 (thousand doses). Substituting into the demand curve: P = 200 − 80 = $120. Profit = (P − AC) × Q = (120 − 40) × 40 = 3200 (thousand dollars)."},{"q":"(b) Calculate consumer surplus and the deadweight loss compared with the perfectly competitive outcome.","sol":"消费者剩余 (CS) = ½ × (200 − 120) × 40 = 1600。完全竞争时 P = MC = 40 ⇒ 200 − 2Q = 40 ⇒ Q = 80。无谓损失 (DWL) = ½ × (120 − 40) × (80 − 40) = 1600。（竞争下 CS = ½ × 160 × 80 = 6400 = 垄断 CS 1600 + 利润 3200 + DWL 1600，可作检验。）","sol_en":"Consumer surplus (CS) = ½ × (200 − 120) × 40 = 1600. Under perfect competition P = MC = 40 ⇒ 200 − 2Q = 40 ⇒ Q = 80. Deadweight loss (DWL) = ½ × (120 − 40) × (80 − 40) = 1600. (Under competition, CS = ½ × 160 × 80 = 6400 = monopoly CS 1600 + profit 3200 + DWL 1600, which serves as a check.)"},{"q":"(c) Suppose the firm could practise perfect (first-degree) price discrimination. Find output, profit, consumer surplus and deadweight loss.","sol":"一级价格歧视下每单位按保留价格出售，厂商会一直卖到需求价格 = MC：Q = 80。利润 = 需求曲线与 MC 之间的全部面积 = ½ × (200 − 40) × 80 = 6400。消费者剩余 = 0，DWL = 0。配置有效率，但全部剩余被厂商占有。","sol_en":"Under first-degree price discrimination each unit is sold at the buyer's reservation price, so the firm keeps selling until the demand price = MC: Q = 80. Profit = the whole area between the demand curve and MC = ½ × (200 − 40) × 80 = 6400. Consumer surplus = 0 and DWL = 0. The allocation is efficient, but the firm captures all of the surplus."},{"q":"(d) Now the firm can also sell abroad, where demand is P = 120 − Q, and the two markets can be kept separate. Find the price in each market under third-degree price discrimination and total profit. Compare with the profit if it had to charge a single uniform price in both markets.","sol":"三级价格歧视：各市场分别令 MR = MC。\n国内：MR = 200 − 4Q = 40 ⇒ Q_D = 40，P_D = 120，利润 3200。\n国外：MR = 120 − 2Q = 40 ⇒ Q_E = 40，P_E = 80，利润 (80 − 40) × 40 = 1600。\n总利润 = 4800。检验勒纳指数：国内 |PED| = 0.5 × 120/40 = 1.5，(120−40)/120 = 2/3；国外 |PED| = 1 × 80/40 = 2，(80−40)/80 = 1/2。需求弹性较小的国内市场定价更高。\n统一定价：P ≤ 120 时总需求 Q = (100 − 0.5P) + (120 − P) = 220 − 1.5P ⇒ P = (220 − Q)/1.5，MR = (220 − 2Q)/1.5 = 40 ⇒ Q = 80，P = 140/1.5 ≈ 93.33（< 120，两个市场都有销售，假设成立）。利润 = (93.33 − 40) × 80 ≈ 4266.67。\n结论：价格歧视利润 4800 > 统一定价 4266.67，厂商有动机分割市场并防止转售（平行进口）。","sol_en":"Third-degree price discrimination: set MR = MC separately in each market.\nDomestic: MR = 200 − 4Q = 40 ⇒ Q_D = 40, P_D = 120, profit 3200.\nAbroad: MR = 120 − 2Q = 40 ⇒ Q_E = 40, P_E = 80, profit (80 − 40) × 40 = 1600.\nTotal profit = 4800. Check with the Lerner index: domestic |PED| = 0.5 × 120/40 = 1.5, (120−40)/120 = 2/3; abroad |PED| = 1 × 80/40 = 2, (80−40)/80 = 1/2. The domestic market, where demand is less elastic, is charged the higher price.\nUniform price: for P ≤ 120, total demand is Q = (100 − 0.5P) + (120 − P) = 220 − 1.5P ⇒ P = (220 − Q)/1.5, and MR = (220 − 2Q)/1.5 = 40 ⇒ Q = 80, P = 140/1.5 ≈ 93.33 (< 120, so there are sales in both markets and the assumption holds). Profit = (93.33 − 40) × 80 ≈ 4266.67.\nConclusion: profit under price discrimination, 4800, > profit under a uniform price, 4266.67, so the firm has an incentive to segment the markets and prevent resale (parallel imports)."}]},{"id":"P-m8-1","t":"m8","title":"Collusion in a Repeated Pricing Game","stem":"Two airlines, Alpha and Beta, are the only carriers on a route. Each quarter they simultaneously choose a High or Low fare. Quarterly profits ($m) are: both High (12, 12); Alpha High & Beta Low (4, 18); Alpha Low & Beta High (18, 4); both Low (8, 8). Payoffs are listed as (Alpha, Beta). Future profits are discounted by a factor δ per quarter (0 < δ < 1).","parts":[{"q":"(a) If the game is played only once, does either firm have a dominant strategy? Find the Nash equilibrium and explain why this is a prisoner's dilemma.","sol":"对 Alpha：若 Beta 选 High，Low 得 18 > 12；若 Beta 选 Low，Low 得 8 > 4 ⇒ Low 是 Alpha 的占优策略 (dominant strategy)。Beta 对称，也选 Low。纳什均衡 (Low, Low)，收益 (8, 8)。但 (High, High) 的 (12, 12) 使双方都更好——个体理性导致集体非最优，这就是囚徒困境 (prisoner's dilemma)。","sol_en":"For Alpha: if Beta chooses High, Low gives 18 > 12; if Beta chooses Low, Low gives 8 > 4 ⇒ Low is Alpha's dominant strategy. Beta is symmetric and also chooses Low. The Nash equilibrium is (Low, Low) with payoffs (8, 8). But (High, High), with (12, 12), would make both firms better off — individual rationality leads to a collectively sub-optimal outcome, and this is the prisoner's dilemma."},{"q":"(b) Suppose the game is repeated exactly 8 quarters and both firms know this. Can collusion on High fares be sustained? Explain using backward induction.","sol":"不能。用逆向归纳 (backward induction)：第 8 季是最后一期，未来无法惩罚，等同一次性博弈，双方都选 Low。既然第 8 季结果与第 7 季的行为无关，第 7 季也等同一次性博弈，选 Low……依次倒推，每一季都是 (Low, Low)。终点已知的有限重复博弈无法维持合作（除非存在不完全信息或多重均衡）。","sol_en":"No. Use backward induction: quarter 8 is the last period, and there is no future in which to punish, so it is the same as a one-shot game and both firms choose Low. Since the outcome in quarter 8 does not depend on behaviour in quarter 7, quarter 7 is also equivalent to a one-shot game, and both choose Low… Working backwards in this way, every quarter is (Low, Low). Cooperation cannot be sustained in a finitely repeated game with a known end point (unless there is incomplete information or there are multiple equilibria)."},{"q":"(c) Now suppose the game is repeated indefinitely and both firms use a grim-trigger strategy (charge High until the rival charges Low, then charge Low forever). Find the minimum δ that sustains collusion. What does this imply for the interest rate r, if δ = 1/(1 + r)?","sol":"坚持合作的现值：12/(1 − δ)。\n偏离的现值：当期 18，此后永远 (Low, Low) 得 8：18 + 8δ/(1 − δ)。\n合作条件：12/(1 − δ) ≥ 18 + 8δ/(1 − δ) ⇒ 12 ≥ 18(1 − δ) + 8δ = 18 − 10δ ⇒ δ ≥ 0.6。\n公式检验：δ ≥ (π_D − π_C)/(π_D − π_N) = (18 − 12)/(18 − 8) = 0.6。\n由 1/(1 + r) ≥ 0.6 ⇒ r ≤ 2/3 ≈ 66.7%（每季）。利率越低、企业越有耐心，合谋越稳定。","sol_en":"Present value of sticking to cooperation: 12/(1 − δ).\nPresent value of deviating: 18 in the current period, then (Low, Low) forever after, giving 8: 18 + 8δ/(1 − δ).\nCondition for cooperation: 12/(1 − δ) ≥ 18 + 8δ/(1 − δ) ⇒ 12 ≥ 18(1 − δ) + 8δ = 18 − 10δ ⇒ δ ≥ 0.6.\nCheck with the formula: δ ≥ (π_D − π_C)/(π_D − π_N) = (18 − 12)/(18 − 8) = 0.6.\nFrom 1/(1 + r) ≥ 0.6 ⇒ r ≤ 2/3 ≈ 66.7% (per quarter). The lower the interest rate and the more patient the firms, the more stable the collusion."},{"q":"(d) Suppose instead Beta plays tit-for-tat. Alpha considers a one-off deviation: charge Low this quarter, then return to High permanently. For what values of δ is this deviation unprofitable? Combining with (c), for what δ is cooperation against tit-for-tat robust to both one-off and permanent deviation?","sol":"Beta 采用以牙还牙 (tit-for-tat)：Alpha 在 t 期选 Low 得 18；t+1 期 Beta 复制 Low 而 Alpha 回到 High，Alpha 得 4；t+2 期起 Beta 复制 Alpha 的 High，回到 (12, 12)。从 t+2 期起两条路径相同，只需比较前两期：\n合作：12 + 12δ；一次偏离：18 + 4δ。\n偏离无利可图：12 + 12δ ≥ 18 + 4δ ⇒ 8δ ≥ 6 ⇒ δ ≥ 0.75。\n永久偏离（此后一直选 Low）面对 TFT 时的收益为 18 + 8δ/(1 − δ)，与 (c) 相同，要求 δ ≥ 0.6。\n两者同时成立需 δ ≥ 0.75。含义：TFT 的惩罚只持续一期，比冷酷触发温和，因此需要更高的贴现因子才能遏制“偶尔背叛”。","sol_en":"Beta plays tit-for-tat: Alpha chooses Low in period t and gets 18; in period t+1 Beta copies Low while Alpha returns to High, so Alpha gets 4; from period t+2 onwards Beta copies Alpha's High and play returns to (12, 12). From period t+2 onwards the two paths are identical, so we only need to compare the first two periods:\nCooperate: 12 + 12δ; one-off deviation: 18 + 4δ.\nThe deviation is unprofitable if: 12 + 12δ ≥ 18 + 4δ ⇒ 8δ ≥ 6 ⇒ δ ≥ 0.75.\nA permanent deviation (choosing Low for ever after) against TFT yields 18 + 8δ/(1 − δ), the same as in (c), which requires δ ≥ 0.6.\nFor both conditions to hold we need δ ≥ 0.75. Implication: TFT's punishment lasts only one period, which is milder than grim trigger, so a higher discount factor is needed to deter \"occasional cheating\"."}]},{"id":"P-m10-1","t":"m10","title":"Steel Pollution and a Pigouvian Tax","stem":"In a competitive steel market, demand (marginal social benefit) is P = 100 − Q and supply (marginal private cost) is P = 20 + Q, where Q is in millions of tonnes and P in $ per tonne. Steel production causes air pollution with a marginal external cost of MEC = 0.5Q (rising with output).","parts":[{"q":"(a) Find the unregulated market equilibrium quantity and price.","sol":"市场按 MPB = MPC 决定：100 − Q = 20 + Q ⇒ Q = 40（百万吨），P = 60 美元/吨。","sol_en":"The market is determined by MPB = MPC: 100 − Q = 20 + Q ⇒ Q = 40 (million tonnes), P = $60 per tonne."},{"q":"(b) Derive the marginal social cost (MSC) curve and find the socially optimal quantity and price.","sol":"MSC = MPC + MEC = 20 + Q + 0.5Q = 20 + 1.5Q。社会最优：MSB = MSC ⇒ 100 − Q = 20 + 1.5Q ⇒ 2.5Q = 80 ⇒ Q* = 32，P* = 100 − 32 = 68。市场过度生产 8 百万吨。","sol_en":"MSC = MPC + MEC = 20 + Q + 0.5Q = 20 + 1.5Q. Social optimum: MSB = MSC ⇒ 100 − Q = 20 + 1.5Q ⇒ 2.5Q = 80 ⇒ Q* = 32, P* = 100 − 32 = 68. The market over-produces by 8 million tonnes."},{"q":"(c) Calculate the deadweight loss caused by the externality in the unregulated market.","sol":"无谓损失为 Q* = 32 到 Q = 40 之间 MSC 高于 MSB 的三角形面积。在 Q = 40：MSC = 20 + 60 = 80，MSB = 60，差距 20；在 Q = 32 差距为 0。DWL = ½ × 20 × (40 − 32) = 80（百万美元）。积分检验：∫₃₂⁴⁰ (2.5Q − 80) dQ = 80。","sol_en":"The deadweight loss is the area of the triangle between Q* = 32 and Q = 40 where MSC lies above MSB. At Q = 40: MSC = 20 + 60 = 80 and MSB = 60, a gap of 20; at Q = 32 the gap is 0. DWL = ½ × 20 × (40 − 32) = 80 (million dollars). Check by integration: ∫₃₂⁴⁰ (2.5Q − 80) dQ = 80."},{"q":"(d) What per-unit Pigouvian tax achieves the social optimum? Find the price paid by buyers, the price received by producers, and the tax revenue. Briefly explain one advantage of a cap-and-trade scheme over this tax.","sol":"庇古税 (Pigouvian tax) = 社会最优产量处的 MEC = 0.5 × 32 = 16 美元/吨（注意不是市场产量处的 0.5 × 40 = 20）。征税后供给变为 P = 36 + Q，与需求 100 − Q 相交 ⇒ Q = 32，买方支付 68，生产者得到 68 − 16 = 52。税收收入 = 16 × 32 = 512（百万美元）。\n总量管制与交易 (cap-and-trade) 的优势：直接控制排放总量（可发放对应 Q = 32 的许可证），在监管者不确定企业成本时能确保环境目标；许可证交易使边际减排成本相等，以最低成本实现减排。（代价是价格不确定，而碳税价格确定、排放量不确定。）","sol_en":"Pigouvian tax = MEC at the socially optimal output = 0.5 × 32 = $16 per tonne (note: not 0.5 × 40 = 20 at the market output). After the tax, supply becomes P = 36 + Q, which intersects demand 100 − Q ⇒ Q = 32; buyers pay 68 and producers receive 68 − 16 = 52. Tax revenue = 16 × 32 = 512 (million dollars).\nAdvantages of cap-and-trade: it controls total emissions directly (permits corresponding to Q = 32 can be issued), guaranteeing the environmental target when the regulator is uncertain about firms' costs; and permit trading equalises marginal abatement costs, so the reduction is achieved at the lowest cost. (The drawback is that the price is uncertain, whereas a carbon tax fixes the price but leaves the quantity of emissions uncertain.)"}]},{"id":"P-M1-1","t":"M1","title":"GDP, the Deflator and the CPI","stem":"A simple economy produces only three final goods: rice, phones and haircuts. The data below give quantities and prices for 2024 (the base year) and 2025.\nRice: 100 kg at $2.00 (2024); 110 kg at $2.20 (2025).\nPhones: 10 units at $50 (2024); 12 units at $45 (2025).\nHaircuts: 40 at $10 (2024); 42 at $11 (2025).\nAssume all three goods are bought by consumers, and that the CPI basket is fixed at the 2024 quantities.","parts":[{"q":"(a) Calculate nominal GDP in 2024 and 2025, and the growth rate of nominal GDP.","sol":"名义GDP按当年价格计算：\n2024：100 × 2 + 10 × 50 + 40 × 10 = 200 + 500 + 400 = 1,100。\n2025：110 × 2.2 + 12 × 45 + 42 × 11 = 242 + 540 + 462 = 1,244。\n名义增长率 = 1,244 ÷ 1,100 − 1 ≈ 13.09%。","sol_en":"Nominal GDP is calculated at current-year prices:\n2024: 100 × 2 + 10 × 50 + 40 × 10 = 200 + 500 + 400 = 1,100.\n2025: 110 × 2.2 + 12 × 45 + 42 × 11 = 242 + 540 + 462 = 1,244.\nNominal growth rate = 1,244 ÷ 1,100 − 1 ≈ 13.09%."},{"q":"(b) Using 2024 prices, calculate real GDP in 2025 and the growth rate of real GDP.","sol":"实际GDP_2025（按2024年价格）= 110 × 2 + 12 × 50 + 42 × 10 = 220 + 600 + 420 = 1,240。\n2024 为基年，实际GDP = 名义GDP = 1,100。\n实际增长率 = 1,240 ÷ 1,100 − 1 ≈ 12.73%。","sol_en":"Real GDP_2025 (at 2024 prices) = 110 × 2 + 12 × 50 + 42 × 10 = 220 + 600 + 420 = 1,240.\n2024 is the base year, so real GDP = nominal GDP = 1,100.\nReal growth rate = 1,240 ÷ 1,100 − 1 ≈ 12.73%."},{"q":"(c) Calculate the GDP deflator for 2025 and the inflation rate it implies.","sol":"GDP平减指数_2025 = 名义GDP ÷ 实际GDP × 100 = 1,244 ÷ 1,240 × 100 ≈ 100.32（2024 = 100）。\n平减指数衡量的通胀率 ≈ 0.32%。\n检验：(1 + 13.09%) ÷ (1 + 12.73%) − 1 ≈ 0.32%，与上面一致。","sol_en":"GDP deflator_2025 = nominal GDP ÷ real GDP × 100 = 1,244 ÷ 1,240 × 100 ≈ 100.32 (2024 = 100).\nInflation rate as measured by the deflator ≈ 0.32%.\nCheck: (1 + 13.09%) ÷ (1 + 12.73%) − 1 ≈ 0.32%, consistent with the above."},{"q":"(d) Calculate the CPI for 2025 using the fixed 2024 basket and the CPI inflation rate. Explain why the CPI and the GDP deflator give different inflation rates.","sol":"2024 篮子在2025年的成本 = 100 × 2.2 + 10 × 45 + 40 × 11 = 220 + 450 + 440 = 1,110；基年成本 = 1,100。\nCPI_2025 = 1,110 ÷ 1,100 × 100 ≈ 100.91，CPI 通胀率 ≈ 0.91%。\n差异原因：CPI 使用**固定的基期篮子** (Laspeyres 型)，而平减指数使用**当期产量**作权重 (Paasche 型)。手机价格下降 10%、而消费者在2025年多买了手机（10 → 12），平减指数给降价的手机更高权重，所以测得的通胀更低。CPI 忽略了消费者向相对变便宜商品转移的行为，即**替代偏差 (substitution bias)**，因此倾向于高估生活成本的上升。","sol_en":"Cost of the 2024 basket in 2025 = 100 × 2.2 + 10 × 45 + 40 × 11 = 220 + 450 + 440 = 1,110; cost in the base year = 1,100.\nCPI_2025 = 1,110 ÷ 1,100 × 100 ≈ 100.91, so CPI inflation ≈ 0.91%.\nWhy they differ: the CPI uses a **fixed base-period basket** (Laspeyres-type), whereas the deflator uses **current-period quantities** as weights (Paasche-type). Phone prices fell by 10% and consumers bought more phones in 2025 (10 → 12), so the deflator gives the cheaper phones a larger weight and therefore measures lower inflation. The CPI ignores consumers' switching towards goods that have become relatively cheaper — **substitution bias** — and so tends to overstate the rise in the cost of living."}]},{"id":"P-M3-1","t":"M3","title":"Closing a Recessionary Gap: Multipliers and Money Creation","stem":"An economy's current real GDP is $1,800 billion, while potential real GDP is $2,000 billion. The marginal propensity to consume is 0.75. Assume a closed economy with no income taxes, a constant price level in the short run, and no crowding out unless stated. The required reserve ratio for banks is 12.5%.","parts":[{"q":"(a) Calculate the spending multiplier and the change in government purchases needed to close the output gap exactly.","sol":"产出缺口 = 2,000 − 1,800 = 200（十亿美元）。\n支出乘数 = 1 ÷ (1 − MPC) = 1 ÷ 0.25 = 4。\n所需 ΔG = 200 ÷ 4 = 50（十亿美元）。","sol_en":"Output gap = 2,000 − 1,800 = 200 (billion dollars).\nSpending multiplier = 1 ÷ (1 − MPC) = 1 ÷ 0.25 = 4.\nRequired ΔG = 200 ÷ 4 = 50 (billion dollars)."},{"q":"(b) Instead of changing purchases, the government considers (i) a tax cut alone, or (ii) a balanced-budget increase in both purchases and taxes. How large must each policy be to close the gap?","sol":"(i) 税收乘数 = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3，需要减税 200 ÷ 3 ≈ 66.7（十亿美元）。减税规模大于 ΔG，因为第一轮只有 75% 的减税被消费。\n(ii) 平衡预算乘数 = 1：G 与 T 同时增加 200。验证：4 × 200 − 3 × 200 = 800 − 600 = 200。平衡预算方案所需规模最大，但不增加赤字。","sol_en":"(i) Tax multiplier = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3, so a tax cut of 200 ÷ 3 ≈ 66.7 (billion dollars) is needed. The tax cut must be larger than ΔG because in the first round only 75% of the tax cut is spent.\n(ii) Balanced-budget multiplier = 1: G and T must both increase by 200. Check: 4 × 200 − 3 × 200 = 800 − 600 = 200. The balanced-budget option requires the largest policy change, but it does not increase the deficit."},{"q":"(c) The government chooses the purchases increase in (a) and finances it by issuing bonds. To prevent interest rates from rising (and crowding out investment), the central bank buys $10 billion of government bonds from commercial banks. If banks lend out all excess reserves and the public holds no extra cash, what is the maximum increase in the money supply?","sol":"央行从银行买入债券，银行准备金增加 10，且这些全部是超额准备金（没有新增存款，不需要额外法定准备金）。\n简单货币乘数 = 1 ÷ rr = 1 ÷ 0.125 = 8。\n货币供给最大增加 = 10 × 8 = 80（十亿美元）。\n经济学意义：货币扩张使货币供给右移、抵消政府借款对利率的上推，即“货币政策为财政政策提供配合 (accommodation)”，减少挤出效应。","sol_en":"When the central bank buys bonds from banks, bank reserves increase by 10, and all of this is excess reserves (there are no new deposits, so no additional required reserves are needed).\nSimple money multiplier = 1 ÷ rr = 1 ÷ 0.125 = 8.\nMaximum increase in the money supply = 10 × 8 = 80 (billion dollars).\nEconomic meaning: the monetary expansion shifts the money supply to the right, offsetting the upward pressure on interest rates from government borrowing — i.e. \"monetary policy accommodates fiscal policy\" — which reduces crowding out."},{"q":"(d) Suppose banks decide to hold additional excess reserves equal to 7.5% of deposits, and some investment is still crowded out, reducing private investment by $10 billion. Calculate the new maximum increase in the money supply and the net change in real GDP from the fiscal package. Comment on the result.","sol":"银行实际准备金比率 = 12.5% + 7.5% = 20%，有效货币乘数 = 1 ÷ 0.2 = 5。\n货币供给最大增加 = 10 × 5 = 50（十亿美元），低于 (c) 的 80。\n产出：ΔG = 50，私人投资被挤出 10，自主支出净增加 = 50 − 10 = 40；ΔY = 4 × 40 = 160（十亿美元），缺口剩余 200 − 160 = 40，未能完全弥补。\n评论：银行惜贷（持有超额准备金，常见于衰退期）削弱了货币创造，使利率更难被压住，从而挤出效应仍然存在；政策制定者需更大规模的刺激或其他工具（如降低准备金利率、前瞻指引）来弥补。","sol_en":"Banks' actual reserve ratio = 12.5% + 7.5% = 20%, so the effective money multiplier = 1 ÷ 0.2 = 5.\nMaximum increase in the money supply = 10 × 5 = 50 (billion dollars), lower than the 80 in (c).\nOutput: ΔG = 50 and 10 of private investment is crowded out, so the net increase in autonomous spending = 50 − 10 = 40; ΔY = 4 × 40 = 160 (billion dollars), leaving a remaining gap of 200 − 160 = 40, so the gap is not fully closed.\nComment: banks' reluctance to lend (holding excess reserves, which is common in recessions) weakens money creation, making it harder to hold interest rates down, so crowding out still occurs; policymakers need a larger stimulus or other tools (such as lowering the interest rate on reserves or forward guidance) to make up the shortfall."}]},{"id":"P-M7-1","t":"M7","title":"Widgets, Tariffs, Quotas and a Falling Peso","stem":"A small open economy uses the peso. Its domestic market for widgets is described by demand Qd = 200 − 2P and supply Qs = 3P − 50, where P is the price in pesos. The world price of widgets is $10, and the country is a price taker. Initially the exchange rate is 4 pesos per dollar.","parts":[{"q":"(a) Find the autarky (no-trade) equilibrium price and quantity. Then find domestic consumption, domestic production and imports under free trade.","sol":"封闭均衡：200 − 2P = 3P − 50 ⇒ 5P = 250 ⇒ P = 50 比索，Q = 100。\n自由贸易：世界价格 = $10 × 4 = 40 比索 < 50，因此该国进口。\nQd = 200 − 80 = 120，Qs = 120 − 50 = 70，进口 = 120 − 70 = 50。","sol_en":"Autarky equilibrium: 200 − 2P = 3P − 50 ⇒ 5P = 250 ⇒ P = 50 pesos, Q = 100.\nFree trade: world price = $10 × 4 = 40 pesos < 50, so the country imports.\nQd = 200 − 80 = 120, Qs = 120 − 50 = 70, imports = 120 − 70 = 50."},{"q":"(b) The government imposes a tariff of 5 pesos per widget. Calculate the new domestic price, imports, tariff revenue, the change in consumer surplus, the change in producer surplus, and the deadweight loss.","sol":"国内价格 = 40 + 5 = 45。Qd = 200 − 90 = 110，Qs = 135 − 50 = 85，进口 = 25。\n关税收入 = 5 × 25 = 125。\n消费者剩余减少 = 5 × (120 + 110) ÷ 2 = 575。\n生产者剩余增加 = 5 × (70 + 85) ÷ 2 = 387.5。\nDWL = ½ × 5 × (85 − 70) + ½ × 5 × (120 − 110) = 37.5 + 25 = 62.5。\n检验：575 = 387.5 + 125 + 62.5 ✓。","sol_en":"Domestic price = 40 + 5 = 45. Qd = 200 − 90 = 110, Qs = 135 − 50 = 85, imports = 25.\nTariff revenue = 5 × 25 = 125.\nFall in consumer surplus = 5 × (120 + 110) ÷ 2 = 575.\nRise in producer surplus = 5 × (70 + 85) ÷ 2 = 387.5.\nDWL = ½ × 5 × (85 − 70) + ½ × 5 × (120 − 110) = 37.5 + 25 = 62.5.\nCheck: 575 = 387.5 + 125 + 62.5 ✓."},{"q":"(c) Suppose instead the government imposes an import quota that yields the same domestic price as the tariff. What quota level is required? Compare the country's welfare loss with the tariff if the import licenses are given free of charge to foreign exporters.","sol":"要使国内价格为 45，进口配额需为 25 单位（与关税后进口量相同）。\n价格与数量相同，所以生产者剩余增加 387.5、消费者剩余减少 575、DWL 62.5 都与关税相同。\n区别：原本 125 的关税收入变为配额租金 (quota rents)。若许可证免费给外国出口商，这 125 流向国外，本国净福利损失 = 62.5 + 125 = 187.5，是关税情形（62.5）的3倍。若政府拍卖许可证，则可收回租金，结果与关税等价。","sol_en":"For the domestic price to be 45, the import quota must be 25 units (the same as imports after the tariff).\nPrice and quantity are the same, so the rise in producer surplus of 387.5, the fall in consumer surplus of 575 and the DWL of 62.5 are all the same as under the tariff.\nThe difference: the 125 that was tariff revenue now becomes quota rents. If the licences are given free of charge to foreign exporters, this 125 flows abroad, and the country's net welfare loss = 62.5 + 125 = 187.5, three times the loss in the tariff case (62.5). If the government auctions the licences, it can recover the rents, and the outcome is equivalent to the tariff."},{"q":"(d) Now remove all trade barriers. Suppose higher interest rates abroad trigger capital outflows and the peso depreciates to 4.5 pesos per dollar. Find the new domestic price and imports. Explain why this depreciation reduces imports just like the tariff, yet the country's welfare loss relative to free trade at 4 pesos is larger.","sol":"国外利率上升 → 资本流出 → 比索供给增加 → 比索贬值至 4.5。\n国内价格 = $10 × 4.5 = 45 比索，与关税情形相同：Qd = 110，Qs = 85，进口 = 25。\n福利比较（相对于汇率为4时的自由贸易）：消费者剩余减少 575，生产者剩余增加 387.5，净损失 = 575 − 387.5 = 187.5。\n原因：关税情形中，每单位进口多付的 5 比索作为关税收入留在国内；贬值情形中，同样多付的 5 比索（25 × 5 = 125）支付给了外国，这是**贸易条件恶化 (terms-of-trade loss)** 带来的真实收入损失，因此总损失 = DWL 62.5 + 125 = 187.5，等于把配额租金送给外国的情形。另一方面，贬值会提高该国出口的竞争力，本题的单一进口市场分析没有计入这部分收益。","sol_en":"Higher interest rates abroad → capital outflows → the supply of pesos rises → the peso depreciates to 4.5.\nDomestic price = $10 × 4.5 = 45 pesos, the same as in the tariff case: Qd = 110, Qs = 85, imports = 25.\nWelfare comparison (relative to free trade at an exchange rate of 4): consumer surplus falls by 575 and producer surplus rises by 387.5, so the net loss = 575 − 387.5 = 187.5.\nReason: in the tariff case, the extra 5 pesos paid per unit of imports stays in the country as tariff revenue; in the depreciation case, the same extra 5 pesos (25 × 5 = 125) is paid to foreigners. This is a real income loss caused by a **terms-of-trade loss**, so the total loss = DWL 62.5 + 125 = 187.5, the same as the case in which the quota rents are handed to foreigners. On the other hand, depreciation makes the country's exports more competitive, a gain that this single import-market analysis does not include."}]},{"id":"P-F1-1","t":"F1","title":"Should the Bakery Buy the Oven?","stem":"A bakery is considering a new industrial oven that costs $50,000 today. The oven will increase the bakery's net cash flow by $15,000 at the end of each year for 5 years. At the end of year 5 the oven can be sold for scrap for $5,000. The bakery's cost of capital is 8% per year. A bank offers to lend the full $50,000 at 6% per year, repaid in 5 equal end-of-year payments.","parts":[{"q":"(a) Calculate the NPV of the oven project at the 8% cost of capital. Should the bakery invest?","sol":"现金流：第 0 年 −50,000；第 1–4 年各 +15,000；第 5 年 +15,000 + 5,000 = +20,000。\n年金现值系数 (8%, 5 年) = [1 − 1.08⁻⁵] ÷ 0.08 ≈ 3.9927。\nPV(15,000 年金) = 15,000 × 3.9927 ≈ 59,890.65；PV(残值 5,000) = 5,000 ÷ 1.08⁵ ≈ 3,402.92。\nNPV = −50,000 + 59,890.65 + 3,402.92 ≈ **13,293.57 美元 > 0**，应投资。","sol_en":"Cash flows: year 0 −50,000; years 1–4 +15,000 each; year 5 +15,000 + 5,000 = +20,000.\nAnnuity factor (8%, 5 years) = [1 − 1.08⁻⁵] ÷ 0.08 ≈ 3.9927.\nPV(15,000 annuity) = 15,000 × 3.9927 ≈ 59,890.65; PV(scrap value 5,000) = 5,000 ÷ 1.08⁵ ≈ 3,402.92.\nNPV = −50,000 + 59,890.65 + 3,402.92 ≈ **$13,293.57 > 0**, so the bakery should invest."},{"q":"(b) Show that the project's IRR lies between 17% and 18%. What does this tell the bakery?","sol":"IRR 是令 NPV = 0 的折现率。\nr = 17% 时 NPV ≈ +270.75；r = 18% 时 NPV ≈ -906.89。NPV 由正变负，所以 IRR 在 17% 与 18% 之间（线性插值约 17.2%）。\n含义：只要资本成本低于约 17.2%，项目就创造价值；8% 的资本成本留有很大的安全边际。即使资本成本升到 12%，NPV 仍约为 6,908.78 美元。","sol_en":"The IRR is the discount rate that makes NPV = 0.\nAt r = 17%, NPV ≈ +270.75; at r = 18%, NPV ≈ -906.89. NPV changes from positive to negative, so the IRR lies between 17% and 18% (about 17.2% by linear interpolation).\nImplication: as long as the cost of capital is below about 17.2%, the project creates value; an 8% cost of capital leaves a large margin of safety. Even if the cost of capital rose to 12%, NPV would still be about $6,908.78."},{"q":"(c) If the bakery takes the bank loan, what is the annual loan payment? How much of the first payment is interest, and what is the total interest paid over the loan?","sol":"PMT = 50,000 × 0.06 ÷ [1 − 1.06⁻⁵] ≈ **11,869.82 美元/年**。\n第 1 年利息 = 50,000 × 6% = 3,000；偿还本金 = 11,869.82 − 3,000 = 8,869.82。\n总还款 = 5 × 11,869.82 = 59,349.10，总利息 = 59,349.10 − 50,000 ≈ **9,349.10 美元**。","sol_en":"PMT = 50,000 × 0.06 ÷ [1 − 1.06⁻⁵] ≈ **$11,869.82 per year**.\nYear-1 interest = 50,000 × 6% = 3,000; principal repaid = 11,869.82 − 3,000 = 8,869.82.\nTotal repayments = 5 × 11,869.82 = 59,349.10; total interest = 59,349.10 − 50,000 ≈ **$9,349.10**."},{"q":"(d) What is the minimum annual cash flow (years 1–5, keeping the $5,000 scrap value) for which the project still has a non-negative NPV at 8%? Briefly explain why the financing decision (the 6% loan) should not change the answer in (a).","sol":"令 NPV = 0：CF × 3.9927 + 3,402.92 = 50,000 → CF = (50,000 − 3,402.92) ÷ 3.9927 ≈ **11,670.54 美元/年**。预期现金流 15,000 比盈亏平衡水平高约 28.5%，项目对现金流下滑有一定缓冲。\n投资决策与融资决策应分开 (separation of investment and financing decisions)：项目是否创造价值取决于其现金流与反映风险的资本成本，而不是这笔钱从哪里来。以 6% 借款只是改变了现金流在银行与店主之间的分配；若 6% 低于店主的机会成本 8%，这笔贷款本身有小幅正价值，但它不应被用来“美化”一个本身 NPV 为负的项目。","sol_en":"Set NPV = 0: CF × 3.9927 + 3,402.92 = 50,000 → CF = (50,000 − 3,402.92) ÷ 3.9927 ≈ **$11,670.54 per year**. The expected cash flow of 15,000 is about 28.5% above this break-even level, giving the project some cushion against a fall in cash flows.\nInvestment and financing decisions should be kept separate (the separation of investment and financing decisions): whether a project creates value depends on its cash flows and on a cost of capital that reflects its risk, not on where the money comes from. Borrowing at 6% merely changes how the cash flows are split between the bank and the owner; if 6% is below the owner's opportunity cost of 8%, the loan itself has a small positive value, but it should not be used to \"dress up\" a project whose own NPV is negative."}]},{"id":"P-F2-1","t":"F2","title":"Tech Stock vs Utility Stock","stem":"An investor is choosing between Stock A (a technology company) and Stock B (a utility). Next year's returns depend on the state of the economy: Boom (probability 0.25): A = 30%, B = 2%; Normal (probability 0.50): A = 12%, B = 6%; Recession (probability 0.25): A = −14%, B = 10%. The risk-free rate is 3%.","parts":[{"q":"(a) Calculate the expected return and standard deviation of each stock.","sol":"E(R_A) = 0.25×30 + 0.5×12 + 0.25×(−14) = 7.5 + 6 − 3.5 = **10%**。\nE(R_B) = 0.25×2 + 0.5×6 + 0.25×10 = 0.5 + 3 + 2.5 = **6%**。\nVar(A) = 0.25×(20)² + 0.5×(2)² + 0.25×(−24)² = 100 + 2 + 144 = 246（%²），σ_A = √246 ≈ **15.68%**。\nVar(B) = 0.25×(−4)² + 0.5×0² + 0.25×4² = 4 + 0 + 4 = 8，σ_B = √8 ≈ **2.83%**。","sol_en":"E(R_A) = 0.25×30 + 0.5×12 + 0.25×(−14) = 7.5 + 6 − 3.5 = **10%**.\nE(R_B) = 0.25×2 + 0.5×6 + 0.25×10 = 0.5 + 3 + 2.5 = **6%**.\nVar(A) = 0.25×(20)² + 0.5×(2)² + 0.25×(−24)² = 100 + 2 + 144 = 246 (%²), σ_A = √246 ≈ **15.68%**.\nVar(B) = 0.25×(−4)² + 0.5×0² + 0.25×4² = 4 + 0 + 4 = 8, σ_B = √8 ≈ **2.83%**."},{"q":"(b) Calculate the covariance and correlation between A and B. Explain in words why they move this way.","sol":"Cov = 0.25×(20)(−4) + 0.5×(2)(0) + 0.25×(−24)(4) = −20 + 0 − 24 = **−44**（%²）。\n相关系数 ρ = −44 ÷ (15.68 × 2.83) ≈ **-0.99**。\n几乎完全负相关：科技股是顺周期 (pro-cyclical) 的，繁荣时收益高；公用事业需求稳定，衰退时资金流向防御性股票，表现反而较好。","sol_en":"Cov = 0.25×(20)(−4) + 0.5×(2)(0) + 0.25×(−24)(4) = −20 + 0 − 24 = **−44** (%²).\nCorrelation coefficient ρ = −44 ÷ (15.68 × 2.83) ≈ **-0.99**.\nThey are almost perfectly negatively correlated: the tech stock is pro-cyclical, earning high returns in a boom; demand for utilities is stable, and in a recession money flows into defensive stocks, so the utility actually performs better."},{"q":"(c) The investor puts 60% in A and 40% in B. Find the portfolio's expected return and standard deviation. Compare σ with the weighted average of the two standard deviations and explain.","sol":"各情形组合收益：繁荣 0.6×30 + 0.4×2 = 18.8%；正常 0.6×12 + 0.4×6 = 9.6%；衰退 0.6×(−14) + 0.4×10 = −4.4%。\nE(R_P) = 0.6×10 + 0.4×6 = **8.4%**。\nVar(P) = 0.6²×246 + 0.4²×8 + 2×0.6×0.4×(−44) = 88.56 + 1.28 − 21.12 = 68.72，σ_P = √68.72 ≈ **8.29%**。\n加权平均 σ = 0.6×15.68 + 0.4×2.83 ≈ 10.54%，高于组合实际 σ。差异来自负相关带来的分散化 (diversification)：一只股票的损失被另一只的收益部分抵消。","sol_en":"Portfolio return in each scenario: boom 0.6×30 + 0.4×2 = 18.8%; normal 0.6×12 + 0.4×6 = 9.6%; recession 0.6×(−14) + 0.4×10 = −4.4%.\nE(R_P) = 0.6×10 + 0.4×6 = **8.4%**.\nVar(P) = 0.6²×246 + 0.4²×8 + 2×0.6×0.4×(−44) = 88.56 + 1.28 − 21.12 = 68.72, σ_P = √68.72 ≈ **8.29%**.\nThe weighted average σ = 0.6×15.68 + 0.4×2.83 ≈ 10.54%, higher than the portfolio's actual σ. The difference comes from diversification made possible by the negative correlation: losses on one stock are partly offset by gains on the other."},{"q":"(d) Compute the Sharpe ratio (E(R) − R_f) ÷ σ for A, B and the 60/40 portfolio. Then suppose A's beta is 1.4 and the expected market return is 9%. Using the CAPM, is A fairly priced? What would you advise?","sol":"夏普比率 (Sharpe ratio)：A = (10 − 3) ÷ 15.68 ≈ 0.45；B = (6 − 3) ÷ 2.83 ≈ 1.06；组合 = (8.4 − 3) ÷ 8.29 ≈ 0.65。B 的单位风险回报最高，A 最低。\nCAPM 要求收益 = 3% + 1.4 × (9% − 3%) = **11.4%**，而 A 的期望收益只有 10%，α = 10% − 11.4% = **−1.4%**，A 被高估 (overpriced)。\n建议：在此预测下减少 A 的权重、增加 B（或指数基金）。需要指出的风险：三种情形的概率只是估计，若繁荣概率被低估，结论可能改变。","sol_en":"Sharpe ratio: A = (10 − 3) ÷ 15.68 ≈ 0.45; B = (6 − 3) ÷ 2.83 ≈ 1.06; portfolio = (8.4 − 3) ÷ 8.29 ≈ 0.65. B offers the highest return per unit of risk and A the lowest.\nCAPM required return = 3% + 1.4 × (9% − 3%) = **11.4%**, but A's expected return is only 10%, so α = 10% − 11.4% = **−1.4%**: A is overpriced.\nAdvice: under this forecast, reduce the weight in A and increase B (or an index fund). A risk worth pointing out: the probabilities of the three scenarios are only estimates; if the probability of a boom has been underestimated, the conclusion could change."}]},{"id":"P-F4-1","t":"F4","title":"BrewBox: Fixing a Coffee Subscription","stem":"BrewBox sells a monthly coffee-bean subscription box for $25. Each box costs $11 in beans and packaging and $4 in shipping and payment fees. Fixed costs (staff, rent, software) are $30,000 per month. BrewBox currently has 2,400 subscribers; monthly churn is 8%, and it spends on average $90 in online advertising to acquire each new subscriber. The founders ask your team to assess the business and recommend a strategy to a panel of investors.","parts":[{"q":"(a) Calculate the contribution margin per box, the break-even number of subscribers, and BrewBox's current monthly profit.","sol":"单位边际贡献 = 25 − 11 − 4 = **10 美元/箱**。\n盈亏平衡订阅数 = 30,000 ÷ 10 = **3,000 人**。\n当前月利润 = 2,400 × 10 − 30,000 = **−6,000 美元**（亏损）。","sol_en":"Contribution margin per box = 25 − 11 − 4 = **$10 per box**.\nBreak-even number of subscribers = 30,000 ÷ 10 = **3,000**.\nCurrent monthly profit = 2,400 × 10 − 30,000 = **−$6,000** (a loss)."},{"q":"(b) Estimate customer lifetime value (LTV), the LTV/CAC ratio and the CAC payback period. Is the unit economics healthy?","sol":"平均客户寿命 = 1 ÷ 8% = 12.5 个月。\nLTV = 10 × 12.5 = **125 美元**。\nLTV/CAC = 125 ÷ 90 ≈ **1.39**；回本期 = 90 ÷ 10 = **9 个月**。\n行业常用健康标准为 LTV/CAC ≥ 3、回本期 ≤ 12 个月。BrewBox 虽能回本，但 LTV/CAC 偏低，扣除管理费用后获客几乎不赚钱——单位经济学 (unit economics) 不健康，单纯加大广告投放只会烧钱。","sol_en":"Average customer lifetime = 1 ÷ 8% = 12.5 months.\nLTV = 10 × 12.5 = **$125**.\nLTV/CAC = 125 ÷ 90 ≈ **1.39**; payback period = 90 ÷ 10 = **9 months**.\nCommon industry benchmarks for health are LTV/CAC ≥ 3 and a payback period ≤ 12 months. BrewBox does earn back its acquisition cost, but its LTV/CAC is low: after overheads, acquiring customers barely makes any money — the unit economics are unhealthy, and simply spending more on advertising will only burn cash."},{"q":"(c) Option 1: raise the price to $28, which the team expects to increase monthly churn to 10%. Option 2: launch a referral programme that cuts CAC to $60 with price and churn unchanged. Compare the LTV/CAC of each option. For Option 1, also compare the new break-even with the steady-state subscriber base if BrewBox keeps acquiring the same number of new subscribers per month as now.","sol":"**方案 1（涨价）**：边际贡献 = 28 − 15 = 13；寿命 = 1 ÷ 10% = 10 个月；LTV = 130；LTV/CAC = 130 ÷ 90 ≈ **1.44**；盈亏平衡订阅数 = 30,000 ÷ 13 ≈ **2,308 人**。\n短期看，2,400 人 × 13 − 30,000 = +1,200，似乎扭亏。但当前每月新增 = 2,400 × 8% = 192 人（稳态时新增 = 流失）。流失率升到 10% 后，稳态订阅数 = 192 ÷ 10% = **1,920 人**，低于 2,308 的盈亏平衡点，稳态月利润 = 1,920 × 13 − 30,000 = **−5,040 美元**。涨价的好处被更高的流失率侵蚀。\n**方案 2（推荐计划）**：LTV 仍为 125，LTV/CAC = 125 ÷ 60 ≈ **2.08**，回本期 = 60 ÷ 10 = 6 个月，单位经济学明显改善，且同样的营销预算可获取 1.5 倍的新用户。","sol_en":"**Option 1 (price rise)**: contribution margin = 28 − 15 = 13; lifetime = 1 ÷ 10% = 10 months; LTV = 130; LTV/CAC = 130 ÷ 90 ≈ **1.44**; break-even subscribers = 30,000 ÷ 13 ≈ **2,308**.\nIn the short run, 2,400 × 13 − 30,000 = +1,200, which appears to turn the loss into a profit. But currently new subscribers per month = 2,400 × 8% = 192 (in steady state, new subscribers = churned subscribers). Once churn rises to 10%, the steady-state subscriber base = 192 ÷ 10% = **1,920**, below the break-even point of 2,308, and steady-state monthly profit = 1,920 × 13 − 30,000 = **−$5,040**. The benefit of the price rise is eroded by higher churn.\n**Option 2 (referral programme)**: LTV stays at 125, LTV/CAC = 125 ÷ 60 ≈ **2.08**, and the payback period = 60 ÷ 10 = 6 months. The unit economics improve markedly, and the same marketing budget acquires 1.5 times as many new users."},{"q":"(d) Prepare a 1-minute recommendation for the investor panel: state your recommendation first, support it with three numbers, and name the key risk and how you would test it.","sol":"**结论先行**：优先推出推荐计划（方案 2），暂不涨价；同时把降低流失率作为核心 KPI。\n**三个数字**：\n- 目前每位用户终身价值 125 美元，但获客成本 90 美元，LTV/CAC 仅 1.39；\n- 推荐计划把 CAC 降到 60，LTV/CAC 提升到约 2.1，回本期从 9 个月缩短到 6 个月；\n- 涨价看似短期扭亏 (+1,200)，但若流失率升到 10%，稳态订阅人数将降到约 1,920，每月亏损约 5,040。\n**下一步**：要达到 3,000 人的盈亏平衡点，还需把流失率从 8% 降下来（如按季度预付折扣、个性化口味推荐）——流失率降到 6% 时寿命从 12.5 个月增加到约 16.7 个月，LTV 升至约 167。\n**关键风险**：推荐计划的 CAC 假设（60 美元）可能过于乐观。检验方法：先在 10% 的用户中做为期 1 个月的 A/B 测试，测量每位推荐用户的实际获客成本与留存率，再决定是否全面推广。","sol_en":"**Answer first**: launch the referral programme (Option 2) first and hold off on the price rise; at the same time, make reducing churn the core KPI.\n**Three numbers**:\n- Each user's lifetime value is currently $125, but acquiring them costs $90, so LTV/CAC is only 1.39;\n- The referral programme cuts CAC to 60, raising LTV/CAC to about 2.1 and shortening the payback period from 9 months to 6;\n- The price rise appears to restore profit in the short run (+1,200), but if churn rises to 10%, the steady-state subscriber base will fall to about 1,920, with a monthly loss of about 5,040.\n**Next steps**: to reach the break-even point of 3,000 subscribers, churn also needs to come down from 8% (e.g. through discounts for quarterly prepayment and personalised flavour recommendations) — at a churn rate of 6%, lifetime rises from 12.5 months to about 16.7 months and LTV to about 167.\n**Key risk**: the CAC assumption for the referral programme ($60) may be too optimistic. How to test it: first run a one-month A/B test on 10% of users, measuring the actual acquisition cost and retention rate of each referred user, then decide whether to roll it out fully."}]},{"id":"P-m11-1","t":"m11","title":"Whose Objective? Profit, Revenue and Sales Maximisation","stem":"A large listed company is run by professional managers. It faces the market demand curve P = 120 − 2Q, where P is price in $ and Q is output in thousands of units. Its costs are TC = 800 + 20Q (so MC = 20). Shareholders want profit maximised, but the managers' bonuses depend on sales revenue.","parts":[{"q":"(a) Find the profit-maximising output, price and profit.","sol":"MR = 120 − 4Q。令 MR = MC：120 − 4Q = 20 ⇒ Q = 25，P = 120 − 50 = 70。\nTR = 70 × 25 = 1,750；TC = 800 + 20 × 25 = 1,300；利润 π = 450。","sol_en":"MR = 120 − 4Q. Set MR = MC: 120 − 4Q = 20 ⇒ Q = 25, P = 120 − 50 = 70.\nTR = 70 × 25 = 1,750; TC = 800 + 20 × 25 = 1,300; profit π = 450."},{"q":"(b) If the managers maximise total revenue, find output, price, revenue and profit. Explain why the price elasticity of demand equals −1 at this point.","sol":"收入最大化：MR = 0 ⇒ Q = 30，P = 60，TR = 1,800。\nTC = 800 + 600 = 1,400，π = 400（比利润最大化少 50）。\nPED = (ΔQ/ΔP) × (P/Q) = (−1/2) × (60/30) = −1。MR = P(1 + 1/PED)，MR = 0 当且仅当 |PED| = 1：此时价格小幅下降带来的销量增加恰好抵消价格下降，总收益不再变化。","sol_en":"Revenue maximisation: MR = 0 ⇒ Q = 30, P = 60, TR = 1,800.\nTC = 800 + 600 = 1,400, π = 400 (50 less than under profit maximisation).\nPED = (ΔQ/ΔP) × (P/Q) = (−1/2) × (60/30) = −1. Since MR = P(1 + 1/PED), MR = 0 if and only if |PED| = 1: a small price cut raises sales by just enough to offset the lower price, so total revenue no longer changes."},{"q":"(c) If the firm instead maximises sales volume subject to earning at least normal profit, find output and price. Compare with the allocatively efficient output.","sol":"销售最大化：AR = AC ⇒ 120 − 2Q = 20 + 800/Q ⇒ 120Q − 2Q² = 20Q + 800 ⇒ Q² − 50Q + 400 = 0 ⇒ (Q − 10)(Q − 40) = 0。\n取较大根 Q = 40，P = 40，经济利润为 0。\n配置效率 P = MC：120 − 2Q = 20 ⇒ Q = 50。故 25 < 30 < 40 < 50：销售最大化最接近配置效率，但仍未达到（P = 40 > MC = 20），且企业不能在 Q = 50 处不亏损（AC = 36 > P = 20）。","sol_en":"Sales maximisation: AR = AC ⇒ 120 − 2Q = 20 + 800/Q ⇒ 120Q − 2Q² = 20Q + 800 ⇒ Q² − 50Q + 400 = 0 ⇒ (Q − 10)(Q − 40) = 0.\nTake the larger root Q = 40, P = 40, with zero economic profit.\nAllocative efficiency P = MC: 120 − 2Q = 20 ⇒ Q = 50. So 25 < 30 < 40 < 50: sales maximisation comes closest to allocative efficiency but does not reach it (P = 40 > MC = 20), and the firm could not avoid a loss at Q = 50 (AC = 36 > P = 20)."},{"q":"(d) Shareholders impose a constraint: managers may pursue revenue, but profit must be at least 442. Find the output managers choose and the revenue earned. Use this to discuss the principal–agent problem and two ways shareholders could reduce it.","sol":"利润函数 π(Q) = (120 − 2Q)Q − 20Q − 800 = 100Q − 2Q² − 800。无约束的收入最大化点 Q = 30 时 π = 400 < 442，约束是紧的。\n令 π = 442：2Q² − 100Q + 1,242 = 0 ⇒ Q² − 50Q + 621 = 0 ⇒ Q = 23 或 27。经理希望收入尽量大，而收入在 Q < 30 时随 Q 增加，故取 Q = 27，P = 66，TR = 66 × 27 = 1,782，π = 442。\n这体现了委托–代理问题：经理（代理人）在满足股东（委托人）最低要求的前提下追求自身目标（满意化 satisficing），产量高于利润最大化的 25。\n缓解办法：把薪酬与利润或股价挂钩（股票期权、利润分成）；加强董事会与独立董事监督、信息披露；活跃的公司控制权市场（收购威胁）也会约束经理。","sol_en":"Profit function π(Q) = (120 − 2Q)Q − 20Q − 800 = 100Q − 2Q² − 800. At the unconstrained revenue-maximising point Q = 30, π = 400 < 442, so the constraint binds.\nSet π = 442: 2Q² − 100Q + 1,242 = 0 ⇒ Q² − 50Q + 621 = 0 ⇒ Q = 23 or 27. Managers want revenue to be as large as possible, and revenue rises with Q for Q < 30, so they choose Q = 27, P = 66, TR = 66 × 27 = 1,782, π = 442.\nThis illustrates the principal–agent problem: the managers (agents) pursue their own objective subject to meeting the shareholders' (principals') minimum requirement (satisficing), producing more than the profit-maximising 25.\nRemedies: link pay to profit or the share price (share options, profit-sharing); strengthen oversight by the board and independent directors and improve disclosure; an active market for corporate control (the threat of takeover) also disciplines managers."}]},{"id":"P-M8-1","t":"M8","title":"Closing a Current-Account Deficit: Switch or Squeeze?","stem":"Country Z has GDP of 3,000, exports of 400 and imports of 500 (all in domestic currency), so its trade deficit is 100. Its marginal propensities are MPS = 0.2, MPT = 0.2 and MPM = 0.1. The government considers two options: (1) allowing the currency to depreciate by 10%, or (2) cutting government spending. Assume domestic-currency export prices do not change after a depreciation, while the domestic-currency price of imports rises by the full 10%. Short-run price elasticities of demand are |PEDx| = 0.2 and |PEDm| = 0.1; long-run elasticities are |PEDx| = 0.7 and |PEDm| = 0.5.","parts":[{"q":"(a) Calculate the trade balance in the short run after a 10% depreciation. Explain the result.","sol":"出口量 +0.2 × 10% = +2%，出口收入 = 400 × 1.02 = 408。\n进口量 −0.1 × 10% = −1%，进口支出 = 500 × 1.10 × 0.99 = 544.5。\n差额 = 408 − 544.5 = −136.5，比原来的 −100 恶化 36.5。\n原因：短期内合同和习惯使贸易量反应迟缓，弹性之和 0.3 < 1，进口价格上涨的效应占主导——这是 J 曲线 (J-curve) 的下行段。","sol_en":"Export volume +0.2 × 10% = +2%, export revenue = 400 × 1.02 = 408.\nImport volume −0.1 × 10% = −1%, import spending = 500 × 1.10 × 0.99 = 544.5.\nBalance = 408 − 544.5 = −136.5, a deterioration of 36.5 from the original −100.\nReason: in the short run contracts and habits make trade volumes slow to respond; the elasticity sum 0.3 < 1, so the effect of higher import prices dominates — the downward leg of the J-curve."},{"q":"(b) Calculate the long-run trade balance after the depreciation. Is the Marshall–Lerner condition satisfied? Why might the improvement be smaller than the elasticity sum suggests?","sol":"出口量 +7%，出口收入 = 400 × 1.07 = 428。\n进口量 −5%，进口支出 = 500 × 1.10 × 0.95 = 522.5。\n差额 = 428 − 522.5 = −94.5，比初始改善 5.5。\n弹性之和 1.2 > 1，满足马歇尔–勒纳条件，但改善很小：因为初始进口 (500) 大于出口 (400)，进口价格上涨作用在更大的基数上（初始有赤字时，严格条件要求弹性之和大于 1 的程度更高）。此外，进口成本推动型通胀会侵蚀部分竞争力收益。","sol_en":"Export volume +7%, export revenue = 400 × 1.07 = 428.\nImport volume −5%, import spending = 500 × 1.10 × 0.95 = 522.5.\nBalance = 428 − 522.5 = −94.5, an improvement of 5.5 on the initial position.\nThe elasticity sum is 1.2 > 1, so the Marshall–Lerner condition is met, but the improvement is small: initial imports (500) exceed exports (400), so the import price rise applies to a larger base (with an initial deficit the exact condition requires the sum to exceed 1 by a wider margin). In addition, imported cost-push inflation erodes part of the competitiveness gain."},{"q":"(c) Instead, the government uses only a cut in government spending to reduce the trade deficit by 30. Find the required cut in G and the fall in GDP. If each 1% fall in GDP raises unemployment by 0.5 percentage points, what happens to unemployment?","sol":"乘数 k = 1 ÷ (0.2 + 0.2 + 0.1) = 2。\n仅靠进口减少：ΔM = MPM × ΔY ⇒ −30 = 0.1 × ΔY ⇒ ΔY = −300。\n所需 ΔG = −300 ÷ 2 = −150。\nGDP 下降 300 ÷ 3,000 = 10%，失业率上升约 10 × 0.5 = 5 个百分点。\n结论：支出减少政策在 MPM 较低时代价极高，与充分就业目标严重冲突。","sol_en":"Multiplier k = 1 ÷ (0.2 + 0.2 + 0.1) = 2.\nThrough imports alone: ΔM = MPM × ΔY ⇒ −30 = 0.1 × ΔY ⇒ ΔY = −300.\nRequired ΔG = −300 ÷ 2 = −150.\nGDP falls by 300 ÷ 3,000 = 10%, so unemployment rises by about 10 × 0.5 = 5 percentage points.\nConclusion: when MPM is low, expenditure-reducing policy is extremely costly and conflicts sharply with the full-employment objective."},{"q":"(d) Recommend a policy mix for Country Z, using the results above. Refer to at least one supply-side policy and to the time profile of the effects.","sol":"建议：以支出转换为主、适度支出减少为辅，并配合供给侧政策。\n- 贬值的短期代价（J 曲线恶化）是暂时的，长期可改善经常账户且不需大幅牺牲产出；但改善幅度小，需防范进口通胀，央行应锚定通胀预期。\n- 仅靠削减 G 会使失业上升约 5 个百分点，应只作温和的财政整顿，例如削减进口密集型支出，而非全面紧缩。\n- 供给侧政策（职业培训、研发税收抵免、基础设施、放松出口行业管制）提高生产率和非价格竞争力，使出口弹性长期上升、LRAS 右移，从根本上减少增长与经常账户之间的冲突，但见效需要数年。\n- 评价：政策时滞、贸易伙伴的报复风险、赤字若源于高投资（为未来增长融资）则未必需要矫正。","sol_en":"Recommendation: rely mainly on expenditure switching, with modest expenditure reduction, combined with supply-side policy.\n- The short-run cost of depreciation (the J-curve deterioration) is temporary, and in the long run it improves the current account without a large loss of output; but the improvement is small, so imported inflation must be guarded against and the central bank should anchor inflation expectations.\n- Cutting G alone would raise unemployment by about 5 percentage points, so fiscal consolidation should be mild, e.g. trimming import-intensive spending rather than a broad squeeze.\n- Supply-side policies (vocational training, R&D tax credits, infrastructure, deregulating export sectors) raise productivity and non-price competitiveness, increasing export elasticities over time and shifting LRAS right, which fundamentally eases the conflict between growth and the current account, though they take years to work.\n- Evaluation: policy lags, the risk of retaliation by trading partners, and if the deficit reflects high investment (financing future growth) it may not need correcting at all."}]},{"id":"P-M9-1","t":"M9","title":"Ranking Development: HDI, Inequality and Multidimensional Poverty","stem":"Two countries have the following data (UNDP goalposts: life expectancy 20–85; mean years of schooling 0–15; expected years of schooling 0–18; GNI per capita $100–$75,000 at PPP, income index uses natural logs).\nCountry X: life expectancy 70 years; mean years of schooling 8; expected years of schooling 13; GNI per capita $12,000 (PPP). Income shares by quintile (poorest to richest): 5%, 10%, 15%, 25%, 45%.\nCountry Y: life expectancy 78 years; mean years of schooling 11; expected years of schooling 16; GNI per capita $9,000 (PPP).\nIn Country X, 25% of people are multidimensionally poor, and on average they are deprived in 44% of the weighted indicators.","parts":[{"q":"(a) Calculate the health, education and income indices and the HDI for Country X.","sol":"健康指数 = (70 − 20) ÷ 65 ≈ 0.769。\n教育指数 = ½(8/15 + 13/18) = ½(0.533 + 0.722) ≈ 0.628。\n收入指数 = (ln12000 − ln100) ÷ (ln75000 − ln100) = ln120 ÷ ln750 ≈ 4.787 ÷ 6.620 ≈ 0.723。\nHDI_X = (0.769 × 0.628 × 0.723)^(1/3) ≈ 0.704。","sol_en":"Health index = (70 − 20) ÷ 65 ≈ 0.769.\nEducation index = ½(8/15 + 13/18) = ½(0.533 + 0.722) ≈ 0.628.\nIncome index = (ln12000 − ln100) ÷ (ln75000 − ln100) = ln120 ÷ ln750 ≈ 4.787 ÷ 6.620 ≈ 0.723.\nHDI_X = (0.769 × 0.628 × 0.723)^(1/3) ≈ 0.704."},{"q":"(b) Calculate the HDI for Country Y. Compare the ranking of X and Y by GNI per capita with their ranking by HDI, and explain the difference.","sol":"健康 = (78 − 20) ÷ 65 ≈ 0.892；教育 = ½(11/15 + 16/18) ≈ ½(0.733 + 0.889) ≈ 0.811；收入 = ln90 ÷ ln750 ≈ 4.500 ÷ 6.620 ≈ 0.680。\nHDI_Y = (0.892 × 0.811 × 0.680)^(1/3) ≈ 0.789。\n按人均GNI，X ($12,000) 高于 Y ($9,000)；按 HDI，Y (0.789) 高于 X (0.704)，排名逆转。\n原因：Y 把收入更有效地转化为健康和教育（公共卫生、教育投入更多或分配更平均）；而收入指数取对数，收入差距对 HDI 的影响被压缩，健康与教育的明显优势占主导。","sol_en":"Health = (78 − 20) ÷ 65 ≈ 0.892; education = ½(11/15 + 16/18) ≈ ½(0.733 + 0.889) ≈ 0.811; income = ln90 ÷ ln750 ≈ 4.500 ÷ 6.620 ≈ 0.680.\nHDI_Y = (0.892 × 0.811 × 0.680)^(1/3) ≈ 0.789.\nBy GNI per capita, X ($12,000) ranks above Y ($9,000); by HDI, Y (0.789) ranks above X (0.704), so the ranking is reversed.\nReason: Y converts income into health and education more effectively (more public spending on health and education, or a more equal distribution); and because the income index is logged, the income gap has a compressed effect on the HDI, so Y's clear advantage in health and education dominates."},{"q":"(c) Using the quintile shares, calculate the Gini coefficient for Country X (treat the Lorenz curve as straight lines between quintile points).","sol":"累计收入份额：0、0.05、0.15、0.30、0.55、1.00。\n每个梯形宽 0.2，B = 0.2 × [(0 + 0.05) + (0.05 + 0.15) + (0.15 + 0.30) + (0.30 + 0.55) + (0.55 + 1.00)] ÷ 2 = 0.1 × 3.10 = 0.31。\nG = 1 − 2B = 1 − 0.62 = 0.38。","sol_en":"Cumulative income shares: 0, 0.05, 0.15, 0.30, 0.55, 1.00.\nEach trapezium has width 0.2, so B = 0.2 × [(0 + 0.05) + (0.05 + 0.15) + (0.15 + 0.30) + (0.30 + 0.55) + (0.55 + 1.00)] ÷ 2 = 0.1 × 3.10 = 0.31.\nG = 1 − 2B = 1 − 0.62 = 0.38."},{"q":"(d) Calculate Country X's MPI. The government of X can spend a fixed budget on either (i) cash transfers to the poorest quintile or (ii) rural clinics and schools. Evaluate which is more likely to raise X's HDI and reduce its MPI.","sol":"MPI = H × A = 0.25 × 0.44 = 0.11。\n(i) 现金转移：直接提高最穷 20% 的收入，降低不平等（基尼下降）和绝对贫困；但收入指数取对数且按全国平均计算，全国人均收入几乎不变，HDI 提升很小；若家庭用现金购买营养、学费，也会间接改善健康教育。\n(ii) 诊所和学校：直接提高预期寿命和受教育年限，X 的健康 (0.769) 与教育 (0.628) 指数是短板，几何平均下提升短板对 HDI 的效果最大；同时减少 MPI 中的健康、教育剥夺指标。\n结论：以提高 HDI、降低 MPI 为目标，(ii) 通常更有效，但见效较慢且依赖执行质量（腐败、教师缺勤）；最佳方案可能是有条件现金转移 (CCT，如以子女入学、体检为条件)，同时发挥两者优势。","sol_en":"MPI = H × A = 0.25 × 0.44 = 0.11.\n(i) Cash transfers: directly raise the incomes of the poorest 20%, reducing inequality (lower Gini) and absolute poverty; but the income index is logged and based on the national average, so national income per capita barely changes and the HDI rises only slightly; if households spend the cash on nutrition and school fees, health and education also improve indirectly.\n(ii) Clinics and schools: directly raise life expectancy and years of schooling; X's health (0.769) and education (0.628) indices are its weak points, and with a geometric mean raising the weakest dimension has the largest effect on the HDI; this also reduces the health and education deprivation indicators in the MPI.\nConclusion: if the aim is to raise the HDI and lower the MPI, (ii) is usually more effective, but it works more slowly and depends on implementation quality (corruption, teacher absenteeism); the best option may be conditional cash transfers (CCTs, e.g. conditional on school enrolment and health check-ups), which combine the strengths of both."}]},{"id":"P-M10-1","t":"M10","title":"Tariff, Quota and a Free Trade Agreement","stem":"A small country's domestic market for bicycles is described by Qd = 180 − 3P and Qs = 2P − 20 (P in $, Q in thousands). The world price, at which the lowest-cost producer (Country C) sells, is $20. A potential trade partner, Country B, can supply bicycles at $22.","parts":[{"q":"(a) Find the autarky price and quantity, and the quantity imported under free trade at the world price.","sol":"自给自足：180 − 3P = 2P − 20 → 5P = 200 → P = 40，Q = 60（千辆）。\n自由贸易 P = 20：Qd = 180 − 60 = 120，Qs = 40 − 20 = 20，进口 = 100（千辆）。","sol_en":"Autarky: 180 − 3P = 2P − 20 → 5P = 200 → P = 40, Q = 60 (thousand).\nFree trade at P = 20: Qd = 180 − 60 = 120, Qs = 40 − 20 = 20, imports = 100 (thousand)."},{"q":"(b) The government imposes a tariff of $5 per bicycle on all imports. Calculate the change in consumer surplus, the change in producer surplus, tariff revenue and the deadweight loss.","sol":"国内价格 = 20 + 5 = 25：Qd = 105，Qs = 30，进口 = 75。\nΔCS = −(120 + 105) ÷ 2 × 5 = −562.5。\nΔPS = (20 + 30) ÷ 2 × 5 = +125。\n关税收入 = 5 × 75 = 375。\nDWL = ½ × 5 × (30 − 20) + ½ × 5 × (120 − 105) = 25 + 37.5 = 62.5。\n核对：562.5 = 125 + 375 + 62.5（单位：千美元）。","sol_en":"Domestic price = 20 + 5 = 25: Qd = 105, Qs = 30, imports = 75.\nΔCS = −(120 + 105) ÷ 2 × 5 = −562.5.\nΔPS = (20 + 30) ÷ 2 × 5 = +125.\nTariff revenue = 5 × 75 = 375.\nDWL = ½ × 5 × (30 − 20) + ½ × 5 × (120 − 105) = 25 + 37.5 = 62.5.\nCheck: 562.5 = 125 + 375 + 62.5 (in $ thousand)."},{"q":"(c) Instead of the tariff, the government sets an import quota that gives the same domestic price. What is the quota, and what is the country's net welfare loss if the import licences are given free to foreign exporters?","sol":"配额 = 75（千辆），国内价格同样为 25。\n原本的关税收入 375 变成配额租金，由外国出口商获得，不再属于本国。\n本国净损失 = DWL 62.5 + 配额租金 375 = 437.5（千美元），远大于关税下的 62.5。\n若政府拍卖许可证，可收回租金，净损失回到 62.5。","sol_en":"Quota = 75 (thousand), giving the same domestic price of 25.\nThe former tariff revenue of 375 becomes quota rent captured by foreign exporters and no longer belongs to the home country.\nHome net loss = DWL 62.5 + quota rent 375 = 437.5 ($ thousand), far larger than 62.5 under the tariff.\nIf the government auctioned the licences it could recover the rent, and the net loss would fall back to 62.5."},{"q":"(d) Starting from the $5 tariff, the country signs a free trade agreement with B, keeping the tariff on C. Find the new price and imports, decompose the welfare change into trade creation and trade diversion, and state whether the FTA raises the country's welfare.","sol":"从 C 进口含税价 25 > B 免税价 22，进口全部转向 B，国内价格 = 22：Qd = 180 − 66 = 114，Qs = 44 − 20 = 24，进口 = 90。\n相对关税情形：ΔCS = +(105 + 114) ÷ 2 × 3 = +328.5；ΔPS = −(30 + 24) ÷ 2 × 3 = −81；关税收入损失 375。\n净变化 = 328.5 − 81 − 375 = −127.5（千美元）。\n分解：贸易创造收益 = ½ × 3 × (30 − 24) + ½ × 3 × (114 − 105) = 9 + 13.5 = 22.5；贸易转移损失 = 原有 75 单位 × (22 − 20) = 150。22.5 − 150 = −127.5，一致。\n结论：贸易转移效应大于贸易创造效应，该 FTA 降低本国福利；若伙伴 B 的成本更接近 20 或原关税更高，结论可能相反。","sol_en":"Importing from C costs 25 with the tariff > B's tariff-free price of 22, so all imports switch to B and the domestic price = 22: Qd = 180 − 66 = 114, Qs = 44 − 20 = 24, imports = 90.\nRelative to the tariff case: ΔCS = +(105 + 114) ÷ 2 × 3 = +328.5; ΔPS = −(30 + 24) ÷ 2 × 3 = −81; lost tariff revenue 375.\nNet change = 328.5 − 81 − 375 = −127.5 ($ thousand).\nDecomposition: trade-creation gain = ½ × 3 × (30 − 24) + ½ × 3 × (114 − 105) = 9 + 13.5 = 22.5; trade-diversion loss = the original 75 units × (22 − 20) = 150. 22.5 − 150 = −127.5, consistent.\nConclusion: trade diversion outweighs trade creation, so this FTA lowers the country's welfare; if B's cost were closer to 20 or the original tariff were higher, the conclusion could be reversed."}]},{"id":"P-F6-1","t":"F6","title":"Protecting the Lin Family's Money","stem":"The Lin family asks your team for advice. (1) Deposits (principal plus interest): Mr. Lin has 620,000 yuan at Bank X; Mrs. Lin has 300,000 yuan at Bank X and 150,000 yuan at Bank Y. China's deposit insurance covers up to 500,000 yuan per depositor per bank. (2) Car insurance: each year there is a 15% chance of a minor accident (loss 3,000 yuan) and a 3% chance of a major accident (loss 40,000 yuan); otherwise no loss (at most one accident a year). Plan A: premium 2,000 yuan, deductible 1,000 yuan. Plan B: premium 1,300 yuan, deductible 5,000 yuan. Neither plan has a co-payment or binding coverage limit. (3) A friend recommends a platform promising \"a guaranteed 2% per month, principal protected\", paid in a new token.","parts":[{"q":"(a) How much of the family's deposits is not covered by deposit insurance? Suggest a simple way to make all deposits fully insured.","sol":"存款保险按“每人每行”计算。\n林先生在 X 行 620,000 元，保障 500,000，**未保障 120,000 元**。\n林太太在 X 行 300,000、Y 行 150,000，均低于 50 万，全额保障（夫妻是不同存款人，分别计算）。\n家庭未保障合计 = **120,000 元**。\n建议：林先生把至少 120,000 元转存到另一家投保银行（如 Y 行，他本人在 Y 行尚无存款），即可全部受保；不必转到林太太名下。","sol_en":"Deposit insurance is calculated per depositor per bank.\nMr. Lin has 620,000 at Bank X, of which 500,000 is covered, leaving **120,000 uncovered**.\nMrs. Lin has 300,000 at X and 150,000 at Y, both below 500,000, so she is fully covered (spouses are separate depositors, calculated separately).\nTotal uncovered for the family = **120,000 yuan**.\nAdvice: Mr. Lin moves at least 120,000 to another insured bank (e.g. Bank Y, where he has no deposits yet), making everything insured; there is no need to move it into Mrs. Lin's name."},{"q":"(b) For each car insurance plan, calculate the insurer's expected payout, the family's expected total cost (premium plus expected out-of-pocket cost) and the worst-case total cost.","sol":"计算每种情况下自付 = min(损失, 免赔额)，赔付 = 损失 − 自付。\n计划 A：小事故自付 1,000、赔 2,000；大事故自付 1,000、赔 39,000。\n期望赔付 A = 0.15 × 2,000 + 0.03 × 39,000 = 300 + 1,170 = **1,470 元**；期望自付 = 0.15 × 1,000 + 0.03 × 1,000 = 180；期望总成本 A = 2,000 + 180 = **2,180 元**；最坏情况 = 2,000 + 1,000 = **3,000 元**。\n计划 B：小事故损失 3,000 < 免赔额 5,000，全部自付、赔 0；大事故自付 5,000、赔 35,000。\n期望赔付 B = 0.03 × 35,000 = **1,050 元**；期望自付 = 0.15 × 3,000 + 0.03 × 5,000 = 450 + 150 = 600；期望总成本 B = 1,300 + 600 = **1,900 元**；最坏情况 = 1,300 + 5,000 = **6,300 元**。\n检验：期望总成本 = 保费 + 期望损失 − 期望赔付；期望损失 = 0.15 × 3,000 + 0.03 × 40,000 = 1,650。A：2,000 + 1,650 − 1,470 = 2,180 ✓；B：1,300 + 1,650 − 1,050 = 1,900 ✓。","sol_en":"In each state, out-of-pocket = min(loss, deductible) and payout = loss − out-of-pocket.\nPlan A: minor accident — pay 1,000, insurer pays 2,000; major accident — pay 1,000, insurer pays 39,000.\nExpected payout A = 0.15 × 2,000 + 0.03 × 39,000 = 300 + 1,170 = **1,470 yuan**; expected out-of-pocket = 0.15 × 1,000 + 0.03 × 1,000 = 180; expected total cost A = 2,000 + 180 = **2,180 yuan**; worst case = 2,000 + 1,000 = **3,000 yuan**.\nPlan B: minor accident — the 3,000 loss is below the 5,000 deductible, so the family pays it all and the insurer pays 0; major accident — pay 5,000, insurer pays 35,000.\nExpected payout B = 0.03 × 35,000 = **1,050 yuan**; expected out-of-pocket = 0.15 × 3,000 + 0.03 × 5,000 = 450 + 150 = 600; expected total cost B = 1,300 + 600 = **1,900 yuan**; worst case = 1,300 + 5,000 = **6,300 yuan**.\nCheck: expected total cost = premium + expected loss − expected payout; expected loss = 0.15 × 3,000 + 0.03 × 40,000 = 1,650. A: 2,000 + 1,650 − 1,470 = 2,180 ✓; B: 1,300 + 1,650 − 1,050 = 1,900 ✓."},{"q":"(c) Which plan would you recommend, and under what circumstances would the other plan be better? Explain why insurers offer high-deductible plans at lower premiums, referring to moral hazard and adverse selection.","sol":"若林家有足够应急资金（能轻松承担 5,000 元），推荐 **B**：期望总成本低 280 元（2,180 − 1,900）。\n若家庭现金紧张或非常厌恶风险，A 的最坏情况 3,000 元远低于 B 的 6,300 元，A 更合适——多付的 280 元是买“确定性”的代价。\n保险公司的附加费用 (loading)：A 为 2,000 − 1,470 = 530，B 为 1,300 − 1,050 = 250；小额赔案处理成本高，高免赔额省去了这部分成本。\n**道德风险**：高免赔额让司机自己承担小额损失，更小心驾驶，降低出险率。\n**逆向选择**：保险公司无法直接观察驾驶风险，提供不同免赔额的菜单可让司机**自我选择 (self-selection/screening)**——自认为低风险的司机更愿意选高免赔额低保费，高风险者选低免赔额，从而部分揭示私人信息。","sol_en":"If the Lins have an adequate emergency fund (can easily absorb 5,000 yuan), recommend **B**: its expected total cost is 280 yuan lower (2,180 − 1,900).\nIf the family is short of cash or very risk-averse, A's worst case of 3,000 is far below B's 6,300, so A is more suitable — the extra 280 yuan is the price of buying \"certainty\".\nThe insurer's loading: A is 2,000 − 1,470 = 530, B is 1,300 − 1,050 = 250; small claims are costly to process, and a high deductible saves those costs.\n**Moral hazard**: a high deductible makes drivers bear small losses themselves, so they drive more carefully and have fewer accidents.\n**Adverse selection**: the insurer cannot directly observe driving risk; offering a menu of deductibles lets drivers **self-select (screening)** — drivers who believe they are low-risk prefer a high deductible and low premium, while high-risk drivers choose a low deductible, partly revealing private information."},{"q":"(d) Evaluate the \"guaranteed 2% per month\" platform. Convert the promise to an annual rate, compare it with a typical deposit rate of about 1.5% a year, and list at least three red flags. If the platform holds 10 million yuan of deposits and earns no genuine return, how much new money must it raise each month just to pay the promised returns?","sol":"年化 = (1.02)^12 − 1 ≈ **26.8%**，约为 1.5% 存款利率的 18 倍。\n风险—收益权衡：真正“保本”的资产收益接近无风险利率；承诺远高于此且保本，违背基本金融规律。\n红旗信号：\n- “保证收益”“保本”；\n- 收益远高于市场且说不清来源；\n- 以新发行代币支付（价格可被操纵，可能是拉高出货 pump-and-dump）；\n- 靠熟人推荐扩散（可能含拉人头奖励，接近传销）；\n- 平台是否持牌、资金是否第三方托管不明。\n若没有真实收益，每月需支付 10,000,000 × 2% = **200,000 元**，只能来自新投资者，这正是**庞氏骗局**的结构；一旦新资金流入放缓或集中赎回，平台即崩盘。建议林家远离，并提醒朋友。","sol_en":"Annualised = (1.02)^12 − 1 ≈ **26.8%**, about 18 times the 1.5% deposit rate.\nRisk–return trade-off: genuinely \"principal-protected\" assets earn close to the risk-free rate; promising far more with principal protection violates basic finance.\nRed flags:\n- \"guaranteed returns\" and \"principal protected\";\n- returns far above the market with no clear source;\n- payment in a newly issued token (its price can be manipulated — possibly a pump-and-dump);\n- spread through personal recommendations (possibly with recruitment rewards, close to a pyramid scheme);\n- unclear whether the platform is licensed and whether funds are held by a third-party custodian.\nWith no genuine return, it must pay 10,000,000 × 2% = **200,000 yuan** a month, which can only come from new investors — exactly the structure of a **Ponzi scheme**; as soon as new inflows slow or many investors redeem at once, the platform collapses. Advise the Lins to stay away and warn their friend."}]},{"id":"P-F7-1","t":"F7","title":"Did the Minimum Wage Rise Cost Jobs?","stem":"In January 2024, City A raised its minimum wage from 20 to 24 yuan per hour; neighbouring City B kept it unchanged. A think tank collected employment of workers aged 16–24 (thousands): City A — 45 (2019), 50 (2023), 48 (2025); City B — 36 (2019), 40 (2023), 39 (2025). The consumer price index in both cities rose by 8% between 2023 and 2025. A newspaper headline reads: \"Youth employment in City A fell by 2,000 — the minimum wage destroyed jobs.\"","parts":[{"q":"(a) Compute the compound annual growth rate of youth employment in each city from 2019 to 2023. What does this suggest about using City B as a control group?","sol":"A 市：CAGR = (50 ÷ 45)^(1/4) − 1 ≈ **2.67%**。\nB 市：CAGR = (40 ÷ 36)^(1/4) − 1 ≈ **2.67%**。\n两市政策前增长率几乎相同（50/45 = 40/36 = 1.111），说明政策前趋势平行，支持**平行趋势假设**，B 市适合作为对照组。\n注意：两市就业“水平”不同（50 vs 40）并不影响 DiD，关键是“趋势”相同。","sol_en":"City A: CAGR = (50 ÷ 45)^(1/4) − 1 ≈ **2.67%**.\nCity B: CAGR = (40 ÷ 36)^(1/4) − 1 ≈ **2.67%**.\nThe two cities grew at almost identical rates before the policy (50/45 = 40/36 = 1.111), so pre-policy trends were parallel, supporting the **parallel trends assumption** and making City B a suitable control.\nNote: the different employment levels (50 vs 40) do not matter for DiD; what matters is that the trends are the same."},{"q":"(b) Calculate the percentage change in youth employment in each city from 2023 to 2025 and the difference-in-differences estimate (in percentage points). Is the headline's claim justified?","sol":"A 市：(48 − 50) ÷ 50 = **−4.0%**。\nB 市：(39 − 40) ÷ 40 = **−2.5%**。\nDiD = −4.0% − (−2.5%) = **−1.5 个百分点**。\n标题把全部 2,000 人的下降都归因于最低工资，但对照组 B 市同期也下降了 2.5%（可能是经济放缓等共同冲击）。若 A 市按 B 市趋势变化，就业应为 50 × 0.975 = 48.75 千人，实际 48 千人，政策效应约 **−750 人**，而不是 −2,000 人。\n标题夸大了政策影响，且“摧毁”一词带有规范色彩。","sol_en":"City A: (48 − 50) ÷ 50 = **−4.0%**.\nCity B: (39 − 40) ÷ 40 = **−2.5%**.\nDiD = −4.0% − (−2.5%) = **−1.5 percentage points**.\nThe headline attributes the whole 2,000 fall to the minimum wage, but the control city B also fell 2.5% over the same period (perhaps due to a common shock such as an economic slowdown). Had City A followed B's trend, employment would be 50 × 0.975 = 48.75 thousand; actual employment was 48 thousand, so the policy effect is about **−750 jobs**, not −2,000.\nThe headline overstates the policy's impact, and the word \"destroyed\" is value-laden."},{"q":"(c) Calculate the nominal and real percentage increase in City A's minimum wage, and the implied elasticity of youth employment with respect to the real minimum wage. Interpret the result.","sol":"名义涨幅 = 24 ÷ 20 − 1 = **20%**。\n实际涨幅 = 1.20 ÷ 1.08 − 1 ≈ **11.1%**（通胀吃掉了部分涨幅）。\n就业对实际最低工资的弹性 ≈ −1.5% ÷ 11.1% ≈ **−0.135**（若用名义涨幅：−1.5 ÷ 20 = −0.075）。\n解读：最低工资实际上涨 10%，青年就业约下降 1.35%，影响为负但很小（|弹性| 远小于 1）。由于青年工资总额 ≈ 工资 × 就业，涨薪幅度远大于就业降幅，保住工作的青年工人总收入上升；但失业者受损，需权衡。","sol_en":"Nominal increase = 24 ÷ 20 − 1 = **20%**.\nReal increase = 1.20 ÷ 1.08 − 1 ≈ **11.1%** (inflation eroded part of the rise).\nElasticity of employment with respect to the real minimum wage ≈ −1.5% ÷ 11.1% ≈ **−0.135** (using the nominal rise: −1.5 ÷ 20 = −0.075).\nInterpretation: a 10% real rise in the minimum wage is associated with about a 1.35% fall in youth employment — negative but small (|elasticity| far below 1). Since the youth wage bill ≈ wage × employment, and the pay rise is much larger than the employment fall, total earnings of young
