all time deposits/CDs) 和零售货币市场基金等“近似货币”。","def_en":"M1 plus \"near monies\" such as small time deposits (CDs) and retail money market funds."},{"zh":"部分准备金制度","en":"Fractional reserve banking","def":"银行只保留存款的一部分作为准备金，其余用于放贷，因此能创造货币。","def_en":"Banks keep only a fraction of deposits as reserves and lend out the rest, which allows them to create money."},{"zh":"法定准备金与超额准备金","en":"Required vs excess reserves","def":"法定准备金 = 存款 × 法定准备金率 (rr)；超额准备金 = 实际准备金 − 法定准备金，是单个银行可新增贷款的上限。","def_en":"Required reserves = deposits × the required reserve ratio (rr); excess reserves = actual reserves − required reserves, which is the maximum amount of new loans a single bank can make."},{"zh":"T形账户","en":"T-account (balance sheet)","def":"左边资产（准备金、贷款、债券），右边负债（存款）和所有者权益；资产 = 负债 + 权益。","def_en":"Assets (reserves, loans, bonds) on the left; liabilities (deposits) and owners' equity on the right; assets = liabilities + equity."},{"zh":"货币乘数","en":"Money multiplier","def":"简单模型中 = 1 ÷ rr，表示银行体系由1元超额准备金最多能创造的存款。","def_en":"In the simple model = 1 ÷ rr; it shows the maximum deposits the banking system can create from $1 of excess reserves."},{"zh":"货币市场","en":"Money market","def":"货币需求 (Md) 向下倾斜（利率是持有货币的机会成本），货币供给 (Ms) 由中央银行决定、垂直；交点决定名义利率。","def_en":"Money demand (Md) slopes downward (the interest rate is the opportunity cost of holding money); money supply (Ms) is set by the central bank and is vertical; their intersection determines the nominal interest rate."},{"zh":"货币数量论","en":"Quantity theory of money","def":"MV = PY。若 V 和 Y 相对稳定，长期中货币供给增长主要转化为通胀。","def_en":"MV = PY. If V and Y are relatively stable, in the long run growth in the money supply translates mainly into inflation."}],"formulas":[{"name":"简单货币乘数","f":"m = 1 ÷ rr","note":"最大值；银行持有超额准备金或公众持有现金时实际乘数更小。","name_en":"Simple money multiplier","note_en":"This is the maximum; the actual multiplier is smaller when banks hold excess reserves or the public holds cash."},{"name":"银行体系最大新增存款","f":"ΔD_max = 超额准备金 × (1 ÷ rr)","note":"","name_en":"Maximum new deposits in the banking system","note_en":"","f_en":"ΔD_max = excess reserves × (1 ÷ rr)"},{"name":"新增现金存入后的最大货币供给变化","f":"ΔM_max = 初始超额准备金 × (1 ÷ rr)","note":"现金存入本身只是 M1 内部转换（现金→存款），不改变 M1。","name_en":"Maximum change in the money supply after new cash is deposited","note_en":"The cash deposit itself is only a conversion within M1 (cash → deposits) and does not change M1.","f_en":"ΔM_max = initial excess reserves × (1 ÷ rr)"},{"name":"含现金漏出的乘数","f":"m = (1 + c) ÷ (rr + c)","note":"c = 公众持有现金 ÷ 存款；乘以基础货币 (monetary base)。","name_en":"Multiplier with currency drain","note_en":"c = currency held by the public ÷ deposits; multiply by the monetary base."},{"name":"交易方程式","f":"M × V = P × Y","note":"增长率形式：%ΔM + %ΔV ≈ %ΔP + %ΔY。","name_en":"Equation of exchange","note_en":"Growth-rate form: %ΔM + %ΔV ≈ %ΔP + %ΔY."}],"sections":[{"h":"什么是货币","body":"货币解决了物物交换中“需求的双重巧合” (double coincidence of wants) 问题。\n- **交换媒介**：用于买卖。\n- **计价单位**：菜单上标价、会计记账都以货币为尺度。\n- **价值储藏**：可跨期保存购买力，但通胀会侵蚀这一职能。\n信用卡**不是**货币，它只是一笔短期贷款；股票、债券不是货币，因为不能直接用于支付。","h_en":"What is money?","body_en":"Money solves the \"double coincidence of wants\" problem of barter.\n- **Medium of exchange**: used to buy and sell.\n- **Unit of account**: menu prices and accounting records are all measured in money.\n- **Store of value**: it can hold purchasing power over time, but inflation erodes this function.\nA credit card is **not** money — it is just a short-term loan; stocks and bonds are not money because they cannot be used directly for payment."},{"h":"银行如何创造货币：T形账户","body":"**例题**：法定准备金率 rr = 20%。小明把 1,000 元现金存入A银行。\n- A银行：存款 +1,000，准备金 +1,000；法定准备金 200，超额准备金 800 → A银行最多新增贷款 **800**。\n- 800 被借出并存入B银行，B银行可再贷 640……\n- 银行体系最多新增存款 = 800 × (1 ÷ 0.2) = 4,000（贷款创造的部分）；加上最初的 1,000 存款，总存款最多增加 5,000。\n- 但 **M1 最多增加 4,000**：最初的 1,000 只是从现金变成了存款，M1 总量不变。\n若资金来自中央银行向银行购买债券（新的准备金），则货币供给最多增加 超额准备金 × 1/rr。\n实际乘数较小：银行可能持有超额准备金，公众可能把部分贷款以现金形式持有（现金漏出）。","h_en":"How banks create money: T-accounts","body_en":"**Worked example**: The required reserve ratio rr = 20%. Xiao Ming deposits 1,000 yuan in cash in Bank A.\n- Bank A: deposits +1,000, reserves +1,000; required reserves 200, excess reserves 800 → Bank A can make at most **800** in new loans.\n- The 800 is lent out and deposited in Bank B, which can then lend 640……\n- Maximum new deposits in the banking system = 800 × (1 ÷ 0.2) = 4,000 (the part created by lending); adding the original 1,000 deposit, total deposits can rise by at most 5,000.\n- But **M1 rises by at most 4,000**: the original 1,000 simply changed from cash into deposits, so total M1 was unchanged.\nIf the funds come from the central bank buying bonds from banks (new reserves), the money supply can rise by at most excess reserves × 1/rr.\nThe actual multiplier is smaller: banks may hold excess reserves, and the public may hold part of the loans as cash (currency drain)."},{"h":"货币市场与名义利率","body":"持有货币的机会成本是**名义利率**（放弃的债券利息），所以 Md 向下倾斜。\n- 名义GDP（价格水平或实际收入）上升 → 交易需求增加 → Md 右移 → 名义利率上升。\n- 中央银行增加货币供给 → Ms 右移 → 名义利率下降。\n利率与债券价格反向变动：市场利率上升时，已有的固定票息债券价格下降。","h_en":"The money market and the nominal interest rate","body_en":"The opportunity cost of holding money is the **nominal interest rate** (the bond interest given up), so Md slopes downward.\n- A rise in nominal GDP (the price level or real income) → more transactions demand → Md shifts right → the nominal interest rate rises.\n- The central bank increases the money supply → Ms shifts right → the nominal interest rate falls.\nInterest rates and bond prices move in opposite directions: when market interest rates rise, the prices of existing fixed-coupon bonds fall."},{"h":"货币数量论","body":"MV = PY 是恒等式；加上“V 稳定、长期 Y 由实际因素决定”的假设，就成为理论：**长期中货币增长率 ≈ 通胀率 + 实际产出增长率**。\n**例题**：M = 500，V = 4，实际产出 Y = 1,000，则 P = 500 × 4 ÷ 1,000 = 2。若 M 增长 6%、V 不变、Y 增长 2%，通胀 ≈ 6% − 2% = 4%。\n这就是“通胀在任何时候任何地方都是一种货币现象”（弗里德曼）的依据，也解释了恶性通胀 (hyperinflation) 通常伴随政府大量印钞为赤字融资。","h_en":"The quantity theory of money","body_en":"MV = PY is an identity; adding the assumptions that \"V is stable and long-run Y is determined by real factors\" turns it into a theory: **in the long run, money growth ≈ inflation rate + real output growth**.\n**Worked example**: M = 500, V = 4, real output Y = 1,000, so P = 500 × 4 ÷ 1,000 = 2. If M grows by 6%, V is unchanged and Y grows by 2%, inflation ≈ 6% − 2% = 4%.\nThis is the basis for Friedman's claim that \"inflation is always and everywhere a monetary phenomenon\", and it also explains why hyperinflation usually accompanies governments printing large amounts of money to finance deficits."}],"pitfalls":["把现金存入银行本身算作货币供给增加（它只是M1内部的形式转换）。","用全部准备金而不是超额准备金乘以货币乘数。","认为单个银行可以贷出存款的 1/rr 倍——单个银行最多只能贷出其超额准备金。","把信用卡、股票视为货币。","认为货币需求曲线取决于实际利率——持有货币的机会成本是名义利率。"],"exams":{"AP":"Macro Unit 4 (4.1–4.5); Unit 5 (5.3)","IB":"3.5 (HL: money creation)","AL":"9708 A2 9.5","IEO":"Money, banking & financial intermediation","NEC":"Macro: money & banking"},"diagram":"moneymkt","summary_en":"Money is the \"lubricant\" of the economy. This lesson introduces the functions of money and its measures (M1/M2), uses T-accounts to show how fractional reserve banks create money through lending, and builds the money market model and the quantity theory of money, MV = PY, to explain how the nominal interest rate and long-run inflation are determined.","pitfalls_en":["Counting the deposit of cash into a bank as an increase in the money supply in itself (it is only a change of form within M1).","Multiplying total reserves, rather than excess reserves, by the money multiplier.","Believing a single bank can lend out 1/rr times its deposits — a single bank can lend at most its excess reserves.","Treating credit cards or stocks as money.","Believing the money demand curve depends on the real interest rate — the opportunity cost of holding money is the nominal interest rate."]},{"id":"M5","unit":"macro","title_zh":"货币政策与菲利普斯曲线","title_en":"Monetary Policy & the Phillips Curve","level":"G11+","summary":"中央银行通过调节利率和货币条件稳定通胀与就业。本课讲解现代“充足准备金”框架下的政策工具、可贷资金市场与费雪方程，并用短期/长期菲利普斯曲线说明为何需求政策只能在短期内交换通胀与失业，以及预期的关键作用。","concepts":[{"zh":"公开市场操作","en":"Open market operations (OMO)","def":"央行买卖政府债券：买入增加银行准备金、压低利率（扩张性）；卖出则相反。","def_en":"The central bank buys and sells government bonds: buying adds to bank reserves and pushes interest rates down (expansionary); selling does the opposite."},{"zh":"政策利率","en":"Policy rate (e.g., federal funds rate)","def":"央行设定的目标短期利率，如美联储的联邦基金利率目标区间，通过它影响整个利率体系。","def_en":"The target short-term interest rate set by the central bank, such as the Federal Reserve's target range for the federal funds rate; through it the central bank influences the whole structure of interest rates."},{"zh":"准备金利率","en":"Interest on reserve balances (IORB)","def":"央行对银行存放的准备金支付的利率；在充足准备金框架下是引导政策利率的主要工具。","def_en":"The interest rate the central bank pays on reserves that banks hold with it; under the ample-reserves framework it is the main tool for steering the policy rate."},{"zh":"充足准备金框架","en":"Ample-reserves framework","def":"银行体系准备金充裕，小规模公开市场操作不再改变利率；央行通过调整 IORB、隔夜逆回购利率等管理利率（美联储自2008年后）。","def_en":"The banking system has plentiful reserves, so small open market operations no longer change interest rates; the central bank manages rates by adjusting IORB, the overnight reverse repo rate and other administered rates (the Federal Reserve since 2008)."},{"zh":"法定准备金率","en":"Reserve requirement","def":"传统工具；美联储已于2020年将其降至零，但许多国家（如中国人民银行的存款准备金率）仍在使用。","def_en":"A traditional tool; the Federal Reserve cut it to zero in 2020, but many countries (e.g. the People's Bank of China's reserve requirement ratio) still use it."},{"zh":"可贷资金市场","en":"Loanable funds market","def":"储蓄（供给）与投资借款（需求）决定实际利率；政府赤字增加对可贷资金的需求（或减少国民储蓄）。","def_en":"Saving (supply) and investment borrowing (demand) determine the real interest rate; a government deficit increases the demand for loanable funds (or reduces national saving)."},{"zh":"费雪方程","en":"Fisher equation","def":"名义利率 ≈ 实际利率 + 预期通胀率。","def_en":"Nominal interest rate ≈ real interest rate + expected inflation rate."},{"zh":"短期菲利普斯曲线","en":"Short-run Phillips curve (SRPC)","def":"给定通胀预期时，通胀与失业率之间的反向关系；AD变化使经济沿SRPC移动。","def_en":"For given inflation expectations, an inverse relationship between inflation and the unemployment rate; changes in AD move the economy along the SRPC."},{"zh":"长期菲利普斯曲线","en":"Long-run Phillips curve (LRPC)","def":"在自然失业率处垂直：长期中通胀预期完全调整，失业回到自然率，不存在可利用的交替关系。","def_en":"Vertical at the natural rate of unemployment: in the long run inflation expectations fully adjust and unemployment returns to the natural rate, so there is no exploitable trade-off."},{"zh":"政策组合","en":"Policy mix","def":"财政政策与货币政策的搭配，例如“紧财政 + 松货币”可在不改变总需求的情况下降低利率、提高投资占比。","def_en":"The combination of fiscal and monetary policy; for example, \"tight fiscal + loose monetary\" can lower interest rates and raise the share of investment without changing aggregate demand."}],"formulas":[{"name":"费雪方程","f":"i ≈ r + π^e","note":"事后实际利率 r = i − 实际通胀 π。","name_en":"Fisher equation","note_en":"Ex post real interest rate r = i − actual inflation π."},{"name":"附加预期的菲利普斯曲线","f":"π = π^e − β(u − u_n)","note":"u = u_n 时 π = π^e；预期上升使SRPC上移。","name_en":"Expectations-augmented Phillips curve","note_en":"When u = u_n, π = π^e; higher expectations shift the SRPC up."},{"name":"可贷资金均衡","f":"S(r) = I(r) + 政府借款","note":"挤出量 = 私人投资的减少量。","name_en":"Loanable funds equilibrium","note_en":"Amount crowded out = the fall in private investment.","f_en":"S(r) = I(r) + government borrowing"}],"sections":[{"h":"中央银行的工具箱","body":"**扩张性政策**（应对衰退）：降低政策利率目标、在公开市场买入债券、降低准备金利率 (IORB)、降低贴现率、（部分国家）降低法定准备金率。**紧缩性政策**相反。\n**充足准备金框架 (ample reserves)**：2008年后美联储资产负债表大幅扩张，银行准备金充裕，联邦基金利率由“管理利率” (administered rates) 决定：IORB 形成利率下限附近的锚，银行不会以低于 IORB 的利率把钱借出。因此美联储提高 IORB 是加息的最直接手段，而不再依赖小规模公开市场操作使准备金“变稀缺”。\n传导机制：政策利率 ↓ → 借贷成本 ↓ → 投资与耐用品消费 ↑、本币贬值 → AD 右移。","h_en":"The central bank's toolkit","body_en":"**Expansionary policy** (to fight a recession): lower the policy rate target, buy bonds in the open market, lower the interest rate on reserve balances (IORB), lower the discount rate, and (in some countries) lower the required reserve ratio. **Contractionary policy** is the opposite.\n**Ample-reserves framework**: after 2008 the Federal Reserve's balance sheet expanded dramatically and bank reserves became plentiful, so the federal funds rate is determined by \"administered rates\": IORB acts as an anchor near the floor of rates, because banks will not lend money out at a rate below IORB. Raising IORB is therefore the most direct way for the Fed to raise rates, rather than relying on small open market operations to make reserves \"scarce\".\nTransmission mechanism: policy rate ↓ → borrowing costs ↓ → investment and durable-goods consumption ↑, domestic currency depreciates → AD shifts right."},{"h":"可贷资金市场与费雪方程","body":"**例题**：可贷资金供给 Qs = 100 + 20r，私人需求 Qd = 300 − 30r（r 为百分比）。均衡 r = 4%，Q = 180。政府新增赤字 50：总需求 Qd = 350 − 30r，新均衡 r = 5%，Q = 200；私人投资 = 300 − 30 × 5 = 150，**被挤出 30**。\n（AP 把赤字画成需求右移；部分教材把它画成国民储蓄/供给左移，两种画法都得出实际利率上升。）\n**费雪方程**：名义利率 7%、预期通胀 3%，则预期实际利率 ≈ 4%。若实际通胀高于预期，事后实际利率下降，**借款人受益、贷款人受损**。","h_en":"The loanable funds market and the Fisher equation","body_en":"**Worked example**: Supply of loanable funds Qs = 100 + 20r, private demand Qd = 300 − 30r (r in percent). Equilibrium r = 4%, Q = 180. The government runs a new deficit of 50: total demand Qd = 350 − 30r, new equilibrium r = 5%, Q = 200; private investment = 300 − 30 × 5 = 150, so **30 is crowded out**.\n(AP draws the deficit as a rightward shift of demand; some textbooks draw it as a leftward shift of national saving/supply. Both approaches show a rise in the real interest rate.)\n**Fisher equation**: with a nominal interest rate of 7% and expected inflation of 3%, the expected real interest rate ≈ 4%. If actual inflation turns out higher than expected, the ex post real interest rate falls, so **borrowers gain and lenders lose**."},{"h":"菲利普斯曲线与预期","body":"- AD 增加 → 沿 SRPC **向左上**移动（失业↓、通胀↑）；AD 减少 → 沿 SRPC 向右下。\n- 负面供给冲击 → SRPC **上移**（通胀和失业同时上升）。\n- 通胀预期上升 → SRPC 上移。\n**例题**：π = π^e − 0.5(u − 5)，π^e = 3%。若政策把失业压到4%，短期 π = 3% + 0.5 = 3.5%。若下一年预期按上年通胀调整 (adaptive expectations) 为 3.5%，要继续维持 u = 4% 需要 π = 4%——通胀会不断加速 (accelerationist)。长期中只能在自然失业率上稳定，LRPC 垂直。","h_en":"The Phillips curve and expectations","body_en":"- An increase in AD → movement **up and to the left** along the SRPC (unemployment↓, inflation↑); a decrease in AD → movement down and to the right along the SRPC.\n- A negative supply shock → the SRPC **shifts up** (inflation and unemployment both rise).\n- Higher inflation expectations → the SRPC shifts up.\n**Worked example**: π = π^e − 0.5(u − 5), π^e = 3%. If policy pushes unemployment down to 4%, short-run π = 3% + 0.5 = 3.5%. If next year expectations adjust to last year's inflation (adaptive expectations) and become 3.5%, keeping u = 4% requires π = 4% — inflation keeps accelerating (accelerationist). In the long run the economy can only be stable at the natural rate of unemployment; the LRPC is vertical."},{"h":"政策组合与局限","body":"- **紧财政 + 松货币**：赤字减少、利率下降，投资占GDP比重上升，有利于长期增长，而AD可大致不变。\n- **松财政 + 紧货币**：利率大幅上升，挤出投资，本币升值，净出口下降。\n- 货币政策的局限：零利率下限 (zero lower bound) 时降息空间有限，需依靠量化宽松 (QE) 或前瞻指引；政策也有时滞（外部时滞较长）。\n- 可信度：央行独立性与通胀目标制 (inflation targeting) 有助于锚定预期，降低反通胀的失业代价。","h_en":"Policy mix and limitations","body_en":"- **Tight fiscal + loose monetary**: the deficit falls, interest rates fall and investment's share of GDP rises, which is good for long-run growth, while AD can stay roughly unchanged.\n- **Loose fiscal + tight monetary**: interest rates rise sharply, investment is crowded out, the domestic currency appreciates and net exports fall.\n- Limitations of monetary policy: at the zero lower bound there is little room to cut rates, so the central bank must rely on quantitative easing (QE) or forward guidance; policy also works with lags (the outside lag is long).\n- Credibility: central bank independence and inflation targeting help anchor expectations and reduce the unemployment cost of disinflation."}],"pitfalls":["认为在充足准备金框架下美联储主要靠调整法定准备金率或小规模公开市场操作来改变利率。","把公开市场“买入债券”与“卖出债券”的方向搞反：买入 = 注入准备金 = 扩张性。","混淆沿SRPC移动（AD变化）与SRPC移动（供给冲击、预期变化）。","以为长期可以用更高的通胀换取更低的失业率。","费雪方程中忘记区分预期通胀与实际通胀：意外通胀使债务人受益。"],"exams":{"AP":"Macro Unit 4 (4.2, 4.6–4.7); Unit 5 (5.1–5.2)","IB":"3.5","AL":"9708 AS 5.2; A2 10.1–10.2","IEO":"Monetary policy, interest rates & inflation expectations","NEC":"Macro: monetary policy & Phillips curve"},"diagram":"phillips","summary_en":"The central bank stabilises inflation and employment by adjusting interest rates and monetary conditions. This lesson covers the policy tools of the modern \"ample reserves\" framework, the loanable funds market and the Fisher equation, and uses the short-run and long-run Phillips curves to explain why demand-side policy can trade off inflation against unemployment only in the short run, and why expectations are so important.","pitfalls_en":["Believing that under the ample-reserves framework the Fed changes interest rates mainly by adjusting the required reserve ratio or through small open market operations.","Getting the direction of open market \"bond purchases\" and \"bond sales\" backwards: buying = injecting reserves = expansionary.","Confusing a movement along the SRPC (a change in AD) with a shift of the SRPC (a supply shock or a change in expectations).","Thinking that in the long run higher inflation can buy lower unemployment.","Forgetting to distinguish expected from actual inflation in the Fisher equation: unexpected inflation benefits debtors."]},{"id":"M6","unit":"macro","title_zh":"经济增长","title_en":"Economic Growth","level":"G9+","summary":"长期生活水平取决于人均实际GDP的增长。本课分析增长的来源（物质资本、人力资本、技术与制度）、生产函数与增长核算，用“70法则”感受复利的力量，并以索洛模型的直觉解释追赶效应和可持续增长。","concepts":[{"zh":"经济增长","en":"Economic growth","def":"潜在产出（或人均实际GDP）的持续增加，图形上表现为 LRAS 右移或生产可能性曲线 (PPC) 外移。","def_en":"A sustained increase in potential output (or real GDP per capita), shown graphically as a rightward shift of LRAS or an outward shift of the production possibilities curve (PPC)."},{"zh":"物质资本","en":"Physical capital","def":"用于生产的机器、厂房、基础设施等，由投资积累而来。","def_en":"Machines, factories, infrastructure and other goods used in production, accumulated through investment."},{"zh":"人力资本","en":"Human capital","def":"劳动者通过教育、培训、健康和经验获得的知识与技能。","def_en":"The knowledge and skills that workers acquire through education, training, health and experience."},{"zh":"技术进步","en":"Technological progress","def":"用同样投入生产更多产出的知识改进，是长期人均增长的根本源泉，即全要素生产率 (TFP) 的增长。","def_en":"Improvements in knowledge that allow more output to be produced from the same inputs; the fundamental source of long-run per-capita growth, i.e. growth in total factor productivity (TFP)."},{"zh":"制度","en":"Institutions","def":"产权保护、法治、合同执行、低腐败、稳定的政治环境等“游戏规则”，决定人们是否愿意投资和创新。","def_en":"The \"rules of the game\" — protection of property rights, the rule of law, contract enforcement, low corruption, a stable political environment — that determine whether people are willing to invest and innovate."},{"zh":"劳动生产率","en":"Labor productivity","def":"每小时（或每个工人）的产出，是人均收入的直接决定因素。","def_en":"Output per hour (or per worker); the direct determinant of income per capita."},{"zh":"边际收益递减","en":"Diminishing returns to capital","def":"在其他投入不变时，每增加一单位资本带来的产出增量递减。","def_en":"Holding other inputs constant, each additional unit of capital adds less and less to output."},{"zh":"追赶效应/趋同","en":"Catch-up effect / convergence","def":"资本较少的穷国资本边际产出更高，在其他条件相同时增长更快，逐步接近富国。条件趋同要求制度、储蓄率等相似。","def_en":"Poor countries with less capital have a higher marginal product of capital, so other things equal they grow faster and gradually approach rich countries. Conditional convergence requires similar institutions, saving rates and so on."},{"zh":"稳态","en":"Steady state (Solow model)","def":"投资恰好弥补折旧（和人口增长稀释）时，人均资本和人均产出不再变化；持续的人均增长只能来自技术进步。","def_en":"When investment just covers depreciation (and dilution from population growth), capital per worker and output per worker stop changing; sustained per-capita growth can come only from technological progress."},{"zh":"可持续发展","en":"Sustainable growth","def":"满足当代需要而不损害后代满足其需要的能力；要考虑自然资本 (natural capital) 的耗减和环境外部性。","def_en":"Meeting the needs of the present without compromising the ability of future generations to meet their own needs; it requires taking account of the depletion of natural capital and environmental externalities."}],"formulas":[{"name":"70法则","f":"翻倍年数 ≈ 70 ÷ 年增长率(%)","note":"来自 ln2 ≈ 0.693；增长率越低近似越准。","name_en":"Rule of 70","note_en":"Derived from ln2 ≈ 0.693; the lower the growth rate, the more accurate the approximation.","f_en":"Years to double ≈ 70 ÷ annual growth rate (%)"},{"name":"劳动生产率","f":"Productivity = 实际产出 ÷ 劳动小时","note":"生产率增长率 ≈ 产出增长率 − 工时增长率。","name_en":"Labor productivity","note_en":"Productivity growth ≈ output growth − growth in hours worked.","f_en":"Productivity = real output ÷ labour hours"},{"name":"柯布-道格拉斯生产函数","f":"Y = A × K^α × L^(1−α)","note":"常用 α ≈ 0.3。","name_en":"Cobb–Douglas production function","note_en":"α ≈ 0.3 is commonly used."},{"name":"增长核算","f":"g_Y = g_A + α·g_K + (1−α)·g_L","note":"g_A 为全要素生产率 (TFP) 增长。","name_en":"Growth accounting","note_en":"g_A is total factor productivity (TFP) growth."},{"name":"人均增长","f":"g(Y/L) ≈ g_Y − g_L","note":"","name_en":"Per-capita growth","note_en":""}],"sections":[{"h":"增长的来源","body":"人均产出 = 生产率，而生产率取决于：\n- **物质资本/工人**：更多更好的机器和基础设施。\n- **人力资本**：教育与培训使工人更高效。\n- **自然资源**：有帮助但并非必要（日本、新加坡资源匮乏却很富裕，“资源诅咒” resource curse 也值得注意）。\n- **技术**：新知识、新工艺；研发 (R&D) 与知识溢出。\n- **制度**：产权与法治保证投资者能获得回报，是深层原因（Acemoglu & Robinson 的包容性制度 inclusive institutions 观点）。\n政策：鼓励储蓄与投资、教育投入、研发补贴与专利保护、开放贸易、改善营商环境。","h_en":"Sources of growth","body_en":"Output per person = productivity, and productivity depends on:\n- **Physical capital per worker**: more and better machines and infrastructure.\n- **Human capital**: education and training make workers more productive.\n- **Natural resources**: helpful but not essential (Japan and Singapore have few resources yet are very rich; the \"resource curse\" is also worth noting).\n- **Technology**: new knowledge and new processes; research and development (R&D) and knowledge spillovers.\n- **Institutions**: property rights and the rule of law ensure that investors can earn a return; this is the deeper cause (Acemoglu & Robinson's argument about inclusive institutions).\nPolicies: encourage saving and investment, invest in education, subsidise R&D and protect patents, open up to trade, and improve the business environment."},{"h":"复利的力量：70法则","body":"**例题**：A国人均GDP 4,000 美元、增长 7%；B国 16,000 美元、增长 1.75%。\n- A 每 70 ÷ 7 = 10 年翻倍，20年后约 16,000（精确 4,000 × 1.07²⁰ ≈ 15,479）。\n- B 每 40 年翻倍，20年后约 16,000 × √2 ≈ 22,600。\n虽然A的水平达到了B今天的水平，但B也在增长，差距的完全消除需要更久。增长率1–2个百分点的差异，长期会带来巨大的生活水平差别。","h_en":"The power of compounding: the rule of 70","body_en":"**Worked example**: Country A has GDP per capita of $4,000 growing at 7%; Country B has $16,000 growing at 1.75%.\n- A doubles every 70 ÷ 7 = 10 years, reaching about 16,000 after 20 years (exactly 4,000 × 1.07²⁰ ≈ 15,479).\n- B doubles every 40 years, reaching about 16,000 × √2 ≈ 22,600 after 20 years.\nAlthough A reaches B's current level, B is also growing, so closing the gap completely takes much longer. A difference of 1–2 percentage points in growth rates leads to enormous differences in living standards over the long run."},{"h":"生产函数与增长核算","body":"设 Y = A·K^0.3·L^0.7。若资本增长4%、劳动增长1%、TFP 增长1.5%，则\ng_Y = 1.5% + 0.3 × 4% + 0.7 × 1% = **3.4%**，人均增长 ≈ 3.4% − 1% = 2.4%。\n**生产率计算**：40 名工人每人工作8小时（320小时）生产1,200件，生产率 3.75件/小时；次年330小时生产1,320件，生产率 4.0，增长约 **6.7%**。","h_en":"The production function and growth accounting","body_en":"Let Y = A·K^0.3·L^0.7. If capital grows by 4%, labor by 1% and TFP by 1.5%, then\ng_Y = 1.5% + 0.3 × 4% + 0.7 × 1% = **3.4%**, and per-capita growth ≈ 3.4% − 1% = 2.4%.\n**Productivity calculation**: 40 workers each working 8 hours (320 hours) produce 1,200 units, so productivity is 3.75 units/hour; the next year 330 hours produce 1,320 units, productivity 4.0, an increase of about **6.7%**."},{"h":"索洛模型直觉与追赶","body":"由于资本边际收益递减，单靠不断增加资本不能带来持续的人均增长：\n- 提高储蓄率会使经济进入更高的稳态**水平**，过渡期增长加快，但长期人均增长率回到由技术进步决定的水平。\n- 资本少的国家边际产出高，增长快——**追赶效应**，解释了二战后日本、韩国及中国的高速增长；但若制度薄弱，穷国未必趋同（条件趋同）。\n**可持续性**：若增长依赖耗竭不可再生资源或造成严重污染，GDP会高估真实福利；“绿色GDP”、真实储蓄 (genuine savings) 等指标会扣除自然资本损耗。","h_en":"Solow model intuition and catch-up","body_en":"Because of diminishing marginal returns to capital, simply adding more and more capital cannot deliver sustained per-capita growth:\n- Raising the saving rate moves the economy to a higher steady-state **level**, with faster growth during the transition, but in the long run the per-capita growth rate returns to the rate determined by technological progress.\n- Countries with little capital have a high marginal product and grow fast — the **catch-up effect**, which explains the rapid post-war growth of Japan, South Korea and China; but where institutions are weak, poor countries do not necessarily converge (conditional convergence).\n**Sustainability**: if growth relies on depleting non-renewable resources or causes serious pollution, GDP overstates true welfare; measures such as \"green GDP\" and genuine savings deduct the depletion of natural capital."}],"pitfalls":["把短期AD扩张（产出缺口缩小）当作长期经济增长（潜在产出增加）。","用单利思维计算长期增长，如 4,000 × (1 + 0.07 × 20)，严重低估复利效果。","认为提高储蓄率能永久提高人均增长率——在索洛模型中它只提高稳态水平。","忘记人均增长 = 总产出增长 − 人口增长。","认为自然资源丰富是增长的必要条件，忽视制度与人力资本。"],"exams":{"AP":"Macro Unit 5 (5.6)","IB":"3.3 (growth); 4.7–4.10 (development)","AL":"9708 AS 4.4; A2 9.3","IEO":"Economic growth, productivity & institutions","NEC":"Macro: economic growth"},"diagram":"lras","summary_en":"Long-run living standards depend on the growth of real GDP per capita. This lesson analyses the sources of growth (physical capital, human capital, technology and institutions), the production function and growth accounting, uses the \"rule of 70\" to show the power of compounding, and draws on the intuition of the Solow model to explain the catch-up effect and sustainable growth.","pitfalls_en":["Treating a short-run expansion of AD (a narrowing output gap) as long-run economic growth (an increase in potential output).","Calculating long-run growth with simple interest, e.g. 4,000 × (1 + 0.07 × 20), which seriously underestimates the effect of compounding.","Believing that a higher saving rate permanently raises the per-capita growth rate — in the Solow model it only raises the steady-state level.","Forgetting that per-capita growth = growth in total output − population growth.","Believing abundant natural resources are a necessary condition for growth, while overlooking institutions and human capital."]},{"id":"M7","unit":"macro","title_zh":"国际经济","title_en":"International Economics","level":"G10+","summary":"开放经济中，一国通过贸易和资本流动与世界相连。本课讲解国际收支平衡表、外汇市场与汇率决定（利率、通胀、购买力平价）、固定与浮动汇率制度，以及关税、配额的福利分析与贸易政策、全球化和发展问题。","concepts":[{"zh":"国际收支平衡表","en":"Balance of payments (BoP)","def":"记录一国居民与外国之间所有经济交易的账户，由经常账户、资本账户和金融账户组成，总和（含误差与遗漏）为零。","def_en":"The accounts that record all economic transactions between a country's residents and the rest of the world, made up of the current account, the capital account and the financial account; in total (including errors and omissions) they sum to zero."},{"zh":"经常账户","en":"Current account","def":"货物和服务贸易差额 + 初次收入（投资收益、工资）+ 二次收入（汇款、援助等经常转移）。","def_en":"The balance of trade in goods and services + primary income (investment income, wages) + secondary income (current transfers such as remittances and aid)."},{"zh":"资本与金融账户","en":"Capital & financial account","def":"记录资产所有权的跨境买卖：直接投资 (FDI)、证券投资、其他投资及官方储备资产变化；资本账户记录资本转移等少量项目。","def_en":"Records cross-border purchases and sales of asset ownership: direct investment (FDI), portfolio investment, other investment and changes in official reserve assets; the capital account records a few small items such as capital transfers."},{"zh":"升值与贬值","en":"Appreciation vs depreciation","def":"本币能换到更多外币即升值（浮动汇率下）；在固定汇率下，官方调整分别称为升值重估 (revaluation) 和贬值 (devaluation)。","def_en":"If the domestic currency buys more foreign currency, it has appreciated (under a floating exchange rate); under a fixed exchange rate, official adjustments are called revaluation and devaluation respectively."},{"zh":"外汇需求与供给","en":"Demand for & supply of a currency","def":"对某货币的需求来自外国人购买该国出口品和资产；供给来自本国居民购买进口品和外国资产。","def_en":"Demand for a currency comes from foreigners buying the country's exports and assets; supply comes from domestic residents buying imports and foreign assets."},{"zh":"购买力平价","en":"Purchasing power parity (PPP)","def":"长期中汇率应调整到使同一篮子商品在各国价格相同；相对PPP：高通胀国家货币趋于贬值。","def_en":"In the long run the exchange rate should adjust so that the same basket of goods costs the same in every country; relative PPP: the currencies of high-inflation countries tend to depreciate."},{"zh":"固定与浮动汇率","en":"Fixed vs floating exchange rates","def":"浮动汇率由市场供求决定；固定汇率由央行通过买卖外汇储备维持在目标水平。","def_en":"A floating exchange rate is determined by market supply and demand; a fixed exchange rate is held at a target level by the central bank buying and selling foreign exchange reserves."},{"zh":"关税","en":"Tariff","def":"对进口商品征税，提高国内价格、增加国内生产、减少进口，产生政府收入和无谓损失。","def_en":"A tax on imported goods; it raises the domestic price, increases domestic production, reduces imports, and generates government revenue and a deadweight loss."},{"zh":"进口配额","en":"Import quota","def":"对进口数量的直接限制；价格效应可与关税相同，但“配额租金” (quota rents) 归许可证持有人（常是外国出口商）而非政府。","def_en":"A direct limit on the quantity of imports; its price effect can be the same as a tariff's, but the \"quota rents\" go to licence holders (often foreign exporters) rather than the government."},{"zh":"全球化与发展","en":"Globalization & development","def":"商品、资本、人员与技术跨境流动加深，带来专业化和技术扩散的收益，也带来分配效应和外部冲击风险。","def_en":"Deeper cross-border flows of goods, capital, people and technology, bringing gains from specialisation and the spread of technology, but also distributional effects and the risk of external shocks."}],"formulas":[{"name":"国际收支恒等式","f":"经常账户 + 资本账户 + 金融账户 + 误差与遗漏 = 0","note":"经常账户赤字对应资本/金融账户的净流入。","name_en":"Balance of payments identity","note_en":"A current account deficit is matched by a net inflow on the capital/financial account.","f_en":"Current account + capital account + financial account + errors & omissions = 0"},{"name":"汇率换算","f":"外币价格 × 汇率(本币/外币) = 本币价格","note":"例：$50 × 7.2 ¥/$ = ¥360。","name_en":"Exchange rate conversion","note_en":"Example: $50 × 7.2 ¥/$ = ¥360.","f_en":"Foreign price × exchange rate (home/foreign) = home-currency price"},{"name":"绝对PPP","f":"E_PPP = P_本国 ÷ P_外国","note":"实际汇率高于 E_PPP（每外币换更多本币）说明本币被低估。","name_en":"Absolute PPP","note_en":"If the actual exchange rate is above E_PPP (each unit of foreign currency buys more domestic currency), the domestic currency is undervalued.","f_en":"E_PPP = P_home ÷ P_foreign"},{"name":"相对PPP","f":"%ΔE ≈ π_本国 − π_外国","note":"E 以本币/外币表示。","name_en":"Relative PPP","note_en":"E is expressed as domestic currency per unit of foreign currency.","f_en":"%ΔE ≈ π_home − π_foreign"},{"name":"关税收入与无谓损失","f":"收入 = t × 关税后进口量；DWL = ½·t·ΔQs + ½·t·ΔQd","note":"两个三角形分别是生产扭曲和消费扭曲。","name_en":"Tariff revenue and deadweight loss","note_en":"The two triangles are the production distortion and the consumption distortion respectively.","f_en":"Revenue = t × imports after tariff; DWL = ½·t·ΔQs + ½·t·ΔQd"}],"sections":[{"h":"国际收支平衡表","body":"- **经常账户**：出口、进口、海外投资收益、侨汇。\n- **金融账户**：外国人买本国工厂、股票、国债（资本流入）；本国人买外国资产（资本流出）；央行外汇储备变化。\n经常账户赤字意味着该国消费和投资超过其收入，需要向外国借款或出售资产来融资，因此金融（及资本）账户出现等额的**净流入**。\n**例题**：货物出口500、进口620，服务净额 +30，初次收入 −20，二次收入 +10，则经常账户 = −100，资本与金融账户（含储备）需净流入约 100。","h_en":"The balance of payments","body_en":"- **Current account**: exports, imports, income on overseas investment, remittances.\n- **Financial account**: foreigners buying domestic factories, shares and government bonds (capital inflows); residents buying foreign assets (capital outflows); changes in the central bank's foreign exchange reserves.\nA current account deficit means the country's consumption and investment exceed its income, so it must borrow from abroad or sell assets to finance the gap; the financial (and capital) account therefore shows an equal **net inflow**.\n**Worked example**: goods exports 500, goods imports 620, net services +30, primary income −20, secondary income +10, so the current account = −100, and the capital and financial account (including reserves) must show a net inflow of about 100."},{"h":"外汇市场与汇率决定","body":"以美元/人民币为例：\n- **美国利率相对上升** → 外国投资者需要美元购买美国资产 → 美元需求增加 → 美元升值。\n- **本国通胀相对更高** → 本国商品变贵、出口减少 → 对本币需求减少、本币供给增加 → 本币贬值（相对PPP）。\n- **外国收入上升**、对本国商品偏好增加 → 本币需求增加 → 升值。\n- **投机预期**也会自我实现。\n汇率换算：若汇率从 7.2 ¥/$ 变为 6.8 ¥/$，人民币升值，一本 50 美元的书从 ¥360 降至 ¥340。\n**PPP例题**：巨无霸在中国卖 ¥24，在美国卖 $5，PPP 汇率 = 24 ÷ 5 = 4.8 ¥/$；若市场汇率为 7.2，人民币按PPP被**低估**约 33%。","h_en":"The foreign exchange market and exchange rate determination","body_en":"Taking the US dollar/renminbi as an example:\n- **US interest rates rise relative to others** → foreign investors need dollars to buy US assets → demand for dollars rises → the dollar appreciates.\n- **Domestic inflation is relatively higher** → domestic goods become more expensive and exports fall → demand for the domestic currency falls and its supply rises → the domestic currency depreciates (relative PPP).\n- **Higher foreign incomes** or a stronger preference for domestic goods → demand for the domestic currency rises → it appreciates.\n- **Speculative expectations** can also be self-fulfilling.\nExchange rate conversion: if the rate moves from 7.2 ¥/$ to 6.8 ¥/$, the renminbi has appreciated, and a $50 book falls from ¥360 to ¥340.\n**PPP worked example**: a Big Mac sells for ¥24 in China and $5 in the US, so the PPP exchange rate = 24 ÷ 5 = 4.8 ¥/$; if the market rate is 7.2, the renminbi is **undervalued** by about 33% relative to PPP."},{"h":"固定与浮动汇率","body":"- **浮动汇率**：自动调节国际收支，货币政策独立，但汇率波动带来不确定性。\n- **固定汇率**：降低贸易不确定性、约束通胀，但需要外汇储备。若本币面临贬值压力，央行须**卖出外汇储备、买入本币**以维持汇率。\n**不可能三角 (impossible trinity)**：固定汇率、资本自由流动、独立货币政策三者不能同时实现。","h_en":"Fixed and floating exchange rates","body_en":"- **Floating exchange rates**: adjust the balance of payments automatically and allow an independent monetary policy, but exchange rate volatility creates uncertainty.\n- **Fixed exchange rates**: reduce uncertainty for trade and discipline inflation, but require foreign exchange reserves. If the domestic currency faces downward pressure, the central bank must **sell foreign exchange reserves and buy the domestic currency** to maintain the rate.\n**Impossible trinity**: a fixed exchange rate, free capital mobility and an independent monetary policy cannot all be achieved at the same time."},{"h":"关税与配额的福利分析","body":"**例题**：国内需求 Qd = 100 − P，供给 Qs = P − 20，世界价格 40（小国，价格接受者）。\n- 自由贸易：Qd = 60，Qs = 20，进口 40。\n- 征收每单位 10 的关税：国内价格 50，Qd = 50，Qs = 30，进口 20。\n- 关税收入 = 10 × 20 = **200**；无谓损失 (DWL) = ½ × 10 × 10 + ½ × 10 × 10 = **100**（生产扭曲 + 消费扭曲）。\n- 消费者剩余损失 = 10 × (60 + 50) ÷ 2 = 550 = 生产者剩余增加 250 + 政府收入 200 + DWL 100。\n进口配额 20 单位会产生同样的价格和DWL，但 200 的“配额租金”可能落入外国出口商手中，使本国福利损失更大。自愿出口限制 (VER) 同理。","h_en":"Welfare analysis of tariffs and quotas","body_en":"**Worked example**: domestic demand Qd = 100 − P, supply Qs = P − 20, world price 40 (a small country that is a price taker).\n- Free trade: Qd = 60, Qs = 20, imports 40.\n- A tariff of 10 per unit: domestic price 50, Qd = 50, Qs = 30, imports 20.\n- Tariff revenue = 10 × 20 = **200**; deadweight loss (DWL) = ½ × 10 × 10 + ½ × 10 × 10 = **100** (production distortion + consumption distortion).\n- Loss of consumer surplus = 10 × (60 + 50) ÷ 2 = 550 = gain in producer surplus 250 + government revenue 200 + DWL 100.\nAn import quota of 20 units would produce the same price and DWL, but the 200 of \"quota rents\" may go to foreign exporters, making the domestic welfare loss larger. The same applies to voluntary export restraints (VERs)."},{"h":"贸易政策、全球化与发展","body":"保护主义的理由：保护幼稚产业 (infant industry)、国家安全、反倾销、保护就业、改善贸易条件（大国最优关税）。反对理由：DWL、报复与贸易战、低效率企业得到保护、消费者负担更高价格。\n全球化带来比较优势分工、规模经济、技术扩散和外国直接投资 (FDI)，但也可能加剧国内收入不平等、带来资本流动的“急停” (sudden stop) 风险。\n发展中国家面临的障碍：初级产品依赖与价格波动、人力资本不足、制度薄弱、债务负担；发展策略包括出口导向、外资引进、教育投资、小额信贷和改善治理。","h_en":"Trade policy, globalization and development","body_en":"Arguments for protectionism: protecting infant industries, national security, anti-dumping, protecting jobs, and improving the terms of trade (the optimal tariff for a large country). Arguments against: DWL, retaliation and trade wars, protection of inefficient firms, and higher prices for consumers.\nGlobalization brings specialisation according to comparative advantage, economies of scale, the spread of technology and foreign direct investment (FDI), but it may also widen domestic income inequality and create the risk of a \"sudden stop\" in capital flows.\nObstacles facing developing countries: dependence on primary commodities and volatile prices, insufficient human capital, weak institutions and debt burdens; development strategies include export orientation, attracting foreign investment, investing in education, microfinance and improving governance."}],"pitfalls":["把外国直接投资、购买外国债券等资产交易计入经常账户；或把侨汇、投资收益计入金融账户。","汇率报价方向弄反：¥/$ 数值下降代表人民币升值。","认为本国利率上升会使本币贬值——实际上吸引资本流入，本币升值。","计算关税收入时用自由贸易时的进口量而不是关税后的进口量。","以为配额和关税在福利上完全等价，忽略了配额租金的归属。"],"exams":{"AP":"Macro Unit 6 (6.1–6.6)","IB":"4.1–4.6 (trade & exchange rates); 4.7–4.10 (development)","AL":"9708 AS 6.1–6.5; A2 11.1–11.6","IEO":"Open economy: trade, exchange rates & BoP","NEC":"International economics"},"diagram":"fx","summary_en":"In an open economy, a country is linked to the rest of the world through trade and capital flows. This lesson covers the balance of payments, the foreign exchange market and the determination of exchange rates (interest rates, inflation, purchasing power parity), fixed and floating exchange rate systems, the welfare analysis of tariffs and quotas, and issues of trade policy, globalization and development.","pitfalls_en":["Recording asset transactions such as foreign direct investment or purchases of foreign bonds in the current account, or recording remittances and investment income in the financial account.","Reading the exchange rate quote the wrong way round: a fall in the ¥/$ figure means the renminbi has appreciated.","Believing that a rise in domestic interest rates makes the domestic currency depreciate — in fact it attracts capital inflows and the domestic currency appreciates.","Using the free-trade import volume instead of the post-tariff import volume when calculating tariff revenue.","Thinking quotas and tariffs are completely equivalent in welfare terms, ignoring who receives the quota rents."]},{"id":"M8","unit":"macro","title_zh":"宏观政策综合：供给侧政策与政策冲突","title_en":"Macro Policy in Practice: Supply-side Policies & Trade-offs","level":"G11+","summary":"政府同时追求经济增长、低通胀、低失业、国际收支平衡与可持续发展，但这些目标在短期内常常相互冲突。本课比较凯恩斯学派与古典/货币学派对政策作用的看法，系统讲解供给侧政策、加速数原理、政策时滞与政策组合，并用支出转换/支出减少政策、马歇尔–勒纳条件和 J 曲线分析经常账户失衡的矫正。","summary_en":"Governments pursue economic growth, low inflation, low unemployment, a balanced balance of payments and sustainability at the same time, but these objectives often conflict in the short run. This lesson compares Keynesian and classical/monetarist views of the role of policy, explains supply-side policies, the accelerator, policy lags and the policy mix, and analyses how current-account imbalances are corrected using expenditure-switching/expenditure-reducing policies, the Marshall–Lerner condition and the J-curve.","concepts":[{"zh":"宏观政策目标冲突","en":"Conflicts between macro objectives","def":"短期内实现一个目标可能损害另一个，例如扩张需求降低失业却推高通胀，高增长可能扩大经常账户赤字或损害环境。","def_en":"In the short run achieving one objective may damage another; e.g. expanding demand lowers unemployment but raises inflation, and rapid growth may widen the current-account deficit or harm the environment."},{"zh":"市场导向型供给侧政策","en":"Market-based supply-side policies","def":"通过减少政府干预、增强激励来提高长期总供给 (LRAS)，如降低所得税与公司税、放松管制、私有化、削弱工会权力、改革福利。","def_en":"Policies that raise long-run aggregate supply (LRAS) by reducing government intervention and strengthening incentives, e.g. cutting income and corporate taxes, deregulation, privatisation, reducing trade-union power, welfare reform."},{"zh":"干预型供给侧政策","en":"Interventionist supply-side policies","def":"由政府直接投资来提高生产能力，如教育培训、医疗、基础设施、研发补贴与产业政策。","def_en":"Policies in which government invests directly to raise productive capacity, e.g. education and training, healthcare, infrastructure, R&D subsidies and industrial policy."},{"zh":"凯恩斯学派与古典学派","en":"Keynesian vs classical/monetarist views","def":"凯恩斯学派认为 AS 在低产出时接近水平、工资粘性使经济可能长期陷于衰退，需要需求管理；古典/货币学派认为 LRAS 垂直于潜在产出、经济会自我调整，需求政策长期只影响价格。","def_en":"Keynesians argue AS is nearly horizontal at low output and sticky wages can keep the economy in recession for a long time, so demand management is needed; classical/monetarist economists argue LRAS is vertical at potential output and the economy self-corrects, so demand policy only affects prices in the long run."},{"zh":"加速数原理","en":"Accelerator principle","def":"净投资取决于产出的变化量而非产出水平：I_net = v × ΔY，v 为资本–产出比。产出增速放缓就会使投资绝对下降。","def_en":"Net investment depends on the change in output rather than its level: I_net = v × ΔY, where v is the capital–output ratio. A mere slowdown in output growth causes investment to fall in absolute terms."},{"zh":"货币数量论与流动性偏好","en":"Quantity theory vs liquidity preference","def":"货币数量论 MV = PY 假设 V 和 Y 稳定，货币增长主要导致通胀；凯恩斯流动性偏好理论认为货币需求对利率敏感，V 不稳定，在流动性陷阱中货币政策几乎无效。","def_en":"The quantity theory MV = PY assumes V and Y are stable, so money growth mainly causes inflation; Keynes's liquidity preference theory holds that money demand is interest-sensitive and V is unstable, so monetary policy is nearly ineffective in a liquidity trap."},{"zh":"政策时滞","en":"Policy lags","def":"包括识别时滞、决策/执行时滞和影响时滞；时滞过长时逆周期政策可能在错误的时点生效，变成顺周期。","def_en":"These include recognition lags, decision/implementation lags and impact lags; if lags are long, counter-cyclical policy may take effect at the wrong time and become pro-cyclical."},{"zh":"支出转换与支出减少政策","en":"Expenditure-switching vs expenditure-reducing policies","def":"支出转换政策（贬值、关税、配额）使支出从进口品转向国产品；支出减少政策（紧缩财政、货币政策）通过降低国民收入来减少进口。","def_en":"Expenditure-switching policies (depreciation, tariffs, quotas) switch spending from imports to domestic goods; expenditure-reducing policies (contractionary fiscal and monetary policy) cut imports by lowering national income."},{"zh":"马歇尔–勒纳条件","en":"Marshall–Lerner condition","def":"在贸易初始平衡时，若出口与进口需求价格弹性绝对值之和大于 1（|PEDx| + |PEDm| > 1），本币贬值会改善经常账户。","def_en":"Starting from balanced trade, a depreciation improves the current account if the sum of the absolute price elasticities of demand for exports and imports exceeds 1 (|PEDx| + |PEDm| > 1)."},{"zh":"J 曲线效应","en":"J-curve effect","def":"短期内贸易量对价格变化反应迟缓（合同、习惯），弹性之和小于 1，贬值后贸易差额先恶化，随后随弹性增大而改善。","def_en":"In the short run trade volumes respond slowly to price changes (contracts, habits), so the elasticity sum is below 1; after a depreciation the trade balance first worsens and then improves as elasticities rise."}],"formulas":[{"name":"加速数","f":"I_net = v × ΔY","note":"v = 资本–产出比 (K ÷ Y)。","name_en":"Accelerator","note_en":"v = capital–output ratio (K ÷ Y)."},{"name":"交易方程","f":"M × V = P × Y  ⇒  %ΔP ≈ %ΔM + %ΔV − %ΔY","note":"","name_en":"Equation of exchange","note_en":""},{"name":"马歇尔–勒纳条件","f":"|PEDx| + |PEDm| > 1","note":"严格成立的前提是初始贸易平衡、供给弹性无限大。","name_en":"Marshall–Lerner condition","note_en":"Holds exactly when trade is initially balanced and supply elasticities are infinite."},{"name":"开放经济乘数","f":"k = 1 ÷ (MPS + MPT + MPM)","note":"","name_en":"Open-economy multiplier","note_en":""},{"name":"收入变化引起的进口变化","f":"ΔM = MPM × ΔY","note":"支出减少政策正是通过这一渠道减少进口。","name_en":"Change in imports from income","note_en":"Expenditure-reducing policy works through exactly this channel."}],"sections":[{"h":"宏观目标及其冲突","body":"政府的主要宏观目标：**经济增长、低而稳定的通胀、低失业、经常账户平衡**，以及收入公平与环境可持续。短期中常见的冲突：\n- **失业 vs 通胀**：短期菲利普斯曲线显示两者此消彼长\n- **增长 vs 通胀**：需求拉动的快速增长会逼近产能，推高价格\n- **增长 vs 经常账户**：收入上升 ⇒ 进口上升 (ΔM = MPM × ΔY)\n- **增长 vs 环境**：更多产出通常意味着更多排放和资源消耗\n长期看，**供给侧改善**（LRAS 右移）可同时实现更高产出与更低价格，是缓解冲突的关键。","h_en":"Macro objectives and their conflicts","body_en":"The main macro objectives are **economic growth, low and stable inflation, low unemployment and current-account balance**, together with equitable incomes and environmental sustainability. Common short-run conflicts:\n- **Unemployment vs inflation**: the short-run Phillips curve shows a trade-off between them\n- **Growth vs inflation**: rapid demand-led growth pushes against capacity and raises prices\n- **Growth vs the current account**: rising income ⇒ rising imports (ΔM = MPM × ΔY)\n- **Growth vs the environment**: more output usually means more emissions and resource depletion\nIn the long run, **supply-side improvement** (LRAS shifting right) can deliver higher output and lower prices together, which is the key to easing these conflicts."},{"h":"供给侧政策：类型与评价","body":"**市场导向型**：降低边际税率（增强工作与投资激励）、放松管制、私有化、改革劳动力市场（削弱工会、降低失业福利）、贸易自由化。\n**干预型**：教育与职业培训、基础设施投资、研发补贴与税收抵免、区域与产业政策。\n评价要点：\n- 时滞长：教育、基础设施往往需多年才见效\n- 财政成本与机会成本：干预型政策需要政府支出\n- 公平问题：减税与削减福利可能扩大不平等\n- 效果不确定：减税未必增加劳动供给（收入效应可能抵消替代效应）\n- 短期也有需求效应：基础设施投资先增加 AD，再增加 LRAS","h_en":"Supply-side policies: types and evaluation","body_en":"**Market-based**: cutting marginal tax rates (stronger incentives to work and invest), deregulation, privatisation, labour-market reform (weaker unions, lower unemployment benefits), trade liberalisation.\n**Interventionist**: education and vocational training, infrastructure investment, R&D subsidies and tax credits, regional and industrial policy.\nPoints for evaluation:\n- Long time lags: education and infrastructure often take years to have an effect\n- Fiscal and opportunity costs: interventionist policies require government spending\n- Equity: tax cuts and welfare cuts may widen inequality\n- Uncertain effects: tax cuts may not raise labour supply (the income effect may offset the substitution effect)\n- Short-run demand effects as well: infrastructure spending raises AD first and LRAS later"},{"h":"凯恩斯学派 vs 古典学派；加速数与货币理论","body":"**古典/货币学派**：LRAS 垂直，工资价格灵活，经济会自动回到潜在产出；扩张性需求政策长期只推高价格水平，甚至挤出私人投资。主张规则化政策与供给侧改革。\n**凯恩斯学派**：AS 呈反 L 形，低产出区间近乎水平，工资向下粘性，“长期来看我们都死了”；衰退时应积极使用财政政策。\n**加速数示例**：v = 3，产出从 100 升至 110，再升至 115。第 2 期净投资 = 3 × 10 = 30；第 3 期 = 3 × 5 = 15。产出仍在增长，投资却减半——这解释了投资为何比 GDP 波动更剧烈，并与乘数相互作用放大周期。\n**货币理论**：数量论认为 V、Y 稳定，货币增长率 5%、实际增长 2% ⇒ 通胀约 3%；流动性偏好理论认为利率很低时人们愿意持有任意多的货币（流动性陷阱），增发货币只会降低 V。","h_en":"Keynesian vs classical views; the accelerator and monetary theory","body_en":"**Classical/monetarist**: LRAS is vertical, wages and prices are flexible and the economy returns automatically to potential output; expansionary demand policy only raises the price level in the long run and may crowd out private investment. They favour rules-based policy and supply-side reform.\n**Keynesian**: AS is reverse-L-shaped and nearly horizontal at low output, wages are sticky downward, and \"in the long run we are all dead\"; fiscal policy should be used actively in a recession.\n**Accelerator example**: v = 3, output rises from 100 to 110 and then to 115. Net investment in period 2 = 3 × 10 = 30; in period 3 = 3 × 5 = 15. Output is still growing, yet investment halves — this explains why investment is more volatile than GDP, and it interacts with the multiplier to amplify the cycle.\n**Monetary theory**: the quantity theory holds that V and Y are stable, so 5% money growth with 2% real growth ⇒ inflation of about 3%; liquidity preference theory holds that when interest rates are very low people will hold any amount of money (a liquidity trap), so extra money simply lowers V."},{"h":"政策时滞、有效性与政策组合","body":"政策效果取决于：乘数大小、挤出效应、预期与信心、汇率制度、资本流动以及**时滞**（识别—决策—影响）。\n**政策组合**：用多种工具同时追求多个目标（丁伯根法则 Tinbergen rule：独立目标数不应超过工具数）。例如：\n- 紧缩财政 + 宽松货币：降低赤字同时稳定需求\n- 需求管理稳定短期波动 + 供给侧政策提高长期潜在产出\n注意政策之间可能相互抵消：扩张财政 + 加息会推高本币、恶化经常账户。","h_en":"Policy lags, effectiveness and the policy mix","body_en":"Policy effectiveness depends on the size of the multiplier, crowding out, expectations and confidence, the exchange-rate regime, capital mobility and **lags** (recognition, decision, impact).\n**Policy mix**: using several instruments together to pursue several targets (the Tinbergen rule: the number of independent targets should not exceed the number of instruments). For example:\n- Tight fiscal + loose monetary: reducing the deficit while stabilising demand\n- Demand management to stabilise short-run fluctuations + supply-side policy to raise long-run potential output\nNote that policies can offset each other: expansionary fiscal policy + higher interest rates push up the currency and worsen the current account."},{"h":"矫正经常账户失衡","body":"**支出减少政策**：紧缩财政/货币降低收入，进口按 MPM 下降，但代价是失业上升。例如 MPM = 0.25，要减少进口 20 需要 ΔY = −80。\n**支出转换政策**：贬值、关税、出口补贴，使支出转向国产品；贬值是否有效取决于**马歇尔–勒纳条件**。\n**数值示例**：初始 X = M = 100，本币贬值 10%。PEDx = 0.8 ⇒ 出口量 +8%，出口收入 = 108；PEDm = 0.6 ⇒ 进口量 −6%，但进口本币价格 +10%，进口支出 = 100 × 1.1 × 0.94 = 103.4。贸易差额 = +4.6，改善（弹性和 1.4 > 1）。\n**J 曲线**：短期弹性小，进口支出因价格上涨先增加，差额恶化；随着合同到期、消费者调整，弹性上升，差额改善。\n贬值的风险：进口成本推动型通胀可能侵蚀竞争力收益，因此常需配合供给侧政策提高非价格竞争力。","h_en":"Correcting current-account imbalances","body_en":"**Expenditure-reducing policy**: contractionary fiscal/monetary policy lowers income and imports fall by MPM, but at the cost of higher unemployment. E.g. with MPM = 0.25, cutting imports by 20 requires ΔY = −80.\n**Expenditure-switching policy**: depreciation, tariffs and export subsidies switch spending towards domestic goods; whether a depreciation works depends on the **Marshall–Lerner condition**.\n**Numerical example**: initially X = M = 100 and the currency depreciates by 10%. PEDx = 0.8 ⇒ export volume +8%, export revenue = 108; PEDm = 0.6 ⇒ import volume −6%, but the domestic-currency price of imports rises 10%, so import spending = 100 × 1.1 × 0.94 = 103.4. Trade balance = +4.6, an improvement (elasticity sum 1.4 > 1).\n**J-curve**: short-run elasticities are small, so import spending first rises because of higher prices and the balance worsens; as contracts expire and consumers adjust, elasticities rise and the balance improves.\nRisk of depreciation: imported cost-push inflation can erode the competitiveness gain, so it usually needs to be combined with supply-side policies that improve non-price competitiveness."}],"pitfalls":["认为供给侧政策只有“减税放松管制”——教育、基础设施、研发补贴等干预型政策同样属于供给侧政策。","把加速数理解为“产出高投资就高”；实际上净投资取决于产出的**变化量**，增速放缓就会使投资下降。","只要贬值就认为经常账户立即改善，忽略马歇尔–勒纳条件和 J 曲线的短期恶化。","把关税归为支出减少政策——关税改变相对价格，属于支出转换政策。","在古典模型中仍认为扩张需求可以长期提高实际产出；在 LRAS 垂直时长期只提高价格水平。"],"pitfalls_en":["Thinking supply-side policy only means \"tax cuts and deregulation\" — interventionist measures such as education, infrastructure and R&D subsidies are also supply-side policies.","Reading the accelerator as \"high output means high investment\"; in fact net investment depends on the **change** in output, so a slowdown in growth makes investment fall.","Assuming any depreciation immediately improves the current account, ignoring the Marshall–Lerner condition and the short-run deterioration of the J-curve.","Classifying a tariff as an expenditure-reducing policy — a tariff changes relative prices, so it is an expenditure-switching policy.","Believing, within the classical model, that demand expansion can raise real output permanently; with a vertical LRAS it only raises the price level in the long run."],"exams":{"AP":"Macro Unit 5.1 (fiscal & monetary actions in the short and long run); Unit 6 (open economy)","IB":"3.3, 3.7 (supply-side policies)","AL":"9708 AS 5.1, 5.4, 6.5; A2 10.1–10.3, 11.1","IEO":"Economic fluctuations & macro policy; open economy","NEC":"Macro policy & international economics"},"diagram":"adas"},{"id":"M9","unit":"macro","title_zh":"经济发展、贫困与可持续","title_en":"Development, Poverty & Sustainability","level":"G10+","summary":"经济增长只是实际产出的增加，经济发展则是人们生活质量和可行能力的全面改善。本课讲解如何用人均GNI（PPP）、HDI、IHDI、MPI、GII 等指标衡量发展，比较不同发展水平国家的特征，分析贫困、不平等与阻碍发展的因素，并评估援助、FDI、小额信贷、贸易战略、制度建设与可持续发展目标 (SDGs) 等发展策略。","summary_en":"Economic growth is simply an increase in real output, whereas economic development is a broad improvement in people's quality of life and capabilities. This lesson explains how development is measured with GNI per capita (PPP), the HDI, IHDI, MPI and GII, compares the characteristics of countries at different levels of development, analyses poverty, inequality and the barriers to development, and evaluates strategies such as aid, FDI, microfinance, trade strategies, institution building and the Sustainable Development Goals (SDGs).","concepts":[{"zh":"经济增长与经济发展","en":"Economic growth vs economic development","def":"经济增长指实际GDP（或实际人均GDP）的增加；经济发展指生活水平、健康、教育、自由与选择的改善，是更宽泛的多维概念。","def_en":"Economic growth is an increase in real GDP (or real GDP per capita); economic development is an improvement in living standards, health, education, freedom and choice — a broader, multidimensional concept."},{"zh":"购买力平价人均GNI","en":"GNI per capita at PPP","def":"以购买力平价 (PPP) 换算的人均国民总收入，消除各国物价水平差异，比按市场汇率换算更能比较生活水平。","def_en":"Gross national income per person converted at purchasing power parity (PPP), which removes differences in national price levels and so compares living standards better than conversion at market exchange rates."},{"zh":"人类发展指数","en":"Human Development Index (HDI)","def":"联合国开发计划署 (UNDP) 编制的综合指标：健康（预期寿命）、教育（平均受教育年限与预期受教育年限）、收入（人均GNI PPP 的对数）三个维度指数的几何平均。","def_en":"A composite indicator compiled by the UNDP: the geometric mean of three dimension indices — health (life expectancy), education (mean and expected years of schooling) and income (the log of GNI per capita at PPP)."},{"zh":"不平等调整后的HDI","en":"Inequality-adjusted HDI (IHDI)","def":"按各维度内部的分配不平等程度对HDI打折；IHDI 与 HDI 的差距（损失百分比）越大，说明不平等越严重。","def_en":"The HDI discounted for inequality in the distribution of each dimension; the larger the gap (percentage loss) between the IHDI and the HDI, the greater the inequality."},{"zh":"多维贫困指数","en":"Multidimensional Poverty Index (MPI)","def":"从健康、教育、生活水平三个维度共10个指标衡量家庭层面的剥夺；MPI = 贫困发生率 H × 平均剥夺强度 A。","def_en":"Measures household-level deprivation across three dimensions (health, education, living standards) using 10 indicators; MPI = headcount ratio H × average intensity of deprivation A."},{"zh":"性别不平等指数","en":"Gender Inequality Index (GII)","def":"衡量生殖健康（孕产妇死亡率、青少年生育率）、赋权（议会席位、中等教育）与劳动力市场参与方面的性别差距；数值越高，不平等越严重。","def_en":"Measures gender gaps in reproductive health (maternal mortality, adolescent birth rate), empowerment (parliamentary seats, secondary education) and labour-market participation; a higher value means greater inequality."},{"zh":"绝对贫困与相对贫困","en":"Absolute vs relative poverty","def":"绝对贫困指收入低于满足基本需要的固定标准（如世界银行国际贫困线）；相对贫困指收入低于社会中位收入的一定比例（如50%或60%）。","def_en":"Absolute poverty means income below a fixed standard needed to meet basic needs (such as the World Bank's international poverty line); relative poverty means income below a set proportion (such as 50% or 60%) of the society's median income."},{"zh":"贫困陷阱","en":"Poverty trap (poverty cycle)","def":"低收入→低储蓄→低投资→低生产率→低收入的自我强化循环，没有外部推动很难打破。","def_en":"A self-reinforcing cycle of low income → low saving → low investment → low productivity → low income, which is hard to break without an external push."},{"zh":"初级产品依赖","en":"Primary-product dependence","def":"出口集中于少数农产品或矿产，面临价格剧烈波动和长期贸易条件恶化（普雷维什–辛格假说）的风险，也易出现“资源诅咒”。","def_en":"Exports concentrated in a few agricultural or mineral commodities, exposing the country to volatile prices, a long-run deterioration in the terms of trade (the Prebisch–Singer hypothesis) and the \"resource curse\"."},{"zh":"可持续发展","en":"Sustainable development","def":"既满足当代人的需要，又不损害后代人满足其需要的能力的发展（布伦特兰定义）；联合国2030议程设立17个可持续发展目标 (SDGs)。","def_en":"Development that meets the needs of the present without compromising the ability of future generations to meet their own needs (the Brundtland definition); the UN 2030 Agenda sets 17 Sustainable Development Goals (SDGs)."}],"formulas":[{"name":"HDI 维度指数","f":"健康 = (LE − 20) ÷ (85 − 20)；教育 = ½(MYS ÷ 15 + EYS ÷ 18)；收入 = [ln(GNIpc) − ln100] ÷ [ln75000 − ln100]","note":"LE 为出生时预期寿命，MYS 为平均受教育年限，EYS 为预期受教育年限；收入取对数，体现收入的边际效用递减。","name_en":"HDI dimension indices","f_en":"Health = (LE − 20) ÷ (85 − 20); Education = ½(MYS ÷ 15 + EYS ÷ 18); Income = [ln(GNIpc) − ln100] ÷ [ln75000 − ln100]","note_en":"LE is life expectancy at birth, MYS mean years of schooling, EYS expected years of schooling; income is logged to reflect diminishing marginal utility of income."},{"name":"HDI","f":"HDI = (I_健康 × I_教育 × I_收入)^(1/3)","note":"几何平均：一个维度很低无法被其他维度完全弥补（可替代性有限）。","name_en":"HDI","f_en":"HDI = (I_health × I_education × I_income)^(1/3)","note_en":"A geometric mean: a very low score in one dimension cannot be fully offset by the others (limited substitutability)."},{"name":"IHDI 损失","f":"损失% = (1 − IHDI ÷ HDI) × 100%","note":"例：HDI 0.75、IHDI 0.60，损失 20%。","name_en":"IHDI loss","note_en":"Example: HDI 0.75 and IHDI 0.60 give a 20% loss.","f_en":"Loss% = (1 − IHDI ÷ HDI) × 100%"},{"name":"多维贫困指数","f":"MPI = H × A","note":"H 为多维贫困人口比例（加权剥夺 ≥ 1/3 即为贫困），A 为贫困人口的平均剥夺份额。","name_en":"Multidimensional Poverty Index","note_en":"H is the share of people who are multidimensionally poor (weighted deprivation ≥ 1/3), A is the average share of deprivations among the poor."},{"name":"基尼系数","f":"G = A ÷ (A + B) = 1 − 2B","note":"A 为完全平等线与洛伦兹曲线之间的面积，B 为洛伦兹曲线下方面积；0 = 完全平等，1 = 完全不平等。","name_en":"Gini coefficient","note_en":"A is the area between the line of perfect equality and the Lorenz curve, B the area under the Lorenz curve; 0 = perfect equality, 1 = perfect inequality."},{"name":"哈罗德–多马模型","f":"g = s ÷ v","note":"g 为GDP增长率，s 为储蓄率，v 为资本–产出比；人均增长 ≈ g − 人口增长率。","name_en":"Harrod–Domar model","note_en":"g is the GDP growth rate, s the saving rate, v the capital–output ratio; per-capita growth ≈ g − population growth rate."}],"sections":[{"h":"增长 ≠ 发展：如何衡量发展","body":"**经济增长**只说明产出变多；**经济发展**关注健康、教育、收入分配、自由与环境。一国可以有增长而无发展（例如石油收入集中在少数人手中）。\n- **单一指标**：人均GDP/GNI（按 **PPP** 换算）易得、可比，但忽略分配、非市场生产、环境和生活质量。\n- **综合指标**：**HDI** 结合健康、教育、收入；**IHDI** 扣除不平等；**GII** 衡量性别差距；**MPI** 从家庭层面衡量多维剥夺。\n**例题**：某国预期寿命 72 岁，健康指数 = (72 − 20) ÷ 65 = 0.800；平均受教育 9 年、预期受教育 15 年，教育指数 = ½(9/15 + 15/18) ≈ 0.717；若收入指数为 0.700，则 HDI = (0.800 × 0.717 × 0.700)^(1/3) ≈ 0.738。\n注意 HDI 用**几何平均**：若把收入指数降到 0.300，HDI 降幅远大于算术平均下的降幅，体现“短板”效应。","h_en":"Growth ≠ development: measuring development","body_en":"**Economic growth** only tells us that output has increased; **economic development** is concerned with health, education, income distribution, freedom and the environment. A country can have growth without development (for example, when oil revenue is concentrated in a few hands).\n- **Single indicators**: GDP/GNI per capita (converted at **PPP**) is easy to obtain and compare, but ignores distribution, non-market production, the environment and quality of life.\n- **Composite indicators**: the **HDI** combines health, education and income; the **IHDI** deducts inequality; the **GII** measures gender gaps; the **MPI** measures multidimensional deprivation at household level.\n**Worked example**: a country has life expectancy of 72 years, so the health index = (72 − 20) ÷ 65 = 0.800; mean schooling is 9 years and expected schooling 15 years, so the education index = ½(9/15 + 15/18) ≈ 0.717; if the income index is 0.700, then HDI = (0.800 × 0.717 × 0.700)^(1/3) ≈ 0.738.\nNote that the HDI uses a **geometric mean**: if the income index fell to 0.300, the HDI would fall much more than it would under an arithmetic mean, reflecting the \"weakest link\" effect."},{"h":"不同发展水平国家的特征；贫困与不平等","body":"低收入国家通常表现为：**人口**上出生率和死亡率较高、人口年轻、抚养比高；**产业结构**上农业就业比重大，随发展逐步转向制造业和服务业；**非正规经济**（未登记、无社会保障的就业）比重高，税基窄。\n- **绝对贫困**：世界银行**国际贫困线**于2025年更新为每天 **$3.00**（2021年PPP，此前为 $2.15）。\n- **相对贫困**：收入低于中位收入的 50% 或 60%；经济增长时相对贫困不一定下降。\n**贫困发生率** (headcount ratio) = 贫困人口 ÷ 总人口，但它忽略贫困的深度，因此还要看贫困缺口和 MPI（MPI = H × A，例如 H = 30%、A = 50%，则 MPI = 0.15）。\n不平等用**洛伦兹曲线**和**基尼系数**衡量：曲线离 45° 线越远，G 越大。例：若最穷的 60% 人口只获得 25% 的收入，G = 1 − 2 × (0.075 + 0.25) = 0.35。","h_en":"Characteristics of countries at different levels of development; poverty and inequality","body_en":"Low-income countries typically show: in **demographics**, high birth and death rates, a young population and a high dependency ratio; in **sectoral structure**, a large share of employment in agriculture, shifting towards manufacturing and services as development proceeds; a large **informal economy** (unregistered work without social protection) and a narrow tax base.\n- **Absolute poverty**: the World Bank's **international poverty line** was updated in 2025 to **$3.00** a day (2021 PPP; previously $2.15).\n- **Relative poverty**: income below 50% or 60% of median income; relative poverty need not fall when the economy grows.\nThe **headcount ratio** = number of poor ÷ total population, but it ignores the depth of poverty, so we also look at the poverty gap and the MPI (MPI = H × A; for example, H = 30% and A = 50% give MPI = 0.15).\nInequality is measured with the **Lorenz curve** and the **Gini coefficient**: the further the curve lies from the 45° line, the larger G. Example: if the poorest 60% of the population receive only 25% of income, G = 1 − 2 × (0.075 + 0.25) = 0.35."},{"h":"增长与发展的障碍","body":"- **贫困陷阱**：收入低→储蓄低→投资低→生产率低。哈罗德–多马模型：s = 12%、v = 4，则 g = 3%；若人口增长 2.5%，人均仅增长约 0.5%。\n- **制度与腐败**：产权不清、合同难执行、寻租和腐败抬高交易成本，抑制投资（阿西莫格鲁：包容性 vs 攫取性制度）。\n- **基础设施与人力资本**：交通、电力、通信不足；教育和健康水平低，劳动生产率低。\n- **债务负担**：外债利息挤占教育卫生支出，本币贬值时外币债务负担加重。\n- **初级产品依赖**：商品价格波动大，贸易条件长期可能恶化；资源收入还可能推高汇率、挤出制造业（**荷兰病**）。\n- 其他：政治不稳定、冲突、性别不平等、资本外逃、地理与气候冲击。","h_en":"Barriers to growth and development","body_en":"- **Poverty trap**: low income → low saving → low investment → low productivity. Harrod–Domar model: with s = 12% and v = 4, g = 3%; if population grows at 2.5%, per-capita income grows by only about 0.5%.\n- **Institutions and corruption**: unclear property rights, weak contract enforcement, rent-seeking and corruption raise transaction costs and deter investment (Acemoglu: inclusive vs extractive institutions).\n- **Infrastructure and human capital**: inadequate transport, power and communications; low levels of education and health mean low labour productivity.\n- **Debt burden**: interest on foreign debt crowds out spending on education and health, and a depreciation of the domestic currency increases the burden of foreign-currency debt.\n- **Primary-product dependence**: commodity prices are volatile and the terms of trade may deteriorate in the long run; resource revenue may also push up the exchange rate and crowd out manufacturing (**Dutch disease**).\n- Others: political instability, conflict, gender inequality, capital flight, geographical and climate shocks."},{"h":"发展战略：市场导向与政府干预","body":"- **外国援助**：官方发展援助 (ODA)、项目援助、人道援助可填补储蓄缺口；风险是依赖、腐败、附加条件（**捆绑援助**）。\n- **FDI 与跨国公司 (MNCs)**：带来资本、技术、就业和税收；但可能利润汇出、转移定价避税、环境与劳工标准低、挤出本土企业。\n- **小额信贷**：向缺乏抵押品的穷人（尤其女性）提供小额贷款，促进自雇；局限是利率高、规模小、难以解决结构性问题。\n- **贸易战略**：**进口替代 (ISI)** 用保护扶持本国工业，易导致低效率；**出口导向/贸易自由化**利用比较优势和规模经济（东亚经验），但受外部需求冲击影响大。\n- **市场导向 vs 干预主义**：前者强调自由化、私有化、稳定化（华盛顿共识）；后者强调政府提供公共品、产业政策、社会安全网。现实中多为二者结合。\n- **女性赋权与制度建设**：提高女性教育可降低生育率、改善儿童健康；法治、产权保护和反腐是长期增长的基础。","h_en":"Development strategies: market-led vs interventionist","body_en":"- **Foreign aid**: official development assistance (ODA), project aid and humanitarian aid can fill the savings gap; the risks are dependency, corruption and conditions attached (**tied aid**).\n- **FDI and multinational corporations (MNCs)**: bring capital, technology, jobs and tax revenue; but profits may be repatriated, transfer pricing may be used to avoid tax, environmental and labour standards may be low, and domestic firms may be crowded out.\n- **Microfinance**: provides small loans to poor people without collateral (especially women), promoting self-employment; its limits are high interest rates, small scale and an inability to fix structural problems.\n- **Trade strategies**: **import substitution (ISI)** uses protection to nurture domestic industry but tends to breed inefficiency; **export promotion/trade liberalisation** exploits comparative advantage and economies of scale (the East Asian experience) but is exposed to shocks in external demand.\n- **Market-led vs interventionist**: the former stresses liberalisation, privatisation and stabilisation (the Washington Consensus); the latter stresses government provision of public goods, industrial policy and social safety nets. In practice most countries combine the two.\n- **Women's empowerment and institution building**: more education for women lowers fertility and improves child health; the rule of law, protection of property rights and anti-corruption are the foundations of long-run growth."},{"h":"可持续发展与联合国SDGs","body":"**可持续发展**要求在经济、社会、环境三方面平衡：今天的增长若以耗竭自然资本、污染和气候变化为代价，就会降低后代的福利。\n联合国 2015 年通过 **17 个可持续发展目标 (SDGs)**，目标年为 2030，包括消除贫困 (SDG 1)、零饥饿 (2)、优质教育 (4)、性别平等 (5)、清洁能源 (7)、减少不平等 (10)、气候行动 (13) 等。\n- 政策工具：碳税与排放交易（外部性内部化）、绿色投资、保护公共资源的社区治理（奥斯特罗姆）。\n- 衡量：调整后的净储蓄、绿色GDP、生态足迹等试图把资源耗竭和环境损害计入。\n**评价思路**：低收入国家常面临“先增长后治理”的取舍（环境库兹涅茨曲线），但气候冲击对穷国伤害最大，因此国际资金与技术转移十分关键。","h_en":"Sustainable development and the UN SDGs","body_en":"**Sustainable development** requires a balance among the economic, social and environmental dimensions: growth today that comes at the cost of depleting natural capital, pollution and climate change will lower the welfare of future generations.\nIn 2015 the UN adopted the **17 Sustainable Development Goals (SDGs)**, with a target year of 2030, including no poverty (SDG 1), zero hunger (2), quality education (4), gender equality (5), clean energy (7), reduced inequalities (10) and climate action (13).\n- Policy tools: carbon taxes and emissions trading (internalising externalities), green investment, community governance of common resources (Ostrom).\n- Measurement: adjusted net savings, green GDP and the ecological footprint try to account for resource depletion and environmental damage.\n**How to evaluate**: low-income countries often face a \"grow first, clean up later\" trade-off (the environmental Kuznets curve), but climate shocks hurt poor countries most, so international finance and technology transfer are crucial."}],"pitfalls":["把经济增长等同于经济发展；实际GDP增加并不保证健康、教育或分配改善。","计算 HDI 时用算术平均代替几何平均，或忘记收入指数要取对数。","用市场汇率而不是 PPP 比较各国生活水平，会低估低收入国家的实际购买力。","认为经济增长必然降低相对贫困；相对贫困取决于分配，中位收入上升时贫困线也随之上升。","把援助、FDI 或小额信贷当成“万能药”，评价时忽略制度质量、附加条件和利润汇出等问题。"],"pitfalls_en":["Equating economic growth with economic development; a rise in real GDP does not guarantee improvements in health, education or distribution.","Using an arithmetic mean instead of a geometric mean when computing the HDI, or forgetting that the income index is logged.","Comparing living standards across countries at market exchange rates rather than PPP, which understates the real purchasing power of low-income countries.","Assuming growth must reduce relative poverty; relative poverty depends on distribution, and the poverty line rises when median income rises.","Treating aid, FDI or microfinance as a \"cure-all\" and ignoring institutional quality, conditions attached and profit repatriation when evaluating them."],"exams":{"AP":"—","IB":"3.4 (inequality & poverty); 4.7–4.10 (development)","AL":"9708 A2 9.2; 11.3–11.5","IEO":"Institutions & inequality; environmental economics","NEC":"International economics (development basics)"},"diagram":"lorenz"},{"id":"M10","unit":"macro","title_zh":"贸易保护与经济一体化","title_en":"Protectionism & Economic Integration","level":"G10+","summary":"各国基于比较优势进行贸易可以提高总福利，但政府常用关税、配额、补贴和行政壁垒保护国内产业。本课用供求模型对各种保护手段做福利分析并给出代数计算，评价支持与反对保护的论据，讲解贸易条件指数，以及从优惠贸易协定到经济货币联盟的一体化层级、贸易创造与贸易转移、WTO 原则和全球化的利弊。","summary_en":"Trade based on comparative advantage raises total welfare, yet governments often protect domestic industries with tariffs, quotas, subsidies and administrative barriers. This lesson uses the supply-and-demand model to analyse the welfare effects of each form of protection with algebraic calculations, evaluates the arguments for and against protection, explains the terms of trade index, and covers the levels of integration from preferential trade agreements to economic and monetary union, trade creation and trade diversion, WTO principles, and the costs and benefits of globalisation.","concepts":[{"zh":"世界价格","en":"World price (P_w)","def":"小国可以按此价格无限量进口或出口；自由贸易下国内价格等于世界价格。","def_en":"The price at which a small country can import or export any quantity; under free trade the domestic price equals the world price."},{"zh":"关税","en":"Tariff","def":"对进口品征收的税。小国情形下国内价格上升一个关税额，国内产量增加、消费和进口减少，政府获得关税收入，并产生两个无谓损失三角形。","def_en":"A tax on imports. For a small country the domestic price rises by the amount of the tariff, domestic output rises, consumption and imports fall, the government earns tariff revenue, and two deadweight-loss triangles arise."},{"zh":"进口配额","en":"Import quota","def":"对进口数量的直接限制；价格和数量效应可以与关税相同，但原本的关税收入变为“配额租金”，归许可证持有者。","def_en":"A direct limit on the quantity of imports; its price and quantity effects can be identical to a tariff's, but what would have been tariff revenue becomes \"quota rent\" for the licence holders."},{"zh":"生产补贴","en":"Production subsidy","def":"政府按单位产量补贴国内生产者；国内产量增加、进口减少，但消费者价格不变，因此只有生产扭曲、没有消费扭曲。","def_en":"A government payment to domestic producers per unit of output; domestic output rises and imports fall, but the consumer price is unchanged, so there is a production distortion but no consumption distortion."},{"zh":"出口补贴","en":"Export subsidy","def":"按出口数量补贴出口商；国内价格上升到 P_w + s，国内消费减少、出口增加，政府支出超过生产者得益与消费者损失之差。","def_en":"A payment to exporters per unit exported; the domestic price rises to P_w + s, domestic consumption falls and exports rise, and the government's outlay exceeds the producers' gain net of the consumers' loss."},{"zh":"行政壁垒","en":"Administrative (non-tariff) barriers","def":"繁琐的海关手续、苛刻的产品标准、卫生检疫规定、政府采购偏好等，以非价格方式限制进口。","def_en":"Burdensome customs procedures, strict product standards, health and safety rules, government procurement preferences and so on, which restrict imports in non-price ways."},{"zh":"贸易条件","en":"Terms of trade (ToT)","def":"出口价格指数与进口价格指数之比 × 100；上升称为“改善”，即每单位出口可换得更多进口。","def_en":"The ratio of the export price index to the import price index × 100; a rise is an \"improvement\", meaning each unit of exports buys more imports."},{"zh":"贸易创造与贸易转移","en":"Trade creation vs trade diversion","def":"贸易创造：一体化后由高成本国内生产转向低成本伙伴国进口，提高效率；贸易转移：进口由低成本的非成员国转向较高成本的成员国，降低效率。","def_en":"Trade creation: after integration, higher-cost domestic production is replaced by imports from a lower-cost partner, raising efficiency; trade diversion: imports switch from a lower-cost non-member to a higher-cost member, lowering efficiency."},{"zh":"最惠国待遇","en":"Most-favoured-nation (MFN) principle","def":"WTO 的核心非歧视原则：给予任一成员的贸易优惠必须同样给予所有成员（自贸区、关税同盟、发展中国家优惠为例外）。","def_en":"The WTO's core principle of non-discrimination: a trade concession granted to any member must be extended to all members (free trade areas, customs unions and preferences for developing countries are exceptions)."},{"zh":"倾销","en":"Dumping","def":"以低于国内售价或低于成本的价格在外国市场销售；WTO 允许进口国在证明造成损害后征收反倾销税。","def_en":"Selling in a foreign market at a price below the domestic price or below cost; the WTO allows the importing country to levy anti-dumping duties once injury is shown."},{"zh":"全球化","en":"Globalisation","def":"各国经济通过贸易、资本、技术、劳动力和信息流动日益相互依存的过程，由运输和通信成本下降、贸易自由化和跨国公司扩张推动。","def_en":"The process by which national economies become increasingly interdependent through flows of trade, capital, technology, labour and information, driven by falling transport and communication costs, trade liberalisation and the expansion of MNCs."}],"formulas":[{"name":"关税收入","f":"收入 = t × (Qd_t − Qs_t)","note":"Qd_t、Qs_t 为征关税后国内价格 P_w + t 下的需求量和供给量。","name_en":"Tariff revenue","note_en":"Qd_t and Qs_t are quantity demanded and supplied at the post-tariff domestic price P_w + t.","f_en":"Revenue = t × (Qd_t − Qs_t)"},{"name":"关税无谓损失（线性）","f":"DWL = ½ · t · (Qs_t − Qs_w) + ½ · t · (Qd_w − Qd_t)","note":"第一项为生产扭曲，第二项为消费扭曲。","name_en":"Tariff deadweight loss (linear)","note_en":"The first term is the production distortion, the second the consumption distortion."},{"name":"关税福利分解","f":"ΔCS = −(ΔPS + 关税收入 + DWL)","note":"消费者剩余损失 = 生产者剩余增加 + 政府收入 + 无谓损失。","name_en":"Tariff welfare decomposition","note_en":"Loss of consumer surplus = gain in producer surplus + government revenue + deadweight loss.","f_en":"ΔCS = −(ΔPS + tariff revenue + DWL)"},{"name":"贸易条件指数","f":"ToT = (出口价格指数 ÷ 进口价格指数) × 100","note":"例：出口价格指数 110、进口价格指数 125，ToT = 88，恶化12%。","name_en":"Terms of trade index","note_en":"Example: export price index 110 and import price index 125 give ToT = 88, a 12% deterioration.","f_en":"ToT = (export price index ÷ import price index) × 100"},{"name":"有效保护率","f":"ERP = (t_f − a · t_i) ÷ (1 − a)","note":"t_f 为成品关税率，t_i 为中间品关税率，a 为自由贸易下中间品价值占成品价格的比例；衡量对国内增加值的保护程度（竞赛拓展）。","name_en":"Effective rate of protection","note_en":"t_f is the tariff rate on the final good, t_i the tariff rate on inputs, a the share of inputs in the final good's free-trade price; it measures protection of domestic value added (competition extension)."},{"name":"出口补贴成本","f":"财政成本 = s × 补贴后出口量","note":"小国：国内价格升至 P_w + s。","name_en":"Cost of an export subsidy","note_en":"Small country: the domestic price rises to P_w + s.","f_en":"Fiscal cost = s × exports after the subsidy"}],"sections":[{"h":"从自由贸易到关税：福利分析","body":"贸易的理由回顾：**比较优势**、规模经济、更多选择、竞争带来的效率与创新。小国面对给定的世界价格 P_w，国内价格低于自给自足价格时进口。\n**例题**：Qd = 120 − 10P，Qs = 10P − 20。自给自足 P = 7。世界价格 P_w = 4：Qd = 80，Qs = 20，进口 60。\n征收每单位 1 元关税，国内价格升至 5：Qd = 70，Qs = 30，进口降至 40。\n- 消费者剩余减少 = (80 + 70) ÷ 2 × 1 = 75。\n- 生产者剩余增加 = (20 + 30) ÷ 2 × 1 = 25。\n- 关税收入 = 1 × 40 = 40。\n- 无谓损失 = ½ × 1 × 10 + ½ × 1 × 10 = 10（生产扭曲 5 + 消费扭曲 5）。\n核对：75 = 25 + 40 + 10。社会净损失 10，是低效国内生产替代进口和消费减少造成的。","h_en":"From free trade to a tariff: welfare analysis","body_en":"Reasons for trade recap: **comparative advantage**, economies of scale, greater choice, and the efficiency and innovation brought by competition. A small country faces a given world price P_w and imports when the domestic autarky price is above it.\n**Worked example**: Qd = 120 − 10P, Qs = 10P − 20. Autarky P = 7. World price P_w = 4: Qd = 80, Qs = 20, imports 60.\nWith a tariff of $1 per unit, the domestic price rises to 5: Qd = 70, Qs = 30, and imports fall to 40.\n- Loss of consumer surplus = (80 + 70) ÷ 2 × 1 = 75.\n- Gain in producer surplus = (20 + 30) ÷ 2 × 1 = 25.\n- Tariff revenue = 1 × 40 = 40.\n- Deadweight loss = ½ × 1 × 10 + ½ × 1 × 10 = 10 (production distortion 5 + consumption distortion 5).\nCheck: 75 = 25 + 40 + 10. The net social loss of 10 is caused by inefficient domestic production replacing imports and by reduced consumption."},{"h":"其他保护手段","body":"- **进口配额**：把进口限制为 40 单位可达到与上例关税相同的价格 5，但 40 的“关税收入”变成**配额租金**；若许可证免费发给外国出口商，本国净损失 = 10 + 40 = 50。\n- **生产补贴**：每单位补贴 1 元，生产者得到 5，产量升至 30；消费者价格仍为 4，消费仍为 80，进口 50。财政成本 30，生产者剩余增加 25，DWL 只有生产扭曲三角 5。\n- **出口补贴**：出口国国内价格升至 P_w + s，国内消费者受损，外国消费者得益，常引发反补贴税。\n- **行政壁垒**：检验检疫、标准认证、通关拖延等，不产生政府收入，透明度低，更难谈判削减。","h_en":"Other forms of protection","body_en":"- **Import quota**: limiting imports to 40 units achieves the same price of 5 as the tariff above, but the \"tariff revenue\" of 40 becomes **quota rent**; if licences are given free to foreign exporters, the home country's net loss = 10 + 40 = 50.\n- **Production subsidy**: with a subsidy of $1 per unit, producers receive 5 and output rises to 30; the consumer price stays at 4, consumption stays at 80 and imports are 50. The fiscal cost is 30, producer surplus rises by 25, and the DWL is only the production-distortion triangle of 5.\n- **Export subsidy**: the exporting country's domestic price rises to P_w + s; domestic consumers lose, foreign consumers gain, and countervailing duties are often triggered.\n- **Administrative barriers**: inspections and quarantine, standards certification, customs delays and so on raise no government revenue, are less transparent and are harder to negotiate away."},{"h":"支持与反对保护主义的论据","body":"- **幼稚产业**：新兴产业需要时间获得规模经济和“干中学”，暂时保护后可具备竞争力；但难以挑选赢家，保护往往“长不大”。\n- **反倾销**：抵御掠夺性低价；但“倾销”认定易被滥用为变相保护。\n- **国家安全与战略产业**：粮食、能源、国防、芯片等；范围容易被无限扩大。\n- **保护就业**：短期保住受冲击行业岗位，但提高投入品价格、引发报复，损害出口行业就业；每保住一个岗位的消费者成本常远高于该岗位工资。\n- **其他**：改善国际收支、增加政府收入（发展中国家税基窄）、防止过度专业化、健康与环境标准。\n**反对理由**：效率损失 (DWL)、消费者价格上升、选择减少、国内企业缺乏竞争而低效、资源错配、**报复**与贸易战、损害发展中国家出口。","h_en":"Arguments for and against protectionism","body_en":"- **Infant industry**: new industries need time to gain economies of scale and \"learning by doing\" and can become competitive after temporary protection; but it is hard to pick winners, and protected industries often never \"grow up\".\n- **Anti-dumping**: guards against predatory low prices; but findings of \"dumping\" are easily abused as disguised protection.\n- **National security and strategic industries**: food, energy, defence, chips and so on; the scope is easily stretched without limit.\n- **Protecting jobs**: saves jobs in hard-hit industries in the short run, but raises input prices and invites retaliation, hurting jobs in export industries; the consumer cost per job saved is often far higher than the job's wage.\n- **Others**: improving the balance of payments, raising government revenue (developing countries have narrow tax bases), avoiding over-specialisation, health and environmental standards.\n**Arguments against**: efficiency losses (DWL), higher consumer prices, less choice, inefficiency of domestic firms shielded from competition, misallocation of resources, **retaliation** and trade wars, and harm to developing countries' exports."},{"h":"贸易条件","body":"**贸易条件指数** = 出口价格指数 ÷ 进口价格指数 × 100。例：出口价格指数由 100 升至 110，进口价格指数由 100 升至 125，ToT = 110 ÷ 125 × 100 = 88，恶化 12%。\n- **短期原因**：汇率变动（本币升值使出口外币价格上升、进口本币价格下降 → ToT 改善）、国内外通胀差异、商品价格冲击。\n- **长期原因**：生产率变化、收入增长带来的需求结构变化（初级产品收入弹性低，普雷维什–辛格假说）、技术进步。\n**后果**：ToT 恶化不一定是坏事——若由本币贬值引起，出口量可能大增；关键是看出口需求的价格弹性（马歇尔–勒纳条件）。对于依赖初级产品的国家，ToT 恶化会减少实际收入、经常账户恶化并增加债务负担。","h_en":"The terms of trade","body_en":"**Terms of trade index** = export price index ÷ import price index × 100. Example: the export price index rises from 100 to 110 and the import price index from 100 to 125, so ToT = 110 ÷ 125 × 100 = 88, a 12% deterioration.\n- **Short-run causes**: exchange-rate changes (an appreciation raises the foreign-currency price of exports and lowers the domestic-currency price of imports → ToT improve), differences between domestic and foreign inflation, commodity price shocks.\n- **Long-run causes**: changes in productivity, shifts in the pattern of demand as incomes grow (primary products have low income elasticity — the Prebisch–Singer hypothesis), technological progress.\n**Consequences**: a deterioration is not necessarily bad — if it is caused by a depreciation, export volumes may rise strongly; what matters is the price elasticity of demand for exports (the Marshall–Lerner condition). For countries that depend on primary products, a deterioration reduces real income, worsens the current account and increases the debt burden."},{"h":"经济一体化、WTO 与全球化","body":"一体化层级（由浅到深）：\n- **优惠贸易协定 (PTA)**：对部分商品降低关税。\n- **自由贸易区 (FTA)**：成员间取消关税，各自保留对外关税（需原产地规则），如 USMCA、东盟自贸区。\n- **关税同盟**：FTA + **统一对外关税**，如南方共同市场。\n- **共同市场**：关税同盟 + 劳动力和资本自由流动。\n- **经济与货币联盟**：共同市场 + 统一货币和货币政策，如欧元区。\n**贸易创造 vs 贸易转移**：若 A 国对所有进口征 20% 关税，非成员 C 成本 100（含税 120），伙伴 B 成本 110；与 B 结成 FTA 后改从 B 进口（110 < 120），消费者价格下降 10，但政府损失关税收入 20、世界资源成本每单位多耗 10——这是**贸易转移**。\n**WTO 原则**：非歧视（最惠国待遇、国民待遇）、互惠、约束关税、透明度、争端解决机制（专家组→上诉机构，后者自2019年起因法官空缺陷入瘫痪）。\n**全球化**：动因为运输和通信成本下降、贸易与资本自由化、跨国公司的全球价值链；利益是效率、技术扩散、更低价格、减贫；代价是结构性失业、不平等扩大、环境压力、金融危机传染和主权受限。","h_en":"Economic integration, the WTO and globalisation","body_en":"Levels of integration (from shallow to deep):\n- **Preferential trade agreement (PTA)**: lower tariffs on some goods.\n- **Free
