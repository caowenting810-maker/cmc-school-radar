"ln Q = a + b × ln P ⇒ PED = b","note":"对数模型的斜率直接是弹性：价格变动 1%，数量平均变动 b%。","name_en":"Elasticity in a Log–Log Regression","note_en":"The slope of a log model is the elasticity: a 1% price change is associated with a b% change in quantity on average."}],"sections":[{"h":"实证与规范、模型与假设","body":"经济学的第一步是分清**实证 (positive)** 与**规范 (normative)**：\n- “最低工资提高 10% 使青少年就业下降 1%”是实证表述——即使它错了，也能用数据检验；\n- “政府应该提高最低工资”是规范表述——取决于如何权衡效率与公平，含有价值判断。\n**模型**是有意的简化：供求模型忽略了千千万万的细节，只保留价格与数量的关系。好模型的标准不是“假设完全真实”，而是能否做出有用、可检验的预测。**其他条件不变 (ceteris paribus)** 让我们能单独考察一个变量，但现实数据中“其他条件”几乎总在变化，这正是实证研究的难点。","h_en":"Positive vs Normative, Models and Assumptions","body_en":"The first step in economics is to separate **positive** from **normative** statements:\n- \"Raising the minimum wage by 10% cut teenage employment by 1%\" is positive — even if it is wrong, it can be tested with data;\n- \"The government should raise the minimum wage\" is normative — it depends on how efficiency and equity are weighed and involves value judgements.\nA **model** is a deliberate simplification: the supply-and-demand model ignores countless details and keeps only the relationship between price and quantity. A good model is judged not by whether its assumptions are perfectly realistic but by whether it makes useful, testable predictions. **Ceteris paribus** lets us study one variable at a time, but in real data \"other things\" are almost always changing — which is exactly what makes empirical research hard."},{"h":"相关不等于因果","body":"数据中常见的陷阱：\n- **遗漏变量**：冰淇淋销量与溺水人数正相关，其实二者都由气温驱动；\n- **反向因果**：参加课外补习的学生成绩更低，可能是成绩差才去补习，而非补习导致成绩差；\n- **选择偏差**：主动参加职业培训的人本来就更有干劲，直接对比会高估培训效果。\n要识别因果，需要找到“除了处理之外其他都相同”的比较组：理想是**随机对照试验 (RCT)**——例如随机抽取部分村庄发放蚊帐或现金转移，比较结果；无法做实验时，就利用政策边界、抽签、出生日期等造成的**自然实验 (natural experiment)**。","h_en":"Correlation Is Not Causation","body_en":"Common traps in data:\n- **Omitted variable**: ice-cream sales and drownings are positively correlated, but both are driven by temperature;\n- **Reverse causality**: students who take extra tutoring have lower scores — perhaps weak scores lead to tutoring, not tutoring to weak scores;\n- **Selection bias**: people who volunteer for job training are more motivated to begin with, so a direct comparison overstates the training effect.\nTo identify causation we need a comparison group that is \"the same in everything except the treatment\": the ideal is a **randomised controlled trial (RCT)** — for example, randomly choosing villages to receive bed nets or cash transfers and comparing outcomes; when experiments are impossible, researchers use **natural experiments** created by policy borders, lotteries, dates of birth and the like."},{"h":"双重差分与回归：用数字说话","body":"**双重差分 (DiD)** 例：2024 年 A 市提高最低工资，B 市未变。\n- A 市青年就业率：政策前 60%，政策后 66%，变化 +6 个百分点；\n- B 市（对照组）：58% → 61%，变化 +3 个百分点；\n- **DiD = 6 − 3 = 3 个百分点**，即政策使 A 市就业率比“没有政策时”高 3 个百分点。\n关键假设是**平行趋势**：若无政策，A、B 两市会同步变化。可以检查政策前几年两地趋势是否一致。\n**回归**：估计“工资 = 20,000 + 3,000 × 受教育年限”，斜率 3,000 表示多读一年书平均对应年工资高 3,000 元（相关，未必是因果）；**R² = 0.25** 表示受教育年限解释了工资差异的 25%；**统计显著**（如 p < 0.05）表示若真实关系为零，得到这么大斜率的概率很小——但显著不等于“影响大”或“是因果”。\n用对数回归**估计弹性**：若 ln Q = 5.2 − 0.8 ln P，则需求价格弹性约为 −0.8，价格上涨 10% 对应销量下降约 8%，需求缺乏弹性。","h_en":"Difference-in-Differences and Regression: Letting Numbers Speak","body_en":"**Difference-in-differences (DiD)** example: in 2024 City A raised its minimum wage while City B did not.\n- City A youth employment rate: 60% before, 66% after, a change of +6 percentage points;\n- City B (control): 58% → 61%, a change of +3 percentage points;\n- **DiD = 6 − 3 = 3 percentage points**, i.e. the policy made A's employment rate 3 points higher than \"without the policy\".\nThe key assumption is **parallel trends**: without the policy, A and B would have moved together. We can check whether the two cities' trends matched in the years before the policy.\n**Regression**: an estimate of \"wage = 20,000 + 3,000 × years of schooling\" has a slope of 3,000, meaning one more year of schooling is associated with a 3,000 higher annual wage on average (a correlation, not necessarily causation); **R² = 0.25** means schooling explains 25% of the variation in wages; **statistically significant** (e.g. p < 0.05) means that if the true relationship were zero, a slope this large would be very unlikely — but significant does not mean \"large\" or \"causal\".\n**Estimating elasticity** with a log regression: if ln Q = 5.2 − 0.8 ln P, the price elasticity of demand is about −0.8; a 10% price rise is associated with roughly an 8% fall in sales, so demand is inelastic."},{"h":"读数基本功：指数、实际值与增长率","body":"**指数与更换基期**：CPI 以 2020 年 = 100，2018 年为 92，2024 年为 115。改以 2018 年为基期：2024 年 = 115 ÷ 92 × 100 = **125**，即 2018–2024 年物价上涨 25%。\n**实际与名义**：名义工资从 5,000 升至 5,600（+12%），同期 CPI 上涨 8%，实际工资增长 = 1.12 ÷ 1.08 − 1 ≈ **3.7%**（近似值 4%）。\n**百分比与百分点**：失业率从 4% 升至 5%，是上升 1 个百分点，也是上升 25%。媒体常混用，考试必须分清。\n**复合年增长率**：GDP 6 年内从 800 增至 1,200，CAGR = 1.5^(1/6) − 1 ≈ **7.0%**；简单平均 50% ÷ 6 ≈ 8.3% 会高估。\n**对数坐标**：在对数纵轴上，增长率恒定的序列是一条直线，斜率越陡增长越快，适合比较长期增长。\n**数据来源**：世界银行 (World Bank WDI)、国际货币基金组织 (IMF WEO)、各国统计局（如中国国家统计局、美国劳工统计局 BLS）、OECD。使用前要核对定义、单位（名义/实际、本币/美元/PPP）与基期。","h_en":"Data Basics: Index Numbers, Real Values and Growth Rates","body_en":"**Index numbers and rebasing**: with CPI 2020 = 100, 2018 is 92 and 2024 is 115. Rebasing to 2018: 2024 = 115 ÷ 92 × 100 = **125**, i.e. prices rose 25% from 2018 to 2024.\n**Real vs nominal**: the nominal wage rises from 5,000 to 5,600 (+12%) while CPI rises 8%, so real wage growth = 1.12 ÷ 1.08 − 1 ≈ **3.7%** (approximately 4%).\n**Percent vs percentage point**: unemployment rising from 4% to 5% is a rise of 1 percentage point and also a rise of 25%. The media often mix them up; in exams you must keep them apart.\n**Compound annual growth rate**: GDP grows from 800 to 1,200 in 6 years, so CAGR = 1.5^(1/6) − 1 ≈ **7.0%**; the simple average 50% ÷ 6 ≈ 8.3% overstates it.\n**Log scale**: on a logarithmic vertical axis, a series with a constant growth rate is a straight line, and a steeper slope means faster growth — ideal for comparing long-run growth.\n**Data sources**: the World Bank (WDI), the International Monetary Fund (IMF WEO), national statistics bureaus (e.g. China's National Bureau of Statistics, the US Bureau of Labor Statistics) and the OECD. Before using data, check definitions, units (nominal/real, local currency/US dollars/PPP) and base years."}],"pitfalls":["把“某变量与结果相关”直接解读为因果，忽略遗漏变量、反向因果和选择偏差。","混淆百分比与百分点：利率从 2% 升到 3% 是上升 1 个百分点，不是上升 1%。","用简单平均代替复合年增长率，或更换基期时用减法（115 − 92）而不是除法。","认为“统计显著”就意味着影响很大或一定是因果；显著性只说明结果不太可能是偶然。","做双重差分时只比较处理组前后变化，忘了减去对照组的共同趋势；或不检验平行趋势假设。"],"pitfalls_en":["Reading \"a variable is correlated with the outcome\" as causation, ignoring omitted variables, reverse causality and selection bias.","Confusing percent and percentage points: an interest rate rising from 2% to 3% is a rise of 1 percentage point, not a rise of 1%.","Using a simple average instead of the compound annual growth rate, or rebasing an index by subtraction (115 − 92) instead of division.","Believing that \"statistically significant\" means a large or definitely causal effect; significance only says the result is unlikely to be due to chance.","In a difference-in-differences analysis, comparing only the treatment group's before–after change and forgetting to subtract the control group's common trend, or not checking the parallel trends assumption."],"exams":{"AP":"—（real vs nominal、指数见 Macro Unit 2，部分）","IB":"1.2 Observing and modelling economies（positive/normative, ceteris paribus, models）","AL":"9708 AS 1.2（economic methodology）","IEO":"Frontiers: contemporary questions & data-driven research methods","NEC":"Macro（real vs nominal, index numbers）；Finals case data analysis"},"diagram":null}],"questions":[{"id":"m1-01","t":"m1","lv":1,"ex":["AP","IB","NEC"],"q":"Mia can either work a 3-hour shift at $15 per hour or use those same 3 hours to attend a concert whose ticket costs $40. What is Mia's opportunity cost of attending the concert?","o":["$40","$45","$85","$125"],"a":2,"e":"机会成本 (opportunity cost) = 显性成本 + 隐性成本 = 门票 $40 + 放弃的工资 3×$15 = $45，合计 $85。只算门票（$40）或只算工资（$45）都遗漏了一部分。","e_en":"Opportunity cost = explicit cost + implicit cost = ticket $40 + forgone wages 3×$15 = $45, a total of $85. Counting only the ticket ($40) or only the wages ($45) leaves out part of the cost."},{"id":"m1-02","t":"m1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An economy is producing at a point inside its production possibility curve (PPC). This indicates that","o":["the combination is unattainable with current resources","some resources are unemployed or used inefficiently","the economy has achieved allocative efficiency","technology has recently improved"],"a":1,"e":"PPC 内部的点代表资源闲置或利用无效率（如失业）。PPC 外部的点才是当前不可达；技术进步会使 PPC 外移，而不是使生产点落在曲线内部。","e_en":"A point inside the PPC represents idle resources or inefficient use of resources (such as unemployment). Only points outside the PPC are currently unattainable; technological progress shifts the PPC outward rather than placing the production point inside the curve."},{"id":"m1-03","t":"m1","lv":1,"ex":["AP","IB","AL"],"q":"A PPC that is bowed outward (concave to the origin) reflects","o":["constant opportunity costs","the law of diminishing marginal utility","increasing opportunity costs because resources are not equally suited to producing both goods","perfectly substitutable resources"],"a":2,"e":"资源具有专用性 (specialized resources)，多生产一种商品需要放弃越来越多的另一种商品，即机会成本递增，所以 PPC 外凸。机会成本不变或资源完全可替代对应直线 PPC；边际效用递减是消费者理论概念，与 PPC 形状无关。","e_en":"Resources are specialized, so producing more of one good requires giving up increasing amounts of the other good — that is, opportunity cost increases, so the PPC is bowed out. Constant opportunity cost or perfectly substitutable resources correspond to a straight-line PPC; diminishing marginal utility is a concept from consumer theory and has nothing to do with the shape of the PPC."},{"id":"m1-04","t":"m1","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"The table shows the output of one worker per day in two countries.\nWhich statement is correct?","tbl":[["Country","Wheat (tons)","Cloth (bolts)"],["Xland","8","4"],["Yland","3","3"]],"o":["No mutually beneficial trade is possible because Xland is more productive in both goods","Xland should specialize in cloth because it has an absolute advantage in cloth","Xland has a comparative advantage in both goods","Yland should specialize in cloth because its opportunity cost of cloth is lower"],"a":3,"e":"布的机会成本：Xland 1 布 = 8/4 = 2 小麦；Yland 1 布 = 3/3 = 1 小麦，所以 Yland 在布上有比较优势 (comparative advantage)，Xland 在小麦上有比较优势（0.5 布 < 1 布）。Xland 虽在两种商品上都有绝对优势，但一国不可能在两种商品上同时拥有比较优势，贸易仍然互利。","e_en":"Opportunity cost of cloth: in Xland, 1 cloth = 8/4 = 2 wheat; in Yland, 1 cloth = 3/3 = 1 wheat, so Yland has a comparative advantage in cloth and Xland has a comparative advantage in wheat (0.5 cloth < 1 cloth). Although Xland has an absolute advantage in both goods, a country cannot have a comparative advantage in both goods at the same time, and trade is still mutually beneficial."},{"id":"m1-05","t":"m1","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Using the same data (Xland: 8 wheat or 4 cloth per worker-day; Yland: 3 wheat or 3 cloth), which terms of trade would benefit BOTH countries?","o":["1 cloth for 1.5 wheat","1 cloth for 0.5 wheat","1 cloth for 2.5 wheat","1 cloth for 3 wheat"],"a":0,"e":"互利的贸易条件 (terms of trade) 必须位于两国的机会成本之间：1 布的价格在 1 小麦（Yland 的 OC）与 2 小麦（Xland 的 OC）之间。只有 1 布 = 1.5 小麦符合。0.5 小麦使出口布的 Yland 受损；2.5 或 3 小麦使进口布的 Xland 不如自己生产。","e_en":"Mutually beneficial terms of trade must lie between the two countries' opportunity costs: the price of 1 cloth must be between 1 wheat (Yland's OC) and 2 wheat (Xland's OC). Only 1 cloth = 1.5 wheat satisfies this. At 0.5 wheat, Yland, which exports cloth, loses; at 2.5 or 3 wheat, Xland, which imports cloth, would be better off producing it itself."},{"id":"m1-06","t":"m1","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Computers are measured on the horizontal axis and food on the vertical axis of a PPC. A new technology raises productivity ONLY in computer production. The PPC will","o":["pivot outward along the computer axis, with the food intercept unchanged","shift outward in a parallel fashion","remain unchanged while the economy moves along it toward more computers","shift inward because resources move out of food"],"a":0,"e":"技术进步只影响电脑生产，因此电脑轴截距外移、食品截距不变，PPC 绕食品截距向外旋转 (pivot)。平行外移需要两种商品的生产能力同时提高；沿曲线移动只是产出组合的变化，并非生产能力改变。","e_en":"The technological advance affects only computer production, so the intercept on the computer axis moves outward while the food intercept is unchanged, and the PPC pivots outward around the food intercept. A parallel outward shift requires the productive capacity for both goods to increase at the same time; a movement along the curve is only a change in the output mix, not a change in productive capacity."},{"id":"m1-07","t":"m1","lv":2,"ex":["AP","IB","NEC"],"q":"A café can run extra evening study sessions. The total benefit from running sessions is shown in the table, and each session has a constant marginal cost of $10. How many sessions should the café run?","tbl":[["Sessions","Total benefit ($)"],["1","20"],["2","36"],["3","48"],["4","56"],["5","60"]],"o":["2","3","4","5"],"a":1,"e":"边际收益 (MB)：第 1–5 场分别为 20、16、12、8、4。按边际分析 (marginal analysis)，只要 MB ≥ MC（$10）就继续：第 3 场 MB = 12 > 10，第 4 场 MB = 8 < 10。所以选 3 场。选 5 场是误以为要让总收益最大。","e_en":"Marginal benefit (MB): for sessions 1–5 it is 20, 16, 12, 8 and 4 respectively. Using marginal analysis, keep going as long as MB ≥ MC ($10): the 3rd session has MB = 12 > 10, while the 4th has MB = 8 < 10. So choose 3 sessions. Choosing 5 sessions comes from mistakenly thinking that total benefit should be maximized."},{"id":"m1-08","t":"m1","lv":3,"ex":["IEO","NEC"],"q":"Ann can pick 10 apples or 5 pears per day; Ben can pick 6 apples or 6 pears per day (each with a linear trade-off). Working together, they want exactly 8 pears per day. What is the maximum number of apples they can also pick?","o":["4","5","6","8"],"a":2,"e":"先比较摘梨的机会成本：Ben 1 梨 = 1 苹果，Ann 1 梨 = 10/5 = 2 苹果，所以梨先由 Ben 生产。Ben 全天摘梨得 6 个（0 苹果）；还差 2 个梨由 Ann 生产，用 2/5 天，剩余 3/5 天摘苹果 = 3/5 × 10 = 6 个。最大苹果 = 6。若让 Ann 先摘梨（错误分工）：Ann 全天摘 5 个梨，Ben 用半天摘 3 个梨、半天摘 3 个苹果，只能得到 3 个苹果。","e_en":"First compare the opportunity cost of picking pears: for Ben, 1 pear = 1 apple; for Ann, 1 pear = 10/5 = 2 apples, so pears should be produced by Ben first. Ben spends the whole day picking pears and gets 6 (0 apples); the remaining 2 pears are produced by Ann, which takes 2/5 of a day, and she spends the remaining 3/5 of the day picking apples = 3/5 × 10 = 6. Maximum apples = 6. If Ann picks pears first (the wrong division of labor): Ann spends the whole day picking 5 pears, and Ben spends half a day picking 3 pears and half a day picking 3 apples, giving only 3 apples."},{"id":"m1-09","t":"m1","lv":3,"ex":["IEO","AL"],"q":"Zedland has a linear PPC: it can produce 100 units of food or 50 units of tech (or any linear combination). The world price is 1 tech = 3 food. Zedland specializes completely in tech and exports 20 tech. Compared with the maximum food it could have consumed in autarky with the same amount of tech, how much extra food does Zedland consume?","o":["10","30","60","20"],"a":3,"e":"Zedland 国内 1 tech 的机会成本 = 100/50 = 2 food，而世界价格为 3 food，所以专业化生产 tech 有利。生产 50 tech，出口 20 换来 20×3 = 60 food，消费 (30 tech, 60 food)。自给自足 (autarky) 时保留 30 tech 只能生产 100 − 2×30 = 40 food。贸易收益 = 60 − 40 = 20 food。选 60 是把进口总量误当成收益。","e_en":"Zedland's domestic opportunity cost of 1 tech = 100/50 = 2 food, while the world price is 3 food, so it is beneficial to specialize in tech. Produce 50 tech, export 20 in exchange for 20×3 = 60 food, and consume (30 tech, 60 food). Under autarky, keeping 30 tech allows only 100 − 2×30 = 40 food to be produced. Gains from trade = 60 − 40 = 20 food. Choosing 60 mistakes the total amount imported for the gain."},{"id":"m1-10","t":"m1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"In a command economy, the questions of what, how, and for whom to produce are answered mainly by","o":["price signals in competitive markets","tradition and custom","consumer sovereignty","central government planning"],"a":3,"e":"计划（指令）经济 (command economy) 由政府中央计划决定资源配置。价格信号和消费者主权 (consumer sovereignty) 是市场经济的特征；传统和习俗对应传统经济。","e_en":"In a planned (command) economy, the allocation of resources is determined by the government's central plan. Price signals and consumer sovereignty are features of a market economy; tradition and custom correspond to a traditional economy."},{"id":"m2-01","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following causes a movement along the demand curve for coffee, rather than a shift of the curve?","o":["A rise in the price of coffee","A rise in consumers' incomes","A fall in the price of tea","A news report that coffee improves health"],"a":0,"e":"咖啡自身价格变化只引起沿需求曲线移动，即需求量 (quantity demanded) 变化。收入、替代品（茶）价格、偏好的变化都会使整条需求曲线移动。","e_en":"A change in the price of coffee itself causes only a movement along the demand curve, i.e. a change in quantity demanded. Changes in income, in the price of a substitute (tea) or in tastes all shift the entire demand curve."},{"id":"m2-02","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An improvement in the technology used to produce smartphones will, ceteris paribus,","o":["shift the demand curve to the right","shift the supply curve to the right, lowering price and raising quantity","shift the supply curve to the left, raising price","increase quantity supplied without shifting the supply curve"],"a":1,"e":"技术进步降低生产成本，使供给曲线右移，均衡价格下降、均衡数量上升。技术是供给的决定因素而非需求的决定因素；“供给量增加而曲线不动”只在商品自身价格上升时发生。","e_en":"Technological progress lowers production costs and shifts the supply curve to the right, so the equilibrium price falls and the equilibrium quantity rises. Technology is a determinant of supply, not of demand; \"quantity supplied increases while the curve does not move\" happens only when the good's own price rises."},{"id":"m2-03","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Market demand is Qd = 120 − 4P and market supply is Qs = −30 + 6P. What are the equilibrium price and quantity?","o":["P = 12, Q = 72","P = 18, Q = 48","P = 15, Q = 60","P = 9, Q = 84"],"a":2,"e":"令 Qd = Qs：120 − 4P = −30 + 6P → 10P = 150 → P = 15，Q = 120 − 60 = 60。验证：Qs = −30 + 90 = 60。P = 12 时 Qd = 72 但 Qs = 42，存在短缺，不是均衡。","e_en":"Set Qd = Qs: 120 − 4P = −30 + 6P → 10P = 150 → P = 15, Q = 120 − 60 = 60. Check: Qs = −30 + 90 = 60. At P = 12, Qd = 72 but Qs = 42, so there is a shortage — it is not an equilibrium."},{"id":"m2-04","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In the market with Qd = 120 − 4P and Qs = −30 + 6P, what is consumer surplus at equilibrium?","o":["$900","$300","$750","$450"],"a":3,"e":"均衡 P = 15，Q = 60。需求价格截距 (choke price)：Qd = 0 → P = 30。CS = ½ × (30 − 15) × 60 = 450。$300 是生产者剩余（供给价格截距 5：½ × 10 × 60）；$750 是总剩余；$900 是忘记乘 ½。","e_en":"Equilibrium P = 15, Q = 60. Demand price intercept (choke price): Qd = 0 → P = 30. CS = ½ × (30 − 15) × 60 = 450. $300 is producer surplus (supply price intercept 5: ½ × 10 × 60); $750 is total surplus; $900 comes from forgetting to multiply by ½."},{"id":"m2-05","t":"m2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Demand for a good increases while its supply decreases at the same time. Which outcome is certain?","o":["Equilibrium quantity rises","Equilibrium price rises","Equilibrium quantity falls","Equilibrium price falls"],"a":1,"e":"需求右移推高价格，供给左移也推高价格，因此价格必然上升。数量方面：需求增加使 Q 上升，供给减少使 Q 下降，净效应取决于两者移动幅度，不确定 (indeterminate)。","e_en":"The rightward shift of demand pushes the price up, and the leftward shift of supply also pushes the price up, so the price must rise. As for quantity: the increase in demand raises Q while the decrease in supply lowers Q, so the net effect depends on the relative size of the two shifts and is indeterminate."},{"id":"m2-06","t":"m2","lv":1,"ex":["AP","IB","NEC"],"q":"Use the schedule below. If the price is set at $4, the market will experience","tbl":[["Price ($)","Qd","Qs"],["2","100","40"],["4","80","60"],["6","60","80"],["8","40","100"]],"o":["a surplus of 20 units","a shortage of 80 units","equilibrium","a shortage of 20 units"],"a":3,"e":"P = $4 时 Qd = 80，Qs = 60，Qd > Qs，短缺 (shortage) = 80 − 60 = 20。均衡在 P = 5 左右（Qd = Qs = 70）。“短缺 80”是把需求量误当成短缺量。","e_en":"At P = $4, Qd = 80 and Qs = 60, so Qd > Qs and the shortage = 80 − 60 = 20. Equilibrium is at around P = 5 (Qd = Qs = 70). \"A shortage of 80\" mistakes the quantity demanded for the size of the shortage."},{"id":"m2-07","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The price of gasoline rises sharply. Ceteris paribus, in the market for large SUVs","o":["equilibrium price falls and equilibrium quantity falls","equilibrium price and quantity both rise","the supply of SUVs shifts to the left","quantity demanded falls but demand is unchanged"],"a":0,"e":"汽油与 SUV 是互补品 (complements)。汽油涨价使 SUV 的需求曲线左移，均衡价格和数量都下降。汽油不是 SUV 的生产投入，所以不影响 SUV 供给；“需求不变只是需求量下降”只适用于 SUV 自身价格变化。","e_en":"Gasoline and SUVs are complements. The rise in the price of gasoline shifts the demand curve for SUVs to the left, so both the equilibrium price and quantity fall. Gasoline is not an input in producing SUVs, so it does not affect SUV supply; \"demand is unchanged and only quantity demanded falls\" applies only to a change in the price of SUVs themselves."},{"id":"m2-08","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Initially Qd = 120 − 4P and Qs = −30 + 6P. Rising incomes change demand to Qd = 150 − 4P. By how much does producer surplus increase?","o":["$117","$207","$300","$507"],"a":1,"e":"原均衡 P = 15，Q = 60，PS = ½ × (15 − 5) × 60 = 300。新均衡：150 − 4P = −30 + 6P → P = 18，Q = 78，PS = ½ × (18 − 5) × 78 = 507。增加 507 − 300 = 207。$507 是新 PS 的总额而非增量。","e_en":"Original equilibrium: P = 15, Q = 60, PS = ½ × (15 − 5) × 60 = 300. New equilibrium: 150 − 4P = −30 + 6P → P = 18, Q = 78, PS = ½ × (18 − 5) × 78 = 507. The increase is 507 − 300 = 207. $507 is the total new PS, not the increase."},{"id":"m2-09","t":"m2","lv":3,"ex":["IEO","NEC"],"q":"A market has 100 identical consumers, each with demand q = 10 − 2P, and 50 identical firms, each with supply q = 4P − 2 (for P ≥ 0.5). What are the market equilibrium price and quantity?","o":["P = 2.00, Q = 600","P = 3.00, Q = 400","P = 2.25, Q = 550","P = 2.75, Q = 450"],"a":3,"e":"水平加总 (horizontal summation)：市场需求 Qd = 100(10 − 2P) = 1000 − 200P；市场供给 Qs = 50(4P − 2) = 200P − 100。令两者相等：1100 = 400P → P = 2.75，Q = 1000 − 550 = 450。验证：每家企业 q = 4×2.75 − 2 = 9，50 × 9 = 450。","e_en":"Horizontal summation: market demand Qd = 100(10 − 2P) = 1000 − 200P; market supply Qs = 50(4P − 2) = 200P − 100. Setting them equal: 1100 = 400P → P = 2.75, Q = 1000 − 550 = 450. Check: each firm's q = 4×2.75 − 2 = 9, and 50 × 9 = 450."},{"id":"m2-10","t":"m2","lv":3,"ex":["IEO","AL"],"q":"Inverse demand is P = 100 − 2Q and inverse supply is P = 20 + 2Q. A technological improvement lowers marginal cost by $8 at every output level. What is the change in consumer surplus?","o":["+$44","+$84","+$88","+$160"],"a":1,"e":"原均衡：100 − 2Q = 20 + 2Q → Q = 20，P = 60，CS = ½ × 40 × 20 = 400。新供给 P = 12 + 2Q：100 − 2Q = 12 + 2Q → Q = 22，P = 56，CS = ½ × (100 − 56) × 22 = 484。ΔCS = +84（= 4 × 20 + ½ × 4 × 2）。注意消费者价格只下降 4，成本下降 8 由买卖双方分担；+88 是 4 × 22（多算了三角形的另一半），+160 是把 8 × 20 全部算作消费者收益。","e_en":"Original equilibrium: 100 − 2Q = 20 + 2Q → Q = 20, P = 60, CS = ½ × 40 × 20 = 400. New supply P = 12 + 2Q: 100 − 2Q = 12 + 2Q → Q = 22, P = 56, CS = ½ × (100 − 56) × 22 = 484. ΔCS = +84 (= 4 × 20 + ½ × 4 × 2). Note that the consumer price falls by only 4; the cost reduction of 8 is shared between buyers and sellers. +88 is 4 × 22 (counting the other half of the triangle as well), and +160 counts the whole of 8 × 20 as a gain to consumers."},{"id":"m3-01","t":"m3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"When the price of a good rises from $10 to $12, quantity demanded falls from 100 to 80. Using the midpoint method, the absolute value of PED is approximately","o":["0.82","1.00","1.22","2.00"],"a":2,"e":"中点公式：%ΔQ = −20 ÷ 90 ≈ −22.2%；%ΔP = 2 ÷ 11 ≈ 18.2%；|PED| ≈ 22.2 ÷ 18.2 ≈ 1.22（富有弹性）。用初始值算得 20% ÷ 20% = 1.00 是常见陷阱；0.82 是把分子分母颠倒。","e_en":"Midpoint formula: %ΔQ = −20 ÷ 90 ≈ −22.2%; %ΔP = 2 ÷ 11 ≈ 18.2%; |PED| ≈ 22.2 ÷ 18.2 ≈ 1.22 (elastic). Using the initial values to get 20% ÷ 20% = 1.00 is a common trap; 0.82 comes from inverting the numerator and denominator."},{"id":"m3-02","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"If the demand for a product is price elastic, a firm that raises its price will see total revenue","o":["rise","stay the same","rise only if costs fall","fall"],"a":3,"e":"总收益检验 (total revenue test)：需求富有弹性时，价格上升带来的需求量下降百分比更大，TR = P × Q 下降。只有缺乏弹性时涨价才会增加 TR；TR 与成本无关。","e_en":"Total revenue test: when demand is price elastic, the percentage fall in quantity demanded caused by a price rise is larger, so TR = P × Q falls. Only when demand is inelastic does a price rise increase TR; TR has nothing to do with costs."},{"id":"m3-03","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Demand for which of the following is likely to be the MOST price inelastic?","o":["A particular brand of cola","Insulin for people with diabetes","Restaurant meals","Leisure airline tickets"],"a":1,"e":"胰岛素是必需品，几乎没有替代品，需求极缺乏弹性。某品牌可乐有大量近似替代品（市场定义越窄弹性越大）；餐馆用餐与休闲机票属于可推迟的非必需消费，弹性较大。","e_en":"Insulin is a necessity with almost no substitutes, so demand for it is highly inelastic. A particular brand of cola has many close substitutes (the more narrowly a market is defined, the more elastic demand is); restaurant meals and leisure air travel are non-essential spending that can be postponed, so their demand is more elastic."},{"id":"m3-04","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"When average income rises by 10%, the quantity of bus rides demanded falls by 15%. Using simple percentage changes, the income elasticity of demand (YED) and type of good are","o":["+1.5; a luxury good","−1.5; an inferior good","−0.67; an inferior good","+0.67; a necessity"],"a":1,"e":"YED = %ΔQd ÷ %ΔIncome = −15% ÷ 10% = −1.5。YED < 0 说明是劣等品 (inferior good)。−0.67 是分子分母颠倒；正值选项忽略了符号。","e_en":"YED = %ΔQd ÷ %ΔIncome = −15% ÷ 10% = −1.5. YED < 0 shows that it is an inferior good. −0.67 comes from inverting the numerator and denominator; the positive options ignore the sign."},{"id":"m3-05","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The price of printers rises by 20%, and the quantity demanded of ink cartridges falls by 10%. The cross-price elasticity of demand (XED) of ink cartridges with respect to printer prices is","o":["−0.5, so the goods are complements","+0.5, so the goods are substitutes","−2.0, so the goods are complements","+2.0, so the goods are substitutes"],"a":0,"e":"XED = %ΔQd(墨盒) ÷ %ΔP(打印机) = −10% ÷ 20% = −0.5。XED < 0 表示互补品 (complements)。−2.0 是把分子分母颠倒。","e_en":"XED = %ΔQd(ink cartridges) ÷ %ΔP(printers) = −10% ÷ 20% = −0.5. XED < 0 indicates complements. −2.0 comes from inverting the numerator and denominator."},{"id":"m3-06","t":"m3","lv":2,"ex":["AP","IB","AL"],"q":"Which of the following would make the supply of a product MORE price elastic?","o":["Production takes a long time and cannot easily be increased","Firms have large amounts of spare capacity and stocks","The product is perishable and cannot be stored","The time period considered is very short"],"a":1,"e":"闲置产能 (spare capacity) 与库存 (stocks) 使企业能在价格上升时迅速增加供给，PES 更大。生产周期长、易腐不可储存、时间很短都会使供给缺乏弹性。","e_en":"Spare capacity and stocks allow firms to increase supply quickly when the price rises, so PES is greater. A long production period, goods that are perishable and cannot be stored, and a very short time period all make supply inelastic."},{"id":"m3-07","t":"m3","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Q = 100 − 2P and the current price is $30. What is the point price elasticity of demand, and what should the firm do to increase total revenue?","o":["|PED| = 0.67; raise the price","|PED| = 1.5; lower the price","|PED| = 1.5; raise the price","|PED| = 1; leave the price unchanged"],"a":1,"e":"P = 30 时 Q = 40，点弹性 = (ΔQ/ΔP) × (P/Q) = −2 × 30/40 = −1.5，|PED| > 1 富有弹性，降价可提高 TR。TR 最大化在直线中点 P = 25（|PED| = 1）。0.67 是 1.5 的倒数（把 P/Q 写成了 Q/P）。","e_en":"At P = 30, Q = 40, and point elasticity = (ΔQ/ΔP) × (P/Q) = −2 × 30/40 = −1.5; |PED| > 1, so demand is elastic and a price cut can raise TR. TR is maximized at the midpoint of the line, P = 25 (|PED| = 1). 0.67 is the reciprocal of 1.5 (writing P/Q as Q/P)."},{"id":"m3-08","t":"m3","lv":3,"ex":["IB","AL","IEO"],"q":"In a market, PED = −0.5 and PES = 1.5 around the equilibrium. The government imposes a tax of $4 per unit on sellers. Approximately how much of the tax per unit is borne by consumers?","o":["$1","$2","$3","$4"],"a":2,"e":"税负归宿 (tax incidence)：消费者承担比例 = PES ÷ (PES + |PED|) = 1.5 ÷ 2.0 = 75%，即 0.75 × 4 = $3；生产者承担 $1。需求更缺乏弹性的一方承担更多税负，与法定由谁缴纳无关。选 $1 是把公式颠倒。","e_en":"Tax incidence: consumer share = PES ÷ (PES + |PED|) = 1.5 ÷ 2.0 = 75%, i.e. 0.75 × 4 = $3; producers bear $1. The side that is more inelastic (here, demand) bears more of the tax burden, regardless of who is legally required to pay it. Choosing $1 comes from inverting the formula."},{"id":"m3-09","t":"m3","lv":3,"ex":["AP","IB","IEO","NEC"],"q":"A firm cuts its price from $50 to $40, and sales rise from 300 to 420 units. Which statement is correct (use the midpoint method)?","o":["|PED| ≈ 2.0 and total revenue rises by $1,800","|PED| ≈ 1.5 and total revenue falls by $1,800","|PED| ≈ 1.5 and total revenue rises by $1,800","|PED| ≈ 0.67 and total revenue rises by $3,000"],"a":2,"e":"中点：%ΔQ = 120 ÷ 360 ≈ 33.3%，%ΔP = 10 ÷ 45 ≈ 22.2%，|PED| ≈ 1.5。TR 从 50 × 300 = 15,000 升到 40 × 420 = 16,800，增加 $1,800，与“富有弹性时降价 TR 上升”一致。2.0 来自简单百分比 40% ÷ 20%。","e_en":"Midpoint: %ΔQ = 120 ÷ 360 ≈ 33.3%, %ΔP = 10 ÷ 45 ≈ 22.2%, |PED| ≈ 1.5. TR rises from 50 × 300 = 15,000 to 40 × 420 = 16,800, an increase of $1,800, consistent with \"when demand is elastic, a price cut raises TR\". 2.0 comes from simple percentages, 40% ÷ 20%."},{"id":"m3-10","t":"m3","lv":3,"ex":["IEO","NEC"],"q":"Suppose demand for a good has unit elasticity at every price (so P × Q is constant along the demand curve). A drought shifts the supply curve to the left. Total consumer spending on the good will","o":["rise","fall","remain unchanged","rise or fall depending on the elasticity of supply"],"a":2,"e":"单位弹性需求曲线（等轴双曲线 P × Q = 常数）上任意一点的总支出都相同。供给左移只使均衡点沿需求曲线移动，P 上升、Q 下降，但 P × Q 不变。供给弹性影响价格和数量变化幅度，但不影响总支出。","e_en":"On a unit-elastic demand curve (a rectangular hyperbola, P × Q = constant), total expenditure is the same at every point. A leftward shift of supply only moves the equilibrium point along the demand curve: P rises and Q falls, but P × Q is unchanged. The elasticity of supply affects the size of the changes in price and quantity, but not total expenditure."},{"id":"m4-01","t":"m4","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A binding price ceiling set below the equilibrium price will most likely lead to","o":["a shortage of the good","a surplus of the good","an increase in quantity supplied","no change in the market"],"a":0,"e":"有约束力的价格上限 (binding price ceiling) 低于均衡价格：Qd 增加、Qs 减少，产生短缺，可能伴随排队和黑市。过剩是价格下限的结果；上限高于均衡价格时才没有影响。","e_en":"A binding price ceiling is below the equilibrium price: Qd increases and Qs decreases, creating a shortage, possibly accompanied by queues and black markets. A surplus is the result of a price floor; a ceiling has no effect only when it is set above the equilibrium price."},{"id":"m4-02","t":"m4","lv":1,"ex":["AP","IB","AL","NEC"],"q":"If a minimum wage is set above the equilibrium wage in a competitive labor market, the result will be","o":["a shortage of workers","higher employment","a surplus of labor (unemployment)","no effect on employment"],"a":2,"e":"最低工资 (minimum wage) 是劳动市场的价格下限。高于均衡工资时，劳动供给量 > 劳动需求量，出现劳动力过剩即失业，就业量下降。低于均衡的最低工资才没有影响。","e_en":"A minimum wage is a price floor in the labor market. When it is above the equilibrium wage, the quantity of labor supplied > the quantity of labor demanded, so there is a surplus of labor, i.e. unemployment, and employment falls. Only a minimum wage below equilibrium has no effect."},{"id":"m4-03","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 200 − 10P and supply is Qs = 20P − 40. The government imposes a price ceiling of $6. What is the resulting shortage?","o":["20 units","40 units","140 units","60 units"],"a":3,"e":"均衡：200 − 10P = 20P − 40 → P = 8，Q = 120，所以 $6 的上限有约束力。P = 6 时 Qd = 140，Qs = 80，短缺 = 60。40 是 120 − 80（只看供给减少），20 是 140 − 120（只看需求增加）。","e_en":"Equilibrium: 200 − 10P = 20P − 40 → P = 8, Q = 120, so the $6 ceiling is binding. At P = 6, Qd = 140 and Qs = 80, so the shortage = 60. 40 is 120 − 80 (looking only at the fall in supply), and 20 is 140 − 120 (looking only at the rise in demand)."},{"id":"m4-04","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government levies a tax of $10 per unit on sellers. How much tax revenue is collected?","o":["$250","$350","$400","$375"],"a":1,"e":"税后供给：Qs = (P − 10) − 20 = P − 30。令 100 − P = P − 30 → 消费者价格 P_c = 65，Q = 35，生产者得 P_s = 55。税收 = 10 × 35 = $350。$400 是用税前数量 40 计算的错误。","e_en":"After-tax supply: Qs = (P − 10) − 20 = P − 30. Set 100 − P = P − 30 → consumer price P_c = 65, Q = 35, and producers receive P_s = 55. Tax revenue = 10 × 35 = $350. $400 is the error of calculating with the pre-tax quantity of 40."},{"id":"m4-05","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In the same market (Qd = 100 − P, Qs = P − 20, $10 per-unit tax), what is the deadweight loss?","o":["$25","$50","$12.50","$35"],"a":0,"e":"税前 Q* = 40，税后 Q = 35。DWL = ½ × 税额 × 数量减少 = ½ × 10 × 5 = $25。$50 是忘记乘 ½；DWL 与税收收入 $350 不同，后者只是剩余从买卖双方转移给政府。","e_en":"Pre-tax Q* = 40 and after-tax Q = 35. DWL = ½ × tax × reduction in quantity = ½ × 10 × 5 = $25. $50 comes from forgetting to multiply by ½; DWL is different from the tax revenue of $350, which is merely surplus transferred from buyers and sellers to the government."},{"id":"m4-06","t":"m4","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In a perfectly competitive market with no externalities, a per-unit subsidy paid to producers will","o":["create a deadweight loss because units are produced whose marginal cost exceeds their marginal benefit","increase total surplus","raise the price paid by consumers","benefit only producers"],"a":0,"e":"补贴使产量超过有效水平，多生产的单位 MC > MB，产生无谓损失 (DWL)，所以政府支出大于消费者与生产者剩余增加之和。补贴使消费者价格下降，收益由买卖双方按弹性分享，而不是只惠及生产者。","e_en":"The subsidy pushes output above the efficient level; for the extra units produced, MC > MB, creating a deadweight loss (DWL), so government spending exceeds the combined increase in consumer and producer surplus. The subsidy lowers the price consumers pay, and the benefit is shared between buyers and sellers according to elasticities rather than going only to producers."},{"id":"m4-07","t":"m4","lv":3,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government pays producers a subsidy of $6 per unit. Which is correct?","o":["Consumers pay $54; the government spends $240","Consumers pay $57; the government spends $240","Consumers pay $63; the government spends $258","Consumers pay $57; the government spends $258"],"a":3,"e":"补贴后供给：Qs = (P + 6) − 20 = P − 14。令 100 − P = P − 14 → 消费者价格 P = 57，Q = 43，生产者实得 57 + 6 = 63。政府支出 = 6 × 43 = $258（用原数量 40 算得 $240 是错误）。另外 DWL = ½ × 6 × 3 = $9。","e_en":"Supply after the subsidy: Qs = (P + 6) − 20 = P − 14. Set 100 − P = P − 14 → consumer price P = 57, Q = 43, and producers receive 57 + 6 = 63. Government spending = 6 × 43 = $258 (calculating $240 using the original quantity of 40 is wrong). In addition, DWL = ½ × 6 × 3 = $9."},{"id":"m4-08","t":"m4","lv":3,"ex":["IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government restricts output with a quota of 30 units. What is the deadweight loss?","o":["$50","$100","$200","$600"],"a":1,"e":"无配额均衡 Q = 40，P = 60。配额 30 时：消费者愿付价格 = 100 − 30 = 70，边际成本（供给价）= 30 + 20 = 50。DWL = ½ × (70 − 50) × (40 − 30) = $100。$600 是配额租金 (quota rent) = 20 × 30，属于转移而非损失。","e_en":"Without the quota, equilibrium is Q = 40, P = 60. With a quota of 30: the price consumers are willing to pay = 100 − 30 = 70, and marginal cost (the supply price) = 30 + 20 = 50. DWL = ½ × (70 − 50) × (40 − 30) = $100. $600 is the quota rent = 20 × 30, which is a transfer, not a loss."},{"id":"m4-09","t":"m4","lv":3,"ex":["AP","IB","IEO","NEC"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. Instead of taxing sellers, the government levies the $10 per-unit tax on buyers. Which outcome results?","o":["The market price becomes $55; buyers pay $65 in total per unit and sellers receive $55","The market price becomes $65 and buyers bear the entire tax","Buyers bear none of the tax because sellers do not pay it","Quantity falls to 30 units"],"a":0,"e":"对买方征税使需求曲线下移 10：Qd = 100 − (P + 10) = 90 − P。令 90 − P = P − 20 → 市场价 P = 55，Q = 35。买方总成本 = 55 + 10 = 65，卖方得 55——与对卖方征税完全相同。税负归宿只取决于弹性，与法定纳税人无关。","e_en":"A tax on buyers shifts the demand curve down by 10: Qd = 100 − (P + 10) = 90 − P. Set 90 − P = P − 20 → market price P = 55, Q = 35. The buyers' total cost = 55 + 10 = 65 and sellers receive 55 — exactly the same as taxing sellers. Tax incidence depends only on elasticities, not on who is legally required to pay the tax."},{"id":"m4-10","t":"m4","lv":3,"ex":["IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. What per-unit tax maximizes the government's tax revenue?","o":["$20","$60","$80","$40"],"a":3,"e":"税额为 t 时：100 − P_c = (P_c − t) − 20 → P_c = 60 + t/2，Q = 40 − t/2 = (80 − t)/2。税收 R = t(80 − t)/2，对 t 求导：(80 − 2t)/2 = 0 → t = 40，R = 40 × 20 = $800。t = 80 时数量为 0，收入为 0——税率过高会侵蚀税基（拉弗曲线思想）。","e_en":"With a tax of t: 100 − P_c = (P_c − t) − 20 → P_c = 60 + t/2, Q = 40 − t/2 = (80 − t)/2. Tax revenue R = t(80 − t)/2; differentiating with respect to t: (80 − 2t)/2 = 0 → t = 40, R = 40 × 20 = $800. At t = 80 the quantity is 0 and revenue is 0 — a tax rate that is too high erodes the tax base (the idea behind the Laffer curve)."},{"id":"m5-01","t":"m5","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The table shows Leo's total utility from slices of pizza. What is the marginal utility of the third slice?","tbl":[["Slices","Total utility"],["0","0"],["1","10"],["2","18"],["3","24"],["4","28"],["5","30"]],"o":["24","8","4","6"],"a":3,"e":"边际效用 (MU) = ΔTU ÷ ΔQ = TU(3) − TU(2) = 24 − 18 = 6。24 是总效用；8 是第 2 片的 MU；4 是第 4 片的 MU。表格同时显示了边际效用递减。","e_en":"Marginal utility (MU) = ΔTU ÷ ΔQ = TU(3) − TU(2) = 24 − 18 = 6. 24 is total utility; 8 is the MU of the 2nd slice; 4 is the MU of the 4th slice. The table also illustrates diminishing marginal utility."},{"id":"m5-02","t":"m5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The price of good X is $2 and the price of good Y is $4. At her current bundle, Sara's marginal utility of X is 20 and her marginal utility of Y is 30. To increase total utility without spending more, she should","o":["buy more X and less Y","buy more Y and less X","keep her current bundle, since MU of Y is higher","buy more of both goods"],"a":0,"e":"比较每美元边际效用：MU_X/P_X = 20/2 = 10，MU_Y/P_Y = 30/4 = 7.5。X 的每美元 MU 更高，应把支出从 Y 转向 X，直到两者相等。只比较 MU 大小（30 > 20）而不除以价格是常见错误。","e_en":"Compare marginal utility per dollar: MU_X/P_X = 20/2 = 10 and MU_Y/P_Y = 30/4 = 7.5. X has the higher MU per dollar, so she should shift spending from Y to X until the two are equal. Comparing only the size of MU (30 > 20) without dividing by price is a common mistake."},{"id":"m5-03","t":"m5","lv":2,"ex":["AP","AL","NEC"],"q":"Jamal has $10. Good X costs $2 and good Y costs $1. His marginal utilities are shown below. Which bundle maximizes his total utility while spending all $10?","tbl":[["Unit","MU of X","MU of Y"],["1st","16","10"],["2nd","12","8"],["3rd","8","6"],["4th","4","4"],["5th","—","3"],["6th","—","2"]],"o":["2 X and 6 Y","4 X and 2 Y","3 X and 4 Y","1 X and 6 Y"],"a":2,"e":"每美元边际效用：X 为 8、6、4、2；Y 为 10、8、6、4、3、2。按从高到低购买，直到用完 $10，得到 3X + 4Y（花费 6 + 4 = 10），此时 MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1。总效用：3X4Y = 36 + 28 = 64；2X6Y = 28 + 33 = 61；4X2Y = 40 + 18 = 58；1X6Y 只花 $8，总效用 49。","e_en":"Marginal utility per dollar: for X, 8, 6, 4, 2; for Y, 10, 8, 6, 4, 3, 2. Buying from highest to lowest until the $10 is used up gives 3X + 4Y (spending 6 + 4 = 10), at which point MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1. Total utility: 3X4Y = 36 + 28 = 64; 2X6Y = 28 + 33 = 61; 4X2Y = 40 + 18 = 58; 1X6Y spends only $8, with total utility 49."},{"id":"m5-04","t":"m5","lv":1,"ex":["AL","IB","IEO"],"q":"A consumer has an income of $60. Good X (horizontal axis) costs $3 and good Y (vertical axis) costs $6. Which describes the budget line?","o":["X-intercept 20, Y-intercept 10, slope −2","X-intercept 20, Y-intercept 10, slope −0.5","X-intercept 10, Y-intercept 20, slope −0.5","X-intercept 20, Y-intercept 10, slope −1"],"a":1,"e":"全部买 X：60/3 = 20；全部买 Y：60/6 = 10。斜率 = −P_X/P_Y = −3/6 = −0.5（也等于 −10/20）。−2 是把价格比颠倒。","e_en":"Buying only X: 60/3 = 20; buying only Y: 60/6 = 10. Slope = −P_X/P_Y = −3/6 = −0.5 (also equal to −10/20). −2 comes from inverting the price ratio."},{"id":"m5-05","t":"m5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The price of an inferior (but not Giffen) good falls. Which statement is correct?","o":["Both the substitution and income effects increase quantity demanded","The substitution effect decreases quantity demanded, and the income effect increases it","The substitution effect increases quantity demanded, the income effect decreases it, and the substitution effect dominates","The income effect dominates, so quantity demanded falls"],"a":2,"e":"价格下降时替代效应 (substitution effect) 总是增加需求量；实际收入上升，对劣等品 (inferior good) 的收入效应 (income effect) 使需求量减少。非吉芬劣等品替代效应占主导，需求量净上升，需求曲线仍向下倾斜。收入效应占主导是吉芬商品 (Giffen good) 的情形。","e_en":"When price falls, the substitution effect always increases quantity demanded; real income rises, and for an inferior good the income effect reduces quantity demanded. For a non-Giffen inferior good the substitution effect dominates, so quantity demanded rises on balance and the demand curve still slopes downward. The income effect dominating is the case of a Giffen good."},{"id":"m5-06","t":"m5","lv":3,"ex":["AL","IEO"],"q":"A consumer has utility U = X·Y, income $120, P_X = $2 and P_Y = $4. What is the utility-maximizing bundle?","o":["X = 20, Y = 20","X = 40, Y = 10","X = 60, Y = 0","X = 30, Y = 15"],"a":3,"e":"最优条件 MRS = MU_X/MU_Y = Y/X = P_X/P_Y = 1/2 → X = 2Y。代入预算 2X + 4Y = 120 → 8Y = 120 → Y = 15，X = 30（即 X = I/(2P_X)）。效用 = 450，高于 (20,20) 的 400 和 (40,10) 的 400；(60,0) 效用为 0。","e_en":"Optimum condition: MRS = MU_X/MU_Y = Y/X = P_X/P_Y = 1/2 → X = 2Y. Substituting into the budget 2X + 4Y = 120 → 8Y = 120 → Y = 15, X = 30 (i.e. X = I/(2P_X)). Utility = 450, higher than the 400 at (20,20) and the 400 at (40,10); (60,0) gives utility of 0."},{"id":"m5-07","t":"m5","lv":3,"ex":["IEO"],"q":"With U = X·Y, income $120 and P_Y = $4, the price of X rises from $2 to $4. Using the Hicksian decomposition (holding utility constant), which is closest to the change in quantity of X?","o":["Total −15; substitution effect −8.8; income effect −6.2","Total −15; substitution effect −7.5; income effect −7.5","Total −10; substitution effect −5; income effect −5","Total −15; substitution effect −6.2; income effect −8.8"],"a":0,"e":"原来 X = 120/(2×2) = 30，Y = 15，U = 450；涨价后 X = 120/(2×4) = 15，总效应 −15。希克斯补偿：新价格下 P_X = P_Y，最优 X = Y，且 XY = 450 → X = √450 ≈ 21.2。替代效应 = 21.2 − 30 ≈ −8.8，收入效应 = 15 − 21.2 ≈ −6.2。−7.5/−7.5 是斯勒茨基 (Slutsky) 分解（保持原组合可负担，补偿收入 180，X = 22.5）的结果，而题目要求保持效用不变。","e_en":"Originally X = 120/(2×2) = 30, Y = 15, U = 450; after the price rise X = 120/(2×4) = 15, a total effect of −15. Hicksian compensation: at the new prices P_X = P_Y, so the optimum has X = Y, and XY = 450 → X = √450 ≈ 21.2. Substitution effect = 21.2 − 30 ≈ −8.8, income effect = 15 − 21.2 ≈ −6.2. −7.5/−7.5 is the result of the Slutsky decomposition (keeping the original bundle affordable, with compensated income of 180 and X = 22.5), whereas the question asks for utility to be held constant."},{"id":"m5-08","t":"m5","lv":1,"ex":["IB","IEO","NEC"],"q":"People typically feel the pain of losing $100 more strongly than the pleasure of gaining $100. This is known as","o":["loss aversion","anchoring","present bias","diminishing marginal utility of money"],"a":0,"e":"这是损失厌恶 (loss aversion)：损失的心理权重大于同等收益。锚定 (anchoring) 是受初始参照数字影响；现时偏好 (present bias) 与时间选择有关；边际效用递减描述的是财富越多额外收益越小，并不能解释得失的不对称。","e_en":"This is loss aversion: losses carry more psychological weight than equal gains. Anchoring is being influenced by an initial reference number; present bias relates to choices over time; diminishing marginal utility describes how the extra benefit gets smaller as wealth increases, and cannot explain the asymmetry between gains and losses."},{"id":"m5-09","t":"m5","lv":2,"ex":["IB","IEO","NEC"],"q":"A government changes workplace pension schemes so that employees are automatically enrolled unless they choose to opt out. Participation rises sharply. This policy is best described as","o":["a nudge that uses the default option (choice architecture)","a mandate that removes freedom of choice","a subsidy that changes relative prices","an example of anchoring by employers"],"a":0,"e":"自动加入 (auto-enrollment) 只改变默认选项，员工仍可自由退出，没有改变经济激励——这是典型的助推 (nudge) / 选择架构 (choice architecture)，利用了人们的惰性和维持现状偏好 (status quo bias)。强制要求会取消选择；补贴会改变相对价格。","e_en":"Auto-enrollment only changes the default option; employees are still free to opt out, and economic incentives are unchanged — this is a classic nudge / choice architecture, which takes advantage of people's inertia and status quo bias. A mandatory requirement would remove choice; a subsidy would change relative prices."},{"id":"m5-10","t":"m5","lv":2,"ex":["IB","IEO","NEC"],"q":"Kim prefers $100 today to $110 in one week, but prefers $110 in 53 weeks to $100 in 52 weeks. This pattern of choices is best explained by","o":["loss aversion","the endowment effect","anchoring","present bias (hyperbolic discounting)"],"a":3,"e":"两个选择的等待时间都是 1 周、回报差都是 $10，理性的指数贴现者应作出相同选择。Kim 对“现在”特别看重，而对遥远未来较有耐心，属于现时偏好 (present bias) / 双曲贴现 (hyperbolic discounting)，会导致时间不一致 (time inconsistency)，如拖延和储蓄不足。","e_en":"In both choices the wait is 1 week and the difference in reward is $10, so a rational exponential discounter should make the same choice both times. Kim places special weight on \"now\" but is relatively patient about the distant future — this is present bias / hyperbolic discounting, which leads to time inconsistency, such as procrastination and undersaving."},{"id":"m6-01","t":"m6","lv":1,"ex":["AP","IB","NEC"],"q":"The table shows a bakery's total product (TP) as the number of workers changes, with the oven fixed. Diminishing marginal returns begin with the addition of which worker?","tbl":[["Workers (L)","TP"],["0","0"],["1","10"],["2","25"],["3","35"],["4","40"]],"o":["The 2nd worker","The 3rd worker","The 4th worker","The 1st worker"],"a":1,"e":"边际产量 (MP) = ΔTP/ΔL：10、15、10、5。第 2 名工人 MP 上升到 15，从第 3 名工人开始 MP 下降（15→10），因此边际收益递减始于第 3 名工人。易错选第 4 名（误以为要等增量明显变小）或第 2 名；递减从 MP 开始下降时就已发生，与 TP 是否仍上升无关。","e_en":"Marginal product (MP) = ΔTP/ΔL: 10, 15, 10, 5. MP rises to 15 for the 2nd worker, and from the 3rd worker onwards MP falls (15→10), so diminishing marginal returns begin with the 3rd worker. A common mistake is to choose the 4th worker (thinking you must wait until the increase becomes noticeably smaller) or the 2nd; diminishing returns set in as soon as MP starts to fall, regardless of whether TP is still rising."},{"id":"m6-02","t":"m6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A firm has fixed costs of $100. When it produces 20 units, its total cost is $300. What is its average variable cost (AVC) at this output?","o":["$15","$5","$20","$10"],"a":3,"e":"VC = TC − FC = 300 − 100 = 200；AVC = VC/Q = 200/20 = 10 美元。$15 是 ATC (300/20)，$5 是 AFC (100/20)，都是常见混淆。","e_en":"VC = TC − FC = 300 − 100 = 200; AVC = VC/Q = 200/20 = $10. $15 is ATC (300/20) and $5 is AFC (100/20); both are common mix-ups."},{"id":"m6-03","t":"m6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"As a firm increases output in the short run, which cost always decreases?","o":["Average variable cost","Average fixed cost","Marginal cost","Average total cost"],"a":1,"e":"平均固定成本 (AFC) = FC/Q，FC 不变而 Q 增大，AFC 持续下降。AVC、ATC 呈 U 形，MC 由于边际收益递减最终上升，都不会“总是”下降。","e_en":"Average fixed cost (AFC) = FC/Q; FC is constant while Q increases, so AFC falls continuously. AVC and ATC are U-shaped, and MC eventually rises because of diminishing marginal returns, so none of them \"always\" falls."},{"id":"m6-04","t":"m6","lv":1,"ex":["AP","IB","AL","NEC","IEO"],"q":"Maria quits a job paying $50,000 a year to run her own shop. The shop earns revenue of $180,000 and pays $110,000 in wages, rent and materials. What are her accounting profit and economic profit?","o":["Accounting profit $70,000; economic profit $70,000","Accounting profit $20,000; economic profit $70,000","Accounting profit $120,000; economic profit $20,000","Accounting profit $70,000; economic profit $20,000"],"a":3,"e":"会计利润 (accounting profit) = 收入 − 显性成本 = 180000 − 110000 = 70000。经济利润 (economic profit) 还要减去隐性成本（放弃的工资 50000）：70000 − 50000 = 20000。两者不能颠倒：经济利润 ≤ 会计利润。","e_en":"Accounting profit = revenue − explicit costs = 180000 − 110000 = 70000. Economic profit also subtracts implicit costs (the forgone salary of 50000): 70000 − 50000 = 20000. Do not reverse the two: economic profit ≤ accounting profit."},{"id":"m6-05","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Using the cost data below (fixed cost = $50), at what output is average variable cost (AVC) minimized?","tbl":[["Q","TC ($)"],["0","50"],["1","80"],["2","100"],["3","114"],["4","136"],["5","170"]],"o":["2 units","3 units","4 units","5 units"],"a":1,"e":"VC = TC − 50：30、50、64、86、120；AVC = 30、25、21.33、21.5、24，Q = 3 时最低。也可用 MC 判断：MC = 30、20、14、22、34，第 4 单位 MC = 22 > AVC(3) = 21.33，AVC 开始上升。易错选 4：ATC 在 Q = 4、5 时最低（均为 34），不要把 ATC 与 AVC 混淆。","e_en":"VC = TC − 50: 30, 50, 64, 86, 120; AVC = 30, 25, 21.33, 21.5, 24, which is lowest at Q = 3. You can also use MC to decide: MC = 30, 20, 14, 22, 34; the MC of the 4th unit = 22 > AVC(3) = 21.33, so AVC starts to rise. A common mistake is to choose 4: ATC is lowest at Q = 4 and 5 (34 in both cases) — do not confuse ATC with AVC."},{"id":"m6-06","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"If a firm's marginal cost is currently below its average total cost, then increasing output by one unit will","o":["increase average total cost","leave average total cost unchanged","decrease average total cost","increase average fixed cost"],"a":2,"e":"边际与平均的关系：边际值低于平均值时会把平均值拉低，所以 MC < ATC 时 ATC 下降。这也是 MC 必然从下方穿过 ATC 最低点的原因。MC 本身此时可能在上升，但这不改变 ATC 下降的结论。","e_en":"The relationship between marginal and average: when the marginal value is below the average, it pulls the average down, so when MC < ATC, ATC falls. This is also why MC must cut ATC from below at the minimum of ATC. MC itself may be rising at this point, but that does not change the conclusion that ATC is falling."},{"id":"m6-07","t":"m6","lv":2,"ex":["AP","IB","AL","IEO"],"q":"A firm doubles all of its inputs (labour, capital, land) and its output more than doubles. This firm is experiencing","o":["economies of scale","diminishing marginal returns","diseconomies of scale","increasing marginal cost"],"a":0,"e":"所有投入同比增加是长期概念。产出增长超过投入增长 ⇒ 规模报酬递增 (increasing returns to scale)，长期平均成本下降，即规模经济 (economies of scale)。边际收益递减是短期概念（有固定要素），不适用于“所有投入都翻倍”的情形。","e_en":"Increasing all inputs in the same proportion is a long-run concept. Output growing faster than inputs ⇒ increasing returns to scale, so long-run average cost falls, i.e. economies of scale. Diminishing marginal returns is a short-run concept (there is a fixed factor) and does not apply when \"all inputs are doubled\"."},{"id":"m6-08","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Which of the following changes would shift a firm's average total cost (ATC) curve but leave its marginal cost (MC) curve unchanged?","o":["An increase in the wage rate of its workers","An increase in the price of raw materials","An increase in the annual licence fee the firm must pay","A per-unit tax on each unit produced"],"a":2,"e":"年度执照费是固定成本 (FC)，与产量无关，会使 AFC 和 ATC 上移，但不影响 MC（MC 只取决于可变成本）。工资、原材料价格和从量税都会增加每多生产一单位的成本，因此会使 MC 上移。","e_en":"An annual licence fee is a fixed cost (FC) that does not depend on output; it shifts AFC and ATC upwards but does not affect MC (MC depends only on variable costs). Wages, raw-material prices and a per-unit tax all increase the cost of producing each additional unit, so they shift MC upwards."},{"id":"m6-09","t":"m6","lv":3,"ex":["IEO","NEC","AP"],"q":"A firm's short-run total cost is TC = 100 + 4Q + Q². What is the minimum value of its average total cost (ATC)?","o":["$24","$14","$20","$29"],"a":0,"e":"ATC = 100/Q + 4 + Q。令 d(ATC)/dQ = −100/Q² + 1 = 0 ⇒ Q = 10，ATC = 10 + 4 + 10 = 24。验证：MC = 4 + 2Q = 24，在 ATC 最低点 MC = ATC。$14 是忘了加 AFC（只算 4 + Q），$29 是 Q = 5 时的 ATC (20 + 4 + 5)。","e_en":"ATC = 100/Q + 4 + Q. Setting d(ATC)/dQ = −100/Q² + 1 = 0 ⇒ Q = 10, ATC = 10 + 4 + 10 = 24. Check: MC = 4 + 2Q = 24, so MC = ATC at the minimum of ATC. $14 comes from forgetting to add AFC (calculating only 4 + Q), and $29 is ATC at Q = 5 (20 + 4 + 5)."},{"id":"m6-10","t":"m6","lv":3,"ex":["IEO","AL"],"q":"A firm's short-run production function is Q = 6L² − 0.2L³, where L is labour. At what level of L is the average product of labour (AP) at its maximum?","o":["L = 15","L = 10","L = 20","L = 30"],"a":0,"e":"AP = Q/L = 6L − 0.2L²，令 dAP/dL = 6 − 0.4L = 0 ⇒ L = 15，此时 AP = 90 − 45 = 45。验证：MP = 12L − 0.6L² 在 L = 15 时 = 180 − 135 = 45 = AP，符合“MP 穿过 AP 最高点”。L = 10 是 MP 最大值 (12 − 1.2L = 0)；L = 20 是 MP = 0、TP 最大处；L = 30 时 Q = 0。","e_en":"AP = Q/L = 6L − 0.2L²; setting dAP/dL = 6 − 0.4L = 0 ⇒ L = 15, where AP = 90 − 45 = 45. Check: MP = 12L − 0.6L², which at L = 15 = 180 − 135 = 45 = AP, consistent with \"MP cuts AP at its maximum\". L = 10 is where MP is at its maximum (12 − 1.2L = 0); L = 20 is where MP = 0 and TP is at its maximum; at L = 30, Q = 0."},{"id":"m7-01","t":"m7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A perfectly competitive firm faces a market price of $12. At the output where P = MC, it produces 50 units and its average total cost is $10. What is its economic profit?","o":["$600","$500","$120","$100"],"a":3,"e":"利润 = (P − ATC) × Q = (12 − 10) × 50 = 100 美元。$600 是总收益 (12×50)，$500 是总成本 (10×50)。","e_en":"Profit = (P − ATC) × Q = (12 − 10) × 50 = $100. $600 is total revenue (12×50) and $500 is total cost (10×50)."},{"id":"m7-02","t":"m7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which characteristic distinguishes monopolistic competition from perfect competition?","o":["Firms sell differentiated products","There are many buyers and sellers","Entry and exit are free in the long run","Firms earn zero economic profit in the long run"],"a":0,"e":"垄断竞争与完全竞争都有大量买卖者、自由进出、长期经济利润为零；关键区别是垄断竞争厂商销售差异化产品 (differentiated products)，因此面对向下倾斜的需求曲线、拥有一定定价权。","e_en":"Monopolistic competition and perfect competition both have many buyers and sellers, free entry and exit, and zero economic profit in the long run; the key difference is that firms in monopolistic competition sell differentiated products, so they face a downward-sloping demand curve and have some pricing power."},{"id":"m7-03","t":"m7","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following is the best example of a natural monopoly?","o":["A patented new drug","A restaurant that is the only one in a small town","A city's water-pipe distribution network","A cartel of oil-exporting countries"],"a":2,"e":"自然垄断 (natural monopoly) 源于巨大的规模经济：LRATC 在整个市场需求范围内下降，一家厂商供应成本最低，例如自来水管网。专利药是法律壁垒造成的垄断；小镇餐馆是市场规模导致的地方垄断，但不具备巨大规模经济；卡特尔是寡头合谋而非自然垄断。","e_en":"A natural monopoly arises from very large economies of scale: LRATC is falling over the entire range of market demand, so a single firm can supply at the lowest cost — for example, a water-supply network. A patented drug is a monopoly created by a legal barrier; a small-town restaurant is a local monopoly caused by the size of the market, but it does not enjoy large economies of scale; a cartel is collusion among oligopolists, not a natural monopoly."},{"id":"m7-04","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In the short run, a perfectly competitive firm faces a price of $6. At its best output, AVC = $7 and ATC = $10. Its fixed cost is $200. What should the firm do, and what is its loss?","o":["Keep producing; loss is less than $200","Shut down; loss equals $200","Keep producing; loss equals $200","Shut down; loss equals $0"],"a":1,"e":"停业规则 (shutdown rule)：P = 6 < AVC = 7，价格连可变成本都覆盖不了，生产每单位都额外亏 1 美元，因此应停产。停产时 TR = 0、VC = 0，亏损等于固定成本 200 美元。若价格介于 AVC 和 ATC 之间才应继续生产。","e_en":"Shutdown rule: P = 6 < AVC = 7, so the price does not even cover variable cost, and every unit produced adds a further $1 to the loss; the firm should therefore shut down. When it shuts down, TR = 0 and VC = 0, and its loss equals its fixed cost of $200. It should continue producing only if the price lies between AVC and ATC."},{"id":"m7-05","t":"m7","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"A monopolist faces demand P = 100 − 2Q and has a constant marginal cost of $20. What are its profit-maximizing output and price?","o":["Q = 20, P = 60","Q = 40, P = 20","Q = 20, P = 20","Q = 30, P = 40"],"a":0,"e":"线性需求 P = 100 − 2Q ⇒ MR = 100 − 4Q。令 MR = MC：100 − 4Q = 20 ⇒ Q = 20，再代回需求曲线 P = 100 − 40 = 60。Q = 40、P = 20 是完全竞争结果 (P = MC)；P = 20 是错把价格读在 MC 上。","e_en":"Linear demand P = 100 − 2Q ⇒ MR = 100 − 4Q. Setting MR = MC: 100 − 4Q = 20 ⇒ Q = 20; substituting back into the demand curve, P = 100 − 40 = 60. Q = 40, P = 20 is the perfectly competitive outcome (P = MC); P = 20 comes from wrongly reading the price off MC."},{"id":"m7-06","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Four firms in an industry have market shares of 40%, 30%, 20% and 10%. What is the Herfindahl–Hirschman Index (HHI)?","o":["100","2,500","1,000","3,000"],"a":3,"e":"HHI = Σs² = 40² + 30² + 20² + 10² = 1600 + 900 + 400 + 100 = 3000（高度集中）。100 是四厂商集中度 CR4 (%)；2500 是四家平分 25% 时的 HHI (4 × 625)。","e_en":"HHI = Σs² = 40² + 30² + 20² + 10² = 1600 + 900 + 400 + 100 = 3000 (highly concentrated). 100 is the four-firm concentration ratio CR4 (%); 2500 is the HHI when the four firms each have an equal 25% share (4 × 625)."},{"id":"m7-07","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In long-run equilibrium, a firm in monopolistic competition will","o":["charge a price equal to MC and minimum ATC","earn positive economic profit because its product is differentiated","charge a price equal to ATC but above MC","produce at the minimum point of its ATC curve"],"a":2,"e":"长期自由进入使需求曲线与 ATC 相切：P = ATC，经济利润为 0；但需求向下倾斜，MR < P，而 MR = MC ⇒ P > MC（非配置效率），且切点位于 ATC 最低点左侧（过剩产能 excess capacity，非生产效率）。P = MC = 最低 ATC 是完全竞争的长期均衡。","e_en":"In the long run free entry makes the demand curve tangent to ATC: P = ATC, so economic profit is 0; but demand slopes downward, so MR < P, and since MR = MC ⇒ P > MC (not allocatively efficient). Moreover, the tangency point lies to the left of the minimum of ATC (excess capacity, not productively efficient). P = MC = minimum ATC is the long-run equilibrium of perfect competition."},{"id":"m7-08","t":"m7","lv":3,"ex":["IEO","NEC","AL"],"q":"A monopolist with constant MC = $10 sells in two separated markets. Demand in market 1 is P₁ = 50 − Q₁ and in market 2 is P₂ = 30 − Q₂. With third-degree price discrimination, what prices does it charge?","o":["P₁ = $20, P₂ = $30","P₁ = $30, P₂ = $20","P₁ = P₂ = $25","P₁ = $40, P₂ = $20"],"a":1,"e":"三级价格歧视：各市场分别令 MR = MC。市场 1：MR₁ = 50 − 2Q₁ = 10 ⇒ Q₁ = 20，P₁ = 30。市场 2：MR₂ = 30 − 2Q₂ = 10 ⇒ Q₂ = 10，P₂ = 20。检验勒纳指数：市场 1 |PED| = (P/Q)×1 = 1.5，(30−10)/30 = 2/3 = 1/1.5；市场 2 |PED| = 2，(20−10)/20 = 1/2。弹性较小的市场 1 定价更高。","e_en":"Third-degree price discrimination: set MR = MC separately in each market. Market 1: MR₁ = 50 − 2Q₁ = 10 ⇒ Q₁ = 20, P₁ = 30. Market 2: MR₂ = 30 − 2Q₂ = 10 ⇒ Q₂ = 10, P₂ = 20. Check with the Lerner index: in market 1, |PED| = (P/Q)×1 = 1.5, and (30−10)/30 = 2/3 = 1/1.5; in market 2, |PED| = 2, and (20−10)/20 = 1/2. Market 1, where demand is less elastic, is charged the higher price."},{"id":"m7-09","t":"m7","lv":3,"ex":["IEO","AL"],"q":"Two identical firms compete in quantities (Cournot). Market demand is P = 120 − Q, where Q = q₁ + q₂, and each firm has zero marginal cost. What is the equilibrium market price?","o":["$60","$0","$40","$30"],"a":2,"e":"企业 1 利润 π₁ = (120 − q₁ − q₂)q₁，一阶条件 120 − 2q₁ − q₂ = 0 ⇒ 反应函数 q₁ = 60 − q₂/2。对称时 q = 60 − q/2 ⇒ q = 40，总产量 Q = 80，P = 120 − 80 = 40。$60 是垄断（或完美卡特尔）价格 (Q = 60)，$0 是完全竞争/伯特兰价格 (P = MC)。古诺均衡介于两者之间。","e_en":"Firm 1's profit is π₁ = (120 − q₁ − q₂)q₁; the first-order condition 120 − 2q₁ − q₂ = 0 ⇒ reaction function q₁ = 60 − q₂/2. With symmetry, q = 60 − q/2 ⇒ q = 40, total output Q = 80, and P = 120 − 80 = 40. $60 is the monopoly (or perfect cartel) price (Q = 60), and $0 is the perfectly competitive/Bertrand price (P = MC). The Cournot equilibrium lies between the two."},{"id":"m7-10","t":"m7","lv":3,"ex":["IEO","NEC","AP","IB"],"q":"A regulator requires a natural monopoly to set price equal to marginal cost. Which outcome is most likely?","o":["The firm earns normal profit and output is allocatively efficient","Output falls below the unregulated monopoly level","The firm earns supernormal profit because demand is inelastic","Output is allocatively efficient but the firm makes a loss and may need a subsidy"],"a":3,"e":"自然垄断的 LRATC 在相关产量范围内一直下降，因此 MC < ATC。按 P = MC 定价实现配置效率，但 P < ATC，厂商亏损，需要补贴或两部制收费。P = ATC（公平回报）管制才会使厂商获得正常利润，但此时 P > MC，未达到配置效率。","e_en":"A natural monopoly's LRATC falls throughout the relevant range of output, so MC < ATC. Pricing at P = MC achieves allocative efficiency, but P < ATC, so the firm makes a loss and needs a subsidy or a two-part tariff. Only regulation at P = ATC (fair return) lets the firm earn normal profit, but then P > MC and allocative efficiency is not achieved."},{"id":"m8-01","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"Two firms, A and B, each choose a High or Low price. Payoffs (profit in $m) are shown as (A, B). What is the Nash equilibrium outcome?","tbl":[["","B: High price","B: Low price"],["A: High price","(10, 10)","(2, 14)"],["A: Low price","(14, 2)","(5, 5)"]],"o":["Both choose High price, earning (10, 10)","A chooses Low and B chooses High, earning (14, 2)","There is no Nash equilibrium","Both choose Low price, earning (5, 5)"],"a":3,"e":"对 A：若 B 选 High，Low 得 14 > 10；若 B 选 Low，Low 得 5 > 2 ⇒ Low 是 A 的占优策略 (dominant strategy)，B 对称。纳什均衡 (Low, Low)，收益 (5,5)。(High, High) 虽然对双方更好，但任一方都有单方面偏离到 Low 的激励，所以不是均衡——这就是囚徒困境。","e_en":"For A: if B chooses High, Low gives 14 > 10; if B chooses Low, Low gives 5 > 2 ⇒ Low is A's dominant strategy, and B is symmetric. The Nash equilibrium is (Low, Low) with payoffs (5,5). Although (High, High) is better for both, each firm has an incentive to deviate unilaterally to Low, so it is not an equilibrium — this is the prisoner's dilemma."},{"id":"m8-02","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"A player has a dominant strategy when","o":["one strategy gives the highest payoff regardless of what the other player does","the strategy maximizes the combined payoff of both players","the strategy yields the highest payoff only if the rival cooperates","the player moves first in a sequential game"],"a":0,"e":"占优策略 (dominant strategy) 是无论对手如何选择都能给自己带来更高收益的策略。它关注的是个人收益而非联合收益；也与行动顺序无关。","e_en":"A dominant strategy is one that gives a player a higher payoff whatever the opponent chooses. It concerns the player's own payoff, not the joint payoff, and it has nothing to do with the order of moves."},{"id":"m8-03","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"The prisoner's dilemma illustrates that","o":["players always cooperate when they can communicate","individually rational choices can lead to an outcome that is worse for all players","a Nash equilibrium always maximizes total payoffs","a dominant strategy never exists in a game"],"a":1,"e":"囚徒困境中每个人都有背叛的占优策略，均衡结果对所有人都劣于合作结果：个人理性 ≠ 集体理性。即使可以沟通，一次性博弈中的承诺也不可信；纳什均衡并不保证总收益最大；且该博弈恰恰存在占优策略。","e_en":"In the prisoner's dilemma each player has a dominant strategy to defect, and the equilibrium outcome is worse for everyone than the cooperative outcome: individual rationality ≠ collective rationality. Even if the players can communicate, promises in a one-shot game are not credible; a Nash equilibrium does not guarantee the maximum total payoff; and this game does in fact have dominant strategies."},{"id":"m8-04","t":"m8","lv":1,"ex":["AP","NEC","IEO"],"q":"In a repeated game, a player using the tit-for-tat strategy will","o":["defect in every round regardless of the rival's behaviour","cooperate until the rival defects once and then defect forever","cooperate in the first round and then copy the rival's previous move","randomly choose between cooperating and defecting"],"a":2,"e":"以牙还牙 (tit-for-tat)：第一轮合作，之后每轮复制对手上一轮行动。“一旦背叛就永远背叛”是冷酷触发策略 (grim trigger)，比 TFT 更严厉、不宽容。","e_en":"Tit-for-tat: cooperate in the first round, then in each round copy the opponent's action from the previous round. \"Once the opponent defects, defect forever\" is the grim-trigger strategy, which is harsher and less forgiving than TFT."},{"id":"m8-05","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"In the game below, payoffs are (Row, Column). Which strategy pair is the Nash equilibrium?","tbl":[["","Column: Left","Column: Right"],["Row: Up","(5, 2)","(3, 4)"],["Row: Down","(4, 3)","(2, 1)"]],"o":["(Up, Left)","(Up, Right)","(Down, Left)","There is no pure-strategy Nash equilibrium"],"a":1,"e":"Row 的收益：选 Up 时 5 或 3，选 Down 时 4 或 2，Up 在两列都更好 ⇒ Up 是 Row 的占优策略。Column 没有占优策略：给定 Up，Right 得 4 > Left 得 2。所以纳什均衡为 (Up, Right)，收益 (3,4)。(Up, Left) 中 Column 会偏离到 Right；(Down, Left) 中 Row 会偏离到 Up (5 > 4)。","e_en":"Row's payoffs: Up gives 5 or 3, Down gives 4 or 2, so Up is better in both columns ⇒ Up is Row's dominant strategy. Column has no dominant strategy: given Up, Right gives 4 > Left's 2. So the Nash equilibrium is (Up, Right), with payoffs (3,4). In (Up, Left), Column would deviate to Right; in (Down, Left), Row would deviate to Up (5 > 4)."},{"id":"m8-06","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"Two tech firms must choose a charging-port standard. Payoffs are (Firm 1, Firm 2). How many pure-strategy Nash equilibria does this game have?","tbl":[["","Firm 2: Standard X","Firm 2: Standard Y"],["Firm 1: Standard X","(2, 1)","(0, 0)"],["Firm 1: Standard Y","(0, 0)","(1, 2)"]],"o":["Two","One","Zero","Four"],"a":0,"e":"这是协调博弈 (coordination game)。(Standard X, Standard X)：双方单方面偏离都得 0，是纳什均衡；(Standard Y, Standard Y) 同理。两个不一致的格子中任一方都愿改变。所以有两个纯策略纳什均衡——说明纳什均衡未必唯一，也说明为何行业标准常需先动者或协调机制。","e_en":"This is a coordination game. At (Standard X, Standard X), either firm that deviates unilaterally gets 0, so it is a Nash equilibrium; the same applies to (Standard Y, Standard Y). In the two mismatched cells, either firm would want to switch. So there are two pure-strategy Nash equilibria — showing that a Nash equilibrium need not be unique, and also why industry standards often need a first mover or a coordination mechanism."},{"id":"m8-07","t":"m8","lv":2,"ex":["AP","NEC","IEO"],"q":"A potential entrant chooses Enter or Stay Out. If it enters, the incumbent chooses Fight (price war) or Accommodate. Payoffs (Entrant, Incumbent): Stay Out (0, 10); Enter & Fight (−2, 2); Enter & Accommodate (3, 5). Using backward induction, what is the subgame-perfect outcome?","o":["Stay Out, because the incumbent threatens to fight","Enter; the incumbent fights","Enter; the incumbent accommodates","Stay Out; the incumbent accommodates"],"a":2,"e":"逆向归纳 (backward induction)：若进入发生，在位者比较打价格战 2 与容纳 5，选择容纳。进入者预期进入得 3 > 不进入 0，所以进入。“你进来我就打”是不可信威胁 (non-credible threat)，因为真到那一步打价格战对在位者自己不利。","e_en":"Backward induction: if entry occurs, the incumbent compares 2 from a price war with 5 from accommodating, and chooses to accommodate. The entrant expects 3 from entering > 0 from staying out, so it enters. \"If you come in, I'll fight\" is a non-credible threat, because when that point is actually reached, a price war would hurt the incumbent itself."},{"id":"m8-08","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"Which factor makes collusion among oligopolists MOST likely to be sustained?","o":["There is a large number of firms in the market","Firms interact repeatedly with no known end date","Rivals' prices are secret and hard to observe","The game is played once only"],"a":1,"e":"无限（或终点不确定）重复博弈中，今天背叛会招致未来惩罚，合作可以维持。厂商越多越难协调和监督；价格不透明时背叛难以发现；一次性博弈中背叛是占优策略。","e_en":"In an infinitely repeated game (or one with an uncertain end point), defecting today invites future punishment, so cooperation can be sustained. The more firms there are, the harder it is to coordinate and monitor; when prices are not transparent, cheating is hard to detect; and in a one-shot game defecting is a dominant strategy."},{"id":"m8-09","t":"m8","lv":3,"ex":["IEO","NEC"],"q":"Two firms play the pricing game below infinitely many times. Each uses a grim-trigger strategy: charge High as long as both have always charged High; otherwise charge Low forever. Payoffs are per period, (A, B), and future payoffs are discounted by factor δ. What is the minimum δ for which collusion on High is sustainable?","tbl":[["","B: High price","B: Low price"],["A: High price","(10, 10)","(2, 14)"],["A: Low price","(14, 2)","(5, 5)"]],"o":["5/9","2/7","1/2","4/9"],"a":3,"e":"合作的现值：10/(1−δ)。背叛：当期 14，之后每期 5，现值 14 + 5δ/(1−δ)。合作条件 10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14(1−δ) + 5δ ⇒ 9δ ≥ 4 ⇒ δ ≥ 4/9 ≈ 0.44。一般公式 δ ≥ (π_D − π_C)/(π_D − π_N) = (14−10)/(14−5) = 4/9。5/9 是把分子分母写成 (10−5)/9 的常见错误。","e_en":"Present value of cooperating: 10/(1−δ). Defecting: 14 in the current period, then 5 in every period after, with present value 14 + 5δ/(1−δ). Condition for cooperation: 10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14(1−δ) + 5δ ⇒ 9δ ≥ 4 ⇒ δ ≥ 4/9 ≈ 0.44. General formula: δ ≥ (π_D − π_C)/(π_D − π_N) = (14−10)/(14−5) = 4/9. 5/9 is the common mistake of writing the fraction as (10−5)/9."},{"id":"m8-10","t":"m8","lv":3,"ex":["IEO"],"q":"In the game below (payoffs are Row, Column), there is no pure-strategy Nash equilibrium. In the mixed-strategy Nash equilibrium, with what probability does Row play Top?","tbl":[["","Column: Left","Column: Right"],["Row: Top","(5, 0)","(0, 2)"],["Row: Bottom","(1, 3)","(3, 0)"]],"o":["3/5","3/7","1/2","2/5"],"a":0,"e":"Row 的概率 p 要使 Column 无差异（用 Column 的收益！）：Column 选 Left 的期望收益 = 0·p + 3(1−p)；选 Right = 2p + 0·(1−p)。令 3 − 3p = 2p ⇒ p = 3/5。3/7 是 Column 选 Left 的概率 q（由 Row 的收益求得：5q = q + 3(1−q) ⇒ q = 3/7），是最常见的混淆。","e_en":"Row's probability p must make Column indifferent (use Column's payoffs!): Column's expected payoff from Left = 0·p + 3(1−p); from Right = 2p + 0·(1−p). Setting 3 − 3p = 2p ⇒ p = 3/5. 3/7 is the probability q with which Column chooses Left (found from Row's payoffs: 5q = q + 3(1−q) ⇒ q = 3/7); this is the most common mix-up."},{"id":"m9-01","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A firm sells its output in a perfectly competitive market at $5 per unit. Hiring the 5th worker raises output from 42 to 50 units. What is the marginal revenue product (MRP) of the 5th worker?","o":["$40","$8","$250","$210"],"a":0,"e":"MP = 50 − 42 = 8；产品市场完全竞争时 MR = P = 5，MRP = MP × P = 8 × 5 = 40 美元。$250 是 50 单位的总收益，$210 是 42 单位的总收益。","e_en":"MP = 50 − 42 = 8; when the product market is perfectly competitive, MR = P = 5, so MRP = MP × P = 8 × 5 = $40. $250 is the total revenue from 50 units, and $210 is the total revenue from 42 units."},{"id":"m9-02","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The demand for labour is called a derived demand because","o":["it is derived from the supply of labour","wages are set by the government","it depends on the demand for the goods and services that labour produces","workers derive utility from working"],"a":2,"e":"派生需求 (derived demand)：企业雇佣劳动是为了生产产品出售，因此劳动需求来源于对最终产品的需求。例如智能手机需求上升会增加对芯片工程师的需求。","e_en":"Derived demand: firms hire labour in order to produce goods to sell, so the demand for labour comes from the demand for the final product. For example, a rise in demand for smartphones increases the demand for chip engineers."},{"id":"m9-03","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Deep-sea divers usually earn more than swimming-pool lifeguards with similar education. This is best explained by","o":["monopsony power","the minimum wage","compensating wage differentials","derived demand for swimming pools"],"a":2,"e":"补偿性工资差异 (compensating wage differential)：危险、艰苦或不愉快的工作需要更高工资来吸引劳动者，深海潜水危险性远高于泳池救生员。","e_en":"Compensating wage differential: dangerous, arduous or unpleasant jobs need higher wages to attract workers, and deep-sea diving is far more dangerous than working as a pool lifeguard."},{"id":"m9-04","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A firm sells output at a constant price of $4 and hires workers at a market wage of $30 per day. Using the table, how many workers will the profit-maximizing firm hire?","tbl":[["Workers","Total product"],["1","12"],["2","22"],["3","30"],["4","36"],["5","40"],["6","42"]],"o":["2","4","6","3"],"a":3,"e":"MP = 12、10、8、6、4、2；MRP = MP × 4 = 48、40、32、24、16、8。雇佣到 MRP ≥ W = 30 的最后一名：第 3 名 MRP = 32 ≥ 30，第 4 名 24 < 30。所以雇 3 人。选 4 是多雇了 MRP（24）已低于工资（30）的第 4 名工人；选 6 是追求产量最大而非利润最大。","e_en":"MP = 12, 10, 8, 6, 4, 2; MRP = MP × 4 = 48, 40, 32, 24, 16, 8. Hire up to the last worker with MRP ≥ W = 30: the 3rd worker's MRP = 32 ≥ 30, while the 4th's is 24 < 30. So hire 3 workers. Choosing 4 means also hiring the 4th worker, whose MRP (24) is already below the wage (30); choosing 6 means maximising output rather than profit."},{"id":"m9-05","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A firm's marginal product of labour is 20 units and the wage is $10; the marginal product of capital is 30 units and the rental rate of capital is $20. To minimize the cost of producing its current output, the firm should","o":["use more capital and less labour","use more labour and less capital","keep the current input mix","use more of both labour and capital"],"a":1,"e":"最小成本法则 (least-cost rule)：比较每元的边际产量。MP_L/W = 20/10 = 2，MP_K/r = 30/20 = 1.5。劳动每元产出更高，应增加劳动、减少资本，直到两者相等。仅比较 MP（30 > 20）会误选多用资本。","e_en":"Least-cost rule: compare the marginal product per dollar. MP_L/W = 20/10 = 2 and MP_K/r = 30/20 = 1.5. Labour yields more output per dollar, so the firm should use more labour and less capital until the two are equal. Comparing only the MPs (30 > 20) would wrongly suggest using more capital."},{"id":"m9-06","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In a competitive labour market, labour demand is Ld = 100 − 2W and labour supply is Ls = 3W − 25. If a minimum wage of $30 is imposed, what is the resulting surplus of labour (unemployment)?","o":["10","15","25","40"],"a":2,"e":"均衡：100 − 2W = 3W − 25 ⇒ W = 25，L = 50。最低工资 30 > 25，有约束力：Ld = 100 − 60 = 40，Ls = 90 − 25 = 65，劳动过剩 = 65 − 40 = 25。10 是就业减少量 (50 − 40)，15 是劳动供给增加量 (65 − 50)。","e_en":"Equilibrium: 100 − 2W = 3W − 25 ⇒ W = 25, L = 50. The minimum wage of 30 > 25, so it is binding: Ld = 100 − 60 = 40, Ls = 90 − 25 = 65, and the surplus of labour = 65 − 40 = 25. 10 is the fall in employment (50 − 40), and 15 is the increase in the quantity of labour supplied (65 − 50)."},{"id":"m9-07","t":"m9","lv":2,"ex":["AP","AL","NEC"],"q":"Compared with a firm that sells its output in a perfectly competitive market, a monopolist with the same production function will, at each level of employment, have","o":["a higher MRP, because it charges a higher price","the same MRP, because MRP depends only on marginal product","a higher MRP, because it faces no competition","a lower MRP, because marginal revenue is below price"],"a":3,"e":"MRP = MP × MR。垄断者要多卖必须降价，MR < P，所以其 MRP = MP × MR 低于竞争厂商的 MP × P。这也是垄断厂商雇佣较少劳动的原因。","e_en":"MRP = MP × MR. To sell more, a monopolist must cut its price, so MR < P, and its MRP = MP × MR is lower than a competitive firm's MP × P. This is also why a monopolist hires less labour."},{"id":"m9-08","t":"m9","lv":3,"ex":["IEO","AP","NEC"],"q":"A monopsony employer faces labour supply W = 10 + 2L, and the MRP of labour is MRP = 70 − 2L. What employment level and wage does the monopsonist choose?","o":["L = 10, W = $50","L = 15, W = $40","L = 12, W = $34","L = 10, W = $30"],"a":3,"e":"线性供给 W = 10 + 2L ⇒ 总工资成本 = 10L + 2L²，MRC = 10 + 4L。令 MRC = MRP：10 + 4L = 70 − 2L ⇒ L = 10。工资在供给曲线上读取：W = 10 + 20 = 30。W = 50 是错读在 MRP 曲线上；L = 15、W = 40 是竞争性劳动市场的结果（供给 = MRP）。","e_en":"Linear supply W = 10 + 2L ⇒ total wage bill = 10L + 2L², so MRC = 10 + 4L. Setting MRC = MRP: 10 + 4L = 70 − 2L ⇒ L = 10. The wage is read off the supply curve: W = 10 + 20 = 30. W = 50 comes from wrongly reading off the MRP curve; L = 15, W = 40 is the outcome in a competitive labour market (supply = MRP)."},{"id":"m9-09","t":"m9","lv":3,"ex":["IEO","AP","NEC"],"q":"Using the same monopsony (labour supply W = 10 + 2L, MRP = 70 − 2L), the government imposes a minimum wage of $36. What happens to employment compared with the unregulated monopsony outcome of L = 10?","o":["It rises to 13","It rises to 17","It falls to 8","It rises to 15"],"a":0,"e":"有最低工资 36 时，在供给曲线上 W ≤ 36 的区间 (L ≤ (36−10)/2 = 13)，雇主多雇一人只需支付 36，MRC = 36（水平）。雇主想雇到 MRP = 36 ⇒ 70 − 2L = 36 ⇒ L = 17，但工资 36 时只有 13 人愿意工作，所以就业 = min(13, 17) = 13，高于 10。买方垄断下适度最低工资可提高就业；最低工资 = 40 时就业达到最大 15。","e_en":"With a minimum wage of 36, over the range of the supply curve where W ≤ 36 (L ≤ (36−10)/2 = 13), the employer only has to pay 36 to hire one more worker, so MRC = 36 (horizontal). The employer would like to hire up to where MRP = 36 ⇒ 70 − 2L = 36 ⇒ L = 17, but at a wage of 36 only 13 people are willing to work, so employment = min(13, 17) = 13, which is higher than 10. Under monopsony a moderate minimum wage can raise employment; employment reaches its maximum of 15 when the minimum wage = 40."},{"id":"m9-10","t":"m9","lv":3,"ex":["IEO","IB","AL"],"q":"Which statement about human capital theory and signalling theory is correct?","o":["Signalling theory says education raises productivity, while human capital theory says it only reveals ability","Both predict that more educated workers earn more, but only human capital theory says education raises productivity","Both theories imply that subsidising education always raises national output","Human capital theory predicts that education has no effect on wages"],"a":1,"e":"人力资本理论 (human capital) 认为教育提升技能从而提高生产率和工资；信号理论 (signalling，斯宾塞) 认为学历主要向雇主传递“本来就能干”的信息，未必提升生产率。两者都预测高学历者收入更高，但政策含义不同：若主要是信号，补贴教育未必提高总产出，可能只是“学历军备竞赛”。","e_en":"Human capital theory holds that education raises skills and therefore productivity and wages; signalling theory (Spence) holds that qualifications mainly signal to employers that a person was \"capable to begin with\", and do not necessarily raise productivity. Both predict that more highly educated people earn more, but their policy implications differ: if education is mainly a signal, subsidising education does not necessarily raise total output and may simply fuel a \"credentials arms race\"."},{"id":"m10-01","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which good is both non-rival and non-excludable?","o":["A toll road","National defence","Fish in the open ocean","A cable TV subscription"],"a":1,"e":"公共物品 (public good) 具有非竞争性 (non-rival) 和非排他性 (non-excludable)：国防保护一个人不会减少对他人的保护，也无法排除不付费者。收费公路可排他；公海鱼类具有竞争性（公共资源 common-pool resource）；有线电视可排他（俱乐部物品）。","e_en":"A public good is non-rival and non-excludable: protecting one person with national defence does not reduce the protection available to others, and non-payers cannot be excluded. A toll road is excludable; fish in the open sea are rival (a common-pool resource); cable TV is excludable (a club good)."},{"id":"m10-02","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"After buying
