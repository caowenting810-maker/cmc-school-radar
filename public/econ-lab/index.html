<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>CMC EconLab</title>
<meta name="description" content="CMC 师说 · 经济学学习与刷题系统 · Economics learning & practice">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Sora:wght@500;600;700&display=swap">
<style>:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --surface-3:#E5E8EC;
  --ink:#14161B; --ink-2:#464C57; --ink-3:#767D8A; --line:#DFE2E8;
  --brand:#F97E1C; --brand-ink:#B85600; --brand-soft:#FFF0E2; --brand-line:#F9C99E;
  --ok:#17875A; --ok-soft:#E3F4EC; --bad:#C93A32; --bad-soft:#FBE8E6; --warn:#A86B00; --warn-soft:#FDF2DC;
  --c-d:#2C66D1; --c-3:#0E8A7C; --c-d-soft:rgba(44,102,209,.16); --c-s-soft:rgba(249,126,28,.18); --c-3-soft:rgba(14,138,124,.18); --dwl:rgba(201,58,50,.24);
  --shadow:0 1px 2px rgba(20,22,27,.05),0 4px 16px rgba(20,22,27,.05);
  --r:12px; --r-s:8px;
  --f-display:"Sora","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D0F13; --surface:#161920; --surface-2:#1D2129; --surface-3:#262B35;
  --ink:#F0F1F4; --ink-2:#B9BEC9; --ink-3:#848B99; --line:#2A2F39;
  --brand:#FF8B2E; --brand-ink:#FFA257; --brand-soft:#2B1D11; --brand-line:#5C3714;
  --ok:#3BC48A; --ok-soft:#10271E; --bad:#F06A60; --bad-soft:#2E1614; --warn:#F0B44C; --warn-soft:#2A2110;
  --c-d:#6D9BF0; --c-3:#39C2B0; --c-d-soft:rgba(109,155,240,.2); --c-s-soft:rgba(255,139,46,.2); --c-3-soft:rgba(57,194,176,.2); --dwl:rgba(240,106,96,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0F13; --surface:#161920; --surface-2:#1D2129; --surface-3:#262B35;
  --ink:#F0F1F4; --ink-2:#B9BEC9; --ink-3:#848B99; --line:#2A2F39;
  --brand:#FF8B2E; --brand-ink:#FFA257; --brand-soft:#2B1D11; --brand-line:#5C3714;
  --ok:#3BC48A; --ok-soft:#10271E; --bad:#F06A60; --bad-soft:#2E1614; --warn:#F0B44C; --warn-soft:#2A2110;
  --c-d:#6D9BF0; --c-3:#39C2B0; --c-d-soft:rgba(109,155,240,.2); --c-s-soft:rgba(255,139,46,.2); --c-3-soft:rgba(57,194,176,.2); --dwl:rgba(240,106,96,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--f-display)}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px;overflow-y:auto}
.logo{color:var(--ink);display:block;padding:0 8px}
.logo svg{width:100%;height:auto;display:block}
.prodname{padding:0 8px;display:flex;align-items:baseline;gap:8px}
.prodname b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.prodname span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--ink-2);font-size:14.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 7px;font-weight:600}
.navsec{font-size:11px;letter-spacing:.08em;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);padding:0 8px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)}
.main{min-width:0;padding-block:28px 48px;padding-inline:clamp(16px,4vw,44px)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.tabbar{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
button.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.b{background:var(--brand-soft);color:var(--brand-ink)}
.tag.l1{background:var(--ok-soft);color:var(--ok)}
.tag.l2{background:var(--warn-soft);color:var(--warn)}
.tag.l3{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--ink-2);max-width:68ch}
select,input[type="text"],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.back{align-self:flex-start}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.hello{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hello h1{color:var(--bg);font-size:26px}
.hello p{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.hello .mark{position:absolute;right:-20px;bottom:-26px;width:210px;opacity:.9;pointer-events:none}
.hello .mark path{fill:var(--brand)}
.hello label{font-size:12px;color:color-mix(in srgb,var(--bg) 60%,transparent);font-weight:600;letter-spacing:.06em}
.hello .chip{background:transparent;color:color-mix(in srgb,var(--bg) 80%,transparent);border-color:color-mix(in srgb,var(--bg) 25%,transparent)}
.hello .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.hello-fields{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;max-width:520px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink-3)}
.rec{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;transition:border-color .15s}
.rec:hover{border-color:var(--brand)}
.rec h3{font-size:16px}
.rec p{font-size:13.5px;color:var(--ink-2)}
.rec .go{color:var(--brand-ink);font-weight:600;font-size:13.5px;margin-top:auto}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:78px}
.tile:hover{border-color:var(--ink-3)}
.tile .code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tile .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.tile .pct{font-size:12px;margin-top:auto;font-variant-numeric:tabular-nums}
.tile.s0 .pct{color:var(--ink-3)}
.tile.s1{background:var(--bad-soft);border-color:transparent}.tile.s1 .pct{color:var(--bad)}
.tile.s2{background:var(--warn-soft);border-color:transparent}.tile.s2 .pct{color:var(--warn)}
.tile.s3{background:var(--ok-soft);border-color:transparent}.tile.s3 .pct{color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.stage{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stage:last-child{border-right:0}
.stage.now{background:var(--brand-soft)}
.stage .g{font-family:var(--f-display);font-weight:700;font-size:15px}
.stage.now .g{color:var(--brand-ink)}
.stage p{font-size:13px;color:var(--ink-2)}

/* learn */
.unit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit-h .en{color:var(--ink-3);font-size:13px}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px}
.tcard:hover{border-color:var(--brand)}
.tcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:16px}
.tcard .en{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.tcard .tags{display:flex;gap:5px;flex-wrap:wrap}
.tcard .foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-top:auto}
.tcard .foot .bar{flex:1}
.done-mark{color:var(--ok);font-weight:700;font-size:12px}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lesson-main{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.lh h1{font-size:30px}
.lh .en{font-family:var(--f-display);color:var(--ink-3);font-size:15px;margin-top:4px}
.summary{font-size:15.5px;color:var(--ink-2);max-width:70ch;border-left:3px solid var(--brand);padding-left:14px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.prose strong{color:var(--ink);font-weight:700}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:19px;display:flex;align-items:center;gap:10px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.concept{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.concept b{font-size:14.5px}
.concept i{font-style:normal;font-family:var(--f-display);font-size:12px;color:var(--brand-ink);font-weight:600}
.concept p{font-size:13.5px;color:var(--ink-2)}
.formulas{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.formula{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.formula:last-child{border-bottom:0}
.formula .n{font-size:13px;color:var(--ink-3);font-weight:600}
.formula .f{font-family:var(--f-mono);font-size:14.5px;overflow-x:auto}
.formula .note{grid-column:2;font-size:12.5px;color:var(--ink-3)}
.pitfalls{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.pitfalls li{background:var(--warn-soft);border-radius:9px;padding:9px 12px 9px 34px;font-size:14px;position:relative}
.pitfalls li::before{content:"!";position:absolute;left:11px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--surface);font-weight:700;font-size:11px;display:grid;place-items:center;line-height:1}
.examtbl{width:100%;border-collapse:collapse;font-size:13px}
.examtbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.examtbl td:first-child{width:62px;font-weight:700;font-family:var(--f-display);color:var(--ink-2)}
.examtbl tr:last-child td{border-bottom:0}

/* diagram */
.dg-card{display:flex;flex-direction:column;gap:12px}
.dg-card svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.dg text{font-family:var(--f-body);font-size:10px;fill:var(--ink-2)}
.dg .ax{stroke:var(--ink-3);stroke-width:1.2;fill:none}
.dg .axl{font-size:9.5px;fill:var(--ink-3)}
.dg .cd{stroke:var(--c-d);stroke-width:2.4;fill:none}
.dg .cs{stroke:var(--brand);stroke-width:2.4;fill:none}
.dg .c3{stroke:var(--c-3);stroke-width:2.4;fill:none}
.dg .ck{stroke:var(--ink);stroke-width:2.2;fill:none}
.dg .ghost{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-dasharray:4 3;opacity:.7}
.dg .guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dg .a-d{fill:var(--c-d-soft)}.dg .a-s{fill:var(--c-s-soft)}.dg .a-3{fill:var(--c-3-soft)}.dg .a-x{fill:var(--dwl)}
.dg .pt{fill:var(--ink)}
.dg .lb{font-weight:700;font-size:10.5px}
.dg .lb-d{fill:var(--c-d)}.dg .lb-s{fill:var(--brand-ink)}.dg .lb-3{fill:var(--c-3)}.dg .lb-k{fill:var(--ink)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.ctrl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ctrl span{display:flex;justify-content:space-between;color:var(--ink-2)}
.ctrl input{accent-color:var(--brand);width:100%}
.readout{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 18px}
.readout b{font-family:var(--f-mono);font-weight:600}

/* practice */
.filters{display:flex;flex-direction:column;gap:16px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup > .lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.quick button{text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.quick button:hover{border-color:var(--brand)}
.quick b{font-size:15px}
.quick span{font-size:12.5px;color:var(--ink-3)}
.qwrap{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qstem{font-size:16.5px;line-height:1.6;white-space:pre-line}
.qtbl-wrap{overflow-x:auto}
.qtbl{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:50%}
.qtbl th,.qtbl td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtbl th{background:var(--surface-2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--ink-3)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--ink-2)}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.expl{border-radius:10px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.expl .verdict{font-weight:700;font-family:var(--f-display)}
.expl .verdict.ok{color:var(--ok)}.expl .verdict.no{color:var(--bad)}
.expl p{white-space:pre-line}
.ai-box{border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.ai-box .who{font-weight:700;color:var(--brand-ink);font-size:12.5px;display:block;margin-bottom:4px}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.star{border:0;background:none;color:var(--ink-3);padding:4px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.star[aria-pressed="true"]{color:var(--brand)}
.star svg{width:18px;height:18px}
.kbd{font-size:11.5px;color:var(--ink-3)}

/* mock */
.timer{font-family:var(--f-mono);font-size:18px;font-weight:600;padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.palette button{height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.palette button.cur{outline:2px solid var(--brand);outline-offset:1px}
.palette button.r{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.palette button.w{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.mocklay{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.mockside{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface)}
.mcard .spec{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.mcard .spec b{font-family:var(--f-mono)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1}
.brk{display:flex;flex-direction:column;gap:8px}
.brk-row{display:grid;grid-template-columns:150px 1fr 58px;gap:10px;align-items:center;font-size:13px}
.brk-row .bar{height:8px}

.hist{width:100%;border-collapse:collapse;font-size:13.5px}
.hist th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}

/* problems */
.part{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sol{background:var(--surface-2);border-radius:10px;padding:12px 14px;white-space:pre-line;font-size:14.5px}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}

/* guide */
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}

.fact{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14px}
.fact dt{color:var(--ink-3);font-weight:600;font-size:13px}

.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.book{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}

.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:48px;max-height:200px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:var(--shadow)}

<script type="application/json" id="econ-data">{"lessons":[{"id":"m1","unit":"micro","title_zh":"经济学基础与生产可能性","title_en":"Basic Economic Concepts & the PPC","level":"G8+","summary":"经济学研究在稀缺 (scarcity) 条件下如何做选择。本课介绍机会成本、生产可能性曲线 (PPC)、边际分析与经济体制，并用比较优势 (comparative advantage) 解释为什么专业化与贸易能让双方都获益。","concepts":[{"zh":"稀缺性","en":"Scarcity","def":"资源有限而人类欲望无限，因此必须做出选择；稀缺性是经济学存在的根本原因。","def_en":"Resources are limited while human wants are unlimited, so choices must be made; scarcity is the fundamental reason economics exists."},{"zh":"机会成本","en":"Opportunity Cost","def":"做出某一选择时所放弃的次优选择的价值，包括显性支出和隐性（被放弃的收入、时间等）。","def_en":"The value of the next-best alternative given up when a choice is made, including both explicit expenditure and implicit costs (forgone income, time, etc.)."},{"zh":"生产可能性曲线","en":"Production Possibility Curve (PPC)","def":"在资源和技术给定、充分有效利用时，一个经济体能生产的两种商品最大组合的轨迹。","def_en":"The locus of the maximum combinations of two goods an economy can produce when resources and technology are given and fully and efficiently employed."},{"zh":"机会成本递增","en":"Increasing Opportunity Cost","def":"资源并非同等适合生产两种商品，多生产一种商品需放弃越来越多另一种商品，使 PPC 向外凸 (bowed out)。","def_en":"Resources are not equally suited to producing both goods, so producing more of one good requires giving up increasing amounts of the other, which makes the PPC bowed out."},{"zh":"边际分析","en":"Marginal Analysis","def":"比较多做一单位活动的边际收益 (MB) 与边际成本 (MC)；只要 MB ≥ MC 就继续，最优点在 MB = MC 附近。","def_en":"Comparing the marginal benefit (MB) and marginal cost (MC) of doing one more unit of an activity; keep going as long as MB ≥ MC, and the optimum lies at or near MB = MC."},{"zh":"绝对优势","en":"Absolute Advantage","def":"用同样资源生产更多某商品（或生产同量所需资源更少）的能力。","def_en":"The ability to produce more of a good with the same resources (or to produce the same quantity using fewer resources)."},{"zh":"比较优势","en":"Comparative Advantage","def":"以更低的机会成本生产某商品的能力；贸易的收益来自比较优势而非绝对优势。","def_en":"The ability to produce a good at a lower opportunity cost; the gains from trade come from comparative advantage, not absolute advantage."},{"zh":"贸易条件","en":"Terms of Trade","def":"两种商品交换的比率；互利的贸易条件必须位于双方国内机会成本之间。","def_en":"The rate at which two goods are exchanged; mutually beneficial terms of trade must lie between the two parties' domestic opportunity costs."},{"zh":"经济体制","en":"Economic Systems","def":"解决“生产什么、如何生产、为谁生产”的制度安排：市场经济、计划（指令）经济、混合经济与传统经济。","def_en":"The institutional arrangements that answer 'what to produce, how to produce and for whom to produce': market economies, planned (command) economies, mixed economies and traditional economies."}],"formulas":[{"name":"机会成本（线性 PPC）","f":"OC of 1 X = 放弃的 Y 数量 ÷ 增加的 X 数量","note":"即 PPC 斜率的绝对值；两国比较同一商品的 OC 来判断比较优势。","name_en":"Opportunity cost (linear PPC)","note_en":"This is the absolute value of the PPC's slope; compare the OC of the same good in the two countries to determine comparative advantage.","f_en":"OC of 1 X = Y given up ÷ X gained"},{"name":"互利贸易条件","f":"OC_A(X) < 贸易价格 (以 Y 计的 1 单位 X) < OC_B(X)","note":"价格落在两国机会成本之间，双方都能获益。","name_en":"Mutually beneficial terms of trade","note_en":"When the price lies between the two countries' opportunity costs, both sides gain.","f_en":"OC_A(X) < terms of trade (Y per unit of X) < OC_B(X)"},{"name":"最优决策规则","f":"继续直到 MB = MC","note":"离散数据时：选择最后一个 MB ≥ MC 的单位。","name_en":"Optimal decision rule","note_en":"With discrete data: choose the last unit for which MB ≥ MC.","f_en":"Continue until MB = MC"}],"sections":[{"h":"稀缺、选择与机会成本","body":"每个经济主体都面临**稀缺性**，因此每个选择都有**机会成本 (opportunity cost)**：放弃的次优选项的价值。\n例：小林周六可以打工 3 小时（时薪 $15）或花 $40 去看演唱会。看演唱会的机会成本 = 门票 $40 + 放弃的工资 3×$15 = **$85**。\n- 沉没成本 (sunk cost) 已经无法收回，不应影响当前决策。\n- 理性决策看的是**边际**：再多一单位的 MB 是否 ≥ MC。","h_en":"Scarcity, Choice and Opportunity Cost","body_en":"Every economic agent faces **scarcity**, so every choice has an **opportunity cost**: the value of the next-best alternative given up.\nExample: on Saturday, Xiaolin can either work for 3 hours (at $15 an hour) or spend $40 to go to a concert. The opportunity cost of the concert = ticket $40 + forgone wages 3×$15 = **$85**.\n- A sunk cost can no longer be recovered and should not affect the current decision.\n- Rational decisions are made at the **margin**: is the MB of one more unit ≥ its MC?"},{"h":"生产可能性曲线 (PPC)","body":"PPC 上的点代表**生产效率 (productive efficiency)**；曲线内部的点表示失业或资源浪费；曲线外的点在当前资源技术下**不可达**。\n- **形状**：资源专用性导致机会成本递增，PPC 向外凸；若资源完全可替代，机会成本不变，PPC 为直线。\n- **移动**：资源增加、技术进步、劳动力素质提高使 PPC 外移；只影响一种商品的技术进步使 PPC 沿该轴**旋转 (pivot)** 外移。\n- 沿 PPC 移动（改变产品组合）≠ PPC 移动。\n- 今天多生产资本品 (capital goods)，未来 PPC 外移更多——这是当前消费与未来增长之间的权衡。","h_en":"The Production Possibility Curve (PPC)","body_en":"Points on the PPC represent **productive efficiency**; points inside the curve indicate unemployment or wasted resources; points outside the curve are **unattainable** with current resources and technology.\n- **Shape**: because resources are specialized, opportunity cost increases and the PPC is bowed out; if resources are perfectly substitutable, opportunity cost is constant and the PPC is a straight line.\n- **Shifts**: more resources, technological progress and a better-skilled labor force shift the PPC outward; technological progress that affects only one good makes the PPC **pivot** outward along that axis.\n- A movement along the PPC (changing the output mix) ≠ a shift of the PPC.\n- Producing more capital goods today shifts the PPC out further in the future — this is the trade-off between current consumption and future growth."},{"h":"绝对优势 vs 比较优势","body":"假设 1 个工作日：X 国可生产 8 吨小麦或 4 匹布；Y 国可生产 3 吨小麦或 3 匹布。\n- X 国在两种商品上都有**绝对优势**。\n- 布的机会成本：X 国 1 布 = 8/4 = **2 小麦**；Y 国 1 布 = 3/3 = **1 小麦**。所以 Y 国在布上有**比较优势**，X 国在小麦上有比较优势（X 国 1 小麦 = 0.5 布 < Y 国 1 小麦 = 1 布）。\n- 只要机会成本不同，专业化 (specialization) 加贸易就能让世界总产量增加。\n- 互利贸易条件：1 布换 **1 到 2 吨小麦**之间，例如 1 布 = 1.5 小麦。","h_en":"Absolute Advantage vs Comparative Advantage","body_en":"Suppose that in 1 working day, country X can produce 8 tons of wheat or 4 bolts of cloth, and country Y can produce 3 tons of wheat or 3 bolts of cloth.\n- Country X has an **absolute advantage** in both goods.\n- Opportunity cost of cloth: in X, 1 cloth = 8/4 = **2 wheat**; in Y, 1 cloth = 3/3 = **1 wheat**. So Y has a **comparative advantage** in cloth, and X has a comparative advantage in wheat (in X, 1 wheat = 0.5 cloth < in Y, 1 wheat = 1 cloth).\n- As long as opportunity costs differ, specialization plus trade can increase total world output.\n- Mutually beneficial terms of trade: 1 cloth exchanges for between **1 and 2 tons of wheat**, for example 1 cloth = 1.5 wheat."},{"h":"贸易收益的计算套路 (IEO 常考)","body":"1. 把产出表转换成**机会成本表**（注意题目给的是“单位产量”还是“单位所需工时”，两者要倒过来算）。\n2. 比较同一商品的机会成本，低者专业化该商品。\n3. 确定贸易条件区间，选一个价格，算出各国交换后的消费组合。\n4. 与自给自足 (autarky) 时同样数量的另一商品相比，差额即**贸易收益 (gains from trade)**。\n多人合作（联合 PPC）时，同样按机会成本从低到高依次分配生产任务，得到向外凸的分段线性联合 PPC。","h_en":"Method for Calculating Gains from Trade (Frequently Tested in the IEO)","body_en":"1. Convert the output table into an **opportunity cost table** (check whether the question gives \"output per unit of input\" or \"labor-hours required per unit of output\" — the two must be calculated the opposite way round).\n2. Compare the opportunity costs of the same good; the country with the lower one specializes in that good.\n3. Determine the range for the terms of trade, choose a price, and calculate each country's consumption bundle after exchange.\n4. Compare with the quantity of the other good available under autarky for the same quantity of this good; the difference is the **gains from trade**.\nWhen several people cooperate (a joint PPC), assign production tasks in the same way, from lowest to highest opportunity cost, to obtain a bowed-out, piecewise-linear joint PPC."},{"h":"经济体制","body":"- **市场经济**：由价格信号和私有产权协调，“看不见的手”引导资源配置。\n- **计划经济 (command economy)**：政府中央计划决定生产与分配，容易出现信息与激励问题。\n- **混合经济**：现实中多数国家是市场为主、政府干预（公共品、再分配、规制）为辅。\n- **传统经济**：由习俗和传统决定。","h_en":"Economic Systems","body_en":"- **Market economy**: coordinated by price signals and private property rights; the \"invisible hand\" guides the allocation of resources.\n- **Command economy**: the government's central plan determines production and distribution, which tends to create information and incentive problems.\n- **Mixed economy**: in reality, most countries rely mainly on markets, supplemented by government intervention (public goods, redistribution, regulation).\n- **Traditional economy**: decisions are determined by custom and tradition."}],"pitfalls":["把绝对优势当成贸易的依据——即使一国在所有商品上都更高效，仍可通过比较优势获益。","题目给的是“生产 1 单位所需工时”时，直接用这些数字当产量计算机会成本，导致结论完全颠倒。","混淆沿 PPC 移动（改变产出组合）与 PPC 整体移动（生产能力变化）。","计算机会成本时忽略隐性成本（如放弃的工资），或错误地把沉没成本计入决策。","贸易条件取在两国机会成本区间之外，结果其中一国反而受损。"],"exams":{"AP":"Micro Unit 1 (1.1–1.5)","IB":"1.1–1.2; 4.1 (comparative advantage)","AL":"9708 AS 1; AS 6 (specialisation & trade)","IEO":"Scarcity, specialization & gains from trade","NEC":"Fundamentals; International"},"diagram":"ppc","summary_en":"Economics studies how choices are made under conditions of scarcity. This lesson introduces opportunity cost, the production possibility curve (PPC), marginal analysis and economic systems, and uses comparative advantage to explain why specialization and trade can make both sides better off.","pitfalls_en":["Treating absolute advantage as the basis for trade — even if a country is more efficient at producing every good, it can still gain through comparative advantage.","When the question gives \"labor-hours required to produce 1 unit\", using those numbers directly as output to calculate opportunity cost, which reverses the conclusion completely.","Confusing a movement along the PPC (a change in the output mix) with a shift of the whole PPC (a change in productive capacity).","Ignoring implicit costs (such as forgone wages) when calculating opportunity cost, or wrongly including sunk costs in a decision.","Choosing terms of trade outside the range between the two countries' opportunity costs, so that one of the countries actually loses."]},{"id":"m2","unit":"micro","title_zh":"供给与需求","title_en":"Supply & Demand","level":"G8+","summary":"供求模型是微观经济学最核心的工具。本课区分“曲线移动”与“沿曲线移动”，求解线性供求均衡，计算消费者剩余与生产者剩余，并分析供求同时变化时价格和数量的确定与不确定。","concepts":[{"zh":"需求定理","en":"Law of Demand","def":"其他条件不变 (ceteris paribus)，价格上升，需求量下降；源于替代效应和收入效应。","def_en":"Ceteris paribus, as price rises, quantity demanded falls; this results from the substitution effect and the income effect."},{"zh":"需求量 vs 需求","en":"Quantity Demanded vs Demand","def":"本商品价格变化只引起沿需求曲线移动（需求量变化）；其他决定因素变化才使整条需求曲线移动。","def_en":"A change in the good's own price causes only a movement along the demand curve (a change in quantity demanded); only a change in another determinant shifts the entire demand curve."},{"zh":"需求决定因素","en":"Determinants of Demand","def":"收入、相关商品价格（替代品/互补品）、偏好、预期、买者数量。","def_en":"Income, the prices of related goods (substitutes/complements), tastes, expectations and the number of buyers."},{"zh":"供给决定因素","en":"Determinants of Supply","def":"投入品价格、技术、相关商品价格、税收与补贴、预期、卖者数量。","def_en":"Input prices, technology, the prices of related goods, taxes and subsidies, expectations and the number of sellers."},{"zh":"市场均衡","en":"Market Equilibrium","def":"Qd = Qs 时的价格与数量；此时市场出清，无短缺也无过剩。","def_en":"The price and quantity at which Qd = Qs; the market clears, with neither a shortage nor a surplus."},{"zh":"短缺与过剩","en":"Shortage & Surplus","def":"价格低于均衡时 Qd > Qs 为短缺；价格高于均衡时 Qs > Qd 为过剩。","def_en":"When price is below equilibrium, Qd > Qs, which is a shortage; when price is above equilibrium, Qs > Qd, which is a surplus."},{"zh":"消费者剩余","en":"Consumer Surplus (CS)","def":"消费者愿意支付的最高价格与实际支付价格之差的总和，即需求曲线以下、价格线以上的面积。","def_en":"The sum of the differences between the highest price consumers are willing to pay and the price they actually pay, i.e. the area below the demand curve and above the price line."},{"zh":"生产者剩余","en":"Producer Surplus (PS)","def":"实际收到的价格与最低愿意接受价格（边际成本）之差的总和，即价格线以下、供给曲线以上的面积。","def_en":"The sum of the differences between the price actually received and the lowest price sellers are willing to accept (marginal cost), i.e. the area below the price line and above the supply curve."},{"zh":"市场需求的水平加总","en":"Horizontal Summation","def":"市场需求 = 在每一价格上把所有个人需求量相加（横向相加），供给同理。","def_en":"Market demand = the sum of all individual quantities demanded at each price (horizontal summation); the same applies to supply."}],"formulas":[{"name":"线性需求/供给","f":"Qd = a − bP；Qs = c + dP","note":"b, d > 0。","name_en":"Linear demand/supply","note_en":"b, d > 0."},{"name":"均衡价格","f":"P* = (a − c) ÷ (b + d)","note":"代回任一方程得 Q*。","name_en":"Equilibrium price","note_en":"Substitute back into either equation to obtain Q*."},{"name":"消费者剩余（线性）","f":"CS = ½ × (P_max − P*) × Q*","note":"P_max 为需求曲线在价格轴上的截距 (choke price)。","name_en":"Consumer surplus (linear)","note_en":"P_max is the demand curve's intercept on the price axis (the choke price)."},{"name":"生产者剩余（线性）","f":"PS = ½ × (P* − P_min) × Q*","note":"P_min 为供给曲线的价格截距。","name_en":"Producer surplus (linear)","note_en":"P_min is the supply curve's price intercept."}],"sections":[{"h":"需求与供给：移动 vs 沿曲线移动","body":"本商品**自身价格**变化 → 沿曲线移动（需求量/供给量变化）。\n其他因素变化 → 曲线**整体移动**：\n- 需求右移：收入上升（正常品）、替代品涨价、互补品降价、偏好增强、预期未来涨价、买者增多。\n- 供给右移：投入品降价、技术进步、补贴、卖者增多；税收和投入品涨价使供给左移。\n例：汽油大幅涨价，大型 SUV（互补品）的**需求左移**，SUV 的均衡价格和数量都下降。","h_en":"Demand and Supply: Shifts vs Movements Along the Curve","body_en":"A change in the good's **own price** → a movement along the curve (a change in quantity demanded/quantity supplied).\nA change in any other factor → a **shift of the whole curve**:\n- Demand shifts right: higher income (normal goods), a rise in the price of a substitute, a fall in the price of a complement, stronger preferences, expectations of higher future prices, more buyers.\n- Supply shifts right: lower input prices, technological progress, subsidies, more sellers; taxes and higher input prices shift supply left.\nExample: a sharp rise in the price of gasoline shifts the **demand for large SUVs (a complement) to the left**, so both the equilibrium price and quantity of SUVs fall."},{"h":"线性均衡求解（含数值例）","body":"设 Qd = 120 − 4P，Qs = −30 + 6P。\n令 Qd = Qs：120 − 4P = −30 + 6P → 10P = 150 → **P* = 15，Q* = 60**。\n需求价格截距：Qd = 0 时 P = 30；供给价格截距：Qs = 0 时 P = 5。\n- CS = ½ × (30 − 15) × 60 = **450**\n- PS = ½ × (15 − 5) × 60 = **300**\n- 总剩余 = 750，竞争均衡时总剩余最大（配置效率 allocative efficiency）。\n若价格定在 P = 12：Qd = 72，Qs = 42，出现 30 单位**短缺**，价格有上升压力。","h_en":"Solving a Linear Equilibrium (with a Numerical Example)","body_en":"Let Qd = 120 − 4P and Qs = −30 + 6P.\nSet Qd = Qs: 120 − 4P = −30 + 6P → 10P = 150 → **P* = 15, Q* = 60**.\nDemand price intercept: when Qd = 0, P = 30; supply price intercept: when Qs = 0, P = 5.\n- CS = ½ × (30 − 15) × 60 = **450**\n- PS = ½ × (15 − 5) × 60 = **300**\n- Total surplus = 750; total surplus is maximized at the competitive equilibrium (allocative efficiency).\nIf the price is set at P = 12: Qd = 72 and Qs = 42, so there is a **shortage** of 30 units and upward pressure on price."},{"h":"供求同时变化","body":"两条曲线同时移动时，总有一个变量方向**不确定 (indeterminate)**，取决于移动幅度：\n- D↑ 且 S↑：Q 上升，P 不确定。\n- D↑ 且 S↓：P 上升，Q 不确定。\n- D↓ 且 S↑：P 下降，Q 不确定。\n- D↓ 且 S↓：Q 下降，P 不确定。\n反推题：若观察到“价格上升、数量下降”，最简单的解释是**供给减少**（或供给减少幅度大于需求变化）。","h_en":"Simultaneous Changes in Supply and Demand","body_en":"When both curves shift at the same time, the direction of one variable is always **indeterminate**; it depends on the relative size of the shifts:\n- D↑ and S↑: Q rises, P is indeterminate.\n- D↑ and S↓: P rises, Q is indeterminate.\n- D↓ and S↑: P falls, Q is indeterminate.\n- D↓ and S↓: Q falls, P is indeterminate.\nWorking backwards: if you observe \"price rises and quantity falls\", the simplest explanation is a **decrease in supply** (or a decrease in supply that is larger than the change in demand)."},{"h":"从个人到市场：水平加总","body":"若有 100 个相同消费者，每人 q = 10 − 2P，则市场需求 Qd = 100 × (10 − 2P) = 1000 − 200P。注意是**数量相加**，而不是价格相加。\n竞赛题常把个人需求/厂商供给与均衡计算结合，并要求算剩余变化；做题时先写出市场方程，再解均衡。","h_en":"From Individual to Market: Horizontal Summation","body_en":"If there are 100 identical consumers, each with q = 10 − 2P, then market demand is Qd = 100 × (10 − 2P) = 1000 − 200P. Note that it is **quantities that are added**, not prices.\nCompetition problems often combine individual demand/firm supply with equilibrium calculations and ask for changes in surplus; when solving, first write down the market equations, then solve for equilibrium."}],"pitfalls":["说“价格上升导致需求减少”——应为“需求量减少”，需求曲线本身并未移动。","把“价格上升”当作供给曲线右移的原因（混淆供给量与供给）。","供求同时移动时给出确定的价格和数量方向，忽略其中一个是不确定的。","计算市场需求时把个人需求曲线“竖着加”（价格相加）。","计算 CS 时用数量截距代替价格截距，或忘记乘 ½。"],"exams":{"AP":"Micro Unit 2 (2.1–2.6)","IB":"2.1–2.3","AL":"9708 AS 2","IEO":"Competitive markets","NEC":"Micro core"},"diagram":"sd","summary_en":"The supply and demand model is the most fundamental tool in microeconomics. This lesson distinguishes between a shift of a curve and a movement along a curve, solves for linear supply-and-demand equilibrium, calculates consumer and producer surplus, and analyzes when the changes in price and quantity are determinate or indeterminate if supply and demand change at the same time.","pitfalls_en":["Saying \"a rise in price causes demand to decrease\" — it should be \"quantity demanded decreases\"; the demand curve itself has not shifted.","Treating \"a rise in price\" as a cause of a rightward shift of the supply curve (confusing quantity supplied with supply).","Giving definite directions for both price and quantity when supply and demand shift simultaneously, ignoring that one of them is indeterminate.","Adding individual demand curves \"vertically\" (adding prices) when calculating market demand.","Using the quantity intercept instead of the price intercept when calculating CS, or forgetting to multiply by ½."]},{"id":"m3","unit":"micro","title_zh":"弹性","title_en":"Elasticity","level":"G9+","summary":"弹性衡量一个变量对另一个变量变化的敏感程度。本课讲解需求价格弹性 (PED) 的中点公式与总收益检验、供给价格弹性 (PES)、收入弹性 (YED) 与交叉弹性 (XED)，并说明弹性如何决定税负归宿。","concepts":[{"zh":"需求价格弹性","en":"Price Elasticity of Demand (PED)","def":"需求量变化百分比与价格变化百分比之比；通常取绝对值，|PED| > 1 为富有弹性，< 1 为缺乏弹性。","def_en":"The ratio of the percentage change in quantity demanded to the percentage change in price; usually taken as an absolute value — |PED| > 1 is elastic and < 1 is inelastic."},{"zh":"中点公式","en":"Midpoint (Arc) Method","def":"用变化前后的平均值作分母计算百分比变化，使涨价与降价得到相同弹性值。","def_en":"Uses the average of the before and after values as the denominator when calculating percentage changes, so that a price rise and a price cut give the same elasticity value."},{"zh":"总收益检验","en":"Total Revenue Test","def":"需求富有弹性时价格与总收益反向变动；缺乏弹性时同向变动；单位弹性时总收益不变。","def_en":"When demand is elastic, price and total revenue move in opposite directions; when inelastic, they move in the same direction; when unit elastic, total revenue is unchanged."},{"zh":"供给价格弹性","en":"Price Elasticity of Supply (PES)","def":"供给量变化百分比与价格变化百分比之比；时间越长、闲置产能与库存越多，PES 越大。","def_en":"The ratio of the percentage change in quantity supplied to the percentage change in price; the longer the time period and the more spare capacity and stocks there are, the greater the PES."},{"zh":"需求收入弹性","en":"Income Elasticity of Demand (YED)","def":"YED > 0 为正常品（0–1 必需品，> 1 奢侈品）；YED < 0 为劣等品 (inferior good)。","def_en":"YED > 0 indicates a normal good (0–1 a necessity, > 1 a luxury); YED < 0 indicates an inferior good."},{"zh":"需求交叉弹性","en":"Cross-Price Elasticity (XED)","def":"X 的需求量对 Y 价格变化的反应；XED > 0 为替代品，XED < 0 为互补品，≈ 0 为无关商品。","def_en":"The response of the quantity demanded of X to a change in the price of Y; XED > 0 indicates substitutes, XED < 0 indicates complements, and ≈ 0 indicates unrelated goods."},{"zh":"弹性决定因素","en":"Determinants of PED","def":"替代品多少、占收入比重、必需品还是奢侈品、市场定义宽窄、时间长短。","def_en":"The number of substitutes, the share of income spent on the good, whether it is a necessity or a luxury, how broadly or narrowly the market is defined, and the length of time."},{"zh":"点弹性","en":"Point Elasticity","def":"线性需求 Q = a − bP 上某点的弹性 = −b × P/Q；同一条直线上沿曲线向上弹性越来越大。","def_en":"The elasticity at a point on a linear demand curve Q = a − bP = −b × P/Q; moving up along the same straight line, elasticity becomes larger and larger."}],"formulas":[{"name":"需求价格弹性（中点）","f":"PED = [(Q₂ − Q₁) ÷ ((Q₁ + Q₂)/2)] ÷ [(P₂ − P₁) ÷ ((P₁ + P₂)/2)]","note":"结果为负，比较大小时取绝对值。","name_en":"Price elasticity of demand (midpoint)","note_en":"The result is negative; take the absolute value when comparing magnitudes."},{"name":"点弹性（线性需求）","f":"PED = (ΔQ/ΔP) × (P/Q) = −b × P/Q","note":"中点处 |PED| = 1，此时总收益最大。","name_en":"Point elasticity (linear demand)","note_en":"At the midpoint |PED| = 1, where total revenue is maximized."},{"name":"收入弹性","f":"YED = %ΔQd ÷ %ΔIncome","note":"看符号判断正常品/劣等品。","name_en":"Income elasticity","note_en":"Use the sign to determine whether the good is normal or inferior."},{"name":"交叉弹性","f":"XED = %ΔQd_X ÷ %ΔP_Y","note":"看符号判断替代品/互补品。","name_en":"Cross elasticity","note_en":"Use the sign to determine whether the goods are substitutes or complements."},{"name":"供给价格弹性","f":"PES = %ΔQs ÷ %ΔP","note":"过原点的线性供给曲线 PES = 1。","name_en":"Price elasticity of supply","note_en":"A linear supply curve through the origin has PES = 1."},{"name":"税负分担","f":"消费者承担比例 = PES ÷ (PES + |PED|)","note":"谁更缺乏弹性，谁承担更多税负。","name_en":"Tax burden sharing","note_en":"Whichever side is more inelastic bears more of the tax burden.","f_en":"Consumer share of tax = PES ÷ (PES + |PED|)"}],"sections":[{"h":"需求价格弹性与中点公式","body":"例：价格从 $10 升到 $12，需求量从 100 降到 80。\n- %ΔQ = −20 ÷ 90 ≈ −22.2%\n- %ΔP = 2 ÷ 11 ≈ 18.2%\n- PED ≈ −1.22，|PED| > 1，**富有弹性 (elastic)**。\n若用简单百分比（以初始值为分母）会得到 −20% ÷ 20% = −1.0，结论就错了——这正是考试常设的陷阱。\n**完全无弹性**（竖直需求线，|PED| = 0）与**完全弹性**（水平需求线，|PED| = ∞）是两个极端。","h_en":"Price Elasticity of Demand and the Midpoint Formula","body_en":"Example: price rises from $10 to $12 and quantity demanded falls from 100 to 80.\n- %ΔQ = −20 ÷ 90 ≈ −22.2%\n- %ΔP = 2 ÷ 11 ≈ 18.2%\n- PED ≈ −1.22; |PED| > 1, so demand is **elastic**.\nUsing simple percentages (with the initial value as the denominator) gives −20% ÷ 20% = −1.0, which leads to the wrong conclusion — this is exactly the trap examiners like to set.\n**Perfectly inelastic** demand (a vertical demand curve, |PED| = 0) and **perfectly elastic** demand (a horizontal demand curve, |PED| = ∞) are the two extremes."},{"h":"总收益检验 (Total Revenue Test)","body":"TR = P × Q。\n- 富有弹性：降价 → TR 上升；涨价 → TR 下降。\n- 缺乏弹性：涨价 → TR 上升（如香烟、胰岛素）。\n- 单位弹性：TR 不变。\n对线性需求 Q = 100 − 2P：在 P = 30 时 Q = 40，点弹性 = −2 × 30/40 = −1.5（富有弹性），降价能提高 TR；TR 在 P = 25（直线中点）处达到最大。","h_en":"The Total Revenue Test","body_en":"TR = P × Q.\n- Elastic: price cut → TR rises; price rise → TR falls.\n- Inelastic: price rise → TR rises (e.g. cigarettes, insulin).\n- Unit elastic: TR is unchanged.\nFor the linear demand Q = 100 − 2P: at P = 30, Q = 40 and point elasticity = −2 × 30/40 = −1.5 (elastic), so cutting the price raises TR; TR reaches its maximum at P = 25 (the midpoint of the line)."},{"h":"收入弹性与交叉弹性","body":"- 收入增加 10%，公交出行次数减少 15%：YED = −1.5 → **劣等品**。\n- 收入增加 10%，海外旅游增加 25%：YED = 2.5 → **奢侈品**。\n- 咖啡涨价 20%，茶的需求量上升 8%：XED = +0.4 → **替代品**。\n- 打印机涨价 20%，墨盒需求量下降 10%：XED = −0.5 → **互补品**。\n企业用 YED 预测经济周期中的销量变化，用 XED 判断竞争对手与配套产品。","h_en":"Income Elasticity and Cross Elasticity","body_en":"- Income rises by 10% and bus journeys fall by 15%: YED = −1.5 → an **inferior good**.\n- Income rises by 10% and overseas travel rises by 25%: YED = 2.5 → a **luxury good**.\n- The price of coffee rises by 20% and the quantity of tea demanded rises by 8%: XED = +0.4 → **substitutes**.\n- The price of printers rises by 20% and the quantity of ink cartridges demanded falls by 10%: XED = −0.5 → **complements**.\nFirms use YED to forecast how sales will change over the business cycle, and XED to identify competitors and complementary products."},{"h":"供给弹性与税负归宿","body":"**PES** 受时间（短期 < 长期）、闲置产能、库存、要素流动性影响。\n**税负归宿 (tax incidence)** 与法定纳税人无关，只取决于相对弹性：\n消费者承担比例 = PES ÷ (PES + |PED|)。\n例：PED = −0.5，PES = 1.5，每单位税 $4 → 消费者承担 1.5/2.0 = 75%，即 **$3**，生产者承担 $1。\n需求越缺乏弹性，政府从该商品征税带来的数量扭曲（无谓损失）越小，这也是烟酒税常见的原因之一。","h_en":"Elasticity of Supply and Tax Incidence","body_en":"**PES** is affected by time (short run < long run), spare capacity, stocks and factor mobility.\n**Tax incidence** has nothing to do with who is legally required to pay the tax; it depends only on relative elasticities:\nConsumer share = PES ÷ (PES + |PED|).\nExample: PED = −0.5, PES = 1.5, a tax of $4 per unit → consumers bear 1.5/2.0 = 75%, i.e. **$3**, and producers bear $1.\nThe more inelastic demand is, the smaller the quantity distortion (deadweight loss) when the government taxes the good, which is one reason taxes on tobacco and alcohol are so common."}],"pitfalls":["把线性需求曲线的斜率当作弹性——同一条直线上各点弹性不同。","不用中点公式，导致涨价、降价两个方向算出的弹性不一致。","YED、XED 只看大小不看符号；符号恰恰决定商品类型。","认为“对卖方征税就由卖方承担”——实际归宿由弹性决定。","认为富有弹性时涨价能增加总收益（方向记反）。"],"exams":{"AP":"Micro Unit 2 (2.3 Elasticity)","IB":"2.5–2.6","AL":"9708 AS 2 (PED, YED, XED, PES)","IEO":"Markets & elasticity","NEC":"Micro core"},"diagram":null,"summary_en":"Elasticity measures how responsive one variable is to a change in another. This lesson covers the midpoint formula and total revenue test for price elasticity of demand (PED), price elasticity of supply (PES), income elasticity (YED) and cross elasticity (XED), and explains how elasticity determines tax incidence.","pitfalls_en":["Treating the slope of a linear demand curve as its elasticity — elasticity differs at each point on the same straight line.","Not using the midpoint formula, so that a price rise and a price cut give inconsistent elasticity values.","Looking only at the magnitude of YED and XED and ignoring the sign; it is precisely the sign that determines the type of good.","Believing that \"if the tax is levied on sellers, sellers bear it\" — the actual incidence is determined by elasticities.","Believing that raising the price increases total revenue when demand is elastic (getting the direction the wrong way round)."]},{"id":"m4","unit":"micro","title_zh":"政府干预市场","title_en":"Government Intervention in Markets","level":"G9+","summary":"政府常通过价格上限、价格下限、从量税、补贴和配额干预市场。本课用线性供求模型定量分析这些政策对价格、数量、剩余、政府收支与无谓损失 (DWL) 的影响，并推导税负分担。","concepts":[{"zh":"价格上限","en":"Price Ceiling","def":"法定最高价格；只有低于均衡价格时才有约束力 (binding)，导致短缺、排队、黑市。","def_en":"A legal maximum price; it is binding only when set below the equilibrium price, causing shortages, queues and black markets."},{"zh":"价格下限","en":"Price Floor","def":"法定最低价格；只有高于均衡价格时才有约束力，导致过剩，如最低工资造成劳动力过剩（失业）。","def_en":"A legal minimum price; it is binding only when set above the equilibrium price, causing a surplus — for example, a minimum wage creates a surplus of labor (unemployment)."},{"zh":"从量税","en":"Per-unit (Specific) Tax","def":"对每单位商品征收固定金额的税，使供给曲线向上移动税额的距离（或需求曲线向下移动）。","def_en":"A fixed amount of tax levied on each unit of a good, which shifts the supply curve up by the amount of the tax (or the demand curve down)."},{"zh":"补贴","en":"Subsidy","def":"政府对每单位产出给予的支付，使供给曲线下移；消费者价格下降，生产者实得价格上升。","def_en":"A payment by the government for each unit of output, which shifts the supply curve down; the price consumers pay falls and the price producers receive rises."},{"zh":"配额","en":"Quota","def":"对数量设定上限；低于均衡数量时抬高价格，产生配额租金 (quota rent)。","def_en":"A limit placed on quantity; when set below the equilibrium quantity it raises the price and creates quota rent."},{"zh":"无谓损失","en":"Deadweight Loss (DWL)","def":"因产量偏离有效水平而损失且无人获得的总剩余，线性模型中通常是三角形面积。","def_en":"The total surplus that is lost, and gained by no one, because output deviates from the efficient level; in a linear model it is usually the area of a triangle."},{"zh":"税负归宿","en":"Tax Incidence","def":"税负在买卖双方之间的实际分担，与法律规定由谁缴税无关。","def_en":"The actual division of the tax burden between buyers and sellers, which has nothing to do with who is legally required to pay the tax."},{"zh":"税收楔子","en":"Tax Wedge","def":"消费者支付价格与生产者实得价格之间的差额，等于单位税额。","def_en":"The difference between the price paid by consumers and the price received by producers, equal to the per-unit tax."}],"formulas":[{"name":"从量税后的均衡","f":"Qd(P_c) = Qs(P_c − t)","note":"P_c 为消费者支付价，P_s = P_c − t 为生产者实得价。","name_en":"Equilibrium after a per-unit tax","note_en":"P_c is the price consumers pay, and P_s = P_c − t is the price producers receive."},{"name":"税收收入","f":"Tax revenue = t × Q_t","note":"Q_t 为税后数量。","name_en":"Tax revenue","note_en":"Q_t is the after-tax quantity."},{"name":"无谓损失（线性）","f":"DWL = ½ × t × (Q* − Q_t)","note":"补贴时 DWL = ½ × s × (Q_s − Q*)。","name_en":"Deadweight loss (linear)","note_en":"For a subsidy, DWL = ½ × s × (Q_s − Q*)."},{"name":"补贴的政府支出","f":"Cost = s × Q_s","note":"Q_s 为补贴后数量。","name_en":"Government cost of a subsidy","note_en":"Q_s is the quantity after the subsidy."},{"name":"线性模型税后数量","f":"Q_t = Q* − t × b × d ÷ (b + d)","note":"Qd = a − bP，Qs = c + dP；据此可推出收入最大化税率。","name_en":"After-tax quantity in the linear model","note_en":"With Qd = a − bP and Qs = c + dP; this can be used to derive the revenue-maximizing tax."}],"sections":[{"h":"价格上限与价格下限","body":"设 Qd = 200 − 10P，Qs = 20P − 40，均衡 P* = 8，Q* = 120。\n若设价格上限 P = 6：Qd = 140，Qs = 80，**短缺 60 单位**；实际成交量只有 80（取供给侧），配置效率丧失，产生 DWL，还可能出现排队、黑市和质量下降。\n价格下限（如农产品保护价、最低工资）高于均衡时产生**过剩**；政府若承诺收购过剩产品，还需承担财政成本。\n注意：高于均衡的上限、低于均衡的下限**没有约束力**，市场照常在均衡处运行。","h_en":"Price Ceilings and Price Floors","body_en":"Let Qd = 200 − 10P and Qs = 20P − 40, so equilibrium is P* = 8, Q* = 120.\nIf a price ceiling is set at P = 6: Qd = 140 and Qs = 80, a **shortage of 60 units**; the quantity actually traded is only 80 (the supply side), allocative efficiency is lost and a DWL arises, and there may also be queues, black markets and falling quality.\nA price floor above equilibrium (such as agricultural support prices or a minimum wage) creates a **surplus**; if the government promises to buy up the surplus, it must also bear the fiscal cost.\nNote: a ceiling above equilibrium or a floor below equilibrium is **not binding**, and the market operates at equilibrium as usual."},{"h":"从量税：完整数值例","body":"设 Qd = 100 − P，Qs = P − 20，均衡 P* = 60，Q* = 40。对卖方征 t = $10：\n- 新供给：Qs = (P − 10) − 20 → 100 − P = P − 30 → **P_c = 65，Q = 35**，P_s = 55。\n- 消费者承担 $5，生产者承担 $5（两条线斜率绝对值相同）。\n- 税收 = 10 × 35 = **$350**；DWL = ½ × 10 × (40 − 35) = **$25**。\n若改为对买方征税，市场标价变为 55，但买方总成本仍为 65、卖方仍得 55——**结果完全相同**。","h_en":"Per-unit Tax: A Complete Numerical Example","body_en":"Let Qd = 100 − P and Qs = P − 20, so equilibrium is P* = 60, Q* = 40. A tax of t = $10 is levied on sellers:\n- New supply: Qs = (P − 10) − 20 → 100 − P = P − 30 → **P_c = 65, Q = 35**, P_s = 55.\n- Consumers bear $5 and producers bear $5 (the two lines have slopes of the same absolute value).\n- Tax revenue = 10 × 35 = **$350**; DWL = ½ × 10 × (40 − 35) = **$25**.\nIf the tax is levied on buyers instead, the market price becomes 55, but the buyers' total cost is still 65 and sellers still receive 55 — **the outcome is exactly the same**."},{"h":"补贴与配额","body":"**补贴** s = $6（同一市场）：Qs = P + 6 − 20 → 100 − P = P − 14 → 消费者价 **$57**，生产者实得 $63，Q = 43。政府支出 = 6 × 43 = **$258**；DWL = ½ × 6 × 3 = $9（生产了 MC > MB 的单位）。\n**配额** Q = 30：消费者价由需求决定 = 70，供给价 = 50，每单位配额租金 20，总租金 $600，归持有配额许可的一方；DWL = ½ × 20 × 10 = $100。","h_en":"Subsidies and Quotas","body_en":"**Subsidy** s = $6 (same market): Qs = P + 6 − 20 → 100 − P = P − 14 → consumer price **$57**, producers receive $63, Q = 43. Government spending = 6 × 43 = **$258**; DWL = ½ × 6 × 3 = $9 (units are produced for which MC > MB).\n**Quota** Q = 30: the consumer price is determined by demand = 70, the supply price = 50, the quota rent is 20 per unit, and the total rent of $600 goes to whoever holds the quota licenses; DWL = ½ × 20 × 10 = $100."},{"h":"税率与税收收入（竞赛延伸）","body":"在上述市场中，税后数量 Q_t = (80 − t)/2，税收 R(t) = t(80 − t)/2。\n- R 在 t = 40 时最大，R = $800；税率再高，数量萎缩使收入下降（类似**拉弗曲线**思想）。\n- DWL = ½ × t × (t/2) 随 t 的**平方**增长：税率翻倍，DWL 约变为 4 倍。\n政策权衡：对缺乏弹性的商品征税，扭曲小、收入稳定，但往往更具累退性 (regressive)。","h_en":"Tax Rates and Tax Revenue (Competition Extension)","body_en":"In the market above, the after-tax quantity is Q_t = (80 − t)/2 and tax revenue is R(t) = t(80 − t)/2.\n- R is maximized at t = 40, where R = $800; at higher tax rates, the shrinking quantity makes revenue fall (similar to the idea of the **Laffer curve**).\n- DWL = ½ × t × (t/2) grows with the **square** of t: doubling the tax roughly quadruples the DWL.\nPolicy trade-off: taxing goods with inelastic demand causes little distortion and yields stable revenue, but such taxes are often more regressive."}],"pitfalls":["把价格上限画在均衡价格之上仍说会产生短缺——没有约束力的上限不改变结果。","征税后用消费者价格代入供给方程（应代入 P_c − t）。","把税收收入或配额租金误算作无谓损失。","认为补贴一定提高社会福利——在无外部性的竞争市场中补贴产生 DWL。","价格上限下的成交量取需求量——实际成交量为较小的供给量。"],"exams":{"AP":"Micro Unit 2 (2.8 Government intervention)","IB":"2.7","AL":"9708 AS 3","IEO":"Government & markets","NEC":"Micro core"},"diagram":"tax","summary_en":"Governments often intervene in markets through price ceilings, price floors, per-unit taxes, subsidies and quotas. This lesson uses the linear supply-and-demand model to analyze quantitatively how these policies affect price, quantity, surplus, government revenue and spending, and deadweight loss (DWL), and derives how the tax burden is shared.","pitfalls_en":["Drawing a price ceiling above the equilibrium price and still saying it causes a shortage — a non-binding ceiling does not change the outcome.","After a tax, substituting the consumer price into the supply equation (you should substitute P_c − t).","Mistakenly counting tax revenue or quota rent as deadweight loss.","Believing that a subsidy always raises social welfare — in a competitive market with no externalities, a subsidy creates DWL.","Taking quantity demanded as the quantity traded under a price ceiling — the quantity actually traded is the smaller quantity supplied."]},{"id":"m5","unit":"micro","title_zh":"消费者选择与行为经济学","title_en":"Consumer Choice & Behavioral Economics","level":"G10+","summary":"本课从效用出发解释需求曲线：边际效用递减、效用最大化法则 MU/P、预算约束、收入效应与替代效应以及无差异曲线分析；最后介绍行为经济学对“理性人”假设的修正，如锚定效应、损失厌恶、现时偏好与助推 (nudge)。","concepts":[{"zh":"总效用与边际效用","en":"Total & Marginal Utility","def":"总效用 (TU) 是消费带来的总满足；边际效用 (MU) 是多消费一单位带来的 TU 增量。","def_en":"Total utility (TU) is the total satisfaction gained from consumption; marginal utility (MU) is the increase in TU from consuming one more unit."},{"zh":"边际效用递减","en":"Diminishing Marginal Utility","def":"随着消费量增加，每多一单位带来的额外满足逐渐下降。","def_en":"As consumption increases, the additional satisfaction from each extra unit gradually falls."},{"zh":"效用最大化法则","en":"Utility-Maximizing Rule","def":"在预算用尽时，使每种商品每一美元的边际效用相等：MU_X/P_X = MU_Y/P_Y。","def_en":"When the budget is fully spent, the marginal utility per dollar is equal across all goods: MU_X/P_X = MU_Y/P_Y."},{"zh":"预算约束线","en":"Budget Constraint","def":"P_X·X + P_Y·Y = I，表示收入全部花完时能买的组合；斜率为 −P_X/P_Y（X 在横轴）。","def_en":"P_X·X + P_Y·Y = I, showing the combinations that can be bought when all income is spent; the slope is −P_X/P_Y (with X on the horizontal axis)."},{"zh":"无差异曲线","en":"Indifference Curve","def":"给消费者带来相同效用的商品组合的轨迹；通常向下倾斜、凸向原点，斜率为边际替代率 (MRS)。","def_en":"The locus of combinations of goods that give the consumer the same utility; usually downward-sloping and convex to the origin, with a slope equal to the marginal rate of substitution (MRS)."},{"zh":"替代效应与收入效应","en":"Substitution & Income Effects","def":"价格变化引起的需求量变化可分解为相对价格变化带来的替代效应和实际收入变化带来的收入效应。","def_en":"The change in quantity demanded caused by a price change can be decomposed into the substitution effect, due to the change in relative prices, and the income effect, due to the change in real income."},{"zh":"吉芬商品","en":"Giffen Good","def":"极强劣等品，收入效应超过替代效应，使价格上升需求量反而上升；现实中极为罕见。","def_en":"An extremely inferior good whose income effect outweighs the substitution effect, so that quantity demanded actually rises when price rises; extremely rare in reality."},{"zh":"有限理性","en":"Bounded Rationality","def":"人受信息、时间和认知能力限制，常用经验法则 (heuristics) 做“足够好”的决策。","def_en":"People are limited by information, time and cognitive ability, and often use rules of thumb (heuristics) to make \"good enough\" decisions."},{"zh":"损失厌恶","en":"Loss Aversion","def":"损失带来的痛苦大于同等收益带来的快乐，导致禀赋效应和维持现状偏好。","def_en":"The pain of a loss is greater than the pleasure of an equal gain, leading to the endowment effect and status quo bias."},{"zh":"助推","en":"Nudge / Choice Architecture","def":"在不禁止任何选项、不显著改变经济激励的前提下，通过改变选择呈现方式（如默认选项）引导行为。","def_en":"Guiding behavior by changing how choices are presented (such as the default option), without forbidding any option or significantly changing economic incentives."}],"formulas":[{"name":"边际效用","f":"MU = ΔTU ÷ ΔQ","note":"表格题逐行相减。","name_en":"Marginal utility","note_en":"For table questions, subtract row by row."},{"name":"效用最大化条件","f":"MU_X ÷ P_X = MU_Y ÷ P_Y，且 P_X·X + P_Y·Y = I","note":"若 MU_X/P_X > MU_Y/P_Y，应多买 X、少买 Y。","name_en":"Utility-maximizing condition","note_en":"If MU_X/P_X > MU_Y/P_Y, buy more X and less Y.","f_en":"MU_X ÷ P_X = MU_Y ÷ P_Y, and P_X·X + P_Y·Y = I"},{"name":"预算线斜率","f":"slope = −P_X ÷ P_Y","note":"X 在横轴；收入变化平移预算线，价格变化使其旋转。","name_en":"Slope of the budget line","note_en":"X is on the horizontal axis; a change in income shifts the budget line parallel, while a change in price makes it pivot."},{"name":"最优点（无差异曲线）","f":"MRS = MU_X ÷ MU_Y = P_X ÷ P_Y","note":"对 U = X·Y，得 X = I ÷ (2P_X)，Y = I ÷ (2P_Y)。","name_en":"Optimum (indifference curves)","note_en":"For U = X·Y, X = I ÷ (2P_X) and Y = I ÷ (2P_Y)."}],"sections":[{"h":"边际效用与效用最大化","body":"消费者把每一美元花在“每美元边际效用 (MU/P)”最高的地方，直到各商品 MU/P 相等且预算用完。\n例：收入 $10，P_X = $2，P_Y = $1。X 前 4 单位的 MU 为 16、12、8、4；Y 前 6 单位的 MU 为 10、8、6、4、3、2。\n- 每美元 MU：X 为 8、6、4、2；Y 为 10、8、6、4、3、2。\n- 依次购买每美元 MU 最高的单位，最终买 **3 单位 X、4 单位 Y**（花费 6 + 4 = 10），此时 MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1，总效用 64，为所有可负担组合中最高。","h_en":"Marginal Utility and Utility Maximization","body_en":"The consumer spends each dollar where the \"marginal utility per dollar (MU/P)\" is highest, until MU/P is equal across goods and the budget is used up.\nExample: income is $10, P_X = $2, P_Y = $1. The MU of the first 4 units of X is 16, 12, 8, 4; the MU of the first 6 units of Y is 10, 8, 6, 4, 3, 2.\n- MU per dollar: for X, 8, 6, 4, 2; for Y, 10, 8, 6, 4, 3, 2.\n- Buying, in turn, the unit with the highest MU per dollar, the consumer ends up with **3 units of X and 4 units of Y** (spending 6 + 4 = 10). At this point MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1, and total utility is 64, the highest of all affordable combinations."},{"h":"预算线与无差异曲线 (A-Level/IEO)","body":"预算线：P_X·X + P_Y·Y = I。收入 $60，P_X = 3，P_Y = 6：横截距 20，纵截距 10，斜率 −0.5。\n无差异曲线凸向原点，反映边际替代率递减；最优点在无差异曲线与预算线**相切**处：MRS = P_X/P_Y。\n对效用函数 U = XY：MU_X = Y，MU_Y = X，相切条件 Y/X = P_X/P_Y，得 X = I/(2P_X)。例如 I = 120，P_X = 2，P_Y = 4 → **X = 30，Y = 15**。","h_en":"Budget Lines and Indifference Curves (A-Level/IEO)","body_en":"Budget line: P_X·X + P_Y·Y = I. With income $60, P_X = 3 and P_Y = 6: the horizontal intercept is 20, the vertical intercept is 10 and the slope is −0.5.\nIndifference curves are convex to the origin, reflecting a diminishing marginal rate of substitution; the optimum is where the indifference curve is **tangent** to the budget line: MRS = P_X/P_Y.\nFor the utility function U = XY: MU_X = Y and MU_Y = X, so the tangency condition is Y/X = P_X/P_Y, giving X = I/(2P_X). For example, I = 120, P_X = 2, P_Y = 4 → **X = 30, Y = 15**."},{"h":"收入效应与替代效应","body":"价格下降时：\n- **替代效应**总是使该商品需求量上升（它相对变便宜了）。\n- **收入效应**：正常品需求量上升；劣等品需求量下降。\n- 劣等品通常替代效应占主导，需求曲线仍向下倾斜；只有收入效应超过替代效应的吉芬商品需求曲线才向上倾斜。\n竞赛延伸（希克斯分解，保持效用不变）：U = XY，I = 120，P_Y = 4，P_X 由 2 升到 4：X 从 30 降到 15。在新价格下保持原效用 450 的补偿组合 X = √450 ≈ 21.2，所以替代效应 ≈ −8.8，收入效应 ≈ −6.2。","h_en":"Income and Substitution Effects","body_en":"When price falls:\n- The **substitution effect** always increases the quantity demanded of the good (it has become relatively cheaper).\n- The **income effect**: quantity demanded rises for a normal good and falls for an inferior good.\n- For inferior goods, the substitution effect usually dominates, so the demand curve still slopes downward; only for a Giffen good, where the income effect outweighs the substitution effect, does the demand curve slope upward.\nCompetition extension (Hicks decomposition, holding utility constant): U = XY, I = 120, P_Y = 4, and P_X rises from 2 to 4: X falls from 30 to 15. The compensated bundle that keeps the original utility of 450 at the new prices has X = √450 ≈ 21.2, so the substitution effect ≈ −8.8 and the income effect ≈ −6.2."},{"h":"行为经济学","body":"传统模型假设理性、自利、信息完全；行为经济学发现系统性偏差：\n- **锚定效应 (anchoring)**：受先看到的数字影响，如“原价 $299，现价 $149”。\n- **损失厌恶 (loss aversion)** 与**禀赋效应 (endowment effect)**：对已拥有物品估价更高。\n- **现时偏好 (present bias)**／双曲贴现：今天偏好即时回报，但对遥远未来却愿意等待，造成时间不一致 (time inconsistency)，如拖延、储蓄不足。\n- **框架效应 (framing)**：“90% 存活率”比“10% 死亡率”更易被接受。\n- **助推 (nudge)**：养老金自动加入 (auto-enrollment) 作为默认选项，大幅提高参与率而不限制选择自由。","h_en":"Behavioral Economics","body_en":"Traditional models assume that people are rational, self-interested and fully informed; behavioral economics has found systematic biases:\n- **Anchoring**: being influenced by the first number seen, e.g. \"was $299, now $149\".\n- **Loss aversion** and the **endowment effect**: valuing items one already owns more highly.\n- **Present bias** / hyperbolic discounting: preferring immediate rewards today while being willing to wait when both options are in the distant future, which causes time inconsistency, such as procrastination and undersaving.\n- **Framing**: \"a 90% survival rate\" is more readily accepted than \"a 10% mortality rate\".\n- **Nudge**: making auto-enrollment in pension schemes the default option greatly increases participation without restricting freedom of choice."}],"pitfalls":["只比较 MU 大小而不除以价格；正确依据是每美元边际效用 MU/P。","认为总效用下降才是边际效用递减——MU 递减时 TU 仍可能上升。","把所有劣等品都当成吉芬商品；劣等品的需求曲线通常仍向下倾斜。","预算线斜率写成 −P_Y/P_X（横纵轴搞反）。","把助推理解为强制或罚款——助推保留全部选择自由。"],"exams":{"AP":"Micro Unit 1 (1.6 Marginal analysis & consumer choice)","IB":"2.4 (behavioural economics)","AL":"9708 A2 7 (utility, indifference curves, budget lines)","IEO":"Consumer choice & behavioural economics","NEC":"Micro"},"diagram":null,"summary_en":"This lesson explains the demand curve starting from utility: diminishing marginal utility, the utility-maximizing rule MU/P, the budget constraint, income and substitution effects, and indifference curve analysis. Finally, it introduces how behavioral economics modifies the \"rational agent\" assumption, with examples such as anchoring, loss aversion, present bias and nudges.","pitfalls_en":["Comparing only the size of MU without dividing by price; the correct basis is marginal utility per dollar, MU/P.","Thinking that diminishing marginal utility means total utility is falling — TU can still be rising while MU is diminishing.","Treating all inferior goods as Giffen goods; the demand curve for an inferior good usually still slopes downward.","Writing the slope of the budget line as −P_Y/P_X (mixing up the horizontal and vertical axes).","Understanding a nudge as a mandate or a fine — a nudge preserves complete freedom of choice."]},{"id":"m6","unit":"micro","title_zh":"生产与成本","title_en":"Production & Costs","level":"G9+","summary":"本课研究厂商如何把投入变成产出，以及产量变化时各类成本如何变动。短期内至少一种要素固定，边际收益递减决定了成本曲线的形状；长期内所有要素可变，规模经济与规模不经济决定长期平均成本曲线。最后区分会计利润与经济利润，为学习市场结构打基础。","concepts":[{"zh":"短期","en":"Short run","def":"至少有一种生产要素（通常是资本/厂房）固定不变的时期；并非指具体的日历时间。","def_en":"A period in which at least one factor of production (usually capital/the plant) is fixed; it does not refer to any specific length of calendar time."},{"zh":"总产量/边际产量/平均产量","en":"TP / MP / AP","def":"TP 为给定劳动量下的总产出；MP = ΔTP/ΔL 为多雇一单位劳动带来的额外产出；AP = TP/L。","def_en":"TP is total output for a given quantity of labour; MP = ΔTP/ΔL is the extra output from hiring one more unit of labour; AP = TP/L."},{"zh":"边际收益递减规律","en":"Law of Diminishing Marginal Returns","def":"在其他要素固定时，不断增加一种可变要素，其边际产量最终会下降。它是短期概念。","def_en":"When other factors are held fixed, adding more and more of one variable factor will eventually cause its marginal product to fall. It is a short-run concept."},{"zh":"固定成本与可变成本","en":"Fixed Cost (FC) & Variable Cost (VC)","def":"FC 不随产量变化（即使产量为 0 也要支付，如租金）；VC 随产量变化（如原材料、计时工资）。TC = FC + VC。","def_en":"FC does not change with output (it must be paid even when output is 0, e.g. rent); VC changes with output (e.g. raw materials, hourly wages). TC = FC + VC."},{"zh":"边际成本","en":"Marginal Cost (MC)","def":"多生产一单位产品带来的总成本增量，MC = ΔTC/ΔQ = ΔVC/ΔQ。","def_en":"The increase in total cost from producing one more unit of output: MC = ΔTC/ΔQ = ΔVC/ΔQ."},{"zh":"平均成本","en":"AFC / AVC / ATC","def":"AFC = FC/Q（持续下降）；AVC = VC/Q；ATC = TC/Q = AFC + AVC。","def_en":"AFC = FC/Q (falls continuously); AVC = VC/Q; ATC = TC/Q = AFC + AVC."},{"zh":"规模经济","en":"Economies of Scale","def":"长期中所有投入按比例扩大时，长期平均成本 (LRATC) 下降的现象，来源于专业分工、大宗采购、技术不可分性等。","def_en":"The fall in long-run average total cost (LRATC) as all inputs are scaled up in the long run, arising from specialisation and division of labour, bulk buying, technical indivisibilities, and so on."},{"zh":"规模不经济","en":"Diseconomies of Scale","def":"企业过大导致协调、沟通与激励问题，使 LRATC 上升。","def_en":"When a firm becomes too large, problems of coordination, communication and motivation cause LRATC to rise."},{"zh":"最小有效规模","en":"Minimum Efficient Scale (MES)","def":"LRATC 首次达到最低点时的产量；MES 相对于市场需求越大，行业越可能集中（甚至形成自然垄断）。","def_en":"The output at which LRATC first reaches its minimum; the larger the MES relative to market demand, the more concentrated the industry is likely to be (possibly even a natural monopoly)."},{"zh":"经济利润","en":"Economic Profit","def":"总收益减去全部机会成本（显性成本 + 隐性成本）；经济利润为 0 称为正常利润 (normal profit)。","def_en":"Total revenue minus all opportunity costs (explicit costs + implicit costs); an economic profit of 0 is called normal profit."}],"formulas":[{"name":"边际产量与平均产量","f":"MP_L = ΔTP/ΔL ;  AP_L = TP/L","note":"MP > AP 时 AP 上升；MP < AP 时 AP 下降；MP 穿过 AP 的最高点。","name_en":"Marginal product and average product","note_en":"When MP > AP, AP rises; when MP < AP, AP falls; MP cuts AP at the maximum of AP."},{"name":"总成本","f":"TC = FC + VC","note":"产量为 0 时 TC = FC。","name_en":"Total cost","note_en":"When output is 0, TC = FC."},{"name":"平均成本","f":"ATC = TC/Q = AFC + AVC","note":"ATC 与 AVC 的垂直距离等于 AFC，随 Q 增大而缩小。","name_en":"Average cost","note_en":"The vertical distance between ATC and AVC equals AFC, which shrinks as Q increases."},{"name":"边际成本","f":"MC = ΔTC/ΔQ = ΔVC/ΔQ","note":"固定成本不影响 MC。若 TC 为函数，MC 为其导数。","name_en":"Marginal cost","note_en":"Fixed cost does not affect MC. If TC is given as a function, MC is its derivative."},{"name":"MC 与 MP 的关系","f":"MC = w ÷ MP_L","note":"工资 w 不变时，MP 上升则 MC 下降；边际收益递减使 MC 上升。","name_en":"Relationship between MC and MP","note_en":"With the wage w constant, MC falls when MP rises; diminishing marginal returns make MC rise."},{"name":"利润","f":"经济利润 = TR − 显性成本 − 隐性成本 ;  会计利润 = TR − 显性成本","note":"隐性成本包括业主放弃的工资、自有资金的利息等。","name_en":"Profit","note_en":"Implicit costs include the salary the owner gives up, the interest forgone on the owner's own funds, and so on.","f_en":"Economic profit = TR − explicit costs − implicit costs ;  Accounting profit = TR − explicit costs"}],"sections":[{"h":"短期生产：边际收益递减","body":"短期内厂房固定，厂商只能通过增加工人来扩大产出。起初由于**专业化分工**，每多雇一名工人带来的**边际产量 (MP)** 可能上升；但随着越来越多工人挤在同样的设备上，MP 最终会下降——这就是**边际收益递减规律**。\n数值例子：某面包店工人数 L = 0,1,2,3,4 时，总产量 TP = 0,10,25,35,40。\n- MP 依次为 10、15、10、5：从第 3 名工人开始边际收益递减。\n- AP 依次为 10、12.5、11.7、10：当 MP > AP 时 AP 上升，MP < AP 时 AP 下降。\n注意：边际收益递减 ≠ 总产量下降。只有 MP < 0 时 TP 才下降。","h_en":"Short-run production: diminishing marginal returns","body_en":"In the short run the plant is fixed, so the firm can only expand output by hiring more workers. At first, thanks to **specialisation and division of labour**, the **marginal product (MP)** of each additional worker may rise; but as more and more workers crowd onto the same equipment, MP eventually falls — this is the **law of diminishing marginal returns**.\nNumerical example: in a bakery, when the number of workers is L = 0, 1, 2, 3, 4, total product is TP = 0, 10, 25, 35, 40.\n- MP is 10, 15, 10, 5 in turn: diminishing marginal returns set in from the 3rd worker.\n- AP is 10, 12.5, 11.7, 10 in turn: when MP > AP, AP rises; when MP < AP, AP falls.\nNote: diminishing marginal returns ≠ falling total product. TP falls only when MP < 0."},{"h":"短期成本曲线家族","body":"由于工资不变时 **MC = w ÷ MP**，MP 先升后降就意味着 **MC 先降后升**，呈 U 形（通常画成“对勾”形）。\n- **AFC** 随产量增加一直下降（固定成本被摊薄）。\n- **AVC、ATC** 呈 U 形；ATC 在 AVC 上方，二者距离等于 AFC，越来越小。\n- **MC 从下方穿过 AVC 和 ATC 的最低点**：只要边际值低于平均值，平均值就被拉低；边际值高于平均值，平均值就被拉高（类比：新考试成绩低于平均分会拉低平均分）。\n- 由于 AVC 最低点对应的产量小于 ATC 最低点对应的产量，MC 先穿过 AVC 的最低点，再穿过 ATC 的最低点。\n数值例子：FC = 50，Q = 1…5 时 TC = 80, 100, 114, 136, 170。MC = 30, 20, 14, 22, 34；AVC = 30, 25, 21.3, 21.5, 24。Q = 3 时 AVC 最低，此后 MC(22) 高于 AVC，AVC 开始上升。","h_en":"The family of short-run cost curves","body_en":"Because **MC = w ÷ MP** when the wage is constant, an MP that first rises and then falls means that **MC first falls and then rises**, giving a U shape (usually drawn as a \"tick\" shape).\n- **AFC** falls continuously as output rises (the fixed cost is spread more thinly).\n- **AVC and ATC** are U-shaped; ATC lies above AVC, and the gap between them equals AFC, which keeps getting smaller.\n- **MC cuts AVC and ATC from below at their minimum points**: whenever the marginal value is below the average, it pulls the average down; whenever the marginal value is above the average, it pulls the average up (analogy: a new test score below your average pulls your average down).\n- Because the output at the minimum of AVC is smaller than the output at the minimum of ATC, MC passes through the minimum of AVC first and then through the minimum of ATC.\nNumerical example: FC = 50, and for Q = 1…5, TC = 80, 100, 114, 136, 170. MC = 30, 20, 14, 22, 34; AVC = 30, 25, 21.3, 21.5, 24. AVC is lowest at Q = 3; after that MC (22) is above AVC, so AVC starts to rise."},{"h":"长期：规模经济与 LRATC","body":"长期内所有投入都可变，厂商可以选择厂房规模。**长期平均成本曲线 (LRATC)** 是各种短期 ATC 曲线的“包络线”。\n- **规模经济**（LRATC 下降）：技术性（大型机器更高效）、管理性（专业经理人）、采购性（批量折扣）、融资性（大企业借款利率低）。\n- **规模报酬不变**：LRATC 水平段。\n- **规模不经济**（LRATC 上升）：层级过多、沟通协调困难、员工积极性下降。\n**区分**：边际收益递减是**短期**现象（有固定要素）；规模经济/不经济是**长期**现象（所有要素同比变化）。竞赛题常用这一点设陷阱。","h_en":"The long run: economies of scale and LRATC","body_en":"In the long run all inputs are variable, so the firm can choose the size of its plant. The **long-run average total cost curve (LRATC)** is the \"envelope\" of all the short-run ATC curves.\n- **Economies of scale** (LRATC falling): technical (large machines are more efficient), managerial (specialist managers), purchasing (bulk discounts), financial (large firms borrow at lower interest rates).\n- **Constant returns to scale**: the flat section of LRATC.\n- **Diseconomies of scale** (LRATC rising): too many layers of hierarchy, difficulties of communication and coordination, falling staff motivation.\n**Distinguish**: diminishing marginal returns is a **short-run** phenomenon (there is a fixed factor); economies/diseconomies of scale are **long-run** phenomena (all factors change in the same proportion). Competition questions often use this to set a trap."},{"h":"会计利润 vs 经济利润","body":"经济学家衡量成本时计入**机会成本**。\n例：小李辞去年薪 12 万元的工作开咖啡店，投入自有资金 20 万元（本可获 5% 利息）。年收入 50 万元，房租、原料、员工工资等显性成本 30 万元。\n- 会计利润 = 50 − 30 = 20 万元。\n- 隐性成本 = 12 + 20×5% = 13 万元。\n- 经济利润 = 20 − 13 = 7 万元 > 0，说明开店比次优选择更好。\n经济利润为 0 时，厂商仍获得**正常利润**——即恰好补偿了所有机会成本，因此没有动力退出行业。","h_en":"Accounting profit vs economic profit","body_en":"When economists measure costs, they include **opportunity costs**.\nExample (all figures in units of ¥10,000): Xiao Li quits a job paying 12 a year to open a café, investing 20 of her own savings (which could have earned 5% interest). Annual revenue is 50, and explicit costs such as rent, ingredients and staff wages are 30.\n- Accounting profit = 50 − 30 = 20.\n- Implicit costs = 12 + 20×5% = 13.\n- Economic profit = 20 − 13 = 7 > 0, which shows that opening the café is better than the next best alternative.\nWhen economic profit is 0, the firm is still earning **normal profit** — that is, it is exactly covering all of its opportunity costs, so it has no incentive to leave the industry."}],"pitfalls":["把“边际收益递减”说成“总产量下降”——MP 下降时 TP 仍可能上升。","混淆边际收益递减（短期）与规模不经济（长期）。","认为固定成本会影响边际成本或短期产量决策——MC 只取决于可变成本。","画图时 MC 穿过 ATC/AVC 的位置错误：必须穿过它们的最低点。","计算经济利润时漏掉隐性成本（放弃的工资、自有资金利息）。"],"exams":{"AP":"Micro Unit 3 (3.1–3.4)","IB":"2.13 HL (production & costs)","AL":"9708 A2 7.5","IEO":"Firms, technology & costs","NEC":"Micro: production & costs"},"diagram":"costs","summary_en":"This lesson looks at how firms turn inputs into output, and how the different types of cost change as output changes. In the short run at least one factor is fixed, and diminishing marginal returns determine the shape of the cost curves; in the long run all factors are variable, and economies and diseconomies of scale determine the long-run average cost curve. Finally, we distinguish accounting profit from economic profit, laying the foundation for the study of market structures.","pitfalls_en":["Describing \"diminishing marginal returns\" as \"falling total product\" — TP can still be rising while MP is falling.","Confusing diminishing marginal returns (short run) with diseconomies of scale (long run).","Thinking that fixed costs affect marginal cost or the short-run output decision — MC depends only on variable costs.","Drawing MC crossing ATC/AVC in the wrong place: it must pass through their minimum points.","Leaving out implicit costs (forgone salary, interest on the owner's own funds) when calculating economic profit."]},{"id":"m7","unit":"micro","title_zh":"市场结构","title_en":"Market Structures","level":"G10+","summary":"本课按竞争程度比较完全竞争、垄断竞争、寡头和垄断四种市场结构。所有厂商都按 MR = MC 选择利润最大化产量，但不同结构下价格、效率和长期利润截然不同。还将学习价格歧视、市场集中度指标以及自然垄断的管制。","concepts":[{"zh":"完全竞争","en":"Perfect Competition","def":"大量厂商、同质产品、自由进出、信息完全；单个厂商是价格接受者 (price taker)，P = MR = AR。","def_en":"Many firms, a homogeneous product, free entry and exit, and perfect information; each individual firm is a price taker, with P = MR = AR."},{"zh":"停业规则","en":"Shutdown Rule","def":"短期内若 P < AVC 最低点，厂商应停产（损失仅为 FC）；若 AVC ≤ P < ATC，继续生产以弥补部分固定成本。","def_en":"In the short run, if P is below the minimum of AVC, the firm should shut down (its loss is then just FC); if AVC ≤ P < ATC, it should keep producing so as to cover part of its fixed costs."},{"zh":"垄断","en":"Monopoly","def":"单一卖者、无相近替代品、进入壁垒高；面对向下倾斜的需求曲线，MR < P。","def_en":"A single seller, no close substitutes and high barriers to entry; the firm faces a downward-sloping demand curve, so MR < P."},{"zh":"无谓损失","en":"Deadweight Loss (DWL)","def":"因产量低于社会最优（P = MC）而损失的总剩余。","def_en":"The loss of total surplus caused by output being below the socially optimal level (P = MC)."},{"zh":"价格歧视","en":"Price Discrimination","def":"对同一产品向不同消费者收取不同价格，且差价并非由成本差异引起。一级：每单位按保留价格收费；三级：按群体分市场定价。","def_en":"Charging different consumers different prices for the same product, where the price differences are not due to differences in cost. First-degree: each unit is sold at the buyer's reservation price; third-degree: the market is split into groups, each charged its own price."},{"zh":"垄断竞争","en":"Monopolistic Competition","def":"大量厂商、差异化产品、自由进出；长期 P = ATC，但 P > MC，存在过剩产能 (excess capacity)。","def_en":"Many firms, differentiated products, free entry and exit; in the long run P = ATC but P > MC, and there is excess capacity."},{"zh":"寡头","en":"Oligopoly","def":"少数大厂商主导市场，决策相互依赖；可能出现卡特尔 (cartel)、价格领导或价格战。","def_en":"A few large firms dominate the market and their decisions are interdependent; cartels, price leadership or price wars may arise."},{"zh":"折弯需求曲线","en":"Kinked Demand Curve","def":"竞争对手跟降不跟涨，使需求在现价处折弯、MR 出现间断，从而解释寡头价格刚性。","def_en":"Rivals match price cuts but not price rises, so the demand curve is kinked at the current price and MR has a discontinuity, which explains price rigidity in oligopoly."},{"zh"
