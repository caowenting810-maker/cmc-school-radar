 full car insurance, a driver stops locking her car. This is an example of","o":["adverse selection","moral hazard","the free-rider problem","a positive externality"],"a":1,"e":"道德风险 (moral hazard) 是交易后的隐藏行为：投保后风险转嫁给保险公司，投保人防范减少。逆向选择 (adverse selection) 发生在交易前：高风险者更倾向于购买保险。","e_en":"Moral hazard is hidden action after a transaction: once insured, the risk is shifted to the insurer, so the policyholder takes fewer precautions. Adverse selection occurs before the transaction: high-risk people are more inclined to buy insurance."},{"id":"m10-03","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"On a Lorenz curve diagram, the area between the line of perfect equality and the Lorenz curve is 0.15 (the whole square has area 1). What is the Gini coefficient?","o":["0.15","0.35","0.30","0.70"],"a":2,"e":"基尼系数 G = A/(A + B)，其中 A + B 为平等线下方三角形面积 = 0.5。G = 0.15/0.5 = 0.30。0.15 是忘记除以 0.5；0.35 是 B 的面积 (0.5 − 0.15)；0.70 是 B/(A+B)。","e_en":"Gini coefficient G = A/(A + B), where A + B is the area of the triangle under the line of equality = 0.5. G = 0.15/0.5 = 0.30. 0.15 comes from forgetting to divide by 0.5; 0.35 is the area of B (0.5 − 0.15); 0.70 is B/(A+B)."},{"id":"m10-04","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Vaccinations create positive externalities. Without government intervention, the market will","o":["produce more than the socially optimal quantity","produce exactly the socially optimal quantity","charge a price above the marginal social benefit","produce less than the socially optimal quantity"],"a":3,"e":"正外部性使 MSB > MPB，消费者只按私人收益决定购买，市场产量低于 MSB = MSC 的社会最优产量，可用庇古补贴 (Pigouvian subsidy) 纠正。","e_en":"A positive externality means MSB > MPB; consumers decide how much to buy based only on private benefit, so market output is below the socially optimal output where MSB = MSC. This can be corrected with a Pigouvian subsidy."},{"id":"m10-05","t":"m10","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"In a market, marginal private benefit is MPB = 50 − Q and marginal private cost is MPC = 10 + Q. Each unit produced causes $6 of pollution damage to third parties. What is the socially optimal quantity?","o":["20","17","23","14"],"a":1,"e":"边际社会成本 MSC = MPC + 6 = 16 + Q。社会最优：MSB = MSC ⇒ 50 − Q = 16 + Q ⇒ Q* = 17。市场均衡为 50 − Q = 10 + Q ⇒ Q = 20（过度生产）。23 是误把外部成本加到收益方；14 是减去 12。庇古税应为每单位 6 美元。","e_en":"Marginal social cost MSC = MPC + 6 = 16 + Q. Social optimum: MSB = MSC ⇒ 50 − Q = 16 + Q ⇒ Q* = 17. The market equilibrium is 50 − Q = 10 + Q ⇒ Q = 20 (over-production). 23 comes from wrongly adding the external cost to the benefit side; 14 comes from subtracting 12. The Pigouvian tax should be $6 per unit."},{"id":"m10-06","t":"m10","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Person X earns $20,000 and pays $2,000 of a tax. Person Y earns $100,000 and pays $8,000 of the same tax. This tax is","o":["regressive","progressive","proportional","lump-sum"],"a":0,"e":"看平均税率：X 为 2000/20000 = 10%，Y 为 8000/100000 = 8%。收入越高平均税率越低 ⇒ 累退税 (regressive)。虽然 Y 缴税绝对额更多，但判断累进/累退看的是税额占收入的比例。定额税 (lump-sum) 应是人人缴纳相同金额。","e_en":"Look at the average tax rate: for X it is 2000/20000 = 10%, and for Y it is 8000/100000 = 8%. The higher the income, the lower the average tax rate ⇒ a regressive tax. Although Y pays more in absolute terms, whether a tax is progressive or regressive depends on the tax paid as a proportion of income. A lump-sum tax would mean everyone pays the same amount."},{"id":"m10-07","t":"m10","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Three residents are the only users of a proposed streetlight. Their marginal benefits are $40, $25 and $15. The streetlight costs $70 and is non-excludable. Which statement is correct?","o":["It is efficient to provide the streetlight, but the market may fail to provide it","It is inefficient because no single resident values it above $70","It is efficient and the market will always provide it","It is inefficient because total benefit is less than cost"],"a":0,"e":"公共物品的社会边际收益是各人边际收益的垂直加总：40 + 25 + 15 = 80 > 70，提供路灯是有效率的。但由于非排他，每个人都想搭便车 (free ride)，没有人单独愿意付 70，市场可能不提供——这就是需要政府提供的理由。","e_en":"The social marginal benefit of a public good is the vertical sum of individual marginal benefits: 40 + 25 + 15 = 80 > 70, so providing the streetlight is efficient. But because it is non-excludable, everyone wants to free ride and nobody is willing to pay 70 alone, so the market may not provide it — this is the case for government provision."},{"id":"m10-08","t":"m10","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"According to the Coase theorem, private bargaining can resolve an externality efficiently if","o":["property rights are clearly defined and transaction costs are low","the government imposes a Pigouvian tax","the polluter is always given the property right","many people are affected by the externality"],"a":0,"e":"科斯定理 (Coase theorem)：产权明确、交易成本低时，无论产权归谁，私下谈判都能达到有效率结果（分配不同）。受影响人数众多会使交易成本极高，这恰是科斯方案在空气污染等问题上失效的原因。","e_en":"Coase theorem: when property rights are clearly defined and transaction costs are low, private bargaining reaches the efficient outcome whoever holds the property rights (the distribution differs). A large number of affected people makes transaction costs extremely high, which is precisely why Coasian solutions fail for problems such as air pollution."},{"id":"m10-09","t":"m10","lv":3,"ex":["IEO","IB","AL"],"q":"Two firms must jointly cut emissions by 30 tonnes under a cap-and-trade scheme. Firm A's marginal abatement cost is MAC_A = 2a and Firm B's is MAC_B = 4b, where a and b are tonnes abated. If permits trade freely, what is the equilibrium permit price?","o":["$60","$30","$20","$40"],"a":3,"e":"许可证自由交易时，各企业减排到 MAC = 许可证价格，所以 MAC_A = MAC_B：2a = 4b，且 a + b = 30 ⇒ a = 20，b = 10，价格 = 2 × 20 = 40。这样总减排成本最低（低成本的 A 多减排）。若各减 15，MAC 分别为 30 与 60，并非成本最小。","e_en":"When permits can be traded freely, each firm abates up to the point where MAC = the permit price, so MAC_A = MAC_B: 2a = 4b, and a + b = 30 ⇒ a = 20, b = 10, and the price = 2 × 20 = 40. This minimises the total cost of abatement (the low-cost firm A abates more). If each firm cut 15, the MACs would be 30 and 60 respectively, which is not cost-minimising."},{"id":"m10-10","t":"m10","lv":3,"ex":["IEO","NEC","AL"],"q":"A factory's smoke damages a nearby laundry by $300 per year. A filter that eliminates the smoke costs the factory $200 per year. Transaction costs are zero and the factory has the legal right to pollute. According to the Coase theorem, what happens?","o":["No filter is installed because the factory has the right to pollute","The factory installs the filter and pays the laundry $300","The laundry pays the factory between $200 and $300 and the filter is installed","The laundry relocates, since damage exceeds the filter cost"],"a":2,"e":"过滤器成本 200 < 损害 300，安装过滤器是有效率的。工厂拥有污染权时，洗衣店愿意支付最多 300 避免损害，工厂接受至少 200 的补偿，双方在 200–300 之间达成交易，过滤器被安装。若产权属于洗衣店，工厂会自费安装（200 < 赔偿 300）。两种情况下效率结果相同，只有分配不同。","e_en":"The filter costs 200 < the damage of 300, so installing the filter is efficient. If the factory holds the right to pollute, the laundry is willing to pay up to 300 to avoid the damage and the factory will accept compensation of at least 200, so the two strike a deal between 200 and 300 and the filter is installed. If the property right belongs to the laundry, the factory installs the filter at its own expense (200 < compensation of 300). The efficient outcome is the same in both cases; only the distribution differs."},{"id":"M1-01","t":"M1","lv":1,"ex":["AP","NEC","IB"],"q":"Which of the following transactions would be counted in this year's GDP?","o":["A new car produced this year by a domestic factory and sold to a household","A household buys a used car from its neighbor","The government pays unemployment benefits to laid-off workers","An investor buys newly issued shares of a technology company"],"a":0,"e":"正确：当年在国内生产的新车是最终产品，计入消费 C。二手车交易不是当期生产；失业救济金是转移支付 (transfer payment)，没有对应产出；买股票属于金融资产交易，不是经济学意义上的投资 (investment)。","e_en":"Correct: a new car produced domestically this year is a final good and is counted in consumption, C. A used-car sale is not current production; unemployment benefits are a transfer payment with no corresponding output; buying shares is a financial asset transaction, not investment in the economic sense."},{"id":"M1-02","t":"M1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An economy has the following data (billions of dollars): consumption 800, gross private investment 200, government purchases 300, exports 150, imports 250, government transfer payments 100. What is GDP?","o":["$1,300 billion","$1,200 billion","$1,700 billion","$1,100 billion"],"a":1,"e":"GDP = C + I + G + (X − M) = 800 + 200 + 300 + (150 − 250) = 1,200。转移支付不计入 G。若忽略净出口得 1,300；把进口加上而非减去得 1,700；把转移支付减掉得 1,100，都是常见错误。","e_en":"GDP = C + I + G + (X − M) = 800 + 200 + 300 + (150 − 250) = 1,200. Transfer payments are not included in G. Ignoring net exports gives 1,300; adding imports instead of subtracting them gives 1,700; subtracting transfer payments gives 1,100 — all common mistakes."},{"id":"M1-03","t":"M1","lv":2,"ex":["AP","IB","AL"],"q":"In 2025 a country's nominal GDP is $1,320 billion and its real GDP measured in base-year prices is $1,200 billion. What is the 2025 GDP deflator?","o":["90.9","120","110","10"],"a":2,"e":"GDP平减指数 (GDP deflator) = 名义GDP ÷ 实际GDP × 100 = 1,320 ÷ 1,200 × 100 = 110，说明价格水平比基年高10%。90.9 是把分子分母颠倒；10 是价格上涨的百分比而非指数值。","e_en":"GDP deflator = nominal GDP ÷ real GDP × 100 = 1,320 ÷ 1,200 × 100 = 110, meaning the price level is 10% higher than in the base year. 90.9 comes from inverting the numerator and denominator; 10 is the percentage rise in prices, not the index value."},{"id":"M1-04","t":"M1","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A consumer basket contains 10 pizzas and 5 books. Prices are shown in the table. Using 2024 as the base year, what is the inflation rate from 2024 to 2025 measured by this price index?","tbl":[["Good","Quantity in basket","Price 2024","Price 2025"],["Pizza","10","$8","$9"],["Book","5","$12","$15"]],"o":["12.5%","25.0%","18.75%","About 17.9%"],"a":3,"e":"篮子成本 2024 = 10×8 + 5×12 = 140；2025 = 10×9 + 5×15 = 165。CPI_2025 = 165 ÷ 140 × 100 ≈ 117.9，通胀率 ≈ 17.9%。12.5% 和 25% 分别只看了比萨或书的涨幅；18.75% 是两者的简单平均，忽略了篮子的支出权重。","e_en":"Basket cost 2024 = 10×8 + 5×12 = 140; 2025 = 10×9 + 5×15 = 165. CPI_2025 = 165 ÷ 140 × 100 ≈ 117.9, so the inflation rate ≈ 17.9%. 12.5% and 25% look only at the price rise of pizza or of books respectively; 18.75% is the simple average of the two, ignoring the expenditure weights in the basket."},{"id":"M1-05","t":"M1","lv":1,"ex":["AP","IB","NEC"],"q":"A country has a working-age population of 250 million, a labor force of 160 million, and 148 million employed. What is the unemployment rate?","o":["7.5%","4.8%","8.1%","64%"],"a":0,"e":"失业人数 = 160 − 148 = 12（百万）。失业率 = 失业 ÷ 劳动力 = 12 ÷ 160 = 7.5%。4.8% 错用了工作年龄人口作分母；8.1% 错用了就业人数作分母；64% 是劳动参与率 (LFPR)。","e_en":"Unemployed = 160 − 148 = 12 (million). Unemployment rate = unemployed ÷ labor force = 12 ÷ 160 = 7.5%. 4.8% wrongly uses the working-age population as the denominator; 8.1% wrongly uses the number employed as the denominator; 64% is the labor force participation rate (LFPR)."},{"id":"M1-06","t":"M1","lv":2,"ex":["AP","IB","NEC"],"q":"Suppose a large number of unemployed workers become discouraged and stop looking for work. Other things equal, what happens to the measured unemployment rate and the labor force participation rate?","o":["The unemployment rate rises and the labor force participation rate is unchanged.","The unemployment rate falls and the labor force participation rate falls.","The unemployment rate is unchanged and the labor force participation rate falls.","Both the unemployment rate and the labor force participation rate rise."],"a":1,"e":"沮丧工人 (discouraged workers) 不再找工作即退出劳动力：分子（失业人数）和分母（劳动力）减少相同数量，失业率下降；劳动力减少而工作年龄人口不变，LFPR 下降。常见误区是认为失业率会上升或不变。","e_en":"Discouraged workers who stop looking for work leave the labor force: the numerator (number unemployed) and the denominator (labor force) fall by the same amount, so the unemployment rate falls; the labor force shrinks while the working-age population is unchanged, so the LFPR falls. A common misconception is that the unemployment rate would rise or stay the same."},{"id":"M1-07","t":"M1","lv":1,"ex":["AP","NEC","IB"],"q":"A worker at a furniture factory is laid off because a recession has reduced household spending on furniture. This is an example of","o":["frictional unemployment","structural unemployment","cyclical unemployment","seasonal unemployment"],"a":2,"e":"由衰退期总需求下降导致的失业是周期性失业 (cyclical unemployment)，经济复苏后岗位会回来。结构性失业是技能与岗位长期不匹配（如自动化淘汰岗位）；摩擦性失业是找工作过程中的短暂失业。","e_en":"Unemployment caused by the fall in aggregate demand during a recession is cyclical unemployment; the jobs come back when the economy recovers. Structural unemployment is a long-term mismatch between skills and jobs (e.g. jobs eliminated by automation); frictional unemployment is the short spell of unemployment while searching for a job."},{"id":"M1-08","t":"M1","lv":3,"ex":["IEO","NEC","AL"],"q":"An economy's actual unemployment rate is 8%. Frictional unemployment is 2.5% and structural unemployment is 3%. Assume Okun's rule of thumb: each percentage point of cyclical unemployment corresponds to real GDP 2% below potential. Which statement is correct?","o":["The natural rate is 5.5% and real GDP is about 2.5% below potential.","The natural rate is 3% and real GDP is about 10% below potential.","The natural rate is 8% and there is no output gap.","The natural rate is 5.5% and real GDP is about 5% below potential."],"a":3,"e":"自然失业率 = 摩擦性 + 结构性 = 2.5% + 3% = 5.5%；周期性失业 = 8% − 5.5% = 2.5 个百分点；按奥肯定律 (Okun's law) 产出缺口 ≈ 2 × 2.5 = 5%。只算到周期性失业就停下会误选 2.5%；把结构性失业当成自然率会得到 3% 和 10%。","e_en":"Natural rate of unemployment = frictional + structural = 2.5% + 3% = 5.5%; cyclical unemployment = 8% − 5.5% = 2.5 percentage points; by Okun's law the output gap ≈ 2 × 2.5 = 5%. Stopping after calculating cyclical unemployment leads to the wrong answer of 2.5%; treating structural unemployment as the natural rate gives 3% and 10%."},{"id":"M1-09","t":"M1","lv":3,"ex":["IEO","AL","IB"],"q":"Nominal GDP rises from $2,000 billion in Year 1 to $2,310 billion in Year 2. The GDP deflator (Year 1 = 100) is 105 in Year 2. What is the growth rate of real GDP from Year 1 to Year 2?","o":["10.0%","15.5%","10.5%","20.5%"],"a":0,"e":"Year 1 实际GDP = 2,000（基年）。Year 2 实际GDP = 2,310 ÷ 1.05 = 2,200。实际增长率 = 2,200 ÷ 2,000 − 1 = 10.0%。15.5% 是名义增长率；10.5% 是近似式 15.5% − 5% 的结果，精确计算应为 (1.155 ÷ 1.05) − 1 = 10%；20.5% 是把通胀加到名义增长上。","e_en":"Year 1 real GDP = 2,000 (base year). Year 2 real GDP = 2,310 ÷ 1.05 = 2,200. Real growth rate = 2,200 ÷ 2,000 − 1 = 10.0%. 15.5% is the nominal growth rate; 10.5% is the result of the approximation 15.5% − 5%, whereas the exact calculation is (1.155 ÷ 1.05) − 1 = 10%; 20.5% adds inflation to nominal growth."},{"id":"M2-01","t":"M2","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following best explains why the aggregate demand curve slopes downward?","o":["A lower price level makes consumers substitute toward goods whose relative prices have fallen.","A lower price level raises the real value of households' money holdings, so they buy more goods and services.","A lower price level reduces firms' production costs, so they produce more.","A lower price level causes the government to increase its purchases."],"a":1,"e":"AD向下倾斜来自宏观的财富效应 (wealth effect)、利率效应和汇率效应。选“替代相对便宜商品”是把微观需求曲线的替代效应搬到了宏观，所有价格同时下降时不存在相对价格变化；“成本下降、多生产”描述的是供给方；政府购买不随价格水平自动变化。","e_en":"AD slopes downward because of the macroeconomic wealth effect, interest-rate effect and exchange-rate effect. Choosing \"substituting towards relatively cheaper goods\" transfers the substitution effect of a microeconomic demand curve to macroeconomics — when all prices fall together there is no change in relative prices; \"costs fall, so firms produce more\" describes the supply side; government purchases do not change automatically with the price level."},{"id":"M2-02","t":"M2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following would shift the aggregate demand curve to the right?","o":["A decrease in the price level","A sharp increase in the world price of oil","An increase in consumer confidence","An appreciation of the domestic currency"],"a":2,"e":"消费者信心上升使消费 C 增加，AD 右移。价格水平下降只是沿AD曲线移动；油价上涨主要使SRAS左移；本币升值使出口变贵、进口变便宜，NX 下降，AD 左移。","e_en":"Higher consumer confidence increases consumption, C, so AD shifts right. A fall in the price level is only a movement along the AD curve; a rise in oil prices mainly shifts SRAS left; an appreciation of the domestic currency makes exports more expensive and imports cheaper, so NX falls and AD shifts left."},{"id":"M2-03","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy is in long-run equilibrium when the price of imported energy rises sharply. In the short run, what happens to the price level and real output?","o":["The price level rises and real output rises.","The price level falls and real output falls.","The price level is unchanged and real output falls.","The price level rises and real output falls."],"a":3,"e":"能源价格上涨是负面供给冲击，SRAS 左移：价格水平上升、实际产出下降，即成本推动型通胀/滞胀 (stagflation)。“价格与产出同时上升”是需求拉动 (AD右移) 的结果。","e_en":"A rise in energy prices is a negative supply shock, so SRAS shifts left: the price level rises and real output falls — cost-push inflation/stagflation. \"Prices and output both rise\" is the result of demand-pull (AD shifting right)."},{"id":"M2-04","t":"M2","lv":2,"ex":["AP","IB","AL"],"q":"Which of the following would shift the long-run aggregate supply curve to the right?","o":["An increase in labor productivity due to new technology","A cut in personal income taxes that raises consumption","An increase in the price level","An increase in nominal wages"],"a":0,"e":"LRAS 由资源和技术决定，技术进步提高劳动生产率 (productivity)，潜在产出增加，LRAS 右移。减税刺激消费移动的是AD；价格水平变化只是沿曲线移动；名义工资上升使SRAS左移，不影响LRAS。","e_en":"LRAS is determined by resources and technology; technological progress raises labor productivity, increasing potential output and shifting LRAS right. A tax cut that stimulates consumption shifts AD; a change in the price level is only a movement along the curve; higher nominal wages shift SRAS left and do not affect LRAS."},{"id":"M2-05","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy's potential real GDP is $5.0 trillion, but its current short-run equilibrium real GDP is $4.6 trillion. If the government takes no action, which describes the gap and the long-run self-adjustment?","o":["An inflationary gap of $0.4 trillion; nominal wages rise, shifting SRAS to the left","A recessionary gap of $0.4 trillion; nominal wages and input prices eventually fall, shifting SRAS to the right","A recessionary gap of $0.4 trillion; the falling price level automatically shifts AD to the right","A recessionary gap of $4.6 trillion; LRAS shifts left until it reaches current output"],"a":1,"e":"实际产出 4.6 < 潜在产出 5.0，衰退缺口 = 0.4 万亿。失业高于自然率，名义工资和投入品价格最终下降，SRAS 右移，价格水平下降、产出回到 5.0。价格下降只会沿AD移动，不会让AD移动；LRAS 不会因短期衰退而移动到当前产出。","e_en":"Actual output 4.6 < potential output 5.0, so there is a recessionary gap of 0.4 trillion. Unemployment is above the natural rate, so nominal wages and input prices eventually fall, SRAS shifts right, the price level falls and output returns to 5.0. A falling price level only causes a movement along AD, not a shift of AD; LRAS does not move to current output because of a short-run recession."},{"id":"M2-06","t":"M2","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following is most likely to cause demand-pull inflation?","o":["A sharp rise in world energy prices","A significant increase in labor productivity","A large increase in government spending when the economy is already near full employment","A fall in export demand due to a recession abroad"],"a":2,"e":"需求拉动型通胀 (demand-pull inflation) 来自AD右移，接近充分就业时增加政府支出主要推高价格。能源涨价是成本推动；生产率提高使SRAS右移、压低价格；外需下降使AD左移。","e_en":"Demand-pull inflation comes from a rightward shift of AD; near full employment, higher government spending mainly pushes up prices. Rising energy prices are cost-push; higher productivity shifts SRAS right and pushes prices down; lower foreign demand shifts AD left."},{"id":"M2-07","t":"M2","lv":3,"ex":["IEO","AL"],"q":"An economy has AD: Y = 1200 − 4P and SRAS: Y = 200 + 6P, where Y is real output and P is the price level. Potential output is 900. Holding SRAS fixed, by how much must AD shift horizontally (at every price level) for the short-run equilibrium to reach potential output?","o":["100","250","About 67","About 167"],"a":3,"e":"初始均衡：1200 − 4P = 200 + 6P ⇒ P = 100，Y = 800，缺口 = 100。在SRAS上 Y = 900 时 P = (900 − 200) ÷ 6 ≈ 116.7。新AD需满足 900 = A − 4 × 116.7 ⇒ A ≈ 1366.7，水平移动 = 1366.7 − 1200 ≈ 166.7。选 100 是忽略了价格水平上升会沿AD减少需求量（需求被SRAS斜率“稀释”）：移动量 = 缺口 × (1 + b/d) = 100 × (1 + 4/6) ≈ 167。","e_en":"Initial equilibrium: 1200 − 4P = 200 + 6P ⇒ P = 100, Y = 800, gap = 100. On SRAS, Y = 900 when P = (900 − 200) ÷ 6 ≈ 116.7. The new AD must satisfy 900 = A − 4 × 116.7 ⇒ A ≈ 1366.7, so the horizontal shift = 1366.7 − 1200 ≈ 166.7. Choosing 100 ignores the fact that the rise in the price level reduces the quantity demanded along AD (the demand shift is \"diluted\" by the slope of SRAS): shift = gap × (1 + b/d) = 100 × (1 + 4/6) ≈ 167."},{"id":"M2-08","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy starts in long-run equilibrium. Aggregate demand then increases permanently. After all wages and prices have fully adjusted, compared with the original equilibrium,","o":["the price level is higher and real output is back at potential","real output is permanently higher and the price level is unchanged","both real output and the price level are permanently higher","the price level returns to its original level and real output is higher"],"a":0,"e":"短期内AD右移使价格和产出都上升（通胀缺口）；长期名义工资上涨使SRAS左移，产出回到LRAS（潜在产出），价格水平更高。需求冲击在长期是中性的 (long-run neutrality)：只影响价格，不影响实际产出。","e_en":"In the short run the rightward shift of AD raises both prices and output (an inflationary gap); in the long run nominal wages rise, SRAS shifts left, and output returns to LRAS (potential output) at a higher price level. Demand shocks are neutral in the long run (long-run neutrality): they affect only prices, not real output."},{"id":"M2-09","t":"M2","lv":3,"ex":["IEO","NEC","AL"],"q":"An adverse supply shock pushes an economy into stagflation. If the central bank responds by stimulating aggregate demand to restore output to potential, the most likely outcome relative to no policy response is that","o":["both output and the price level return to their original levels","output returns to potential sooner, but the price level ends up higher","the price level falls back while output rises","output falls further, but inflation is eliminated"],"a":1,"e":"滞胀时SRAS左移。扩张AD使产出更快回到潜在水平，但价格水平在更高处稳定（“容纳”供给冲击 accommodating）。若不干预，工资最终下降使SRAS回到原位，价格和产出都回到原点，但过程可能漫长且失业痛苦。需求管理无法同时修复产出和价格，这就是滞胀的政策两难。","e_en":"In stagflation SRAS has shifted left. Expanding AD returns output to its potential level more quickly, but the price level settles at a higher level (\"accommodating\" the supply shock). Without intervention, wages eventually fall and SRAS shifts back to its original position, so prices and output both return to where they started, but the process may be long and involve painful unemployment. Demand management cannot fix output and prices at the same time — this is the policy dilemma of stagflation."},{"id":"M3-01","t":"M3","lv":1,"ex":["AP","IB","NEC"],"q":"If the marginal propensity to consume is 0.8, what is the maximum change in real GDP that could result from a $20 billion increase in government purchases?","o":["$80 billion increase","$25 billion increase","$100 billion increase","$16 billion increase"],"a":2,"e":"支出乘数 = 1 ÷ MPS = 1 ÷ (1 − 0.8) = 5，ΔY = 5 × 20 = 100（十亿美元）。80 是误用了税收乘数 (−MPC/MPS = −4)；25 是误用 1/MPC；16 是 MPC × 20。","e_en":"Spending multiplier = 1 ÷ MPS = 1 ÷ (1 − 0.8) = 5, so ΔY = 5 × 20 = 100 (billion dollars). 80 wrongly uses the tax multiplier (−MPC/MPS = −4); 25 wrongly uses 1/MPC; 16 is MPC × 20."},{"id":"M3-02","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The marginal propensity to consume is 0.75. If the government cuts taxes by $40 billion, what is the maximum change in real GDP?","o":["An increase of $160 billion","An increase of $30 billion","An increase of $40 billion","An increase of $120 billion"],"a":3,"e":"税收乘数 = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3。减税 ΔT = −40，ΔY = −3 × (−40) = +120。160 是误用支出乘数 4；减税第一轮只有 MPC × 40 = 30 被花掉，所以效果小于同等规模的政府购买。30 只是第一轮消费增加量。","e_en":"Tax multiplier = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3. For a tax cut ΔT = −40, ΔY = −3 × (−40) = +120. 160 wrongly uses the spending multiplier of 4; in the first round of a tax cut only MPC × 40 = 30 is spent, so the effect is smaller than that of an equal increase in government purchases. 30 is only the first-round increase in consumption."},{"id":"M3-03","t":"M3","lv":2,"ex":["AP","IB","AL"],"q":"With an MPC of 0.9, the government increases purchases by $50 billion and finances it entirely by raising taxes by $50 billion. Ignoring crowding out, what is the change in real GDP?","o":["An increase of $50 billion","No change","An increase of $500 billion","An increase of $950 billion"],"a":0,"e":"支出乘数 = 1 ÷ 0.1 = 10，ΔY_G = 500；税收乘数 = −0.9 ÷ 0.1 = −9，ΔY_T = −450。净效应 = 500 − 450 = 50，即平衡预算乘数 (balanced-budget multiplier) = 1。以为两者抵消得“无变化”是最常见的误解；500 忽略了增税；950 是把两个效应相加。","e_en":"Spending multiplier = 1 ÷ 0.1 = 10, so ΔY_G = 500; tax multiplier = −0.9 ÷ 0.1 = −9, so ΔY_T = −450. Net effect = 500 − 450 = 50, i.e. the balanced-budget multiplier = 1. Thinking the two cancel out to give \"no change\" is the most common misconception; 500 ignores the tax increase; 950 adds the two effects together."},{"id":"M3-04","t":"M3","lv":1,"ex":["AP","IB","NEC","AL"],"q":"Which of the following is an example of an automatic stabilizer?","o":["A new highway construction program passed by the legislature","A progressive income tax system","Open market purchases of bonds by the central bank","A one-time tax rebate approved by the legislature during a recession"],"a":1,"e":"自动稳定器 (automatic stabilizer) 无需新立法，随经济周期自动变化：累进所得税在衰退时税收自动减少、繁荣时自动增加。修路计划和一次性退税都需要立法，属于相机抉择 (discretionary) 财政政策；公开市场操作是货币政策。","e_en":"An automatic stabilizer changes automatically with the business cycle without new legislation: under a progressive income tax, tax revenue falls automatically in a recession and rises automatically in a boom. A road-building programme and a one-off tax rebate both require legislation and are discretionary fiscal policy; open market operations are monetary policy."},{"id":"M3-05","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Potential real GDP is $2,000 billion and actual real GDP is $1,850 billion. The MPC is 0.8. Ignoring crowding out and price-level changes, which single fiscal action would exactly close the gap?","o":["Increase government purchases by $150 billion","Cut taxes by $30 billion","Increase government purchases by $30 billion","Cut taxes by $150 billion"],"a":2,"e":"缺口 = 2,000 − 1,850 = 150。支出乘数 = 1 ÷ 0.2 = 5，所需 ΔG = 150 ÷ 5 = 30。若用减税：税收乘数 = −4，需减税 150 ÷ 4 = 37.5，减税 30 只能增加 120，不够；增加150或减税150则会造成通胀缺口（误把缺口当作所需政策规模）。","e_en":"Gap = 2,000 − 1,850 = 150. Spending multiplier = 1 ÷ 0.2 = 5, so the required ΔG = 150 ÷ 5 = 30. Using a tax cut instead: tax multiplier = −4, so a tax cut of 150 ÷ 4 = 37.5 is needed; a tax cut of 30 would raise output by only 120, which is not enough; raising spending by 150 or cutting taxes by 150 would create an inflationary gap (mistaking the gap for the required size of the policy)."},{"id":"M3-06","t":"M3","lv":3,"ex":["IEO","AL","IB"],"q":"In an open economy, the MPC out of disposable income is 0.8, the marginal income tax rate is 0.25, and the marginal propensity to import (out of national income) is 0.1. By how much does equilibrium income rise if government purchases increase by $60 billion?","o":["$300 billion","$200 billion","$150 billion","$120 billion"],"a":3,"e":"每增加1元国民收入，可支配收入增加 0.75，消费增加 0.8 × 0.75 = 0.6，进口增加 0.1，所以对国内产品的边际支出 = 0.6 − 0.1 = 0.5。乘数 = 1 ÷ (1 − 0.5) = 2，ΔY = 2 × 60 = 120。300 用的是简单乘数 1/MPS = 5；200 只考虑了进口漏出 (1/(0.2+0.1))；150 只考虑了税收 (1/(1−0.6))。","e_en":"For each extra dollar of national income, disposable income rises by 0.75, consumption rises by 0.8 × 0.75 = 0.6 and imports rise by 0.1, so marginal spending on domestic goods = 0.6 − 0.1 = 0.5. Multiplier = 1 ÷ (1 − 0.5) = 2, so ΔY = 2 × 60 = 120. 300 uses the simple multiplier 1/MPS = 5; 200 considers only the import leakage (1/(0.2+0.1)); 150 considers only taxes (1/(1−0.6))."},{"id":"M3-07","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Which of the following best describes the crowding-out effect of expansionary fiscal policy?","o":["Government borrowing raises real interest rates, which reduces private investment spending.","Higher government spending causes households to save all of any tax cut.","Government purchases of goods directly replace imports, reducing net exports.","An increase in the money supply lowers interest rates and raises investment."],"a":0,"e":"挤出效应 (crowding out)：赤字融资增加可贷资金需求（或减少国民储蓄），推高实际利率，私人投资下降，部分抵消扩张效果。“家庭把减税全部储蓄”描述的是李嘉图等价，是另一机制；增加货币供给压低利率是货币政策，方向相反。","e_en":"Crowding out: deficit financing increases the demand for loanable funds (or reduces national saving), pushing up the real interest rate, so private investment falls, partly offsetting the expansionary effect. \"Households save the entire tax cut\" describes Ricardian equivalence, which is a different mechanism; increasing the money supply to push interest rates down is monetary policy and works in the opposite direction."},{"id":"M3-08","t":"M3","lv":1,"ex":["AP","NEC","IB"],"q":"A country's national debt is $500 billion at the start of Year 1. It then runs a budget deficit of $40 billion in Year 1, a deficit of $30 billion in Year 2, and a budget surplus of $10 billion in Year 3. What is the national debt at the end of Year 3?","o":["$580 billion","$560 billion","$60 billion","$570 billion"],"a":1,"e":"国债 (national debt) 是存量，赤字/盈余是流量：500 + 40 + 30 − 10 = 560。580 是把盈余也当作赤字加上；60 只是三年的净赤字，忘了初始债务；570 忽略了第三年的盈余。","e_en":"The national debt is a stock, while deficits/surpluses are flows: 500 + 40 + 30 − 10 = 560. 580 treats the surplus as another deficit and adds it; 60 is only the net deficit over the three years, forgetting the initial debt; 570 ignores the surplus in the third year."},{"id":"M3-09","t":"M3","lv":3,"ex":["IEO","AL"],"q":"Suppose households fully satisfy Ricardian equivalence. The government cuts lump-sum taxes by $100 billion this year, financed by issuing bonds that will be repaid with future taxes, and keeps its purchases unchanged. What is the most likely effect?","o":["Consumption rises by MPC × $100 billion, and aggregate demand rises by the tax multiplier times $100 billion.","Private saving is unchanged, so national saving falls by $100 billion and interest rates rise.","Private saving rises by about $100 billion, so consumption, national saving and aggregate demand are essentially unchanged.","Consumption falls by $100 billion because households fear higher future taxes."],"a":2,"e":"李嘉图等价 (Ricardian equivalence)：理性、有远见的家庭知道今天的举债减税意味着未来等额（现值）的增税，一生财富未变，于是把减税全部储蓄起来。私人储蓄增加 100，公共储蓄减少 100，国民储蓄不变，利率和AD都不受影响。按传统税收乘数计算的选项正是李嘉图等价所否定的结论；消费下降 100 则夸大了反应。","e_en":"Ricardian equivalence: rational, forward-looking households know that a debt-financed tax cut today means an equal (in present value) tax increase in the future, so their lifetime wealth is unchanged and they save the entire tax cut. Private saving rises by 100 and public saving falls by 100, so national saving is unchanged and neither interest rates nor AD are affected. The option calculated with the traditional tax multiplier is exactly the conclusion that Ricardian equivalence rejects; a fall in consumption of 100 exaggerates the response."},{"id":"M4-01","t":"M4","lv":1,"ex":["AP","IB","NEC"],"q":"A restaurant lists all the prices on its menu in yuan. Which function of money does this illustrate?","o":["Medium of exchange","Store of value","Standard of deferred payment","Unit of account"],"a":3,"e":"用货币来标价、比较价值，是计价单位 (unit of account) 的职能。只有当顾客实际用货币付款时，才体现交换媒介；把钱存起来以后用，体现价值储藏。","e_en":"Using money to state prices and compare values is the unit of account function. Money acts as a medium of exchange only when the customer actually pays with it; keeping money to use later reflects its role as a store of value."},{"id":"M4-02","t":"M4","lv":1,"ex":["AP","NEC"],"q":"Which of the following is included in M2 but NOT in M1?","o":["Small-denomination time deposits (certificates of deposit)","Currency held by the public","Checkable (demand) deposits","Government bonds held by households"],"a":0,"e":"M2 = M1 + 小额定期存款 + 零售货币市场基金等。现金和支票存款同时属于 M1 和 M2；政府债券不属于任何货币层次（不能直接用于支付）。注：美联储自2020年起把储蓄存款计入 M1，所以这里选定期存款最稳妥。","e_en":"M2 = M1 + small time deposits + retail money market funds, etc. Cash and checkable deposits belong to both M1 and M2; government bonds do not belong to any money measure (they cannot be used directly for payment). Note: since 2020 the Federal Reserve has included savings deposits in M1, so time deposits are the safest choice here."},{"id":"M4-03","t":"M4","lv":1,"ex":["AP","IB","NEC"],"q":"A bank with no excess reserves receives a new cash deposit of $1,000. The required reserve ratio is 20%. What is the maximum amount this single bank can lend as a result of the deposit?","o":["$1,000","$800","$4,000","$5,000"],"a":1,"e":"法定准备金 = 1,000 × 20% = 200，超额准备金 = 800，单个银行最多新增贷款等于其超额准备金 800。4,000 是整个银行体系最多能新增的贷款/存款 (800 × 5)；5,000 是 1,000 × 5，误把单个银行当成整个体系且用了全部存款。","e_en":"Required reserves = 1,000 × 20% = 200, excess reserves = 800, and a single bank can make new loans of at most its excess reserves, 800. 4,000 is the maximum new loans/deposits for the whole banking system (800 × 5); 5,000 is 1,000 × 5, which mistakes a single bank for the whole system and uses total deposits."},{"id":"M4-04","t":"M4","lv":2,"ex":["AP","IB","NEC"],"q":"Maria deposits $1,000 of currency into her checking account. The required reserve ratio is 20%, and banks lend out all excess reserves while the public holds no additional currency. What is the maximum change in the money supply (M1)?","o":["An increase of $5,000","An increase of $800","An increase of $4,000","An increase of $1,000"],"a":2,"e":"现金变成存款，M1 本身不变（现金 −1,000，存款 +1,000）。超额准备金 = 800，货币乘数 = 1 ÷ 0.2 = 5，银行体系通过贷款最多创造 800 × 5 = 4,000 新货币。5,000 是存款的最大总增加量（包括原始1,000），但原始存款不是新增货币；800 只是第一家银行的放贷。","e_en":"Cash turns into deposits, so M1 itself is unchanged (cash −1,000, deposits +1,000). Excess reserves = 800 and the money multiplier = 1 ÷ 0.2 = 5, so the banking system can create at most 800 × 5 = 4,000 of new money through lending. 5,000 is the maximum total increase in deposits (including the original 1,000), but the original deposit is not new money; 800 is only the first bank's lending."},{"id":"M4-05","t":"M4","lv":2,"ex":["AP","IB","AL"],"q":"The table shows the balance sheet of Bank Z. The required reserve ratio is 10%. What are the bank's excess reserves, and what is the maximum increase in the money supply the banking system could create from them?","tbl":[["Assets","Amount","Liabilities","Amount"],["Reserves","$12,000","Demand deposits","$50,000"],["Loans","$38,000","",""]],"o":["$12,000 and $120,000","$7,000 and $63,000","$5,000 and $50,000","$7,000 and $70,000"],"a":3,"e":"法定准备金 = 50,000 × 10% = 5,000；超额准备金 = 12,000 − 5,000 = 7,000。银行体系最大货币创造 = 7,000 × (1 ÷ 0.1) = 70,000。12,000/120,000 错用了全部准备金；5,000 是法定准备金；63,000 是从 70,000 中错误地扣掉了7,000（本题超额准备金是现有的，并非新存入的现金，所以不扣减）。","e_en":"Required reserves = 50,000 × 10% = 5,000; excess reserves = 12,000 − 5,000 = 7,000. Maximum money creation by the banking system = 7,000 × (1 ÷ 0.1) = 70,000. 12,000/120,000 wrongly use total reserves; 5,000 is required reserves; 63,000 wrongly subtracts 7,000 from 70,000 (here the excess reserves already exist and do not come from a new cash deposit, so nothing is subtracted)."},{"id":"M4-06","t":"M4","lv":2,"ex":["AP","IB","NEC"],"q":"Assume the central bank keeps the money supply fixed. If real income and the price level both rise, what happens in the money market?","o":["Money demand increases and the nominal interest rate rises.","Money supply increases and the nominal interest rate falls.","Money demand decreases and the nominal interest rate falls.","Money demand increases and the nominal interest rate is unchanged."],"a":0,"e":"名义收入 (P × Y) 上升使交易需求增加，货币需求 (Md) 右移；在垂直的货币供给 (Ms) 下，名义利率上升。货币供给由央行决定，不会因收入上升而自动增加；“利率不变”忽略了 Ms 垂直。","e_en":"A rise in nominal income (P × Y) increases transactions demand, so money demand (Md) shifts right; with a vertical money supply (Ms), the nominal interest rate rises. The money supply is set by the central bank and does not increase automatically when income rises; \"the interest rate is unchanged\" ignores the fact that Ms is vertical."},{"id":"M4-07","t":"M4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In an economy the money supply is 500, velocity is 4, and real output is 1,000. If the money supply then grows by 6% per year, velocity is constant, and real output grows by 2% per year, what are the current price level and the approximate inflation rate?","o":["P = 2; inflation of about 6%","P = 2; inflation of about 4%","P = 0.5; inflation of about 4%","P = 8; inflation of about 8%"],"a":1,"e":"MV = PY ⇒ P = 500 × 4 ÷ 1,000 = 2。增长率形式：%ΔM + %ΔV ≈ %ΔP + %ΔY ⇒ 6% + 0 ≈ π + 2% ⇒ π ≈ 4%。选6%忽略了实际产出增长会吸收部分新货币；0.5 是把 P 算成 Y ÷ (MV)。","e_en":"MV = PY ⇒ P = 500 × 4 ÷ 1,000 = 2. Growth-rate form: %ΔM + %ΔV ≈ %ΔP + %ΔY ⇒ 6% + 0 ≈ π + 2% ⇒ π ≈ 4%. Choosing 6% ignores the fact that real output growth absorbs part of the new money; 0.5 comes from calculating P as Y ÷ (MV)."},{"id":"M4-08","t":"M4","lv":3,"ex":["IEO","AL"],"q":"The required reserve ratio is 10%, banks hold no excess reserves, and the public holds currency equal to 25% of its deposits (c = 0.25). If the central bank increases the monetary base by $70 billion, by how much does the money supply (currency + deposits) increase?","o":["$700 billion","$200 billion","$250 billion","$87.5 billion"],"a":2,"e":"含现金漏出的货币乘数 m = (1 + c) ÷ (rr + c) = 1.25 ÷ 0.35 ≈ 3.571。ΔM = 3.571 × 70 = 250。700 是简单乘数 1/rr 的结果，忽略了现金漏出；200 = 70 ÷ 0.35 只算出了存款增加量（ΔD = 200），还要加上现金增加 0.25 × 200 = 50；87.5 是 70 × 1.25。","e_en":"Money multiplier with currency drain m = (1 + c) ÷ (rr + c) = 1.25 ÷ 0.35 ≈ 3.571. ΔM = 3.571 × 70 = 250. 700 is the result of the simple multiplier 1/rr, ignoring currency drain; 200 = 70 ÷ 0.35 gives only the increase in deposits (ΔD = 200), to which the increase in currency of 0.25 × 200 = 50 must be added; 87.5 is 70 × 1.25."},{"id":"M4-09","t":"M4","lv":3,"ex":["IEO","AL","NEC"],"q":"A customer withdraws $2,000 in cash from her checking account. The required reserve ratio is 10%, and the banking system had no excess reserves before the withdrawal. Which statement is correct?","o":["M1 falls by $2,000 immediately, and deposits may contract by up to a further $20,000.","M1 rises by $2,000 because currency in circulation increases, with no further effect.","M1 is unchanged immediately, and deposits may contract by only a further $1,800.","M1 is unchanged immediately, but the banking system may have to reduce deposits by up to a further $18,000 (so total deposits fall by up to $20,000)."],"a":3,"e":"取现时存款 −2,000、流通现金 +2,000，M1 当下不变。银行准备金减少 2,000，但法定准备金只减少 200，于是出现 1,800 的准备金缺口。银行体系收缩贷款时，存款最多进一步减少 1,800 ÷ 0.1 = 18,000（与货币创造过程对称），连同最初被取走的 2,000，存款总共最多减少 20,000（= 2,000 ÷ 0.1）。只收缩 1,800 是只看了第一家银行，忽略了整个银行体系的乘数收缩；M1 当下既不减少也不增加，因为只是存款换成了现金。","e_en":"When cash is withdrawn, deposits fall by 2,000 and currency in circulation rises by 2,000, so M1 is unchanged at that moment. Bank reserves fall by 2,000 but required reserves fall by only 200, leaving a reserve shortfall of 1,800. As the banking system contracts its lending, deposits can fall by up to a further 1,800 ÷ 0.1 = 18,000 (symmetrical with the money-creation process); together with the 2,000 originally withdrawn, deposits fall by at most 20,000 in total (= 2,000 ÷ 0.1). A contraction of only 1,800 looks only at the first bank and ignores the multiplied contraction of the whole banking system; at the moment of withdrawal M1 neither falls nor rises, because deposits have simply been swapped for cash."},{"id":"M5-01","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"To help an economy out of a recession, which open market operation should the central bank conduct?","o":["Buy government securities, which increases bank reserves","Sell government securities, which increases bank reserves","Buy government securities, which decreases the money supply","Sell government securities, which lowers interest rates"],"a":0,"e":"扩张性货币政策：央行在公开市场买入 (buy) 政府债券，向银行支付准备金，准备金和货币供给增加，利率下降，投资和AD增加。卖出债券会回收准备金、推高利率，是紧缩性操作；其余选项方向搞错。","e_en":"Expansionary monetary policy: the central bank buys government bonds in the open market and pays banks with reserves, so reserves and the money supply increase, interest rates fall, and investment and AD increase. Selling bonds withdraws reserves and pushes up interest rates, which is a contractionary operation; the other options get the direction wrong."},{"id":"M5-02","t":"M5","lv":2,"ex":["AP","NEC"],"q":"The Federal Reserve operates with an ample supply of reserves. Which action most directly raises the federal funds rate in this framework?","o":["Selling a small amount of Treasury securities to make reserves scarce","Raising the interest rate it pays on reserve balances","Raising the required reserve ratio","Lowering the discount rate"],"a":1,"e":"在充足准备金框架 (ample-reserves framework) 下，准备金供给位于需求曲线平坦部分，小规模公开市场操作几乎不影响利率；美联储通过调整准备金利率 (IORB) 等管理利率 (administered rates) 来引导联邦基金利率。美联储法定准备金率自2020年3月起为零，不再是日常工具；降低贴现率是扩张方向。","e_en":"Under the ample-reserves framework, the supply of reserves lies on the flat part of the demand curve, so small open market operations have almost no effect on interest rates; the Federal Reserve steers the federal funds rate by adjusting administered rates such as the interest rate on reserve balances (IORB). The Fed's required reserve ratio has been zero since March 2020 and is no longer a day-to-day tool; lowering the discount rate is expansionary."},{"id":"M5-03","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"A bank offers a one-year loan at a nominal interest rate of 7%. Borrowers and lenders expect inflation of 3%. What is the expected real interest rate?","o":["10%","2.33%","4%","−4%"],"a":2,"e":"费雪方程 (Fisher equation)：实际利率 ≈ 名义利率 − 预期通胀 = 7% − 3% = 4%。10% 是把两者相加；2.33% 是 7 ÷ 3；−4% 是减反了。精确值为 1.07 ÷ 1.03 − 1 ≈ 3.9%，近似为 4%。","e_en":"Fisher equation: real interest rate ≈ nominal interest rate − expected inflation = 7% − 3% = 4%. 10% adds the two together; 2.33% is 7 ÷ 3; −4% subtracts the wrong way round. The exact value is 1.07 ÷ 1.03 − 1 ≈ 3.9%, approximately 4%."},{"id":"M5-04","t":"M5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A loan is made at a nominal interest rate of 8% when both parties expect inflation of 3%. Actual inflation turns out to be 6%. What is the realized real interest rate, and who gains from the unexpected inflation?","o":["About 5%; the lender gains at the borrower's expense","About 2%; the lender gains at the borrower's expense","About 14%; the borrower gains at the lender's expense","About 2%; the borrower gains at the lender's expense"],"a":3,"e":"事后实际利率 ≈ 8% − 6% = 2%，低于预期的 8% − 3% = 5%。未预期的通胀使借款人用贬值的货币还款，借款人 (borrower) 受益、贷款人受损。5% 是事前预期实际利率；14% 是把名义利率和通胀相加。","e_en":"The ex post real interest rate ≈ 8% − 6% = 2%, lower than the expected 8% − 3% = 5%. Unexpected inflation lets borrowers repay with money that has lost value, so the borrower gains and the lender loses. 5% is the ex ante expected real interest rate; 14% adds the nominal interest rate and inflation together."},{"id":"M5-05","t":"M5","lv":3,"ex":["IEO","AP","AL"],"q":"In the loanable funds market, supply is Qs = 100 + 20r and private demand is Qd = 300 − 30r, where r is the real interest rate in percent. The government then runs a new deficit, borrowing an additional 50 at every interest rate. What is the new real interest rate, and by how much is private investment crowded out?","o":["5%; private investment falls by 30","5%; private investment falls by 50","6%; private investment falls by 60","4%; private investment does not change"],"a":0,"e":"初始均衡：100 + 20r = 300 − 30r ⇒ r = 4%，Q = 180（全部是私人投资）。政府借款后总需求 350 − 30r = 100 + 20r ⇒ r = 5%，总量 Q = 200。私人投资 = 300 − 30 × 5 = 150，比180 减少 30。以为挤出 50 是假设借贷总量不变（供给完全无弹性）；实际上利率上升也增加了储蓄 20，所以只挤出 30。","e_en":"Initial equilibrium: 100 + 20r = 300 − 30r ⇒ r = 4%, Q = 180 (all private investment). After government borrowing, total demand 350 − 30r = 100 + 20r ⇒ r = 5%, total Q = 200. Private investment = 300 − 30 × 5 = 150, which is 30 less than 180. Thinking 50 is crowded out assumes that the total amount lent is unchanged (perfectly inelastic supply); in fact the higher interest rate also increases saving by 20, so only 30 is crowded out."},{"id":"M5-06","t":"M5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Starting from long-run equilibrium, aggregate demand increases unexpectedly. In the short run, the economy","o":["moves down and to the right along the short-run Phillips curve","moves up and to the left along the short-run Phillips curve","experiences a rightward shift of the short-run Phillips curve","experiences a leftward shift of the long-run Phillips curve"],"a":1,"e":"AD 意外增加使产出上升、失业下降、通胀上升，对应沿短期菲利普斯曲线 (SRPC) 向左上移动。SRPC 本身移动是由通胀预期或供给冲击引起的；LRPC 只随自然失业率变化而移动，与AD无关。","e_en":"An unexpected increase in AD raises output, lowers unemployment and raises inflation, which corresponds to a movement up and to the left along the short-run Phillips curve (SRPC). A shift of the SRPC itself is caused by inflation expectations or supply shocks; the LRPC shifts only when the natural rate of unemployment changes and has nothing to do with AD."},{"id":"M5-07","t":"M5","lv":3,"ex":["IEO","AL"],"q":"The Phillips curve is π = π^e − 0.5(u − 5), where π is inflation (%), u is unemployment (%), and π^e is expected inflation. Initially π^e = 3%. The central bank pushes unemployment to 4% this year. If next year's expected inflation equals this year's actual inflation, what inflation rate is required next year to keep unemployment at 4%?","o":["3.5% this year, then 3.5% next year","2.5% this year, then 2.0% next year","3.5% this year, then 4.0% next year","4.0% this year, then 5.0% next year"],"a":2,"e":"今年：π = 3 − 0.5 × (4 − 5) = 3.5%。明年预期 π^e = 3.5%，维持 u = 4% 需要 π = 3.5 + 0.5 = 4.0%。每年通胀都要比上年高0.5个百分点，这就是加速主义 (accelerationist) 假说：长期把失业压在自然率以下只能靠不断上升的通胀，LRPC 垂直。以为明年仍是 3.5% 忽略了预期调整；2.5% 是把符号弄反。","e_en":"This year: π = 3 − 0.5 × (4 − 5) = 3.5%. Next year expected π^e = 3.5%, so keeping u = 4% requires π = 3.5 + 0.5 = 4.0%. Every year inflation must be 0.5 percentage points higher than the year before — this is the accelerationist hypothesis: holding unemployment below the natural rate in the long run is possible only with ever-rising inflation, so the LRPC is vertical. Thinking inflation will still be 3.5% next year ignores the adjustment of expectations; 2.5% gets the sign wrong."},{"id":"M5-08","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"The long-run Phillips curve is","o":["downward sloping, showing a permanent trade-off between inflation and unemployment","horizontal at the expected inflation rate","vertical at zero unemployment","vertical at the natural rate of unemployment"],"a":3,"e":"长期中通胀预期完全调整，失业回到自然失业率 (natural rate)，与通胀水平无关，所以 LRPC 在自然失业率处垂直。向下倾斜的是短期菲利普斯曲线；自然失业率不是零，因为总存在摩擦性和结构性失业。","e_en":"In the long run inflation expectations fully adjust and unemployment returns to the natural rate, regardless of the level of inflation, so the LRPC is vertical at the natural rate of unemployment. It is the short-run Phillips curve that slopes downward; the natural rate of unemployment is not zero, because there is always frictional and structural unemployment."},{"id":"M5-09","t":"M5","lv":3,"ex":["IEO","NEC","AL"],"q":"A government wants to raise the share of investment in GDP to boost long-run growth, without changing aggregate demand or the price level in the short run. Which policy mix is most appropriate?","o":["Reduce the budget deficit and have the central bank lower interest rates","Increase the budget deficit and have the central bank sell government bonds","Increase the budget deficit and have the central bank lower interest rates","Raise taxes and have the central bank raise interest rates"],"a":0,"e":"“紧财政 + 松货币”：减少赤字（AD左移、国民储蓄增加）同时降息（AD右移），总需求大致不变，但利率更低、私人投资占比上升，资本积累加快。扩大赤字同时紧缩货币会推高利率、挤出投资，恰好相反；扩大赤字加降息会使AD大幅增加、引发通胀；增税加加息会使AD大幅收缩。","e_en":"\"Tight fiscal + loose monetary\": cutting the deficit (AD shifts left, national saving rises) while cutting interest rates (AD shifts right) leaves aggregate demand roughly unchanged, but interest rates are lower, the share of private investment rises and capital accumulates faster. Widening the deficit while tightening monetary policy pushes up interest rates and crowds out investment — exactly the opposite; widening the deficit and cutting rates would increase AD sharply and cause inflation; raising taxes and interest rates would contract AD sharply."},{"id":"M6-01","t":"M6","lv":1,"ex":["AP","IB","NEC"],"q":"Using the rule of 70, approximately how many years will it take for a country's real GDP per capita to double if it grows at 3.5% per year?","o":["10 years","20 years","35 years","70 years"],"a":1,"e":"70法则 (rule of 70)：翻倍年数 ≈ 70 ÷ 3.5 = 20 年。10 年是 35 ÷ 3.5 的误算；35 年与 70 年是把增长率或常数用错。","e_en":"Rule of 70: years to double ≈ 70 ÷ 3.5 = 20 years. 10 years is the miscalculation 35 ÷ 3.5; 35 years and 70 years use the wrong growth rate or constant."},{"id":"M6-02","t":"M6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following is most likely to increase an economy's long-run rate of economic growth?","o":["An increase in government transfer payments to retirees","A temporary surge in consumer spending","Greater investment in education and job training","A one-time depreciation of the domestic currency"],"a":2,"e":"教育与培训增加人力资本 (human capital)，提高劳动生产率，使潜在产出和 LRAS 右移。转移支付、暂时的消费增加和一次性货币贬值主要影响短期总需求，不改变长期生产能力。","e_en":"Education and training increase human capital and raise labor productivity, shifting potential output and LRAS to the right. Transfer payments, a temporary rise in consumption and a one-off currency depreciation mainly affect short-run aggregate demand and do not change long-run productive capacity."},{"id":"M6-03","t":"M6","lv":2,"ex":["AP","IB","AL"],"q":"Last year a factory's 40 workers each worked 8 hours and produced 1,200 units. This year the workforce worked a total of 330 hours and produced 1,320 units. By approximately what percentage did labor productivity (output per hour) grow?","o":["10.0%","3.1%","13.1%","6.7%"],"a":3,"e":"去年工时 = 40 × 8 = 320，生产率 = 1,200 ÷ 320 = 3.75 件/小时；今年 = 1,320 ÷ 330 = 4.0 件/小时。增长 = 4.0 ÷ 3.75 − 1 ≈ 6.7%。10% 是产出增长率；3.1% 是工时增长率；13.1% 是把两者相加。近似法 10% − 3.1% ≈ 6.9% 也接近 6.7%。","e_en":"Last year's hours = 40 × 8 = 320, productivity = 1,200 ÷ 320 = 3.75 units/hour; this year = 1,320 ÷ 330 = 4.0 units/hour. Growth = 4.0 ÷ 3.75 − 1 ≈ 6.7%. 10% is the output growth rate; 3.1% is the growth rate of hours; 13.1% adds the two together. The approximation 10% − 3.1% ≈ 6.9% is also close to 6.7%."},{"id":"M6-04","t":"M6","lv":3,"ex":["IEO","AL"],"q":"An economy's production function is Y = A·K^0.3·L^0.7. The capital stock grows by 4% per year, the labor force grows by 1% per year, and total factor productivity (A) grows by 1.5% per year. What is the approximate growth rate of real GDP?","o":["3.4%","6.5%","1.9%","4.6%"],"a":0,"e":"增长核算 (growth accounting)：g_Y = g_A + 0.3 g_K + 0.7 g_L = 1.5 + 0.3 × 4 + 0.7 × 1 = 1.5 + 1.2 + 0.7 = 3.4%。6.5% 是直接把各增长率相加，忽略了产出弹性；1.9% 漏掉了 TFP 增长；4.6% 把资本和劳动的指数用反了 (0.7 × 4 + 0.3 × 1 + 1.5)。","e_en":"Growth accounting: g_Y = g_A + 0.3 g_K + 0.7 g_L = 1.5 + 0.3 × 4 + 0.7 × 1 = 1.5 + 1.2 + 0.7 = 3.4%. 6.5% simply adds up the growth rates, ignoring the output elasticities; 1.9% leaves out TFP growth; 4.6% swaps the exponents on capital and labor (0.7 × 4 + 0.3 × 1 + 1.5)."},{"id":"M6-05","t":"M6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"According to the catch-up (convergence) hypothesis, why might a poor country with little capital per worker grow faster than a rich country, other things equal?","o":["Because poor countries always have higher saving rates than rich countries","Because diminishing returns mean an extra unit of capital raises output more where capital is scarce","Because rich countries experience increasing returns to capital","Because GDP in poor countries is measured using lower prices"],"a":1,"e":"资本边际收益递减 (diminishing returns)：资本稀缺时，新增资本的边际产出更高，因此在储蓄率、制度等条件相同时穷国增长更快，即追赶效应 (catch-up effect)。穷国储蓄率并不一定更高；富国资本收益递减而非递增；价格计量问题与增长率无关。","e_en":"Diminishing returns to capital: when capital is scarce, the marginal product of additional capital is higher, so with the same saving rate, institutions and other conditions, poor countries grow faster — the catch-up effect. Poor countries do not necessarily have higher saving rates; in rich countries returns to capital are diminishing, not increasing; price measurement issues have nothing to do with growth rates."},{"id":"M6-06","t":"M6","lv":3,"ex":["IEO","AL","IB"],"q":"In the Solow growth model with no technological progress, a country permanently increases its saving rate. In the long run, this will","o":["permanently raise the growth rate of output per worker","leave both the level and growth rate of output per worker unchanged","raise the steady-state level of output per worker, but not its long-run growth rate","lower output per worker because consumption falls"],"a":2,"e":"储蓄率上升使投资增加，人均资本积累到更高的稳态 (steady state)，人均产出水平提高；过渡期增长加快，但由于资本边际收益递减，新稳态中人均增长率回到零（无技术进步时）。只有持续的技术进步才能带来持续的人均增长。消费可能短期下降，但人均产出是上升的。","e_en":"A higher saving rate increases investment, so capital per worker accumulates to a higher steady state and the level of output per worker rises; growth is faster during the transition, but because of diminishing marginal returns to capital, per-capita growth in the new steady state returns to zero (in the absence of technological progress). Only continuous technological progress can deliver sustained per-capita growth. Consumption may fall in the short run, but output per worker rises."},{"id":"M6-07","t":"M6","lv":1,"ex":["IB","NEC","IEO"],"q":"Which institutional feature is most likely to promote long-run economic growth?","o":["Frequent, unpredictable changes in tax laws","Government ownership of all farmland","Price controls on most consumer goods","Secure property rights enforced by an independent legal system"],"a":3,"e":"安全的产权 (property rights) 与法治保证投资者和创新者能获得回报，鼓励储蓄、投资和研发，是长期增长的制度基础。政策不确定、国有化与普遍价格管制都会削弱激励和资源配置效率。","e_en":"Secure property rights and the rule of law ensure that investors and innovators can earn a return, encouraging saving, investment and R&D; they are the institutional foundation of long-run growth. Policy uncertainty, nationalisation and widespread price controls all weaken incentives and the efficiency of resource allocation."},{"id":"M6-08","t":"M6","lv":2,"ex":["AP","IB","IEO","NEC"],"q":"Country A has real GDP per capita of $4,000 growing at 7% per year. Country B has real GDP per capita of $16,000 growing at 1.75% per year. Using the rule of 70, approximately what will A's GDP per capita be after 20 years, and will A have caught up with B?","o":["About $16,000; no, because B will then be about $22,600","About $16,000; yes, because A will equal B's current income","About $9,600; no, because A grows too slowly","About $32,000; yes, A will have overtaken B"],"a":0,"e":"A：70 ÷ 7 = 10 年翻倍，20年翻两番，4,000 × 4 = 16,000（精确复利 4,000 × 1.07²⁰ ≈ 15,479）。B：70 ÷ 1.75 = 40 年翻倍，20 年后 ≈ 16,000 × √2 ≈ 22,600。A 只达到B的“今天”，B也在增长，因此尚未追上。9,600 是单利 4,000 × (1 + 0.07 × 20) 的错误。","e_en":"A: 70 ÷ 7 = 10 years to double, so it quadruples in 20 years: 4,000 × 4 = 16,000 (exact compounding: 4,000 × 1.07²⁰ ≈ 15,479). B: 70 ÷ 1.75 = 40 years to double, so after 20 years ≈ 16,000 × √2 ≈ 22,600. A only reaches B's level of \"today\", and B is also growing, so A has not yet caught up. 9,600 is the simple-interest error 4,000 × (1 + 0.07 × 20)."},{"id":"M6-09","t":"M6","lv":2,"ex":["IB","IEO","AL"],"q":"A country's measured real GDP grows by 5% per year, mostly from rapidly extracting and exporting a non-renewable mineral, with significant damage to rivers and forests. Which statement is best?","o":["GDP growth fully captures the change in national wealth, so the growth is sustainable by definition.","Measured GDP growth likely overstates sustainable growth because the depletion of natural capital and environmental damage are not subtracted.","Growth based on natural resources is always faster and more stable than growth based on manufacturing.","Environmental damage raises GDP, so it must raise living standards."],"a":1,"e":"GDP 是流量指标，不扣除自然资本 (natural capital) 的耗减和环境损害，因此资源型增长可能不可持续；绿色GDP或真实储蓄 (genuine savings) 等指标会对此调整。GDP 不衡量财富存量；资源型经济还可能面临“资源诅咒”和价格波动；治理污染的支出会计入GDP，但这并不意味着福利提高。","e_en":"GDP is a flow measure and does not deduct the depletion of natural capital or environmental damage, so resource-based growth may be unsustainable; measures such as green GDP or genuine savings adjust for this. GDP does not measure the stock of wealth; resource-based economies may also face the \"resource curse\" and price volatility; spending on cleaning up pollution is counted in GDP, but that does not mean welfare has improved."},{"id":"M7-01","t":"M7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following transactions is recorded in China's financial account rather than its current account?","o":["China exports electronics to Germany","Chinese investors receive dividends from shares they own in U.S. companies","A Chinese company builds a new factory in Vietnam","Chinese workers abroad send money home to their families"],"a":2,"e":"在国外建厂是对外直接投资 (FDI)，属于资产交易，记在金融账户 (financial account)。出口是货物贸易；股息属于初次收入 (primary income)；侨汇属于二次收入/经常转移，三者都在经常账户。常见误区是把“投资收益”当作金融账户——收益记在经常账户，资产本身的买卖才记在金融账户。","e_en":"Building a factory abroad is outward foreign direct investment (FDI), an asset transaction recorded in the financial account. Exports are trade in goods; dividends are primary income; remittances are secondary income/current transfers — all three are in the current account. A common misconception is to put \"investment income\" in the financial account: the income is recorded in the current account, and only the purchase and sale of the assets themselves are recorded in the financial account."},{"id":"M7-02","t":"M7","lv":1,"ex":["AP","IB","NEC"],"q":"If the Chinese yuan appreciates against the U.S. dollar, other things equal,","o":["Chinese exports become cheaper for Americans, and U.S. goods become more expensive for Chinese consumers","both Chinese exports and U.S. goods become cheaper for everyone","prices of traded goods are unaffected because only the price level matters","Chinese exports become more expensive for Americans, and U.S. goods become cheaper for Chinese consumers"],"a":3,"e":"人民币升值 (appreciation) 后，美国人要花更多美元才能换到同样多人民币，中国出口品对美国人变贵；中国消费者用人民币能买到更多美元，美国商品变便宜。因此升值往往使净出口减少。","e_en":"After the renminbi appreciates, Americans must spend more dollars to obtain the same amount of renminbi, so Chinese exports become more expensive for Americans; Chinese consumers can buy more dollars with their renminbi, so American goods become cheaper. Appreciation therefore tends to reduce net exports."},{"id":"M7-03","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Interest rates in the United States rise relative to interest rates in Japan. In the foreign exchange market, what is the most likely result?","o":["The demand for dollars increases and the dollar appreciates against the yen.","The supply of dollars increases and the dollar depreciates against the yen.","The demand for yen increases and the yen appreciates against the dollar.","The demand for dollars decreases and the dollar depreciates against the yen."],"a":0,"e":"美国利率相对上升，美国金融资产回报更高，日本投资者需要美元购买美国债券，美元需求增加（同时日元供给增加），美元升值、日元贬值。资本流向高利率国家，而不是离开。","e_en":"When US interest rates rise relative to others, US financial assets offer higher returns, so Japanese investors need dollars to buy US bonds; demand for dollars rises (and the supply of yen rises), so the dollar appreciates and the yen depreciates. Capital flows towards the country with higher interest rates, not away from it."},{"id":"M7-04","t":"M7","lv":1,"ex":["AP","IB","NEC"],"q":"The exchange rate changes from 7.2 yuan per dollar to 6.8 yuan per dollar. What happens to the yuan price of a book that costs $50 in the United States?","o":["It rises from ¥340 to ¥360, because the yuan has depreciated.","It falls from ¥360 to ¥340, because the yuan has appreciated.","It falls from ¥360 to ¥340, because the yuan has depreciated.","It stays at ¥360, because the dollar price is unchanged."],"a":1,"e":"人民币价格 = 50 × 7.2 = ¥360，变为 50 × 6.8 = ¥340。每美元只需 6.8 元即可买到，说明人民币升值 (appreciated)。数值下降代表人民币升值，这是看汇率报价方向时最容易搞反的地方。","e_en":"Price in renminbi = 50 × 7.2 = ¥360, which becomes 50 × 6.8 = ¥340. Each dollar now costs only 6.8 yuan, which shows that the renminbi has appreciated. A fall in the figure means the renminbi has appreciated — this is the point where it is easiest to read the direction of the exchange rate quote the wrong way round."},{"id":"M7-05","t":"M7","lv":2,"ex":["IB","AL","IEO","NEC"],"q":"A burger costs ¥24 in China and $5 in the United States. The market exchange rate is ¥7.2 per $1. According to absolute purchasing power parity, what is the PPP exchange rate, and how is the yuan valued?","o":["¥4.8 per $1; the yuan is overvalued relative to PPP","$0.21 per ¥1; the yuan is overvalued relative to PPP","¥4.8 per $1; the yuan is undervalued relative to PPP","¥7.2 per $1; the yuan is correctly valued"],"a":2,"e":"PPP 汇率 = 本国价格 ÷ 外国价格 = 24 ÷ 5 = 4.8 ¥/$。市场汇率 7.2 意味着每美元能换到比PPP更多的人民币：按市场汇率，汉堡在中国只值 24 ÷ 7.2 ≈ $3.33 < $5，所以人民币被低估 (undervalued) 约 (7.2 − 4.8) ÷ 7.2 ≈ 33%。把“数值更大”误读为人民币更强会误选高估。","e_en":"PPP exchange rate = domestic price ÷ foreign price = 24 ÷ 5 = 4.8 ¥/$. A market rate of 7.2 means each dollar buys more renminbi than PPP implies: at the market rate a burger in China is worth only 24 ÷ 7.2 ≈ $3.33 < $5, so the renminbi is undervalued by about (7.2 − 4.8) ÷ 7.2 ≈ 33%. Misreading \"a larger number\" as a stronger renminbi leads to the wrong answer of overvalued."},{"id":"M7-06","t":"M7","lv":3,"ex":["IEO","AP","AL"],"q":"A small country's domestic market for wheat has demand Qd = 100 − P and supply Qs = P − 20. The world price is 40 and the country imports freely. The government then imposes a tariff of 10 per unit. What are the tariff revenue and the total deadweight loss?","o":["Revenue = 400; deadweight loss = 100","Revenue = 200; deadweight loss = 50","Revenue = 500; deadweight loss = 0","Revenue = 200; deadweight loss = 100"],"a":3,"e":"自由贸易 P = 40：Qd = 60，Qs = 20，进口 40。关税后 P = 50：Qd = 50，Qs = 30，进口 20。关税收入 = 10 × 20 = 200。DWL = 生产扭曲 ½ × 10 × (30 − 20) + 消费扭曲 ½ × 10 × (60 − 50) = 50 + 50 = 100。400 错用了自由贸易进口量；DWL = 50 只算了一个三角形；500 是 10 × Qd。","e_en":"Free trade at P = 40: Qd = 60, Qs = 20, imports 40. After the tariff, P = 50: Qd = 50, Qs = 30, imports 20. Tariff revenue = 10 × 20 = 200. DWL = production distortion ½ × 10 × (30 − 20) + consumption distortion ½ × 10 × (60 − 50) = 50 + 50 = 100. 400 wrongly uses the free-trade import volume; DWL = 50 counts only one triangle; 500 is 10 × Qd."},{"id":"M7-07","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An import quota and a tariff are set so that they result in the same domestic price and the same quantity of imports. What is the key difference between them?","o":["Under the quota, the revenue from the price gap may go to foreign exporters or license holders rather than to the government.","The quota creates no deadweight loss, while the tariff does.","The quota lowers the domestic price, while the tariff raises it.","Domestic producers gain under a tariff but lose under a quota."],"a":0,"e":"价格和数量相同时，两者的生产与消费扭曲（DWL）相同，国内生产者都受益。区别在于价差 × 进口量这块矩形：关税下是政府收入，配额下成为配额租金 (quota rents)，若许可证分配给外国出口商，本国福利损失更大。","e_en":"With the same price and quantity, both have the same production and consumption distortions (DWL), and domestic producers gain in both cases. The difference is the rectangle equal to the price gap × the import volume: under a tariff it is government revenue; under a quota it becomes quota rents, and if the licences are allocated to foreign exporters, the domestic welfare loss is larger."},{"id":"M7-08","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A country pegs its currency to the U.S. dollar. Capital outflows are putting downward pressure on its currency. To maintain the peg, the central bank must","o":["buy foreign-currency reserves and sell its own currency","sell foreign-currency reserves and buy its own currency","lower domestic interest rates to encourage borrowing","print more domestic currency to increase its supply"],"a":1,"e":"本币面临贬值压力意味着外汇市场上本币供给过多。维持固定汇率 (peg)，央行需要用外汇储备买入本币，增加本币需求。买入外汇、卖出本币或印钞、降息都会进一步增加本币供给，加剧贬值压力。这也说明固定汇率会受到外汇储备规模的约束。","e_en":"Downward pressure on the domestic currency means there is excess supply of it in the foreign exchange market. To maintain the fixed exchange rate (peg), the central bank must use its foreign exchange reserves to buy the domestic currency, increasing demand for it. Buying foreign currency and selling the domestic currency, printing money or cutting interest rates would all increase the supply of the domestic currency further and intensify the pressure to depreciate. This also shows that a fixed exchange rate is constrained by the size of foreign exchange reserves."},{"id":"M7-09","t":"M7","lv":3,"ex":["IEO","AL","IB"],"q":"In a year, a country records (in $ billions): exports of goods 500, imports of goods 620, net exports of services +30, net primary income −20, and net secondary income +10. The capital account balance is zero and there are no errors and omissions. Which is correct?","o":["The current account balance is −120, so the financial account records a net inflow of 120.","The current account balance is −100, so the financial account records a net outflow of 100.","The current account balance is −100, so the financial account (including reserves) records a net inflow of 100.","The current account balance is −80, so the financial account records a net inflow of 80."],"a":2,"e":"经常账户 = 货物 (500 − 620) + 服务 30 + 初次收入 (−20) + 二次收入 10 = −120 + 30 − 20 + 10 = −100。国际收支必须平衡，经常账户赤字需要由金融账户的净资本流入（外国人购买本国资产或本国动用储备）来融资，因此净流入 100。−120 只看货物贸易；−80 漏掉了初次收入；“净流出”把方向弄反。","e_en":"Current account = goods (500 − 620) + services 30 + primary income (−20) + secondary income 10 = −120 + 30 − 20 + 10 = −100. The balance of payments must balance, so the current account deficit must be financed by a net capital inflow on the financial account (foreigners buying domestic assets or the country drawing down its reserves); hence a net inflow of 100. −120 looks only at trade in goods; −80 leaves out primary income; \"net outflow\" gets the direction wrong."},{"id":"F1-01","t":"F1","lv":1,"ex":["IEO","NEC"],"q":"You deposit $1,000 in an account paying 5% per year, compounded annually. How much will be in the account after 3 years (to the nearest cent)?","o":["$1,150.00","$1,157.63","$1,050.00","$1,102.50"],"a":1,"e":"复利终值 FV = 1,000 × 1.05³ = 1,157.63 美元。1,150 是单利 (simple interest) 结果 1,000×(1+0.05×3)，忽略了“利滚利”；1,050 只算了一年；1,102.50 只复利了两年 (1,000×1.05²)。","e_en":"Future value with compound interest: FV = 1,000 × 1.05³ = $1,157.63. $1,150 is the simple interest result, 1,000×(1+0.05×3), which ignores \"interest on interest\"; $1,050 counts only one year; $1,102.50 compounds for only two years (1,000×1.05²)."},{"id":"F1-02","t":"F1","lv":1,"ex":["IEO","NEC"],"q":"Using the rule of 72, approximately how many years will it take for an investment earning 8% per year to double?","o":["6 years","8 years","12.5 years","9 years"],"a":3,"e":"72 法则 (Rule of 72)：翻倍年数 ≈ 72 ÷ 8 = 9 年（精确值 ln2/ln1.08 ≈ 9.01 年）。12.5 年是 100 ÷ 8，即误用了单利思路（单利翻倍需 1/0.08 = 12.5 年）。","e_en":"Rule of 72: years to double ≈ 72 ÷ 8 = 9 years (exact value ln2/ln1.08 ≈ 9.01 years). 12.5 years is 100 ÷ 8, which wrongly applies simple-interest thinking (doubling under simple interest takes 1/0.08 = 12.5 years)."},{"id":"F1-03","t":"F1","lv":1,"ex":["IEO","AP","NEC"],"q":"Holding the future cash flow constant, which change will increase the present value of $5,000 to be received in the future?","o":["A decrease in the discount rate","An increase in the discount rate","Receiving the money later","An increase in expected inflation, with the real rate unchanged"],"a":0,"e":"PV = FV ÷ (1 + r)^n：折现率 (discount rate) 下降或期限缩短会使现值上升。推迟收款（n 变大）使 PV 下降；通胀预期上升会推高名义折现率，同样使 PV 下降。","e_en":"PV = FV ÷ (1 + r)^n: a lower discount rate or a shorter time period raises present value. Delaying receipt (a larger n) lowers PV; higher expected inflation pushes up the nominal discount rate, which also lowers PV."},{"id":"F1-04","t":"F1","lv":1,"ex":["IEO"],"q":"How much must you invest today at 10% per year (compounded annually) to have $10,000 in exactly 2 years?","o":["$8,264.46","$8,000.00","$9,090.91","$8,333.33"],"a":0,"e":"PV = 10,000 ÷ 1.1² = 10,000 ÷ 1.21 = 8,264.46 美元。8,000 是按单利 20% 直接扣减的错误；9,090.91 只折现了一年；8,333.33 是 10,000 ÷ 1.2（单利折现），忽略复利。","e_en":"PV = 10,000 ÷ 1.1² = 10,000 ÷ 1.21 = $8,264.46. $8,000 wrongly deducts 20% as simple interest; $9,090.91 discounts for only one year; $8,333.33 is 10,000 ÷ 1.2 (simple-interest discounting), which ignores compounding."},{"id":"F1-05","t":"F1","lv":2,"ex":["IEO"],"q":"A credit card charges an APR of 12%, compounded monthly. What is the effective annual rate (EAR)?","o":["12.00%","12.36%","12.68%","13.00%"],"a":2,"e":"EAR = (1 + 0.12/12)¹² − 1 = 1.01¹² − 1 ≈ 12.68%。12.00% 把名义年利率 (APR) 当成了实际成本；12.36% 是按半年复利 (1.06² − 1) 的结果。复利次数越多，EAR 越高。","e_en":"EAR = (1 + 0.12/12)¹² − 1 = 1.01¹² − 1 ≈ 12.68%. 12.00% treats the nominal annual rate (APR) as the actual cost; 12.36% is the result of semi-annual compounding (1.06² − 1). The more often interest is compounded, the higher the EAR."},{"id":"F1-06","t":"F1","lv":2,"ex":["IEO","AP","NEC"],"q":"A bank pays a nominal interest rate of 7% per year. Inflation over the year is 3%. Using the exact Fisher relationship, what is the real interest rate (to two decimal places)?","o":["3.88%","10.21%","4.00%","2.33%"],"a":0,"e":"精确费雪方程 (Fisher equation)：1 + r = 1.07 ÷ 1.03 → r ≈ 3.88%。4.00% 是近似式 i − π 的结果，题目要求精确值；10.21% 是把通胀加上去 (1.07×1.03 − 1) 的方向性错误。","e_en":"Exact Fisher equation: 1 + r = 1.07 ÷ 1.03 → r ≈ 3.88%. 4.00% comes from the approximation i − π, but the question asks for the exact value; 10.21% adds inflation on (1.07×1.03 − 1), which gets the direction wrong."},{"id":"F1-07","t":"F1","lv":2,"ex":["IEO"],"q":"A project costs $1,000 today and returns $600 at the end of each of the next two years. The discount rate is 10%. What is the project's NPV?","tbl":[["Year","0","1","2"],["Cash flow ($)","−1,000","600","600"]],"o":["$200.00","$41.32","$1,041.32","$90.91"],"a":1,"e":"NPV = −1,000 + 600/1.1 + 600/1.1² = −1,000 + 545.45 + 495.87 = 41.32 美元 > 0，应接受。200 是不折现直接相加的结果（忽略货币时间价值）；1,041.32 是流入现值之和，忘了减去初始投资；90.91 是把两笔现金流都只折现一年 (1,200/1.1 − 1,000)。","e_en":"NPV = −1,000 + 600/1.1 + 600/1.1² = −1,000 + 545.45 + 495.87 = $41.32 > 0, so accept. 200 comes from adding the cash flows without discounting (ignoring the time value of money); 1,041.32 is the sum of the present values of the inflows, forgetting to subtract the initial investment; 90.91 discounts both cash flows by only one year (1,200/1.1 − 1,000)."},{"id":"F1-08","t":"F1","lv":2,"ex":["IEO"],"q":"An investment of $1,000 today produces a single payment of $1,210 in two years and nothing else. What is its internal rate of return (IRR)?","o":["10.0% per year","10.5% per year","21.0% per year","11.0% per year"],"a":0,"e":"IRR 使 NPV = 0：1,000 × (1 + IRR)² = 1,210 → (1 + IRR)² = 1.21 → IRR = 10%。10.5% 是把 21% 总收益平均到两年（单利思路）；21% 是两年的累计收益而非年化收益。","e_en":"The IRR makes NPV = 0: 1,000 × (1 + IRR)² = 1,210 → (1 + IRR)² = 1.21 → IRR = 10%. 10.5% spreads the 21% total return evenly over two years (simple-interest thinking); 21% is the cumulative two-year return, not an annualised return."},{"id":"F1-09","t":"F1","lv":3,"ex":["IEO"],"q":"You borrow $20,000 at 6% per year, to be repaid in three equal end-of-year payments. How much principal is repaid in the FIRST payment (nearest dollar)?","o":["$6,667","$7,482","$6,282","$1,200"],"a":2,"e":"先算等额还款：PMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ 7,482.20。第一年利息 = 20,000 × 6% = 1,200，所以偿还本金 = 7,482.20 − 1,200 ≈ 6,282 美元。7,482 是整笔还款额而非本金部分；6,667 是 20,000 ÷ 3，忽略了利息；1,200 是利息部分。","e_en":"First find the equal annual payment: PMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ 7,482.20. Year-1 interest = 20,000 × 6% = 1,200, so the principal repaid = 7,482.20 − 1,200 ≈ $6,282. 7,482 is the whole payment rather than the principal portion; 6,667 is 20,000 ÷ 3, which ignores interest; 1,200 is the interest portion."},{"id":"F1-10","t":"F1","lv":3,"ex":["IEO"],"q":"A lottery winner can take $50,000 today, or $12,000 at the end of each year for 5 years. The appropriate discount rate is 7%. Which choice is better and why?","o":["The annuity, because it pays $60,000 in total","The annuity, because its present value is about $52,000","The lump sum, because the annuity's present value is about $49,202","They are equivalent because both are worth about $50,000 in present value"],"a":2,"e":"年金现值 PV = 12,000 × [1 − 1.07⁻⁵] ÷ 0.07 ≈ 12,000 × 4.1002 ≈ 49,202 美元 < 50,000，因此一次性领取更好。“总额 60,000” 忽略了货币时间价值，是最常见的诱饵；两者现值相差约 798 美元，并不相等。","e_en":"PV of the annuity = 12,000 × [1 − 1.07⁻⁵] ÷ 0.07 ≈ 12,000 × 4.1002 ≈ $49,202 < 50,000, so the lump sum is better. \"A total of 60,000\" ignores the time value of money and is the most common trap; the two present values differ by about $798, so they are not equal."},{"id":"F2-01","t":"F2","lv":1,"ex":["AP","NEC","IEO"],"q":"Market interest rates rise unexpectedly. What happens to the market price of an existing fixed-rate bond?","o":["It rises, because the bond now earns more interest","It falls, because its fixed coupons are less attractive than new bonds' coupons","It stays at face value until maturity","It rises only if the bond is long-term"],"a":1,"e":"债券价格与收益率反向变动 (inverse relationship)：旧债券票息固定，市场利率上升后只有降价才能给新买家提供同样的收益率。“债券现在赚更多利息”是常见误解——固定利率债券的票息并不变化。期限越长，价格下跌越多。","e_en":"Bond prices and yields have an inverse relationship: an existing bond's coupon is fixed, so when market interest rates rise, its price must fall to offer new buyers the same yield. \"Bonds now earn more interest\" is a common misconception — the coupon on a fixed-rate bond does not change. The longer the maturity, the bigger the price fall."},{"id":"F2-02","t":"F2","lv":1,"ex":["IEO"],"q":"An investor moves from holding one airline stock to holding an index fund of 500 stocks. Which risk is MOST reduced?","o":["Risk of a global recession","Risk that interest rates rise","Risk that the airline's CEO makes a bad decision","Risk of higher inflation"],"a":2,"e":"分散化 (diversification) 消除的是公司特有风险 (idiosyncratic risk)，如某公司管理层失误。衰退、利率、通胀属于系统性风险 (systematic risk)，影响所有股票，无法通过分散化消除。","e_en":"Diversification eliminates firm-specific (idiosyncratic) risk, such as mistakes by a company's management. Recessions, interest rates and inflation are systematic risks that affect all stocks and cannot be diversified away."},{"id":"F2-03","t":"F2","lv":1,"ex":["IEO"],"q":"A company's share price is $60, its earnings per share (EPS) are $4, and it pays a dividend of $1.80 per share. What are its P/E ratio and dividend yield?","o":["P/E = 15; dividend yield = 3%","P/E = 0.067; dividend yield = 3%","P/E = 15; dividend yield = 45%","P/E = 33.3; dividend yield = 6.7%"],"a":0,"e":"P/E = 60 ÷ 4 = 15；股息率 = 1.80 ÷ 60 = 3%。0.067 是把公式倒过来 (EPS/P)，即收益率 (earnings yield)；45% 是股利 ÷ EPS，即派息率 (payout ratio)，不是股息率。","e_en":"P/E = 60 ÷ 4 = 15; dividend yield = 1.80 ÷ 60 = 3%. 0.067 inverts the formula (EPS/P), giving the earnings yield; 45% is dividend ÷ EPS, the payout ratio, not the dividend yield."},{"id":"F2-04","t":"F2","lv":2,"ex":["IEO"],"q":"A 3-year bond has a face value of $1,000 and pays an annual coupon of 5%. If the market yield to maturity is 6%, what is the bond's price (nearest cent)?","o":["$1,000.00","$1,027.23","$973.27","$943.40"],"a":2,"e":"P = 50/1.06 + 50/1.06² + 1,050/1.06³ = 47.17 + 44.50 + 881.60 ≈ 973.27 美元。票面利率 5% < 收益率 6%，债券必然折价 (discount)，所以 1,000 和 1,027.23（溢价）都不可能；943.40 只折现了面值一年（1,000/1.06），遗漏了票息。","e_en":"P = 50/1.06 + 50/1.06² + 1,050/1.06³ = 47.17 + 44.50 + 881.60 ≈ $973.27. With a coupon rate of 5% < a yield of 6%, the bond must trade at a discount, so neither 1,000 nor 1,027.23 (a premium) is possible; 943.40 discounts only the face value, for one year (1,000/1.06), leaving out the coupons."},{"id":"F2-05","t":"F2","lv":2,"ex":["IEO"],"q":"A stock's return next year depends on the state of the economy. What is its expected return?","tbl":[["State","Probability","Return"],["Boom","0.3","20%"],["Normal","0.5","5%"],["Recession","0.2","−10%"]],"o":["6.5%","5.0%","8.5%","10.5%"],"a":0,"e":"E(R) = 0.3×20% + 0.5×5% + 0.2×(−10%) = 6% + 2.5% − 2% = 6.5%。5.0% 是三个收益的简单平均 (20+5−10)/3，忽略了概率权重；8.5% 是忘记了衰退情形的负号 (6+2.5)。","e_en":"E(R) = 0.3×20% + 0.5×5% + 0.2×(−10%) = 6% + 2.5% − 2% = 6.5%. 5.0% is the simple average of the three returns, (20+5−10)/3, ignoring the probability weights; 8.5% forgets the minus sign in the recession scenario (6+2.5)."},{"id":"F2-06","t":"F2","lv":2,"ex":["IEO"],"q":"The risk-free rate is 3%, the expected market return is 8%, and a stock has a beta of 1.5. According to the CAPM, what is the stock's required return?","o":["12.0%","7.5%","11.0%","10.5%"],"a":3,"e":"E(R) = R_f + β × (E(R_m) − R_f) = 3% + 1.5 × (8% − 3%) = 10.5%。12% 是直接 1.5 × 8%，把整个市场收益而非市场风险溢价 (market risk premium) 乘以 β；7.5% 只算了 β × 溢价，漏掉无风险利率。","e_en":"E(R) = R_f + β × (E(R_m) − R_f) = 3% + 1.5 × (8% − 3%) = 10.5%. 12% is simply 1.5 × 8%, multiplying β by the whole market return rather than the market risk premium; 7.5% is only β × premium, leaving out the risk-free rate."},{"id":"F2-07","t":"F2","lv":2,"ex":["IEO"],"q":"A firm announces surprisingly strong earnings at 10:00 a.m. If the market is semi-strong-form efficient, what should we expect?","o":["The price adjusts gradually over several weeks, so buying at 10:30 a.m. earns abnormal returns","The price adjusts almost immediately, so trading on the public announcement will not earn abnormal returns on average","The price will not change because earnings are already known to insiders","Only technical analysis of past prices can earn abnormal returns"],"a":1,"e":"半强式有效 (semi-strong-form efficiency) 意味着所有公开信息会迅速反映到价格中，公告后再买入平均无法获得超额收益 (abnormal returns)。“价格缓慢调整”违背了有效市场；技术分析基于历史价格，在弱式有效下就已失效。","e_en":"Semi-strong-form efficiency means all public information is quickly reflected in prices, so buying after an announcement earns no abnormal returns on average. \"Prices adjust slowly\" contradicts market efficiency; technical analysis is based on past prices and already fails under weak-form efficiency."},{"id":"F2-08","t":"F2","lv":3,"ex":["IEO"],"q":"An investor buys both a call and a put on the same stock, each with a strike of $100 and the same expiry (a 'straddle'). The call costs $6 and the put costs $4. Which statement is correct?","o":["The maximum loss is unlimited if the stock price stays at $100","If the stock is $115 at expiry, net profit is $15","The strategy profits only if the stock price rises above $106","If the stock is $115 at expiry, net profit is $5, and the break-even prices are $90 and $110"],"a":3,"e":"股价 115 时：看涨收益 max(115−100,0) = 15，看跌收益 0，净利润 = 15 − (6+4) = 5。盈亏平衡点 = 100 ± 10，即 90 和 110。股价恰为 100 时两份期权都作废，损失为期权费 10（有限而非无限）；“净利润 15” 忘了扣期权费；106 只考虑了看涨期权的期权费。跨式组合 (straddle) 押注的是波动而非方向。","e
