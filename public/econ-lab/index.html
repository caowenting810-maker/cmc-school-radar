_en":"At a share price of 115: call payoff = max(115−100,0) = 15, put payoff = 0, net profit = 15 − (6+4) = 5. The break-even points are 100 ± 10, i.e. 90 and 110. If the share price is exactly 100, both options expire worthless and the loss is the premiums of 10 (limited, not unlimited); \"net profit 15\" forgets to subtract the premiums; 106 considers only the call's premium. A straddle is a bet on volatility, not on direction."},{"id":"F2-09","t":"F2","lv":3,"ex":["IEO"],"q":"A risk-free asset will pay exactly $110 in one year. The risk-free interest rate is 5% per year, and you can borrow and lend at that rate. The asset is currently selling for $102. What arbitrage is available?","o":["Short the asset and lend $102; profit about $2.76 per unit today","Buy the asset and borrow $104.76 against its payoff; lock in about $2.76 per unit today with no risk","No arbitrage exists because $102 is less than $110","Buy the asset; expected profit is $8 but it is risky"],"a":1,"e":"资产公允价值 = 110 ÷ 1.05 ≈ 104.76 美元，市价 102 被低估。套利 (arbitrage)：今天以 5% 借入 104.76（一年后正好用资产的 110 偿还），用其中 102 买入资产，立即锁定 2.76 美元无风险利润。做空方向反了；“102 < 110 所以无套利”忽略了折现；“利润 8 且有风险”错误，因为收益是确定的。","e_en":"Fair value of the asset = 110 ÷ 1.05 ≈ $104.76, so at a market price of 102 it is undervalued. Arbitrage: today, borrow 104.76 at 5% (repaid exactly by the asset's 110 in one year), use 102 of it to buy the asset, and immediately lock in a risk-free profit of $2.76. Short selling is the wrong direction; \"102 < 110, so there is no arbitrage\" ignores discounting; \"a profit of 8, with risk\" is wrong because the payoff is certain."},{"id":"F2-10","t":"F2","lv":3,"ex":["IEO"],"q":"Stocks X and Y have standard deviations of 20% and 30% and are uncorrelated (ρ = 0). What is the standard deviation of a portfolio with 50% in each (to one decimal place)?","o":["25.0%","32.5%","12.5%","18.0%"],"a":3,"e":"σ_p² = 0.5²×0.2² + 0.5²×0.3² + 2×0.5×0.5×0×0.2×0.3 = 0.01 + 0.0225 = 0.0325，σ_p = √0.0325 ≈ 18.0%。25.0% 是简单加权平均，只有在 ρ = +1 时才成立；12.5% 是把权重平方后乘以标准差之和 (0.25 × 50%)，混淆了方差与标准差的运算。组合风险低于任一单只股票，体现了分散化的好处。","e_en":"σ_p² = 0.5²×0.2² + 0.5²×0.3² + 2×0.5×0.5×0×0.2×0.3 = 0.01 + 0.0225 = 0.0325, σ_p = √0.0325 ≈ 18.0%. 25.0% is the simple weighted average, which holds only when ρ = +1; 12.5% multiplies the squared weight by the sum of the standard deviations (0.25 × 50%), confusing the operations for variance and standard deviation. Portfolio risk is lower than that of either individual stock, showing the benefit of diversification."},{"id":"F3-01","t":"F3","lv":1,"ex":["IEO"],"q":"Mei's monthly take-home pay is $4,000. Following the 50/30/20 budgeting rule, how much should she put toward savings and debt repayment each month?","o":["$1,200","$2,000","$400","$800"],"a":3,"e":"50/30/20 法则：20% 用于储蓄和还债，4,000 × 20% = 800 美元。2,000 是必需品 (needs, 50%)，1,200 是可选消费 (wants, 30%)。","e_en":"50/30/20 rule: 20% goes to saving and debt repayment, so 4,000 × 20% = $800. 2,000 is needs (50%); 1,200 is wants (30%)."},{"id":"F3-02","t":"F3","lv":1,"ex":["IEO"],"q":"Which feature of an investment offer is the STRONGEST warning sign of a Ponzi scheme?","o":["The fund publishes audited financial statements","Returns are high, steady every month, and 'guaranteed', and you earn bonuses for recruiting friends","The fund charges a management fee of 1% per year","The fund's value fell during a stock market decline"],"a":1,"e":"庞氏骗局 (Ponzi scheme) 的典型红旗：承诺高额且异常稳定的“保证”收益，并奖励拉新人（因为需要新资金支付老投资者）。经审计的财报是正规迹象；收取管理费和随市场下跌都是正常投资基金的特征。","e_en":"Typical red flags of a Ponzi scheme: promises of high and unusually steady \"guaranteed\" returns, plus rewards for recruiting new investors (because new money is needed to pay earlier investors). Audited financial statements are a sign of legitimacy; charging management fees and falling with the market are normal features of a genuine investment fund."},{"id":"F3-03","t":"F3","lv":1,"ex":["IEO"],"q":"Your car insurance policy has a $500 deductible. You have an accident causing $3,000 of covered damage. How much does the insurer pay?","o":["$2,500","$3,000","$500","$3,500"],"a":0,"e":"免赔额 (deductible) 由投保人自付：保险公司赔付 = 3,000 − 500 = 2,500 美元。500 是你自付的部分而不是保险赔付；3,500 把免赔额加反了。","e_en":"The deductible is paid by the policyholder: insurance payout = 3,000 − 500 = $2,500. 500 is the part you pay yourself, not the insurance payout; 3,500 adds the deductible instead of subtracting it."},{"id":"F3-04","t":"F3","lv":1,"ex":["IEO"],"q":"Which action is MOST likely to improve a person's credit score over time?","o":["Opening several new credit cards in the same month","Using 90% of the available credit limit every month","Paying every bill on time and keeping balances low relative to credit limits","Closing the oldest credit card account"],"a":2,"e":"按时还款记录 (payment history) 与较低的额度使用率 (credit utilization) 是信用评分最重要的两个因素。短期内频繁开卡会产生多次查询；使用率 90% 显示财务紧张；关闭最老账户会缩短信用历史并降低总额度。","e_en":"Payment history and low credit utilization are the two most important factors in a credit score. Opening many cards in a short period creates multiple inquiries; 90% utilization signals financial strain; closing your oldest account shortens your credit history and reduces your total credit limit."},{"id":"F3-05","t":"F3","lv":2,"ex":["IEO"],"q":"A homeowner faces a 2% chance of a $20,000 flood loss this year. What is the actuarially fair premium for full insurance, and would a risk-averse homeowner buy insurance at a premium of $450?","o":["$400; yes, a risk-averse person may pay more than the expected loss","$400; no, a rational person never pays more than the expected loss","$20,000; no","$450; yes, because the fair premium is $450"],"a":0,"e":"期望损失 = 0.02 × 20,000 = 400 美元，即精算公平保费 (actuarially fair premium)。风险厌恶者 (risk-averse) 愿意支付一个风险溢价来消除不确定性，所以 450 美元仍可能购买。“理性人不会付超过期望损失”只适用于风险中性者。","e_en":"Expected loss = 0.02 × 20,000 = $400, which is the actuarially fair premium. A risk-averse person is willing to pay a risk premium to eliminate uncertainty, so they may still buy at $450. \"A rational person would never pay more than the expected loss\" applies only to someone who is risk-neutral."},{"id":"F3-06","t":"F3","lv":2,"ex":["IEO"],"q":"Leo has a $3,000 credit card balance at an APR of 18%, compounded monthly. If he makes no payments and no new purchases for 12 months, what will he owe (nearest dollar)?","o":["$3,587","$3,540","$3,045","$3,564"],"a":0,"e":"月利率 = 18% ÷ 12 = 1.5%，余额 = 3,000 × 1.015¹² ≈ 3,586.85 ≈ 3,587 美元。3,540 是单利 3,000 × 1.18，忽略按月复利；3,564 是按半年复利 3,000 × 1.09²；3,045 只计了一个月利息。EAR ≈ 19.56%，高于 APR。","e_en":"Monthly rate = 18% ÷ 12 = 1.5%; balance = 3,000 × 1.015¹² ≈ 3,586.85 ≈ $3,587. 3,540 is simple interest, 3,000 × 1.18, ignoring monthly compounding; 3,564 is semi-annual compounding, 3,000 × 1.09²; 3,045 counts only one month's interest. The EAR ≈ 19.56%, higher than the APR."},{"id":"F3-07","t":"F3","lv":2,"ex":["IEO"],"q":"An investor tends to sell stocks that have risen in price quickly to 'lock in gains', while holding on to stocks that have fallen, hoping to 'get back to even'. This pattern is best described as:","o":["Diversification","The disposition effect, driven by loss aversion","Rational rebalancing","Dollar-cost averaging"],"a":1,"e":"处置效应 (disposition effect)：过早卖出盈利股、长期持有亏损股，根源是损失厌恶 (loss aversion)——实现亏损带来的痛苦大于同等收益的快乐。这与分散化或再平衡 (rebalancing) 无关；再平衡依据目标权重，而不是依据是否“回本”。","e_en":"The disposition effect: selling winners too early and holding on to losers, rooted in loss aversion — the pain of realising a loss is greater than the pleasure of an equal gain. It has nothing to do with diversification or rebalancing; rebalancing is based on target weights, not on whether a stock has \"broken even\"."},{"id":"F3-08","t":"F3","lv":2,"ex":["IEO","AP","NEC"],"q":"A household keeps its savings in an account paying 2% per year while inflation is 5%. What happens to the real purchasing power of those savings over one year (to two decimal places)?","o":["It rises by 2.00%","It falls by 3.00% exactly","It falls by about 2.86%","It rises by 7.00%"],"a":2,"e":"实际收益 = 1.02 ÷ 1.05 − 1 ≈ −2.86%，购买力下降约 2.86%。−3% 是近似式 i − π，并非精确值；“上升 2%”只看了名义收益，忽略通胀 (money illusion 货币幻觉)。","e_en":"Real return = 1.02 ÷ 1.05 − 1 ≈ −2.86%, so purchasing power falls by about 2.86%. −3% is the approximation i − π, not the exact value; \"rises by 2%\" looks only at the nominal return and ignores inflation (money illusion)."},{"id":"F3-09","t":"F3","lv":3,"ex":["IEO"],"q":"A country's income tax schedule is: 0% on the first $10,000; 10% on income from $10,000 to $40,000; 25% on income above $40,000. For someone earning $60,000, what are the total tax, the average tax rate and the marginal tax rate?","tbl":[["Taxable income band","Rate"],["$0 – $10,000","0%"],["$10,000 – $40,000","10%"],["Above $40,000","25%"]],"o":["$15,000; 25%; 25%","$8,000; 25%; 13.3%","$6,000; 10%; 25%","$8,000; 13.3%; 25%"],"a":3,"e":"税额 = 0 + 10% × 30,000 + 25% × 20,000 = 3,000 + 5,000 = 8,000 美元；平均税率 (average tax rate) = 8,000 ÷ 60,000 ≈ 13.3%；边际税率 (marginal tax rate) = 25%（最后一元的税率）。15,000 是把全部收入按 25% 征税的错误理解；第二项把平均与边际弄反了。","e_en":"Tax = 0 + 10% × 30,000 + 25% × 20,000 = 3,000 + 5,000 = $8,000; average tax rate = 8,000 ÷ 60,000 ≈ 13.3%; marginal tax rate = 25% (the rate on the last dollar). 15,000 wrongly assumes all income is taxed at 25%; the second option mixes up the average and marginal rates."},{"id":"F3-10","t":"F3","lv":3,"ex":["IEO"],"q":"Ana saves $3,000 at the end of every year from age 25 to 65 (40 payments). Ben saves $3,000 at the end of every year from age 35 to 65 (30 payments). Both earn 6% per year. Approximately how much more does Ana have at 65?","o":["$30,000","About $227,000","About $127,000","About $464,000"],"a":1,"e":"年金终值 FV = 3,000 × [(1.06)ⁿ − 1] ÷ 0.06：Ana (n=40) ≈ 464,286；Ben (n=30) ≈ 237,175；差额 ≈ 227,111 美元。30,000 只是多存的本金（10 × 3,000），忽略复利；464,000 是 Ana 的总额而非差额。早开始 10 年，本金多 30,000，终值却多出约 22.7 万——复利时间的威力。","e_en":"Future value of an annuity FV = 3,000 × [(1.06)ⁿ − 1] ÷ 0.06: Ana (n=40) ≈ 464,286; Ben (n=30) ≈ 237,175; difference ≈ $227,111. 30,000 is just the extra principal saved (10 × 3,000), ignoring compounding; 464,000 is Ana's total rather than the difference. Starting 10 years earlier means 30,000 more in principal but about 227,000 more at the end — the power of time in compounding."},{"id":"F4-01","t":"F4","lv":1,"ex":["IEO","NEC"],"q":"A café's revenue rose 10% last year, but its profit fell. Which explanation is consistent with these facts?","o":["Its prices increased while quantity sold stayed the same","Its costs rose by more than its revenue did","Its fixed costs were unchanged and variable cost per unit fell","Its number of customers grew while costs per customer fell"],"a":1,"e":"利润 = 收入 − 成本。收入上升而利润下降，只能是成本上升得比收入更多。其他选项都会使利润上升或至少不下降，这是利润树 (profitability tree) 的第一层拆分。","e_en":"Profit = revenue − costs. If revenue rises but profit falls, costs must have risen by more than revenue. All the other options would raise profit or at least not reduce it. This is the first level of the profitability tree."},{"id":"F4-02","t":"F4","lv":1,"ex":["IEO","NEC"],"q":"A bubble-tea shop has fixed costs of $12,000 per month. Each drink sells for $20 and has a variable cost of $8. How many drinks must it sell per month to break even?","o":["600","1,500","1,000","428"],"a":2,"e":"盈亏平衡销量 = FC ÷ (P − AVC) = 12,000 ÷ (20 − 8) = 1,000 杯。600 是用单价去除 (12,000 ÷ 20)，忽略了变动成本；1,500 是用变动成本去除 (12,000 ÷ 8)；428 是 12,000 ÷ 28，把价格和成本相加。","e_en":"Break-even quantity = FC ÷ (P − AVC) = 12,000 ÷ (20 − 8) = 1,000 cups. 600 divides by the price (12,000 ÷ 20), ignoring variable costs; 1,500 divides by the variable cost (12,000 ÷ 8); 428 is 12,000 ÷ 28, which adds price and cost together."},{"id":"F4-03","t":"F4","lv":1,"ex":["IEO"],"q":"Which of the following is NOT one of Porter's five forces?","o":["Threat of substitute products","Bargaining power of buyers","Threat of new entrants","The firm's internal management culture"],"a":3,"e":"波特五力 (Porter's five forces) 是行业层面的外部力量：现有竞争、新进入者、替代品、供应商议价能力、买方议价能力。公司内部管理文化属于内部因素，在 SWOT 中对应优势或劣势。","e_en":"Porter's Five Forces are external, industry-level forces: rivalry among existing competitors, new entrants, substitutes, supplier bargaining power and buyer bargaining power. A company's internal management culture is an internal factor, which belongs under strengths or weaknesses in a SWOT."},{"id":"F4-04","t":"F4","lv":2,"ex":["IEO"],"q":"A product sells for $50 with a variable cost of $30 per unit. Fixed costs are $80,000 per year. What is the contribution margin ratio and the break-even revenue?","o":["40%; $200,000","60%; $133,333","40%; $80,000","20%; $400,000"],"a":0,"e":"边际贡献率 = (50 − 30) ÷ 50 = 40%；盈亏平衡收入 = 80,000 ÷ 40% = 200,000 美元（即 4,000 件 × 50）。60% 是变动成本率；80,000 只是固定成本；20% 把单位边际贡献 20 误当成了比率。","e_en":"Contribution margin ratio = (50 − 30) ÷ 50 = 40%; break-even revenue = 80,000 ÷ 40% = $200,000 (i.e. 4,000 units × 50). 60% is the variable cost ratio; 80,000 is just the fixed costs; 20% mistakes the unit contribution margin of 20 for a ratio."},{"id":"F4-05","t":"F4","lv":2,"ex":["IEO"],"q":"A subscription app charges $30 per month with a 60% gross margin. Monthly churn is 5%, and customer acquisition cost (CAC) is $120. What are the customer lifetime value (LTV) and the LTV/CAC ratio?","o":["LTV = $360; LTV/CAC = 3","LTV = $600; LTV/CAC = 5","LTV = $18; LTV/CAC = 0.15","LTV = $216; LTV/CAC = 1.8"],"a":0,"e":"每月边际贡献 = 30 × 60% = 18；平均客户寿命 = 1 ÷ 5% = 20 个月；LTV = 18 × 20 = 360 美元，LTV/CAC = 360 ÷ 120 = 3。600 用收入而非毛利计算（30 × 20）；18 只是一个月的贡献。","e_en":"Monthly contribution = 30 × 60% = 18; average customer lifetime = 1 ÷ 5% = 20 months; LTV = 18 × 20 = $360, and LTV/CAC = 360 ÷ 120 = 3. 600 uses revenue rather than gross profit (30 × 20); 18 is just one month's contribution."},{"id":"F4-06","t":"F4","lv":2,"ex":["IEO","NEC"],"q":"A fast-growing firm reports a healthy profit on its income statement but is struggling to pay its suppliers. Which is the MOST likely explanation?","o":["Its depreciation expense is too high","It has too much equity on its balance sheet","Its gross margin is negative","Its sales are mostly on credit, so accounts receivable are rising faster than cash is collected"],"a":3,"e":"利润 ≠ 现金 (profit vs cash)：赊销确认了收入和利润，但现金要等客户付款后才流入，应收账款 (accounts receivable) 积压导致现金紧张。折旧是非现金费用，反而不消耗现金；毛利为负与“利润健康”矛盾。","e_en":"Profit is not cash: credit sales record revenue and profit, but cash flows in only when customers pay, so a build-up of accounts receivable causes a cash squeeze. Depreciation is a non-cash expense and does not use up cash; negative gross profit contradicts \"healthy profits\"."},{"id":"F4-07","t":"F4","lv":2,"ex":["IEO","NEC"],"q":"Estimate the annual market for dog-food bags in a city of 8 million people, assuming 2.5 people per household, 40% of households own a dog, and each dog-owning household buys 1 bag per month.","o":["About 15.4 million bags","About 38.4 million bags","About 3.2 million bags","About 1.28 million bags"],"a":0,"e":"住户数 = 8,000,000 ÷ 2.5 = 320 万户；养狗户 = 320 万 × 40% = 128 万户；年需求 = 128 万 × 12 = 1,536 万袋 ≈ 15.4 million。3.2 million 是总户数；1.28 million 忘了乘以 12 个月；38.4 million 用总人口而非户数计算（8M × 40% × 12）。","e_en":"Households = 8,000,000 ÷ 2.5 = 3.2 million; dog-owning households = 3.2 million × 40% = 1.28 million; annual demand = 1.28 million × 12 = 15.36 million bags ≈ 15.4 million. 3.2 million is the total number of households; 1.28 million forgets to multiply by 12 months; 38.4 million uses the total population instead of households (8M × 40% × 12)."},{"id":"F4-08","t":"F4","lv":3,"ex":["IEO"],"q":"A firm sells 5,000 units per month at $10 each; variable cost is $6 per unit. It is considering cutting the price to $9. By how much must unit sales rise for total contribution to stay the same?","o":["About 11%","About 25%","About 33%","About 50%"],"a":2,"e":"原总边际贡献 = (10 − 6) × 5,000 = 20,000；降价后单位边际贡献 = 3，需要销量 20,000 ÷ 3 ≈ 6,667 件，增幅 ≈ 33.3%。11% 是价格降幅 10% 的直觉推算（10 ÷ 9 − 1），忽略了边际贡献被压缩了 25%；25% 是边际贡献的降幅而非所需销量增幅。只有需求足够有弹性 (elastic) 时降价才划算。","e_en":"Original total contribution = (10 − 6) × 5,000 = 20,000; after the price cut, the unit contribution margin = 3, so the required volume is 20,000 ÷ 3 ≈ 6,667 units, an increase of ≈ 33.3%. 11% is an intuitive guess based on the 10% price cut (10 ÷ 9 − 1), ignoring the fact that the contribution margin has been squeezed by 25%; 25% is the fall in the contribution margin, not the required increase in volume. A price cut pays off only if demand is sufficiently elastic."},{"id":"F4-09","t":"F4","lv":3,"ex":["IEO"],"q":"A firm has fixed costs of $50,000, a price of $25 and a variable cost of $15 per unit. The tax rate on profit is 20%. How many units must it sell to earn an AFTER-TAX profit of $24,000?","o":["7,400 units","5,000 units","9,800 units","8,000 units"],"a":3,"e":"税后利润 24,000 对应税前利润 = 24,000 ÷ (1 − 20%) = 30,000。所需销量 = (FC + 税前目标利润) ÷ 单位边际贡献 = (50,000 + 30,000) ÷ 10 = 8,000 件。7,400 直接用税后利润 (50,000 + 24,000) ÷ 10，忘了换算税前；5,000 只是盈亏平衡点。","e_en":"An after-tax profit of 24,000 corresponds to a pre-tax profit of 24,000 ÷ (1 − 20%) = 30,000. Required volume = (FC + pre-tax target profit) ÷ unit contribution margin = (50,000 + 30,000) ÷ 10 = 8,000 units. 7,400 uses the after-tax profit directly, (50,000 + 24,000) ÷ 10, forgetting to convert it to pre-tax; 5,000 is just the break-even point."},{"id":"F4-10","t":"F4","lv":3,"ex":["IEO"],"q":"On the last day of the year, a firm sells goods costing $600 for $1,000 on credit (the customer will pay next month). What is the immediate effect on this year's statements, ignoring tax?","o":["Net income +$400; cash +$1,000; inventory −$600","Net income +$400; operating cash flow unchanged by this sale; accounts receivable +$1,000; inventory −$600; equity +$400","Net income unchanged until cash is received; accounts receivable +$1,000","Net income +$1,000; operating cash flow +$400"],"a":1,"e":"权责发生制 (accrual accounting)：销售发生即确认收入 1,000、成本 600，净利润 +400，留存收益使权益 (equity) +400。现金尚未收到，经营现金流不因这笔销售增加；资产端应收账款 +1,000、存货 −600，净增 400 = 权益增加，会计恒等式保持平衡。“现金 +1,000”混淆了赊销与现销；“收到现金才确认利润”是收付实现制 (cash basis) 的思路。","e_en":"Accrual accounting: revenue of 1,000 and cost of 600 are recognised when the sale occurs, so net profit is +400 and retained earnings raise equity by +400. No cash has been received yet, so operating cash flow does not increase from this sale; on the asset side, accounts receivable +1,000 and inventory −600 give a net increase of 400 = the increase in equity, so the accounting identity balances. \"Cash +1,000\" confuses a credit sale with a cash sale; \"profit is recognised only when cash is received\" is cash-basis thinking."},{"id":"F5-01","t":"F5","lv":1,"ex":["IB","NEC","IEO"],"q":"Which economist is most closely associated with the 'invisible hand' and the book The Wealth of Nations (1776)?","o":["David Ricardo","John Maynard Keynes","Adam Smith","Karl Marx"],"a":2,"e":"亚当·斯密 (Adam Smith) 在 1776 年《国富论》中提出“看不见的手”和分工理论。李嘉图提出比较优势 (1817)；凯恩斯著《通论》(1936)；马克思著《资本论》，关注资本主义中的阶级与分配冲突。","e_en":"Adam Smith introduced the \"invisible hand\" and the theory of the division of labour in The Wealth of Nations in 1776. Ricardo developed comparative advantage (1817); Keynes wrote The General Theory (1936); Marx wrote Capital, focusing on class and distributional conflict under capitalism."},{"id":"F5-02","t":"F5","lv":1,"ex":["AP","IB","IEO","NEC"],"q":"A lake is open to everyone for fishing, and fish stocks are collapsing. Which policy most directly addresses the root cause identified by economists?","o":["Subsidising fishing boats so fishers can catch more","Creating tradable fishing quotas that give fishers secure rights to a share of the catch","Encouraging more restaurants to serve fish","Lowering the price of fishing licences"],"a":1,"e":"根源是产权缺失导致的公地悲剧 (tragedy of the commons)：每个渔民忽略自己捕捞对他人的外部成本。可交易配额 (ITQs) 界定了产权，使渔民有激励保护鱼群。补贴渔船和降低许可证价格会加剧过度捕捞。","e_en":"The root cause is the tragedy of the commons arising from missing property rights: each fisher ignores the external cost their own catch imposes on others. Individual transferable quotas (ITQs) define property rights, giving fishers an incentive to conserve fish stocks. Subsidising fishing boats and cutting licence fees would make overfishing worse."},{"id":"F5-03","t":"F5","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"During a deep recession with high unemployment, which policy would John Maynard Keynes most likely recommend?","o":["Increasing government spending to raise aggregate demand","Balancing the budget immediately by cutting spending","Fixing money supply growth at a constant rate regardless of conditions","Abolishing the central bank"],"a":0,"e":"凯恩斯 (Keynes) 认为衰退源于总需求 (aggregate demand) 不足，主张扩张性财政政策（增加政府支出或减税）。立即平衡预算会进一步压低需求；固定货币增速规则是弗里德曼 (Friedman) 的主张。","e_en":"Keynes argued that recessions are caused by insufficient aggregate demand and advocated expansionary fiscal policy (higher government spending or tax cuts). Balancing the budget immediately would depress demand further; a fixed money-growth rule is Friedman's position."},{"id":"F5-04","t":"F5","lv":2,"ex":["IEO","NEC"],"q":"Shareholders cannot observe how hard a CEO works. Which contract feature is designed mainly to reduce this principal–agent problem?","o":["A fixed salary that does not depend on firm performance","Stock options or bonuses linked to the firm's long-run share price","A guaranteed contract that cannot be terminated","Paying the CEO in cash only at the start of the contract"],"a":1,"e":"委托–代理问题 (principal–agent problem) 源于信息不对称和利益不一致。把报酬与长期股价挂钩，使 CEO 的利益与股东一致。固定工资、不可解约合同和预付现金都削弱了激励，反而加剧道德风险 (moral hazard)。","e_en":"The principal–agent problem arises from asymmetric information and conflicting interests. Linking pay to the long-term share price aligns the CEO's interests with those of shareholders. A fixed salary, a contract that cannot be terminated and cash paid in advance all weaken incentives and make moral hazard worse."},{"id":"F5-05","t":"F5","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"In Country A, one worker-hour produces 1 unit of cloth or 0.5 units of wine. In Country B, one worker-hour produces 1/3 unit of cloth or 0.25 units of wine. Which statement is correct?","tbl":[["","Hours per unit of cloth","Hours per unit of wine"],["Country A","1","2"],["Country B","3","4"]],"o":["A has a comparative advantage in both goods, so no trade is beneficial","B has a comparative advantage in cloth","A has a comparative advantage in wine","A has a comparative advantage in cloth; B in wine"],"a":3,"e":"机会成本 (opportunity cost)：A 生产 1 单位布放弃 1/2 = 0.5 单位酒；B 放弃 3/4 = 0.75 单位酒。A 生产布的机会成本更低 → A 在布上有比较优势 (comparative advantage)；相应地 B 在酒上有比较优势（B 的酒机会成本 4/3 ≈ 1.33 布 < A 的 2 布）。A 在两种商品上都有绝对优势 (absolute advantage)，但贸易仍互利——比较优势不可能同时在两种商品上。","e_en":"Opportunity cost: for A, producing 1 unit of cloth means giving up 1/2 = 0.5 units of wine; for B, 3/4 = 0.75 units of wine. A has the lower opportunity cost of cloth → A has a comparative advantage in cloth; correspondingly, B has a comparative advantage in wine (B's opportunity cost of wine is 4/3 ≈ 1.33 cloth < A's 2 cloth). A has an absolute advantage in both goods, yet trade is still mutually beneficial — no one can have a comparative advantage in both goods at the same time."},{"id":"F5-06","t":"F5","lv":2,"ex":["IEO","IB"],"q":"Friedrich Hayek's main argument against central planning was that:","o":["Central planners are always corrupt","Markets always produce equal outcomes","The information needed for efficient allocation is dispersed among millions of people, and prices aggregate it","Government spending always causes inflation"],"a":2,"e":"哈耶克 (Hayek) 的“知识问题” (knowledge problem)：关于偏好、技术、局部条件的知识分散在个人手中，价格信号 (price signals) 把这些信息汇总并传递，计划者无法收集。他并未主张市场结果平等；“腐败”和“通胀”不是其核心论证。","e_en":"Hayek's \"knowledge problem\": knowledge of preferences, technology and local conditions is dispersed among individuals; price signals aggregate and transmit this information, which planners cannot collect. He did not argue that market outcomes are equal; \"corruption\" and \"inflation\" are not the core of his argument."},{"id":"F5-07","t":"F5","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"A large country imposes a tariff on imported steel. Which group is MOST likely to be harmed?","o":["Domestic steel producers","The government's tax revenue","Domestic car manufacturers that use steel as an input","Workers in domestic steel mills"],"a":2,"e":"关税 (tariff) 抬高国内钢材价格：国内钢铁企业及其工人受益，政府获得关税收入；但以钢材为投入品的下游产业（如汽车制造）成本上升、竞争力下降。时事分析要同时看到直接受益者和隐性受损者，以及无谓损失 (deadweight loss)。","e_en":"A tariff raises the domestic price of steel: domestic steelmakers and their workers benefit and the government collects tariff revenue, but downstream industries that use steel as an input (such as car manufacturing) face higher costs and become less competitive. Current-events analysis must identify both the direct winners and the hidden losers, as well as the deadweight loss."},{"id":"F5-08","t":"F5","lv":3,"ex":["AP","IB","AL","NEC","IEO"],"q":"Assume the velocity of money is constant. The money supply grows by 8% per year and real GDP grows by 3% per year. According to the quantity theory of money, what is the approximate inflation rate?","o":["11%","8%","3%","5%"],"a":3,"e":"货币数量论 (quantity theory)：%ΔM + %ΔV ≈ %ΔP + %ΔY → 8% + 0 ≈ π + 3% → π ≈ 5%。8% 忽略了实际产出增长吸收的货币需求；11% 把产出增长错误地加上去。这正是弗里德曼“通胀是货币现象”的逻辑。","e_en":"Quantity theory of money: %ΔM + %ΔV ≈ %ΔP + %ΔY → 8% + 0 ≈ π + 3% → π ≈ 5%. 8% ignores the money demand absorbed by real output growth; 11% wrongly adds output growth. This is exactly the logic behind Friedman's \"inflation is a monetary phenomenon\"."},{"id":"F5-09","t":"F5","lv":3,"ex":["IEO"],"q":"In a CORE-style labour discipline model, a worker earns $600 per week. If fired, her reservation option (unemployment benefit plus value of free time) is worth $450 per week, and she expects to be unemployed for 10 weeks before finding a similar job. What is her total cost of job loss, and what happens to it if unemployment benefits rise?","o":["$1,500; it rises","$6,000; it falls","$4,500; it rises","$1,500; it falls"],"a":3,"e":"每周就业租金 (employment rent) = 600 − 450 = 150；失业 10 周的总损失 = 150 × 10 = 1,500 美元。失业救济提高 → 保留选择价值上升 → 就业租金下降，雇主需提高工资才能维持同样的努力程度。6,000 是全部工资而非租金；4,500 是保留选择的价值。","e_en":"Weekly employment rent = 600 − 450 = 150; total cost of 10 weeks' unemployment = 150 × 10 = $1,500. Higher unemployment benefits → a more valuable reservation option → a lower employment rent, so employers must raise wages to maintain the same level of effort. 6,000 is the whole wage rather than the rent; 4,500 is the value of the reservation option."},{"id":"F5-10","t":"F5","lv":3,"ex":["IEO","NEC"],"q":"A new AI tool can perform many routine document-review tasks previously done by junior paralegals. Using a task-based view of technology, which prediction is BEST supported?","o":["Total employment in the economy must fall by the number of tasks automated","Nothing will change because technology never affects labour markets","All wages will rise because productivity rises","Demand falls for workers whose jobs are concentrated in the automated tasks, while workers whose skills complement the tool may see higher productivity and wages; the net effect on total employment is ambiguous"],"a":3,"e":"任务视角 (task-based view)：AI 替代部分任务产生替代效应 (displacement effect)，但也通过降低成本产生生产率效应 (productivity effect) 并创造新任务 (new tasks)。被替代任务集中的岗位需求下降，与 AI 互补 (complementary) 的技能回报上升；总体就业影响取决于各效应大小，是不确定的。“就业必然等量减少”是劳动总量谬误 (lump of labour fallacy)；“所有工资都上升”忽略了分配效应。","e_en":"Task-based view: AI replacing some tasks creates a displacement effect, but by cutting costs it also creates a productivity effect and generates new tasks. Demand falls for jobs concentrated in displaced tasks, while returns rise for skills complementary to AI; the overall effect on employment depends on the size of each effect and is uncertain. \"Employment must fall one-for-one\" is the lump of labour fallacy; \"all wages rise\" ignores distributional effects."},{"id":"m11-01","t":"m11","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A firm aims to maximise profit. At its current output, marginal revenue is $12 and marginal cost is $9. To maximise profit, the firm should:","o":["Increase output until MR equals MC","Reduce output until MR equals zero","Keep output unchanged because it is making a profit","Raise output until price equals average cost"],"a":0,"e":"正确：MR = 12 > MC = 9，多生产一单位增加利润 3，应扩大产量直到 MR = MC。MR = 0 是收入最大化 (revenue maximisation) 的条件；“有利润就不变”忽略了边际分析；P = AC 是销售最大化 (sales maximisation)，此时经济利润为零。","e_en":"Correct: MR = 12 > MC = 9, so producing one more unit adds 3 to profit; output should expand until MR = MC. MR = 0 is the revenue-maximisation condition; \"keep output unchanged because there is profit\" ignores marginal analysis; P = AC is sales maximisation, where economic profit is zero."},{"id":"m11-02","t":"m11","lv":2,"ex":["AL","IB","IEO"],"q":"A firm faces the demand curve P = 100 − 2Q and has constant marginal cost and average cost of $20. If the firm's managers aim to maximise total revenue rather than profit, what price and output will they choose?","o":["Q = 20, P = $60","Q = 25, P = $50","Q = 40, P = $20","Q = 50, P = $0"],"a":1,"e":"收入最大化条件 MR = 0。TR = 100Q − 2Q²，MR = 100 − 4Q = 0 ⇒ Q = 25，P = 100 − 50 = 50，TR = 1,250。Q = 20、P = 60 是利润最大化 (MR = MC = 20) 的结果；Q = 40、P = 20 是销售最大化 (AR = AC)；Q = 50 时价格为零，总收益为零。","e_en":"The revenue-maximising condition is MR = 0. TR = 100Q − 2Q², MR = 100 − 4Q = 0 ⇒ Q = 25, P = 100 − 50 = 50, TR = 1,250. Q = 20, P = 60 is the profit-maximising outcome (MR = MC = 20); Q = 40, P = 20 is sales maximisation (AR = AC); at Q = 50 the price is zero, so total revenue is zero."},{"id":"m11-03","t":"m11","lv":3,"ex":["AL","IEO"],"q":"A firm faces demand P = 100 − 2Q and constant MC = AC = 20. Let Q_π be profit-maximising output, Q_R revenue-maximising output and Q_S sales-maximising output (subject to earning at least normal profit). Which is correct?","o":["Q_π = 20, Q_R = 40, Q_S = 25","Q_R = 25, Q_π = 20, Q_S = 50","Q_π = 20 < Q_R = 25 < Q_S = 40","Q_π = Q_R = 25 < Q_S = 40"],"a":2,"e":"利润最大化：MR = 100 − 4Q = 20 ⇒ Q_π = 20。收入最大化：MR = 0 ⇒ Q_R = 25。销售最大化：AR = AC ⇒ 100 − 2Q = 20 ⇒ Q_S = 40。故 20 < 25 < 40。Q_S = 50 是把价格压到零（混淆了 P = 0 与 P = AC）；Q_π = Q_R 仅在 MC = 0 时成立。","e_en":"Profit maximisation: MR = 100 − 4Q = 20 ⇒ Q_π = 20. Revenue maximisation: MR = 0 ⇒ Q_R = 25. Sales maximisation: AR = AC ⇒ 100 − 2Q = 20 ⇒ Q_S = 40. So 20 < 25 < 40. Q_S = 50 pushes price to zero (confusing P = 0 with P = AC); Q_π = Q_R holds only when MC = 0."},{"id":"m11-04","t":"m11","lv":1,"ex":["AL","IB","NEC"],"q":"A state-owned monopoly faces no competitive pressure. Its managers allow staffing levels and costs to rise well above the minimum cost at which its output could be produced. This is best described as:","o":["Allocative inefficiency","Diseconomies of scope","Dynamic efficiency","X-inefficiency"],"a":3,"e":"X-无效率 (X-inefficiency) 指企业因缺乏竞争压力、管理松懈，实际成本高于其成本曲线所示的最低可达成本。配置无效率是 P ≠ MC；范围不经济与多产品联合生产有关；动态效率是指通过创新长期降低成本，与题意相反。","e_en":"X-inefficiency means that, because of a lack of competitive pressure and managerial slack, a firm's actual costs are above the lowest attainable cost shown by its cost curve. Allocative inefficiency is P ≠ MC; diseconomies of scope concern joint production of several products; dynamic efficiency refers to cutting costs over time through innovation, the opposite of the situation described."},{"id":"m11-05","t":"m11","lv":1,"ex":["AL","IB","NEC"],"q":"An electric-car manufacturer buys a company that mines lithium used in its batteries. This is an example of:","o":["Horizontal integration","Backward vertical integration","Forward vertical integration","Conglomerate integration"],"a":1,"e":"车企收购其上游的原材料（锂矿）供应商，属于向后纵向一体化 (backward vertical integration)，目的通常是保障供应、控制投入成本。横向一体化是同一生产阶段的合并（如两家车企合并）；向前一体化是向消费者方向（如收购经销商）；混合一体化是进入不相关行业。","e_en":"A carmaker buying its upstream supplier of a raw material (lithium) is backward vertical integration, usually aimed at securing supply and controlling input costs. Horizontal integration is a merger at the same stage (e.g. two carmakers merge); forward integration moves towards consumers (e.g. buying dealerships); conglomerate integration means entering an unrelated industry."},{"id":"m11-06","t":"m11","lv":2,"ex":["AP","IB","AL","IEO"],"q":"A profit-maximising monopolist faces demand P = 100 − 2Q and has constant MC = AC = 20. Compared with the allocatively efficient outcome, what is the deadweight loss caused by the monopoly?","o":["$400","$800","$1,600","$200"],"a":0,"e":"垄断：MR = 100 − 4Q = 20 ⇒ Q = 20，P = 60。配置效率 P = MC：100 − 2Q = 20 ⇒ Q = 40。无谓损失 (DWL) = ½ × (60 − 20) × (40 − 20) = 400。800 是垄断利润 (60 − 20) × 20（这是从消费者剩余转移的部分，不是无谓损失）；1,600 是完全竞争下的消费者剩余；200 是把三角形底边算成 10。","e_en":"Monopoly: MR = 100 − 4Q = 20 ⇒ Q = 20, P = 60. Allocative efficiency P = MC: 100 − 2Q = 20 ⇒ Q = 40. Deadweight loss = ½ × (60 − 20) × (40 − 20) = 400. 800 is monopoly profit (60 − 20) × 20 (a transfer from consumer surplus, not a deadweight loss); 1,600 is consumer surplus under perfect competition; 200 wrongly uses 10 as the base of the triangle."},{"id":"m11-07","t":"m11","lv":3,"ex":["IEO","AL"],"q":"A specialist firm producing only good 1 has costs C_1 = 100 + 2q_1; a specialist producing only good 2 has C_2 = 80 + 3q_2. A diversified firm producing both has C(q_1, q_2) = 150 + 2q_1 + 3q_2. At q_1 = q_2 = 10, the degree of economies of scope, SC = [C_1 + C_2 − C(q_1, q_2)] ÷ C(q_1, q_2), is:","o":["−0.13","0.13","0.30","0.15"],"a":3,"e":"分别生产：C_1 = 100 + 20 = 120，C_2 = 80 + 30 = 110，合计 230。联合生产：150 + 20 + 30 = 200。SC = (230 − 200) ÷ 200 = 0.15 > 0，存在范围经济 (economies of scope)，来源是共享的固定成本（180 → 150）。0.13 是误除以 230；0.30 是只比较固定成本 (180 − 150) ÷ 100 之类的错误；负值则把符号弄反。","e_en":"Separate production: C_1 = 100 + 20 = 120, C_2 = 80 + 30 = 110, total 230. Joint production: 150 + 20 + 30 = 200. SC = (230 − 200) ÷ 200 = 0.15 > 0, so there are economies of scope, arising from shared fixed costs (180 → 150). 0.13 wrongly divides by 230; 0.30 comes from an error such as comparing only fixed costs, (180 − 150) ÷ 100; the negative value reverses the sign."},{"id":"m11-08","t":"m11","lv":2,"ex":["AL","IB"],"q":"A privatised water company is regulated with an RPI − X price cap. Retail price inflation (RPI) is 5% and the regulator sets X = 3%. If the current average price is $100, what is the maximum average price the firm may charge next year?","o":["$97","$98","$102","$108"],"a":2,"e":"允许涨幅 = RPI − X = 5% − 3% = 2%，最高价格 = 100 × 1.02 = 102。97 是误用 −X 忽略了 RPI；98 是把 X − RPI 当成降价；108 是 RPI + X。价格上限管制的激励在于：企业若降本超过 X%，可保留额外利润。","e_en":"Permitted increase = RPI − X = 5% − 3% = 2%, so the maximum price = 100 × 1.02 = 102. 97 applies −X and ignores RPI; 98 treats X − RPI as a price cut; 108 is RPI + X. The incentive in price-cap regulation is that if the firm cuts costs by more than X%, it keeps the extra profit."},{"id":"m11-09","t":"m11","lv":2,"ex":["AL","IB","IEO","NEC"],"q":"Which of the following is the clearest example of government failure caused by regulatory capture?","o":["A tax on cigarettes raises revenue but smoking falls only slightly because demand is inelastic","An energy regulator, staffed largely by former industry executives, consistently approves price rises requested by the firms it oversees","A city introduces rent controls, and the supply of rental housing falls over time","A government subsidises solar panels, and more households install them"],"a":1,"e":"监管俘获 (regulatory capture) 指监管机构逐渐服务于被监管行业而非公众利益，选项 B 正是如此。选项 A 只是需求缺乏弹性，税收仍可能有效；选项 C 是政府失灵中的“意外后果” (unintended consequences)，不是监管俘获；选项 D 是政策按预期起作用。","e_en":"Regulatory capture occurs when a regulator comes to serve the regulated industry rather than the public interest, which is exactly option B. Option A simply reflects inelastic demand, and the tax may still be effective; option C is government failure through unintended consequences, not regulatory capture; option D is a policy working as intended."},{"id":"m11-10","t":"m11","lv":3,"ex":["IEO","AL","AP"],"q":"A natural monopoly has total cost TC = 500 + 10Q and faces market demand P = 70 − Q. Which statement about regulation is correct?","o":["Marginal-cost pricing gives Q = 60 with a loss of $500; average-cost pricing gives Q = 50 at P = $20","Marginal-cost pricing gives Q = 30 at P = $40 with zero profit; average-cost pricing gives Q = 60","Marginal-cost pricing gives Q = 60 with zero profit; average-cost pricing gives Q = 10 at P = $60","Marginal-cost pricing gives Q = 50 with a loss of $500; average-cost pricing gives Q = 60 at P = $10"],"a":0,"e":"MC = 10。边际成本定价：70 − Q = 10 ⇒ Q = 60，P = 10，TR = 600，TC = 500 + 600 = 1,100，亏损 500（恰为固定成本），需补贴。平均成本定价：70 − Q = 10 + 500/Q ⇒ Q² − 60Q + 500 = 0 ⇒ Q = 50 或 10，取较大根 Q = 50，P = 20（AC = 10 + 10 = 20）。Q = 30、P = 40 是不受管制的利润最大化 (MR = 70 − 2Q = 10)；Q = 10 是较小的根，监管者会选择产量更大的那个。","e_en":"MC = 10. Marginal-cost pricing: 70 − Q = 10 ⇒ Q = 60, P = 10, TR = 600, TC = 500 + 600 = 1,100, a loss of 500 (exactly the fixed cost), which requires a subsidy. Average-cost pricing: 70 − Q = 10 + 500/Q ⇒ Q² − 60Q + 500 = 0 ⇒ Q = 50 or 10; take the larger root Q = 50, P = 20 (AC = 10 + 10 = 20). Q = 30, P = 40 is unregulated profit maximisation (MR = 70 − 2Q = 10); Q = 10 is the smaller root, and a regulator would choose the larger output."},{"id":"M8-01","t":"M8","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which pair of macroeconomic objectives is most likely to conflict in the short run when a government uses expansionary demand-side policy?","o":["Low inflation and a stable exchange rate","Economic growth and low unemployment","Low unemployment and low inflation","Higher tax revenue and economic growth"],"a":2,"e":"扩张需求政策使 AD 右移，产出增加、失业下降，但价格水平上升——这就是短期菲利普斯曲线 (short-run Phillips curve) 反映的失业与通胀的权衡。增长与低失业通常是互补的（奥肯定律 Okun's law）；增长通常也会增加税收，两者一致。","e_en":"Expansionary demand policy shifts AD to the right: output rises and unemployment falls, but the price level rises — the unemployment–inflation trade-off shown by the short-run Phillips curve. Growth and low unemployment usually go together (Okun's law); growth also usually raises tax revenue, so those are consistent."},{"id":"M8-02","t":"M8","lv":1,"ex":["IB","AL","NEC"],"q":"Which of the following is a market-based (rather than interventionist) supply-side policy?","o":["Government funding for vocational training colleges","Public investment in high-speed rail","Subsidies for research in renewable energy","Reducing the top marginal rate of income tax"],"a":3,"e":"降低最高边际所得税率通过增强工作和创业激励提高 LRAS，属于市场导向型 (market-based) 供给侧政策。职业培训、公共基础设施和研发补贴都需要政府直接投入，属于干预型 (interventionist) 供给侧政策——它们同样是供给侧政策，但不是市场导向型。","e_en":"Cutting the top marginal income tax rate raises LRAS by strengthening incentives to work and start businesses, so it is a market-based supply-side policy. Vocational training, public infrastructure and research subsidies all require direct government spending and are interventionist supply-side policies — still supply-side, but not market-based."},{"id":"M8-03","t":"M8","lv":2,"ex":["AL","IB","IEO"],"q":"Firms in an economy keep a fixed capital–output ratio of 3. Real output is 100 in year 1, 110 in year 2 and 115 in year 3. According to the accelerator principle, net investment in year 3 compared with year 2:","o":["Falls from 30 to 15","Rises from 30 to 45","Rises from 330 to 345","Stays at 30 because output is still growing"],"a":0,"e":"加速数原理 (accelerator)：I_net = v × ΔY。第 2 年：3 × (110 − 100) = 30；第 3 年：3 × (115 − 110) = 15。产出仍在增长，但增速放缓，净投资减半。330 和 345 是把 v 乘以产出水平（所需资本存量），而不是产出变化量。","e_en":"Accelerator: I_net = v × ΔY. Year 2: 3 × (110 − 100) = 30; year 3: 3 × (115 − 110) = 15. Output is still growing, but growth has slowed, so net investment halves. 330 and 345 multiply v by the level of output (the required capital stock) rather than the change in output."},{"id":"M8-04","t":"M8","lv":2,"ex":["AL","IB","AP","NEC"],"q":"A country with balanced trade lets its currency depreciate. The price elasticity of demand for its exports is −0.4 and for its imports is −0.5. Other things equal, the depreciation will most likely:","o":["Improve the current account because exports become cheaper abroad","Worsen the current account because the Marshall–Lerner condition is not met","Leave the current account unchanged because the elasticities cancel out","Improve the current account because the sum of the elasticities is negative"],"a":1,"e":"马歇尔–勒纳条件 (Marshall–Lerner condition)：|PEDx| + |PEDm| > 1 时贬值才能改善经常账户。此处 0.4 + 0.5 = 0.9 < 1，进口量下降不足以抵消进口本币价格上涨，出口量增幅也有限，差额恶化。选项 A 只看到了价格效应的一半；弹性之和应取绝对值比较。","e_en":"Marshall–Lerner condition: a depreciation improves the current account only if |PEDx| + |PEDm| > 1. Here 0.4 + 0.5 = 0.9 < 1, so the fall in import volume does not offset the higher domestic-currency price of imports and export volumes rise only a little; the balance worsens. Option A sees only half of the price effect; the elasticities should be compared in absolute value."},{"id":"M8-05","t":"M8","lv":3,"ex":["IEO","AL"],"q":"Initially a country's exports and imports are both 100 (in domestic currency). Its currency then depreciates by 10%. Domestic-currency export prices are unchanged and export volume rises by 8%; the domestic-currency price of imports rises by 10% and import volume falls by 6%. What is the new trade balance in domestic currency?","o":["−2.0","+14.0","−4.6","+4.6"],"a":3,"e":"出口收入 = 100 × 1.08 = 108（本币价格不变）。进口支出 = 100 × 1.10 × 0.94 = 103.4。差额 = 108 − 103.4 = +4.6，改善。隐含弹性 PEDx = 0.8、PEDm = 0.6，和为 1.4 > 1，符合马歇尔–勒纳条件。+14.0 是忽略了进口价格上涨 (8 + 6)；−2.0 是只算进口价格上涨 (108 − 110) 而忽略进口量下降；−4.6 符号错误。","e_en":"Export revenue = 100 × 1.08 = 108 (domestic-currency price unchanged). Import spending = 100 × 1.10 × 0.94 = 103.4. Balance = 108 − 103.4 = +4.6, an improvement. The implied elasticities are PEDx = 0.8 and PEDm = 0.6, summing to 1.4 > 1, consistent with the Marshall–Lerner condition. +14.0 ignores the rise in import prices (8 + 6); −2.0 includes the import price rise (108 − 110) but ignores the fall in import volume; −4.6 has the wrong sign."},{"id":"M8-06","t":"M8","lv":1,"ex":["AP","IB","AL","NEC"],"q":"According to the quantity theory of money (MV = PY), if the money supply grows by 5% a year, velocity is constant and real output grows by 2% a year, the inflation rate will be approximately:","o":["7%","5%","3%","2.5%"],"a":2,"e":"由 MV = PY 得 %ΔP ≈ %ΔM + %ΔV − %ΔY = 5% + 0 − 2% = 3%（精确值 1.05 ÷ 1.02 − 1 ≈ 2.94%）。7% 是把实际增长错误地相加；5% 忽略了实际产出增长吸收的货币；2.5% 是把两者相除。","e_en":"From MV = PY, %ΔP ≈ %ΔM + %ΔV − %ΔY = 5% + 0 − 2% = 3% (exactly 1.05 ÷ 1.02 − 1 ≈ 2.94%). 7% wrongly adds real growth; 5% ignores the money absorbed by real output growth; 2.5% divides the two figures."},{"id":"M8-07","t":"M8","lv":2,"ex":["AL","IB","NEC"],"q":"Which of the following is an expenditure-switching policy for reducing a current-account deficit?","o":["Imposing a tariff on imported consumer goods","Raising income tax rates","Increasing the central bank's policy interest rate to reduce consumption","Cutting government spending on public-sector wages"],"a":0,"e":"关税改变进口品与国产品的相对价格，使支出从进口转向国内生产，属于支出转换政策 (expenditure-switching)。提高所得税、加息抑制消费、削减政府支出都通过降低总需求和收入来减少进口，属于支出减少政策 (expenditure-reducing)。注意加息还会推高汇率，反而不利于转换。","e_en":"A tariff changes the relative price of imports and domestic goods, switching spending from imports to domestic output — an expenditure-switching policy. Raising income tax, raising interest rates to curb consumption and cutting government spending all reduce imports by lowering aggregate demand and income — expenditure-reducing policies. Note that higher interest rates also push the exchange rate up, which works against switching."},{"id":"M8-08","t":"M8","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy is producing at its full-employment level of output. The government increases spending financed by borrowing. According to the classical/monetarist view, the long-run effect is:","o":["A permanent increase in real GDP with no change in the price level","A permanent fall in unemployment below the natural rate","An increase in real GDP and a fall in the price level","A higher price level with real GDP returning to its full-employment level"],"a":3,"e":"古典/货币学派认为 LRAS 在潜在产出处垂直。AD 右移在短期可能提高产出，但名义工资随后上调，SRAS 左移，长期产出回到充分就业水平，只留下更高的价格水平；借款还可能挤出 (crowd out) 私人投资。选项 A 描述的是凯恩斯 AS 的水平段；失业长期不能低于自然失业率；价格下降需要 AS 右移而非 AD 右移。","e_en":"The classical/monetarist view holds that LRAS is vertical at potential output. The rightward AD shift may raise output in the short run, but nominal wages then adjust upward, SRAS shifts left, and in the long run output returns to full employment with only a higher price level; borrowing may also crowd out private investment. Option A describes the horizontal section of Keynesian AS; unemployment cannot stay below the natural rate in the long run; a lower price level would require AS, not AD, to shift right."},{"id":"M8-09","t":"M8","lv":3,"ex":["IEO","AL"],"q":"In an open economy, MPS = 0.15, MPT = 0.10 and MPM = 0.25. The government wants to cut imports by 20 using only a reduction in government spending (expenditure-reducing policy). Assuming the full multiplier effect, what cut in G is required, and by how much does GDP fall?","o":["Cut G by 20; GDP falls by 40","Cut G by 40; GDP falls by 80","Cut G by 80; GDP falls by 160","Cut G by 10; GDP falls by 20"],"a":1,"e":"开放经济乘数 k = 1 ÷ (0.15 + 0.10 + 0.25) = 2。进口减少 ΔM = MPM × ΔY ⇒ 20 = 0.25 × ΔY ⇒ ΔY = −80。所需 ΔG = −80 ÷ 2 = −40。可见支出减少政策代价很高：为减少 20 的进口，GDP 要下降 80。选项 A 把 ΔG 直接等于进口减少量；选项 C 把所需 GDP 下降当成 ΔG。","e_en":"Open-economy multiplier k = 1 ÷ (0.15 + 0.10 + 0.25) = 2. Fall in imports ΔM = MPM × ΔY ⇒ 20 = 0.25 × ΔY ⇒ ΔY = −80. Required ΔG = −80 ÷ 2 = −40. Expenditure-reducing policy is costly: to cut imports by 20, GDP must fall by 80. Option A sets ΔG equal to the target cut in imports; option C treats the required fall in GDP as ΔG."},{"id":"M8-10","t":"M8","lv":3,"ex":["IEO","AL","IB"],"q":"Nominal interest rates are close to zero and households and banks are willing to hold any additional money created. A Keynesian economist would most likely argue that in this situation:","o":["An increase in the money supply will raise inflation one-for-one, as the quantity theory predicts","Supply-side policies will be ineffective because LRAS is horizontal","Monetary expansion will be largely ineffective because velocity falls, so fiscal policy should be used","Fiscal policy will cause complete crowding out because interest rates rise sharply"],"a":2,"e":"这是流动性陷阱 (liquidity trap)：货币需求对利率无限敏感，新增货币被持有而不被花掉，货币流通速度 V 下降，利率无法再降，货币政策失效；凯恩斯学派主张用财政政策，且此时利率不会上升，挤出效应很小。选项 A 是货币数量论在 V 稳定假设下的结论，恰与流动性陷阱相反；选项 D 把挤出效应的方向说反了。","e_en":"This is a liquidity trap: money demand is infinitely sensitive to the interest rate, extra money is held rather than spent, velocity V falls and interest rates cannot fall further, so monetary policy is ineffective; Keynesians recommend fiscal policy, and since interest rates do not rise, crowding out is small. Option A is the quantity-theory conclusion under stable V, the opposite of a liquidity trap; option D gets the crowding-out effect backwards."},{"id":"M9-01","t":"M9","lv":1,"ex":["IB","AL","NEC"],"q":"Which statement best distinguishes economic development from economic growth?","o":["Development is measured by nominal GDP, while growth is measured by real GDP","Development refers to broad improvements in well-being such as health, education and choice, whereas growth is an increase in real output","Development only occurs in low-income countries, while growth only occurs in high-income countries","Development is the long-run trend of growth, so the two always move together"],"a":1,"e":"正确：经济增长 (economic growth) 是实际产出增加；经济发展 (economic development) 是生活质量、健康、教育、自由选择等多维改善。A 混淆了名义与实际；C 错，任何国家都可以发展；D 错，增长不一定带来发展（如收入集中、环境恶化），这是最诱人的干扰项。","e_en":"Correct: economic growth is an increase in real output; economic development is a multidimensional improvement in quality of life, health, education and freedom of choice. A confuses nominal and real; C is wrong because any country can develop; D is wrong because growth need not bring development (e.g. concentrated income or environmental damage) — this is the most tempting distractor."},{"id":"M9-02","t":"M9","lv":2,"ex":["IB","AL","IEO"],"q":"A country's HDI dimension indices are: health 0.80, education 0.60 and income 0.70. What is its HDI (to 3 decimal places)?","o":["0.700","0.336","0.695","0.600"],"a":2,"e":"HDI 是三个维度指数的几何平均 (geometric mean)：(0.80 × 0.60 × 0.70)^(1/3) = 0.336^(1/3) ≈ 0.695。0.700 是算术平均（旧方法），0.336 是忘了开立方，0.600 只取最低维度。几何平均略低于算术平均，因为它惩罚维度间的不均衡。","e_en":"The HDI is the geometric mean of the three dimension indices: (0.80 × 0.60 × 0.70)^(1/3) = 0.336^(1/3) ≈ 0.695. 0.700 is the arithmetic mean (the old method), 0.336 forgets to take the cube root, and 0.600 just takes the lowest dimension. The geometric mean is slightly below the arithmetic mean because it penalises imbalance between dimensions."},{"id":"M9-03","t":"M9","lv":2,"ex":["IB","AL"],"q":"Using UNDP goalposts (life expectancy 20–85 years; mean years of schooling 0–15; expected years of schooling 0–18), calculate the health index and the education index for a country with life expectancy of 72 years, mean years of schooling of 9 and expected years of schooling of 15.","o":["Health 0.800; education 0.717","Health 0.847; education 0.717","Health 0.800; education 0.800","Health 0.847; education 0.667"],"a":0,"e":"健康指数 = (72 − 20) ÷ (85 − 20) = 52 ÷ 65 = 0.800。教育指数 = ½(9/15 + 15/18) = ½(0.600 + 0.833) ≈ 0.717。0.847 = 72 ÷ 85，忘了减去最小值 20；教育 0.800 是把 24 年除以 30（把两项直接相加再除以上限之和），方法错误。","e_en":"Health index = (72 − 20) ÷ (85 − 20) = 52 ÷ 65 = 0.800. Education index = ½(9/15 + 15/18) = ½(0.600 + 0.833) ≈ 0.717. 0.847 = 72 ÷ 85, forgetting to subtract the minimum of 20; an education figure of 0.800 comes from dividing 24 years by 30 (adding the two components and dividing by the sum of the maxima), which is the wrong method."},{"id":"M9-04","t":"M9","lv":1,"ex":["IB","AL","NEC"],"q":"Why do economists usually compare GNI per capita across countries at purchasing power parity (PPP) rather than at market exchange rates?","o":["Market exchange rates are fixed by governments and never change","PPP conversion removes the effect of income inequality within each country","PPP figures include the value of environmental damage","Non-traded goods and services tend to be cheaper in low-income countries, so market exchange rates understate their real purchasing power"],"a":3,"e":"正确：理发、房租、本地食品等非贸易品 (non-traded goods) 在低收入国家更便宜，按市场汇率换算会低估其实际生活水平；PPP 用同一篮子商品的价格来换算。PPP 并不处理国内分配（B）或环境（C）；多数汇率是浮动的（A）。","e_en":"Correct: non-traded goods such as haircuts, rent and local food are cheaper in low-income countries, so conversion at market exchange rates understates their real living standards; PPP converts using the price of the same basket of goods. PPP does not deal with domestic distribution (B) or the environment (C); most exchange rates float (A)."},{"id":"M9-05","t":"M9","lv":2,"ex":["IB","IEO","AL"],"q":"The daily incomes (in 2021 PPP dollars) of the 10 residents of a village are listed below. Using an absolute poverty line of $3.00 a day (a person is poor if income is strictly below the line) and a relative poverty line of 50% of median income, what are the absolute and relative poverty headcount ratios?","tbl":[["Resident","Income ($/day)"],["1","1.2"],["2","2.0"],["3","2.5"],["4","2.9"],["5","3.0"],["6","4.5"],["7","6.0"],["8","8.0"],["9","10.0"],["10","22.0"]],"o":["Absolute 40%; relative 10%","Absolute 50%; relative 10%","Absolute 40%; relative 20%","Absolute 30%; relative 10%"],"a":0,"e":"绝对贫困：低于 $3.00 的有 1.2、2.0、2.5、2.9 共 4 人 → 40%（$3.00 恰好等于线，不算贫困，选 50% 是误算）。相对贫困：中位数 = (3.0 + 4.5) ÷ 2 = 3.75，相对贫困线 = 1.875，只有 1.2 低于它 → 10%。若误把 2.0 也算入则得 20%。","e_en":"Absolute poverty: 1.2, 2.0, 2.5 and 2.9 are below $3.00, i.e. 4 people → 40% ($3.00 exactly equals the line and is not poor; choosing 50% is a miscount). Relative poverty: median = (3.0 + 4.5) ÷ 2 = 3.75, so the relative line = 1.875 and only 1.2 is below it → 10%. Wrongly counting 2.0 as well gives 20%."},{"id":"M9-06","t":"M9","lv":3,"ex":["IEO","IB","AL"],"q":"In a country, the poorest 60% of the population receive 25% of total income, and income is distributed equally within each of the two groups (poorest 60% and richest 40%). The Lorenz curve therefore consists of two straight segments. What is the Gini coefficient?","o":["0.325","0.35","0.65","0.175"],"a":1,"e":"洛伦兹曲线经过 (0,0)、(0.6,0.25)、(1,1)。曲线下面积 B = ½ × 0.6 × 0.25 + ½ × 0.4 × (0.25 + 1) = 0.075 + 0.25 = 0.325。G = 1 − 2B = 1 − 0.65 = 0.35。0.325 是 B 本身，0.65 是 2B，0.175 是 A 的面积（0.5 − 0.325），都忘了除以三角形总面积 0.5。对两段式洛伦兹曲线，G 恰等于人口比例与收入比例之差 0.60 − 0.25。","e_en":"The Lorenz curve passes through (0,0), (0.6,0.25) and (1,1). Area under it B = ½ × 0.6 × 0.25 + ½ × 0.4 × (0.25 + 1) = 0.075 + 0.25 = 0.325. G = 1 − 2B = 1 − 0.65 = 0.35. 0.325 is B itself, 0.65 is 2B, and 0.175 is area A (0.5 − 0.325) — all forget to divide by the total triangle area of 0.5. For a two-segment Lorenz curve, G equals exactly the population share minus the income share, 0.60 − 0.25."},{"id":"M9-07","t":"M9","lv":1,"ex":["IB","AL","NEC"],"q":"A low-income country earns 80% of its export revenue from coffee. Which is the most likely development problem arising from this?","o":["Its imports will automatically fall whenever coffee prices fall, keeping the current account balanced","It will have a comparative advantage in high-technology manufacturing","Its export earnings and government revenue will be volatile because world commodity prices fluctuate sharply","Its terms of trade will necessarily improve over time as world income rises"],"a":2,"e":"初级产品依赖 (primary-product dependence)：咖啡等商品需求和供给都缺乏弹性，价格波动大，出口收入和税收随之剧烈波动，难以规划投资。普雷维什–辛格假说认为初级产品贸易条件长期趋于恶化，而非必然改善（D 错）；进口不会自动调整（A 错）。","e_en":"Primary-product dependence: demand for and supply of commodities such as coffee are price-inelastic, so prices swing sharply and export earnings and tax revenue fluctuate with them, making investment hard to plan. The Prebisch–Singer hypothesis suggests the terms of trade for primary products tend to deteriorate in the long run rather than necessarily improve (D is wrong); imports do not adjust automatically (A is wrong)."},{"id":"M9-08","t":"M9","lv":2,"ex":["IB","AL","IEO"],"q":"Which of the following is the main economic rationale for microfinance schemes in developing countries?","o":["They allow governments to finance budget deficits without raising taxes","They guarantee that borrowers' incomes rise above the international poverty line","They replace the need for investment in infrastructure and education","Poor households lack collateral and credit histories, so formal banks will not lend to them; group lending and small loans reduce information and enforcement problems"],"a":3,"e":"小额信贷 (microfinance) 针对信贷市场失灵：穷人没有抵押品 (collateral)，银行面临信息不对称和高交易成本而不放贷；小组连带责任 (group lending) 以同伴监督替代抵押。它不能保证脱贫（B），也不能替代基础设施和教育（C）；A 与小额信贷无关。","e_en":"Microfinance addresses a credit-market failure: the poor have no collateral, and banks face asymmetric information and high transaction costs, so they do not lend; group lending with joint liability substitutes peer monitoring for collateral. It cannot guarantee an escape from poverty (B) and does not replace infrastructure and education (C); A is unrelated to microfinance."},{"id":"M9-09","t":"M9","lv":3,"ex":["IEO","AL"],"q":"In the Harrod–Domar model, a country has a saving rate of 12% of GDP, a capital–output ratio of 4 and population growth of 2.5% a year. The government wants per-capita income to grow at 2% a year. If foreign capital (aid or FDI) fills any saving gap, how large must the inflow be as a share of GDP?","o":["2% of GDP","6% of GDP","8% of GDP","18% of GDP"],"a":1,"e":"g = s ÷ v。当前 g = 12% ÷ 4 = 3%，人均增长 = 3% − 2.5% = 0.5%。目标人均 2% → 需要 GDP 增长 4.5% → 所需投资率 s = 4.5% × 4 = 18%。储蓄缺口 = 18% − 12% = 6% of GDP。18% 是所需总投资率，而非缺口；2% 混淆了增长率与资本流入；8% 忽略了现有储蓄中的一部分。","e_en":"g = s ÷ v. Currently g = 12% ÷ 4 = 3%, so per-capita growth = 3% − 2.5% = 0.5%. A per-capita target of 2% requires GDP growth of 4.5%, so the required investment rate s = 4.5% × 4 = 18%. Saving gap = 18% − 12% = 6% of GDP. 18% is the total investment rate required, not the gap; 2% confuses a growth rate with a capital inflow; 8% ignores part of existing saving."},{"id":"M9-10","t":"M9","lv":2,"ex":["IB","IEO"],"q":"Country P has an HDI of 0.750 and an IHDI of 0.600. Country Q has an HDI of 0.720 and an IHDI of 0.660. Which conclusion is correct?","o":["P loses 20% of its HDI to inequality, more than Q, whose loss is about 8.3%","P has less inequality than Q because its HDI is higher","Both countries lose the same amount to inequality because the absolute gaps are similar","Q loses 20% of its HDI to inequality, more than P"],"a":0,"e":"损失% = 1 − IHDI ÷ HDI。P：1 − 0.600/0.750 = 20%；Q：1 − 0.660/0.720 ≈ 8.3%。P 的平均发展水平更高但不平等更严重，考虑不平等后 Q 的 IHDI (0.660) 反而高于 P (0.600)。HDI 高不代表不平等低（B 错）；绝对差距 0.15 vs 0.06 并不相似（C 错）。","e_en":"Loss% = 1 − IHDI ÷ HDI. P: 1 − 0.600/0.750 = 20%; Q: 1 − 0.660/0.720 ≈ 8.3%. P has a higher average level of development but more inequality, so once inequality is accounted for Q's IHDI (0.660) is actually higher than P's (0.600). A higher HDI does not imply lower inequality (B is wrong); the absolute gaps of 0.15 and 0.06 are not similar (C is wrong)."},{"id":"M10-01","t":"M10","lv":1,"ex":["AP","IB","NEC"],"q":"A small country imposes a tariff on imported steel. Compared with free trade, which combination of effects is expected in the domestic steel market?","o":["Domestic price falls; domestic production rises; consumer surplus rises","Domestic price unchanged; imports fall; producer surplus falls","Domestic price rises; domestic production falls; imports rise","Domestic price rises; domestic production rises; consumer surplus falls"],"a":3,"e":"小国征收关税，国内价格从 P_w 升至 P_w + t：国内供给量增加（生产者剩余增加），需求量减少（消费者剩余减少），进口减少。C 把进口方向搞反；B 忽略了价格上升。","e_en":"When a small country imposes a tariff, the domestic price rises from P_w to P_w + t: domestic quantity supplied rises (producer surplus rises), quantity demanded falls (consumer surplus falls) and imports fall. C gets the direction of imports wrong; B ignores the price rise."},{"id":"M10-02","t":"M10","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In a small open economy, domestic demand for a good is Qd = 120 − 10P and domestic supply is Qs = 10P − 20. The world price is $4. The government imposes a tariff of $1 per unit. How much tariff revenue is collected?","o":["$60","$30","$40","$70"],"a":2,"e":"征税后国内价格 = 4 + 1 = 5：Qd = 120 − 50 = 70，Qs = 50 − 20 = 30，进口 = 40。关税收入 = 1 × 40 = $40。$60 用的是征税前进口量 (80 − 20)；$70 是需求量；$30 是国内供给量。","e_en":"After the tariff the domestic price = 4 + 1 = 5: Qd = 120 − 50 = 70, Qs = 50 − 20 = 30, so imports = 40. Tariff revenue = 1 × 40 = $40. $60 uses pre-tariff imports (80 − 20); $70 is quantity demanded; $30 is domestic quantity supplied."},{"id":"M10-03","t":"M10","lv":3,"ex":["IEO","AL","AP"],"q":"Using the same market (Qd = 120 − 10P, Qs = 10P − 20, world price $4, tariff $1 per unit), what is the net welfare loss to the country from the tariff, and how much of the consumer surplus loss is transferred to domestic producers?","o":["Net loss $10; transfer to producers $25","Net loss $75; transfer to producers $25","Net loss $50; transfer to producers $30","Net loss $20; transfer to producers $40"],"a":0,"e":"自由贸易：Qd = 80，Qs = 20；征税后：Qd = 70，Qs = 30。ΔCS = −(80 + 70)/2 × 1 = −75；ΔPS = (20 + 30)/2 × 1 = +25；关税收入 = 40；DWL = ½×1×10 + ½×1×10 = 10。净损失 = 75 − 25 − 40 = 10。$75 是消费者剩余总损失，不是净损失；$50 = 75 − 25，忘记了关税收入也是本国收益。","e_en":"Free trade: Qd = 80, Qs = 20; with the tariff: Qd = 70, Qs = 30. ΔCS = −(80 + 70)/2 × 1 = −75; ΔPS = (20 + 30)/2 × 1 = +25; tariff revenue = 40; DWL = ½×1×10 + ½×1×10 = 10. Net loss = 75 − 25 − 40 = 10. $75 is the total loss of consumer surplus, not the net loss; $50 = 75 − 25 forgets that tariff revenue is also a domestic gain."},{"id":"M10-04","t":"M10","lv":2,"ex":["IB","AL"],"q":"Between 2024 and 2025 a country's export price index rose from 100 to 110 and its import price index rose from 100 to 125. What happened to its terms of trade?","o":["They improved to 113.6","They deteriorated to 88.0","They deteriorated to 85.0","They improved to 115.0"],"a":1,"e":"ToT = 出口价格指数 ÷ 进口价格指数 × 100 = 110 ÷ 125 × 100 = 88.0，较基期 100 恶化 12%。113.6 是把分子分母倒置 (125/110)；85 是 110 − 25 的错误减法。","e_en":"ToT = export price index ÷ import price index × 100 = 110 ÷ 125 × 100 = 88.0, a 12% deterioration from the base of 100. 113.6 inverts the ratio (125/110); 85 is the wrong subtraction 110 − 25."},{"id":"M10-05","t":"M10","lv":1,"ex":["IB","AL","NEC"],"q":"Which feature distinguishes a customs union from a free trade area?","o":["Members remove tariffs on trade with each other","Members share a single currency","Members adopt a common external tariff on imports from non-members","Workers and capital can move freely between members"],"a":2,"e":"关税同盟 (customs union) = 自由贸易区 + 统一对外关税 (common external tariff)。成员间取消关税是两者共有特征（A）；要素自由流动属于共同市场（D）；统一货币属于经济与货币联盟（B）。","e_en":"A customs union = a free trade area + a common external tariff. Removing tariffs between members is shared by both (A); free movement of factors belongs to a common market (D); a single currency belongs to an economic and monetary union (B)."},{"id":"M10-06","t":"M10","lv":2,"ex":["IB","AL","IEO"],"q":"Country A imposes a 20% tariff on all imports of a good. Country C (a non-member) can supply it at $100 and Country B at $110. A then forms a free trade area with B, keeping the 20% tariff on C. Which statement is correct for each unit A imports?","o":["This is trade creation: world resources are saved because A now imports from the cheapest producer","The consumer price rises from $110 to $120 and A's welfare unambiguously falls","Nothing changes, because C remains the lowest-cost producer","This is trade diversion: the consumer price falls from $120 to $110, A loses $20 of tariff revenue, and the world uses $10 more resources"],"a":3,"e":"FTA 前：从 C 进口含税价 100 × 1.2 = 120，B 含税价 132，故从 C 进口。FTA 后：B 免税 110 < 120，进口转向 B。消费者每单位省 10，政府损失关税 20，A 每单位净损失 10，且进口来源由最低成本的 C 转向较高成本的 B（多耗资源 10）——贸易转移 (trade diversion)。A 错，B 不是最便宜的生产者；B 选项把价格方向搞反。","e_en":"Before the FTA: importing from C costs 100 × 1.2 = 120 with the tariff, versus 132 from B, so A imports from C. After the FTA: B is tariff-free at 110 < 120, so imports switch to B. Consumers save 10 per unit, the government loses 20 of tariff revenue, so A loses 10 net per unit, and the source switches from the lowest-cost producer C to the higher-cost producer B (10 more resources used) — trade diversion. A is wrong because B is not the cheapest producer; option B gets the price direction wrong."},{"id":"M10-07","t":"M10","lv":2,"ex":["IB","AL","NEC","AP"],"q":"An import quota and a tariff are set so that they result in the same domestic price and quantity of imports. Why might the quota be more costly to the importing country?","o":["The revenue that a tariff would raise may instead go as quota rent to foreign exporters or licence holders","A quota creates a larger consumption distortion than an equivalent tariff","A quota lowers the domestic price, harming domestic producers","A quota increases the volume of imports compared with a tariff"],"a":0,"e":"在价格和数量相同时，两者的两个 DWL 三角形相同；区别在于关税收入的去向：配额下变成配额租金 (quota rent)，若许可证由外国出口商持有，这部分就流出本国，本国损失更大。B 错，消费扭曲相同；C、D 与设定矛盾。","e_en":"With the same price and quantity, the two DWL triangles are identical; the difference is where the tariff revenue goes: under a quota it becomes quota rent, and if the licences are held by foreign exporters it leaves the country, so the home loss is larger. B is wrong because the consumption distortion is the same; C and D contradict the set-up."},{"id":"M10-08","t":"M10","lv":3,"ex":["IEO","AL"],"q":"A small country exports a good. Domestic demand is Qd = 100 − 5P and domestic supply is Qs = 10P − 40; the world price is $10. The government introduces an export subsidy of $2 per unit exported. What is the fiscal cost of the subsidy and the country's net welfare loss?","o":["Cost $20; net loss $10","Cost $80; net loss $0","Cost $80; net loss $30","Cost $140; net loss $50"],"a":2,"e":"补贴前 P = 10：Qs = 60，Qd = 50，出口 10。补贴后国内价格升至 12（出口商在国外实得 12，国内售价必须相同）：Qs = 80，Qd = 40，出口 40。财政成本 = 2 × 40 = 80。ΔPS = (60 + 80)/2 × 2 = +140；ΔCS = −(50 + 40)/2 × 2 = −90。净福利 = 140 − 90 − 80 = −30，即 DWL = ½×2×20 + ½×2×10 = 30。$20 用的是补贴前出口量；$140 是生产者剩余增加。","e_en":"Before the subsidy, P = 10: Qs = 60, Qd = 50, exports 10. With the subsidy the domestic price rises to 12 (exporters effectively receive 12 abroad, so domestic sales must match): Qs = 80, Qd = 40, exports 40. Fiscal cost = 2 × 40 = 80. ΔPS = (60 + 80)/2 × 2 = +140; ΔCS = −(50 + 40)/2 × 2 = −90. Net welfare = 140 − 90 − 80 = −30, i.e. DWL = ½×2×20 + ½×2×10 = 30. $20 uses pre-subsidy exports; $140 is the gain in producer surplus."},{"id":"M10-09","t":"M10","lv":1,"ex":["IB","AL","NEC"],"q":"Under the WTO's most-favoured-nation (MFN) principle, a member that cuts its tariff on imports from one WTO member must generally:","o":["Raise tariffs on imports from all other members to compensate","Extend the same tariff cut to imports from all other WTO members","Obtain approval from the IMF before the tariff cut takes effect","Apply the cut only to imports from developing countries"],"a":1,"e":"最惠国待遇 (MFN) 是 WTO 的非歧视原则：给予一个成员的优惠须无条件给予所有成员。例外包括自由贸易区、关税同盟和对发展中国家的普惠制 (GSP)，所以 D 是例外而非一般规则；IMF 与关税审批无关。","e_en":"Most-favoured-nation (MFN) treatment is the WTO's principle of non-discrimination: a concession granted to one member must be extended unconditionally to all members. Exceptions include free trade areas, customs unions and the Generalised System of Preferences (GSP) for developing countries, so D is an exception rather than the general rule; the IMF plays no role in approving tariffs."},{"id":"M10-10","t":"M10","lv":3,"ex":["IEO","AL"],"q":"Under free trade a car sells for $10,000, of which $6,000 is imported components. The country imposes a 20% tariff on imported cars and a 5% tariff on imported components. What is the effective rate of protection for domestic car assembly?","o":["20%","15%","17%","42.5%"],"a":3,"e":"有效保护率 (ERP) = (t_f − a·t_i) ÷ (1 − a)，a = 6000/10000 = 0.6。ERP = (0.20 − 0.6 × 0.05) ÷ 0.4 = 0.17 ÷ 0.4 = 42.5%。验证：自由贸易增加值 = 4,000；征税后成品价 12,000，零件 6,300，增加值 5,700，增幅 42.5%。20% 是名义关税率；17% 忘了除以 (1 − a)；15% 是 20% − 5%。","e_en":"Effective rate of protection (ERP) = (t_f − a·t_i) ÷ (1 − a), with a = 6000/10000 = 0.6. ERP = (0.20 − 0.6 × 0.05) ÷ 0.4 = 0.17 ÷ 0.4 = 42.5%. Check: free-trade value added = 4,000; with the tariffs the car sells for 12,000 and components cost 6,300, so value added = 5,700, up 42.5%. 20% is the nominal tariff; 17% forgets to divide by (1 − a); 15% is 20% − 5%."},{"id":"F6-01","t":"F6","lv":1,"ex":["NEC","IEO"],"q":"Compared with a demand (current) deposit at the same bank, a one-year time deposit typically offers:","o":["A lower interest rate but instant access to the money","A higher interest rate but a penalty or reduced interest if withdrawn early","The same interest rate but no deposit insurance protection","A guaranteed return that rises with the stock market"],"a":1,"e":"定期存款 (time deposit) 让银行能在约定期限内稳定使用资金，因此利率更高；代价是流动性 (liquidity) 较差，提前支取一般只按活期利率计息或罚息。A 描述的是活期存款；C 错误，定期存款同样受存款保险保障；D 描述的是股票类产品，存款收益与股市无关。","e_en":"A time deposit lets the bank use the funds reliably for an agreed term, so it pays a higher rate; the cost is lower liquidity, and early withdrawal usually earns only the demand-deposit rate or incurs a penalty. A describes a demand deposit; C is wrong because time deposits are also covered by deposit insurance; D describes equity-type products — deposit returns are not linked to the stock market."},{"id":"F6-02","t":"F6","lv":2,"ex":["IEO"],"q":"In China, deposit insurance covers up to 500,000 yuan (principal plus interest) per depositor per insured bank. Ms. Wang holds the deposits below (all figures include accrued interest). If both banks fail on the same day, how much of her money is NOT covered by deposit insurance?","tbl":[["Bank","Account","Balance (yuan)"],["Bank A","Demand deposit","350,000"],["Bank A","Time deposit","300,000"],["Bank B","Time deposit","200,000"]],"o":["0 yuan","50,000 yuan","150,000 yuan","350,000 yuan"],"a":2,"e":"按“每人每行”分别计算，活期与定期合并：A 行合计 350,000 + 300,000 = 650,000 元，保障 500,000，未保障 150,000；B 行 200,000 < 500,000，全额保障。未保障合计 = **150,000 元**。选 0 的同学把 50 万误作“每个账户”分别计算；选 350,000 的同学把 50 万当成“每人总额”：850,000 − 500,000 = 350,000。","e_en":"Coverage is calculated per depositor per bank, with demand and time deposits added together: Bank A total = 350,000 + 300,000 = 650,000, of which 500,000 is covered, leaving 150,000 uncovered; Bank B's 200,000 < 500,000 is fully covered. Total uncovered = **150,000 yuan**. Choosing 0 wrongly applies the cap per account; choosing 350,000 wrongly treats the cap as per person in total: 850,000 − 500,000 = 350,000."},{"id":"F6-03","t":"F6","lv":2,"ex":["IEO","NEC"],"q":"A bank has 1,000 million yuan of deposits paying 1.5% interest. It holds 10% of deposits as reserves (earning nothing) and lends the rest at 4.5%. Ignoring costs and defaults, what is its annual net interest income?","o":["25.5 million yuan","30.0 million yuan","40.5 million yuan","45.0 million yuan"],"a":0,"e":"贷款 = 1,000 × (1 − 10%) = 900 百万元。利息收入 = 900 × 4.5% = 40.5；利息支出 = 1,000 × 1.5% = 15。净利息收入 = 40.5 − 15 = **25.5 百万元**。选 30.0 是把利差 3% 乘以全部存款（忽略了准备金不生息）；40.5 只算了利息收入；45.0 是把全部存款都按 4.5% 贷出。","e_en":"Loans = 1,000 × (1 − 10%) = 900 million. Interest income = 900 × 4.5% = 40.5; interest expense = 1,000 × 1.5% = 15. Net interest income = 40.5 − 15 = **25.5 million yuan**. 30.0 applies the 3% spread to all deposits (ignoring that reserves earn nothing); 40.5 counts only interest income; 45.0 assumes all deposits are lent at 4.5%."},{"id":"F6-04","t":"F6","lv":2,"ex":["IEO"],"q":"A driver can choose between two one-year policies. The probability of an accident this year is 20%; if it happens, the loss is 6,000 (at most one accident a year). Which statement is correct?","tbl":[["Policy","Premium","Deductible"],["A","1,200","500"],["B","800","2,000"]],"o":["Policy A is better for everyone because its deductible is lower","Policy B has the lower expected total cost: 1,300 vs 1,200 for Policy A","Both policies have the same expected total cost of 1,250","Policy B has the lower expected total cost (1,200 vs 1,300), but Policy A has the lower worst-case cost"],"a":3,"e":"期望总成本 = 保费 + 出险概率 × 自付。A：1,200 + 0.2 × 500 = 1,300；B：800 + 0.2 × 2,000 = 1,200。B 期望成本低 100。最坏情况（出险）：A = 1,200 + 500 = 1,700；B = 800 + 2,000 = 2,800，A 更低。风险中性者选 B，非常厌恶风险或现金紧张者可能选 A，所以 A “对所有人都更好”错误。选项 B 把两个数字对应反了。","e_en":"Expected total cost = premium + probability of accident × out-of-pocket cost. A: 1,200 + 0.2 × 500 = 1,300; B: 800 + 0.2 × 2,000 = 1,200, so B is 100 cheaper in expectation. Worst case (accident): A = 1,200 + 500 = 1,700; B = 800 + 2,000 = 2,800, so A is lower. A risk-neutral driver picks B, while a very risk-averse or cash-constrained driver might pick A, so \"A is better for everyone\" is wrong. Option B swaps the two numbers."},{"id":"F6-05","t":"F6","lv":3,"ex":["IEO"],"q":"A health insurance policy has a deductible of 1,000, a 20% co-payment on the amount above the deductible, and a coverage limit of 6,000 (the most the insurer will pay per year). A patient incurs one medical bill of 10,000 this year. How much does the patient pay out of pocket?","o":["1,000","2,800","4,000","7,200"],"a":2,"e":"先算未封顶时保险赔付：(10,000 − 1,000) × (1 − 20%) = 7,200；但保额上限为 6,000，所以保险只赔 **6,000**。患者自付 = 10,000 − 6,000 = **4,000**。选 2,800（= 1,000 + 20% × 9,000）忽略了保额上限；7,200 是未封顶的保险赔付额；1,000 只算了免赔额。","e_en":"First compute the uncapped insurer payment: (10,000 − 1,000) × (1 − 20%) = 7,200; but the coverage limit is 6,000, so the insurer pays only **6,000**. The patient pays 10,000 − 6,000 = **4,000**. 2,800 (= 1,000 + 20% × 9,000) ignores the coverage limit; 7,200 is the uncapped insurer payment; 1,000 counts only the deductible."},{"id":"F6-06","t":"F6","lv":2,"ex":["IEO","NEC","IB"],"q":"After buying full theft insurance for her bicycle, Lily stops bothering to lock it. Which concept does this illustrate, and which policy feature most directly reduces it?","o":["Moral hazard; a deductible so that she bears part of any loss","Adverse selection; requiring a medical examination before purchase","Moral hazard; lowering the premium for all customers","Adverse selection; a deductible so that she bears part of any loss"],"a":0,"e":"投保后因有保障而减少防范属于**道德风险 (moral hazard)**，即签约后的隐藏行为 (hidden action)。免赔额 (deductible) 让投保人承担部分损失，恢复其防范激励。逆向选择 (adverse selection) 是签约前的隐藏信息——高风险者更愿意投保，体检是应对逆向选择的工具；降低保费不能减少道德风险。","e_en":"Taking less care because one is insured is **moral hazard** — hidden action after the contract. A deductible makes the policyholder bear part of the loss, restoring her incentive to take care. Adverse selection is hidden information before the contract — high-risk people being keener to buy — and a medical examination is a tool against adverse selection; cutting the premium does nothing to reduce moral hazard."},{"id":"F6-07","t":"F6","lv":1,"ex":["NEC","IEO"],"q":"An online platform promises investors a \"guaranteed 3% return every month with zero risk\" and pays early investors on time, but cannot explain how the returns are generated. This is MOST likely:","o":["A time deposit protected by deposit insurance","An equity crowdfunding campaign","A legitimate index fund with low fees","A Ponzi scheme paying old investors with new investors' money"],"a":3,"e":"“保证高收益、零风险、说不清盈利来源”是**庞氏骗局 (Ponzi scheme)** 的典型红旗。每月 3% 相当于年化约 (1.03)^12 − 1 ≈ 42.6%，远超任何无风险利率，违背风险—收益权衡。早期投资者按时拿到钱正是骗局吸引新资金的手段。定期存款利率远低于此；股权众筹和指数基金都不承诺保本收益。","e_en":"\"Guaranteed high returns, zero risk and no explanation of where profits come from\" are classic red flags of a **Ponzi scheme**. 3% a month is about (1.03)^12 − 1 ≈ 42.6% a year, far above any risk-free rate, violating the risk–return trade-off. Paying early investors on time is exactly how the scheme attracts new money. Time deposits pay far less; equity crowdfunding and index funds never promise guaranteed returns."},{"id":"F6-08","t":"F6","lv":1,"ex":["IEO"],"q":"Backers of a start-up on a crowdfunding platform receive a small ownership stake in the company in return for their money. This is:","o":["Reward-based crowdfunding","Equity crowdfunding","Donation-based crowdfunding","Debt (peer-to-peer) crowdfunding"],"a":1,"e":"出资换取公司股份 (ownership stake) 是**股权众筹 (equity crowdfunding)**，回报取决于公司未来价值，风险高、流动性差。奖励型众筹换取产品或纪念品（如预售）；捐赠型没有回报；债权型/P2P 是借钱给对方收取利息，出资人是债权人而非股东。","e_en":"Receiving an ownership stake in return for money is **equity crowdfunding**; the return depends on the firm's future value, with high risk and low liquidity. Reward-based crowdfunding gives a product or souvenir (e.g. a pre-sale); donation-based gives nothing back; debt/P2P lends money for interest, making backers creditors rather than shareholders."},{"id":"F6-09","t":"F6","lv":2,"ex":["IEO"],"q":"Which statement about blockchains and digital currencies is MOST accurate?","o":["A blockchain record cannot be changed under any circumstances, so cryptocurrencies have no risk","A stablecoin is issued by a central bank and is therefore legal tender","Each block stores a hash of the previous block, so altering past records requires redoing later blocks and winning consensus; a CBDC such as the e-CNY is a liability of the central bank","Proof of stake uses more electricity than proof of work because validators must solve harder puzzles"],"a":2,"e":"区块通过哈希值 (hash) 链接，篡改历史需重算后续所有区块并获得多数节点共识，因此成本很高（但并非“绝对不可能”，加密资产还面临价格波动、黑客、诈骗等风险）。数字人民币 (e-CNY) 等**央行数字货币 (CBDC)** 是央行负债。稳定币由私人机构发行、靠储备锚定，并非法定货币。权益证明 (PoS) 按质押选验证者，无需算力竞赛，能耗远低于工作量证明 (PoW)。","e_en":"Blocks are linked by hashes, so tampering with history requires recomputing every later block and winning majority consensus, which is very costly (but not \"impossible under any circumstances\", and crypto assets still face volatility, hacking and fraud risks). A **CBDC** such as the e-CNY is a liability of the central bank. Stablecoins are issued by private firms and pegged via reserves; they are not legal tender. Proof of stake selects validators by staked tokens with no computing race, so it uses far less energy than proof of work."},{"id":"F6-10","t":"F6","lv":3,"ex":["IEO"],"q":"A bank's balance sheet (million yuan): reserves 8, liquid securities 12 (can be sold at full value), loans 90 (can only be sold quickly at 70% of book value); deposits 100, equity 10. Depositors suddenly withdraw 30% of deposits. After the bank meets all withdrawals by first using reserves and securities, then selling loans, what is its equity?","o":["About 5.7","About 4.3","10 (unchanged)","About 7.0"],"a":0,"e":"提款 = 100 × 30% = 30。先用准备金 8 + 证券 12 = 20，还缺 10。贷款按 70% 变卖，需出售账面价值 10 ÷ 0.7 ≈ 14.29，折价损失 = 14.29 − 10 ≈ 4.29。股本 = 10 − 4.29 ≈ **5.7**。验证：资产 = 90 − 14.29 = 75.71，负债 = 70，股本 = 5.71。选 4.3 把折价损失当成了剩余股本；选“10 不变”忽略了折价变卖 (fire sale) 损失；选 7.0 是直接用 10 × 30% 作为损失。这说明挤兑会让有偿付能力的银行大幅损失资本。","e_en":"Withdrawals = 100 × 30% = 30. First use reserves 8 + securities 12 = 20, leaving 10 still needed. Loans sell at 70%, so book value sold = 10 ÷ 0.7 ≈ 14.29, a fire-sale loss of 14.29 − 10 ≈ 4.29. Equity = 10 − 4.29 ≈ **5.7**. Check: assets = 90 − 14.29 = 75.71, liabilities = 70, equity = 5.71. 4.3 mistakes the fire-sale loss for the remaining equity; \"10 (unchanged)\" ignores the fire-sale loss; 7.0 wrongly takes 10 × 30% as the loss. This shows how a run can badly erode the capital of a solvent bank."},{"id":"F7-01","t":"F7","lv":1,"ex":["IB","AL","NEC"],"q":"Which of the following is a POSITIVE economic statement?","o":["The government ought to reduce income inequality","Petrol taxes are unfair to rural households","Healthcare should be free for all citizens","A 10% rise in cigarette prices reduces cigarette consumption among teenagers by about 7%"],"a":3,"e":"实证表述 (positive statement) 描述“是什么”，可用数据检验——即使具体数字错了，也可以被证伪。D 是可检验的因果论断。A、C 含“应该 (ought/should)”，B 含“不公平 (unfair)”这一价值判断，都是规范表述 (normative)。注意：实证表述不一定正确，关键在于能否检验。","e_en":"A positive statement describes \"what is\" and can be tested with data — even if the exact figure is wrong, it can be refuted. D is a testable causal claim. A and C contain \"ought/should\" and B contains the value judgement \"unfair\", so they are normative. Note that a positive statement need not be true; what matters is that it is testable."},{"id":"F7-02","t":"F7","lv":1,"ex":["NEC","IEO","AP"],"q":"A country's unemployment rate rises from 4% to 5%. Which description is correct?","o":["Unemployment rose by 1%","Unemployment rose by 1 percentage point, which is a 25% increase in the rate","Unemployment rose by 25 percentage points","Unemployment rose by 20%, which is 1 percentage point"],"a":1,"e":"绝对差 5% − 4% = **1 个百分点 (percentage point)**；相对变化 (5 − 4) ÷ 4 = **25%**。说“上升 1%”把百分点误当百分比；“25 个百分点”把相对变化误当绝对差；20% = 1 ÷ 5，是用了错误的分母（新值）。","e_en":"The absolute difference 5% − 4% = **1 percentage point**; the relative change (5 − 4) ÷ 4 = **25%**. \"Rose by 1%\" confuses percentage points with percent; \"25 percentage points\" treats the relative change as the absolute gap; 20% = 1 ÷ 5 uses the wrong base (the new value)."},{"id":"F7-03","t":"F7","lv":2,"ex":["IB","AL","IEO"],"q":"A price index uses 2020 as its base year. Rebase the index so that 2018 = 100. What is the new value for 2024?","tbl":[["Year","Index (2020 = 100)"],["2018","92"],["2020","100"],["2024","115"]],"o":["125.0","123.0","115.0","108.7"],"a":0,"e":"更换基期 (rebasing)：新指数 = 旧指数 ÷ 旧指数(2018) × 100 = 115 ÷ 92 × 100 = **125.0**。选 123 是用了减法 115 − 92 + 100；115 是没有更换基期；108.7 = 100 ÷ 92 × 100 是 2020 年在新基期下的数值，而非 2024 年。","e_en":"Rebasing: new index = old index ÷ old index(2018) × 100 = 115 ÷ 92 × 100 = **125.0**. 123 uses subtraction (115 − 92 + 100); 115 is the value without rebasing; 108.7 = 100 ÷ 92 × 100 is the rebas
