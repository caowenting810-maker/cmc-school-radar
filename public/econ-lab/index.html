workers who keep their jobs rise; but those who lose jobs are worse off, so there is a trade-off."},{"q":"(d) Identify two threats to the validity of this estimate, suggest one way to strengthen the analysis, and classify the statement \"City A should raise its minimum wage again\" as positive or normative.","sol":"威胁 1——**溢出效应 (spillover)**：相邻城市间劳动力可通勤流动，A 市部分青年可能去 B 市工作，或 B 市企业为竞争工人也涨薪，使对照组受“污染”。\n威胁 2——**同期冲击 (confounding shock)**：2024–2025 年若 A 市还发生了其他只影响本地的事件（如大型工厂关闭、产业政策变化），DiD 会把它误算为最低工资效应。\n其他：只有两个城市，样本小，可能存在统计噪音；青年就业只统计人数，未反映工时变化。\n加强方法：使用多个城市和更多年份的数据，做**事件研究 (event study)** 检验政策前逐年趋势；对不受最低工资约束的高工资群体做**安慰剂检验 (placebo test)**；用回归控制行业结构等变量；或利用行政边界两侧相邻县的对比。\n“A 市应该再次提高最低工资”是**规范表述**，取决于如何权衡低收入者收入提高与就业减少，不能仅凭数据判定；而“最低工资上涨 10% 使青年就业下降约 1.35%”是实证表述。","sol_en":"Threat 1 — **spillover**: workers can commute between neighbouring cities, so some of A's youth may take jobs in B, or B's firms may raise pay to compete for workers, \"contaminating\" the control group.\nThreat 2 — **confounding shock**: if something else affected only City A in 2024–2025 (e.g. a large factory closure or a change in industrial policy), DiD would wrongly attribute it to the minimum wage.\nOthers: with only two cities the sample is small and statistical noise is possible; counting only heads ignores changes in hours worked.\nWays to strengthen: use data on many cities and more years and run an **event study** to check year-by-year pre-policy trends; do a **placebo test** on higher-wage groups not bound by the minimum wage; use regression to control for industry structure; or compare neighbouring counties on either side of an administrative border.\n\"City A should raise its minimum wage again\" is a **normative statement**: it depends on how higher incomes for the low-paid are weighed against lost jobs and cannot be settled by data alone, whereas \"a 10% rise in the minimum wage reduces youth employment by about 1.35%\" is a positive statement."}]}]}</script>

<script>/* ---------- language: 'bi' (中英对照) | 'zh' | 'en' ---------- */
let LANG = (() => { try { return localStorage.getItem('cmc-econlab-lang') || 'bi'; } catch (e) { return 'bi'; } })();
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('cmc-econlab-lang', l); } catch (e) { }
  document.documentElement.lang = l === 'en' ? 'en' : 'zh-CN';
  if (typeof render === 'function') render();
}
/* inline label (HTML) */
function t(zh, en) { return LANG === 'zh' ? zh : LANG === 'en' ? en : `${zh}<span class="enx">${en}</span>`; }
/* plain text (attributes, SVG, toasts) */
function tt(zh, en) { return LANG === 'zh' ? zh : LANG === 'en' ? en : `${zh} ${en}`; }
/* block: English on its own line under the Chinese (HTML) */
function tb(zh, en) { return LANG === 'zh' ? zh : LANG === 'en' ? en : `${zh}<span class="en-p">${en}</span>`; }
</script>
<script>/* ---------- Interactive economics diagrams (SVG) ---------- */
const DG = (() => {
  const x0 = 46, y0 = 206, x1 = 306, y1 = 16;
  const X = v => +(x0 + (x1 - x0) * v / 10).toFixed(1);
  const Y = v => +(y0 - (y0 - y1) * v / 10).toFixed(1);
  const f1 = n => (Math.round(n * 100) / 100).toString();
  let uid = 0;
  function frame(xl, yl, inner) {
    const id = 'clip' + (++uid);
    return `<svg class="dg" viewBox="0 0 330 238" role="img" aria-label="${yl} / ${xl}">
<defs><clipPath id="${id}"><rect x="${X(0)}" y="${Y(10)}" width="${X(10) - X(0)}" height="${Y(0) - Y(10)}"/></clipPath></defs>
<g clip-path="url(#${id})">${inner.clip || ''}</g>
${inner.free || ''}
<path class="ax" d="M${X(0)} ${Y(10.3)} L${X(0)} ${Y(0)} L${X(10.3)} ${Y(0)}"/>
<text class="axl" x="${X(0) - 4}" y="${Y(10.3) - 3}" text-anchor="start">${yl}</text>
<text class="axl" x="${X(10.3)}" y="${Y(0) + 24}" text-anchor="end">${xl}</text>
<text class="axl" x="${X(0) - 6}" y="${Y(0) + 12}" text-anchor="end">0</text>
</svg>`;
  }
  function curve(fn, cls, a = 0, b = 10, n = 120) {
    let d = '', pen = false;
    for (let i = 0; i <= n; i++) {
      const q = a + (b - a) * i / n, p = fn(q);
      if (!isFinite(p) || p < -1 || p > 11) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(q) + ' ' + Y(p) + ' ';
      pen = true;
    }
    return `<path class="${cls}" d="${d}"/>`;
  }
  const vline = (q, cls, a = 0, b = 10) => `<path class="${cls}" d="M${X(q)} ${Y(a)} L${X(q)} ${Y(b)}"/>`;
  const hline = (p, cls, a = 0, b = 10) => `<path class="${cls}" d="M${X(a)} ${Y(p)} L${X(b)} ${Y(p)}"/>`;
  const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map(([q, p]) => X(q) + ',' + Y(p)).join(' ')}"/>`;
  const txt = (q, p, s, cls = '', anchor = 'start', dx = 0, dy = 0) => `<text class="${cls}" x="${X(q) + dx}" y="${Y(p) + dy}" text-anchor="${anchor}">${s}</text>`;
  const dot = (q, p) => `<circle class="pt" cx="${X(q)}" cy="${Y(p)}" r="3.4"/>`;
  function guides(q, p, ql, pl) {
    let s = `<path class="guide" d="M${X(0)} ${Y(p)} L${X(q)} ${Y(p)} L${X(q)} ${Y(0)}"/>`;
    let t = '';
    if (pl) t += `<text class="axl" x="${X(0) - 5}" y="${Y(p) + 3.5}" text-anchor="end">${pl}</text>`;
    if (ql) t += `<text class="axl" x="${X(q)}" y="${Y(0) + 12}" text-anchor="middle">${ql}</text>`;
    return { s, t };
  }
  // label at end of a curve
  const lab = (q, p, s, c, anchor = 'start') => txt(q, p, s, 'lb lb-' + c, anchor, anchor === 'start' ? 4 : -4, 3);

  const D = {};

  D.sd = {
    get title() { return tt('供求均衡', 'Supply & Demand'); }, get xl() { return tt('数量 Q', 'Quantity Q'); }, get yl() { return tt('价格 P', 'Price P'); },
    controls: [
      { id: 'dD', get label() { return tt('需求移动 ΔD', 'Demand shift ΔD'); }, min: -3, max: 3, step: 0.5, val: 0 },
      { id: 'dS', get label() { return tt('供给移动 ΔS', 'Supply shift ΔS'); }, min: -3, max: 3, step: 0.5, val: 0 }],
    draw(v) {
      const dD = +v.dD, dS = +v.dS;
      const Dn = q => 10 + dD - q, Sn = q => q - dS;
      const Q = (10 + dD + dS) / 2, P = 10 + dD - Q;
      const g = guides(Q, P, 'Q*', 'P*');
      let clip = poly([[0, 10 + dD], [0, P], [Q, P]], 'a-d') + poly([[0, P], [0, -dS], [Q, P]], 'a-s');

      clip += curve(MC, 'cs', 0.3, 10) + curve(ATC, 'cd', 0.75, 10) + curve(AVC, 'ck', 0.3, 10) + hline(P, 'c3');

      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['q*（P=MC）', f1(q)], ['ATC(q*)', q ? f1(atc) : '—'], [tt('经济利润', 'Economic profit'), f1(profit)], ['', st]] };

      clip += hline(pw, 'ck') + (t ? hline(pt, 'c3') : '') + curve(q => 10 - q, 'cd') + curve(q => q, 'cs') + dot(qst, pt) + dot(qdt, pt)
        + `<path class="guide" d="M${X(qsw)} ${Y(pw)} L${X(qsw)} ${Y(0)} M${X(qdw)} ${Y(pw)} L${X(qdw)} ${Y(0)} M${X(qst)} ${Y(pt)} L${X(qst)} ${Y(0)} M${X(qdt)} ${Y(pt)} L${X(qdt)} ${Y(0)}"/>`;
      const free = lab(9.4, 9.4, tt('国内供给', 'Domestic S'), 's', 'end') + lab(9.6, 0.4, tt('国内需求', 'Domestic D'), 'd', 'end')
        + txt(10, pw, 'Pw', 'lb lb-k', 'end', 0, 12) + (t ? txt(10, pt, 'Pw + t', 'lb lb-3', 'end', 0, -5) : '');
      return {
        svg: frame(this.xl, this.yl, { clip, free }), read: [[tt('进口（自由贸易）', 'Imports (free trade)'), f1(qdw - qsw)], [tt('进口（征税后）', 'Imports (tariff)'), f1(qdt - qst)],
        [tt('关税收入', 'Tariff revenue'), f1(t * (qdt - qst))], ['DWL', f1(t * t)], ['', tb('绿色 = 政府关税收入；红色 = 生产扭曲 + 消费扭曲（无谓损失）', 'Green = tariff revenue; red = production + consumption distortions (deadweight loss)')]]
      };
    }
  };

  D.lorenz = {
    get title() { return tt('洛伦兹曲线与基尼系数', 'Lorenz Curve & Gini Coefficient'); }, get xl() { return tt('人口累计 %', 'Cumulative % of population'); }, get yl() { return tt('收入累计 %', 'Cumulative % of income'); },
    controls: [{ id: 'k', get label() { return tt('不平等程度', 'Degree of inequality'); }, min: 1, max: 5, step: 0.25, val: 2.5 }],
    draw(v) {
      const k = +v.k, L = x => 10 * Math.pow(x / 10, k), g = (k - 1) / (k + 1);
      const pts = []; for (let i = 0; i <= 50; i++) { const x = i / 5; pts.push([x, L(x)]); }
      let clip = poly(pts.concat([[10, 10]]).concat([[0, 0]]), 'a-x') + curve(x => x, 'ck') + curve(L, 'cs', 0, 10, 100);
      const b = 10 * Math.pow(0.5, k);
      clip += dot(5, b) + `<path class="guide" d="M${X(5)} ${Y(0)} L${X(5)} ${Y(b)} L${X(0)} ${Y(b)}"/>`;
      const free = lab(6.2, 6.8, tt('绝对平等线', 'Line of equality'), 'k', 'end') + lab(9.6, L(9.6) - 0.4, tt('洛伦兹曲线', 'Lorenz curve'), 's', 'end') + txt(6.2, 4.6, 'A', 'lb', 'middle') + txt(8.6, 3, 'B', 'lb', 'middle')
        + `<text class="axl" x="${X(10)}" y="${Y(0) + 12}" text-anchor="middle">100%</text><text class="axl" x="${X(0) - 5}" y="${Y(10) + 3}" text-anchor="end">100%</text>`;
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [[tt('基尼系数', 'Gini') + ' = A ÷ (A + B)', f1(g)], [tt('最穷 50% 的收入占比', 'Income share of poorest 50%'), Math.round(b * 10) + '%'], ['', tb('曲线越弯离平等线越远，基尼系数越大', 'The further the curve sags from the equality line, the higher the Gini')]] };
    }
  };

  return { D, render(id, host) {
    const d = D[id]; if (!d) return false;
    const vals = {}; d.controls.forEach(c => vals[c.id] = c.val);
    host.innerHTML = `<div class="row between"><h3>${d.title}</h3><button class="btn sm ghost" data-reset>${tt('重置', 'Reset')}</button></div>
      <div class="dg-host"></div>
      ${d.controls.length ? `<div class="ctrls">${d.controls.map(c => `<label class="ctrl" for="dg-${id}-${c.id}"><span>${c.label}<b class="mono" data-v="${c.id}">${c.val}</b></span><input type="range" id="dg-${id}-${c.id}" data-k="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}"></label>`).join('')}</div>` : ''}
      <div class="readout"></div>`;
    const draw = () => {
      const r = d.draw(vals);
      host.querySelector('.dg-host').innerHTML = r.svg;
      host.querySelector('.readout').innerHTML = r.read.map(([k, v]) => k ? `<span>${k} <b>${v}</b></span>` : `<span>${v}</span>`).join('');
    };
    host.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
      vals[inp.dataset.k] = inp.value; host.querySelector(`[data-v="${inp.dataset.k}"]`).textContent = inp.value; draw();
    }));
    host.querySelector('[data-reset]').addEventListener('click', () => {
      d.controls.forEach(c => { vals[c.id] = c.val; const i = host.querySelector(`[data-k="${c.id}"]`); i.value = c.val; host.querySelector(`[data-v="${c.id}"]`).textContent = c.val; });
      draw();
    });
    draw();
    return true;
  } };
})();
</script>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

const gnum = g => parseInt(String(g).replace(/\D/g, '')) || 10;

/* ---- bilingual content helpers ---- */
const uName = u => t(u.zh, u.en);
const lTitle = l => l ? t(esc(l.title_zh), esc(l.title_en)) : '';
const lTitleTxt = l => l ? tt(l.title_zh, l.title_en) : '';
/* field with an _en twin, escaped; block = English on its own line */
function cf(o, k, block = true) {
  const zh = esc(o[k]), en = esc(o[k + '_en'] || o[k]);
  if (LANG === 'zh') return zh; if (LANG === 'en') return en;
  if (!o[k + '_en'] || o[k + '_en'] === o[k]) return zh;
  return block ? `${zh}<span class="en-p">${en}</span>` : `${zh}<span class="enx">${en}</span>`;
}
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
function mdOne(s) {
  let out = '', ul = false;
  for (const raw of String(s || '').split('\n')) {
    const l = raw.trim();
    if (/^[-•]\s+/.test(l)) { if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + inl(l.replace(/^[-•]\s+/, '')) + '</li>'; }
    else { if (ul) { out += '</ul>'; ul = false; } if (l) out += '<p>' + inl(l) + '</p>'; }
  }
  return ul ? out + '</ul>' : out;
}
/* bilingual markdown: interleave line by line when both versions have the same shape */
function md(zh, en) {
  if (LANG === 'zh' || !en) return mdOne(zh);
  if (LANG === 'en') return mdOne(en);
  const a = String(zh).split('\n'), b = String(en).split('\n');
  if (a.length !== b.length) return mdOne(zh) + '<div class="en-block">' + mdOne(en) + '</div>';
  let out = '', ul = false;
  a.forEach((z, i) => {
    const zt = z.trim(), et = b[i].trim(), bul = /^[-•]\s+/.test(zt);
    const zc = zt.replace(/^[-•]\s+/, ''), ec = et.replace(/^[-•]\s+/, '');
    if (bul) { if (!ul) { out += '<ul>'; ul = true; } out += `<li>${inl(zc)}<span class="en-p">${inl(ec)}</span></li>`; }
    else { if (ul) { out += '</ul>'; ul = false; } if (zt) out += `<p>${inl(zc)}<span class="en-p">${inl(ec)}</span></p>`; }
  });
  return ul ? out + '</ul>' : out;
}
/* explanation / solution text (pre-line) */
function txtBi(zh, en) {

  if (LANG === 'en') return `<p>${esc(en)}</p>`;

}

/* ---------- icons ---------- */
const I = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {

};

/* ---------- state & persistence ---------- */
const KEY = 'cmc-econlab-v1';
const blank = () => ({ answers: {}, fav: [], lessons: {}, profile: { grade: 'G10', goals: ['AP', 'IEO'] }, mocks: [], days: [], probs: {}, updatedAt: 0 });
function loadLocal() { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) { } return blank(); }
let S = loadLocal();
let dbRef = null, syncT = null, cloud = 'off';
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  if (dbRef) { clearTimeout(syncT); syncT = setTimeout(pushCloud, 1200); }
}
function pushCloud() {
  if (!dbRef) return;
  dbRef.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }).then(() => setCloud('on')).catch(() => setCloud('err'));
}
function setCloud(s) { cloud = s; document.querySelectorAll('[data-sync]').forEach(el => el.innerHTML = syncLabel()); }
function syncLabel() {
  return cloud === 'on' ? '<span class="dot on"></span><span>' + t('进度已同步到你的账号', 'Progress synced to your account') + '</span>'
    : cloud === 'err' ? '<span class="dot"></span><span>' + t('同步暂不可用，进度保存在本机', 'Sync unavailable; saved on this device') + '</span>'
      : '<span class="dot"></span><span>' + t('进度保存在本机浏览器', 'Progress saved in this browser') + '</span>';
}
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc('data/users/' + uid + '/progress');
    const snap = await dbRef.get();
    const r = snap.exists ? snap.data() : null;
    if (r && r.state && (r.updatedAt || 0) > (S.updatedAt || 0)) {
      S = Object.assign(blank(), JSON.parse(r.state));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
      if (!(view.name === 'quiz' || view.name === 'mockrun')) render();
    } else if (S.updatedAt && (!r || S.updatedAt > (r.updatedAt || 0))) pushCloud();
    setCloud('on');
  } catch (e) { setCloud('err'); }
}
function markDay() { const d = today(); if (!S.days.includes(d)) { S.days.push(d); if (S.days.length > 400) S.days.shift(); } }
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (; ;) { const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); if (set.has(k)) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function record(qid, ok) {
  const a = S.answers[qid] || { c: 0, w: 0 };
  ok ? a.c++ : a.w++; a.last = ok; a.t = Date.now();
  S.answers[qid] = a; markDay(); save();
}
function topicStats(tp) {
  const qs = QS.filter(q => q.t === tp);
  let seen = 0, right = 0;
  qs.forEach(q => { const a = S.answers[q.id]; if (a) { seen++; if (a.last) right++; } });
  return { total: qs.length, seen, right, acc: seen ? right / seen : null };
}
function overall() {
  let n = 0, c = 0;
  Object.values(S.answers).forEach(a => { n++; if (a.last) c++; });
  return { n, c };
}
const wrongIds = () => QS.filter(q => S.answers[q.id] && S.answers[q.id].last === false).map(q => q.id);
const isFav = id => S.fav.includes(id);
function toggleFav(id) { S.fav = isFav(id) ? S.fav.filter(x => x !== id) : S.fav.concat(id); save(); }

/* ---------- routing ---------- */
let view = { name: 'home' };
let quiz = null, mock = null, mockTimer = null;
const NAV = [
  { id: 'home', zh: '首页', en: 'Home', ic: 'home' },

const navOf = n => ({ lesson: 'learn', quiz: 'practice', mockrun: 'mocks', mockres: 'mocks', problem: 'problems' }[n] || n);

function go(name, arg) {

function langSeg() {

let afterFns = [];

/* ---------- recommendation ---------- */
function lessonPath() { const g = gnum(S.profile.grade); return LESSONS.filter(l => gnum(l.level) <= g); }
function nextLesson() { return lessonPath().find(l => !S.lessons[l.id]) || null; }
function weakTopic() {
  let best = null;
  LESSONS.forEach(l => { const s = topicStats(l.id); if (s.seen >= 3 && s.acc < 0.8 && (!best || s.acc < best.s.acc)) best = { l, s }; });
  return best;
}
function levelsForGrade() { const g = gnum(S.profile.grade); return g <= 9 ? [1, 2] : g === 10 ? [1, 2, 3] : [2, 3]; }
function dailySet(n = 10) {
  const lv = levelsForGrade(), goals = S.profile.goals, g = gnum(S.profile.grade);
  const allowed = new Set(lessonPath().map(l => l.id));
  let pool = QS.filter(q => allowed.has(q.t) && lv.includes(q.lv) && (!goals.length || q.ex.some(e => goals.includes(e))));
  if (g <= 9) pool = pool.filter(q => q.lv === 1 || Math.random() < .3);
  const unseen = shuffle(pool.filter(q => !S.answers[q.id])), seen = shuffle(pool.filter(q => S.answers[q.id] && !S.answers[q.id].last));
  return unseen.concat(seen, shuffle(pool)).map(q => q.id).filter((v, i, a) => a.indexOf(v) === i).slice(0, n);
}
const small = s => `<small class="muted" style="font-size:14px;font-weight:500">${s}</small>`;

/* ================= VIEWS ================= */
function vHome() {
  const o = overall(), p = S.profile, nl = nextLesson(), wk = weakTopic();
  const learned = Object.keys(S.lessons).length;
  afterFns.push(() => {
    document.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => { S.profile.grade = b.dataset.grade; save(); render(); });
    document.querySelectorAll('[data-goal]').forEach(b => b.onclick = () => { const k = b.dataset.goal, gs = S.profile.goals; S.profile.goals = gs.includes(k) ? gs.filter(x => x !== k) : gs.concat(k); save(); render(); });
    $('#rec-daily')?.addEventListener('click', () => startQuiz(dailySet(10), tt('今日 10 题', 'Daily 10')));
  });
  const stage = gnum(p.grade);

function tileHTML(l) {
  const s = topicStats(l.id);
  const cls = s.acc === null ? 's0' : s.acc < .6 ? 's1' : s.acc < .85 ? 's2' : 's3';
  const qn = LANG === 'en' ? ' Qs' : ' 题';
  return `<button class="tile ${cls}" data-go="lesson" data-arg="${l.id}"><span class="code">${l.id}</span><span class="nm">${lTitle(l)}</span><span class="pct">${s.acc === null ? tt('未开始', 'Not started') : pct(s.right, s.seen) + '% · ' + s.seen + '/' + s.total + qn}</span></button>`;
}

function sylGroups(l) {
  const g = {};
  (LSYL[l.id] || []).forEach(x => (g[x.f.id] = g[x.f.id] || []).push(x));
  return SYL.filter(f => g[f.id]).map(f => ({ f, xs: g[f.id] }));
}
function sylSide(l) {
  const gs = sylGroups(l);
  if (!gs.length) return `<p class="note">${tt('暂无对应考点', 'No mapped points')}</p>`;
  return gs.map(({ f, xs }) => `<div class="ss-g"><button class="ss-f" data-fwgo="${f.id}">${FW_SHORT[f.id]}</button><div class="ss-i">${xs.map(x => `<span class="ss-c${x.primary ? ' pri' : ''}" title="${esc(tt(x.it.zh, x.it.en))}">${esc(x.it.code)}</span>`).join('')}</div></div>`).join('');
}
function sylObjectives(l) {
  const gs = sylGroups(l).map(g => ({ f: g.f, xs: g.xs.filter(x => x.primary) })).filter(g => g.xs.length);
  if (!gs.length) return '';
  const goals = new Set((S.profile.goals || []).flatMap(g => GOAL_FW[g] || []));
  gs.sort((a, b) => (goals.has(b.f.id) ? 1 : 0) - (goals.has(a.f.id) ? 1 : 0));
  return `<section class="sec"><h2 class="bi-h">${t('考纲学习目标', 'Syllabus learning objectives')}</h2>
    <p class="note">${tb('本课覆盖的官方考点。你的目标考试排在前面；学完后应能做到下列每一条。', 'Official syllabus points this lesson covers, your target exams first. After the lesson you should be able to do each of these.')}</p>
    <div class="objs">${gs.map(({ f, xs }) => `<details class="objg" ${goals.has(f.id) ? 'open' : ''}><summary><span class="tag b">${FW_SHORT[f.id]}</span><span class="muted num">${xs.length}</span></summary>

}

/* ---------- syllabus map ---------- */
function itemState(it) {
  const lid = (it.lessons || [])[0]; if (!lid) return 'new';
  const s = topicStats(lid);
  if (s.seen >= 4 && s.acc >= .85) return 'done';
  if (S.lessons[lid] || s.seen) return 'wip';
  return 'new';
}
const ST_LBL = { done: ['已掌握', 'Mastered'], wip: ['学习中', 'In progress'], new: ['未开始', 'Not started'] };
function fwProgress(f) {
  let n = 0, d = 0, w = 0;
  f.units.forEach(u => u.items.forEach(it => { n++; const st = itemState(it); if (st === 'done') d++; else if (st === 'wip') w++; }));
  return { n, d, w };
}
const fwName = f => t(f.zh, f.en);

}

}

const explain = q => txtBi(q.e, q.e_en);
function vQuiz() {

      }).join('')}</div>

` : `<span class="kbd">${tt('键盘：按 A–D 或 1–4 作答，Enter 下一题', 'Keyboard: A–D or 1–4 to answer, Enter for next')}</span>`}

function answer(k) {

}
function nextQ() { if (quiz.picks[quiz.ids[quiz.i]] === undefined) return; quiz.i++; render(); }

  const ans = quiz.ids.filter(id => quiz.picks[id] !== undefined), right = ans.filter(id => QBY[id].a === quiz.picks[id]);

function tick() {
  if (!mock || view.name !== 'mockrun') return;
  const rem = mock.dur - (Date.now() - mock.start), el = $('#timer');
  if (el) { el.textContent = fmtT(rem); el.classList.toggle('low', rem < 5 * 60000); }

}
function submitMock() {
  clearInterval(mockTimer); mockTimer = null;
  let score = 0; const by = {};
  mock.ids.forEach(id => {
    const q = QBY[id], p = mock.picks[id], ok = p === q.a;
    if (ok) score++;
    (by[q.t] = by[q.t] || { r: 0, n: 0 }).n++; if (ok) by[q.t].r++;
    if (p !== undefined) record(id, ok); else { const a = S.answers[id] || { c: 0, w: 0 }; a.w++; a.last = false; a.t = Date.now(); S.answers[id] = a; }
  });
  const sec = Math.round(Math.min(mock.dur, Date.now() - mock.start) / 1000);
  mock.result = { score, total: mock.ids.length, by, sec };
  S.mocks.push({ id: mock.cfg.id, name: mock.cfg.zh, date: today(), score, total: mock.ids.length, sec });
  if (S.mocks.length > 60) S.mocks.shift();

  go('mockres');
}

function promoHidden(ctx) { const st = promoState(); return st[ctx] && Date.now() - st[ctx] < 7 * 864e5; }

  guide: [['竞赛怎么选、何时报名、如何和校内课程衔接？', 'Which competition, when to register, how it fits your school courses?'], ['每个学生的课程体系和时间线都不一样。CMC 师说提供一对一的学业与竞赛规划咨询。', 'Every student’s curriculum and timeline differ. CMC offers one-to-one academic and competition planning.']],

function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-qr-close]') || e.target.id === 'qr-modal') { closeQR(); return; }

  if (px) { promoDismiss(px.dataset.promoX); px.closest('.promo')?.remove(); toast(tt('好的，这周不再显示这里的提示', 'Got it. Hidden here for a week.')); return; }
  const lg = e.target.closest('button[data-lang]');

  const fg = e.target.closest('[data-fwgo]');
  if (fg) { sylFw = fg.dataset.fwgo; go('syllabus'); return; }
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { e.preventDefault(); go(g.dataset.go, g.dataset.arg); return; }
  const qt = e.target.closest('[data-quiz-topic]');
  if (qt) { const k = qt.dataset.quizTopic; const ids = QS.filter(q => q.t === k).map(q => q.id); const uns = shuffle(ids.filter(i => !S.answers[i] || !S.answers[i].last)); startQuiz(uns.concat(shuffle(ids.filter(i => !uns.includes(i)))).slice(0, 10), lTitleTxt(LBY[k]) + ' · ' + tt('专项练习', 'Topic practice')); return; }
  const qi = e.target.closest('[data-quiz-ids]');
  if (qi) { startQuiz(shuffle(qi.dataset.quizIds.split(',')), tt('错题重练', 'Redo mistakes')); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('qr-modal')) { closeQR(); return; }
  if (document.getElementById('qr-modal')) return;
  if (e.target.closest('input,textarea,select')) return;
  if (view.name === 'quiz' && quiz && quiz.i < quiz.ids.length) {
    const k = e.key.toUpperCase(); let n = LETTERS.indexOf(k); if (n < 0 && /^[1-5]$/.test(k)) n = +k - 1;
    const q = QBY[quiz.ids[quiz.i]];
    if (n >= 0 && n < q.o.length) { answer(n); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.key === 'ArrowRight') && quiz.picks[q.id] !== undefined) { nextQ(); e.preventDefault(); }
  } else if (view.name === 'mockrun' && mock) {
    const k = e.key.toUpperCase(); let n = LETTERS.indexOf(k); if (n < 0 && /^[1-5]$/.test(k)) n = +k - 1;
    const q = QBY[mock.ids[mock.i]];
    if (n >= 0 && n < q.o.length) { mock.picks[q.id] = n; render(); }
    else if (e.key === 'ArrowRight' && mock.i < mock.ids.length - 1) { mock.i++; render(); }
    else if (e.key === 'ArrowLeft' && mock.i > 0) { mock.i--; render(); }
  }
});

/* ---------- boot ---------- */
(function boot() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  const h = (location.hash || '').slice(1);
  const m = h.match(/^(lesson|problem)-(.+)$/);
  if (m && (LBY[m[2]] || PROBS.find(p => p.id === m[2]))) view = { name: m[1], arg: m[2] };
  else if (['learn', 'syllabus', 'practice', 'mocks', 'problems', 'mistakes', 'guide'].includes(h)) view = { name: h };
  render();
  initCloud();
})();
