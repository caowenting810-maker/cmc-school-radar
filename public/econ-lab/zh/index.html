<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>CMC EconLab</title>
<meta name="description" content="CMC 师说 · 经济学学习与刷题系统">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Sora:wght@500;600;700&display=swap">
<style>:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --surface-3:#E5E8EC;
  --ink:#14161B; --ink-2:#464C57; --ink-3:#767D8A; --line:#DFE2E8;
  --brand:#F97E1C; --brand-ink:#B85600; --brand-soft:#FFF0E2; --brand-line:#F9C99E;
  --ok:#17875A; --ok-soft:#E3F4EC; --bad:#C93A32; --bad-soft:#FBE8E6; --warn:#A86B00; --warn-soft:#FDF2DC;
  --c-d:#2C66D1; --c-3:#0E8A7C; --c-d-soft:rgba(44,102,209,.16); --c-s-soft:rgba(249,126,28,.18); --c-3-soft:rgba(14,138,124,.18); --dwl:rgba(201,58,50,.24);
  --shadow:0 1px 2px rgba(20,22,27,.05),0 4px 16px rgba(20,22,27,.05);
  --r:12px; --r-s:8px;
  --f-display:"Sora","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D0F13; --surface:#161920; --surface-2:#1D2129; --surface-3:#262B35;
  --ink:#F0F1F4; --ink-2:#B9BEC9; --ink-3:#848B99; --line:#2A2F39;
  --brand:#FF8B2E; --brand-ink:#FFA257; --brand-soft:#2B1D11; --brand-line:#5C3714;
  --ok:#3BC48A; --ok-soft:#10271E; --bad:#F06A60; --bad-soft:#2E1614; --warn:#F0B44C; --warn-soft:#2A2110;
  --c-d:#6D9BF0; --c-3:#39C2B0; --c-d-soft:rgba(109,155,240,.2); --c-s-soft:rgba(255,139,46,.2); --c-3-soft:rgba(57,194,176,.2); --dwl:rgba(240,106,96,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D0F13; --surface:#161920; --surface-2:#1D2129; --surface-3:#262B35;
  --ink:#F0F1F4; --ink-2:#B9BEC9; --ink-3:#848B99; --line:#2A2F39;
  --brand:#FF8B2E; --brand-ink:#FFA257; --brand-soft:#2B1D11; --brand-line:#5C3714;
  --ok:#3BC48A; --ok-soft:#10271E; --bad:#F06A60; --bad-soft:#2E1614; --warn:#F0B44C; --warn-soft:#2A2110;
  --c-d:#6D9BF0; --c-3:#39C2B0; --c-d-soft:rgba(109,155,240,.2); --c-s-soft:rgba(255,139,46,.2); --c-3-soft:rgba(57,194,176,.2); --dwl:rgba(240,106,96,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;font-family:var(--f-display)}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px;overflow-y:auto}
.logo{color:var(--ink);display:block;padding:0 8px}
.logo svg{width:100%;height:auto;display:block}
.prodname{padding:0 8px;display:flex;align-items:baseline;gap:8px}
.prodname b{font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.prodname span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:9px;text-align:left;color:var(--ink-2);font-size:14.5px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:0 7px;font-weight:600}
.navsec{font-size:11px;letter-spacing:.08em;color:var(--ink-3);padding:10px 10px 4px;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-3);padding:0 8px}
.sync{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--ok)}
.main{min-width:0;padding-block:28px 48px;padding-inline:clamp(16px,4vw,44px)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.tabbar{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
button.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.b{background:var(--brand-soft);color:var(--brand-ink)}
.tag.l1{background:var(--ok-soft);color:var(--ok)}
.tag.l2{background:var(--warn-soft);color:var(--warn)}
.tag.l3{background:var(--bad-soft);color:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
.head{display:flex;flex-direction:column;gap:6px}
.head p{color:var(--ink-2);max-width:68ch}
select,input[type="text"],textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.back{align-self:flex-start}

/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.hello{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hello h1{color:var(--bg);font-size:26px}
.hello p{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.hello .mark{position:absolute;right:-20px;bottom:-26px;width:210px;opacity:.9;pointer-events:none}
.hello .mark path{fill:var(--brand)}
.hello label{font-size:12px;color:color-mix(in srgb,var(--bg) 60%,transparent);font-weight:600;letter-spacing:.06em}
.hello .chip{background:transparent;color:color-mix(in srgb,var(--bg) 80%,transparent);border-color:color-mix(in srgb,var(--bg) 25%,transparent)}
.hello .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.hello-fields{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;max-width:520px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink-3)}
.rec{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;transition:border-color .15s}
.rec:hover{border-color:var(--brand)}
.rec h3{font-size:16px}
.rec p{font-size:13.5px;color:var(--ink-2)}
.rec .go{color:var(--brand-ink);font-weight:600;font-size:13.5px;margin-top:auto}
.mastery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:78px}
.tile:hover{border-color:var(--ink-3)}
.tile .code{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tile .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.tile .pct{font-size:12px;margin-top:auto;font-variant-numeric:tabular-nums}
.tile.s0 .pct{color:var(--ink-3)}
.tile.s1{background:var(--bad-soft);border-color:transparent}.tile.s1 .pct{color:var(--bad)}
.tile.s2{background:var(--warn-soft);border-color:transparent}.tile.s2 .pct{color:var(--warn)}
.tile.s3{background:var(--ok-soft);border-color:transparent}.tile.s3 .pct{color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.stage{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stage:last-child{border-right:0}
.stage.now{background:var(--brand-soft)}
.stage .g{font-family:var(--f-display);font-weight:700;font-size:15px}
.stage.now .g{color:var(--brand-ink)}
.stage p{font-size:13px;color:var(--ink-2)}

/* learn */
.unit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit-h .en{color:var(--ink-3);font-size:13px}
.tcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px}
.tcard:hover{border-color:var(--brand)}
.tcard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard h3{font-size:16px}
.tcard .en{font-size:12.5px;color:var(--ink-3);margin-top:-6px}
.tcard .tags{display:flex;gap:5px;flex-wrap:wrap}
.tcard .foot{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3);margin-top:auto}
.tcard .foot .bar{flex:1}
.done-mark{color:var(--ok);font-weight:700;font-size:12px}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lesson-main{display:flex;flex-direction:column;gap:22px;min-width:0}
.lesson-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.lh h1{font-size:30px}
.lh .en{font-family:var(--f-display);color:var(--ink-3);font-size:15px;margin-top:4px}
.summary{font-size:15.5px;color:var(--ink-2);max-width:70ch;border-left:3px solid var(--brand);padding-left:14px}
.prose{display:flex;flex-direction:column;gap:10px;max-width:72ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.prose strong{color:var(--ink);font-weight:700}
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:19px;display:flex;align-items:center;gap:10px}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.concept{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.concept b{font-size:14.5px}
.concept i{font-style:normal;font-family:var(--f-display);font-size:12px;color:var(--brand-ink);font-weight:600}
.concept p{font-size:13.5px;color:var(--ink-2)}
.formulas{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.formula{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.formula:last-child{border-bottom:0}
.formula .n{font-size:13px;color:var(--ink-3);font-weight:600}
.formula .f{font-family:var(--f-mono);font-size:14.5px;overflow-x:auto}
.formula .note{grid-column:2;font-size:12.5px;color:var(--ink-3)}
.pitfalls{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.pitfalls li{background:var(--warn-soft);border-radius:9px;padding:9px 12px 9px 34px;font-size:14px;position:relative}
.pitfalls li::before{content:"!";position:absolute;left:11px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--warn);color:var(--surface);font-weight:700;font-size:11px;display:grid;place-items:center;line-height:1}
.examtbl{width:100%;border-collapse:collapse;font-size:13px}
.examtbl td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.examtbl td:first-child{width:62px;font-weight:700;font-family:var(--f-display);color:var(--ink-2)}
.examtbl tr:last-child td{border-bottom:0}

/* diagram */
.dg-card{display:flex;flex-direction:column;gap:12px}
.dg-card svg{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
.dg text{font-family:var(--f-body);font-size:10px;fill:var(--ink-2)}
.dg .ax{stroke:var(--ink-3);stroke-width:1.2;fill:none}
.dg .axl{font-size:9.5px;fill:var(--ink-3)}
.dg .cd{stroke:var(--c-d);stroke-width:2.4;fill:none}
.dg .cs{stroke:var(--brand);stroke-width:2.4;fill:none}
.dg .c3{stroke:var(--c-3);stroke-width:2.4;fill:none}
.dg .ck{stroke:var(--ink);stroke-width:2.2;fill:none}
.dg .ghost{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-dasharray:4 3;opacity:.7}
.dg .guide{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;fill:none}
.dg .a-d{fill:var(--c-d-soft)}.dg .a-s{fill:var(--c-s-soft)}.dg .a-3{fill:var(--c-3-soft)}.dg .a-x{fill:var(--dwl)}
.dg .pt{fill:var(--ink)}
.dg .lb{font-weight:700;font-size:10.5px}
.dg .lb-d{fill:var(--c-d)}.dg .lb-s{fill:var(--brand-ink)}.dg .lb-3{fill:var(--c-3)}.dg .lb-k{fill:var(--ink)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px}
.ctrl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ctrl span{display:flex;justify-content:space-between;color:var(--ink-2)}
.ctrl input{accent-color:var(--brand);width:100%}
.readout{background:var(--surface-2);border-radius:9px;padding:10px 12px;font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 18px}
.readout b{font-family:var(--f-mono);font-weight:600}

/* practice */
.filters{display:flex;flex-direction:column;gap:16px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup > .lbl{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.quick button{text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.quick button:hover{border-color:var(--brand)}
.quick b{font-size:15px}
.quick span{font-size:12.5px;color:var(--ink-3)}
.qwrap{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qstem{font-size:16.5px;line-height:1.6;white-space:pre-line}
.qtbl-wrap{overflow-x:auto}
.qtbl{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:50%}
.qtbl th,.qtbl td{border:1px solid var(--line);padding:6px 12px;text-align:center}
.qtbl th{background:var(--surface-2);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--ink-3)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--ink-2)}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.expl{border-radius:10px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.expl .verdict{font-weight:700;font-family:var(--f-display)}
.expl .verdict.ok{color:var(--ok)}.expl .verdict.no{color:var(--bad)}
.expl p{white-space:pre-line}
.ai-box{border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:10px;padding:12px 14px;font-size:14px;white-space:pre-wrap}
.ai-box .who{font-weight:700;color:var(--brand-ink);font-size:12.5px;display:block;margin-bottom:4px}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.star{border:0;background:none;color:var(--ink-3);padding:4px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.star[aria-pressed="true"]{color:var(--brand)}
.star svg{width:18px;height:18px}
.kbd{font-size:11.5px;color:var(--ink-3)}

/* mock */
.timer{font-family:var(--f-mono);font-size:18px;font-weight:600;padding:4px 12px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.palette button{height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.palette button.ans{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.palette button.cur{outline:2px solid var(--brand);outline-offset:1px}
.palette button.r{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.palette button.w{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.mocklay{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start}
.mockside{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface)}
.mcard .spec{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.mcard .spec b{font-family:var(--f-mono)}
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-family:var(--f-display);font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1}
.brk{display:flex;flex-direction:column;gap:8px}
.brk-row{display:grid;grid-template-columns:150px 1fr 58px;gap:10px;align-items:center;font-size:13px}
.brk-row .bar{height:8px}
.brk-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hist{width:100%;border-collapse:collapse;font-size:13.5px}
.hist th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}

/* problems */
.part{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sol{background:var(--surface-2);border-radius:10px;padding:12px 14px;white-space:pre-line;font-size:14.5px}
.self{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-3)}

/* guide */
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.cmp th{font-family:var(--f-display);font-size:13px;background:var(--surface-2)}
.cmp td:first-child{font-weight:600;white-space:nowrap}
.fact{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:14px}
.fact dt{color:var(--ink-3);font-weight:600;font-size:13px}
.fact dd{margin:0}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.book{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.book b{font-size:14px}
.book span{font-size:12.5px;color:var(--ink-3)}
.book p{font-size:13px;color:var(--ink-2)}
.src{font-size:13px;display:flex;flex-direction:column;gap:4px}
.src a{color:var(--brand-ink)}
.note{font-size:12.5px;color:var(--ink-3)}

/* coach */
.chat{display:flex;flex-direction:column;gap:12px;max-width:780px;width:100%;margin:0 auto}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:48px;max-height:200px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:50;box-shadow:var(--shadow)}

@media (max-width:1020px){
  .lesson{grid-template-columns:1fr}
  .lesson-side{position:static}
  .mocklay{grid-template-columns:1fr}
  .mockside{position:static}
  .hero{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .logo{width:150px;padding:0}
  .main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--brand-ink);font-weight:600}
  h1{font-size:24px}.lh h1{font-size:25px}
  .formula{grid-template-columns:1fr}.formula .note{grid-column:1}
  .brk-row{grid-template-columns:100px 1fr 50px}
  .qcard{padding:16px}
  .stage{border-right:0;border-bottom:1px solid var(--line)}
}
.more-menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more-menu button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:left}
.more-menu svg{width:20px;height:20px;color:var(--brand-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.dg-card svg{max-width:470px}
.lesson-side .btn.ghost{justify-content:flex-start;text-align:left}
</style>

<script type="application/json" id="econ-data">{"lessons":[{"id":"m1","unit":"micro","title_zh":"经济学基础与生产可能性","title_en":"Basic Economic Concepts & the PPC","level":"G8+","summary":"经济学研究在稀缺 (scarcity) 条件下如何做选择。本课介绍机会成本、生产可能性曲线 (PPC)、边际分析与经济体制，并用比较优势 (comparative advantage) 解释为什么专业化与贸易能让双方都获益。","concepts":[{"zh":"稀缺性","en":"Scarcity","def":"资源有限而人类欲望无限，因此必须做出选择；稀缺性是经济学存在的根本原因。"},{"zh":"机会成本","en":"Opportunity Cost","def":"做出某一选择时所放弃的次优选择的价值，包括显性支出和隐性（被放弃的收入、时间等）。"},{"zh":"生产可能性曲线","en":"Production Possibility Curve (PPC)","def":"在资源和技术给定、充分有效利用时，一个经济体能生产的两种商品最大组合的轨迹。"},{"zh":"机会成本递增","en":"Increasing Opportunity Cost","def":"资源并非同等适合生产两种商品，多生产一种商品需放弃越来越多另一种商品，使 PPC 向外凸 (bowed out)。"},{"zh":"边际分析","en":"Marginal Analysis","def":"比较多做一单位活动的边际收益 (MB) 与边际成本 (MC)；只要 MB ≥ MC 就继续，最优点在 MB = MC 附近。"},{"zh":"绝对优势","en":"Absolute Advantage","def":"用同样资源生产更多某商品（或生产同量所需资源更少）的能力。"},{"zh":"比较优势","en":"Comparative Advantage","def":"以更低的机会成本生产某商品的能力；贸易的收益来自比较优势而非绝对优势。"},{"zh":"贸易条件","en":"Terms of Trade","def":"两种商品交换的比率；互利的贸易条件必须位于双方国内机会成本之间。"},{"zh":"经济体制","en":"Economic Systems","def":"解决“生产什么、如何生产、为谁生产”的制度安排：市场经济、计划（指令）经济、混合经济与传统经济。"}],"formulas":[{"name":"机会成本（线性 PPC）","f":"OC of 1 X = 放弃的 Y 数量 ÷ 增加的 X 数量","note":"即 PPC 斜率的绝对值；两国比较同一商品的 OC 来判断比较优势。"},{"name":"互利贸易条件","f":"OC_A(X) < 贸易价格 (以 Y 计的 1 单位 X) < OC_B(X)","note":"价格落在两国机会成本之间，双方都能获益。"},{"name":"最优决策规则","f":"继续直到 MB = MC","note":"离散数据时：选择最后一个 MB ≥ MC 的单位。"}],"sections":[{"h":"稀缺、选择与机会成本","body":"每个经济主体都面临**稀缺性**，因此每个选择都有**机会成本 (opportunity cost)**：放弃的次优选项的价值。\n例：小林周六可以打工 3 小时（时薪 $15）或花 $40 去看演唱会。看演唱会的机会成本 = 门票 $40 + 放弃的工资 3×$15 = **$85**。\n- 沉没成本 (sunk cost) 已经无法收回，不应影响当前决策。\n- 理性决策看的是**边际**：再多一单位的 MB 是否 ≥ MC。"},{"h":"生产可能性曲线 (PPC)","body":"PPC 上的点代表**生产效率 (productive efficiency)**；曲线内部的点表示失业或资源浪费；曲线外的点在当前资源技术下**不可达**。\n- **形状**：资源专用性导致机会成本递增，PPC 向外凸；若资源完全可替代，机会成本不变，PPC 为直线。\n- **移动**：资源增加、技术进步、劳动力素质提高使 PPC 外移；只影响一种商品的技术进步使 PPC 沿该轴**旋转 (pivot)** 外移。\n- 沿 PPC 移动（改变产品组合）≠ PPC 移动。\n- 今天多生产资本品 (capital goods)，未来 PPC 外移更多——这是当前消费与未来增长之间的权衡。"},{"h":"绝对优势 vs 比较优势","body":"假设 1 个工作日：X 国可生产 8 吨小麦或 4 匹布；Y 国可生产 3 吨小麦或 3 匹布。\n- X 国在两种商品上都有**绝对优势**。\n- 布的机会成本：X 国 1 布 = 8/4 = **2 小麦**；Y 国 1 布 = 3/3 = **1 小麦**。所以 Y 国在布上有**比较优势**，X 国在小麦上有比较优势（X 国 1 小麦 = 0.5 布 < Y 国 1 小麦 = 1 布）。\n- 只要机会成本不同，专业化 (specialization) 加贸易就能让世界总产量增加。\n- 互利贸易条件：1 布换 **1 到 2 吨小麦**之间，例如 1 布 = 1.5 小麦。"},{"h":"贸易收益的计算套路 (IEO 常考)","body":"1. 把产出表转换成**机会成本表**（注意题目给的是“单位产量”还是“单位所需工时”，两者要倒过来算）。\n2. 比较同一商品的机会成本，低者专业化该商品。\n3. 确定贸易条件区间，选一个价格，算出各国交换后的消费组合。\n4. 与自给自足 (autarky) 时同样数量的另一商品相比，差额即**贸易收益 (gains from trade)**。\n多人合作（联合 PPC）时，同样按机会成本从低到高依次分配生产任务，得到向外凸的分段线性联合 PPC。"},{"h":"经济体制","body":"- **市场经济**：由价格信号和私有产权协调，“看不见的手”引导资源配置。\n- **计划经济 (command economy)**：政府中央计划决定生产与分配，容易出现信息与激励问题。\n- **混合经济**：现实中多数国家是市场为主、政府干预（公共品、再分配、规制）为辅。\n- **传统经济**：由习俗和传统决定。"}],"pitfalls":["把绝对优势当成贸易的依据——即使一国在所有商品上都更高效，仍可通过比较优势获益。","题目给的是“生产 1 单位所需工时”时，直接用这些数字当产量计算机会成本，导致结论完全颠倒。","混淆沿 PPC 移动（改变产出组合）与 PPC 整体移动（生产能力变化）。","计算机会成本时忽略隐性成本（如放弃的工资），或错误地把沉没成本计入决策。","贸易条件取在两国机会成本区间之外，结果其中一国反而受损。"],"exams":{"AP":"Micro Unit 1 (1.1–1.5)","IB":"1.1–1.2; 4.1 (comparative advantage)","AL":"9708 AS 1; AS 6 (specialisation & trade)","IEO":"Scarcity, specialization & gains from trade","NEC":"Fundamentals; International"},"diagram":"ppc"},{"id":"m2","unit":"micro","title_zh":"供给与需求","title_en":"Supply & Demand","level":"G8+","summary":"供求模型是微观经济学最核心的工具。本课区分“曲线移动”与“沿曲线移动”，求解线性供求均衡，计算消费者剩余与生产者剩余，并分析供求同时变化时价格和数量的确定与不确定。","concepts":[{"zh":"需求定理","en":"Law of Demand","def":"其他条件不变 (ceteris paribus)，价格上升，需求量下降；源于替代效应和收入效应。"},{"zh":"需求量 vs 需求","en":"Quantity Demanded vs Demand","def":"本商品价格变化只引起沿需求曲线移动（需求量变化）；其他决定因素变化才使整条需求曲线移动。"},{"zh":"需求决定因素","en":"Determinants of Demand","def":"收入、相关商品价格（替代品/互补品）、偏好、预期、买者数量。"},{"zh":"供给决定因素","en":"Determinants of Supply","def":"投入品价格、技术、相关商品价格、税收与补贴、预期、卖者数量。"},{"zh":"市场均衡","en":"Market Equilibrium","def":"Qd = Qs 时的价格与数量；此时市场出清，无短缺也无过剩。"},{"zh":"短缺与过剩","en":"Shortage & Surplus","def":"价格低于均衡时 Qd > Qs 为短缺；价格高于均衡时 Qs > Qd 为过剩。"},{"zh":"消费者剩余","en":"Consumer Surplus (CS)","def":"消费者愿意支付的最高价格与实际支付价格之差的总和，即需求曲线以下、价格线以上的面积。"},{"zh":"生产者剩余","en":"Producer Surplus (PS)","def":"实际收到的价格与最低愿意接受价格（边际成本）之差的总和，即价格线以下、供给曲线以上的面积。"},{"zh":"市场需求的水平加总","en":"Horizontal Summation","def":"市场需求 = 在每一价格上把所有个人需求量相加（横向相加），供给同理。"}],"formulas":[{"name":"线性需求/供给","f":"Qd = a − bP；Qs = c + dP","note":"b, d > 0。"},{"name":"均衡价格","f":"P* = (a − c) ÷ (b + d)","note":"代回任一方程得 Q*。"},{"name":"消费者剩余（线性）","f":"CS = ½ × (P_max − P*) × Q*","note":"P_max 为需求曲线在价格轴上的截距 (choke price)。"},{"name":"生产者剩余（线性）","f":"PS = ½ × (P* − P_min) × Q*","note":"P_min 为供给曲线的价格截距。"}],"sections":[{"h":"需求与供给：移动 vs 沿曲线移动","body":"本商品**自身价格**变化 → 沿曲线移动（需求量/供给量变化）。\n其他因素变化 → 曲线**整体移动**：\n- 需求右移：收入上升（正常品）、替代品涨价、互补品降价、偏好增强、预期未来涨价、买者增多。\n- 供给右移：投入品降价、技术进步、补贴、卖者增多；税收和投入品涨价使供给左移。\n例：汽油大幅涨价，大型 SUV（互补品）的**需求左移**，SUV 的均衡价格和数量都下降。"},{"h":"线性均衡求解（含数值例）","body":"设 Qd = 120 − 4P，Qs = −30 + 6P。\n令 Qd = Qs：120 − 4P = −30 + 6P → 10P = 150 → **P* = 15，Q* = 60**。\n需求价格截距：Qd = 0 时 P = 30；供给价格截距：Qs = 0 时 P = 5。\n- CS = ½ × (30 − 15) × 60 = **450**\n- PS = ½ × (15 − 5) × 60 = **300**\n- 总剩余 = 750，竞争均衡时总剩余最大（配置效率 allocative efficiency）。\n若价格定在 P = 12：Qd = 72，Qs = 42，出现 30 单位**短缺**，价格有上升压力。"},{"h":"供求同时变化","body":"两条曲线同时移动时，总有一个变量方向**不确定 (indeterminate)**，取决于移动幅度：\n- D↑ 且 S↑：Q 上升，P 不确定。\n- D↑ 且 S↓：P 上升，Q 不确定。\n- D↓ 且 S↑：P 下降，Q 不确定。\n- D↓ 且 S↓：Q 下降，P 不确定。\n反推题：若观察到“价格上升、数量下降”，最简单的解释是**供给减少**（或供给减少幅度大于需求变化）。"},{"h":"从个人到市场：水平加总","body":"若有 100 个相同消费者，每人 q = 10 − 2P，则市场需求 Qd = 100 × (10 − 2P) = 1000 − 200P。注意是**数量相加**，而不是价格相加。\n竞赛题常把个人需求/厂商供给与均衡计算结合，并要求算剩余变化；做题时先写出市场方程，再解均衡。"}],"pitfalls":["说“价格上升导致需求减少”——应为“需求量减少”，需求曲线本身并未移动。","把“价格上升”当作供给曲线右移的原因（混淆供给量与供给）。","供求同时移动时给出确定的价格和数量方向，忽略其中一个是不确定的。","计算市场需求时把个人需求曲线“竖着加”（价格相加）。","计算 CS 时用数量截距代替价格截距，或忘记乘 ½。"],"exams":{"AP":"Micro Unit 2 (2.1–2.6)","IB":"2.1–2.3","AL":"9708 AS 2","IEO":"Competitive markets","NEC":"Micro core"},"diagram":"sd"},{"id":"m3","unit":"micro","title_zh":"弹性","title_en":"Elasticity","level":"G9+","summary":"弹性衡量一个变量对另一个变量变化的敏感程度。本课讲解需求价格弹性 (PED) 的中点公式与总收益检验、供给价格弹性 (PES)、收入弹性 (YED) 与交叉弹性 (XED)，并说明弹性如何决定税负归宿。","concepts":[{"zh":"需求价格弹性","en":"Price Elasticity of Demand (PED)","def":"需求量变化百分比与价格变化百分比之比；通常取绝对值，|PED| > 1 为富有弹性，< 1 为缺乏弹性。"},{"zh":"中点公式","en":"Midpoint (Arc) Method","def":"用变化前后的平均值作分母计算百分比变化，使涨价与降价得到相同弹性值。"},{"zh":"总收益检验","en":"Total Revenue Test","def":"需求富有弹性时价格与总收益反向变动；缺乏弹性时同向变动；单位弹性时总收益不变。"},{"zh":"供给价格弹性","en":"Price Elasticity of Supply (PES)","def":"供给量变化百分比与价格变化百分比之比；时间越长、闲置产能与库存越多，PES 越大。"},{"zh":"需求收入弹性","en":"Income Elasticity of Demand (YED)","def":"YED > 0 为正常品（0–1 必需品，> 1 奢侈品）；YED < 0 为劣等品 (inferior good)。"},{"zh":"需求交叉弹性","en":"Cross-Price Elasticity (XED)","def":"X 的需求量对 Y 价格变化的反应；XED > 0 为替代品，XED < 0 为互补品，≈ 0 为无关商品。"},{"zh":"弹性决定因素","en":"Determinants of PED","def":"替代品多少、占收入比重、必需品还是奢侈品、市场定义宽窄、时间长短。"},{"zh":"点弹性","en":"Point Elasticity","def":"线性需求 Q = a − bP 上某点的弹性 = −b × P/Q；同一条直线上沿曲线向上弹性越来越大。"}],"formulas":[{"name":"需求价格弹性（中点）","f":"PED = [(Q₂ − Q₁) ÷ ((Q₁ + Q₂)/2)] ÷ [(P₂ − P₁) ÷ ((P₁ + P₂)/2)]","note":"结果为负，比较大小时取绝对值。"},{"name":"点弹性（线性需求）","f":"PED = (ΔQ/ΔP) × (P/Q) = −b × P/Q","note":"中点处 |PED| = 1，此时总收益最大。"},{"name":"收入弹性","f":"YED = %ΔQd ÷ %ΔIncome","note":"看符号判断正常品/劣等品。"},{"name":"交叉弹性","f":"XED = %ΔQd_X ÷ %ΔP_Y","note":"看符号判断替代品/互补品。"},{"name":"供给价格弹性","f":"PES = %ΔQs ÷ %ΔP","note":"过原点的线性供给曲线 PES = 1。"},{"name":"税负分担","f":"消费者承担比例 = PES ÷ (PES + |PED|)","note":"谁更缺乏弹性，谁承担更多税负。"}],"sections":[{"h":"需求价格弹性与中点公式","body":"例：价格从 $10 升到 $12，需求量从 100 降到 80。\n- %ΔQ = −20 ÷ 90 ≈ −22.2%\n- %ΔP = 2 ÷ 11 ≈ 18.2%\n- PED ≈ −1.22，|PED| > 1，**富有弹性 (elastic)**。\n若用简单百分比（以初始值为分母）会得到 −20% ÷ 20% = −1.0，结论就错了——这正是考试常设的陷阱。\n**完全无弹性**（竖直需求线，|PED| = 0）与**完全弹性**（水平需求线，|PED| = ∞）是两个极端。"},{"h":"总收益检验 (Total Revenue Test)","body":"TR = P × Q。\n- 富有弹性：降价 → TR 上升；涨价 → TR 下降。\n- 缺乏弹性：涨价 → TR 上升（如香烟、胰岛素）。\n- 单位弹性：TR 不变。\n对线性需求 Q = 100 − 2P：在 P = 30 时 Q = 40，点弹性 = −2 × 30/40 = −1.5（富有弹性），降价能提高 TR；TR 在 P = 25（直线中点）处达到最大。"},{"h":"收入弹性与交叉弹性","body":"- 收入增加 10%，公交出行次数减少 15%：YED = −1.5 → **劣等品**。\n- 收入增加 10%，海外旅游增加 25%：YED = 2.5 → **奢侈品**。\n- 咖啡涨价 20%，茶的需求量上升 8%：XED = +0.4 → **替代品**。\n- 打印机涨价 20%，墨盒需求量下降 10%：XED = −0.5 → **互补品**。\n企业用 YED 预测经济周期中的销量变化，用 XED 判断竞争对手与配套产品。"},{"h":"供给弹性与税负归宿","body":"**PES** 受时间（短期 < 长期）、闲置产能、库存、要素流动性影响。\n**税负归宿 (tax incidence)** 与法定纳税人无关，只取决于相对弹性：\n消费者承担比例 = PES ÷ (PES + |PED|)。\n例：PED = −0.5，PES = 1.5，每单位税 $4 → 消费者承担 1.5/2.0 = 75%，即 **$3**，生产者承担 $1。\n需求越缺乏弹性，政府从该商品征税带来的数量扭曲（无谓损失）越小，这也是烟酒税常见的原因之一。"}],"pitfalls":["把线性需求曲线的斜率当作弹性——同一条直线上各点弹性不同。","不用中点公式，导致涨价、降价两个方向算出的弹性不一致。","YED、XED 只看大小不看符号；符号恰恰决定商品类型。","认为“对卖方征税就由卖方承担”——实际归宿由弹性决定。","认为富有弹性时涨价能增加总收益（方向记反）。"],"exams":{"AP":"Micro Unit 2 (2.3 Elasticity)","IB":"2.5–2.6","AL":"9708 AS 2 (PED, YED, XED, PES)","IEO":"Markets & elasticity","NEC":"Micro core"},"diagram":null},{"id":"m4","unit":"micro","title_zh":"政府干预市场","title_en":"Government Intervention in Markets","level":"G9+","summary":"政府常通过价格上限、价格下限、从量税、补贴和配额干预市场。本课用线性供求模型定量分析这些政策对价格、数量、剩余、政府收支与无谓损失 (DWL) 的影响，并推导税负分担。","concepts":[{"zh":"价格上限","en":"Price Ceiling","def":"法定最高价格；只有低于均衡价格时才有约束力 (binding)，导致短缺、排队、黑市。"},{"zh":"价格下限","en":"Price Floor","def":"法定最低价格；只有高于均衡价格时才有约束力，导致过剩，如最低工资造成劳动力过剩（失业）。"},{"zh":"从量税","en":"Per-unit (Specific) Tax","def":"对每单位商品征收固定金额的税，使供给曲线向上移动税额的距离（或需求曲线向下移动）。"},{"zh":"补贴","en":"Subsidy","def":"政府对每单位产出给予的支付，使供给曲线下移；消费者价格下降，生产者实得价格上升。"},{"zh":"配额","en":"Quota","def":"对数量设定上限；低于均衡数量时抬高价格，产生配额租金 (quota rent)。"},{"zh":"无谓损失","en":"Deadweight Loss (DWL)","def":"因产量偏离有效水平而损失且无人获得的总剩余，线性模型中通常是三角形面积。"},{"zh":"税负归宿","en":"Tax Incidence","def":"税负在买卖双方之间的实际分担，与法律规定由谁缴税无关。"},{"zh":"税收楔子","en":"Tax Wedge","def":"消费者支付价格与生产者实得价格之间的差额，等于单位税额。"}],"formulas":[{"name":"从量税后的均衡","f":"Qd(P_c) = Qs(P_c − t)","note":"P_c 为消费者支付价，P_s = P_c − t 为生产者实得价。"},{"name":"税收收入","f":"Tax revenue = t × Q_t","note":"Q_t 为税后数量。"},{"name":"无谓损失（线性）","f":"DWL = ½ × t × (Q* − Q_t)","note":"补贴时 DWL = ½ × s × (Q_s − Q*)。"},{"name":"补贴的政府支出","f":"Cost = s × Q_s","note":"Q_s 为补贴后数量。"},{"name":"线性模型税后数量","f":"Q_t = Q* − t × b × d ÷ (b + d)","note":"Qd = a − bP，Qs = c + dP；据此可推出收入最大化税率。"}],"sections":[{"h":"价格上限与价格下限","body":"设 Qd = 200 − 10P，Qs = 20P − 40，均衡 P* = 8，Q* = 120。\n若设价格上限 P = 6：Qd = 140，Qs = 80，**短缺 60 单位**；实际成交量只有 80（取供给侧），配置效率丧失，产生 DWL，还可能出现排队、黑市和质量下降。\n价格下限（如农产品保护价、最低工资）高于均衡时产生**过剩**；政府若承诺收购过剩产品，还需承担财政成本。\n注意：高于均衡的上限、低于均衡的下限**没有约束力**，市场照常在均衡处运行。"},{"h":"从量税：完整数值例","body":"设 Qd = 100 − P，Qs = P − 20，均衡 P* = 60，Q* = 40。对卖方征 t = $10：\n- 新供给：Qs = (P − 10) − 20 → 100 − P = P − 30 → **P_c = 65，Q = 35**，P_s = 55。\n- 消费者承担 $5，生产者承担 $5（两条线斜率绝对值相同）。\n- 税收 = 10 × 35 = **$350**；DWL = ½ × 10 × (40 − 35) = **$25**。\n若改为对买方征税，市场标价变为 55，但买方总成本仍为 65、卖方仍得 55——**结果完全相同**。"},{"h":"补贴与配额","body":"**补贴** s = $6（同一市场）：Qs = P + 6 − 20 → 100 − P = P − 14 → 消费者价 **$57**，生产者实得 $63，Q = 43。政府支出 = 6 × 43 = **$258**；DWL = ½ × 6 × 3 = $9（生产了 MC > MB 的单位）。\n**配额** Q = 30：消费者价由需求决定 = 70，供给价 = 50，每单位配额租金 20，总租金 $600，归持有配额许可的一方；DWL = ½ × 20 × 10 = $100。"},{"h":"税率与税收收入（竞赛延伸）","body":"在上述市场中，税后数量 Q_t = (80 − t)/2，税收 R(t) = t(80 − t)/2。\n- R 在 t = 40 时最大，R = $800；税率再高，数量萎缩使收入下降（类似**拉弗曲线**思想）。\n- DWL = ½ × t × (t/2) 随 t 的**平方**增长：税率翻倍，DWL 约变为 4 倍。\n政策权衡：对缺乏弹性的商品征税，扭曲小、收入稳定，但往往更具累退性 (regressive)。"}],"pitfalls":["把价格上限画在均衡价格之上仍说会产生短缺——没有约束力的上限不改变结果。","征税后用消费者价格代入供给方程（应代入 P_c − t）。","把税收收入或配额租金误算作无谓损失。","认为补贴一定提高社会福利——在无外部性的竞争市场中补贴产生 DWL。","价格上限下的成交量取需求量——实际成交量为较小的供给量。"],"exams":{"AP":"Micro Unit 2 (2.8 Government intervention)","IB":"2.7","AL":"9708 AS 3","IEO":"Government & markets","NEC":"Micro core"},"diagram":"tax"},{"id":"m5","unit":"micro","title_zh":"消费者选择与行为经济学","title_en":"Consumer Choice & Behavioral Economics","level":"G10+","summary":"本课从效用出发解释需求曲线：边际效用递减、效用最大化法则 MU/P、预算约束、收入效应与替代效应以及无差异曲线分析；最后介绍行为经济学对“理性人”假设的修正，如锚定效应、损失厌恶、现时偏好与助推 (nudge)。","concepts":[{"zh":"总效用与边际效用","en":"Total & Marginal Utility","def":"总效用 (TU) 是消费带来的总满足；边际效用 (MU) 是多消费一单位带来的 TU 增量。"},{"zh":"边际效用递减","en":"Diminishing Marginal Utility","def":"随着消费量增加，每多一单位带来的额外满足逐渐下降。"},{"zh":"效用最大化法则","en":"Utility-Maximizing Rule","def":"在预算用尽时，使每种商品每一美元的边际效用相等：MU_X/P_X = MU_Y/P_Y。"},{"zh":"预算约束线","en":"Budget Constraint","def":"P_X·X + P_Y·Y = I，表示收入全部花完时能买的组合；斜率为 −P_X/P_Y（X 在横轴）。"},{"zh":"无差异曲线","en":"Indifference Curve","def":"给消费者带来相同效用的商品组合的轨迹；通常向下倾斜、凸向原点，斜率为边际替代率 (MRS)。"},{"zh":"替代效应与收入效应","en":"Substitution & Income Effects","def":"价格变化引起的需求量变化可分解为相对价格变化带来的替代效应和实际收入变化带来的收入效应。"},{"zh":"吉芬商品","en":"Giffen Good","def":"极强劣等品，收入效应超过替代效应，使价格上升需求量反而上升；现实中极为罕见。"},{"zh":"有限理性","en":"Bounded Rationality","def":"人受信息、时间和认知能力限制，常用经验法则 (heuristics) 做“足够好”的决策。"},{"zh":"损失厌恶","en":"Loss Aversion","def":"损失带来的痛苦大于同等收益带来的快乐，导致禀赋效应和维持现状偏好。"},{"zh":"助推","en":"Nudge / Choice Architecture","def":"在不禁止任何选项、不显著改变经济激励的前提下，通过改变选择呈现方式（如默认选项）引导行为。"}],"formulas":[{"name":"边际效用","f":"MU = ΔTU ÷ ΔQ","note":"表格题逐行相减。"},{"name":"效用最大化条件","f":"MU_X ÷ P_X = MU_Y ÷ P_Y，且 P_X·X + P_Y·Y = I","note":"若 MU_X/P_X > MU_Y/P_Y，应多买 X、少买 Y。"},{"name":"预算线斜率","f":"slope = −P_X ÷ P_Y","note":"X 在横轴；收入变化平移预算线，价格变化使其旋转。"},{"name":"最优点（无差异曲线）","f":"MRS = MU_X ÷ MU_Y = P_X ÷ P_Y","note":"对 U = X·Y，得 X = I ÷ (2P_X)，Y = I ÷ (2P_Y)。"}],"sections":[{"h":"边际效用与效用最大化","body":"消费者把每一美元花在“每美元边际效用 (MU/P)”最高的地方，直到各商品 MU/P 相等且预算用完。\n例：收入 $10，P_X = $2，P_Y = $1。X 前 4 单位的 MU 为 16、12、8、4；Y 前 6 单位的 MU 为 10、8、6、4、3、2。\n- 每美元 MU：X 为 8、6、4、2；Y 为 10、8、6、4、3、2。\n- 依次购买每美元 MU 最高的单位，最终买 **3 单位 X、4 单位 Y**（花费 6 + 4 = 10），此时 MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1，总效用 64，为所有可负担组合中最高。"},{"h":"预算线与无差异曲线 (A-Level/IEO)","body":"预算线：P_X·X + P_Y·Y = I。收入 $60，P_X = 3，P_Y = 6：横截距 20，纵截距 10，斜率 −0.5。\n无差异曲线凸向原点，反映边际替代率递减；最优点在无差异曲线与预算线**相切**处：MRS = P_X/P_Y。\n对效用函数 U = XY：MU_X = Y，MU_Y = X，相切条件 Y/X = P_X/P_Y，得 X = I/(2P_X)。例如 I = 120，P_X = 2，P_Y = 4 → **X = 30，Y = 15**。"},{"h":"收入效应与替代效应","body":"价格下降时：\n- **替代效应**总是使该商品需求量上升（它相对变便宜了）。\n- **收入效应**：正常品需求量上升；劣等品需求量下降。\n- 劣等品通常替代效应占主导，需求曲线仍向下倾斜；只有收入效应超过替代效应的吉芬商品需求曲线才向上倾斜。\n竞赛延伸（希克斯分解，保持效用不变）：U = XY，I = 120，P_Y = 4，P_X 由 2 升到 4：X 从 30 降到 15。在新价格下保持原效用 450 的补偿组合 X = √450 ≈ 21.2，所以替代效应 ≈ −8.8，收入效应 ≈ −6.2。"},{"h":"行为经济学","body":"传统模型假设理性、自利、信息完全；行为经济学发现系统性偏差：\n- **锚定效应 (anchoring)**：受先看到的数字影响，如“原价 $299，现价 $149”。\n- **损失厌恶 (loss aversion)** 与**禀赋效应 (endowment effect)**：对已拥有物品估价更高。\n- **现时偏好 (present bias)**／双曲贴现：今天偏好即时回报，但对遥远未来却愿意等待，造成时间不一致 (time inconsistency)，如拖延、储蓄不足。\n- **框架效应 (framing)**：“90% 存活率”比“10% 死亡率”更易被接受。\n- **助推 (nudge)**：养老金自动加入 (auto-enrollment) 作为默认选项，大幅提高参与率而不限制选择自由。"}],"pitfalls":["只比较 MU 大小而不除以价格；正确依据是每美元边际效用 MU/P。","认为总效用下降才是边际效用递减——MU 递减时 TU 仍可能上升。","把所有劣等品都当成吉芬商品；劣等品的需求曲线通常仍向下倾斜。","预算线斜率写成 −P_Y/P_X（横纵轴搞反）。","把助推理解为强制或罚款——助推保留全部选择自由。"],"exams":{"AP":"Micro Unit 1 (1.6 Marginal analysis & consumer choice)","IB":"2.4 (behavioural economics)","AL":"9708 A2 7 (utility, indifference curves, budget lines)","IEO":"Consumer choice & behavioural economics","NEC":"Micro"},"diagram":null},{"id":"m6","unit":"micro","title_zh":"生产与成本","title_en":"Production & Costs","level":"G9+","summary":"本课研究厂商如何把投入变成产出，以及产量变化时各类成本如何变动。短期内至少一种要素固定，边际收益递减决定了成本曲线的形状；长期内所有要素可变，规模经济与规模不经济决定长期平均成本曲线。最后区分会计利润与经济利润，为学习市场结构打基础。","concepts":[{"zh":"短期","en":"Short run","def":"至少有一种生产要素（通常是资本/厂房）固定不变的时期；并非指具体的日历时间。"},{"zh":"总产量/边际产量/平均产量","en":"TP / MP / AP","def":"TP 为给定劳动量下的总产出；MP = ΔTP/ΔL 为多雇一单位劳动带来的额外产出；AP = TP/L。"},{"zh":"边际收益递减规律","en":"Law of Diminishing Marginal Returns","def":"在其他要素固定时，不断增加一种可变要素，其边际产量最终会下降。它是短期概念。"},{"zh":"固定成本与可变成本","en":"Fixed Cost (FC) & Variable Cost (VC)","def":"FC 不随产量变化（即使产量为 0 也要支付，如租金）；VC 随产量变化（如原材料、计时工资）。TC = FC + VC。"},{"zh":"边际成本","en":"Marginal Cost (MC)","def":"多生产一单位产品带来的总成本增量，MC = ΔTC/ΔQ = ΔVC/ΔQ。"},{"zh":"平均成本","en":"AFC / AVC / ATC","def":"AFC = FC/Q（持续下降）；AVC = VC/Q；ATC = TC/Q = AFC + AVC。"},{"zh":"规模经济","en":"Economies of Scale","def":"长期中所有投入按比例扩大时，长期平均成本 (LRATC) 下降的现象，来源于专业分工、大宗采购、技术不可分性等。"},{"zh":"规模不经济","en":"Diseconomies of Scale","def":"企业过大导致协调、沟通与激励问题，使 LRATC 上升。"},{"zh":"最小有效规模","en":"Minimum Efficient Scale (MES)","def":"LRATC 首次达到最低点时的产量；MES 相对于市场需求越大，行业越可能集中（甚至形成自然垄断）。"},{"zh":"经济利润","en":"Economic Profit","def":"总收益减去全部机会成本（显性成本 + 隐性成本）；经济利润为 0 称为正常利润 (normal profit)。"}],"formulas":[{"name":"边际产量与平均产量","f":"MP_L = ΔTP/ΔL ;  AP_L = TP/L","note":"MP > AP 时 AP 上升；MP < AP 时 AP 下降；MP 穿过 AP 的最高点。"},{"name":"总成本","f":"TC = FC + VC","note":"产量为 0 时 TC = FC。"},{"name":"平均成本","f":"ATC = TC/Q = AFC + AVC","note":"ATC 与 AVC 的垂直距离等于 AFC，随 Q 增大而缩小。"},{"name":"边际成本","f":"MC = ΔTC/ΔQ = ΔVC/ΔQ","note":"固定成本不影响 MC。若 TC 为函数，MC 为其导数。"},{"name":"MC 与 MP 的关系","f":"MC = w ÷ MP_L","note":"工资 w 不变时，MP 上升则 MC 下降；边际收益递减使 MC 上升。"},{"name":"利润","f":"经济利润 = TR − 显性成本 − 隐性成本 ;  会计利润 = TR − 显性成本","note":"隐性成本包括业主放弃的工资、自有资金的利息等。"}],"sections":[{"h":"短期生产：边际收益递减","body":"短期内厂房固定，厂商只能通过增加工人来扩大产出。起初由于**专业化分工**，每多雇一名工人带来的**边际产量 (MP)** 可能上升；但随着越来越多工人挤在同样的设备上，MP 最终会下降——这就是**边际收益递减规律**。\n数值例子：某面包店工人数 L = 0,1,2,3,4 时，总产量 TP = 0,10,25,35,40。\n- MP 依次为 10、15、10、5：从第 3 名工人开始边际收益递减。\n- AP 依次为 10、12.5、11.7、10：当 MP > AP 时 AP 上升，MP < AP 时 AP 下降。\n注意：边际收益递减 ≠ 总产量下降。只有 MP < 0 时 TP 才下降。"},{"h":"短期成本曲线家族","body":"由于工资不变时 **MC = w ÷ MP**，MP 先升后降就意味着 **MC 先降后升**，呈 U 形（通常画成“对勾”形）。\n- **AFC** 随产量增加一直下降（固定成本被摊薄）。\n- **AVC、ATC** 呈 U 形；ATC 在 AVC 上方，二者距离等于 AFC，越来越小。\n- **MC 从下方穿过 AVC 和 ATC 的最低点**：只要边际值低于平均值，平均值就被拉低；边际值高于平均值，平均值就被拉高（类比：新考试成绩低于平均分会拉低平均分）。\n- 由于 AVC 最低点对应的产量小于 ATC 最低点对应的产量，MC 先穿过 AVC 的最低点，再穿过 ATC 的最低点。\n数值例子：FC = 50，Q = 1…5 时 TC = 80, 100, 114, 136, 170。MC = 30, 20, 14, 22, 34；AVC = 30, 25, 21.3, 21.5, 24。Q = 3 时 AVC 最低，此后 MC(22) 高于 AVC，AVC 开始上升。"},{"h":"长期：规模经济与 LRATC","body":"长期内所有投入都可变，厂商可以选择厂房规模。**长期平均成本曲线 (LRATC)** 是各种短期 ATC 曲线的“包络线”。\n- **规模经济**（LRATC 下降）：技术性（大型机器更高效）、管理性（专业经理人）、采购性（批量折扣）、融资性（大企业借款利率低）。\n- **规模报酬不变**：LRATC 水平段。\n- **规模不经济**（LRATC 上升）：层级过多、沟通协调困难、员工积极性下降。\n**区分**：边际收益递减是**短期**现象（有固定要素）；规模经济/不经济是**长期**现象（所有要素同比变化）。竞赛题常用这一点设陷阱。"},{"h":"会计利润 vs 经济利润","body":"经济学家衡量成本时计入**机会成本**。\n例：小李辞去年薪 12 万元的工作开咖啡店，投入自有资金 20 万元（本可获 5% 利息）。年收入 50 万元，房租、原料、员工工资等显性成本 30 万元。\n- 会计利润 = 50 − 30 = 20 万元。\n- 隐性成本 = 12 + 20×5% = 13 万元。\n- 经济利润 = 20 − 13 = 7 万元 > 0，说明开店比次优选择更好。\n经济利润为 0 时，厂商仍获得**正常利润**——即恰好补偿了所有机会成本，因此没有动力退出行业。"}],"pitfalls":["把“边际收益递减”说成“总产量下降”——MP 下降时 TP 仍可能上升。","混淆边际收益递减（短期）与规模不经济（长期）。","认为固定成本会影响边际成本或短期产量决策——MC 只取决于可变成本。","画图时 MC 穿过 ATC/AVC 的位置错误：必须穿过它们的最低点。","计算经济利润时漏掉隐性成本（放弃的工资、自有资金利息）。"],"exams":{"AP":"Micro Unit 3 (3.1–3.4)","IB":"2.13 HL (production & costs)","AL":"9708 A2 7.5","IEO":"Firms, technology & costs","NEC":"Micro: production & costs"},"diagram":"costs"},{"id":"m7","unit":"micro","title_zh":"市场结构","title_en":"Market Structures","level":"G10+","summary":"本课按竞争程度比较完全竞争、垄断竞争、寡头和垄断四种市场结构。所有厂商都按 MR = MC 选择利润最大化产量，但不同结构下价格、效率和长期利润截然不同。还将学习价格歧视、市场集中度指标以及自然垄断的管制。","concepts":[{"zh":"完全竞争","en":"Perfect Competition","def":"大量厂商、同质产品、自由进出、信息完全；单个厂商是价格接受者 (price taker)，P = MR = AR。"},{"zh":"停业规则","en":"Shutdown Rule","def":"短期内若 P < AVC 最低点，厂商应停产（损失仅为 FC）；若 AVC ≤ P < ATC，继续生产以弥补部分固定成本。"},{"zh":"垄断","en":"Monopoly","def":"单一卖者、无相近替代品、进入壁垒高；面对向下倾斜的需求曲线，MR < P。"},{"zh":"无谓损失","en":"Deadweight Loss (DWL)","def":"因产量低于社会最优（P = MC）而损失的总剩余。"},{"zh":"价格歧视","en":"Price Discrimination","def":"对同一产品向不同消费者收取不同价格，且差价并非由成本差异引起。一级：每单位按保留价格收费；三级：按群体分市场定价。"},{"zh":"垄断竞争","en":"Monopolistic Competition","def":"大量厂商、差异化产品、自由进出；长期 P = ATC，但 P > MC，存在过剩产能 (excess capacity)。"},{"zh":"寡头","en":"Oligopoly","def":"少数大厂商主导市场，决策相互依赖；可能出现卡特尔 (cartel)、价格领导或价格战。"},{"zh":"折弯需求曲线","en":"Kinked Demand Curve","def":"竞争对手跟降不跟涨，使需求在现价处折弯、MR 出现间断，从而解释寡头价格刚性。"},{"zh":"可竞争市场","en":"Contestable Market","def":"进入和退出无沉没成本的市场；即使只有少数厂商，潜在进入威胁也迫使其定价接近平均成本。"},{"zh":"赫芬达尔指数","en":"Herfindahl–Hirschman Index (HHI)","def":"各厂商市场份额（百分数）平方之和，最高 10000（纯垄断）；美国司法部通常视 HHI > 2500 为高度集中（2023 年指引为 > 1800）。"}],"formulas":[{"name":"利润最大化条件","f":"MR = MC（且 MC 从下向上穿过 MR）","note":"适用于所有市场结构。完全竞争中即 P = MC。"},{"name":"线性需求的边际收益","f":"若 P = a − bQ，则 MR = a − 2bQ","note":"MR 与需求曲线纵截距相同，斜率为其 2 倍。"},{"name":"利润","f":"π = (P − ATC) × Q","note":"P < ATC 时为亏损。"},{"name":"勒纳指数","f":"(P − MC) ÷ P = 1 ÷ |PED|","note":"垄断者总在需求富有弹性 (|PED| > 1) 的区段生产；弹性越小，加价越高。"},{"name":"集中度","f":"CR_n = 前 n 家份额之和 ;  HHI = Σ s_i²","note":"HHI 对大企业赋予更大权重。"},{"name":"古诺双寡头（对称）","f":"P = a − Q, MC = c ⇒ q_i = (a − c) ÷ 3","note":"总产量 2(a−c)/3，介于垄断 (a−c)/2 与完全竞争 (a−c) 之间。"}],"sections":[{"h":"完全竞争：短期与长期","body":"单个厂商面对水平需求线 P = MR。它选择 **P = MC** 的产量：\n- 若 P > ATC：获得经济利润 → 长期吸引新厂商进入 → 市场供给右移、价格下降，直到 **P = 最低 ATC**。\n- 若 AVC ≤ P < ATC：短期亏损但继续生产。\n- 若 P < AVC 最低点：**停产**，亏损 = FC。\n因此厂商短期供给曲线是 **AVC 最低点以上的 MC 曲线**。\n长期均衡同时实现**配置效率** (P = MC) 和**生产效率** (P = 最低 ATC)。\n例：P = 12，在 P = MC 处 Q = 50、ATC = 10，则利润 = (12 − 10) × 50 = 100。"},{"h":"垄断：定价、效率与价格歧视","body":"垄断者面对市场需求曲线，因为要降价才能多卖，**MR < P**。\n例：需求 P = 100 − 2Q，MC = 20。MR = 100 − 4Q = 20 ⇒ Q = 20，P = 60。若为完全竞争则 P = MC = 20，Q = 40。**无谓损失** = ½ × (60 − 20) × (40 − 20) = 400。\n**价格歧视**条件：市场势力、能区分消费者、防止转售。\n- **一级（完全）价格歧视**：每单位按消费者保留价格出售，产量达到 P = MC 的有效水平，DWL = 0，但消费者剩余全部被厂商攫取。\n- **三级价格歧视**：各分市场分别令 MR_i = MC，**需求弹性较小的市场定价较高**（如机票商务 vs 学生、影院成人 vs 学生票）。"},{"h":"垄断竞争与寡头","body":"**垄断竞争**：产品差异化让厂商有一定定价权（需求向下倾斜），但自由进入使长期经济利润为 0：需求曲线与 ATC 相切，**P = ATC > MC**，产量低于 ATC 最低点对应产量（**过剩产能**）。\n**寡头**：少数厂商相互依存。\n- **卡特尔**（如 OPEC）共同限产、定垄断价，但每个成员都有偷偷增产的激励，因而不稳定（本质上是囚徒困境，见博弈论一课）。\n- **折弯需求曲线**：对手跟降价不跟涨价 → 需求在现价上方富有弹性、下方缺乏弹性 → MR 在折点处间断，MC 在此区间内变动时价格不变。\n- **古诺模型**（竞赛）：P = 120 − Q、MC = 0 的对称双寡头，每家生产 40，总产量 80，P = 40；垄断时 Q = 60、P = 60；完全竞争时 Q = 120、P = 0。"},{"h":"市场集中度与自然垄断管制","body":"**CR4** 为前四家份额之和；**HHI** 为全部厂商份额平方和。例：份额 40%、30%、20%、10% ⇒ CR4 = 100%，HHI = 1600 + 900 + 400 + 100 = 3000（高度集中）。\n**自然垄断**：LRATC 在整个市场需求范围内下降（如电网、自来水），一家厂商供应成本最低。管制选择：\n- **边际成本定价 P = MC**：配置有效，但由于 MC < ATC，厂商亏损，需要补贴。\n- **平均成本定价 P = ATC（公平回报）**：厂商获正常利润，但产量仍低于有效水平。\n- 不管制：垄断定价，产量最低。\n**可竞争市场**理论提醒我们：关键不在厂商数量，而在进入/退出是否无沉没成本。"}],"pitfalls":["垄断者“收取最高价格”——错！它在需求曲线上找 MR = MC 对应产量的价格，而非最高价。","认为完全竞争厂商在亏损时一定停产；只要 P ≥ AVC 就应继续生产。","把垄断价格读在 MR 曲线或 MC 曲线上，而非需求曲线上。","认为一级价格歧视降低效率——实际上它消除了 DWL，只是分配给厂商。","自然垄断实施 P = MC 管制后仍认为厂商有利润——实际会亏损。"],"exams":{"AP":"Micro Unit 3.5–3.9 & Unit 4","IB":"2.13 Market power (HL)","AL":"9708 A2 7.6–7.8, 8.1","IEO":"Market structure & competition policy","NEC":"Micro: market structures"},"diagram":"monopoly"},{"id":"m8","unit":"micro","title_zh":"博弈论","title_en":"Game Theory","level":"G10+","summary":"博弈论研究相互依赖的决策：每个参与者的最优选择取决于别人怎么做。本课学习读支付矩阵、占优策略、纳什均衡、囚徒困境、重复博弈、序贯博弈的逆向归纳以及混合策略，这是 IEO 与 NEC 的高频考点。","concepts":[{"zh":"支付矩阵","en":"Payoff Matrix","def":"列出每种策略组合下各参与者收益的表格；惯例是括号中第一个数属于行参与者。"},{"zh":"占优策略","en":"Dominant Strategy","def":"无论对手采取什么策略，都能给自己带来严格更高收益的策略。"},{"zh":"纳什均衡","en":"Nash Equilibrium","def":"一个策略组合，在给定其他人策略时，没有任何参与者能通过单方面改变策略而获益。"},{"zh":"囚徒困境","en":"Prisoner's Dilemma","def":"每人都有背叛的占优策略，但均衡结果对双方都劣于合作结果（纳什均衡非帕累托最优）。"},{"zh":"重复博弈","en":"Repeated Game","def":"同一博弈进行多次；若无限重复（或结束时间不确定）且参与者足够重视未来，合作可以成为均衡。"},{"zh":"以牙还牙","en":"Tit-for-Tat","def":"第一轮合作，此后每轮模仿对手上一轮的行动；简单、宽容、可报复。"},{"zh":"冷酷触发策略","en":"Grim Trigger","def":"一直合作，一旦对手背叛就永远背叛。"},{"zh":"逆向归纳","en":"Backward Induction","def":"在序贯博弈中从最后一步开始倒推每个决策点的最优行动，得到子博弈完美均衡 (SPNE)。"},{"zh":"可信威胁","en":"Credible Threat","def":"到了需要执行时，执行它确实对威胁者有利的威胁；不可信威胁会被理性对手忽略。"},{"zh":"混合策略","en":"Mixed Strategy","def":"以一定概率随机选择纯策略；均衡时每人的概率使对手在其纯策略间无差异。"}],"formulas":[{"name":"无限重复博弈的合作条件（冷酷触发）","f":"π_C ÷ (1 − δ) ≥ π_D + δ·π_N ÷ (1 − δ)","note":"π_C 合作收益、π_D 背叛当期收益、π_N 惩罚期（纳什）收益、δ 为贴现因子。化简得 δ ≥ (π_D − π_C) ÷ (π_D − π_N)。"},{"name":"贴现因子与利率","f":"δ = 1 ÷ (1 + r)","note":"利率越高，未来越不值钱，合作越难维持。"},{"name":"混合策略无差异条件","f":"对手选 X 的期望收益 = 对手选 Y 的期望收益","note":"你的概率由“对手的”收益决定，而不是你自己的收益。"}],"sections":[{"h":"读矩阵：占优策略与纳什均衡","body":"找纳什均衡的实用方法——**划线法**：对每一列，在行参与者的最高收益下划线；对每一行，在列参与者的最高收益下划线；两个数都被划线的格子就是纯策略纳什均衡。\n例：两家公司选择高价 (High) 或低价 (Low)，收益（A, B）：HH (10,10)，HL (2,14)，LH (14,2)，LL (5,5)。\n- 若 B 选 High，A 选 Low 得 14 > 10；若 B 选 Low，A 选 Low 得 5 > 2 ⇒ **Low 是 A 的占优策略**，B 同理。\n- 唯一纳什均衡 (Low, Low)，收益 (5,5)，但 (High, High) 的 (10,10) 对双方都更好——这就是**囚徒困境**。\n注意：纳什均衡不一定存在占优策略；一个博弈也可能有多个纳什均衡（如协调博弈）或没有纯策略纳什均衡。"},{"h":"重复博弈：合作如何维持","body":"**有限次重复且终点已知**：最后一轮等同一次性博弈，大家背叛；倒推下去，每一轮都背叛（逆向归纳）。\n**无限重复**：用冷酷触发策略维持合作。沿用上例：合作每期 10；背叛当期 14，此后永远 5。\n合作条件：10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14 − 9δ ⇒ **δ ≥ 4/9 ≈ 0.44**。\n- δ 越大（越有耐心、利率越低、互动越频繁），卡特尔越稳定。\n- **以牙还牙**在阿克塞尔罗德 (Axelrod) 的计算机锦标赛中表现出色：善良、可报复、宽容、清晰。"},{"h":"序贯博弈与先动优势","body":"用**博弈树**表示，按**逆向归纳**求解。\n例：潜在进入者先决定是否进入；若进入，在位者选择“打价格战”或“容纳”。收益（进入者, 在位者）：不进入 (0,10)；进入-打 (−2,2)；进入-容纳 (3,5)。\n- 倒推：若进入，在位者比较 2 与 5，选择容纳。\n- 进入者预期得 3 > 0，选择进入。SPNE：（进入，容纳）。\n- 在位者“你敢进来我就打”是**不可信威胁**。若在位者事先投资过剩产能等**承诺 (commitment)**，使打价格战变得有利，威胁才可信——这正是**先动优势**的来源之一（Stackelberg 领导者先定产量也获得更高利润）。"},{"h":"混合策略（竞赛）","body":"当没有纯策略纳什均衡时（如“猜硬币”、点球门将与射手），参与者会随机化。求解关键：**我的概率要让对手无差异**。\n例：行玩家选 T/B，列玩家选 L/R。列玩家收益：TL 0、TR 2、BL 3、BR 0。设行玩家以 p 选 T：列选 L 期望收益 = 3(1−p)，选 R = 2p；令其相等得 **p = 3/5**。\n常见错误是用行玩家自己的收益去求自己的概率。"}],"pitfalls":["认为纳什均衡一定是对双方最好的结果——囚徒困境恰恰相反。","把“占优策略”与“纳什均衡”混为一谈：占优策略均衡一定是纳什均衡，反之不然。","在序贯博弈中相信不可信威胁，而不是用逆向归纳检验。","有限次（终点已知）重复博弈中认为可以一直合作。","求混合策略概率时用自己的收益而非对手的收益列方程。"],"exams":{"AP":"Micro Unit 4.5 (Oligopoly & Game Theory)","IB":"2.13 HL (oligopoly, game theory)","AL":"9708 A2 7.6 (oligopoly)","IEO":"Strategic interaction / game theory","NEC":"Micro: oligopoly & game theory"},"diagram":null},{"id":"m9","unit":"micro","title_zh":"要素市场","title_en":"Factor Markets","level":"G10+","summary":"劳动、资本等生产要素的需求是派生需求——源于人们对最终产品的需求。厂商按 MRP = MRC 决定雇佣量，并用最小成本法则组合各种投入。本课还分析买方垄断、最低工资在不同市场中的效应以及工资差异与人力资本。","concepts":[{"zh":"派生需求","en":"Derived Demand","def":"对生产要素的需求来源于对其生产的最终产品的需求。"},{"zh":"劳动边际产量","en":"Marginal Product of Labour (MPL)","def":"多雇一名工人带来的额外产出。"},{"zh":"边际收益产品","en":"Marginal Revenue Product (MRP)","def":"多雇一单位要素带来的总收益增量，MRP = MP × MR；产品市场完全竞争时 MR = P，MRP = MP × P。"},{"zh":"边际要素成本","en":"Marginal Resource Cost (MRC / MFC)","def":"多雇一单位要素带来的总成本增量；要素市场完全竞争时 MRC = 工资 W。"},{"zh":"雇佣法则","en":"Hiring Rule","def":"利润最大化厂商雇佣要素直到 MRP = MRC。"},{"zh":"最小成本法则","en":"Least-Cost Rule","def":"MP_L/W = MP_K/r，即每元花在各要素上的边际产量相等。"},{"zh":"买方垄断","en":"Monopsony","def":"要素市场中只有一个买者（如小镇唯一的大雇主）；面对向上倾斜的劳动供给曲线，MRC > W。"},{"zh":"补偿性工资差异","en":"Compensating Wage Differential","def":"为弥补工作的危险、辛苦或不愉快而支付的更高工资。"},{"zh":"人力资本","en":"Human Capital","def":"通过教育、培训积累的知识与技能，能提高劳动生产率和工资。"}],"formulas":[{"name":"边际收益产品","f":"MRP = MP × MR（竞争性产品市场：MRP = MP × P）","note":"垄断厂商的 MRP 更低，因为 MR < P。"},{"name":"雇佣法则","f":"MRP = MRC；竞争性劳动市场中 MRP = W","note":"离散表格中雇佣到 MRP ≥ W 的最后一名工人。"},{"name":"最小成本法则","f":"MP_L ÷ W = MP_K ÷ r","note":"若左边更大，应多用劳动、少用资本。"},{"name":"利润最大化要素组合","f":"MRP_L ÷ W = MRP_K ÷ r = 1","note":"满足利润最大化必然满足成本最小化，反之不然。"},{"name":"买方垄断的 MRC（线性供给）","f":"若 W = a + bL，则 MRC = a + 2bL","note":"与垄断的 MR 类似：斜率为供给曲线的 2 倍。"}],"sections":[{"h":"派生需求与 MRP","body":"企业雇工人不是因为喜欢工人，而是因为工人能生产可出售的产品。因此**劳动需求曲线就是 MRP 曲线**（向下倾斜，因为边际收益递减）。\n例：产品价格 P = 4，工资 W = 30。L = 1…6 时 TP = 12, 22, 30, 36, 40, 42。\n- MP = 12, 10, 8, 6, 4, 2；MRP = 48, 40, 32, 24, 16, 8。\n- 第 3 名工人 MRP = 32 ≥ 30，第 4 名 MRP = 24 < 30 ⇒ 雇 **3 人**。\n劳动需求移动的原因：产品价格变化、劳动生产率变化（技术、培训）、其他要素价格变化（替代品或互补品）。"},{"h":"最小成本组合","body":"厂商使用多种要素时，要让**每一元钱**在各要素上的边际产量相等：MP_L/W = MP_K/r。\n例：MP_L = 20，W = 10 ⇒ 每元 2 单位；MP_K = 30，r = 20 ⇒ 每元 1.5 单位。劳动更“划算”，应**多用劳动、少用资本**，直至比值相等（边际收益递减使 MP_L 下降、MP_K 上升）。"},{"h":"买方垄断与最低工资","body":"**竞争性劳动市场**：设定高于均衡工资的最低工资 → 劳动需求量下降、供给量上升 → **就业减少、失业（劳动过剩）**。例：L_d = 100 − 2W，L_s = 3W − 25，均衡 W = 25、L = 50。最低工资 30 ⇒ L_d = 40、L_s = 65，就业减少 10，过剩 25。\n**买方垄断**：雇主要提高所有工人的工资才能多雇一人，MRC 在供给曲线上方。例：供给 W = 10 + 2L，MRC = 10 + 4L，MRP = 70 − 2L。\n- MRC = MRP ⇒ L = 10，再到**供给曲线**上读工资 W = 30（低于 MRP = 50，存在“剥削”）。\n- 竞争性结果：供给 = MRP ⇒ L = 15，W = 40。\n- 设最低工资 36：在 L ≤ 13 内 MRC = 36（水平），雇主雇到 MRP = 36 或供给约束处 ⇒ L = min(13, 17) = **13**，就业**增加**。最低工资设在竞争性工资 40 时就业最大 (15)。"},{"h":"工资差异与人力资本","body":"工资差异来源：\n- **补偿性差异**：危险、夜班、偏远地区。\n- **人力资本差异**：教育和培训提高生产率（贝克尔人力资本理论）；信号理论 (signalling) 认为学历也在向雇主传递能力信息。\n- **市场势力**：工会（提高工资但可能减少就业）、买方垄断。\n- **歧视**与信息不对称。\n**超级明星效应**：技术与全球市场让少数顶尖者获得不成比例的收入，这也与收入分配一课相关。"}],"pitfalls":["买方垄断中把工资读在 MRC 曲线或 MRP 曲线上；工资应在劳动供给曲线上读取。","认为最低工资必然减少就业——在买方垄断市场中适度最低工资可提高就业。","垄断产品市场中仍用 MP × P 计算 MRP，应使用 MP × MR。","最小成本法则比较的是 MP/价格，而不是单纯比较 MP 大小。","混淆劳动需求的“移动”与“沿曲线移动”：工资变化只引起沿曲线移动。"],"exams":{"AP":"Micro Unit 5 (Factor Markets)","IB":"2.8 (minimum wage as price floor)","AL":"9708 A2 8.3","IEO":"Labour markets","NEC":"Micro: factor markets"},"diagram":"floor"},{"id":"m10","unit":"micro","title_zh":"市场失灵与收入分配","title_en":"Market Failure & Income Distribution","level":"G9+","summary":"当市场自发结果不能实现资源有效配置时就出现市场失灵：外部性、公共物品、公共资源和信息不对称都是典型原因。本课学习庇古税/补贴、科斯定理、排污权交易等纠正手段，并用洛伦兹曲线、基尼系数和税制累进性分析收入分配问题。","concepts":[{"zh":"负外部性","en":"Negative Externality","def":"生产或消费给第三方带来未被补偿的成本（如污染）；MSC = MPC + MEC > MPC，市场产量过多。"},{"zh":"正外部性","en":"Positive Externality","def":"给第三方带来未被支付的收益（如疫苗、教育）；MSB = MPB + MEB > MPB，市场产量过少。"},{"zh":"庇古税/补贴","en":"Pigouvian Tax / Subsidy","def":"按社会最优产量处的边际外部成本（收益）征税（补贴），使外部性内部化。"},{"zh":"科斯定理","en":"Coase Theorem","def":"若产权明确且交易成本足够低，各方私下谈判可达到有效结果，且与产权初始归属无关（但分配结果有关）。"},{"zh":"公共物品","en":"Public Good","def":"非竞争性 (non-rival) 且非排他性 (non-excludable) 的物品，如国防、灯塔；市场会因搭便车问题而供给不足。"},{"zh":"搭便车问题","en":"Free-Rider Problem","def":"人们可以不付费享受物品，于是隐藏真实偏好、不愿付费。"},{"zh":"公地悲剧","en":"Tragedy of the Commons","def":"竞争性但非排他性的公共资源（渔场、牧场）被过度使用。"},{"zh":"逆向选择","en":"Adverse Selection","def":"交易前的信息不对称：高风险或低质量的一方更愿意参与交易（二手车“柠檬”市场、保险）。"},{"zh":"道德风险","en":"Moral Hazard","def":"交易后的隐藏行为：一方在受保护后改变行为、承担更多风险（投保后疏于防范）。"},{"zh":"基尼系数","en":"Gini Coefficient","def":"洛伦兹曲线与绝对平等线之间面积占平等线下方三角形面积的比例，0 为完全平等，1 为完全不平等。"}],"formulas":[{"name":"社会成本与社会收益","f":"MSC = MPC + MEC ;  MSB = MPB + MEB","note":"社会最优产量：MSB = MSC。"},{"name":"庇古税","f":"t = MEC（在社会最优产量 Q* 处取值）","note":"若 MEC 不变，税额即为每单位外部成本。"},{"name":"无谓损失（负外部性）","f":"DWL = ½ × (Q_市场 − Q*) × (MSC − MSB 在 Q_市场 处的差)","note":"线性情形下为三角形面积。"},{"name":"公共物品的最优供给","f":"ΣMB_i = MC（需求曲线垂直加总）","note":"私人物品是水平加总。"},{"name":"基尼系数","f":"G = A ÷ (A + B)","note":"A 为平等线与洛伦兹曲线之间面积，A + B = 0.5（单位正方形中）。"},{"name":"排污权交易效率条件","f":"MAC_1 = MAC_2 = 许可证价格","note":"边际减排成本相等时，总减排成本最低。"}],"sections":[{"h":"外部性与庇古税","body":"负外部性使 **MSC > MPC**，市场按 MPB = MPC 生产，**产量过多、价格过低**。\n例：需求 MPB = MSB = 50 − Q，私人成本 MPC = 10 + Q，每单位污染造成外部成本 6。\n- 市场：50 − Q = 10 + Q ⇒ Q = 20。\n- 社会最优：50 − Q = 16 + Q ⇒ Q* = 17。\n- 无谓损失 = ½ × 6 × (20 − 17) = 9。\n- **庇古税** t = 6/单位，使私人成本等于社会成本，市场产量降至 17。\n正外部性（教育、疫苗）则相反：市场产量不足，适合**庇古补贴**或政府直接提供。"},{"h":"科斯定理与排污权交易","body":"**科斯定理**：工厂污染邻近洗衣店，若安装过滤器成本 200，洗衣店损失 300。交易成本为零时：\n- 若洗衣店有权要求清洁空气：工厂安装过滤器（200 < 赔偿 300）。\n- 若工厂有污染权：洗衣店愿付 200–300 之间的金额让工厂安装。\n两种情况下**过滤器都会安装**（有效率），但**谁付钱**不同。现实中涉及人数多、交易成本高，科斯方案常失效。\n**碳定价**：碳税固定价格、排放量不确定；**总量管制与交易 (cap-and-trade)** 固定排放总量、价格由市场决定。许可证交易使**边际减排成本 (MAC) 相等**，以最低总成本完成减排。例：MAC_A = 2a，MAC_B = 4b，需减排 30 ⇒ 2a = 4b 且 a + b = 30 ⇒ a = 20、b = 10，许可证价格 40。"},{"h":"公共物品、公共资源与信息不对称","body":"按两个特征分类：\n- 竞争 + 排他：私人物品（面包）\n- 非竞争 + 排他：俱乐部物品（付费电视、收费公路）\n- 竞争 + 非排他：**公共资源**（渔场）→ 公地悲剧，对策：配额、产权、许可证\n- 非竞争 + 非排他：**公共物品**（国防）→ 搭便车，对策：政府用税收提供\n公共物品最优数量由**垂直加总**的边际收益等于边际成本决定。例：三位居民对一盏路灯分别估值 40、25、15，总计 80 > 成本 70，应安装——即使没有任何一人愿单独付 70。\n**信息不对称**：逆向选择（交易前，如健康差的人更愿买保险）→ 对策：强制参保、信号、筛选；道德风险（交易后，如有存款保险的银行冒更大风险）→ 对策：免赔额、共同保险、监管。"},{"h":"收入分配：洛伦兹曲线与税制","body":"**洛伦兹曲线**把人口按收入由低到高排列，画出累计人口比例对应的累计收入比例。曲线越向下弯离 45° 平等线，分配越不平等。\n**基尼系数** G = A/(A + B)。若 A = 0.15，则 G = 0.15/0.5 = 0.30。\n税制分类（看**平均税率**随收入如何变化）：\n- **累进税**：收入越高，平均税率越高（个人所得税）。\n- **比例税**：平均税率不变。\n- **累退税**：收入越高，平均税率越低（多数消费税、销售税实际上是累退的，因为低收入者消费占收入比例更高）。\n例：收入 20000 纳税 2000（10%），收入 100000 纳税 8000（8%）⇒ 累退，尽管高收入者缴纳的绝对金额更多。"}],"pitfalls":["庇古税应等于社会最优产量处的边际外部成本，而不是市场产量处的。","把“免费”或“政府提供”等同于公共物品——判断标准是非竞争性和非排他性。","混淆逆向选择（交易前隐藏信息）与道德风险（交易后隐藏行动）。","按纳税绝对额判断累进/累退，应看平均税率。","认为科斯定理下产权分配无关紧要——效率结果相同，但收入分配不同。"],"exams":{"AP":"Micro Unit 6 (Market Failure & Role of Government)","IB":"2.9–2.12, 3.6","AL":"9708 AS 1.5, 3; A2 7.3–7.4, 8.1–8.2","IEO":"Market failure, environment & inequality","NEC":"Micro: externalities, public goods, distribution"},"diagram":"ext_neg"},{"id":"M1","unit":"macro","title_zh":"宏观经济指标","title_en":"Macroeconomic Indicators","level":"G9+","summary":"宏观经济用三组核心指标来“体检”一个经济体：产出 (GDP)、价格水平 (CPI、GDP平减指数) 与就业 (失业率、劳动参与率)。本课讲清各指标的定义、计算方法与局限，并把它们放进经济周期 (business cycle) 的框架里理解。","concepts":[{"zh":"国内生产总值","en":"Gross Domestic Product (GDP)","def":"一定时期内一国境内生产的所有最终产品和服务 (final goods and services) 的市场价值。只算“最终”产品以避免重复计算 (double counting)。"},{"zh":"支出法","en":"Expenditure approach","def":"GDP = C + I + G + NX，即消费、投资、政府购买与净出口之和。注意 I 指实物资本投资（厂房、设备、新住房、存货变动），不是买股票。"},{"zh":"收入法","en":"Income approach","def":"把生产过程中产生的收入相加：工资、租金、利息、利润，再加上间接税减补贴、折旧等调整项，理论上等于支出法 GDP。"},{"zh":"名义GDP与实际GDP","en":"Nominal vs Real GDP","def":"名义GDP按当年价格计算；实际GDP按基年价格计算，剔除了价格变化，只反映产量变化。"},{"zh":"GDP平减指数","en":"GDP deflator","def":"名义GDP ÷ 实际GDP × 100，衡量国内生产的所有最终产品的整体价格水平。"},{"zh":"消费者价格指数","en":"Consumer Price Index (CPI)","def":"一篮子固定的典型消费品在当期的成本相对基期成本的比值 × 100，用来计算通货膨胀率。"},{"zh":"失业率","en":"Unemployment rate","def":"失业人数 ÷ 劳动力 (labor force) × 100%。失业者必须是没有工作、且在积极找工作的人。"},{"zh":"劳动参与率","en":"Labor force participation rate (LFPR)","def":"劳动力 ÷ 16岁以上（工作年龄）非机构人口 × 100%。"},{"zh":"自然失业率","en":"Natural rate of unemployment","def":"摩擦性失业 (frictional) + 结构性失业 (structural)，即周期性失业 (cyclical) 为零、产出处于潜在水平时的失业率。"},{"zh":"经济周期","en":"Business cycle","def":"实际GDP围绕长期趋势的短期波动，依次经历扩张 (expansion)、峰顶 (peak)、收缩/衰退 (contraction/recession)、谷底 (trough)。"}],"formulas":[{"name":"支出法GDP","f":"GDP = C + I + G + (X − M)","note":"转移支付 (transfer payments) 不计入 G。"},{"name":"GDP平减指数","f":"Deflator = Nominal GDP ÷ Real GDP × 100","note":"基年的平减指数 = 100。"},{"name":"实际GDP","f":"Real GDP = Nominal GDP ÷ (Deflator ÷ 100)","note":"近似：实际增长率 ≈ 名义增长率 − 通胀率。"},{"name":"CPI与通胀率","f":"CPI_t = 篮子成本_t ÷ 篮子成本_基年 × 100；π = (CPI_t − CPI_t−1) ÷ CPI_t−1 × 100%","note":"通胀率是两个指数之间的百分比变化，不是指数减100（除非上期正好是基年）。"},{"name":"失业率","f":"u = 失业人数 ÷ 劳动力 × 100%；劳动力 = 就业 + 失业","note":"分母是劳动力，不是总人口。"},{"name":"劳动参与率","f":"LFPR = 劳动力 ÷ 工作年龄人口 × 100%","note":""}],"sections":[{"h":"GDP：算什么，不算什么","body":"GDP衡量的是**当期、境内、最终**产品与服务的市场价值。\n- **计入**：新生产的汽车、新建住房（计入投资 I）、企业存货增加（计入 I）、政府修路和支付公务员工资（计入 G）。\n- **不计入**：二手商品交易（不是当期生产）、股票债券买卖（金融资产转移）、转移支付如失业救济金和养老金（没有对应的产出）、中间产品（已包含在最终产品价值中）、非市场活动（家务劳动）与地下经济。\n支出法、收入法与增加值法 (value-added) 三种算法在理论上相等，因为一笔支出就是另一方的收入。"},{"h":"名义、实际与价格指数","body":"**例题**：某年名义GDP为 2,310，GDP平减指数为 105（基年 = 100）。实际GDP = 2,310 ÷ 1.05 = **2,200**。若基年（上一年）GDP为 2,000，则实际增长率 = 2,200 ÷ 2,000 − 1 = **10%**；而名义增长率为 15.5%，近似式 15.5% − 5% = 10.5%，与精确值略有差异。\n**CPI与平减指数的区别**：\n- CPI 用固定篮子，只含消费品（包括进口消费品）；平减指数覆盖所有国内生产的最终产品，权重随当期产量变化。\n- CPI 常被认为高估通胀：替代偏差 (substitution bias)、新产品偏差、质量改进偏差。"},{"h":"就业统计：谁是失业者","body":"工作年龄人口分成三类：就业、失业、非劳动力 (not in labor force)。\n**例题**：工作年龄人口 2.5 亿，劳动力 1.6 亿，就业 1.48 亿。失业 = 0.12 亿；失业率 = 12 ÷ 160 = **7.5%**；LFPR = 160 ÷ 250 = **64%**。\n**沮丧工人 (discouraged workers)** 放弃找工作后退出劳动力：失业人数和劳动力同时减少，失业率下降，但这并不代表就业形势变好——这是失业率的主要局限之一。兼职但想全职的人 (underemployed) 也被算作就业。"},{"h":"失业类型与经济周期","body":"- **摩擦性失业**：换工作、刚毕业找工作期间的短暂失业，信息不完全导致，总是存在。\n- **结构性失业**：技能或地区与岗位不匹配，例如技术变革淘汰了某些岗位。\n- **周期性失业**：由衰退时总需求不足造成，经济扩张时消失。\n- **季节性失业**常归入摩擦性。\n自然失业率 = 摩擦性 + 结构性。实际失业率高于自然失业率时，实际GDP低于潜在GDP，存在**衰退缺口**；奥肯定律 (Okun's law) 的经验法则：周期性失业每高出1个百分点，产出约低于潜在水平2%。"}],"pitfalls":["把买股票、买二手车或政府发放的失业救济金算进GDP。","计算失业率时用总人口或工作年龄人口作分母，而不是劳动力。","把CPI指数值（如117.9）直接等同于通胀率，或忘了通胀率要用上一期指数作分母。","认为失业率下降一定意味着就业增加——可能只是沮丧工人退出了劳动力。","以为自然失业率为零；充分就业时仍存在摩擦性和结构性失业。"],"exams":{"AP":"Macro Unit 2 (2.1–2.7)","IB":"3.1, 3.3","AL":"9708 AS 4.1, 4.5–4.6; A2 9.1, 9.4","IEO":"Macroeconomic measurement: GDP, inflation, unemployment","NEC":"Macro: economic indicators"},"diagram":null},{"id":"M2","unit":"macro","title_zh":"总需求与总供给","title_en":"Aggregate Demand & Aggregate Supply","level":"G10+","summary":"AD–AS 模型是分析短期波动与长期均衡的核心工具。本课解释总需求为什么向下倾斜、哪些因素使AD与SRAS移动、LRAS为何垂直，以及衰退缺口/通胀缺口如何通过工资调整自我修正。","concepts":[{"zh":"总需求","en":"Aggregate Demand (AD)","def":"在各个价格水平下，家庭、企业、政府和外国对本国实际产出的总需求量，AD = C + I + G + NX。"},{"zh":"财富效应","en":"Wealth (real balances) effect","def":"价格水平下降使货币与名义资产的实际购买力上升，家庭增加消费。"},{"zh":"利率效应","en":"Interest-rate effect","def":"价格水平下降使货币需求减少、利率下降，从而刺激投资和耐用品消费。"},{"zh":"汇率/国际替代效应","en":"Exchange-rate (foreign purchases) effect","def":"本国价格水平下降使本国商品相对外国商品更便宜，净出口增加。"},{"zh":"短期总供给","en":"Short-run Aggregate Supply (SRAS)","def":"向上倾斜，因为短期内名义工资和部分投入品价格具有粘性 (sticky)，价格水平上升会提高企业利润与产量。"},{"zh":"长期总供给","en":"Long-run Aggregate Supply (LRAS)","def":"在潜在产出 (potential output, Y_f) 处垂直：长期所有价格和工资完全调整，产出由资源和技术决定，与价格水平无关。"},{"zh":"衰退缺口","en":"Recessionary (negative output) gap","def":"实际产出低于潜在产出，失业率高于自然失业率。"},{"zh":"通胀缺口","en":"Inflationary (positive output) gap","def":"实际产出高于潜在产出，失业率低于自然失业率，工资和物价面临上涨压力。"},{"zh":"需求拉动型通胀","en":"Demand-pull inflation","def":"AD 右移导致价格水平上升，同时产出增加。"},{"zh":"成本推动型通胀与滞胀","en":"Cost-push inflation & stagflation","def":"SRAS 左移（如油价上涨）导致价格水平上升而产出下降、失业上升，即滞胀。"}],"formulas":[{"name":"总需求","f":"AD = C + I + G + (X − M)","note":"价格水平变化引起沿AD曲线移动；其他因素变化使AD曲线移动。"},{"name":"产出缺口","f":"Output gap = (Y − Y_f) ÷ Y_f × 100%","note":"负值为衰退缺口，正值为通胀缺口。"},{"name":"线性AD–AS均衡","f":"AD: Y = a − bP；SRAS: Y = c + dP ⇒ P* = (a − c) ÷ (b + d)","note":"竞赛常考代数形式。"}],"sections":[{"h":"AD：为什么向下倾斜、什么让它移动","body":"AD向下倾斜**不是**因为微观的替代效应，而是三个宏观效应：**财富效应、利率效应、汇率效应**。\n使AD**右移**的因素：\n- 消费者信心上升、家庭财富增加、减税（C↑）\n- 企业预期改善、利率下降（I↑）\n- 政府购买增加（G↑）\n- 外国收入上升、本币贬值（NX↑）\n本币升值、利率上升、信心下降则使AD左移。"},{"h":"SRAS 与 LRAS","body":"SRAS 移动的主要原因是**单位生产成本**变化：名义工资、原材料/能源价格、生产率、营业税与补贴、供给冲击。\n- 油价上涨、名义工资上升 → SRAS 左移\n- 生产率提高、投入品价格下降 → SRAS 右移\nLRAS 由资源数量与质量（劳动、资本、人力资本）、技术和制度决定。技术进步或人力资本增加使 LRAS（和SRAS）右移，代表潜在产出增长。价格水平变化只会沿曲线移动。"},{"h":"均衡、缺口与自我调整","body":"短期均衡在 AD 与 SRAS 交点，长期均衡还要求该点位于 LRAS 上。\n**例题**：AD: Y = 1200 − 4P，SRAS: Y = 200 + 6P，潜在产出 Y_f = 900。均衡 1200 − 4P = 200 + 6P ⇒ P = 100，Y = 800，存在 100 的衰退缺口。若要靠扩张AD回到900：SRAS 上 Y = 900 时 P = 116.7，所需AD水平移动 ≈ **166.7**（大于缺口100，因为价格上升会“吃掉”一部分扩张）。\n**自我调整 (self-correction)**：衰退缺口时失业高于自然率，名义工资最终下降，SRAS 右移，价格下降、产出回到 Y_f；通胀缺口时工资上涨，SRAS 左移，价格进一步上升、产出回落到 Y_f。凯恩斯学派强调工资向下粘性使这一过程可能很慢，因此主张政策干预。"},{"h":"通胀的两种来源与滞胀困境","body":"- **需求拉动**：AD 右移 → P↑、Y↑、失业↓。\n- **成本推动**：SRAS 左移 → P↑、Y↓、失业↑（**滞胀 stagflation**）。\n滞胀给政策制定者带来两难：若扩张AD以恢复产出，价格水平会进一步上升；若收缩AD以压通胀，产出和就业会进一步下降。这也说明供给侧政策（提高生产率）的重要性。"}],"pitfalls":["用微观的替代效应/收入效应解释AD向下倾斜。","把价格水平变化当作使AD或SRAS移动的因素（它只引起沿曲线移动）。","认为需求冲击能长期提高产出——长期产出回到LRAS，只剩价格水平变化。","混淆SRAS与LRAS的移动因素：名义工资变化只移动SRAS，不移动LRAS。","代数题中把所需AD移动量直接等同于产出缺口，忽略了SRAS的斜率。"],"exams":{"AP":"Macro Unit 3 (3.1, 3.3–3.7)","IB":"3.2","AL":"9708 AS 4.3","IEO":"Aggregate demand & aggregate supply","NEC":"Macro: AD–AS model"},"diagram":"adas"},{"id":"M3","unit":"macro","title_zh":"财政政策","title_en":"Fiscal Policy","level":"G10+","summary":"财政政策指政府通过调整购买与税收来影响总需求。本课推导支出乘数、税收乘数和平衡预算乘数，区分自动稳定器与相机抉择政策，并讨论赤字与债务、挤出效应和政策时滞等局限。","concepts":[{"zh":"边际消费倾向","en":"Marginal propensity to consume (MPC)","def":"可支配收入每增加1元中用于消费的比例，MPC = ΔC ÷ ΔYd；MPS = 1 − MPC。"},{"zh":"支出乘数","en":"Spending multiplier","def":"自主支出（G、I 等）每变化1元引起的均衡产出最大变化，= 1 ÷ MPS。"},{"zh":"税收乘数","en":"Tax multiplier","def":"= −MPC ÷ MPS。税收变化先影响可支配收入，第一轮只有MPC部分被消费，所以绝对值比支出乘数小1。"},{"zh":"平衡预算乘数","en":"Balanced-budget multiplier","def":"G 与 T 同时等额增加时，产出增加量等于该变化额，乘数 = 1（简单模型）。"},{"zh":"相机抉择财政政策","en":"Discretionary fiscal policy","def":"政府主动通过立法改变支出或税率，如经济刺激计划。"},{"zh":"自动稳定器","en":"Automatic stabilizers","def":"无需新立法就会逆周期变化的制度安排，如累进所得税和失业保险。"},{"zh":"预算赤字与国债","en":"Budget deficit vs national debt","def":"赤字是一年内支出超过税收的流量 (flow)；国债是历年赤字减盈余累积的存量 (stock)。"},{"zh":"挤出效应","en":"Crowding out","def":"政府借款增加推高实际利率，减少私人投资（及利率敏感的消费），削弱扩张性财政政策的效果。"},{"zh":"政策时滞","en":"Policy lags","def":"识别时滞 (recognition)、决策/立法时滞 (decision/legislative)、执行与生效时滞 (implementation/impact)，财政政策的内部时滞通常较长。"}],"formulas":[{"name":"支出乘数","f":"k = 1 ÷ (1 − MPC) = 1 ÷ MPS","note":"ΔY = k × ΔG（或 ΔI）。"},{"name":"税收乘数","f":"k_T = −MPC ÷ MPS","note":"ΔY = k_T × ΔT；减税时 ΔT 为负。"},{"name":"平衡预算乘数","f":"ΔG = ΔT ⇒ ΔY = ΔG","note":"乘数为1。"},{"name":"开放经济含税乘数","f":"k = 1 ÷ [1 − MPC × (1 − t) + MPM]","note":"t 为边际税率，MPM 为边际进口倾向；也可写成 1 ÷ (MPS + MPT + MPM) 形式（按收入定义）。"},{"name":"所需政策规模","f":"所需 ΔG = 产出缺口 ÷ k；所需 ΔT = 产出缺口 ÷ k_T","note":"是缺口除以乘数，不是缺口本身。"}],"sections":[{"h":"乘数原理","body":"政府多花1元，就成为某人的收入，其中 MPC 部分被再次花掉，如此循环：ΔY = ΔG × (1 + MPC + MPC² + …) = ΔG ÷ (1 − MPC)。\n**例题**：MPC = 0.8，存在 150 亿美元的衰退缺口。\n- 支出乘数 = 1 ÷ 0.2 = 5，需 ΔG = 150 ÷ 5 = **30**。\n- 税收乘数 = −0.8 ÷ 0.2 = −4，需减税 150 ÷ 4 = **37.5**。\n- 若 G 与 T 同时增加 50，ΔY = 50 × 5 − 50 × 4 = **50**（平衡预算乘数 = 1）。\n当考虑所得税和进口“漏出” (leakages) 时乘数变小：MPC = 0.8、t = 0.25、MPM = 0.1 ⇒ k = 1 ÷ (1 − 0.6 + 0.1) = 2。"},{"h":"扩张性与紧缩性财政政策","body":"- **衰退缺口**：增加政府购买、减税、增加转移支付 → AD 右移（扩张性）。\n- **通胀缺口**：减少政府购买、增税 → AD 左移（紧缩性）。\n**自动稳定器**：衰退时收入下降，累进税使税收自动减少、失业救济自动增加，缓冲可支配收入下降；繁荣时相反。它们不需要立法，因此没有决策时滞，但力度有限。"},{"h":"赤字、债务与挤出","body":"赤字 = G + 转移支付 − 税收（某一年）；债务 = 累积赤字 − 累积盈余。例如初始债务 500，之后三年赤字 40、赤字 30、盈余 10，债务 = 500 + 40 + 30 − 10 = **560**。\n政府为赤字融资需在可贷资金市场借款，推高实际利率，挤出私人投资 (crowding out)，长期可能降低资本积累和经济增长。挤出程度在经济深度衰退、利率接近零时较小，在接近充分就业时较大。\n**李嘉图等价 (Ricardian equivalence)**：若家庭预期今天的举债减税意味着未来增税，会把减税全部储蓄起来，减税对消费无影响——这是竞赛常考的理论极端情形。"},{"h":"财政政策的局限","body":"- **时滞**：识别问题、立法讨论、项目执行都需时间，刺激可能在经济已复苏时才生效，反而加剧波动。\n- **挤出效应**与**开放经济漏出**（进口）削弱乘数。\n- **政治约束**：增加支出容易、削减困难，可能形成赤字偏向 (deficit bias)。\n- **债务可持续性**：债务/GDP 过高会提高利息负担和融资风险。"}],"pitfalls":["把税收乘数与支出乘数混为一谈：税收乘数绝对值 = MPC ÷ MPS，比支出乘数小 1。","计算所需政策规模时直接用缺口数额，而忘了除以乘数。","认为平衡预算（G、T 等额增加）对产出没有影响——简单模型下乘数是1。","混淆赤字（流量）与债务（存量）。","把中央银行的公开市场操作当作财政政策，或把自动稳定器说成相机抉择政策。"],"exams":{"AP":"Macro Unit 3 (3.2, 3.8–3.9); Unit 5 (5.4–5.5)","IB":"3.6 (HL: multiplier)","AL":"9708 AS 5.1; A2 9.2, 10.1","IEO":"Fiscal policy & government budget","NEC":"Macro: fiscal policy"},"diagram":"adas"},{"id":"M4","unit":"macro","title_zh":"货币与银行","title_en":"Money & Banking","level":"G10+","summary":"货币是经济运行的“润滑剂”。本课介绍货币的职能与层次 (M1/M2)，用T形账户演示部分准备金银行如何通过贷款创造货币，并建立货币市场模型和货币数量论 MV = PY，解释名义利率和长期通胀的决定。","concepts":[{"zh":"货币的职能","en":"Functions of money","def":"交换媒介 (medium of exchange)、计价单位 (unit of account)、价值储藏 (store of value)，有时加上延期支付标准。"},{"zh":"M1","en":"M1","def":"流动性最强的货币：流通中的现金、活期/支票存款 (checkable deposits)，2020年后美联储也把储蓄存款计入M1。"},{"zh":"M2","en":"M2","def":"M1 加上小额定期存款 (small time deposits/CDs) 和零售货币市场基金等“近似货币”。"},{"zh":"部分准备金制度","en":"Fractional reserve banking","def":"银行只保留存款的一部分作为准备金，其余用于放贷，因此能创造货币。"},{"zh":"法定准备金与超额准备金","en":"Required vs excess reserves","def":"法定准备金 = 存款 × 法定准备金率 (rr)；超额准备金 = 实际准备金 − 法定准备金，是单个银行可新增贷款的上限。"},{"zh":"T形账户","en":"T-account (balance sheet)","def":"左边资产（准备金、贷款、债券），右边负债（存款）和所有者权益；资产 = 负债 + 权益。"},{"zh":"货币乘数","en":"Money multiplier","def":"简单模型中 = 1 ÷ rr，表示银行体系由1元超额准备金最多能创造的存款。"},{"zh":"货币市场","en":"Money market","def":"货币需求 (Md) 向下倾斜（利率是持有货币的机会成本），货币供给 (Ms) 由中央银行决定、垂直；交点决定名义利率。"},{"zh":"货币数量论","en":"Quantity theory of money","def":"MV = PY。若 V 和 Y 相对稳定，长期中货币供给增长主要转化为通胀。"}],"formulas":[{"name":"简单货币乘数","f":"m = 1 ÷ rr","note":"最大值；银行持有超额准备金或公众持有现金时实际乘数更小。"},{"name":"银行体系最大新增存款","f":"ΔD_max = 超额准备金 × (1 ÷ rr)","note":""},{"name":"新增现金存入后的最大货币供给变化","f":"ΔM_max = 初始超额准备金 × (1 ÷ rr)","note":"现金存入本身只是 M1 内部转换（现金→存款），不改变 M1。"},{"name":"含现金漏出的乘数","f":"m = (1 + c) ÷ (rr + c)","note":"c = 公众持有现金 ÷ 存款；乘以基础货币 (monetary base)。"},{"name":"交易方程式","f":"M × V = P × Y","note":"增长率形式：%ΔM + %ΔV ≈ %ΔP + %ΔY。"}],"sections":[{"h":"什么是货币","body":"货币解决了物物交换中“需求的双重巧合” (double coincidence of wants) 问题。\n- **交换媒介**：用于买卖。\n- **计价单位**：菜单上标价、会计记账都以货币为尺度。\n- **价值储藏**：可跨期保存购买力，但通胀会侵蚀这一职能。\n信用卡**不是**货币，它只是一笔短期贷款；股票、债券不是货币，因为不能直接用于支付。"},{"h":"银行如何创造货币：T形账户","body":"**例题**：法定准备金率 rr = 20%。小明把 1,000 元现金存入A银行。\n- A银行：存款 +1,000，准备金 +1,000；法定准备金 200，超额准备金 800 → A银行最多新增贷款 **800**。\n- 800 被借出并存入B银行，B银行可再贷 640……\n- 银行体系最多新增存款 = 800 × (1 ÷ 0.2) = 4,000（贷款创造的部分）；加上最初的 1,000 存款，总存款最多增加 5,000。\n- 但 **M1 最多增加 4,000**：最初的 1,000 只是从现金变成了存款，M1 总量不变。\n若资金来自中央银行向银行购买债券（新的准备金），则货币供给最多增加 超额准备金 × 1/rr。\n实际乘数较小：银行可能持有超额准备金，公众可能把部分贷款以现金形式持有（现金漏出）。"},{"h":"货币市场与名义利率","body":"持有货币的机会成本是**名义利率**（放弃的债券利息），所以 Md 向下倾斜。\n- 名义GDP（价格水平或实际收入）上升 → 交易需求增加 → Md 右移 → 名义利率上升。\n- 中央银行增加货币供给 → Ms 右移 → 名义利率下降。\n利率与债券价格反向变动：市场利率上升时，已有的固定票息债券价格下降。"},{"h":"货币数量论","body":"MV = PY 是恒等式；加上“V 稳定、长期 Y 由实际因素决定”的假设，就成为理论：**长期中货币增长率 ≈ 通胀率 + 实际产出增长率**。\n**例题**：M = 500，V = 4，实际产出 Y = 1,000，则 P = 500 × 4 ÷ 1,000 = 2。若 M 增长 6%、V 不变、Y 增长 2%，通胀 ≈ 6% − 2% = 4%。\n这就是“通胀在任何时候任何地方都是一种货币现象”（弗里德曼）的依据，也解释了恶性通胀 (hyperinflation) 通常伴随政府大量印钞为赤字融资。"}],"pitfalls":["把现金存入银行本身算作货币供给增加（它只是M1内部的形式转换）。","用全部准备金而不是超额准备金乘以货币乘数。","认为单个银行可以贷出存款的 1/rr 倍——单个银行最多只能贷出其超额准备金。","把信用卡、股票视为货币。","认为货币需求曲线取决于实际利率——持有货币的机会成本是名义利率。"],"exams":{"AP":"Macro Unit 4 (4.1–4.5); Unit 5 (5.3)","IB":"3.5 (HL: money creation)","AL":"9708 A2 9.5","IEO":"Money, banking & financial intermediation","NEC":"Macro: money & banking"},"diagram":"moneymkt"},{"id":"M5","unit":"macro","title_zh":"货币政策与菲利普斯曲线","title_en":"Monetary Policy & the Phillips Curve","level":"G11+","summary":"中央银行通过调节利率和货币条件稳定通胀与就业。本课讲解现代“充足准备金”框架下的政策工具、可贷资金市场与费雪方程，并用短期/长期菲利普斯曲线说明为何需求政策只能在短期内交换通胀与失业，以及预期的关键作用。","concepts":[{"zh":"公开市场操作","en":"Open market operations (OMO)","def":"央行买卖政府债券：买入增加银行准备金、压低利率（扩张性）；卖出则相反。"},{"zh":"政策利率","en":"Policy rate (e.g., federal funds rate)","def":"央行设定的目标短期利率，如美联储的联邦基金利率目标区间，通过它影响整个利率体系。"},{"zh":"准备金利率","en":"Interest on reserve balances (IORB)","def":"央行对银行存放的准备金支付的利率；在充足准备金框架下是引导政策利率的主要工具。"},{"zh":"充足准备金框架","en":"Ample-reserves framework","def":"银行体系准备金充裕，小规模公开市场操作不再改变利率；央行通过调整 IORB、隔夜逆回购利率等管理利率（美联储自2008年后）。"},{"zh":"法定准备金率","en":"Reserve requirement","def":"传统工具；美联储已于2020年将其降至零，但许多国家（如中国人民银行的存款准备金率）仍在使用。"},{"zh":"可贷资金市场","en":"Loanable funds market","def":"储蓄（供给）与投资借款（需求）决定实际利率；政府赤字增加对可贷资金的需求（或减少国民储蓄）。"},{"zh":"费雪方程","en":"Fisher equation","def":"名义利率 ≈ 实际利率 + 预期通胀率。"},{"zh":"短期菲利普斯曲线","en":"Short-run Phillips curve (SRPC)","def":"给定通胀预期时，通胀与失业率之间的反向关系；AD变化使经济沿SRPC移动。"},{"zh":"长期菲利普斯曲线","en":"Long-run Phillips curve (LRPC)","def":"在自然失业率处垂直：长期中通胀预期完全调整，失业回到自然率，不存在可利用的交替关系。"},{"zh":"政策组合","en":"Policy mix","def":"财政政策与货币政策的搭配，例如“紧财政 + 松货币”可在不改变总需求的情况下降低利率、提高投资占比。"}],"formulas":[{"name":"费雪方程","f":"i ≈ r + π^e","note":"事后实际利率 r = i − 实际通胀 π。"},{"name":"附加预期的菲利普斯曲线","f":"π = π^e − β(u − u_n)","note":"u = u_n 时 π = π^e；预期上升使SRPC上移。"},{"name":"可贷资金均衡","f":"S(r) = I(r) + 政府借款","note":"挤出量 = 私人投资的减少量。"}],"sections":[{"h":"中央银行的工具箱","body":"**扩张性政策**（应对衰退）：降低政策利率目标、在公开市场买入债券、降低准备金利率 (IORB)、降低贴现率、（部分国家）降低法定准备金率。**紧缩性政策**相反。\n**充足准备金框架 (ample reserves)**：2008年后美联储资产负债表大幅扩张，银行准备金充裕，联邦基金利率由“管理利率” (administered rates) 决定：IORB 形成利率下限附近的锚，银行不会以低于 IORB 的利率把钱借出。因此美联储提高 IORB 是加息的最直接手段，而不再依赖小规模公开市场操作使准备金“变稀缺”。\n传导机制：政策利率 ↓ → 借贷成本 ↓ → 投资与耐用品消费 ↑、本币贬值 → AD 右移。"},{"h":"可贷资金市场与费雪方程","body":"**例题**：可贷资金供给 Qs = 100 + 20r，私人需求 Qd = 300 − 30r（r 为百分比）。均衡 r = 4%，Q = 180。政府新增赤字 50：总需求 Qd = 350 − 30r，新均衡 r = 5%，Q = 200；私人投资 = 300 − 30 × 5 = 150，**被挤出 30**。\n（AP 把赤字画成需求右移；部分教材把它画成国民储蓄/供给左移，两种画法都得出实际利率上升。）\n**费雪方程**：名义利率 7%、预期通胀 3%，则预期实际利率 ≈ 4%。若实际通胀高于预期，事后实际利率下降，**借款人受益、贷款人受损**。"},{"h":"菲利普斯曲线与预期","body":"- AD 增加 → 沿 SRPC **向左上**移动（失业↓、通胀↑）；AD 减少 → 沿 SRPC 向右下。\n- 负面供给冲击 → SRPC **上移**（通胀和失业同时上升）。\n- 通胀预期上升 → SRPC 上移。\n**例题**：π = π^e − 0.5(u − 5)，π^e = 3%。若政策把失业压到4%，短期 π = 3% + 0.5 = 3.5%。若下一年预期按上年通胀调整 (adaptive expectations) 为 3.5%，要继续维持 u = 4% 需要 π = 4%——通胀会不断加速 (accelerationist)。长期中只能在自然失业率上稳定，LRPC 垂直。"},{"h":"政策组合与局限","body":"- **紧财政 + 松货币**：赤字减少、利率下降，投资占GDP比重上升，有利于长期增长，而AD可大致不变。\n- **松财政 + 紧货币**：利率大幅上升，挤出投资，本币升值，净出口下降。\n- 货币政策的局限：零利率下限 (zero lower bound) 时降息空间有限，需依靠量化宽松 (QE) 或前瞻指引；政策也有时滞（外部时滞较长）。\n- 可信度：央行独立性与通胀目标制 (inflation targeting) 有助于锚定预期，降低反通胀的失业代价。"}],"pitfalls":["认为在充足准备金框架下美联储主要靠调整法定准备金率或小规模公开市场操作来改变利率。","把公开市场“买入债券”与“卖出债券”的方向搞反：买入 = 注入准备金 = 扩张性。","混淆沿SRPC移动（AD变化）与SRPC移动（供给冲击、预期变化）。","以为长期可以用更高的通胀换取更低的失业率。","费雪方程中忘记区分预期通胀与实际通胀：意外通胀使债务人受益。"],"exams":{"AP":"Macro Unit 4 (4.2, 4.6–4.7); Unit 5 (5.1–5.2)","IB":"3.5","AL":"9708 AS 5.2; A2 10.1–10.2","IEO":"Monetary policy, interest rates & inflation expectations","NEC":"Macro: monetary policy & Phillips curve"},"diagram":"phillips"},{"id":"M6","unit":"macro","title_zh":"经济增长","title_en":"Economic Growth","level":"G9+","summary":"长期生活水平取决于人均实际GDP的增长。本课分析增长的来源（物质资本、人力资本、技术与制度）、生产函数与增长核算，用“70法则”感受复利的力量，并以索洛模型的直觉解释追赶效应和可持续增长。","concepts":[{"zh":"经济增长","en":"Economic growth","def":"潜在产出（或人均实际GDP）的持续增加，图形上表现为 LRAS 右移或生产可能性曲线 (PPC) 外移。"},{"zh":"物质资本","en":"Physical capital","def":"用于生产的机器、厂房、基础设施等，由投资积累而来。"},{"zh":"人力资本","en":"Human capital","def":"劳动者通过教育、培训、健康和经验获得的知识与技能。"},{"zh":"技术进步","en":"Technological progress","def":"用同样投入生产更多产出的知识改进，是长期人均增长的根本源泉，即全要素生产率 (TFP) 的增长。"},{"zh":"制度","en":"Institutions","def":"产权保护、法治、合同执行、低腐败、稳定的政治环境等“游戏规则”，决定人们是否愿意投资和创新。"},{"zh":"劳动生产率","en":"Labor productivity","def":"每小时（或每个工人）的产出，是人均收入的直接决定因素。"},{"zh":"边际收益递减","en":"Diminishing returns to capital","def":"在其他投入不变时，每增加一单位资本带来的产出增量递减。"},{"zh":"追赶效应/趋同","en":"Catch-up effect / convergence","def":"资本较少的穷国资本边际产出更高，在其他条件相同时增长更快，逐步接近富国。条件趋同要求制度、储蓄率等相似。"},{"zh":"稳态","en":"Steady state (Solow model)","def":"投资恰好弥补折旧（和人口增长稀释）时，人均资本和人均产出不再变化；持续的人均增长只能来自技术进步。"},{"zh":"可持续发展","en":"Sustainable growth","def":"满足当代需要而不损害后代满足其需要的能力；要考虑自然资本 (natural capital) 的耗减和环境外部性。"}],"formulas":[{"name":"70法则","f":"翻倍年数 ≈ 70 ÷ 年增长率(%)","note":"来自 ln2 ≈ 0.693；增长率越低近似越准。"},{"name":"劳动生产率","f":"Productivity = 实际产出 ÷ 劳动小时","note":"生产率增长率 ≈ 产出增长率 − 工时增长率。"},{"name":"柯布-道格拉斯生产函数","f":"Y = A × K^α × L^(1−α)","note":"常用 α ≈ 0.3。"},{"name":"增长核算","f":"g_Y = g_A + α·g_K + (1−α)·g_L","note":"g_A 为全要素生产率 (TFP) 增长。"},{"name":"人均增长","f":"g(Y/L) ≈ g_Y − g_L","note":""}],"sections":[{"h":"增长的来源","body":"人均产出 = 生产率，而生产率取决于：\n- **物质资本/工人**：更多更好的机器和基础设施。\n- **人力资本**：教育与培训使工人更高效。\n- **自然资源**：有帮助但并非必要（日本、新加坡资源匮乏却很富裕，“资源诅咒” resource curse 也值得注意）。\n- **技术**：新知识、新工艺；研发 (R&D) 与知识溢出。\n- **制度**：产权与法治保证投资者能获得回报，是深层原因（Acemoglu & Robinson 的包容性制度 inclusive institutions 观点）。\n政策：鼓励储蓄与投资、教育投入、研发补贴与专利保护、开放贸易、改善营商环境。"},{"h":"复利的力量：70法则","body":"**例题**：A国人均GDP 4,000 美元、增长 7%；B国 16,000 美元、增长 1.75%。\n- A 每 70 ÷ 7 = 10 年翻倍，20年后约 16,000（精确 4,000 × 1.07²⁰ ≈ 15,479）。\n- B 每 40 年翻倍，20年后约 16,000 × √2 ≈ 22,600。\n虽然A的水平达到了B今天的水平，但B也在增长，差距的完全消除需要更久。增长率1–2个百分点的差异，长期会带来巨大的生活水平差别。"},{"h":"生产函数与增长核算","body":"设 Y = A·K^0.3·L^0.7。若资本增长4%、劳动增长1%、TFP 增长1.5%，则\ng_Y = 1.5% + 0.3 × 4% + 0.7 × 1% = **3.4%**，人均增长 ≈ 3.4% − 1% = 2.4%。\n**生产率计算**：40 名工人每人工作8小时（320小时）生产1,200件，生产率 3.75件/小时；次年330小时生产1,320件，生产率 4.0，增长约 **6.7%**。"},{"h":"索洛模型直觉与追赶","body":"由于资本边际收益递减，单靠不断增加资本不能带来持续的人均增长：\n- 提高储蓄率会使经济进入更高的稳态**水平**，过渡期增长加快，但长期人均增长率回到由技术进步决定的水平。\n- 资本少的国家边际产出高，增长快——**追赶效应**，解释了二战后日本、韩国及中国的高速增长；但若制度薄弱，穷国未必趋同（条件趋同）。\n**可持续性**：若增长依赖耗竭不可再生资源或造成严重污染，GDP会高估真实福利；“绿色GDP”、真实储蓄 (genuine savings) 等指标会扣除自然资本损耗。"}],"pitfalls":["把短期AD扩张（产出缺口缩小）当作长期经济增长（潜在产出增加）。","用单利思维计算长期增长，如 4,000 × (1 + 0.07 × 20)，严重低估复利效果。","认为提高储蓄率能永久提高人均增长率——在索洛模型中它只提高稳态水平。","忘记人均增长 = 总产出增长 − 人口增长。","认为自然资源丰富是增长的必要条件，忽视制度与人力资本。"],"exams":{"AP":"Macro Unit 5 (5.6)","IB":"3.3 (growth); 4.7–4.10 (development)","AL":"9708 AS 4.4; A2 9.3","IEO":"Economic growth, productivity & institutions","NEC":"Macro: economic growth"},"diagram":"lras"},{"id":"M7","unit":"macro","title_zh":"国际经济","title_en":"International Economics","level":"G10+","summary":"开放经济中，一国通过贸易和资本流动与世界相连。本课讲解国际收支平衡表、外汇市场与汇率决定（利率、通胀、购买力平价）、固定与浮动汇率制度，以及关税、配额的福利分析与贸易政策、全球化和发展问题。","concepts":[{"zh":"国际收支平衡表","en":"Balance of payments (BoP)","def":"记录一国居民与外国之间所有经济交易的账户，由经常账户、资本账户和金融账户组成，总和（含误差与遗漏）为零。"},{"zh":"经常账户","en":"Current account","def":"货物和服务贸易差额 + 初次收入（投资收益、工资）+ 二次收入（汇款、援助等经常转移）。"},{"zh":"资本与金融账户","en":"Capital & financial account","def":"记录资产所有权的跨境买卖：直接投资 (FDI)、证券投资、其他投资及官方储备资产变化；资本账户记录资本转移等少量项目。"},{"zh":"升值与贬值","en":"Appreciation vs depreciation","def":"本币能换到更多外币即升值（浮动汇率下）；在固定汇率下，官方调整分别称为升值重估 (revaluation) 和贬值 (devaluation)。"},{"zh":"外汇需求与供给","en":"Demand for & supply of a currency","def":"对某货币的需求来自外国人购买该国出口品和资产；供给来自本国居民购买进口品和外国资产。"},{"zh":"购买力平价","en":"Purchasing power parity (PPP)","def":"长期中汇率应调整到使同一篮子商品在各国价格相同；相对PPP：高通胀国家货币趋于贬值。"},{"zh":"固定与浮动汇率","en":"Fixed vs floating exchange rates","def":"浮动汇率由市场供求决定；固定汇率由央行通过买卖外汇储备维持在目标水平。"},{"zh":"关税","en":"Tariff","def":"对进口商品征税，提高国内价格、增加国内生产、减少进口，产生政府收入和无谓损失。"},{"zh":"进口配额","en":"Import quota","def":"对进口数量的直接限制；价格效应可与关税相同，但“配额租金” (quota rents) 归许可证持有人（常是外国出口商）而非政府。"},{"zh":"全球化与发展","en":"Globalization & development","def":"商品、资本、人员与技术跨境流动加深，带来专业化和技术扩散的收益，也带来分配效应和外部冲击风险。"}],"formulas":[{"name":"国际收支恒等式","f":"经常账户 + 资本账户 + 金融账户 + 误差与遗漏 = 0","note":"经常账户赤字对应资本/金融账户的净流入。"},{"name":"汇率换算","f":"外币价格 × 汇率(本币/外币) = 本币价格","note":"例：$50 × 7.2 ¥/$ = ¥360。"},{"name":"绝对PPP","f":"E_PPP = P_本国 ÷ P_外国","note":"实际汇率高于 E_PPP（每外币换更多本币）说明本币被低估。"},{"name":"相对PPP","f":"%ΔE ≈ π_本国 − π_外国","note":"E 以本币/外币表示。"},{"name":"关税收入与无谓损失","f":"收入 = t × 关税后进口量；DWL = ½·t·ΔQs + ½·t·ΔQd","note":"两个三角形分别是生产扭曲和消费扭曲。"}],"sections":[{"h":"国际收支平衡表","body":"- **经常账户**：出口、进口、海外投资收益、侨汇。\n- **金融账户**：外国人买本国工厂、股票、国债（资本流入）；本国人买外国资产（资本流出）；央行外汇储备变化。\n经常账户赤字意味着该国消费和投资超过其收入，需要向外国借款或出售资产来融资，因此金融（及资本）账户出现等额的**净流入**。\n**例题**：货物出口500、进口620，服务净额 +30，初次收入 −20，二次收入 +10，则经常账户 = −100，资本与金融账户（含储备）需净流入约 100。"},{"h":"外汇市场与汇率决定","body":"以美元/人民币为例：\n- **美国利率相对上升** → 外国投资者需要美元购买美国资产 → 美元需求增加 → 美元升值。\n- **本国通胀相对更高** → 本国商品变贵、出口减少 → 对本币需求减少、本币供给增加 → 本币贬值（相对PPP）。\n- **外国收入上升**、对本国商品偏好增加 → 本币需求增加 → 升值。\n- **投机预期**也会自我实现。\n汇率换算：若汇率从 7.2 ¥/$ 变为 6.8 ¥/$，人民币升值，一本 50 美元的书从 ¥360 降至 ¥340。\n**PPP例题**：巨无霸在中国卖 ¥24，在美国卖 $5，PPP 汇率 = 24 ÷ 5 = 4.8 ¥/$；若市场汇率为 7.2，人民币按PPP被**低估**约 33%。"},{"h":"固定与浮动汇率","body":"- **浮动汇率**：自动调节国际收支，货币政策独立，但汇率波动带来不确定性。\n- **固定汇率**：降低贸易不确定性、约束通胀，但需要外汇储备。若本币面临贬值压力，央行须**卖出外汇储备、买入本币**以维持汇率。\n**不可能三角 (impossible trinity)**：固定汇率、资本自由流动、独立货币政策三者不能同时实现。"},{"h":"关税与配额的福利分析","body":"**例题**：国内需求 Qd = 100 − P，供给 Qs = P − 20，世界价格 40（小国，价格接受者）。\n- 自由贸易：Qd = 60，Qs = 20，进口 40。\n- 征收每单位 10 的关税：国内价格 50，Qd = 50，Qs = 30，进口 20。\n- 关税收入 = 10 × 20 = **200**；无谓损失 (DWL) = ½ × 10 × 10 + ½ × 10 × 10 = **100**（生产扭曲 + 消费扭曲）。\n- 消费者剩余损失 = 10 × (60 + 50) ÷ 2 = 550 = 生产者剩余增加 250 + 政府收入 200 + DWL 100。\n进口配额 20 单位会产生同样的价格和DWL，但 200 的“配额租金”可能落入外国出口商手中，使本国福利损失更大。自愿出口限制 (VER) 同理。"},{"h":"贸易政策、全球化与发展","body":"保护主义的理由：保护幼稚产业 (infant industry)、国家安全、反倾销、保护就业、改善贸易条件（大国最优关税）。反对理由：DWL、报复与贸易战、低效率企业得到保护、消费者负担更高价格。\n全球化带来比较优势分工、规模经济、技术扩散和外国直接投资 (FDI)，但也可能加剧国内收入不平等、带来资本流动的“急停” (sudden stop) 风险。\n发展中国家面临的障碍：初级产品依赖与价格波动、人力资本不足、制度薄弱、债务负担；发展策略包括出口导向、外资引进、教育投资、小额信贷和改善治理。"}],"pitfalls":["把外国直接投资、购买外国债券等资产交易计入经常账户；或把侨汇、投资收益计入金融账户。","汇率报价方向弄反：¥/$ 数值下降代表人民币升值。","认为本国利率上升会使本币贬值——实际上吸引资本流入，本币升值。","计算关税收入时用自由贸易时的进口量而不是关税后的进口量。","以为配额和关税在福利上完全等价，忽略了配额租金的归属。"],"exams":{"AP":"Macro Unit 6 (6.1–6.6)","IB":"4.1–4.6 (trade & exchange rates); 4.7–4.10 (development)","AL":"9708 AS 6.1–6.5; A2 11.1–11.6","IEO":"Open economy: trade, exchange rates & BoP","NEC":"International economics"},"diagram":"fx"},{"id":"F1","unit":"finance","title_zh":"货币时间价值","title_en":"Time Value of Money","level":"G9+","summary":"今天的 1 元比一年后的 1 元更值钱，因为今天的钱可以投资赚取利息，而且未来存在不确定性与通胀。本课学习单
