利与复利、终值与现值、有效年利率、年金与贷款月供、NPV 与 IRR 项目决策，以及名义与实际收益率——这是 IEO 金融部分与所有投资决策的基础。","concepts":[{"zh":"单利","en":"Simple Interest","def":"只对本金计息，利息不再生息。利息 = 本金 × 利率 × 年数。"},{"zh":"复利","en":"Compound Interest","def":"利息加入本金继续计息（利滚利），期数越长、复利频率越高，终值越大。"},{"zh":"终值与现值","en":"Future Value / Present Value","def":"终值是今天一笔钱在未来某时点的价值；现值是未来一笔钱折算到今天的价值，折现是复利的逆运算。"},{"zh":"有效年利率","en":"Effective Annual Rate (EAR)","def":"考虑一年内复利次数后的真实年化利率；名义年利率 (APR) 相同时，复利越频繁 EAR 越高。"},{"zh":"年金","en":"Annuity","def":"在固定期数内每期金额相等的一串现金流，如房贷月供、养老金领取；永续年金 (perpetuity) 则无限期支付。"},{"zh":"净现值","en":"Net Present Value (NPV)","def":"所有未来现金流按折现率折现后的现值之和减去初始投资；NPV > 0 表示项目创造价值。"},{"zh":"内部收益率","en":"Internal Rate of Return (IRR)","def":"使项目 NPV 恰好等于 0 的折现率；IRR 高于资本成本时项目可接受。"},{"zh":"实际利率","en":"Real Interest Rate","def":"扣除通胀后的利率，衡量购买力的真实增长；费雪方程 (Fisher equation) 描述名义利率、实际利率与通胀的关系。"},{"zh":"72 法则","en":"Rule of 72","def":"资金翻倍所需年数 ≈ 72 ÷ 年利率（百分数），在 6%–10% 附近最准确。"}],"formulas":[{"name":"复利终值","f":"FV = PV × (1 + r)^n","note":"n 为期数，r 为每期利率；单利则为 FV = PV × (1 + r×n)。"},{"name":"现值","f":"PV = FV ÷ (1 + r)^n","note":"折现率越高、时间越远，现值越小。"},{"name":"有效年利率","f":"EAR = (1 + APR/m)^m − 1","note":"m 为每年复利次数；连续复利时 EAR = e^APR − 1。"},{"name":"年金现值与贷款还款额","f":"PV = PMT × [1 − (1 + r)^(−n)] ÷ r ；PMT = PV × r ÷ [1 − (1 + r)^(−n)]","note":"月供要用月利率 r = APR/12、期数 n = 年数×12。永续年金 PV = PMT ÷ r。"},{"name":"净现值","f":"NPV = −C_0 + Σ CF_t ÷ (1 + r)^t","note":"IRR 是令 NPV = 0 的 r，一般需试算或插值求得。"},{"name":"费雪方程","f":"(1 + i) = (1 + r)(1 + π) ；近似 r ≈ i − π","note":"i 名义利率，r 实际利率，π 通胀率；通胀较高时要用精确式。"}],"sections":[{"h":"为什么钱有时间价值","body":"钱有时间价值有三个原因：\n- **机会成本 (opportunity cost)**：今天的钱可以存银行或投资赚取收益；\n- **通胀 (inflation)**：未来同样数额的钱能买到的东西更少；\n- **风险 (risk)**：未来的承诺可能无法兑现。\n因此比较不同时点的现金流时，必须先把它们换算到同一时点（通常是今天），再比较大小。这就是**折现 (discounting)**。"},{"h":"单利、复利与有效年利率","body":"把 1,000 元以 5% 年利率存 3 年：\n- 单利：1,000 × (1 + 0.05×3) = **1,150 元**；\n- 复利：1,000 × 1.05³ = **1,157.63 元**。\n差额 7.63 元就是“利息的利息”。期限越长，复利的威力越大——这也是信用卡欠款越滚越多的原因。\n**APR 与 EAR**：银行常报名义年利率 (APR)。若 APR = 12%、按月复利，每月利率 1%，EAR = 1.01¹² − 1 ≈ **12.68%**。比较贷款或存款产品时，应比较 EAR 而非 APR。\n**72 法则**：年收益 8% 时，资金约 72 ÷ 8 = 9 年翻倍（精确值 ln2 ÷ ln1.08 ≈ 9.01 年）。"},{"h":"年金与贷款：月供是怎么算出来的","body":"贷款的本质是：银行今天给你的钱 = 你未来所有还款的现值。\n**例**：借 20,000 元，年利率 6%，分 3 年每年末等额还款：\nPMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ **7,482.20 元/年**。\n第 1 年利息 = 20,000 × 6% = 1,200 元，所以第一笔还款中只有 6,282.20 元用于偿还本金；越往后，利息占比越小、本金占比越大（**等额本息摊还表 amortization schedule**）。\n**永续年金**：每年永远支付 500 元、折现率 5%，现值 = 500 ÷ 0.05 = 10,000 元。"},{"h":"NPV 与 IRR：该不该投这个项目？","body":"**NPV 规则**：接受 NPV > 0 的项目；在互斥项目 (mutually exclusive projects) 中选 NPV 最大者。\n**例**：今天投 1,000，第 1、2 年末各回收 600，折现率 10%：\nNPV = −1,000 + 600/1.1 + 600/1.21 = −1,000 + 545.45 + 495.87 = **41.32 > 0**，应投资。\n**IRR 规则**：IRR > 资本成本即接受。IRR 直观但有缺陷：\n- 互斥项目规模或时点不同时，IRR 高的项目 NPV 未必高——**应以 NPV 为准**；\n- 现金流正负号多次变化时，可能存在多个 IRR。\n折现率上升时 NPV 下降，这就是加息会抑制企业投资 (investment) 的微观基础。"},{"h":"通胀与实际收益","body":"名义收益 7%、通胀 3% 时，实际收益并非精确的 4%，而是 1.07 ÷ 1.03 − 1 ≈ **3.88%**。通胀低时近似式足够，通胀高时差距明显。\n对家庭而言：存款利率低于通胀意味着**实际利率为负**，现金的购买力在缩水；对借款人而言，意外的高通胀减轻了固定利率债务的实际负担——财富从贷款人转移到借款人。\n做项目决策时要保持一致：**名义现金流配名义折现率，实际现金流配实际折现率**。"}],"pitfalls":["把 APR 当成 EAR 比较产品：按月复利 12% 的贷款实际成本约 12.68%，高于按年复利的 12.5%。","算月供时用了年利率和年数，而没有换成月利率 (APR/12) 和月数。","用 IRR 在互斥项目间做选择：规模不同的项目应比较 NPV。","名义现金流用实际折现率折现（或反过来），导致 NPV 系统性偏高或偏低。","费雪方程在高通胀时仍用 r ≈ i − π 近似，误差可能超过 1 个百分点。"],"exams":{"AP":"Macro Unit 4（名义/实际利率，部分）","IB":"—","AL":"—","IEO":"Finance: time value of money, NPV","NEC":"Macro（real vs nominal interest，部分）"},"diagram":null},{"id":"F2","unit":"finance","title_zh":"金融市场与投资","title_en":"Financial Markets & Investing","level":"G10+","summary":"金融市场把储蓄者的资金配置给需要资金的企业和政府。本课讲解股票与债券定价的核心逻辑（尤其是债券价格与收益率反向变动）、风险与收益的权衡、分散化与 CAPM 的 β、期权收益结构，以及市场有效性与套利——这些是 IEO 金融选择题的高频考点。","concepts":[{"zh":"债券","en":"Bond","def":"发行人承诺按期支付票息 (coupon) 并在到期日偿还面值 (face value) 的债务工具。"},{"zh":"到期收益率","en":"Yield to Maturity (YTM)","def":"按当前价格买入并持有到期所获得的年化收益率，即使债券未来现金流现值等于市价的折现率。"},{"zh":"股票与股利","en":"Stock & Dividend","def":"股票代表公司的所有权份额；股东获得股利 (dividend) 和资本利得 (capital gain)，但对公司资产的求偿权排在债权人之后。"},{"zh":"市盈率","en":"Price-to-Earnings Ratio (P/E)","def":"股价 ÷ 每股收益 (EPS)，反映投资者为每 1 元利润愿付的价格，高 P/E 通常意味着市场预期高增长。"},{"zh":"期望收益与方差","en":"Expected Return & Variance","def":"期望收益是各情形收益按概率加权的平均；方差（及标准差 σ）衡量收益围绕期望值的波动，即风险。"},{"zh":"系统性风险与特有风险","en":"Systematic vs Idiosyncratic Risk","def":"系统性风险影响整个市场（经济衰退、利率变动），无法分散；特有风险只影响单个公司，可通过分散化消除。"},{"zh":"贝塔系数","en":"Beta (β)","def":"资产收益对市场收益的敏感度；β = 1 与市场同步，β > 1 波动更大。CAPM 认为只有 β 所代表的系统性风险才会获得风险溢价。"},{"zh":"看涨/看跌期权","en":"Call / Put Option","def":"看涨期权赋予持有人以行权价 (strike) 买入标的的权利而非义务；看跌期权赋予以行权价卖出的权利。"},{"zh":"有效市场假说","en":"Efficient Market Hypothesis (EMH)","def":"价格已反映可获得的信息：弱式（历史价格）、半强式（所有公开信息）、强式（包括内幕信息）。"},{"zh":"套利","en":"Arbitrage","def":"利用同一资产（或等价现金流）的价格差异，无风险、零净投入地获利；套利行为会推动价格趋于一致（一价定律 law of one price）。"}],"formulas":[{"name":"债券价格","f":"P = Σ C ÷ (1 + y)^t + F ÷ (1 + y)^N","note":"C 票息，F 面值，y 到期收益率；y 上升 → P 下降。票面利率 > y 时溢价发行，< y 时折价。"},{"name":"期望收益与方差","f":"E(R) = Σ p_i R_i ；σ² = Σ p_i (R_i − E(R))²","note":"标准差 σ = √σ²。"},{"name":"两资产组合方差","f":"σ_p² = w_A²σ_A² + w_B²σ_B² + 2 w_A w_B ρ σ_A σ_B","note":"相关系数 ρ < 1 时，组合 σ 小于各资产 σ 的加权平均——这就是分散化的好处。"},{"name":"资本资产定价模型","f":"E(R_i) = R_f + β_i × [E(R_m) − R_f]","note":"E(R_m) − R_f 为市场风险溢价 (market risk premium)。"},{"name":"期权到期收益","f":"看涨 = max(S − K, 0) ；看跌 = max(K − S, 0)","note":"净利润还要减去期权费 (premium)。"},{"name":"市盈率与股息率","f":"P/E = P ÷ EPS ；股息率 = DPS ÷ P","note":"EPS 每股收益，DPS 每股股利。"}],"sections":[{"h":"债券：价格与收益率为什么反向变动","body":"债券的票息和面值是固定的。当市场利率上升，新发行债券提供更高票息，旧债券只有**降价**才能让新买家获得同样的收益率。因此**债券价格与收益率反向变动 (inverse relationship)**。\n**例**：3 年期债券，面值 1,000，年票息 5%（每年 50），市场收益率 6%：\nP = 50/1.06 + 50/1.06² + 1,050/1.06³ ≈ **973.27**，低于面值，即折价 (discount) 交易。\n期限越长的债券，对利率变化越敏感（久期 duration 越长）。这也是央行加息时长期债券价格跌得更多的原因。"},{"h":"风险、收益与分散化","body":"投资者厌恶风险，因此高风险资产必须提供更高的**期望收益**作为补偿。\n**例**：某股票在繁荣/正常/衰退三种情形下收益为 20%、5%、−10%，概率 0.3、0.5、0.2，则 E(R) = 6 + 2.5 − 2 = **6.5%**。\n**分散化 (diversification)**：把资金分散到相关性不完全的资产上，组合波动小于各资产波动的加权平均。持有足够多的股票后，**特有风险 (idiosyncratic risk)** 基本被抵消，剩下的是无法分散的**系统性风险 (systematic risk)**。\n两资产相关系数 ρ = −1 时，甚至可以构造出零风险组合。"},{"h":"CAPM 与 β：市场只奖励系统性风险","body":"既然特有风险可以免费分散掉，市场就不会为它支付溢价。CAPM 说资产的期望收益只取决于 β：\nE(R) = R_f + β × (E(R_m) − R_f)。\n**例**：无风险利率 3%，市场期望收益 8%，某股票 β = 1.5，则要求收益 = 3% + 1.5 × 5% = **10.5%**。\n若分析师预测该股期望收益只有 9%，低于 CAPM 要求，则说明它**被高估**（α 为负），理性投资者会卖出，价格下跌直到期望收益回到 10.5%。"},{"h":"股票估值、期权与市场有效性","body":"- **P/E**：股价 60、EPS 4，P/E = 15；若每股股利 1.8，股息率 = 3%。\n- **期权**：买入行权价 50 的看涨期权、期权费 3。到期股价 58 时收益 = 8，净利润 = 5；股价低于 50 时放弃行权，最大损失为期权费 3。看跌期权则在股价下跌时获利，常用于**对冲 (hedging)**。\n- **有效市场假说**：在半强式有效市场中，公开信息（财报、新闻）发布后会迅速反映到价格里，因此根据公开信息交易无法持续获得超额收益，这也是低成本指数基金 (index fund) 流行的理论依据。\n- **套利**：若一项资产一年后确定支付 110、无风险利率 5%，它的公允价值为 110/1.05 ≈ 104.76。若市价只有 102，就可以借钱买入，锁定无风险利润——套利者的买入会把价格推回 104.76。"}],"pitfalls":["以为利率上升时债券价格也上升——恰好相反，价格与收益率反向变动。","认为分散化可以消除所有风险：它只能消除特有风险，系统性风险（β）无法分散。","用总波动 σ 而不是 β 来判断 CAPM 下的要求收益。","期权到期收益与净利润混淆：净利润 = 到期收益 − 期权费。","把“市场有效”理解为“价格永远正确”：EMH 只说无法用已有信息系统性获利，不代表不会出现泡沫。"],"exams":{"AP":"Macro Unit 4（financial assets；bond prices & interest rates）","IB":"—","AL":"—","IEO":"Finance: financial markets, risk & return, portfolio","NEC":"Macro（bond prices & interest rates，部分）"},"diagram":null},{"id":"F3","unit":"finance","title_zh":"个人理财与金融素养","title_en":"Personal Finance & Financial Literacy","level":"G8+","summary":"个人理财是把经济学工具用于自己的生活：做预算、管理信用与债务、用保险转移风险、为养老储蓄、理解税收与通胀对家庭的影响，并识别诈骗与自身的行为偏差。IEO 金融部分常以“为一个家庭做理财规划”的模拟形式出现，需要把这些知识综合运用。","concepts":[{"zh":"预算","en":"Budget","def":"对收入与支出的计划。常用 50/30/20 法则：税后收入的 50% 用于必需品，30% 用于可选消费，20% 用于储蓄和还债。"},{"zh":"应急基金","en":"Emergency Fund","def":"通常为 3–6 个月生活费的高流动性储蓄，用于应对失业、疾病等冲击，避免被迫借高息债。"},{"zh":"信用评分","en":"Credit Score","def":"贷款方评估借款人违约风险的分数；按时还款记录 (payment history) 和信用额度使用率 (credit utilization) 是最重要的因素。"},{"zh":"复利债务","en":"Compound Debt","def":"未还清的信用卡余额会按月复利计息；只还最低还款额 (minimum payment) 可能需要多年才能还清并支付大量利息。"},{"zh":"保险：保费与免赔额","en":"Insurance: Premium & Deductible","def":"保费是购买保险的价格；免赔额是损失中由投保人自付的部分，免赔额越高，保费通常越低。"},{"zh":"期望损失","en":"Expected Loss","def":"损失概率 × 损失金额。精算公平保费 (actuarially fair premium) 等于期望损失；风险厌恶者愿意支付高于期望损失的保费。"},{"zh":"养老金与退休储蓄","en":"Pension & Retirement Saving","def":"通过雇主或个人账户长期储蓄。越早开始，复利时间越长；雇主配缴 (employer match) 相当于即时的高回报。"},{"zh":"边际税率与平均税率","en":"Marginal vs Average Tax Rate","def":"边际税率是最后一元收入适用的税率；平均税率是总税额 ÷ 总收入。累进税制下，进入更高档只对超出部分征收更高税率。"},{"zh":"行为偏差","en":"Behavioral Biases","def":"系统性偏离理性决策的倾向，如损失厌恶 (loss aversion)、过度自信 (overconfidence)、从众 (herding)、现时偏好 (present bias)。"},{"zh":"庞氏骗局","en":"Ponzi Scheme","def":"用新投资者的钱支付老投资者“收益”的诈骗；典型特征是承诺高额且稳定的回报、业务不透明、催促投资、鼓励拉人头。"}],"formulas":[{"name":"期望损失","f":"E(Loss) = p × L","note":"p 为损失概率，L 为损失额；有免赔额 D 时保险赔付 = max(L − D, 0)（不超过保额）。"},{"name":"信用卡欠款增长","f":"余额_n = B × (1 + APR/12)^n","note":"不还款也不新增消费时，n 个月后的余额。"},{"name":"定期定额储蓄终值","f":"FV = PMT × [(1 + r)^n − 1] ÷ r","note":"每期末存入 PMT，年金终值。"},{"name":"实际购买力变化","f":"实际收益 = (1 + i) ÷ (1 + π) − 1","note":"存款利率 i 低于通胀 π 时为负。"}],"sections":[{"h":"预算、应急基金与“先付给自己”","body":"理财的第一步是知道钱去了哪里。**50/30/20 法则**：税后月收入 4,000 元，则约 2,000 元用于房租、食物等必需品，1,200 元用于可选消费，**800 元**用于储蓄与还债。\n顺序很重要：\n- 先建立 3–6 个月生活费的**应急基金**；\n- 再还清高息债务（信用卡利率常高于任何投资的稳定收益）；\n- 然后争取雇主养老金配缴，再做长期投资。\n**先付给自己 (pay yourself first)**：发工资当天自动转入储蓄账户，用制度对抗现时偏好 (present bias)。"},{"h":"信用、信用卡与复利债务","body":"信用卡 APR 18%、按月复利，3,000 元欠款一年不还：3,000 × 1.015¹² ≈ **3,586.85 元**，EAR 约 19.56%。\n只还最低还款额的危险在于：大部分还款都在付利息，本金下降极慢。\n维护信用评分：\n- 按时还款（最重要）；\n- 信用额度使用率保持较低（如 30% 以下）；\n- 不要短时间内频繁申请新贷款。\n良好的信用评分意味着更低的房贷、车贷利率——这本身就是一笔可观的“收益”。"},{"h":"保险：用小额确定支出换取大额不确定损失","body":"保险的经济学基础是**风险厌恶 (risk aversion)** 与**风险汇集 (risk pooling)**。\n**例**：你的车一年内有 2% 概率发生 20,000 元的损失，期望损失 = 0.02 × 20,000 = **400 元**。精算公平保费为 400 元；保险公司还要覆盖管理费和利润，所以实际保费更高，而风险厌恶的你仍然愿意购买。\n**免赔额**：免赔额 500 元，损失 3,000 元时保险公司赔 2,500 元。提高免赔额可以降低保费，也减少了**道德风险 (moral hazard)**——投保人会更小心。\n原则：为你**承受不起**的大损失投保（医疗、房屋、责任险），小损失自己承担。"},{"h":"养老、税收与通胀","body":"**越早越好**：每年存 3,000 元、年收益 6%，存 40 年终值 ≈ 464,286 元；推迟 10 年只存 30 年 ≈ 237,175 元。少存了 30,000 元本金，终值却少了约 227,111 元——这就是复利时间的威力。\n**累进税 (progressive tax)**：进入更高税档只对超出部分适用更高的**边际税率**，“加薪反而到手变少”的说法在标准累进税制下不成立。\n**通胀与家庭**：存款利率 2%、通胀 5% 时，实际购买力每年下降约 2.86%。央行 (central bank) 加息以抑制通胀时，存款利率和贷款利率都会上升——浮动利率房贷的月供会增加，储蓄者则受益。"},{"h":"诈骗红旗与投资中的行为偏差","body":"**诈骗红旗 (red flags)**：\n- 承诺“保本高收益”“稳赚不赔”；\n- 催促马上决定、要求保密；\n- 业务模式说不清，靠拉新人获利；\n- 要求用加密货币、礼品卡或转账到个人账户付款。\n**常见行为偏差**：\n- **损失厌恶 / 处置效应 (disposition effect)**：过早卖出赚钱的股票、死扛亏损的股票；\n- **过度自信**：频繁交易，交易成本吞噬收益；\n- **从众**：追涨杀跌，在泡沫顶部买入；\n- **沉没成本谬误 (sunk cost fallacy)**：因为“已经亏了那么多”而不愿止损。\n对策：设定规则、分散投资、低成本长期持有。"}],"pitfalls":["以为收入进入更高税档后全部收入都按高税率征税——只有超出部分适用更高边际税率。","把保费和期望损失混为一谈：商业保费通常高于期望损失，但为大额风险投保依然合理。","有高息信用卡欠款时却优先投资——还清 20% 利率的债务相当于获得 20% 的无风险收益。","只看名义存款利率而忽略通胀，误以为存款在“增值”。","把“过去收益很高”当成未来收益的保证（外推偏差 extrapolation）。"],"exams":{"AP":"Macro Unit 2.4–2.6, 4.1（通胀成本、金融资产，部分）","IB":"—","AL":"—","IEO":"Finance: personal financial planning (simulation)","NEC":"—"},"diagram":null},{"id":"F4","unit":"finance","title_zh":"商业案例与企业决策","title_en":"Business Cases & Firm Decisions","level":"G9+","summary":"IEO 团队商业案例与 NEC 决赛的批判性思维轮都要求学生在有限时间内分析真实商业问题并向评委陈述。本课提供结构化框架（利润树、市场规模估算、4P、波特五力、SWOT）、单位经济学（CAC、LTV、边际贡献、盈亏平衡）、定价策略、三张财务报表的基础，以及如何做一场有说服力的陈述。","concepts":[{"zh":"利润树","en":"Profitability Tree","def":"利润 = 收入 − 成本；收入 = 价格 × 销量，成本 = 固定成本 + 单位变动成本 × 销量。用于定位利润下滑的根源。"},{"zh":"市场规模估算","en":"Market Sizing","def":"用自上而下 (top-down) 或自下而上 (bottom-up) 的假设链条估算市场总量，重在逻辑清晰、假设合理。"},{"zh":"边际贡献","en":"Contribution Margin","def":"单价 − 单位变动成本，即每多卖一件对覆盖固定成本和利润的贡献；边际贡献率 = 边际贡献 ÷ 单价。"},{"zh":"盈亏平衡点","en":"Break-even Point","def":"总收入等于总成本时的销量：固定成本 ÷ 单位边际贡献。"},{"zh":"获客成本与用户终身价值","en":"CAC & LTV","def":"CAC 是获取一个新客户的平均营销和销售支出；LTV 是一个客户在整个生命周期内贡献的边际贡献（常按 月边际贡献 ÷ 月流失率 估算）。LTV/CAC ≥ 3 常被视为健康。"},{"zh":"波特五力","en":"Porter's Five Forces","def":"分析行业吸引力的五种力量：现有竞争者的竞争、新进入者威胁、替代品威胁、供应商议价能力、买方议价能力。"},{"zh":"SWOT 分析","en":"SWOT","def":"内部优势 (Strengths)、劣势 (Weaknesses)，外部机会 (Opportunities)、威胁 (Threats)。"},{"zh":"营销 4P","en":"Marketing Mix 4P","def":"产品 (Product)、价格 (Price)、渠道 (Place)、推广 (Promotion)。"},{"zh":"三张财务报表","en":"Financial Statements","def":"利润表 (income statement) 反映一段时期的盈利；资产负债表 (balance sheet) 反映某一时点的资产 = 负债 + 所有者权益；现金流量表 (cash flow statement) 反映现金的实际流入流出。"}],"formulas":[{"name":"利润","f":"π = (P − AVC) × Q − FC","note":"P 单价，AVC 单位变动成本，FC 固定成本。"},{"name":"盈亏平衡销量","f":"Q_BE = FC ÷ (P − AVC)","note":"目标利润 T 时：Q = (FC + T) ÷ (P − AVC)；税后目标利润需先除以 (1 − 税率)。"},{"name":"盈亏平衡收入","f":"Revenue_BE = FC ÷ 边际贡献率","note":"边际贡献率 = (P − AVC) ÷ P。"},{"name":"用户终身价值","f":"LTV ≈ 每期边际贡献 × (1 ÷ 每期流失率)","note":"1 ÷ 流失率 = 平均客户寿命（期数）；回本期 = CAC ÷ 每期边际贡献。"},{"name":"会计恒等式","f":"资产 = 负债 + 所有者权益","note":"每笔交易都保持两边相等。"}],"sections":[{"h":"拆解问题：利润树与市场规模","body":"面对“公司利润下降，怎么办？”先拆成**收入端**与**成本端**：\n- 收入 = 价格 × 销量：是降价了，还是销量减少？销量减少是市场萎缩还是份额丢失？\n- 成本 = 固定成本 + 变动成本：哪一项在上升？是原材料涨价还是效率下降？\n**市场规模例**：某城市 800 万人，平均每户 2.5 人 → 320 万户；40% 养狗 → 128 万户；每户每月买 1 袋狗粮 → 每年约 **1,536 万袋**。评委看重的是假设链条是否清晰、可检验，而不是精确数字。"},{"h":"单位经济学：边际贡献、盈亏平衡、CAC 与 LTV","body":"**盈亏平衡例**：奶茶店固定成本每月 12,000 元，每杯售价 20 元、变动成本 8 元，边际贡献 12 元 → 盈亏平衡 = 12,000 ÷ 12 = **1,000 杯/月**。\n**订阅制例**：用户每月付 30 元、毛利率 60%，月流失率 5% → 平均寿命 20 个月，LTV = 30 × 60% × 20 = **360 元**；若 CAC = 120 元，LTV/CAC = 3，回本期 = 120 ÷ 18 ≈ 6.7 个月。\n关键洞察：高增长但 LTV < CAC 的企业“卖得越多亏得越多”。改善方法包括降低流失 (churn)、提高客单价、降低获客成本（如转介绍 referral）。"},{"h":"战略框架：五力、SWOT、4P 与定价","body":"- **波特五力**判断行业是否值得进入：进入壁垒低、替代品多、买方议价能力强的行业利润率通常较低。\n- **SWOT** 把内部能力与外部环境对应起来，形成 SO（用优势抓机会）、WT（弥补劣势规避威胁）等策略。\n- **4P** 用于设计进入市场的方案。\n**定价策略**：成本加成 (cost-plus)、价值定价 (value-based)、渗透定价 (penetration)、撇脂定价 (skimming)、价格歧视 (price discrimination)。\n**降价是否划算？** 售价 10、变动成本 6，目前卖 5,000 件，总边际贡献 20,000。降价到 9 后单位边际贡献只剩 3，需要卖 **6,667 件（+33%）** 才能保持利润不变——这取决于需求价格弹性 (PED)。"},{"h":"读懂财务报表","body":"- **利润表**：收入 − 销售成本 = 毛利；再减经营费用、折旧、利息、税 = 净利润。\n- **资产负债表**：资产 = 负债 + 所有者权益。借款买设备：资产（设备）增加，负债增加，权益不变。\n- **现金流量表**：经营、投资、筹资三类现金流。\n**利润 ≠ 现金**：赊销 1,000 元商品（成本 600），利润表确认利润 400，但现金尚未收到——应收账款 (accounts receivable) 增加 1,000，存货减少 600。很多盈利的公司因为现金流断裂而倒闭；折旧 (depreciation) 则相反，减少利润但不消耗当期现金。"},{"h":"如何向评委陈述（IEO 商业案例 / NEC 决赛）","body":"- **结论先行 (answer first)**：第一分钟就给出建议，再用 3 个论点支撑（金字塔原理 pyramid principle）。\n- **用数字说话**：每个论点配一个关键数据（盈亏平衡点、LTV/CAC、市场规模）。\n- **明确假设和风险**：列出最敏感的假设，并说明如果它错了怎么办（情景分析 scenario analysis）。\n- **可执行的下一步**：时间表、负责人、衡量成功的指标 (KPI)。\n- **回答提问**：先复述问题，承认不确定性，再给出你的判断；不要被评委的挑战动摇到放弃主结论，除非对方指出了关键错误。"}],"pitfalls":["盈亏平衡计算时用单价而不是单位边际贡献去除固定成本。","把利润等同于现金流，忽略应收账款、存货和资本支出的影响。","只看收入增长，不看 LTV/CAC——获客越多亏损越大的模式不可持续。","框架套用过度：把 SWOT 四格都填满却没有得出任何建议。","陈述时先讲过程最后才给结论，评委在前两分钟就失去了注意力。"],"exams":{"AP":"Micro Unit 3（costs, profit，部分）","IB":"—（厂商理论见 HL 微观，部分）","AL":"9708 A Level 7（firm objectives & costs，部分）","IEO":"Business case (team round)","NEC":"Finals critical-thinking case"},"diagram":"costs"},{"id":"F5","unit":"finance","title_zh":"制度与经济思想","title_en":"Institutions & Economic Thought","level":"G9+","summary":"市场运转依赖制度：产权、合同、法律与规范决定了人们面对的激励。本课讲解产权与公地悲剧、委托–代理问题与激励合同（CORE《The Economy》的核心框架），梳理从斯密到弗里德曼的经济思想脉络与关键争论，并示范如何用经济学推理分析通胀、关税、人工智能与劳动力市场等时事话题——这正是 IEO 与 NEC 决赛偏爱的题型。","concepts":[{"zh":"制度","en":"Institutions","def":"约束人们互动的“游戏规则”，包括正式制度（法律、产权、合同）与非正式制度（社会规范）；决定了激励与收益分配。"},{"zh":"产权","en":"Property Rights","def":"对资源使用、获益与转让的受法律保护的权利。产权清晰可激励投资与保护资源，缺失则易导致公地悲剧 (tragedy of the commons)。"},{"zh":"委托–代理问题","en":"Principal–Agent Problem","def":"代理人（如员工、CEO）的行动无法被委托人（雇主、股东）完全观察，且双方利益不一致，导致代理人不按委托人利益行事。"},{"zh":"道德风险与逆向选择","en":"Moral Hazard & Adverse Selection","def":"道德风险是签约后隐藏行动（如投保后不再小心）；逆向选择是签约前隐藏信息（如高风险者更愿意买保险）。"},{"zh":"就业租金","en":"Employment Rent","def":"CORE 术语：工人从当前工作中获得的收益超过次优选择（保留选择 reservation option）的部分；就业租金越大，工人越努力以避免失业。"},{"zh":"比较优势","en":"Comparative Advantage","def":"李嘉图 (Ricardo) 提出：机会成本更低的一方应专业化生产该商品，即使另一方在所有商品上都有绝对优势，贸易仍能互利。"},{"zh":"看不见的手","en":"Invisible Hand","def":"斯密 (Adam Smith) 的比喻：在竞争市场中，个人追求自身利益可能在无意中促进社会整体福利。"},{"zh":"有效需求","en":"Effective Demand","def":"凯恩斯 (Keynes) 强调总需求不足会导致持续失业，政府可通过财政政策稳定经济。"},{"zh":"知识问题","en":"Knowledge Problem","def":"哈耶克 (Hayek) 认为经济所需信息分散在无数个人手中，价格体系是汇总这些信息的机制，中央计划者无法替代。"},{"zh":"货币主义","en":"Monetarism","def":"弗里德曼 (Friedman) 主张“通胀无论何时何地都是一种货币现象”，强调稳定货币增长规则。"}],"formulas":[{"name":"货币数量论","f":"M × V = P × Y ；%ΔM + %ΔV ≈ %ΔP + %ΔY","note":"V 稳定时，通胀率 ≈ 货币增速 − 实际产出增速。"},{"name":"就业租金","f":"就业租金 = 工作的净收益 − 保留选择的净收益","note":"按周或按小时计；乘以预期失业持续期可得失业的总损失。"},{"name":"机会成本（比较优势）","f":"生产 X 的机会成本 = 放弃的 Y 数量 ÷ 生产的 X 数量","note":"机会成本较低的一方拥有比较优势。"}],"sections":[{"h":"制度、产权与激励","body":"为什么有的国家富裕、有的贫穷？CORE《The Economy》的回答之一是**制度**：同样的人，在不同规则下会做出不同选择。\n- **产权 (property rights)** 清晰时，农民愿意改良土地、企业愿意投资，因为收益归自己；\n- **开放获取资源 (open-access resource)**（如公海渔场）没有所有者，每个渔民都只考虑自己的收益而忽略对他人的影响，导致过度捕捞——**公地悲剧**；\n- 解决方案：界定产权（可交易捕捞配额 ITQs）、政府管制，或奥斯特罗姆 (Elinor Ostrom) 所研究的社区自治规则。"},{"h":"委托–代理与激励合同","body":"当努力无法被观察时，合同就要设计激励：\n- **计件工资 / 提成**：激励强，但让工人承担收入风险；\n- **股票期权**：让 CEO 的收益与股价挂钩，缓解股东与经理人的利益冲突，但可能诱发短期行为；\n- **效率工资 (efficiency wage)**：CORE 的劳动纪律模型中，雇主支付高于工人保留选择的工资，创造**就业租金**，工人因害怕失去这份租金而努力工作。\n**例**：周薪 600，失业时保留选择价值 450/周，就业租金 = 150/周；若预期失业持续 10 周，被解雇的损失为 **1,500**。失业率越高、失业救济越低，就业租金越大，雇主就能以更低工资激励努力——这解释了为什么均衡中总存在一定失业。"},{"h":"经济思想简史与关键争论","body":"- **亚当·斯密 (1776《国富论》)**：分工与“看不见的手”，同时警惕商人合谋。\n- **大卫·李嘉图 (1817)**：比较优势与自由贸易；地租理论。\n- **卡尔·马克思**：资本主义的动态与冲突，关注劳动者与资本所有者之间的分配和权力关系。\n- **凯恩斯 (1936《通论》)**：大萧条中总需求不足导致持续失业，主张逆周期财政政策。\n- **哈耶克**：价格体系汇总分散知识，批评中央计划。\n- **弗里德曼**：货币主义、自然失业率与预期；“通胀是货币现象”。\n**持久的争论**：市场 vs 政府的边界、规则 vs 相机抉择 (rules vs discretion)、效率 vs 公平。好的答案不是“站队”，而是说明在什么条件下哪种观点更适用。"},{"h":"用经济学推理分析时事","body":"NEC 与 IEO 喜欢考“用模型解释新闻”。通用步骤：**识别冲击 → 选择模型 → 判断方向 → 讨论谁得谁失 → 指出不确定性**。\n- **通胀episode**：区分需求拉动 (demand-pull，如大规模刺激) 与成本推动 (cost-push，如能源或供应链冲击)。用 MV = PY 做粗略检验：货币增速 8%、实际增长 3%、V 稳定 → 通胀约 5%。\n- **关税 (tariff)**：国内价格上升，国内生产者与政府（关税收入）获益，消费者与使用该产品作为投入品的下游产业受损，产生无谓损失 (deadweight loss)；还可能引发报复。\n- **人工智能与劳动力市场**：用**任务视角 (task-based view)**——AI 替代部分任务（替代效应），同时提高生产率、创造新任务（生产率效应、新任务效应）。与 AI 互补的技能工资可能上升，被替代任务集中的岗位面临压力；总体就业影响取决于这些效应的相对大小以及制度（培训、社会保障）。"}],"pitfalls":["把“看不见的手”理解为斯密主张政府完全不干预——斯密也讨论了公共品、教育与垄断问题。","混淆比较优势与绝对优势：贸易模式由机会成本决定。","认为关税由外国出口商全部承担：在多数情况下国内消费者和下游企业承担了相当部分。","把道德风险（签约后隐藏行动）与逆向选择（签约前隐藏信息）弄反。","时事题只写立场不写机制：必须说明冲击通过哪条渠道影响哪些变量。"],"exams":{"AP":"Micro Unit 1（comparative advantage）；Macro 5（monetary theory，部分）","IB":"Unit 1 Introduction（1.3 economic thought）；4.2（trade）","AL":"9708 AS 1（basic economic ideas）；AS 6（trade，部分）","IEO":"CORE The Economy: institutions, incentives, contracts, labour discipline","NEC":"Micro / International core；Finals current-events case"},"diagram":"ppc"}],"questions":[{"id":"m1-01","t":"m1","lv":1,"ex":["AP","IB","NEC"],"q":"Mia can either work a 3-hour shift at $15 per hour or use those same 3 hours to attend a concert whose ticket costs $40. What is Mia's opportunity cost of attending the concert?","o":["$40","$45","$85","$125"],"a":2,"e":"机会成本 (opportunity cost) = 显性成本 + 隐性成本 = 门票 $40 + 放弃的工资 3×$15 = $45，合计 $85。只算门票（$40）或只算工资（$45）都遗漏了一部分。"},{"id":"m1-02","t":"m1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An economy is producing at a point inside its production possibility curve (PPC). This indicates that","o":["the combination is unattainable with current resources","some resources are unemployed or used inefficiently","the economy has achieved allocative efficiency","technology has recently improved"],"a":1,"e":"PPC 内部的点代表资源闲置或利用无效率（如失业）。PPC 外部的点才是当前不可达；技术进步会使 PPC 外移，而不是使生产点落在曲线内部。"},{"id":"m1-03","t":"m1","lv":1,"ex":["AP","IB","AL"],"q":"A PPC that is bowed outward (concave to the origin) reflects","o":["constant opportunity costs","the law of diminishing marginal utility","increasing opportunity costs because resources are not equally suited to producing both goods","perfectly substitutable resources"],"a":2,"e":"资源具有专用性 (specialized resources)，多生产一种商品需要放弃越来越多的另一种商品，即机会成本递增，所以 PPC 外凸。机会成本不变或资源完全可替代对应直线 PPC；边际效用递减是消费者理论概念，与 PPC 形状无关。"},{"id":"m1-04","t":"m1","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"The table shows the output of one worker per day in two countries.\nWhich statement is correct?","tbl":[["Country","Wheat (tons)","Cloth (bolts)"],["Xland","8","4"],["Yland","3","3"]],"o":["No mutually beneficial trade is possible because Xland is more productive in both goods","Xland should specialize in cloth because it has an absolute advantage in cloth","Xland has a comparative advantage in both goods","Yland should specialize in cloth because its opportunity cost of cloth is lower"],"a":3,"e":"布的机会成本：Xland 1 布 = 8/4 = 2 小麦；Yland 1 布 = 3/3 = 1 小麦，所以 Yland 在布上有比较优势 (comparative advantage)，Xland 在小麦上有比较优势（0.5 布 < 1 布）。Xland 虽在两种商品上都有绝对优势，但一国不可能在两种商品上同时拥有比较优势，贸易仍然互利。"},{"id":"m1-05","t":"m1","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Using the same data (Xland: 8 wheat or 4 cloth per worker-day; Yland: 3 wheat or 3 cloth), which terms of trade would benefit BOTH countries?","o":["1 cloth for 1.5 wheat","1 cloth for 0.5 wheat","1 cloth for 2.5 wheat","1 cloth for 3 wheat"],"a":0,"e":"互利的贸易条件 (terms of trade) 必须位于两国的机会成本之间：1 布的价格在 1 小麦（Yland 的 OC）与 2 小麦（Xland 的 OC）之间。只有 1 布 = 1.5 小麦符合。0.5 小麦使出口布的 Yland 受损；2.5 或 3 小麦使进口布的 Xland 不如自己生产。"},{"id":"m1-06","t":"m1","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Computers are measured on the horizontal axis and food on the vertical axis of a PPC. A new technology raises productivity ONLY in computer production. The PPC will","o":["pivot outward along the computer axis, with the food intercept unchanged","shift outward in a parallel fashion","remain unchanged while the economy moves along it toward more computers","shift inward because resources move out of food"],"a":0,"e":"技术进步只影响电脑生产，因此电脑轴截距外移、食品截距不变，PPC 绕食品截距向外旋转 (pivot)。平行外移需要两种商品的生产能力同时提高；沿曲线移动只是产出组合的变化，并非生产能力改变。"},{"id":"m1-07","t":"m1","lv":2,"ex":["AP","IB","NEC"],"q":"A café can run extra evening study sessions. The total benefit from running sessions is shown in the table, and each session has a constant marginal cost of $10. How many sessions should the café run?","tbl":[["Sessions","Total benefit ($)"],["1","20"],["2","36"],["3","48"],["4","56"],["5","60"]],"o":["2","3","4","5"],"a":1,"e":"边际收益 (MB)：第 1–5 场分别为 20、16、12、8、4。按边际分析 (marginal analysis)，只要 MB ≥ MC（$10）就继续：第 3 场 MB = 12 > 10，第 4 场 MB = 8 < 10。所以选 3 场。选 5 场是误以为要让总收益最大。"},{"id":"m1-08","t":"m1","lv":3,"ex":["IEO","NEC"],"q":"Ann can pick 10 apples or 5 pears per day; Ben can pick 6 apples or 6 pears per day (each with a linear trade-off). Working together, they want exactly 8 pears per day. What is the maximum number of apples they can also pick?","o":["4","5","6","8"],"a":2,"e":"先比较摘梨的机会成本：Ben 1 梨 = 1 苹果，Ann 1 梨 = 10/5 = 2 苹果，所以梨先由 Ben 生产。Ben 全天摘梨得 6 个（0 苹果）；还差 2 个梨由 Ann 生产，用 2/5 天，剩余 3/5 天摘苹果 = 3/5 × 10 = 6 个。最大苹果 = 6。若让 Ann 先摘梨（错误分工）：Ann 全天摘 5 个梨，Ben 用半天摘 3 个梨、半天摘 3 个苹果，只能得到 3 个苹果。"},{"id":"m1-09","t":"m1","lv":3,"ex":["IEO","AL"],"q":"Zedland has a linear PPC: it can produce 100 units of food or 50 units of tech (or any linear combination). The world price is 1 tech = 3 food. Zedland specializes completely in tech and exports 20 tech. Compared with the maximum food it could have consumed in autarky with the same amount of tech, how much extra food does Zedland consume?","o":["10","30","60","20"],"a":3,"e":"Zedland 国内 1 tech 的机会成本 = 100/50 = 2 food，而世界价格为 3 food，所以专业化生产 tech 有利。生产 50 tech，出口 20 换来 20×3 = 60 food，消费 (30 tech, 60 food)。自给自足 (autarky) 时保留 30 tech 只能生产 100 − 2×30 = 40 food。贸易收益 = 60 − 40 = 20 food。选 60 是把进口总量误当成收益。"},{"id":"m1-10","t":"m1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"In a command economy, the questions of what, how, and for whom to produce are answered mainly by","o":["price signals in competitive markets","tradition and custom","consumer sovereignty","central government planning"],"a":3,"e":"计划（指令）经济 (command economy) 由政府中央计划决定资源配置。价格信号和消费者主权 (consumer sovereignty) 是市场经济的特征；传统和习俗对应传统经济。"},{"id":"m2-01","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following causes a movement along the demand curve for coffee, rather than a shift of the curve?","o":["A rise in the price of coffee","A rise in consumers' incomes","A fall in the price of tea","A news report that coffee improves health"],"a":0,"e":"咖啡自身价格变化只引起沿需求曲线移动，即需求量 (quantity demanded) 变化。收入、替代品（茶）价格、偏好的变化都会使整条需求曲线移动。"},{"id":"m2-02","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An improvement in the technology used to produce smartphones will, ceteris paribus,","o":["shift the demand curve to the right","shift the supply curve to the right, lowering price and raising quantity","shift the supply curve to the left, raising price","increase quantity supplied without shifting the supply curve"],"a":1,"e":"技术进步降低生产成本，使供给曲线右移，均衡价格下降、均衡数量上升。技术是供给的决定因素而非需求的决定因素；“供给量增加而曲线不动”只在商品自身价格上升时发生。"},{"id":"m2-03","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Market demand is Qd = 120 − 4P and market supply is Qs = −30 + 6P. What are the equilibrium price and quantity?","o":["P = 12, Q = 72","P = 18, Q = 48","P = 15, Q = 60","P = 9, Q = 84"],"a":2,"e":"令 Qd = Qs：120 − 4P = −30 + 6P → 10P = 150 → P = 15，Q = 120 − 60 = 60。验证：Qs = −30 + 90 = 60。P = 12 时 Qd = 72 但 Qs = 42，存在短缺，不是均衡。"},{"id":"m2-04","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In the market with Qd = 120 − 4P and Qs = −30 + 6P, what is consumer surplus at equilibrium?","o":["$900","$300","$750","$450"],"a":3,"e":"均衡 P = 15，Q = 60。需求价格截距 (choke price)：Qd = 0 → P = 30。CS = ½ × (30 − 15) × 60 = 450。$300 是生产者剩余（供给价格截距 5：½ × 10 × 60）；$750 是总剩余；$900 是忘记乘 ½。"},{"id":"m2-05","t":"m2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Demand for a good increases while its supply decreases at the same time. Which outcome is certain?","o":["Equilibrium quantity rises","Equilibrium price rises","Equilibrium quantity falls","Equilibrium price falls"],"a":1,"e":"需求右移推高价格，供给左移也推高价格，因此价格必然上升。数量方面：需求增加使 Q 上升，供给减少使 Q 下降，净效应取决于两者移动幅度，不确定 (indeterminate)。"},{"id":"m2-06","t":"m2","lv":1,"ex":["AP","IB","NEC"],"q":"Use the schedule below. If the price is set at $4, the market will experience","tbl":[["Price ($)","Qd","Qs"],["2","100","40"],["4","80","60"],["6","60","80"],["8","40","100"]],"o":["a surplus of 20 units","a shortage of 80 units","equilibrium","a shortage of 20 units"],"a":3,"e":"P = $4 时 Qd = 80，Qs = 60，Qd > Qs，短缺 (shortage) = 80 − 60 = 20。均衡在 P = 5 左右（Qd = Qs = 70）。“短缺 80”是把需求量误当成短缺量。"},{"id":"m2-07","t":"m2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The price of gasoline rises sharply. Ceteris paribus, in the market for large SUVs","o":["equilibrium price falls and equilibrium quantity falls","equilibrium price and quantity both rise","the supply of SUVs shifts to the left","quantity demanded falls but demand is unchanged"],"a":0,"e":"汽油与 SUV 是互补品 (complements)。汽油涨价使 SUV 的需求曲线左移，均衡价格和数量都下降。汽油不是 SUV 的生产投入，所以不影响 SUV 供给；“需求不变只是需求量下降”只适用于 SUV 自身价格变化。"},{"id":"m2-08","t":"m2","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Initially Qd = 120 − 4P and Qs = −30 + 6P. Rising incomes change demand to Qd = 150 − 4P. By how much does producer surplus increase?","o":["$117","$207","$300","$507"],"a":1,"e":"原均衡 P = 15，Q = 60，PS = ½ × (15 − 5) × 60 = 300。新均衡：150 − 4P = −30 + 6P → P = 18，Q = 78，PS = ½ × (18 − 5) × 78 = 507。增加 507 − 300 = 207。$507 是新 PS 的总额而非增量。"},{"id":"m2-09","t":"m2","lv":3,"ex":["IEO","NEC"],"q":"A market has 100 identical consumers, each with demand q = 10 − 2P, and 50 identical firms, each with supply q = 4P − 2 (for P ≥ 0.5). What are the market equilibrium price and quantity?","o":["P = 2.00, Q = 600","P = 3.00, Q = 400","P = 2.25, Q = 550","P = 2.75, Q = 450"],"a":3,"e":"水平加总 (horizontal summation)：市场需求 Qd = 100(10 − 2P) = 1000 − 200P；市场供给 Qs = 50(4P − 2) = 200P − 100。令两者相等：1100 = 400P → P = 2.75，Q = 1000 − 550 = 450。验证：每家企业 q = 4×2.75 − 2 = 9，50 × 9 = 450。"},{"id":"m2-10","t":"m2","lv":3,"ex":["IEO","AL"],"q":"Inverse demand is P = 100 − 2Q and inverse supply is P = 20 + 2Q. A technological improvement lowers marginal cost by $8 at every output level. What is the change in consumer surplus?","o":["+$44","+$84","+$88","+$160"],"a":1,"e":"原均衡：100 − 2Q = 20 + 2Q → Q = 20，P = 60，CS = ½ × 40 × 20 = 400。新供给 P = 12 + 2Q：100 − 2Q = 12 + 2Q → Q = 22，P = 56，CS = ½ × (100 − 56) × 22 = 484。ΔCS = +84（= 4 × 20 + ½ × 4 × 2）。注意消费者价格只下降 4，成本下降 8 由买卖双方分担；+88 是 4 × 22（多算了三角形的另一半），+160 是把 8 × 20 全部算作消费者收益。"},{"id":"m3-01","t":"m3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"When the price of a good rises from $10 to $12, quantity demanded falls from 100 to 80. Using the midpoint method, the absolute value of PED is approximately","o":["0.82","1.00","1.22","2.00"],"a":2,"e":"中点公式：%ΔQ = −20 ÷ 90 ≈ −22.2%；%ΔP = 2 ÷ 11 ≈ 18.2%；|PED| ≈ 22.2 ÷ 18.2 ≈ 1.22（富有弹性）。用初始值算得 20% ÷ 20% = 1.00 是常见陷阱；0.82 是把分子分母颠倒。"},{"id":"m3-02","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"If the demand for a product is price elastic, a firm that raises its price will see total revenue","o":["rise","stay the same","rise only if costs fall","fall"],"a":3,"e":"总收益检验 (total revenue test)：需求富有弹性时，价格上升带来的需求量下降百分比更大，TR = P × Q 下降。只有缺乏弹性时涨价才会增加 TR；TR 与成本无关。"},{"id":"m3-03","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Demand for which of the following is likely to be the MOST price inelastic?","o":["A particular brand of cola","Insulin for people with diabetes","Restaurant meals","Leisure airline tickets"],"a":1,"e":"胰岛素是必需品，几乎没有替代品，需求极缺乏弹性。某品牌可乐有大量近似替代品（市场定义越窄弹性越大）；餐馆用餐与休闲机票属于可推迟的非必需消费，弹性较大。"},{"id":"m3-04","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"When average income rises by 10%, the quantity of bus rides demanded falls by 15%. Using simple percentage changes, the income elasticity of demand (YED) and type of good are","o":["+1.5; a luxury good","−1.5; an inferior good","−0.67; an inferior good","+0.67; a necessity"],"a":1,"e":"YED = %ΔQd ÷ %ΔIncome = −15% ÷ 10% = −1.5。YED < 0 说明是劣等品 (inferior good)。−0.67 是分子分母颠倒；正值选项忽略了符号。"},{"id":"m3-05","t":"m3","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The price of printers rises by 20%, and the quantity demanded of ink cartridges falls by 10%. The cross-price elasticity of demand (XED) of ink cartridges with respect to printer prices is","o":["−0.5, so the goods are complements","+0.5, so the goods are substitutes","−2.0, so the goods are complements","+2.0, so the goods are substitutes"],"a":0,"e":"XED = %ΔQd(墨盒) ÷ %ΔP(打印机) = −10% ÷ 20% = −0.5。XED < 0 表示互补品 (complements)。−2.0 是把分子分母颠倒。"},{"id":"m3-06","t":"m3","lv":2,"ex":["AP","IB","AL"],"q":"Which of the following would make the supply of a product MORE price elastic?","o":["Production takes a long time and cannot easily be increased","Firms have large amounts of spare capacity and stocks","The product is perishable and cannot be stored","The time period considered is very short"],"a":1,"e":"闲置产能 (spare capacity) 与库存 (stocks) 使企业能在价格上升时迅速增加供给，PES 更大。生产周期长、易腐不可储存、时间很短都会使供给缺乏弹性。"},{"id":"m3-07","t":"m3","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Q = 100 − 2P and the current price is $30. What is the point price elasticity of demand, and what should the firm do to increase total revenue?","o":["|PED| = 0.67; raise the price","|PED| = 1.5; lower the price","|PED| = 1.5; raise the price","|PED| = 1; leave the price unchanged"],"a":1,"e":"P = 30 时 Q = 40，点弹性 = (ΔQ/ΔP) × (P/Q) = −2 × 30/40 = −1.5，|PED| > 1 富有弹性，降价可提高 TR。TR 最大化在直线中点 P = 25（|PED| = 1）。0.67 是 1.5 的倒数（把 P/Q 写成了 Q/P）。"},{"id":"m3-08","t":"m3","lv":3,"ex":["IB","AL","IEO"],"q":"In a market, PED = −0.5 and PES = 1.5 around the equilibrium. The government imposes a tax of $4 per unit on sellers. Approximately how much of the tax per unit is borne by consumers?","o":["$1","$2","$3","$4"],"a":2,"e":"税负归宿 (tax incidence)：消费者承担比例 = PES ÷ (PES + |PED|) = 1.5 ÷ 2.0 = 75%，即 0.75 × 4 = $3；生产者承担 $1。需求更缺乏弹性的一方承担更多税负，与法定由谁缴纳无关。选 $1 是把公式颠倒。"},{"id":"m3-09","t":"m3","lv":3,"ex":["AP","IB","IEO","NEC"],"q":"A firm cuts its price from $50 to $40, and sales rise from 300 to 420 units. Which statement is correct (use the midpoint method)?","o":["|PED| ≈ 2.0 and total revenue rises by $1,800","|PED| ≈ 1.5 and total revenue falls by $1,800","|PED| ≈ 1.5 and total revenue rises by $1,800","|PED| ≈ 0.67 and total revenue rises by $3,000"],"a":2,"e":"中点：%ΔQ = 120 ÷ 360 ≈ 33.3%，%ΔP = 10 ÷ 45 ≈ 22.2%，|PED| ≈ 1.5。TR 从 50 × 300 = 15,000 升到 40 × 420 = 16,800，增加 $1,800，与“富有弹性时降价 TR 上升”一致。2.0 来自简单百分比 40% ÷ 20%。"},{"id":"m3-10","t":"m3","lv":3,"ex":["IEO","NEC"],"q":"Suppose demand for a good has unit elasticity at every price (so P × Q is constant along the demand curve). A drought shifts the supply curve to the left. Total consumer spending on the good will","o":["rise","fall","remain unchanged","rise or fall depending on the elasticity of supply"],"a":2,"e":"单位弹性需求曲线（等轴双曲线 P × Q = 常数）上任意一点的总支出都相同。供给左移只使均衡点沿需求曲线移动，P 上升、Q 下降，但 P × Q 不变。供给弹性影响价格和数量变化幅度，但不影响总支出。"},{"id":"m4-01","t":"m4","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A binding price ceiling set below the equilibrium price will most likely lead to","o":["a shortage of the good","a surplus of the good","an increase in quantity supplied","no change in the market"],"a":0,"e":"有约束力的价格上限 (binding price ceiling) 低于均衡价格：Qd 增加、Qs 减少，产生短缺，可能伴随排队和黑市。过剩是价格下限的结果；上限高于均衡价格时才没有影响。"},{"id":"m4-02","t":"m4","lv":1,"ex":["AP","IB","AL","NEC"],"q":"If a minimum wage is set above the equilibrium wage in a competitive labor market, the result will be","o":["a shortage of workers","higher employment","a surplus of labor (unemployment)","no effect on employment"],"a":2,"e":"最低工资 (minimum wage) 是劳动市场的价格下限。高于均衡工资时，劳动供给量 > 劳动需求量，出现劳动力过剩即失业，就业量下降。低于均衡的最低工资才没有影响。"},{"id":"m4-03","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 200 − 10P and supply is Qs = 20P − 40. The government imposes a price ceiling of $6. What is the resulting shortage?","o":["20 units","40 units","140 units","60 units"],"a":3,"e":"均衡：200 − 10P = 20P − 40 → P = 8，Q = 120，所以 $6 的上限有约束力。P = 6 时 Qd = 140，Qs = 80，短缺 = 60。40 是 120 − 80（只看供给减少），20 是 140 − 120（只看需求增加）。"},{"id":"m4-04","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government levies a tax of $10 per unit on sellers. How much tax revenue is collected?","o":["$250","$350","$400","$375"],"a":1,"e":"税后供给：Qs = (P − 10) − 20 = P − 30。令 100 − P = P − 30 → 消费者价格 P_c = 65，Q = 35，生产者得 P_s = 55。税收 = 10 × 35 = $350。$400 是用税前数量 40 计算的错误。"},{"id":"m4-05","t":"m4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In the same market (Qd = 100 − P, Qs = P − 20, $10 per-unit tax), what is the deadweight loss?","o":["$25","$50","$12.50","$35"],"a":0,"e":"税前 Q* = 40，税后 Q = 35。DWL = ½ × 税额 × 数量减少 = ½ × 10 × 5 = $25。$50 是忘记乘 ½；DWL 与税收收入 $350 不同，后者只是剩余从买卖双方转移给政府。"},{"id":"m4-06","t":"m4","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In a perfectly competitive market with no externalities, a per-unit subsidy paid to producers will","o":["create a deadweight loss because units are produced whose marginal cost exceeds their marginal benefit","increase total surplus","raise the price paid by consumers","benefit only producers"],"a":0,"e":"补贴使产量超过有效水平，多生产的单位 MC > MB，产生无谓损失 (DWL)，所以政府支出大于消费者与生产者剩余增加之和。补贴使消费者价格下降，收益由买卖双方按弹性分享，而不是只惠及生产者。"},{"id":"m4-07","t":"m4","lv":3,"ex":["AP","IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government pays producers a subsidy of $6 per unit. Which is correct?","o":["Consumers pay $54; the government spends $240","Consumers pay $57; the government spends $240","Consumers pay $63; the government spends $258","Consumers pay $57; the government spends $258"],"a":3,"e":"补贴后供给：Qs = (P + 6) − 20 = P − 14。令 100 − P = P − 14 → 消费者价格 P = 57，Q = 43，生产者实得 57 + 6 = 63。政府支出 = 6 × 43 = $258（用原数量 40 算得 $240 是错误）。另外 DWL = ½ × 6 × 3 = $9。"},{"id":"m4-08","t":"m4","lv":3,"ex":["IB","AL","IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. The government restricts output with a quota of 30 units. What is the deadweight loss?","o":["$50","$100","$200","$600"],"a":1,"e":"无配额均衡 Q = 40，P = 60。配额 30 时：消费者愿付价格 = 100 − 30 = 70，边际成本（供给价）= 30 + 20 = 50。DWL = ½ × (70 − 50) × (40 − 30) = $100。$600 是配额租金 (quota rent) = 20 × 30，属于转移而非损失。"},{"id":"m4-09","t":"m4","lv":3,"ex":["AP","IB","IEO","NEC"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. Instead of taxing sellers, the government levies the $10 per-unit tax on buyers. Which outcome results?","o":["The market price becomes $55; buyers pay $65 in total per unit and sellers receive $55","The market price becomes $65 and buyers bear the entire tax","Buyers bear none of the tax because sellers do not pay it","Quantity falls to 30 units"],"a":0,"e":"对买方征税使需求曲线下移 10：Qd = 100 − (P + 10) = 90 − P。令 90 − P = P − 20 → 市场价 P = 55，Q = 35。买方总成本 = 55 + 10 = 65，卖方得 55——与对卖方征税完全相同。税负归宿只取决于弹性，与法定纳税人无关。"},{"id":"m4-10","t":"m4","lv":3,"ex":["IEO"],"q":"Demand is Qd = 100 − P and supply is Qs = P − 20. What per-unit tax maximizes the government's tax revenue?","o":["$20","$60","$80","$40"],"a":3,"e":"税额为 t 时：100 − P_c = (P_c − t) − 20 → P_c = 60 + t/2，Q = 40 − t/2 = (80 − t)/2。税收 R = t(80 − t)/2，对 t 求导：(80 − 2t)/2 = 0 → t = 40，R = 40 × 20 = $800。t = 80 时数量为 0，收入为 0——税率过高会侵蚀税基（拉弗曲线思想）。"},{"id":"m5-01","t":"m5","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The table shows Leo's total utility from slices of pizza. What is the marginal utility of the third slice?","tbl":[["Slices","Total utility"],["0","0"],["1","10"],["2","18"],["3","24"],["4","28"],["5","30"]],"o":["24","8","4","6"],"a":3,"e":"边际效用 (MU) = ΔTU ÷ ΔQ = TU(3) − TU(2) = 24 − 18 = 6。24 是总效用；8 是第 2 片的 MU；4 是第 4 片的 MU。表格同时显示了边际效用递减。"},{"id":"m5-02","t":"m5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The price of good X is $2 and the price of good Y is $4. At her current bundle, Sara's marginal utility of X is 20 and her marginal utility of Y is 30. To increase total utility without spending more, she should","o":["buy more X and less Y","buy more Y and less X","keep her current bundle, since MU of Y is higher","buy more of both goods"],"a":0,"e":"比较每美元边际效用：MU_X/P_X = 20/2 = 10，MU_Y/P_Y = 30/4 = 7.5。X 的每美元 MU 更高，应把支出从 Y 转向 X，直到两者相等。只比较 MU 大小（30 > 20）而不除以价格是常见错误。"},{"id":"m5-03","t":"m5","lv":2,"ex":["AP","AL","NEC"],"q":"Jamal has $10. Good X costs $2 and good Y costs $1. His marginal utilities are shown below. Which bundle maximizes his total utility while spending all $10?","tbl":[["Unit","MU of X","MU of Y"],["1st","16","10"],["2nd","12","8"],["3rd","8","6"],["4th","4","4"],["5th","—","3"],["6th","—","2"]],"o":["2 X and 6 Y","4 X and 2 Y","3 X and 4 Y","1 X and 6 Y"],"a":2,"e":"每美元边际效用：X 为 8、6、4、2；Y 为 10、8、6、4、3、2。按从高到低购买，直到用完 $10，得到 3X + 4Y（花费 6 + 4 = 10），此时 MU_X/P_X = 8/2 = 4 = MU_Y/P_Y = 4/1。总效用：3X4Y = 36 + 28 = 64；2X6Y = 28 + 33 = 61；4X2Y = 40 + 18 = 58；1X6Y 只花 $8，总效用 49。"},{"id":"m5-04","t":"m5","lv":1,"ex":["AL","IB","IEO"],"q":"A consumer has an income of $60. Good X (horizontal axis) costs $3 and good Y (vertical axis) costs $6. Which describes the budget line?","o":["X-intercept 20, Y-intercept 10, slope −2","X-intercept 20, Y-intercept 10, slope −0.5","X-intercept 10, Y-intercept 20, slope −0.5","X-intercept 20, Y-intercept 10, slope −1"],"a":1,"e":"全部买 X：60/3 = 20；全部买 Y：60/6 = 10。斜率 = −P_X/P_Y = −3/6 = −0.5（也等于 −10/20）。−2 是把价格比颠倒。"},{"id":"m5-05","t":"m5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The price of an inferior (but not Giffen) good falls. Which statement is correct?","o":["Both the substitution and income effects increase quantity demanded","The substitution effect decreases quantity demanded, and the income effect increases it","The substitution effect increases quantity demanded, the income effect decreases it, and the substitution effect dominates","The income effect dominates, so quantity demanded falls"],"a":2,"e":"价格下降时替代效应 (substitution effect) 总是增加需求量；实际收入上升，对劣等品 (inferior good) 的收入效应 (income effect) 使需求量减少。非吉芬劣等品替代效应占主导，需求量净上升，需求曲线仍向下倾斜。收入效应占主导是吉芬商品 (Giffen good) 的情形。"},{"id":"m5-06","t":"m5","lv":3,"ex":["AL","IEO"],"q":"A consumer has utility U = X·Y, income $120, P_X = $2 and P_Y = $4. What is the utility-maximizing bundle?","o":["X = 20, Y = 20","X = 40, Y = 10","X = 60, Y = 0","X = 30, Y = 15"],"a":3,"e":"最优条件 MRS = MU_X/MU_Y = Y/X = P_X/P_Y = 1/2 → X = 2Y。代入预算 2X + 4Y = 120 → 8Y = 120 → Y = 15，X = 30（即 X = I/(2P_X)）。效用 = 450，高于 (20,20) 的 400 和 (40,10) 的 400；(60,0) 效用为 0。"},{"id":"m5-07","t":"m5","lv":3,"ex":["IEO"],"q":"With U = X·Y, income $120 and P_Y = $4, the price of X rises from $2 to $4. Using the Hicksian decomposition (holding utility constant), which is closest to the change in quantity of X?","o":["Total −15; substitution effect −8.8; income effect −6.2","Total −15; substitution effect −7.5; income effect −7.5","Total −10; substitution effect −5; income effect −5","Total −15; substitution effect −6.2; income effect −8.8"],"a":0,"e":"原来 X = 120/(2×2) = 30，Y = 15，U = 450；涨价后 X = 120/(2×4) = 15，总效应 −15。希克斯补偿：新价格下 P_X = P_Y，最优 X = Y，且 XY = 450 → X = √450 ≈ 21.2。替代效应 = 21.2 − 30 ≈ −8.8，收入效应 = 15 − 21.2 ≈ −6.2。−7.5/−7.5 是斯勒茨基 (Slutsky) 分解（保持原组合可负担，补偿收入 180，X = 22.5）的结果，而题目要求保持效用不变。"},{"id":"m5-08","t":"m5","lv":1,"ex":["IB","IEO","NEC"],"q":"People typically feel the pain of losing $100 more strongly than the pleasure of gaining $100. This is known as","o":["loss aversion","anchoring","present bias","diminishing marginal utility of money"],"a":0,"e":"这是损失厌恶 (loss aversion)：损失的心理权重大于同等收益。锚定 (anchoring) 是受初始参照数字影响；现时偏好 (present bias) 与时间选择有关；边际效用递减描述的是财富越多额外收益越小，并不能解释得失的不对称。"},{"id":"m5-09","t":"m5","lv":2,"ex":["IB","IEO","NEC"],"q":"A government changes workplace pension schemes so that employees are automatically enrolled unless they choose to opt out. Participation rises sharply. This policy is best described as","o":["a nudge that uses the default option (choice architecture)","a mandate that removes freedom of choice","a subsidy that changes relative prices","an example of anchoring by employers"],"a":0,"e":"自动加入 (auto-enrollment) 只改变默认选项，员工仍可自由退出，没有改变经济激励——这是典型的助推 (nudge) / 选择架构 (choice architecture)，利用了人们的惰性和维持现状偏好 (status quo bias)。强制要求会取消选择；补贴会改变相对价格。"},{"id":"m5-10","t":"m5","lv":2,"ex":["IB","IEO","NEC"],"q":"Kim prefers $100 today to $110 in one week, but prefers $110 in 53 weeks to $100 in 52 weeks. This pattern of choices is best explained by","o":["loss aversion","the endowment effect","anchoring","present bias (hyperbolic discounting)"],"a":3,"e":"两个选择的等待时间都是 1 周、回报差都是 $10，理性的指数贴现者应作出相同选择。Kim 对“现在”特别看重，而对遥远未来较有耐心，属于现时偏好 (present bias) / 双曲贴现 (hyperbolic discounting)，会导致时间不一致 (time inconsistency)，如拖延和储蓄不足。"},{"id":"m6-01","t":"m6","lv":1,"ex":["AP","IB","NEC"],"q":"The table shows a bakery's total product (TP) as the number of workers changes, with the oven fixed. Diminishing marginal returns begin with the addition of which worker?","tbl":[["Workers (L)","TP"],["0","0"],["1","10"],["2","25"],["3","35"],["4","40"]],"o":["The 2nd worker","The 3rd worker","The 4th worker","The 1st worker"],"a":1,"e":"边际产量 (MP) = ΔTP/ΔL：10、15、10、5。第 2 名工人 MP 上升到 15，从第 3 名工人开始 MP 下降（15→10），因此边际收益递减始于第 3 名工人。易错选第 4 名（误以为要等增量明显变小）或第 2 名；递减从 MP 开始下降时就已发生，与 TP 是否仍上升无关。"},{"id":"m6-02","t":"m6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A firm has fixed costs of $100. When it produces 20 units, its total cost is $300. What is its average variable cost (AVC) at this output?","o":["$15","$5","$20","$10"],"a":3,"e":"VC = TC − FC = 300 − 100 = 200；AVC = VC/Q = 200/20 = 10 美元。$15 是 ATC (300/20)，$5 是 AFC (100/20)，都是常见混淆。"},{"id":"m6-03","t":"m6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"As a firm increases output in the short run, which cost always decreases?","o":["Average variable cost","Average fixed cost","Marginal cost","Average total cost"],"a":1,"e":"平均固定成本 (AFC) = FC/Q，FC 不变而 Q 增大，AFC 持续下降。AVC、ATC 呈 U 形，MC 由于边际收益递减最终上升，都不会“总是”下降。"},{"id":"m6-04","t":"m6","lv":1,"ex":["AP","IB","AL","NEC","IEO"],"q":"Maria quits a job paying $50,000 a year to run her own shop. The shop earns revenue of $180,000 and pays $110,000 in wages, rent and materials. What are her accounting profit and economic profit?","o":["Accounting profit $70,000; economic profit $70,000","Accounting profit $20,000; economic profit $70,000","Accounting profit $120,000; economic profit $20,000","Accounting profit $70,000; economic profit $20,000"],"a":3,"e":"会计利润 (accounting profit) = 收入 − 显性成本 = 180000 − 110000 = 70000。经济利润 (economic profit) 还要减去隐性成本（放弃的工资 50000）：70000 − 50000 = 20000。两者不能颠倒：经济利润 ≤ 会计利润。"},{"id":"m6-05","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Using the cost data below (fixed cost = $50), at what output is average variable cost (AVC) minimized?","tbl":[["Q","TC ($)"],["0","50"],["1","80"],["2","100"],["3","114"],["4","136"],["5","170"]],"o":["2 units","3 units","4 units","5 units"],"a":1,"e":"VC = TC − 50：30、50、64、86、120；AVC = 30、25、21.33、21.5、24，Q = 3 时最低。也可用 MC 判断：MC = 30、20、14、22、34，第 4 单位 MC = 22 > AVC(3) = 21.33，AVC 开始上升。易错选 4：ATC 在 Q = 4、5 时最低（均为 34），不要把 ATC 与 AVC 混淆。"},{"id":"m6-06","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"If a firm's marginal cost is currently below its average total cost, then increasing output by one unit will","o":["increase average total cost","leave average total cost unchanged","decrease average total cost","increase average fixed cost"],"a":2,"e":"边际与平均的关系：边际值低于平均值时会把平均值拉低，所以 MC < ATC 时 ATC 下降。这也是 MC 必然从下方穿过 ATC 最低点的原因。MC 本身此时可能在上升，但这不改变 ATC 下降的结论。"},{"id":"m6-07","t":"m6","lv":2,"ex":["AP","IB","AL","IEO"],"q":"A firm doubles all of its inputs (labour, capital, land) and its output more than doubles. This firm is experiencing","o":["economies of scale","diminishing marginal returns","diseconomies of scale","increasing marginal cost"],"a":0,"e":"所有投入同比增加是长期概念。产出增长超过投入增长 ⇒ 规模报酬递增 (increasing returns to scale)，长期平均成本下降，即规模经济 (economies of scale)。边际收益递减是短期概念（有固定要素），不适用于“所有投入都翻倍”的情形。"},{"id":"m6-08","t":"m6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Which of the following changes would shift a firm's average total cost (ATC) curve but leave its marginal cost (MC) curve unchanged?","o":["An increase in the wage rate of its workers","An increase in the price of raw materials","An increase in the annual licence fee the firm must pay","A per-unit tax on each unit produced"],"a":2,"e":"年度执照费是固定成本 (FC)，与产量无关，会使 AFC 和 ATC 上移，但不影响 MC（MC 只取决于可变成本）。工资、原材料价格和从量税都会增加每多生产一单位的成本，因此会使 MC 上移。"},{"id":"m6-09","t":"m6","lv":3,"ex":["IEO","NEC","AP"],"q":"A firm's short-run total cost is TC = 100 + 4Q + Q². What is the minimum value of its average total cost (ATC)?","o":["$24","$14","$20","$29"],"a":0,"e":"ATC = 100/Q + 4 + Q。令 d(ATC)/dQ = −100/Q² + 1 = 0 ⇒ Q = 10，ATC = 10 + 4 + 10 = 24。验证：MC = 4 + 2Q = 24，在 ATC 最低点 MC = ATC。$14 是忘了加 AFC（只算 4 + Q），$29 是 Q = 5 时的 ATC (20 + 4 + 5)。"},{"id":"m6-10","t":"m6","lv":3,"ex":["IEO","AL"],"q":"A firm's short-run production function is Q = 6L² − 0.2L³, where L is labour. At what level of L is the average product of labour (AP) at its maximum?","o":["L = 15","L = 10","L = 20","L = 30"],"a":0,"e":"AP = Q/L = 6L − 0.2L²，令 dAP/dL = 6 − 0.4L = 0 ⇒ L = 15，此时 AP = 90 − 45 = 45。验证：MP = 12L − 0.6L² 在 L = 15 时 = 180 − 135 = 45 = AP，符合“MP 穿过 AP 最高点”。L = 10 是 MP 最大值 (12 − 1.2L = 0)；L = 20 是 MP = 0、TP 最大处；L = 30 时 Q = 0。"},{"id":"m7-01","t":"m7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A perfectly competitive firm faces a market price of $12. At the output where P = MC, it produces 50 units and its average total cost is $10. What is its economic profit?","o":["$600","$500","$120","$100"],"a":3,"e":"利润 = (P − ATC) × Q = (12 − 10) × 50 = 100 美元。$600 是总收益 (12×50)，$500 是总成本 (10×50)。"},{"id":"m7-02","t":"m7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which characteristic distinguishes monopolistic competition from perfect competition?","o":["Firms sell differentiated products","There are many buyers and sellers","Entry and exit are free in the long run","Firms earn zero economic profit in the long run"],"a":0,"e":"垄断竞争与完全竞争都有大量买卖者、自由进出、长期经济利润为零；关键区别是垄断竞争厂商销售差异化产品 (differentiated products)，因此面对向下倾斜的需求曲线、拥有一定定价权。"},{"id":"m7-03","t":"m7","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following is the best example of a natural monopoly?","o":["A patented new drug","A restaurant that is the only one in a small town","A city's water-pipe distribution network","A cartel of oil-exporting countries"],"a":2,"e":"自然垄断 (natural monopoly) 源于巨大的规模经济：LRATC 在整个市场需求范围内下降，一家厂商供应成本最低，例如自来水管网。专利药是法律壁垒造成的垄断；小镇餐馆是市场规模导致的地方垄断，但不具备巨大规模经济；卡特尔是寡头合谋而非自然垄断。"},{"id":"m7-04","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In the short run, a perfectly competitive firm faces a price of $6. At its best output, AVC = $7 and ATC = $10. Its fixed cost is $200. What should the firm do, and what is its loss?","o":["Keep producing; loss is less than $200","Shut down; loss equals $200","Keep producing; loss equals $200","Shut down; loss equals $0"],"a":1,"e":"停业规则 (shutdown rule)：P = 6 < AVC = 7，价格连可变成本都覆盖不了，生产每单位都额外亏 1 美元，因此应停产。停产时 TR = 0、VC = 0，亏损等于固定成本 200 美元。若价格介于 AVC 和 ATC 之间才应继续生产。"},{"id":"m7-05","t":"m7","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"A monopolist faces demand P = 100 − 2Q and has a constant marginal cost of $20. What are its profit-maximizing output and price?","o":["Q = 20, P = 60","Q = 40, P = 20","Q = 20, P = 20","Q = 30, P = 40"],"a":0,"e":"线性需求 P = 100 − 2Q ⇒ MR = 100 − 4Q。令 MR = MC：100 − 4Q = 20 ⇒ Q = 20，再代回需求曲线 P = 100 − 40 = 60。Q = 40、P = 20 是完全竞争结果 (P = MC)；P = 20 是错把价格读在 MC 上。"},{"id":"m7-06","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Four firms in an industry have market shares of 40%, 30%, 20% and 10%. What is the Herfindahl–Hirschman Index (HHI)?","o":["100","2,500","1,000","3,000"],"a":3,"e":"HHI = Σs² = 40² + 30² + 20² + 10² = 1600 + 900 + 400 + 100 = 3000（高度集中）。100 是四厂商集中度 CR4 (%)；2500 是四家平分 25% 时的 HHI (4 × 625)。"},{"id":"m7-07","t":"m7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In long-run equilibrium, a firm in monopolistic competition will","o":["charge a price equal to MC and minimum ATC","earn positive economic profit because its product is differentiated","charge a price equal to ATC but above MC","produce at the minimum point of its ATC curve"],"a":2,"e":"长期自由进入使需求曲线与 ATC 相切：P = ATC，经济利润为 0；但需求向下倾斜，MR < P，而 MR = MC ⇒ P > MC（非配置效率），且切点位于 ATC 最低点左侧（过剩产能 excess capacity，非生产效率）。P = MC = 最低 ATC 是完全竞争的长期均衡。"},{"id":"m7-08","t":"m7","lv":3,"ex":["IEO","NEC","AL"],"q":"A monopolist with constant MC = $10 sells in two separated markets. Demand in market 1 is P₁ = 50 − Q₁ and in market 2 is P₂ = 30 − Q₂. With third-degree price discrimination, what prices does it charge?","o":["P₁ = $20, P₂ = $30","P₁ = $30, P₂ = $20","P₁ = P₂ = $25","P₁ = $40, P₂ = $20"],"a":1,"e":"三级价格歧视：各市场分别令 MR = MC。市场 1：MR₁ = 50 − 2Q₁ = 10 ⇒ Q₁ = 20，P₁ = 30。市场 2：MR₂ = 30 − 2Q₂ = 10 ⇒ Q₂ = 10，P₂ = 20。检验勒纳指数：市场 1 |PED| = (P/Q)×1 = 1.5，(30−10)/30 = 2/3 = 1/1.5；市场 2 |PED| = 2，(20−10)/20 = 1/2。弹性较小的市场 1 定价更高。"},{"id":"m7-09","t":"m7","lv":3,"ex":["IEO","AL"],"q":"Two identical firms compete in quantities (Cournot). Market demand is P = 120 − Q, where Q = q₁ + q₂, and each firm has zero marginal cost. What is the equilibrium market price?","o":["$60","$0","$40","$30"],"a":2,"e":"企业 1 利润 π₁ = (120 − q₁ − q₂)q₁，一阶条件 120 − 2q₁ − q₂ = 0 ⇒ 反应函数 q₁ = 60 − q₂/2。对称时 q = 60 − q/2 ⇒ q = 40，总产量 Q = 80，P = 120 − 80 = 40。$60 是垄断（或完美卡特尔）价格 (Q = 60)，$0 是完全竞争/伯特兰价格 (P = MC)。古诺均衡介于两者之间。"},{"id":"m7-10","t":"m7","lv":3,"ex":["IEO","NEC","AP","IB"],"q":"A regulator requires a natural monopoly to set price equal to marginal cost. Which outcome is most likely?","o":["The firm earns normal profit and output is allocatively efficient","Output falls below the unregulated monopoly level","The firm earns supernormal profit because demand is inelastic","Output is allocatively efficient but the firm makes a loss and may need a subsidy"],"a":3,"e":"自然垄断的 LRATC 在相关产量范围内一直下降，因此 MC < ATC。按 P = MC 定价实现配置效率，但 P < ATC，厂商亏损，需要补贴或两部制收费。P = ATC（公平回报）管制才会使厂商获得正常利润，但此时 P > MC，未达到配置效率。"},{"id":"m8-01","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"Two firms, A and B, each choose a High or Low price. Payoffs (profit in $m) are shown as (A, B). What is the Nash equilibrium outcome?","tbl":[["","B: High price","B: Low price"],["A: High price","(10, 10)","(2, 14)"],["A: Low price","(14, 2)","(5, 5)"]],"o":["Both choose High price, earning (10, 10)","A chooses Low and B chooses High, earning (14, 2)","There is no Nash equilibrium","Both choose Low price, earning (5, 5)"],"a":3,"e":"对 A：若 B 选 High，Low 得 14 > 10；若 B 选 Low，Low 得 5 > 2 ⇒ Low 是 A 的占优策略 (dominant strategy)，B 对称。纳什均衡 (Low, Low)，收益 (5,5)。(High, High) 虽然对双方更好，但任一方都有单方面偏离到 Low 的激励，所以不是均衡——这就是囚徒困境。"},{"id":"m8-02","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"A player has a dominant strategy when","o":["one strategy gives the highest payoff regardless of what the other player does","the strategy maximizes the combined payoff of both players","the strategy yields the highest payoff only if the rival cooperates","the player moves first in a sequential game"],"a":0,"e":"占优策略 (dominant strategy) 是无论对手如何选择都能给自己带来更高收益的策略。它关注的是个人收益而非联合收益；也与行动顺序无关。"},{"id":"m8-03","t":"m8","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"The prisoner's dilemma illustrates that","o":["players always cooperate when they can communicate","individually rational choices can lead to an outcome that is worse for all players","a Nash equilibrium always maximizes total payoffs","a dominant strategy never exists in a game"],"a":1,"e":"囚徒困境中每个人都有背叛的占优策略，均衡结果对所有人都劣于合作结果：个人理性 ≠ 集体理性。即使可以沟通，一次性博弈中的承诺也不可信；纳什均衡并不保证总收益最大；且该博弈恰恰存在占优策略。"},{"id":"m8-04","t":"m8","lv":1,"ex":["AP","NEC","IEO"],"q":"In a repeated game, a player using the tit-for-tat strategy will","o":["defect in every round regardless of the rival's behaviour","cooperate until the rival defects once and then defect forever","cooperate in the first round and then copy the rival's previous move","randomly choose between cooperating and defecting"],"a":2,"e":"以牙还牙 (tit-for-tat)：第一轮合作，之后每轮复制对手上一轮行动。“一旦背叛就永远背叛”是冷酷触发策略 (grim trigger)，比 TFT 更严厉、不宽容。"},{"id":"m8-05","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"In the game below, payoffs are (Row, Column). Which strategy pair is the Nash equilibrium?","tbl":[["","Column: Left","Column: Right"],["Row: Up","(5, 2)","(3, 4)"],["Row: Down","(4, 3)","(2, 1)"]],"o":["(Up, Left)","(Up, Right)","(Down, Left)","There is no pure-strategy Nash equilibrium"],"a":1,"e":"Row 的收益：选 Up 时 5 或 3，选 Down 时 4 或 2，Up 在两列都更好 ⇒ Up 是 Row 的占优策略。Column 没有占优策略：给定 Up，Right 得 4 > Left 得 2。所以纳什均衡为 (Up, Right)，收益 (3,4)。(Up, Left) 中 Column 会偏离到 Right；(Down, Left) 中 Row 会偏离到 Up (5 > 4)。"},{"id":"m8-06","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"Two tech firms must choose a charging-port standard. Payoffs are (Firm 1, Firm 2). How many pure-strategy Nash equilibria does this game have?","tbl":[["","Firm 2: Standard X","Firm 2: Standard Y"],["Firm 1: Standard X","(2, 1)","(0, 0)"],["Firm 1: Standard Y","(0, 0)","(1, 2)"]],"o":["Two","One","Zero","Four"],"a":0,"e":"这是协调博弈 (coordination game)。(Standard X, Standard X)：双方单方面偏离都得 0，是纳什均衡；(Standard Y, Standard Y) 同理。两个不一致的格子中任一方都愿改变。所以有两个纯策略纳什均衡——说明纳什均衡未必唯一，也说明为何行业标准常需先动者或协调机制。"},{"id":"m8-07","t":"m8","lv":2,"ex":["AP","NEC","IEO"],"q":"A potential entrant chooses Enter or Stay Out. If it enters, the incumbent chooses Fight (price war) or Accommodate. Payoffs (Entrant, Incumbent): Stay Out (0, 10); Enter & Fight (−2, 2); Enter & Accommodate (3, 5). Using backward induction, what is the subgame-perfect outcome?","o":["Stay Out, because the incumbent threatens to fight","Enter; the incumbent fights","Enter; the incumbent accommodates","Stay Out; the incumbent accommodates"],"a":2,"e":"逆向归纳 (backward induction)：若进入发生，在位者比较打价格战 2 与容纳 5，选择容纳。进入者预期进入得 3 > 不进入 0，所以进入。“你进来我就打”是不可信威胁 (non-credible threat)，因为真到那一步打价格战对在位者自己不利。"},{"id":"m8-08","t":"m8","lv":2,"ex":["AP","IB","NEC","IEO"],"q":"Which factor makes collusion among oligopolists MOST likely to be sustained?","o":["There is a large number of firms in the market","Firms interact repeatedly with no known end date","Rivals' prices are secret and hard to observe","The game is played once only"],"a":1,"e":"无限（或终点不确定）重复博弈中，今天背叛会招致未来惩罚，合作可以维持。厂商越多越难协调和监督；价格不透明时背叛难以发现；一次性博弈中背叛是占优策略。"},{"id":"m8-09","t":"m8","lv":3,"ex":["IEO","NEC"],"q":"Two firms play the pricing game below infinitely many times. Each uses a grim-trigger strategy: charge High as long as both have always charged High; otherwise charge Low forever. Payoffs are per period, (A, B), and future payoffs are discounted by factor δ. What is the minimum δ for which collusion on High is sustainable?","tbl":[["","B: High price","B: Low price"],["A: High price","(10, 10)","(2, 14)"],["A: Low price","(14, 2)","(5, 5)"]],"o":["5/9","2/7","1/2","4/9"],"a":3,"e":"合作的现值：10/(1−δ)。背叛：当期 14，之后每期 5，现值 14 + 5δ/(1−δ)。合作条件 10/(1−δ) ≥ 14 + 5δ/(1−δ) ⇒ 10 ≥ 14(1−δ) + 5δ ⇒ 9δ ≥ 4 ⇒ δ ≥ 4/9 ≈ 0.44。一般公式 δ ≥ (π_D − π_C)/(π_D − π_N) = (14−10)/(14−5) = 4/9。5/9 是把分子分母写成 (10−5)/9 的常见错误。"},{"id":"m8-10","t":"m8","lv":3,"ex":["IEO"],"q":"In the game below (payoffs are Row, Column), there is no pure-strategy Nash equilibrium. In the mixed-strategy Nash equilibrium, with what probability does Row play Top?","tbl":[["","Column: Left","Column: Right"],["Row: Top","(5, 0)","(0, 2)"],["Row: Bottom","(1, 3)","(3, 0)"]],"o":["3/5","3/7","1/2","2/5"],"a":0,"e":"Row 的概率 p 要使 Column 无差异（用 Column 的收益！）：Column 选 Left 的期望收益 = 0·p + 3(1−p)；选 Right = 2p + 0·(1−p)。令 3 − 3p = 2p ⇒ p = 3/5。3/7 是 Column 选 Left 的概率 q（由 Row 的收益求得：5q = q + 3(1−q) ⇒ q = 3/7），是最常见的混淆。"},{"id":"m9-01","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"A firm sells its output in a perfectly competitive market at $5 per unit. Hiring the 5th worker raises output from 42 to 50 units. What is the marginal revenue product (MRP) of the 5th worker?","o":["$40","$8","$250","$210"],"a":0,"e":"MP = 50 − 42 = 8；产品市场完全竞争时 MR = P = 5，MRP = MP × P = 8 × 5 = 40 美元。$250 是 50 单位的总收益，$210 是 42 单位的总收益。"},{"id":"m9-02","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"The demand for labour is called a derived demand because","o":["it is derived from the supply of labour","wages are set by the government","it depends on the demand for the goods and services that labour produces","workers derive utility from working"],"a":2,"e":"派生需求 (derived demand)：企业雇佣劳动是为了生产产品出售，因此劳动需求来源于对最终产品的需求。例如智能手机需求上升会增加对芯片工程师的需求。"},{"id":"m9-03","t":"m9","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Deep-sea divers usually earn more than swimming-pool lifeguards with similar education. This is best explained by","o":["monopsony power","the minimum wage","compensating wage differentials","derived demand for swimming pools"],"a":2,"e":"补偿性工资差异 (compensating wage differential)：危险、艰苦或不愉快的工作需要更高工资来吸引劳动者，深海潜水危险性远高于泳池救生员。"},{"id":"m9-04","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A firm sells output at a constant price of $4 and hires workers at a market wage of $30 per day. Using the table, how many workers will the profit-maximizing firm hire?","tbl":[["Workers","Total product"],["1","12"],["2","22"],["3","30"],["4","36"],["5","40"],["6","42"]],"o":["2","4","6","3"],"a":3,"e":"MP = 12、10、8、6、4、2；MRP = MP × 4 = 48、40、32、24、16、8。雇佣到 MRP ≥ W = 30 的最后一名：第 3 名 MRP = 32 ≥ 30，第 4 名 24 < 30。所以雇 3 人。选 4 是多雇了 MRP（24）已低于工资（30）的第 4 名工人；选 6 是追求产量最大而非利润最大。"},{"id":"m9-05","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A firm's marginal product of labour is 20 units and the wage is $10; the marginal product of capital is 30 units and the rental rate of capital is $20. To minimize the cost of producing its current output, the firm should","o":["use more capital and less labour","use more labour and less capital","keep the current input mix","use more of both labour and capital"],"a":1,"e":"最小成本法则 (least-cost rule)：比较每元的边际产量。MP_L/W = 20/10 = 2，MP_K/r = 30/20 = 1.5。劳动每元产出更高，应增加劳动、减少资本，直到两者相等。仅比较 MP（30 > 20）会误选多用资本。"},{"id":"m9-06","t":"m9","lv":2,"ex":["AP","IB","AL","NEC"],"q":"In a competitive labour market, labour demand is Ld = 100 − 2W and labour supply is Ls = 3W − 25. If a minimum wage of $30 is imposed, what is the resulting surplus of labour (unemployment)?","o":["10","15","25","40"],"a":2,"e":"均衡：100 − 2W = 3W − 25 ⇒ W = 25，L = 50。最低工资 30 > 25，有约束力：Ld = 100 − 60 = 40，Ls = 90 − 25 = 65，劳动过剩 = 65 − 40 = 25。10 是就业减少量 (50 − 40)，15 是劳动供给增加量 (65 − 50)。"},{"id":"m9-07","t":"m9","lv":2,"ex":["AP","AL","NEC"],"q":"Compared with a firm that sells its output in a perfectly competitive market, a monopolist with the same production function will, at each level of employment, have","o":["a higher MRP, because it charges a higher price","the same MRP, because MRP depends only on marginal product","a higher MRP, because it faces no competition","a lower MRP, because marginal revenue is below price"],"a":3,"e":"MRP = MP × MR。垄断者要多卖必须降价，MR < P，所以其 MRP = MP × MR 低于竞争厂商的 MP × P。这也是垄断厂商雇佣较少劳动的原因。"},{"id":"m9-08","t":"m9","lv":3,"ex":["IEO","AP","NEC"],"q":"A monopsony employer faces labour supply W = 10 + 2L, and the MRP of labour is MRP = 70 − 2L. What employment level and wage does the monopsonist choose?","o":["L = 10, W = $50","L = 15, W = $40","L = 12, W = $34","L = 10, W = $30"],"a":3,"e":"线性供给 W = 10 + 2L ⇒ 总工资成本 = 10L + 2L²，MRC = 10 + 4L。令 MRC = MRP：10 + 4L = 70 − 2L ⇒ L = 10。工资在供给曲线上读取：W = 10 + 20 = 30。W = 50 是错读在 MRP 曲线上；L = 15、W = 40 是竞争性劳动市场的结果（供给 = MRP）。"},{"id":"m9-09","t":"m9","lv":3,"ex":["IEO","AP","NEC"],"q":"Using the same monopsony (labour supply W = 10 + 2L, MRP = 70 − 2L), the government imposes a minimum wage of $36. What happens to employment compared with the unregulated monopsony outcome of L = 10?","o":["It rises to 13","It rises to 17","It falls to 8","It rises to 15"],"a":0,"e":"有最低工资 36 时，在供给曲线上 W ≤ 36 的区间 (L ≤ (36−10)/2 = 13)，雇主多雇一人只需支付 36，MRC = 36（水平）。雇主想雇到 MRP = 36 ⇒ 70 − 2L = 36 ⇒ L = 17，但工资 36 时只有 13 人愿意工作，所以就业 = min(13, 17) = 13，高于 10。买方垄断下适度最低工资可提高就业；最低工资 = 40 时就业达到最大 15。"},{"id":"m9-10","t":"m9","lv":3,"ex":["IEO","IB","AL"],"q":"Which statement about human capital theory and signalling theory is correct?","o":["Signalling theory says education raises productivity, while human capital theory says it only reveals ability","Both predict that more educated workers earn more, but only human capital theory says education raises productivity","Both theories imply that subsidising education always raises national output","Human capital theory predicts that education has no effect on wages"],"a":1,"e":"人力资本理论 (human capital) 认为教育提升技能从而提高生产率和工资；信号理论 (signalling，斯宾塞) 认为学历主要向雇主传递“本来就能干”的信息，未必提升生产率。两者都预测高学历者收入更高，但政策含义不同：若主要是信号，补贴教育未必提高总产出，可能只是“学历军备竞赛”。"},{"id":"m10-01","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which good is both non-rival and non-excludable?","o":["A toll road","National defence","Fish in the open ocean","A cable TV subscription"],"a":1,"e":"公共物品 (public good) 具有非竞争性 (non-rival) 和非排他性 (non-excludable)：国防保护一个人不会减少对他人的保护，也无法排除不付费者。收费公路可排他；公海鱼类具有竞争性（公共资源 common-pool resource）；有线电视可排他（俱乐部物品）。"},{"id":"m10-02","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"After buying full car insurance, a driver stops locking her car. This is an example of","o":["adverse selection","moral hazard","the free-rider problem","a positive externality"],"a":1,"e":"道德风险 (moral hazard) 是交易后的隐藏行为：投保后风险转嫁给保险公司，投保人防范减少。逆向选择 (adverse selection) 发生在交易前：高风险者更倾向于购买保险。"},{"id":"m10-03","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"On a Lorenz curve diagram, the area between the line of perfect equality and the Lorenz curve is 0.15 (the whole square has area 1). What is the Gini coefficient?","o":["0.15","0.35","0.30","0.70"],"a":2,"e":"基尼系数 G = A/(A + B)，其中 A + B 为平等线下方三角形面积 = 0.5。G = 0.15/0.5 = 0.30。0.15 是忘记除以 0.5；0.35 是 B 的面积 (0.5 − 0.15)；0.70 是 B/(A+B)。"},{"id":"m10-04","t":"m10","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Vaccinations create positive externalities. Without government intervention, the market will","o":["produce more than the socially optimal quantity","produce exactly the socially optimal quantity","charge a price above the marginal social benefit","produce less than the socially optimal quantity"],"a":3,"e":"正外部性使 MSB > MPB，消费者只按私人收益决定购买，市场产量低于 MSB = MSC 的社会最优产量，可用庇古补贴 (Pigouvian subsidy) 纠正。"},{"id":"m10-05","t":"m10","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"In a market, marginal private benefit is MPB = 50 − Q and marginal private cost is MPC = 10 + Q. Each unit produced causes $6 of pollution damage to third parties. What is the socially optimal quantity?","o":["20","17","23","14"],"a":1,"e":"边际社会成本 MSC = MPC + 6 = 16 + Q。社会最优：MSB = MSC ⇒ 50 − Q = 16 + Q ⇒ Q* = 17。市场均衡为 50 − Q = 10 + Q ⇒ Q = 20（过度生产）。23 是误把外部成本加到收益方；14 是减去 12。庇古税应为每单位 6 美元。"},{"id":"m10-06","t":"m10","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Person X earns $20,000 and pays $2,000 of a tax. Person Y earns $100,000 and pays $8,000 of the same tax. This tax is","o":["regressive","progressive","proportional","lump-sum"],"a":0,"e":"看平均税率：X 为 2000/20000 = 10%，Y 为 8000/100000 = 8%。收入越高平均税率越低 ⇒ 累退税 (regressive)。虽然 Y 缴税绝对额更多，但判断累进/累退看的是税额占收入的比例。定额税 (lump-sum) 应是人人缴纳相同金额。"},{"id":"m10-07","t":"m10","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Three residents are the only users of a proposed streetlight. Their marginal benefits are $40, $25 and $15. The streetlight costs $70 and is non-excludable. Which statement is correct?","o":["It is efficient to provide the streetlight, but the market may fail to provide it","It is inefficient because no single resident values it above $70","It is efficient and the market will always provide it","It is inefficient because total benefit is less than cost"],"a":0,"e":"公共物品的社会边际收益是各人边际收益的垂直加总：40 + 25 + 15 = 80 > 70，提供路灯是有效率的。但由于非排他，每个人都想搭便车 (free ride)，没有人单独愿意付 70，市场可能不提供——这就是需要政府提供的理由。"},{"id":"m10-08","t":"m10","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"According to the Coase theorem, private bargaining can resolve an externality efficiently if","o":["property rights are clearly defined and transaction costs are low","the government imposes a Pigouvian tax","the polluter is always given the property right","many people are affected by the externality"],"a":0,"e":"科斯定理 (Coase theorem)：产权明确、交易成本低时，无论产权归谁，私下谈判都能达到有效率结果（分配不同）。受影响人数众多会使交易成本极高，这恰是科斯方案在空气污染等问题上失效的原因。"},{"id":"m10-09","t":"m10","lv":3,"ex":["IEO","IB","AL"],"q":"Two firms must jointly cut emissions by 30 tonnes under a cap-and-trade scheme. Firm A's marginal abatement cost is MAC_A = 2a and Firm B's is MAC_B = 4b, where a and b are tonnes abated. If permits trade freely, what is the equilibrium permit price?","o":["$60","$30","$20","$40"],"a":3,"e":"许可证自由交易时，各企业减排到 MAC = 许可证价格，所以 MAC_A = MAC_B：2a = 4b，且 a + b = 30 ⇒ a = 20，b = 10，价格 = 2 × 20 = 40。这样总减排成本最低（低成本的 A 多减排）。若各减 15，MAC 分别为 30 与 60，并非成本最小。"},{"id":"m10-10","t":"m10","lv":3,"ex":["IEO","NEC","AL"],"q":"A factory's smoke damages a nearby laundry by $300 per year. A filter that eliminates the smoke costs the factory $200 per year. Transaction costs are zero and the factory has the legal right to pollute. According to the Coase theorem, what happens?","o":["No filter is installed because the factory has the right to pollute","The factory installs the filter and pays the laundry $300","The laundry pays the factory between $200 and $300 and the filter is installed","The laundry relocates, since damage exceeds the filter cost"],"a":2,"e":"过滤器成本 200 < 损害 300，安装过滤器是有效率的。工厂拥有污染权时，洗衣店愿意支付最多 300 避免损害，工厂接受至少 200 的补偿，双方在 200–300 之间达成交易，过滤器被安装。若产权属于洗衣店，工厂会自费安装（200 < 赔偿 300）。两种情况下效率结果相同，只有分配不同。"},{"id":"M1-01","t":"M1","lv":1,"ex":["AP","NEC","IB"],"q":"Which of the following transactions would be counted in this year's GDP?","o":["A new car produced this year by a domestic factory and sold to a household","A household buys a used car from its neighbor","The government pays unemployment benefits to laid-off workers","An investor buys newly issued shares of a technology company"],"a":0,"e":"正确：当年在国内生产的新车是最终产品，计入消费 C。二手车交易不是当期生产；失业救济金是转移支付 (transfer payment)，没有对应产出；买股票属于金融资产交易，不是经济学意义上的投资 (investment)。"},{"id":"M1-02","t":"M1","lv":1,"ex":["AP","IB","AL","NEC"],"q":"An economy has the following data (billions of dollars): consumption 800, gross private investment 200, government purchases 300, exports 150, imports 250, government transfer payments 100. What is GDP?","o":["$1,300 billion","$1,200 billion","$1,700 billion","$1,100 billion"],"a":1,"e":"GDP = C + I + G + (X − M) = 800 + 200 + 300 + (150 − 250) = 1,200。转移支付不计入 G。若忽略净出口得 1,300；把进口加上而非减去得 1,700；把转移支付减掉得 1,100，都是常见错误。"},{"id":"M1-03","t":"M1","lv":2,"ex":["AP","IB","AL"],"q":"In 2025 a country's nominal GDP is $1,320 billion and its real GDP measured in base-year prices is $1,200 billion. What is the 2025 GDP deflator?","o":["90.9","120","110","10"],"a":2,"e":"GDP平减指数 (GDP deflator) = 名义GDP ÷ 实际GDP × 100 = 1,320 ÷ 1,200 × 100 = 110，说明价格水平比基年高10%。90.9 是把分子分母颠倒；10 是价格上涨的百分比而非指数值。"},{"id":"M1-04","t":"M1","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A consumer basket contains 10 pizzas and 5 books. Prices are shown in the table. Using 2024 as the base year, what is the inflation rate from 2024 to 2025 measured by this price index?","tbl":[["Good","Quantity in basket","Price 2024","Price 2025"],["Pizza","10","$8","$9"],["Book","5","$12","$15"]],"o":["12.5%","25.0%","18.75%","About 17.9%"],"a":3,"e":"篮子成本 2024 = 10×8 + 5×12 = 140；2025 = 10×9 + 5×15 = 165。CPI_2025 = 165 ÷ 140 × 100 ≈ 117.9，通胀率 ≈ 17.9%。12.5% 和 25% 分别只看了比萨或书的涨幅；18.75% 是两者的简单平均，忽略了篮子的支出权重。"},{"id":"M1-05","t":"M1","lv":1,"ex":["AP","IB","NEC"],"q":"A country has a working-age population of 250 million, a labor force of 160 million, and 148 million employed. What is the unemployment rate?","o":["7.5%","4.8%","8.1%","64%"],"a":0,"e":"失业人数 = 160 − 148 = 12（百万）。失业率 = 失业 ÷ 劳动力 = 12 ÷ 160 = 7.5%。4.8% 错用了工作年龄人口作分母；8.1% 错用了就业人数作分母；64% 是劳动参与率 (LFPR)。"},{"id":"M1-06","t":"M1","lv":2,"ex":["AP","IB","NEC"],"q":"Suppose a large number of unemployed workers become discouraged and stop looking for work. Other things equal, what happens to the measured unemployment rate and the labor force participation rate?","o":["The unemployment rate rises and the labor force participation rate is unchanged.","The unemployment rate falls and the labor force participation rate falls.","The unemployment rate is unchanged and the labor force participation rate falls.","Both the unemployment rate and the labor force participation rate rise."],"a":1,"e":"沮丧工人 (discouraged workers) 不再找工作即退出劳动力：分子（失业人数）和分母（劳动力）减少相同数量，失业率下降；劳动力减少而工作年龄人口不变，LFPR 下降。常见误区是认为失业率会上升或不变。"},{"id":"M1-07","t":"M1","lv":1,"ex":["AP","NEC","IB"],"q":"A worker at a furniture factory is laid off because a recession has reduced household spending on furniture. This is an example of","o":["frictional unemployment","structural unemployment","cyclical unemployment","seasonal unemployment"],"a":2,"e":"由衰退期总需求下降导致的失业是周期性失业 (cyclical unemployment)，经济复苏后岗位会回来。结构性失业是技能与岗位长期不匹配（如自动化淘汰岗位）；摩擦性失业是找工作过程中的短暂失业。"},{"id":"M1-08","t":"M1","lv":3,"ex":["IEO","NEC","AL"],"q":"An economy's actual unemployment rate is 8%. Frictional unemployment is 2.5% and structural unemployment is 3%. Assume Okun's rule of thumb: each percentage point of cyclical unemployment corresponds to real GDP 2% below potential. Which statement is correct?","o":["The natural rate is 5.5% and real GDP is about 2.5% below potential.","The natural rate is 3% and real GDP is about 10% below potential.","The natural rate is 8% and there is no output gap.","The natural rate is 5.5% and real GDP is about 5% below potential."],"a":3,"e":"自然失业率 = 摩擦性 + 结构性 = 2.5% + 3% = 5.5%；周期性失业 = 8% − 5.5% = 2.5 个百分点；按奥肯定律 (Okun's law) 产出缺口 ≈ 2 × 2.5 = 5%。只算到周期性失业就停下会误选 2.5%；把结构性失业当成自然率会得到 3% 和 10%。"},{"id":"M1-09","t":"M1","lv":3,"ex":["IEO","AL","IB"],"q":"Nominal GDP rises from $2,000 billion in Year 1 to $2,310 billion in Year 2. The GDP deflator (Year 1 = 100) is 105 in Year 2. What is the growth rate of real GDP from Year 1 to Year 2?","o":["10.0%","15.5%","10.5%","20.5%"],"a":0,"e":"Year 1 实际GDP = 2,000（基年）。Year 2 实际GDP = 2,310 ÷ 1.05 = 2,200。实际增长率 = 2,200 ÷ 2,000 − 1 = 10.0%。15.5% 是名义增长率；10.5% 是近似式 15.5% − 5% 的结果，精确计算应为 (1.155 ÷ 1.05) − 1 = 10%；20.5% 是把通胀加到名义增长上。"},{"id":"M2-01","t":"M2","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following best explains why the aggregate demand curve slopes downward?","o":["A lower price level makes consumers substitute toward goods whose relative prices have fallen.","A lower price level raises the real value of households' money holdings, so they buy more goods and services.","A lower price level reduces firms' production costs, so they produce more.","A lower price level causes the government to increase its purchases."],"a":1,"e":"AD向下倾斜来自宏观的财富效应 (wealth effect)、利率效应和汇率效应。选“替代相对便宜商品”是把微观需求曲线的替代效应搬到了宏观，所有价格同时下降时不存在相对价格变化；“成本下降、多生产”描述的是供给方；政府购买不随价格水平自动变化。"},{"id":"M2-02","t":"M2","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following would shift the aggregate demand curve to the right?","o":["A decrease in the price level","A sharp increase in the world price of oil","An increase in consumer confidence","An appreciation of the domestic currency"],"a":2,"e":"消费者信心上升使消费 C 增加，AD 右移。价格水平下降只是沿AD曲线移动；油价上涨主要使SRAS左移；本币升值使出口变贵、进口变便宜，NX 下降，AD 左移。"},{"id":"M2-03","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy is in long-run equilibrium when the price of imported energy rises sharply. In the short run, what happens to the price level and real output?","o":["The price level rises and real output rises.","The price level falls and real output falls.","The price level is unchanged and real output falls.","The price level rises and real output falls."],"a":3,"e":"能源价格上涨是负面供给冲击，SRAS 左移：价格水平上升、实际产出下降，即成本推动型通胀/滞胀 (stagflation)。“价格与产出同时上升”是需求拉动 (AD右移) 的结果。"},{"id":"M2-04","t":"M2","lv":2,"ex":["AP","IB","AL"],"q":"Which of the following would shift the long-run aggregate supply curve to the right?","o":["An increase in labor productivity due to new technology","A cut in personal income taxes that raises consumption","An increase in the price level","An increase in nominal wages"],"a":0,"e":"LRAS 由资源和技术决定，技术进步提高劳动生产率 (productivity)，潜在产出增加，LRAS 右移。减税刺激消费移动的是AD；价格水平变化只是沿曲线移动；名义工资上升使SRAS左移，不影响LRAS。"},{"id":"M2-05","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy's potential real GDP is $5.0 trillion, but its current short-run equilibrium real GDP is $4.6 trillion. If the government takes no action, which describes the gap and the long-run self-adjustment?","o":["An inflationary gap of $0.4 trillion; nominal wages rise, shifting SRAS to the left","A recessionary gap of $0.4 trillion; nominal wages and input prices eventually fall, shifting SRAS to the right","A recessionary gap of $0.4 trillion; the falling price level automatically shifts AD to the right","A recessionary gap of $4.6 trillion; LRAS shifts left until it reaches current output"],"a":1,"e":"实际产出 4.6 < 潜在产出 5.0，衰退缺口 = 0.4 万亿。失业高于自然率，名义工资和投入品价格最终下降，SRAS 右移，价格水平下降、产出回到 5.0。价格下降只会沿AD移动，不会让AD移动；LRAS 不会因短期衰退而移动到当前产出。"},{"id":"M2-06","t":"M2","lv":1,"ex":["AP","IB","NEC"],"q":"Which of the following is most likely to cause demand-pull inflation?","o":["A sharp rise in world energy prices","A significant increase in labor productivity","A large increase in government spending when the economy is already near full employment","A fall in export demand due to a recession abroad"],"a":2,"e":"需求拉动型通胀 (demand-pull inflation) 来自AD右移，接近充分就业时增加政府支出主要推高价格。能源涨价是成本推动；生产率提高使SRAS右移、压低价格；外需下降使AD左移。"},{"id":"M2-07","t":"M2","lv":3,"ex":["IEO","AL"],"q":"An economy has AD: Y = 1200 − 4P and SRAS: Y = 200 + 6P, where Y is real output and P is the price level. Potential output is 900. Holding SRAS fixed, by how much must AD shift horizontally (at every price level) for the short-run equilibrium to reach potential output?","o":["100","250","About 67","About 167"],"a":3,"e":"初始均衡：1200 − 4P = 200 + 6P ⇒ P = 100，Y = 800，缺口 = 100。在SRAS上 Y = 900 时 P = (900 − 200) ÷ 6 ≈ 116.7。新AD需满足 900 = A − 4 × 116.7 ⇒ A ≈ 1366.7，水平移动 = 1366.7 − 1200 ≈ 166.7。选 100 是忽略了价格水平上升会沿AD减少需求量（需求被SRAS斜率“稀释”）：移动量 = 缺口 × (1 + b/d) = 100 × (1 + 4/6) ≈ 167。"},{"id":"M2-08","t":"M2","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An economy starts in long-run equilibrium. Aggregate demand then increases permanently. After all wages and prices have fully adjusted, compared with the original equilibrium,","o":["the price level is higher and real output is back at potential","real output is permanently higher and the price level is unchanged","both real output and the price level are permanently higher","the price level returns to its original level and real output is higher"],"a":0,"e":"短期内AD右移使价格和产出都上升（通胀缺口）；长期名义工资上涨使SRAS左移，产出回到LRAS（潜在产出），价格水平更高。需求冲击在长期是中性的 (long-run neutrality)：只影响价格，不影响实际产出。"},{"id":"M2-09","t":"M2","lv":3,"ex":["IEO","NEC","AL"],"q":"An adverse supply shock pushes an economy into stagflation. If the central bank responds by stimulating aggregate demand to restore output to potential, the most likely outcome relative to no policy response is that","o":["both output and the price level return to their original levels","output returns to potential sooner, but the price level ends up higher","the price level falls back while output rises","output falls further, but inflation is eliminated"],"a":1,"e":"滞胀时SRAS左移。扩张AD使产出更快回到潜在水平，但价格水平在更高处稳定（“容纳”供给冲击 accommodating）。若不干预，工资最终下降使SRAS回到原位，价格和产出都回到原点，但过程可能漫长且失业痛苦。需求管理无法同时修复产出和价格，这就是滞胀的政策两难。"},{"id":"M3-01","t":"M3","lv":1,"ex":["AP","IB","NEC"],"q":"If the marginal propensity to consume is 0.8, what is the maximum change in real GDP that could result from a $20 billion increase in government purchases?","o":["$80 billion increase","$25 billion increase","$100 billion increase","$16 billion increase"],"a":2,"e":"支出乘数 = 1 ÷ MPS = 1 ÷ (1 − 0.8) = 5，ΔY = 5 × 20 = 100（十亿美元）。80 是误用了税收乘数 (−MPC/MPS = −4)；25 是误用 1/MPC；16 是 MPC × 20。"},{"id":"M3-02","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"The marginal propensity to consume is 0.75. If the government cuts taxes by $40 billion, what is the maximum change in real GDP?","o":["An increase of $160 billion","An increase of $30 billion","An increase of $40 billion","An increase of $120 billion"],"a":3,"e":"税收乘数 = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3。减税 ΔT = −40，ΔY = −3 × (−40) = +120。160 是误用支出乘数 4；减税第一轮只有 MPC × 40 = 30 被花掉，所以效果小于同等规模的政府购买。30 只是第一轮消费增加量。"},{"id":"M3-03","t":"M3","lv":2,"ex":["AP","IB","AL"],"q":"With an MPC of 0.9, the government increases purchases by $50 billion and finances it entirely by raising taxes by $50 billion. Ignoring crowding out, what is the change in real GDP?","o":["An increase of $50 billion","No change","An increase of $500 billion","An increase of $950 billion"],"a":0,"e":"支出乘数 = 1 ÷ 0.1 = 10，ΔY_G = 500；税收乘数 = −0.9 ÷ 0.1 = −9，ΔY_T = −450。净效应 = 500 − 450 = 50，即平衡预算乘数 (balanced-budget multiplier) = 1。以为两者抵消得“无变化”是最常见的误解；500 忽略了增税；950 是把两个效应相加。"},{"id":"M3-04","t":"M3","lv":1,"ex":["AP","IB","NEC","AL"],"q":"Which of the following is an example of an automatic stabilizer?","o":["A new highway construction program passed by the legislature","A progressive income tax system","Open market purchases of bonds by the central bank","A one-time tax rebate approved by the legislature during a recession"],"a":1,"e":"自动稳定器 (automatic stabilizer) 无需新立法，随经济周期自动变化：累进所得税在衰退时税收自动减少、繁荣时自动增加。修路计划和一次性退税都需要立法，属于相机抉择 (discretionary) 财政政策；公开市场操作是货币政策。"},{"id":"M3-05","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Potential real GDP is $2,000 billion and actual real GDP is $1,850 billion. The MPC is 0.8. Ignoring crowding out and price-level changes, which single fiscal action would exactly close the gap?","o":["Increase government purchases by $150 billion","Cut taxes by $30 billion","Increase government purchases by $30 billion","Cut taxes by $150 billion"],"a":2,"e":"缺口 = 2,000 − 1,850 = 150。支出乘数 = 1 ÷ 0.2 = 5，所需 ΔG = 150 ÷ 5 = 30。若用减税：税收乘数 = −4，需减税 150 ÷ 4 = 37.5，减税 30 只能增加 120，不够；增加150或减税150则会造成通胀缺口（误把缺口当作所需政策规模）。"},{"id":"M3-06","t":"M3","lv":3,"ex":["IEO","AL","IB"],"q":"In an open economy, the MPC out of disposable income is 0.8, the marginal income tax rate is 0.25, and the marginal propensity to import (out of national income) is 0.1. By how much does equilibrium income rise if government purchases increase by $60 billion?","o":["$300 billion","$200 billion","$150 billion","$120 billion"],"a":3,"e":"每增加1元国民收入，可支配收入增加 0.75，消费增加 0.8 × 0.75 = 0.6，进口增加 0.1，所以对国内产品的边际支出 = 0.6 − 0.1 = 0.5。乘数 = 1 ÷ (1 − 0.5) = 2，ΔY = 2 × 60 = 120。300 用的是简单乘数 1/MPS = 5；200 只考虑了进口漏出 (1/(0.2+0.1))；150 只考虑了税收 (1/(1−0.6))。"},{"id":"M3-07","t":"M3","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Which of the following best describes the crowding-out effect of expansionary fiscal policy?","o":["Government borrowing raises real interest rates, which reduces private investment spending.","Higher government spending causes households to s
