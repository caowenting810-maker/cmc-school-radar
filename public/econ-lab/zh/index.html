ave all of any tax cut.","Government purchases of goods directly replace imports, reducing net exports.","An increase in the money supply lowers interest rates and raises investment."],"a":0,"e":"挤出效应 (crowding out)：赤字融资增加可贷资金需求（或减少国民储蓄），推高实际利率，私人投资下降，部分抵消扩张效果。“家庭把减税全部储蓄”描述的是李嘉图等价，是另一机制；增加货币供给压低利率是货币政策，方向相反。"},{"id":"M3-08","t":"M3","lv":1,"ex":["AP","NEC","IB"],"q":"A country's national debt is $500 billion at the start of Year 1. It then runs a budget deficit of $40 billion in Year 1, a deficit of $30 billion in Year 2, and a budget surplus of $10 billion in Year 3. What is the national debt at the end of Year 3?","o":["$580 billion","$560 billion","$60 billion","$570 billion"],"a":1,"e":"国债 (national debt) 是存量，赤字/盈余是流量：500 + 40 + 30 − 10 = 560。580 是把盈余也当作赤字加上；60 只是三年的净赤字，忘了初始债务；570 忽略了第三年的盈余。"},{"id":"M3-09","t":"M3","lv":3,"ex":["IEO","AL"],"q":"Suppose households fully satisfy Ricardian equivalence. The government cuts lump-sum taxes by $100 billion this year, financed by issuing bonds that will be repaid with future taxes, and keeps its purchases unchanged. What is the most likely effect?","o":["Consumption rises by MPC × $100 billion, and aggregate demand rises by the tax multiplier times $100 billion.","Private saving is unchanged, so national saving falls by $100 billion and interest rates rise.","Private saving rises by about $100 billion, so consumption, national saving and aggregate demand are essentially unchanged.","Consumption falls by $100 billion because households fear higher future taxes."],"a":2,"e":"李嘉图等价 (Ricardian equivalence)：理性、有远见的家庭知道今天的举债减税意味着未来等额（现值）的增税，一生财富未变，于是把减税全部储蓄起来。私人储蓄增加 100，公共储蓄减少 100，国民储蓄不变，利率和AD都不受影响。按传统税收乘数计算的选项正是李嘉图等价所否定的结论；消费下降 100 则夸大了反应。"},{"id":"M4-01","t":"M4","lv":1,"ex":["AP","IB","NEC"],"q":"A restaurant lists all the prices on its menu in yuan. Which function of money does this illustrate?","o":["Medium of exchange","Store of value","Standard of deferred payment","Unit of account"],"a":3,"e":"用货币来标价、比较价值，是计价单位 (unit of account) 的职能。只有当顾客实际用货币付款时，才体现交换媒介；把钱存起来以后用，体现价值储藏。"},{"id":"M4-02","t":"M4","lv":1,"ex":["AP","NEC"],"q":"Which of the following is included in M2 but NOT in M1?","o":["Small-denomination time deposits (certificates of deposit)","Currency held by the public","Checkable (demand) deposits","Government bonds held by households"],"a":0,"e":"M2 = M1 + 小额定期存款 + 零售货币市场基金等。现金和支票存款同时属于 M1 和 M2；政府债券不属于任何货币层次（不能直接用于支付）。注：美联储自2020年起把储蓄存款计入 M1，所以这里选定期存款最稳妥。"},{"id":"M4-03","t":"M4","lv":1,"ex":["AP","IB","NEC"],"q":"A bank with no excess reserves receives a new cash deposit of $1,000. The required reserve ratio is 20%. What is the maximum amount this single bank can lend as a result of the deposit?","o":["$1,000","$800","$4,000","$5,000"],"a":1,"e":"法定准备金 = 1,000 × 20% = 200，超额准备金 = 800，单个银行最多新增贷款等于其超额准备金 800。4,000 是整个银行体系最多能新增的贷款/存款 (800 × 5)；5,000 是 1,000 × 5，误把单个银行当成整个体系且用了全部存款。"},{"id":"M4-04","t":"M4","lv":2,"ex":["AP","IB","NEC"],"q":"Maria deposits $1,000 of currency into her checking account. The required reserve ratio is 20%, and banks lend out all excess reserves while the public holds no additional currency. What is the maximum change in the money supply (M1)?","o":["An increase of $5,000","An increase of $800","An increase of $4,000","An increase of $1,000"],"a":2,"e":"现金变成存款，M1 本身不变（现金 −1,000，存款 +1,000）。超额准备金 = 800，货币乘数 = 1 ÷ 0.2 = 5，银行体系通过贷款最多创造 800 × 5 = 4,000 新货币。5,000 是存款的最大总增加量（包括原始1,000），但原始存款不是新增货币；800 只是第一家银行的放贷。"},{"id":"M4-05","t":"M4","lv":2,"ex":["AP","IB","AL"],"q":"The table shows the balance sheet of Bank Z. The required reserve ratio is 10%. What are the bank's excess reserves, and what is the maximum increase in the money supply the banking system could create from them?","tbl":[["Assets","Amount","Liabilities","Amount"],["Reserves","$12,000","Demand deposits","$50,000"],["Loans","$38,000","",""]],"o":["$12,000 and $120,000","$7,000 and $63,000","$5,000 and $50,000","$7,000 and $70,000"],"a":3,"e":"法定准备金 = 50,000 × 10% = 5,000；超额准备金 = 12,000 − 5,000 = 7,000。银行体系最大货币创造 = 7,000 × (1 ÷ 0.1) = 70,000。12,000/120,000 错用了全部准备金；5,000 是法定准备金；63,000 是从 70,000 中错误地扣掉了7,000（本题超额准备金是现有的，并非新存入的现金，所以不扣减）。"},{"id":"M4-06","t":"M4","lv":2,"ex":["AP","IB","NEC"],"q":"Assume the central bank keeps the money supply fixed. If real income and the price level both rise, what happens in the money market?","o":["Money demand increases and the nominal interest rate rises.","Money supply increases and the nominal interest rate falls.","Money demand decreases and the nominal interest rate falls.","Money demand increases and the nominal interest rate is unchanged."],"a":0,"e":"名义收入 (P × Y) 上升使交易需求增加，货币需求 (Md) 右移；在垂直的货币供给 (Ms) 下，名义利率上升。货币供给由央行决定，不会因收入上升而自动增加；“利率不变”忽略了 Ms 垂直。"},{"id":"M4-07","t":"M4","lv":2,"ex":["AP","IB","AL","IEO"],"q":"In an economy the money supply is 500, velocity is 4, and real output is 1,000. If the money supply then grows by 6% per year, velocity is constant, and real output grows by 2% per year, what are the current price level and the approximate inflation rate?","o":["P = 2; inflation of about 6%","P = 2; inflation of about 4%","P = 0.5; inflation of about 4%","P = 8; inflation of about 8%"],"a":1,"e":"MV = PY ⇒ P = 500 × 4 ÷ 1,000 = 2。增长率形式：%ΔM + %ΔV ≈ %ΔP + %ΔY ⇒ 6% + 0 ≈ π + 2% ⇒ π ≈ 4%。选6%忽略了实际产出增长会吸收部分新货币；0.5 是把 P 算成 Y ÷ (MV)。"},{"id":"M4-08","t":"M4","lv":3,"ex":["IEO","AL"],"q":"The required reserve ratio is 10%, banks hold no excess reserves, and the public holds currency equal to 25% of its deposits (c = 0.25). If the central bank increases the monetary base by $70 billion, by how much does the money supply (currency + deposits) increase?","o":["$700 billion","$200 billion","$250 billion","$87.5 billion"],"a":2,"e":"含现金漏出的货币乘数 m = (1 + c) ÷ (rr + c) = 1.25 ÷ 0.35 ≈ 3.571。ΔM = 3.571 × 70 = 250。700 是简单乘数 1/rr 的结果，忽略了现金漏出；200 = 70 ÷ 0.35 只算出了存款增加量（ΔD = 200），还要加上现金增加 0.25 × 200 = 50；87.5 是 70 × 1.25。"},{"id":"M4-09","t":"M4","lv":3,"ex":["IEO","AL","NEC"],"q":"A customer withdraws $2,000 in cash from her checking account. The required reserve ratio is 10%, and the banking system had no excess reserves before the withdrawal. Which statement is correct?","o":["M1 falls by $2,000 immediately, and deposits may contract by up to a further $20,000.","M1 rises by $2,000 because currency in circulation increases, with no further effect.","M1 is unchanged immediately, and deposits may contract by only a further $1,800.","M1 is unchanged immediately, but the banking system may have to reduce deposits by up to a further $18,000 (so total deposits fall by up to $20,000)."],"a":3,"e":"取现时存款 −2,000、流通现金 +2,000，M1 当下不变。银行准备金减少 2,000，但法定准备金只减少 200，于是出现 1,800 的准备金缺口。银行体系收缩贷款时，存款最多进一步减少 1,800 ÷ 0.1 = 18,000（与货币创造过程对称），连同最初被取走的 2,000，存款总共最多减少 20,000（= 2,000 ÷ 0.1）。只收缩 1,800 是只看了第一家银行，忽略了整个银行体系的乘数收缩；M1 当下既不减少也不增加，因为只是存款换成了现金。"},{"id":"M5-01","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"To help an economy out of a recession, which open market operation should the central bank conduct?","o":["Buy government securities, which increases bank reserves","Sell government securities, which increases bank reserves","Buy government securities, which decreases the money supply","Sell government securities, which lowers interest rates"],"a":0,"e":"扩张性货币政策：央行在公开市场买入 (buy) 政府债券，向银行支付准备金，准备金和货币供给增加，利率下降，投资和AD增加。卖出债券会回收准备金、推高利率，是紧缩性操作；其余选项方向搞错。"},{"id":"M5-02","t":"M5","lv":2,"ex":["AP","NEC"],"q":"The Federal Reserve operates with an ample supply of reserves. Which action most directly raises the federal funds rate in this framework?","o":["Selling a small amount of Treasury securities to make reserves scarce","Raising the interest rate it pays on reserve balances","Raising the required reserve ratio","Lowering the discount rate"],"a":1,"e":"在充足准备金框架 (ample-reserves framework) 下，准备金供给位于需求曲线平坦部分，小规模公开市场操作几乎不影响利率；美联储通过调整准备金利率 (IORB) 等管理利率 (administered rates) 来引导联邦基金利率。美联储法定准备金率自2020年3月起为零，不再是日常工具；降低贴现率是扩张方向。"},{"id":"M5-03","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"A bank offers a one-year loan at a nominal interest rate of 7%. Borrowers and lenders expect inflation of 3%. What is the expected real interest rate?","o":["10%","2.33%","4%","−4%"],"a":2,"e":"费雪方程 (Fisher equation)：实际利率 ≈ 名义利率 − 预期通胀 = 7% − 3% = 4%。10% 是把两者相加；2.33% 是 7 ÷ 3；−4% 是减反了。精确值为 1.07 ÷ 1.03 − 1 ≈ 3.9%，近似为 4%。"},{"id":"M5-04","t":"M5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A loan is made at a nominal interest rate of 8% when both parties expect inflation of 3%. Actual inflation turns out to be 6%. What is the realized real interest rate, and who gains from the unexpected inflation?","o":["About 5%; the lender gains at the borrower's expense","About 2%; the lender gains at the borrower's expense","About 14%; the borrower gains at the lender's expense","About 2%; the borrower gains at the lender's expense"],"a":3,"e":"事后实际利率 ≈ 8% − 6% = 2%，低于预期的 8% − 3% = 5%。未预期的通胀使借款人用贬值的货币还款，借款人 (borrower) 受益、贷款人受损。5% 是事前预期实际利率；14% 是把名义利率和通胀相加。"},{"id":"M5-05","t":"M5","lv":3,"ex":["IEO","AP","AL"],"q":"In the loanable funds market, supply is Qs = 100 + 20r and private demand is Qd = 300 − 30r, where r is the real interest rate in percent. The government then runs a new deficit, borrowing an additional 50 at every interest rate. What is the new real interest rate, and by how much is private investment crowded out?","o":["5%; private investment falls by 30","5%; private investment falls by 50","6%; private investment falls by 60","4%; private investment does not change"],"a":0,"e":"初始均衡：100 + 20r = 300 − 30r ⇒ r = 4%，Q = 180（全部是私人投资）。政府借款后总需求 350 − 30r = 100 + 20r ⇒ r = 5%，总量 Q = 200。私人投资 = 300 − 30 × 5 = 150，比180 减少 30。以为挤出 50 是假设借贷总量不变（供给完全无弹性）；实际上利率上升也增加了储蓄 20，所以只挤出 30。"},{"id":"M5-06","t":"M5","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Starting from long-run equilibrium, aggregate demand increases unexpectedly. In the short run, the economy","o":["moves down and to the right along the short-run Phillips curve","moves up and to the left along the short-run Phillips curve","experiences a rightward shift of the short-run Phillips curve","experiences a leftward shift of the long-run Phillips curve"],"a":1,"e":"AD 意外增加使产出上升、失业下降、通胀上升，对应沿短期菲利普斯曲线 (SRPC) 向左上移动。SRPC 本身移动是由通胀预期或供给冲击引起的；LRPC 只随自然失业率变化而移动，与AD无关。"},{"id":"M5-07","t":"M5","lv":3,"ex":["IEO","AL"],"q":"The Phillips curve is π = π^e − 0.5(u − 5), where π is inflation (%), u is unemployment (%), and π^e is expected inflation. Initially π^e = 3%. The central bank pushes unemployment to 4% this year. If next year's expected inflation equals this year's actual inflation, what inflation rate is required next year to keep unemployment at 4%?","o":["3.5% this year, then 3.5% next year","2.5% this year, then 2.0% next year","3.5% this year, then 4.0% next year","4.0% this year, then 5.0% next year"],"a":2,"e":"今年：π = 3 − 0.5 × (4 − 5) = 3.5%。明年预期 π^e = 3.5%，维持 u = 4% 需要 π = 3.5 + 0.5 = 4.0%。每年通胀都要比上年高0.5个百分点，这就是加速主义 (accelerationist) 假说：长期把失业压在自然率以下只能靠不断上升的通胀，LRPC 垂直。以为明年仍是 3.5% 忽略了预期调整；2.5% 是把符号弄反。"},{"id":"M5-08","t":"M5","lv":1,"ex":["AP","IB","NEC"],"q":"The long-run Phillips curve is","o":["downward sloping, showing a permanent trade-off between inflation and unemployment","horizontal at the expected inflation rate","vertical at zero unemployment","vertical at the natural rate of unemployment"],"a":3,"e":"长期中通胀预期完全调整，失业回到自然失业率 (natural rate)，与通胀水平无关，所以 LRPC 在自然失业率处垂直。向下倾斜的是短期菲利普斯曲线；自然失业率不是零，因为总存在摩擦性和结构性失业。"},{"id":"M5-09","t":"M5","lv":3,"ex":["IEO","NEC","AL"],"q":"A government wants to raise the share of investment in GDP to boost long-run growth, without changing aggregate demand or the price level in the short run. Which policy mix is most appropriate?","o":["Reduce the budget deficit and have the central bank lower interest rates","Increase the budget deficit and have the central bank sell government bonds","Increase the budget deficit and have the central bank lower interest rates","Raise taxes and have the central bank raise interest rates"],"a":0,"e":"“紧财政 + 松货币”：减少赤字（AD左移、国民储蓄增加）同时降息（AD右移），总需求大致不变，但利率更低、私人投资占比上升，资本积累加快。扩大赤字同时紧缩货币会推高利率、挤出投资，恰好相反；扩大赤字加降息会使AD大幅增加、引发通胀；增税加加息会使AD大幅收缩。"},{"id":"M6-01","t":"M6","lv":1,"ex":["AP","IB","NEC"],"q":"Using the rule of 70, approximately how many years will it take for a country's real GDP per capita to double if it grows at 3.5% per year?","o":["10 years","20 years","35 years","70 years"],"a":1,"e":"70法则 (rule of 70)：翻倍年数 ≈ 70 ÷ 3.5 = 20 年。10 年是 35 ÷ 3.5 的误算；35 年与 70 年是把增长率或常数用错。"},{"id":"M6-02","t":"M6","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following is most likely to increase an economy's long-run rate of economic growth?","o":["An increase in government transfer payments to retirees","A temporary surge in consumer spending","Greater investment in education and job training","A one-time depreciation of the domestic currency"],"a":2,"e":"教育与培训增加人力资本 (human capital)，提高劳动生产率，使潜在产出和 LRAS 右移。转移支付、暂时的消费增加和一次性货币贬值主要影响短期总需求，不改变长期生产能力。"},{"id":"M6-03","t":"M6","lv":2,"ex":["AP","IB","AL"],"q":"Last year a factory's 40 workers each worked 8 hours and produced 1,200 units. This year the workforce worked a total of 330 hours and produced 1,320 units. By approximately what percentage did labor productivity (output per hour) grow?","o":["10.0%","3.1%","13.1%","6.7%"],"a":3,"e":"去年工时 = 40 × 8 = 320，生产率 = 1,200 ÷ 320 = 3.75 件/小时；今年 = 1,320 ÷ 330 = 4.0 件/小时。增长 = 4.0 ÷ 3.75 − 1 ≈ 6.7%。10% 是产出增长率；3.1% 是工时增长率；13.1% 是把两者相加。近似法 10% − 3.1% ≈ 6.9% 也接近 6.7%。"},{"id":"M6-04","t":"M6","lv":3,"ex":["IEO","AL"],"q":"An economy's production function is Y = A·K^0.3·L^0.7. The capital stock grows by 4% per year, the labor force grows by 1% per year, and total factor productivity (A) grows by 1.5% per year. What is the approximate growth rate of real GDP?","o":["3.4%","6.5%","1.9%","4.6%"],"a":0,"e":"增长核算 (growth accounting)：g_Y = g_A + 0.3 g_K + 0.7 g_L = 1.5 + 0.3 × 4 + 0.7 × 1 = 1.5 + 1.2 + 0.7 = 3.4%。6.5% 是直接把各增长率相加，忽略了产出弹性；1.9% 漏掉了 TFP 增长；4.6% 把资本和劳动的指数用反了 (0.7 × 4 + 0.3 × 1 + 1.5)。"},{"id":"M6-05","t":"M6","lv":2,"ex":["AP","IB","AL","NEC"],"q":"According to the catch-up (convergence) hypothesis, why might a poor country with little capital per worker grow faster than a rich country, other things equal?","o":["Because poor countries always have higher saving rates than rich countries","Because diminishing returns mean an extra unit of capital raises output more where capital is scarce","Because rich countries experience increasing returns to capital","Because GDP in poor countries is measured using lower prices"],"a":1,"e":"资本边际收益递减 (diminishing returns)：资本稀缺时，新增资本的边际产出更高，因此在储蓄率、制度等条件相同时穷国增长更快，即追赶效应 (catch-up effect)。穷国储蓄率并不一定更高；富国资本收益递减而非递增；价格计量问题与增长率无关。"},{"id":"M6-06","t":"M6","lv":3,"ex":["IEO","AL","IB"],"q":"In the Solow growth model with no technological progress, a country permanently increases its saving rate. In the long run, this will","o":["permanently raise the growth rate of output per worker","leave both the level and growth rate of output per worker unchanged","raise the steady-state level of output per worker, but not its long-run growth rate","lower output per worker because consumption falls"],"a":2,"e":"储蓄率上升使投资增加，人均资本积累到更高的稳态 (steady state)，人均产出水平提高；过渡期增长加快，但由于资本边际收益递减，新稳态中人均增长率回到零（无技术进步时）。只有持续的技术进步才能带来持续的人均增长。消费可能短期下降，但人均产出是上升的。"},{"id":"M6-07","t":"M6","lv":1,"ex":["IB","NEC","IEO"],"q":"Which institutional feature is most likely to promote long-run economic growth?","o":["Frequent, unpredictable changes in tax laws","Government ownership of all farmland","Price controls on most consumer goods","Secure property rights enforced by an independent legal system"],"a":3,"e":"安全的产权 (property rights) 与法治保证投资者和创新者能获得回报，鼓励储蓄、投资和研发，是长期增长的制度基础。政策不确定、国有化与普遍价格管制都会削弱激励和资源配置效率。"},{"id":"M6-08","t":"M6","lv":2,"ex":["AP","IB","IEO","NEC"],"q":"Country A has real GDP per capita of $4,000 growing at 7% per year. Country B has real GDP per capita of $16,000 growing at 1.75% per year. Using the rule of 70, approximately what will A's GDP per capita be after 20 years, and will A have caught up with B?","o":["About $16,000; no, because B will then be about $22,600","About $16,000; yes, because A will equal B's current income","About $9,600; no, because A grows too slowly","About $32,000; yes, A will have overtaken B"],"a":0,"e":"A：70 ÷ 7 = 10 年翻倍，20年翻两番，4,000 × 4 = 16,000（精确复利 4,000 × 1.07²⁰ ≈ 15,479）。B：70 ÷ 1.75 = 40 年翻倍，20 年后 ≈ 16,000 × √2 ≈ 22,600。A 只达到B的“今天”，B也在增长，因此尚未追上。9,600 是单利 4,000 × (1 + 0.07 × 20) 的错误。"},{"id":"M6-09","t":"M6","lv":2,"ex":["IB","IEO","AL"],"q":"A country's measured real GDP grows by 5% per year, mostly from rapidly extracting and exporting a non-renewable mineral, with significant damage to rivers and forests. Which statement is best?","o":["GDP growth fully captures the change in national wealth, so the growth is sustainable by definition.","Measured GDP growth likely overstates sustainable growth because the depletion of natural capital and environmental damage are not subtracted.","Growth based on natural resources is always faster and more stable than growth based on manufacturing.","Environmental damage raises GDP, so it must raise living standards."],"a":1,"e":"GDP 是流量指标，不扣除自然资本 (natural capital) 的耗减和环境损害，因此资源型增长可能不可持续；绿色GDP或真实储蓄 (genuine savings) 等指标会对此调整。GDP 不衡量财富存量；资源型经济还可能面临“资源诅咒”和价格波动；治理污染的支出会计入GDP，但这并不意味着福利提高。"},{"id":"M7-01","t":"M7","lv":1,"ex":["AP","IB","AL","NEC"],"q":"Which of the following transactions is recorded in China's financial account rather than its current account?","o":["China exports electronics to Germany","Chinese investors receive dividends from shares they own in U.S. companies","A Chinese company builds a new factory in Vietnam","Chinese workers abroad send money home to their families"],"a":2,"e":"在国外建厂是对外直接投资 (FDI)，属于资产交易，记在金融账户 (financial account)。出口是货物贸易；股息属于初次收入 (primary income)；侨汇属于二次收入/经常转移，三者都在经常账户。常见误区是把“投资收益”当作金融账户——收益记在经常账户，资产本身的买卖才记在金融账户。"},{"id":"M7-02","t":"M7","lv":1,"ex":["AP","IB","NEC"],"q":"If the Chinese yuan appreciates against the U.S. dollar, other things equal,","o":["Chinese exports become cheaper for Americans, and U.S. goods become more expensive for Chinese consumers","both Chinese exports and U.S. goods become cheaper for everyone","prices of traded goods are unaffected because only the price level matters","Chinese exports become more expensive for Americans, and U.S. goods become cheaper for Chinese consumers"],"a":3,"e":"人民币升值 (appreciation) 后，美国人要花更多美元才能换到同样多人民币，中国出口品对美国人变贵；中国消费者用人民币能买到更多美元，美国商品变便宜。因此升值往往使净出口减少。"},{"id":"M7-03","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"Interest rates in the United States rise relative to interest rates in Japan. In the foreign exchange market, what is the most likely result?","o":["The demand for dollars increases and the dollar appreciates against the yen.","The supply of dollars increases and the dollar depreciates against the yen.","The demand for yen increases and the yen appreciates against the dollar.","The demand for dollars decreases and the dollar depreciates against the yen."],"a":0,"e":"美国利率相对上升，美国金融资产回报更高，日本投资者需要美元购买美国债券，美元需求增加（同时日元供给增加），美元升值、日元贬值。资本流向高利率国家，而不是离开。"},{"id":"M7-04","t":"M7","lv":1,"ex":["AP","IB","NEC"],"q":"The exchange rate changes from 7.2 yuan per dollar to 6.8 yuan per dollar. What happens to the yuan price of a book that costs $50 in the United States?","o":["It rises from ¥340 to ¥360, because the yuan has depreciated.","It falls from ¥360 to ¥340, because the yuan has appreciated.","It falls from ¥360 to ¥340, because the yuan has depreciated.","It stays at ¥360, because the dollar price is unchanged."],"a":1,"e":"人民币价格 = 50 × 7.2 = ¥360，变为 50 × 6.8 = ¥340。每美元只需 6.8 元即可买到，说明人民币升值 (appreciated)。数值下降代表人民币升值，这是看汇率报价方向时最容易搞反的地方。"},{"id":"M7-05","t":"M7","lv":2,"ex":["IB","AL","IEO","NEC"],"q":"A burger costs ¥24 in China and $5 in the United States. The market exchange rate is ¥7.2 per $1. According to absolute purchasing power parity, what is the PPP exchange rate, and how is the yuan valued?","o":["¥4.8 per $1; the yuan is overvalued relative to PPP","$0.21 per ¥1; the yuan is overvalued relative to PPP","¥4.8 per $1; the yuan is undervalued relative to PPP","¥7.2 per $1; the yuan is correctly valued"],"a":2,"e":"PPP 汇率 = 本国价格 ÷ 外国价格 = 24 ÷ 5 = 4.8 ¥/$。市场汇率 7.2 意味着每美元能换到比PPP更多的人民币：按市场汇率，汉堡在中国只值 24 ÷ 7.2 ≈ $3.33 < $5，所以人民币被低估 (undervalued) 约 (7.2 − 4.8) ÷ 7.2 ≈ 33%。把“数值更大”误读为人民币更强会误选高估。"},{"id":"M7-06","t":"M7","lv":3,"ex":["IEO","AP","AL"],"q":"A small country's domestic market for wheat has demand Qd = 100 − P and supply Qs = P − 20. The world price is 40 and the country imports freely. The government then imposes a tariff of 10 per unit. What are the tariff revenue and the total deadweight loss?","o":["Revenue = 400; deadweight loss = 100","Revenue = 200; deadweight loss = 50","Revenue = 500; deadweight loss = 0","Revenue = 200; deadweight loss = 100"],"a":3,"e":"自由贸易 P = 40：Qd = 60，Qs = 20，进口 40。关税后 P = 50：Qd = 50，Qs = 30，进口 20。关税收入 = 10 × 20 = 200。DWL = 生产扭曲 ½ × 10 × (30 − 20) + 消费扭曲 ½ × 10 × (60 − 50) = 50 + 50 = 100。400 错用了自由贸易进口量；DWL = 50 只算了一个三角形；500 是 10 × Qd。"},{"id":"M7-07","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"An import quota and a tariff are set so that they result in the same domestic price and the same quantity of imports. What is the key difference between them?","o":["Under the quota, the revenue from the price gap may go to foreign exporters or license holders rather than to the government.","The quota creates no deadweight loss, while the tariff does.","The quota lowers the domestic price, while the tariff raises it.","Domestic producers gain under a tariff but lose under a quota."],"a":0,"e":"价格和数量相同时，两者的生产与消费扭曲（DWL）相同，国内生产者都受益。区别在于价差 × 进口量这块矩形：关税下是政府收入，配额下成为配额租金 (quota rents)，若许可证分配给外国出口商，本国福利损失更大。"},{"id":"M7-08","t":"M7","lv":2,"ex":["AP","IB","AL","NEC"],"q":"A country pegs its currency to the U.S. dollar. Capital outflows are putting downward pressure on its currency. To maintain the peg, the central bank must","o":["buy foreign-currency reserves and sell its own currency","sell foreign-currency reserves and buy its own currency","lower domestic interest rates to encourage borrowing","print more domestic currency to increase its supply"],"a":1,"e":"本币面临贬值压力意味着外汇市场上本币供给过多。维持固定汇率 (peg)，央行需要用外汇储备买入本币，增加本币需求。买入外汇、卖出本币或印钞、降息都会进一步增加本币供给，加剧贬值压力。这也说明固定汇率会受到外汇储备规模的约束。"},{"id":"M7-09","t":"M7","lv":3,"ex":["IEO","AL","IB"],"q":"In a year, a country records (in $ billions): exports of goods 500, imports of goods 620, net exports of services +30, net primary income −20, and net secondary income +10. The capital account balance is zero and there are no errors and omissions. Which is correct?","o":["The current account balance is −120, so the financial account records a net inflow of 120.","The current account balance is −100, so the financial account records a net outflow of 100.","The current account balance is −100, so the financial account (including reserves) records a net inflow of 100.","The current account balance is −80, so the financial account records a net inflow of 80."],"a":2,"e":"经常账户 = 货物 (500 − 620) + 服务 30 + 初次收入 (−20) + 二次收入 10 = −120 + 30 − 20 + 10 = −100。国际收支必须平衡，经常账户赤字需要由金融账户的净资本流入（外国人购买本国资产或本国动用储备）来融资，因此净流入 100。−120 只看货物贸易；−80 漏掉了初次收入；“净流出”把方向弄反。"},{"id":"F1-01","t":"F1","lv":1,"ex":["IEO","NEC"],"q":"You deposit $1,000 in an account paying 5% per year, compounded annually. How much will be in the account after 3 years (to the nearest cent)?","o":["$1,150.00","$1,157.63","$1,050.00","$1,102.50"],"a":1,"e":"复利终值 FV = 1,000 × 1.05³ = 1,157.63 美元。1,150 是单利 (simple interest) 结果 1,000×(1+0.05×3)，忽略了“利滚利”；1,050 只算了一年；1,102.50 只复利了两年 (1,000×1.05²)。"},{"id":"F1-02","t":"F1","lv":1,"ex":["IEO","NEC"],"q":"Using the rule of 72, approximately how many years will it take for an investment earning 8% per year to double?","o":["6 years","8 years","12.5 years","9 years"],"a":3,"e":"72 法则 (Rule of 72)：翻倍年数 ≈ 72 ÷ 8 = 9 年（精确值 ln2/ln1.08 ≈ 9.01 年）。12.5 年是 100 ÷ 8，即误用了单利思路（单利翻倍需 1/0.08 = 12.5 年）。"},{"id":"F1-03","t":"F1","lv":1,"ex":["IEO","AP","NEC"],"q":"Holding the future cash flow constant, which change will increase the present value of $5,000 to be received in the future?","o":["A decrease in the discount rate","An increase in the discount rate","Receiving the money later","An increase in expected inflation, with the real rate unchanged"],"a":0,"e":"PV = FV ÷ (1 + r)^n：折现率 (discount rate) 下降或期限缩短会使现值上升。推迟收款（n 变大）使 PV 下降；通胀预期上升会推高名义折现率，同样使 PV 下降。"},{"id":"F1-04","t":"F1","lv":1,"ex":["IEO"],"q":"How much must you invest today at 10% per year (compounded annually) to have $10,000 in exactly 2 years?","o":["$8,264.46","$8,000.00","$9,090.91","$8,333.33"],"a":0,"e":"PV = 10,000 ÷ 1.1² = 10,000 ÷ 1.21 = 8,264.46 美元。8,000 是按单利 20% 直接扣减的错误；9,090.91 只折现了一年；8,333.33 是 10,000 ÷ 1.2（单利折现），忽略复利。"},{"id":"F1-05","t":"F1","lv":2,"ex":["IEO"],"q":"A credit card charges an APR of 12%, compounded monthly. What is the effective annual rate (EAR)?","o":["12.00%","12.36%","12.68%","13.00%"],"a":2,"e":"EAR = (1 + 0.12/12)¹² − 1 = 1.01¹² − 1 ≈ 12.68%。12.00% 把名义年利率 (APR) 当成了实际成本；12.36% 是按半年复利 (1.06² − 1) 的结果。复利次数越多，EAR 越高。"},{"id":"F1-06","t":"F1","lv":2,"ex":["IEO","AP","NEC"],"q":"A bank pays a nominal interest rate of 7% per year. Inflation over the year is 3%. Using the exact Fisher relationship, what is the real interest rate (to two decimal places)?","o":["3.88%","10.21%","4.00%","2.33%"],"a":0,"e":"精确费雪方程 (Fisher equation)：1 + r = 1.07 ÷ 1.03 → r ≈ 3.88%。4.00% 是近似式 i − π 的结果，题目要求精确值；10.21% 是把通胀加上去 (1.07×1.03 − 1) 的方向性错误。"},{"id":"F1-07","t":"F1","lv":2,"ex":["IEO"],"q":"A project costs $1,000 today and returns $600 at the end of each of the next two years. The discount rate is 10%. What is the project's NPV?","tbl":[["Year","0","1","2"],["Cash flow ($)","−1,000","600","600"]],"o":["$200.00","$41.32","$1,041.32","$90.91"],"a":1,"e":"NPV = −1,000 + 600/1.1 + 600/1.1² = −1,000 + 545.45 + 495.87 = 41.32 美元 > 0，应接受。200 是不折现直接相加的结果（忽略货币时间价值）；1,041.32 是流入现值之和，忘了减去初始投资；90.91 是把两笔现金流都只折现一年 (1,200/1.1 − 1,000)。"},{"id":"F1-08","t":"F1","lv":2,"ex":["IEO"],"q":"An investment of $1,000 today produces a single payment of $1,210 in two years and nothing else. What is its internal rate of return (IRR)?","o":["10.0% per year","10.5% per year","21.0% per year","11.0% per year"],"a":0,"e":"IRR 使 NPV = 0：1,000 × (1 + IRR)² = 1,210 → (1 + IRR)² = 1.21 → IRR = 10%。10.5% 是把 21% 总收益平均到两年（单利思路）；21% 是两年的累计收益而非年化收益。"},{"id":"F1-09","t":"F1","lv":3,"ex":["IEO"],"q":"You borrow $20,000 at 6% per year, to be repaid in three equal end-of-year payments. How much principal is repaid in the FIRST payment (nearest dollar)?","o":["$6,667","$7,482","$6,282","$1,200"],"a":2,"e":"先算等额还款：PMT = 20,000 × 0.06 ÷ [1 − 1.06⁻³] ≈ 7,482.20。第一年利息 = 20,000 × 6% = 1,200，所以偿还本金 = 7,482.20 − 1,200 ≈ 6,282 美元。7,482 是整笔还款额而非本金部分；6,667 是 20,000 ÷ 3，忽略了利息；1,200 是利息部分。"},{"id":"F1-10","t":"F1","lv":3,"ex":["IEO"],"q":"A lottery winner can take $50,000 today, or $12,000 at the end of each year for 5 years. The appropriate discount rate is 7%. Which choice is better and why?","o":["The annuity, because it pays $60,000 in total","The annuity, because its present value is about $52,000","The lump sum, because the annuity's present value is about $49,202","They are equivalent because both are worth about $50,000 in present value"],"a":2,"e":"年金现值 PV = 12,000 × [1 − 1.07⁻⁵] ÷ 0.07 ≈ 12,000 × 4.1002 ≈ 49,202 美元 < 50,000，因此一次性领取更好。“总额 60,000” 忽略了货币时间价值，是最常见的诱饵；两者现值相差约 798 美元，并不相等。"},{"id":"F2-01","t":"F2","lv":1,"ex":["AP","NEC","IEO"],"q":"Market interest rates rise unexpectedly. What happens to the market price of an existing fixed-rate bond?","o":["It rises, because the bond now earns more interest","It falls, because its fixed coupons are less attractive than new bonds' coupons","It stays at face value until maturity","It rises only if the bond is long-term"],"a":1,"e":"债券价格与收益率反向变动 (inverse relationship)：旧债券票息固定，市场利率上升后只有降价才能给新买家提供同样的收益率。“债券现在赚更多利息”是常见误解——固定利率债券的票息并不变化。期限越长，价格下跌越多。"},{"id":"F2-02","t":"F2","lv":1,"ex":["IEO"],"q":"An investor moves from holding one airline stock to holding an index fund of 500 stocks. Which risk is MOST reduced?","o":["Risk of a global recession","Risk that interest rates rise","Risk that the airline's CEO makes a bad decision","Risk of higher inflation"],"a":2,"e":"分散化 (diversification) 消除的是公司特有风险 (idiosyncratic risk)，如某公司管理层失误。衰退、利率、通胀属于系统性风险 (systematic risk)，影响所有股票，无法通过分散化消除。"},{"id":"F2-03","t":"F2","lv":1,"ex":["IEO"],"q":"A company's share price is $60, its earnings per share (EPS) are $4, and it pays a dividend of $1.80 per share. What are its P/E ratio and dividend yield?","o":["P/E = 15; dividend yield = 3%","P/E = 0.067; dividend yield = 3%","P/E = 15; dividend yield = 45%","P/E = 33.3; dividend yield = 6.7%"],"a":0,"e":"P/E = 60 ÷ 4 = 15；股息率 = 1.80 ÷ 60 = 3%。0.067 是把公式倒过来 (EPS/P)，即收益率 (earnings yield)；45% 是股利 ÷ EPS，即派息率 (payout ratio)，不是股息率。"},{"id":"F2-04","t":"F2","lv":2,"ex":["IEO"],"q":"A 3-year bond has a face value of $1,000 and pays an annual coupon of 5%. If the market yield to maturity is 6%, what is the bond's price (nearest cent)?","o":["$1,000.00","$1,027.23","$973.27","$943.40"],"a":2,"e":"P = 50/1.06 + 50/1.06² + 1,050/1.06³ = 47.17 + 44.50 + 881.60 ≈ 973.27 美元。票面利率 5% < 收益率 6%，债券必然折价 (discount)，所以 1,000 和 1,027.23（溢价）都不可能；943.40 只折现了面值一年（1,000/1.06），遗漏了票息。"},{"id":"F2-05","t":"F2","lv":2,"ex":["IEO"],"q":"A stock's return next year depends on the state of the economy. What is its expected return?","tbl":[["State","Probability","Return"],["Boom","0.3","20%"],["Normal","0.5","5%"],["Recession","0.2","−10%"]],"o":["6.5%","5.0%","8.5%","10.5%"],"a":0,"e":"E(R) = 0.3×20% + 0.5×5% + 0.2×(−10%) = 6% + 2.5% − 2% = 6.5%。5.0% 是三个收益的简单平均 (20+5−10)/3，忽略了概率权重；8.5% 是忘记了衰退情形的负号 (6+2.5)。"},{"id":"F2-06","t":"F2","lv":2,"ex":["IEO"],"q":"The risk-free rate is 3%, the expected market return is 8%, and a stock has a beta of 1.5. According to the CAPM, what is the stock's required return?","o":["12.0%","7.5%","11.0%","10.5%"],"a":3,"e":"E(R) = R_f + β × (E(R_m) − R_f) = 3% + 1.5 × (8% − 3%) = 10.5%。12% 是直接 1.5 × 8%，把整个市场收益而非市场风险溢价 (market risk premium) 乘以 β；7.5% 只算了 β × 溢价，漏掉无风险利率。"},{"id":"F2-07","t":"F2","lv":2,"ex":["IEO"],"q":"A firm announces surprisingly strong earnings at 10:00 a.m. If the market is semi-strong-form efficient, what should we expect?","o":["The price adjusts gradually over several weeks, so buying at 10:30 a.m. earns abnormal returns","The price adjusts almost immediately, so trading on the public announcement will not earn abnormal returns on average","The price will not change because earnings are already known to insiders","Only technical analysis of past prices can earn abnormal returns"],"a":1,"e":"半强式有效 (semi-strong-form efficiency) 意味着所有公开信息会迅速反映到价格中，公告后再买入平均无法获得超额收益 (abnormal returns)。“价格缓慢调整”违背了有效市场；技术分析基于历史价格，在弱式有效下就已失效。"},{"id":"F2-08","t":"F2","lv":3,"ex":["IEO"],"q":"An investor buys both a call and a put on the same stock, each with a strike of $100 and the same expiry (a 'straddle'). The call costs $6 and the put costs $4. Which statement is correct?","o":["The maximum loss is unlimited if the stock price stays at $100","If the stock is $115 at expiry, net profit is $15","The strategy profits only if the stock price rises above $106","If the stock is $115 at expiry, net profit is $5, and the break-even prices are $90 and $110"],"a":3,"e":"股价 115 时：看涨收益 max(115−100,0) = 15，看跌收益 0，净利润 = 15 − (6+4) = 5。盈亏平衡点 = 100 ± 10，即 90 和 110。股价恰为 100 时两份期权都作废，损失为期权费 10（有限而非无限）；“净利润 15” 忘了扣期权费；106 只考虑了看涨期权的期权费。跨式组合 (straddle) 押注的是波动而非方向。"},{"id":"F2-09","t":"F2","lv":3,"ex":["IEO"],"q":"A risk-free asset will pay exactly $110 in one year. The risk-free interest rate is 5% per year, and you can borrow and lend at that rate. The asset is currently selling for $102. What arbitrage is available?","o":["Short the asset and lend $102; profit about $2.76 per unit today","Buy the asset and borrow $104.76 against its payoff; lock in about $2.76 per unit today with no risk","No arbitrage exists because $102 is less than $110","Buy the asset; expected profit is $8 but it is risky"],"a":1,"e":"资产公允价值 = 110 ÷ 1.05 ≈ 104.76 美元，市价 102 被低估。套利 (arbitrage)：今天以 5% 借入 104.76（一年后正好用资产的 110 偿还），用其中 102 买入资产，立即锁定 2.76 美元无风险利润。做空方向反了；“102 < 110 所以无套利”忽略了折现；“利润 8 且有风险”错误，因为收益是确定的。"},{"id":"F2-10","t":"F2","lv":3,"ex":["IEO"],"q":"Stocks X and Y have standard deviations of 20% and 30% and are uncorrelated (ρ = 0). What is the standard deviation of a portfolio with 50% in each (to one decimal place)?","o":["25.0%","32.5%","12.5%","18.0%"],"a":3,"e":"σ_p² = 0.5²×0.2² + 0.5²×0.3² + 2×0.5×0.5×0×0.2×0.3 = 0.01 + 0.0225 = 0.0325，σ_p = √0.0325 ≈ 18.0%。25.0% 是简单加权平均，只有在 ρ = +1 时才成立；12.5% 是把权重平方后乘以标准差之和 (0.25 × 50%)，混淆了方差与标准差的运算。组合风险低于任一单只股票，体现了分散化的好处。"},{"id":"F3-01","t":"F3","lv":1,"ex":["IEO"],"q":"Mei's monthly take-home pay is $4,000. Following the 50/30/20 budgeting rule, how much should she put toward savings and debt repayment each month?","o":["$1,200","$2,000","$400","$800"],"a":3,"e":"50/30/20 法则：20% 用于储蓄和还债，4,000 × 20% = 800 美元。2,000 是必需品 (needs, 50%)，1,200 是可选消费 (wants, 30%)。"},{"id":"F3-02","t":"F3","lv":1,"ex":["IEO"],"q":"Which feature of an investment offer is the STRONGEST warning sign of a Ponzi scheme?","o":["The fund publishes audited financial statements","Returns are high, steady every month, and 'guaranteed', and you earn bonuses for recruiting friends","The fund charges a management fee of 1% per year","The fund's value fell during a stock market decline"],"a":1,"e":"庞氏骗局 (Ponzi scheme) 的典型红旗：承诺高额且异常稳定的“保证”收益，并奖励拉新人（因为需要新资金支付老投资者）。经审计的财报是正规迹象；收取管理费和随市场下跌都是正常投资基金的特征。"},{"id":"F3-03","t":"F3","lv":1,"ex":["IEO"],"q":"Your car insurance policy has a $500 deductible. You have an accident causing $3,000 of covered damage. How much does the insurer pay?","o":["$2,500","$3,000","$500","$3,500"],"a":0,"e":"免赔额 (deductible) 由投保人自付：保险公司赔付 = 3,000 − 500 = 2,500 美元。500 是你自付的部分而不是保险赔付；3,500 把免赔额加反了。"},{"id":"F3-04","t":"F3","lv":1,"ex":["IEO"],"q":"Which action is MOST likely to improve a person's credit score over time?","o":["Opening several new credit cards in the same month","Using 90% of the available credit limit every month","Paying every bill on time and keeping balances low relative to credit limits","Closing the oldest credit card account"],"a":2,"e":"按时还款记录 (payment history) 与较低的额度使用率 (credit utilization) 是信用评分最重要的两个因素。短期内频繁开卡会产生多次查询；使用率 90% 显示财务紧张；关闭最老账户会缩短信用历史并降低总额度。"},{"id":"F3-05","t":"F3","lv":2,"ex":["IEO"],"q":"A homeowner faces a 2% chance of a $20,000 flood loss this year. What is the actuarially fair premium for full insurance, and would a risk-averse homeowner buy insurance at a premium of $450?","o":["$400; yes, a risk-averse person may pay more than the expected loss","$400; no, a rational person never pays more than the expected loss","$20,000; no","$450; yes, because the fair premium is $450"],"a":0,"e":"期望损失 = 0.02 × 20,000 = 400 美元，即精算公平保费 (actuarially fair premium)。风险厌恶者 (risk-averse) 愿意支付一个风险溢价来消除不确定性，所以 450 美元仍可能购买。“理性人不会付超过期望损失”只适用于风险中性者。"},{"id":"F3-06","t":"F3","lv":2,"ex":["IEO"],"q":"Leo has a $3,000 credit card balance at an APR of 18%, compounded monthly. If he makes no payments and no new purchases for 12 months, what will he owe (nearest dollar)?","o":["$3,587","$3,540","$3,045","$3,564"],"a":0,"e":"月利率 = 18% ÷ 12 = 1.5%，余额 = 3,000 × 1.015¹² ≈ 3,586.85 ≈ 3,587 美元。3,540 是单利 3,000 × 1.18，忽略按月复利；3,564 是按半年复利 3,000 × 1.09²；3,045 只计了一个月利息。EAR ≈ 19.56%，高于 APR。"},{"id":"F3-07","t":"F3","lv":2,"ex":["IEO"],"q":"An investor tends to sell stocks that have risen in price quickly to 'lock in gains', while holding on to stocks that have fallen, hoping to 'get back to even'. This pattern is best described as:","o":["Diversification","The disposition effect, driven by loss aversion","Rational rebalancing","Dollar-cost averaging"],"a":1,"e":"处置效应 (disposition effect)：过早卖出盈利股、长期持有亏损股，根源是损失厌恶 (loss aversion)——实现亏损带来的痛苦大于同等收益的快乐。这与分散化或再平衡 (rebalancing) 无关；再平衡依据目标权重，而不是依据是否“回本”。"},{"id":"F3-08","t":"F3","lv":2,"ex":["IEO","AP","NEC"],"q":"A household keeps its savings in an account paying 2% per year while inflation is 5%. What happens to the real purchasing power of those savings over one year (to two decimal places)?","o":["It rises by 2.00%","It falls by 3.00% exactly","It falls by about 2.86%","It rises by 7.00%"],"a":2,"e":"实际收益 = 1.02 ÷ 1.05 − 1 ≈ −2.86%，购买力下降约 2.86%。−3% 是近似式 i − π，并非精确值；“上升 2%”只看了名义收益，忽略通胀 (money illusion 货币幻觉)。"},{"id":"F3-09","t":"F3","lv":3,"ex":["IEO"],"q":"A country's income tax schedule is: 0% on the first $10,000; 10% on income from $10,000 to $40,000; 25% on income above $40,000. For someone earning $60,000, what are the total tax, the average tax rate and the marginal tax rate?","tbl":[["Taxable income band","Rate"],["$0 – $10,000","0%"],["$10,000 – $40,000","10%"],["Above $40,000","25%"]],"o":["$15,000; 25%; 25%","$8,000; 25%; 13.3%","$6,000; 10%; 25%","$8,000; 13.3%; 25%"],"a":3,"e":"税额 = 0 + 10% × 30,000 + 25% × 20,000 = 3,000 + 5,000 = 8,000 美元；平均税率 (average tax rate) = 8,000 ÷ 60,000 ≈ 13.3%；边际税率 (marginal tax rate) = 25%（最后一元的税率）。15,000 是把全部收入按 25% 征税的错误理解；第二项把平均与边际弄反了。"},{"id":"F3-10","t":"F3","lv":3,"ex":["IEO"],"q":"Ana saves $3,000 at the end of every year from age 25 to 65 (40 payments). Ben saves $3,000 at the end of every year from age 35 to 65 (30 payments). Both earn 6% per year. Approximately how much more does Ana have at 65?","o":["$30,000","About $227,000","About $127,000","About $464,000"],"a":1,"e":"年金终值 FV = 3,000 × [(1.06)ⁿ − 1] ÷ 0.06：Ana (n=40) ≈ 464,286；Ben (n=30) ≈ 237,175；差额 ≈ 227,111 美元。30,000 只是多存的本金（10 × 3,000），忽略复利；464,000 是 Ana 的总额而非差额。早开始 10 年，本金多 30,000，终值却多出约 22.7 万——复利时间的威力。"},{"id":"F4-01","t":"F4","lv":1,"ex":["IEO","NEC"],"q":"A café's revenue rose 10% last year, but its profit fell. Which explanation is consistent with these facts?","o":["Its prices increased while quantity sold stayed the same","Its costs rose by more than its revenue did","Its fixed costs were unchanged and variable cost per unit fell","Its number of customers grew while costs per customer fell"],"a":1,"e":"利润 = 收入 − 成本。收入上升而利润下降，只能是成本上升得比收入更多。其他选项都会使利润上升或至少不下降，这是利润树 (profitability tree) 的第一层拆分。"},{"id":"F4-02","t":"F4","lv":1,"ex":["IEO","NEC"],"q":"A bubble-tea shop has fixed costs of $12,000 per month. Each drink sells for $20 and has a variable cost of $8. How many drinks must it sell per month to break even?","o":["600","1,500","1,000","428"],"a":2,"e":"盈亏平衡销量 = FC ÷ (P − AVC) = 12,000 ÷ (20 − 8) = 1,000 杯。600 是用单价去除 (12,000 ÷ 20)，忽略了变动成本；1,500 是用变动成本去除 (12,000 ÷ 8)；428 是 12,000 ÷ 28，把价格和成本相加。"},{"id":"F4-03","t":"F4","lv":1,"ex":["IEO"],"q":"Which of the following is NOT one of Porter's five forces?","o":["Threat of substitute products","Bargaining power of buyers","Threat of new entrants","The firm's internal management culture"],"a":3,"e":"波特五力 (Porter's five forces) 是行业层面的外部力量：现有竞争、新进入者、替代品、供应商议价能力、买方议价能力。公司内部管理文化属于内部因素，在 SWOT 中对应优势或劣势。"},{"id":"F4-04","t":"F4","lv":2,"ex":["IEO"],"q":"A product sells for $50 with a variable cost of $30 per unit. Fixed costs are $80,000 per year. What is the contribution margin ratio and the break-even revenue?","o":["40%; $200,000","60%; $133,333","40%; $80,000","20%; $400,000"],"a":0,"e":"边际贡献率 = (50 − 30) ÷ 50 = 40%；盈亏平衡收入 = 80,000 ÷ 40% = 200,000 美元（即 4,000 件 × 50）。60% 是变动成本率；80,000 只是固定成本；20% 把单位边际贡献 20 误当成了比率。"},{"id":"F4-05","t":"F4","lv":2,"ex":["IEO"],"q":"A subscription app charges $30 per month with a 60% gross margin. Monthly churn is 5%, and customer acquisition cost (CAC) is $120. What are the customer lifetime value (LTV) and the LTV/CAC ratio?","o":["LTV = $360; LTV/CAC = 3","LTV = $600; LTV/CAC = 5","LTV = $18; LTV/CAC = 0.15","LTV = $216; LTV/CAC = 1.8"],"a":0,"e":"每月边际贡献 = 30 × 60% = 18；平均客户寿命 = 1 ÷ 5% = 20 个月；LTV = 18 × 20 = 360 美元，LTV/CAC = 360 ÷ 120 = 3。600 用收入而非毛利计算（30 × 20）；18 只是一个月的贡献。"},{"id":"F4-06","t":"F4","lv":2,"ex":["IEO","NEC"],"q":"A fast-growing firm reports a healthy profit on its income statement but is struggling to pay its suppliers. Which is the MOST likely explanation?","o":["Its depreciation expense is too high","It has too much equity on its balance sheet","Its gross margin is negative","Its sales are mostly on credit, so accounts receivable are rising faster than cash is collected"],"a":3,"e":"利润 ≠ 现金 (profit vs cash)：赊销确认了收入和利润，但现金要等客户付款后才流入，应收账款 (accounts receivable) 积压导致现金紧张。折旧是非现金费用，反而不消耗现金；毛利为负与“利润健康”矛盾。"},{"id":"F4-07","t":"F4","lv":2,"ex":["IEO","NEC"],"q":"Estimate the annual market for dog-food bags in a city of 8 million people, assuming 2.5 people per household, 40% of households own a dog, and each dog-owning household buys 1 bag per month.","o":["About 15.4 million bags","About 38.4 million bags","About 3.2 million bags","About 1.28 million bags"],"a":0,"e":"住户数 = 8,000,000 ÷ 2.5 = 320 万户；养狗户 = 320 万 × 40% = 128 万户；年需求 = 128 万 × 12 = 1,536 万袋 ≈ 15.4 million。3.2 million 是总户数；1.28 million 忘了乘以 12 个月；38.4 million 用总人口而非户数计算（8M × 40% × 12）。"},{"id":"F4-08","t":"F4","lv":3,"ex":["IEO"],"q":"A firm sells 5,000 units per month at $10 each; variable cost is $6 per unit. It is considering cutting the price to $9. By how much must unit sales rise for total contribution to stay the same?","o":["About 11%","About 25%","About 33%","About 50%"],"a":2,"e":"原总边际贡献 = (10 − 6) × 5,000 = 20,000；降价后单位边际贡献 = 3，需要销量 20,000 ÷ 3 ≈ 6,667 件，增幅 ≈ 33.3%。11% 是价格降幅 10% 的直觉推算（10 ÷ 9 − 1），忽略了边际贡献被压缩了 25%；25% 是边际贡献的降幅而非所需销量增幅。只有需求足够有弹性 (elastic) 时降价才划算。"},{"id":"F4-09","t":"F4","lv":3,"ex":["IEO"],"q":"A firm has fixed costs of $50,000, a price of $25 and a variable cost of $15 per unit. The tax rate on profit is 20%. How many units must it sell to earn an AFTER-TAX profit of $24,000?","o":["7,400 units","5,000 units","9,800 units","8,000 units"],"a":3,"e":"税后利润 24,000 对应税前利润 = 24,000 ÷ (1 − 20%) = 30,000。所需销量 = (FC + 税前目标利润) ÷ 单位边际贡献 = (50,000 + 30,000) ÷ 10 = 8,000 件。7,400 直接用税后利润 (50,000 + 24,000) ÷ 10，忘了换算税前；5,000 只是盈亏平衡点。"},{"id":"F4-10","t":"F4","lv":3,"ex":["IEO"],"q":"On the last day of the year, a firm sells goods costing $600 for $1,000 on credit (the customer will pay next month). What is the immediate effect on this year's statements, ignoring tax?","o":["Net income +$400; cash +$1,000; inventory −$600","Net income +$400; operating cash flow unchanged by this sale; accounts receivable +$1,000; inventory −$600; equity +$400","Net income unchanged until cash is received; accounts receivable +$1,000","Net income +$1,000; operating cash flow +$400"],"a":1,"e":"权责发生制 (accrual accounting)：销售发生即确认收入 1,000、成本 600，净利润 +400，留存收益使权益 (equity) +400。现金尚未收到，经营现金流不因这笔销售增加；资产端应收账款 +1,000、存货 −600，净增 400 = 权益增加，会计恒等式保持平衡。“现金 +1,000”混淆了赊销与现销；“收到现金才确认利润”是收付实现制 (cash basis) 的思路。"},{"id":"F5-01","t":"F5","lv":1,"ex":["IB","NEC","IEO"],"q":"Which economist is most closely associated with the 'invisible hand' and the book The Wealth of Nations (1776)?","o":["David Ricardo","John Maynard Keynes","Adam Smith","Karl Marx"],"a":2,"e":"亚当·斯密 (Adam Smith) 在 1776 年《国富论》中提出“看不见的手”和分工理论。李嘉图提出比较优势 (1817)；凯恩斯著《通论》(1936)；马克思著《资本论》，关注资本主义中的阶级与分配冲突。"},{"id":"F5-02","t":"F5","lv":1,"ex":["AP","IB","IEO","NEC"],"q":"A lake is open to everyone for fishing, and fish stocks are collapsing. Which policy most directly addresses the root cause identified by economists?","o":["Subsidising fishing boats so fishers can catch more","Creating tradable fishing quotas that give fishers secure rights to a share of the catch","Encouraging more restaurants to serve fish","Lowering the price of fishing licences"],"a":1,"e":"根源是产权缺失导致的公地悲剧 (tragedy of the commons)：每个渔民忽略自己捕捞对他人的外部成本。可交易配额 (ITQs) 界定了产权，使渔民有激励保护鱼群。补贴渔船和降低许可证价格会加剧过度捕捞。"},{"id":"F5-03","t":"F5","lv":1,"ex":["AP","IB","NEC","IEO"],"q":"During a deep recession with high unemployment, which policy would John Maynard Keynes most likely recommend?","o":["Increasing government spending to raise aggregate demand","Balancing the budget immediately by cutting spending","Fixing money supply growth at a constant rate regardless of conditions","Abolishing the central bank"],"a":0,"e":"凯恩斯 (Keynes) 认为衰退源于总需求 (aggregate demand) 不足，主张扩张性财政政策（增加政府支出或减税）。立即平衡预算会进一步压低需求；固定货币增速规则是弗里德曼 (Friedman) 的主张。"},{"id":"F5-04","t":"F5","lv":2,"ex":["IEO","NEC"],"q":"Shareholders cannot observe how hard a CEO works. Which contract feature is designed mainly to reduce this principal–agent problem?","o":["A fixed salary that does not depend on firm performance","Stock options or bonuses linked to the firm's long-run share price","A guaranteed contract that cannot be terminated","Paying the CEO in cash only at the start of the contract"],"a":1,"e":"委托–代理问题 (principal–agent problem) 源于信息不对称和利益不一致。把报酬与长期股价挂钩，使 CEO 的利益与股东一致。固定工资、不可解约合同和预付现金都削弱了激励，反而加剧道德风险 (moral hazard)。"},{"id":"F5-05","t":"F5","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"In Country A, one worker-hour produces 1 unit of cloth or 0.5 units of wine. In Country B, one worker-hour produces 1/3 unit of cloth or 0.25 units of wine. Which statement is correct?","tbl":[["","Hours per unit of cloth","Hours per unit of wine"],["Country A","1","2"],["Country B","3","4"]],"o":["A has a comparative advantage in both goods, so no trade is beneficial","B has a comparative advantage in cloth","A has a comparative advantage in wine","A has a comparative advantage in cloth; B in wine"],"a":3,"e":"机会成本 (opportunity cost)：A 生产 1 单位布放弃 1/2 = 0.5 单位酒；B 放弃 3/4 = 0.75 单位酒。A 生产布的机会成本更低 → A 在布上有比较优势 (comparative advantage)；相应地 B 在酒上有比较优势（B 的酒机会成本 4/3 ≈ 1.33 布 < A 的 2 布）。A 在两种商品上都有绝对优势 (absolute advantage)，但贸易仍互利——比较优势不可能同时在两种商品上。"},{"id":"F5-06","t":"F5","lv":2,"ex":["IEO","IB"],"q":"Friedrich Hayek's main argument against central planning was that:","o":["Central planners are always corrupt","Markets always produce equal outcomes","The information needed for efficient allocation is dispersed among millions of people, and prices aggregate it","Government spending always causes inflation"],"a":2,"e":"哈耶克 (Hayek) 的“知识问题” (knowledge problem)：关于偏好、技术、局部条件的知识分散在个人手中，价格信号 (price signals) 把这些信息汇总并传递，计划者无法收集。他并未主张市场结果平等；“腐败”和“通胀”不是其核心论证。"},{"id":"F5-07","t":"F5","lv":2,"ex":["AP","IB","AL","NEC","IEO"],"q":"A large country imposes a tariff on imported steel. Which group is MOST likely to be harmed?","o":["Domestic steel producers","The government's tax revenue","Domestic car manufacturers that use steel as an input","Workers in domestic steel mills"],"a":2,"e":"关税 (tariff) 抬高国内钢材价格：国内钢铁企业及其工人受益，政府获得关税收入；但以钢材为投入品的下游产业（如汽车制造）成本上升、竞争力下降。时事分析要同时看到直接受益者和隐性受损者，以及无谓损失 (deadweight loss)。"},{"id":"F5-08","t":"F5","lv":3,"ex":["AP","IB","AL","NEC","IEO"],"q":"Assume the velocity of money is constant. The money supply grows by 8% per year and real GDP grows by 3% per year. According to the quantity theory of money, what is the approximate inflation rate?","o":["11%","8%","3%","5%"],"a":3,"e":"货币数量论 (quantity theory)：%ΔM + %ΔV ≈ %ΔP + %ΔY → 8% + 0 ≈ π + 3% → π ≈ 5%。8% 忽略了实际产出增长吸收的货币需求；11% 把产出增长错误地加上去。这正是弗里德曼“通胀是货币现象”的逻辑。"},{"id":"F5-09","t":"F5","lv":3,"ex":["IEO"],"q":"In a CORE-style labour discipline model, a worker earns $600 per week. If fired, her reservation option (unemployment benefit plus value of free time) is worth $450 per week, and she expects to be unemployed for 10 weeks before finding a similar job. What is her total cost of job loss, and what happens to it if unemployment benefits rise?","o":["$1,500; it rises","$6,000; it falls","$4,500; it rises","$1,500; it falls"],"a":3,"e":"每周就业租金 (employment rent) = 600 − 450 = 150；失业 10 周的总损失 = 150 × 10 = 1,500 美元。失业救济提高 → 保留选择价值上升 → 就业租金下降，雇主需提高工资才能维持同样的努力程度。6,000 是全部工资而非租金；4,500 是保留选择的价值。"},{"id":"F5-10","t":"F5","lv":3,"ex":["IEO","NEC"],"q":"A new AI tool can perform many routine document-review tasks previously done by junior paralegals. Using a task-based view of technology, which prediction is BEST supported?","o":["Total employment in the economy must fall by the number of tasks automated","Nothing will change because technology never affects labour markets","All wages will rise because productivity rises","Demand falls for workers whose jobs are concentrated in the automated tasks, while workers whose skills complement the tool may see higher productivity and wages; the net effect on total employment is ambiguous"],"a":3,"e":"任务视角 (task-based view)：AI 替代部分任务产生替代效应 (displacement effect)，但也通过降低成本产生生产率效应 (productivity effect) 并创造新任务 (new tasks)。被替代任务集中的岗位需求下降，与 AI 互补 (complementary) 的技能回报上升；总体就业影响取决于各效应大小，是不确定的。“就业必然等量减少”是劳动总量谬误 (lump of labour fallacy)；“所有工资都上升”忽略了分配效应。"}],"problems":[{"id":"P-m1-1","t":"m1","title":"Rice, Steel and the Gains from Trade","stem":"Alpha and Beta each produce rice and steel using only labor, with constant labor requirements. In Alpha, 1 ton of rice requires 2 labor-hours and 1 ton of steel requires 6 labor-hours. In Beta, 1 ton of rice requires 4 labor-hours and 1 ton of steel requires 8 labor-hours. Alpha has 1,200 labor-hours and Beta has 1,600 labor-hours available. Before trade, each country devotes half of its labor to each good.","parts":[{"q":"(a) Which country has an absolute advantage in each good? Which country has a comparative advantage in each good? Show opportunity costs.","sol":"绝对优势 (absolute advantage)：Alpha 生产 1 吨大米只需 2 小时（Beta 4 小时），1 吨钢只需 6 小时（Beta 8 小时），Alpha 在两种商品上都有绝对优势。\n机会成本（注意题目给的是单位工时，要用工时之比）：\n- Alpha：1 钢 = 6/2 = 3 米；1 米 = 1/3 钢。\n- Beta：1 钢 = 8/4 = 2 米；1 米 = 1/2 钢。\nBeta 生产钢的机会成本更低（2 < 3），在钢上有比较优势 (comparative advantage)；Alpha 生产大米的机会成本更低（1/3 < 1/2），在大米上有比较优势。"},{"q":"(b) Calculate each country's autarky output and world output. Then calculate world output if each country specializes completely according to comparative advantage.","sol":"自给自足 (autarky)，各用一半劳动：\n- Alpha：大米 600/2 = 300 吨，钢 600/6 = 100 吨。\n- Beta：大米 800/4 = 200 吨，钢 800/8 = 100 吨。\n世界产量：大米 500 吨，钢 200 吨。\n完全专业化：Alpha 全部生产大米 1200/2 = 600 吨；Beta 全部生产钢 1600/8 = 200 吨。\n世界产量：大米 600 吨，钢 200 吨——钢不变，大米多出 100 吨，这就是专业化带来的产出增加。"},{"q":"(c) What range of terms of trade (tons of rice per ton of steel) benefits both countries? Suppose trade occurs at 1 steel = 2.5 rice and Beta exports 100 tons of steel. Compare each country's consumption with autarky.","sol":"互利贸易条件必须位于两国钢的机会成本之间：2 < 1 钢的价格 < 3 米。\n按 1 钢 = 2.5 米，Beta 出口 100 吨钢换回 250 吨米：\n- Alpha 消费：大米 600 − 250 = 350 吨，钢 100 吨（自给自足时 300 米、100 钢）→ 多 50 吨大米。\n- Beta 消费：大米 250 吨，钢 200 − 100 = 100 吨（自给自足时 200 米、100 钢）→ 多 50 吨大米。\n两国都获益，总收益 100 吨大米，正好等于 (b) 中专业化带来的产出增加。"},{"q":"(d) Suppose a new irrigation technology halves the labor needed for rice in Beta (to 2 hours per ton), with everything else unchanged. How does the pattern of comparative advantage change, and what is the new range of mutually beneficial terms of trade?","sol":"Beta 的新机会成本：1 钢 = 8/2 = 4 米（1 米 = 1/4 钢）。Alpha 仍为 1 钢 = 3 米（1 米 = 1/3 钢）。\n现在 Alpha 生产钢的机会成本更低（3 < 4），比较优势发生逆转：Alpha 应专业化生产钢，Beta 专业化生产大米。\n新的互利贸易条件：3 米 < 1 钢 < 4 米。\n启示：比较优势取决于相对生产率，一国某部门的技术进步可能改变整个贸易格局，这也说明即使绝对优势不变（此时两国大米生产率相同），比较优势仍可能改变。"}]},{"id":"P-m4-1","t":"m4","title":"Who Really Pays the Tax?","stem":"In a competitive market, demand is Qd = 240 − 4P and supply is Qs = 6P − 60, where P is in dollars and Q in thousands of units. The government is considering a per-unit tax collected from sellers.","parts":[{"q":"(a) Find the equilibrium price and quantity, consumer surplus and producer surplus before the tax.","sol":"令 240 − 4P = 6P − 60 → 10P = 300 → P* = 30，Q* = 240 − 120 = 120。\n需求价格截距：Qd = 0 → P = 60；供给价格截距：Qs = 0 → P = 10。\nCS = ½ × (60 − 30) × 120 = 1,800；PS = ½ × (30 − 10) × 120 = 1,200（单位：千美元）。总剩余 3,000。"},{"q":"(b) A tax of $5 per unit is imposed on sellers. Find the price paid by consumers, the price received by producers, the new quantity, tax revenue and deadweight loss.","sol":"税后供给：Qs = 6(P − 5) − 60 = 6P − 90。令 240 − 4P = 6P − 90 → 10P = 330 → P_c = 33，Q = 240 − 132 = 108，P_s = 33 − 5 = 28。\n消费者每单位多付 3，生产者每单位少得 2。\n税收 = 5 × 108 = 540；DWL = ½ × 5 × (120 − 108) = 30（千美元）。"},{"q":"(c) Compute the price elasticities of demand and supply at the original equilibrium and show that the formula consumer share = PES ÷ (PES + |PED|) matches your answer to (b).","sol":"PED = (dQ/dP) × (P/Q) = −4 × 30/120 = −1；PES = 6 × 30/120 = 1.5。\n消费者承担比例 = 1.5 ÷ (1.5 + 1) = 0.6，即 0.6 × 5 = 3，与 (b) 中消费者价格上升 3 完全一致；生产者承担 0.4 × 5 = 2。\n对线性模型，这等价于 d ÷ (b + d) = 6 ÷ 10 = 0.6：供给越有弹性（相对需求），消费者承担越多。"},{"q":"(d) Write tax revenue as a function of the tax t. Which tax maximizes revenue, and what is the deadweight loss at that tax? Comment on the trade-off.","sol":"一般地：240 − 4P_c = 6(P_c − t) − 60 → P_c = 30 + 0.6t，Q(t) = 240 − 4(30 + 0.6t) = 120 − 2.4t。\n税收 R(t) = t(120 − 2.4t) = 120t − 2.4t²；dR/dt = 120 − 4.8t = 0 → t = 25。\n此时 Q = 60，R = 25 × 60 = 1,500；DWL = ½ × 25 × (120 − 60) = 750。\n对比：t = 5 时 DWL 只有 30，但收入为 540。税额扩大 5 倍，DWL 扩大 25 倍（DWL = 1.2t²，随税率平方增长），而收入不到 3 倍。政府若在意效率，不应把税率推到收入最大化水平；超过 t = 25 后提税反而减少收入（拉弗曲线的微观版本）。"}]},{"id":"P-m7-1","t":"m7","title":"Monopoly Pricing and Price Discrimination","stem":"A pharmaceutical company holds a patent on a drug. Domestic demand is P = 200 − 2Q (Q in thousands of doses, P in $). Marginal cost and average cost are constant at $40 per dose (no fixed costs).","parts":[{"q":"(a) Find the profit-maximizing quantity, price and profit for the monopolist in the domestic market.","sol":"MR = 200 − 4Q（线性需求的 MR 斜率加倍）。令 MR = MC：200 − 4Q = 40 ⇒ Q = 40（千剂）。代入需求曲线：P = 200 − 80 = 120 美元。利润 = (P − AC) × Q = (120 − 40) × 40 = 3200（千美元）。"},{"q":"(b) Calculate consumer surplus and the deadweight loss compared with the perfectly competitive outcome.","sol":"消费者剩余 (CS) = ½ × (200 − 120) × 40 = 1600。完全竞争时 P = MC = 40 ⇒ 200 − 2Q = 40 ⇒ Q = 80。无谓损失 (DWL) = ½ × (120 − 40) × (80 − 40) = 1600。（竞争下 CS = ½ × 160 × 80 = 6400 = 垄断 CS 1600 + 利润 3200 + DWL 1600，可作检验。）"},{"q":"(c) Suppose the firm could practise perfect (first-degree) price discrimination. Find output, profit, consumer surplus and deadweight loss.","sol":"一级价格歧视下每单位按保留价格出售，厂商会一直卖到需求价格 = MC：Q = 80。利润 = 需求曲线与 MC 之间的全部面积 = ½ × (200 − 40) × 80 = 6400。消费者剩余 = 0，DWL = 0。配置有效率，但全部剩余被厂商占有。"},{"q":"(d) Now the firm can also sell abroad, where demand is P = 120 − Q, and the two markets can be kept separate. Find the price in each market under third-degree price discrimination and total profit. Compare with the profit if it had to charge a single uniform price in both markets.","sol":"三级价格歧视：各市场分别令 MR = MC。\n国内：MR = 200 − 4Q = 40 ⇒ Q_D = 40，P_D = 120，利润 3200。\n国外：MR = 120 − 2Q = 40 ⇒ Q_E = 40，P_E = 80，利润 (80 − 40) × 40 = 1600。\n总利润 = 4800。检验勒纳指数：国内 |PED| = 0.5 × 120/40 = 1.5，(120−40)/120 = 2/3；国外 |PED| = 1 × 80/40 = 2，(80−40)/80 = 1/2。需求弹性较小的国内市场定价更高。\n统一定价：P ≤ 120 时总需求 Q = (100 − 0.5P) + (120 − P) = 220 − 1.5P ⇒ P = (220 − Q)/1.5，MR = (220 − 2Q)/1.5 = 40 ⇒ Q = 80，P = 140/1.5 ≈ 93.33（< 120，两个市场都有销售，假设成立）。利润 = (93.33 − 40) × 80 ≈ 4266.67。\n结论：价格歧视利润 4800 > 统一定价 4266.67，厂商有动机分割市场并防止转售（平行进口）。"}]},{"id":"P-m8-1","t":"m8","title":"Collusion in a Repeated Pricing Game","stem":"Two airlines, Alpha and Beta, are the only carriers on a route. Each quarter they simultaneously choose a High or Low fare. Quarterly profits ($m) are: both High (12, 12); Alpha High & Beta Low (4, 18); Alpha Low & Beta High (18, 4); both Low (8, 8). Payoffs are listed as (Alpha, Beta). Future profits are discounted by a factor δ per quarter (0 < δ < 1).","parts":[{"q":"(a) If the game is played only once, does either firm have a dominant strategy? Find the Nash equilibrium and explain why this is a prisoner's dilemma.","sol":"对 Alpha：若 Beta 选 High，Low 得 18 > 12；若 Beta 选 Low，Low 得 8 > 4 ⇒ Low 是 Alpha 的占优策略 (dominant strategy)。Beta 对称，也选 Low。纳什均衡 (Low, Low)，收益 (8, 8)。但 (High, High) 的 (12, 12) 使双方都更好——个体理性导致集体非最优，这就是囚徒困境 (prisoner's dilemma)。"},{"q":"(b) Suppose the game is repeated exactly 8 quarters and both firms know this. Can collusion on High fares be sustained? Explain using backward induction.","sol":"不能。用逆向归纳 (backward induction)：第 8 季是最后一期，未来无法惩罚，等同一次性博弈，双方都选 Low。既然第 8 季结果与第 7 季的行为无关，第 7 季也等同一次性博弈，选 Low……依次倒推，每一季都是 (Low, Low)。终点已知的有限重复博弈无法维持合作（除非存在不完全信息或多重均衡）。"},{"q":"(c) Now suppose the game is repeated indefinitely and both firms use a grim-trigger strategy (charge High until the rival charges Low, then charge Low forever). Find the minimum δ that sustains collusion. What does this imply for the interest rate r, if δ = 1/(1 + r)?","sol":"坚持合作的现值：12/(1 − δ)。\n偏离的现值：当期 18，此后永远 (Low, Low) 得 8：18 + 8δ/(1 − δ)。\n合作条件：12/(1 − δ) ≥ 18 + 8δ/(1 − δ) ⇒ 12 ≥ 18(1 − δ) + 8δ = 18 − 10δ ⇒ δ ≥ 0.6。\n公式检验：δ ≥ (π_D − π_C)/(π_D − π_N) = (18 − 12)/(18 − 8) = 0.6。\n由 1/(1 + r) ≥ 0.6 ⇒ r ≤ 2/3 ≈ 66.7%（每季）。利率越低、企业越有耐心，合谋越稳定。"},{"q":"(d) Suppose instead Beta plays tit-for-tat. Alpha considers a one-off deviation: charge Low this quarter, then return to High permanently. For what values of δ is this deviation unprofitable? Combining with (c), for what δ is cooperation against tit-for-tat robust to both one-off and permanent deviation?","sol":"Beta 采用以牙还牙 (tit-for-tat)：Alpha 在 t 期选 Low 得 18；t+1 期 Beta 复制 Low 而 Alpha 回到 High，Alpha 得 4；t+2 期起 Beta 复制 Alpha 的 High，回到 (12, 12)。从 t+2 期起两条路径相同，只需比较前两期：\n合作：12 + 12δ；一次偏离：18 + 4δ。\n偏离无利可图：12 + 12δ ≥ 18 + 4δ ⇒ 8δ ≥ 6 ⇒ δ ≥ 0.75。\n永久偏离（此后一直选 Low）面对 TFT 时的收益为 18 + 8δ/(1 − δ)，与 (c) 相同，要求 δ ≥ 0.6。\n两者同时成立需 δ ≥ 0.75。含义：TFT 的惩罚只持续一期，比冷酷触发温和，因此需要更高的贴现因子才能遏制“偶尔背叛”。"}]},{"id":"P-m10-1","t":"m10","title":"Steel Pollution and a Pigouvian Tax","stem":"In a competitive steel market, demand (marginal social benefit) is P = 100 − Q and supply (marginal private cost) is P = 20 + Q, where Q is in millions of tonnes and P in $ per tonne. Steel production causes air pollution with a marginal external cost of MEC = 0.5Q (rising with output).","parts":[{"q":"(a) Find the unregulated market equilibrium quantity and price.","sol":"市场按 MPB = MPC 决定：100 − Q = 20 + Q ⇒ Q = 40（百万吨），P = 60 美元/吨。"},{"q":"(b) Derive the marginal social cost (MSC) curve and find the socially optimal quantity and price.","sol":"MSC = MPC + MEC = 20 + Q + 0.5Q = 20 + 1.5Q。社会最优：MSB = MSC ⇒ 100 − Q = 20 + 1.5Q ⇒ 2.5Q = 80 ⇒ Q* = 32，P* = 100 − 32 = 68。市场过度生产 8 百万吨。"},{"q":"(c) Calculate the deadweight loss caused by the externality in the unregulated market.","sol":"无谓损失为 Q* = 32 到 Q = 40 之间 MSC 高于 MSB 的三角形面积。在 Q = 40：MSC = 20 + 60 = 80，MSB = 60，差距 20；在 Q = 32 差距为 0。DWL = ½ × 20 × (40 − 32) = 80（百万美元）。积分检验：∫₃₂⁴⁰ (2.5Q − 80) dQ = 80。"},{"q":"(d) What per-unit Pigouvian tax achieves the social optimum? Find the price paid by buyers, the price received by producers, and the tax revenue. Briefly explain one advantage of a cap-and-trade scheme over this tax.","sol":"庇古税 (Pigouvian tax) = 社会最优产量处的 MEC = 0.5 × 32 = 16 美元/吨（注意不是市场产量处的 0.5 × 40 = 20）。征税后供给变为 P = 36 + Q，与需求 100 − Q 相交 ⇒ Q = 32，买方支付 68，生产者得到 68 − 16 = 52。税收收入 = 16 × 32 = 512（百万美元）。\n总量管制与交易 (cap-and-trade) 的优势：直接控制排放总量（可发放对应 Q = 32 的许可证），在监管者不确定企业成本时能确保环境目标；许可证交易使边际减排成本相等，以最低成本实现减排。（代价是价格不确定，而碳税价格确定、排放量不确定。）"}]},{"id":"P-M1-1","t":"M1","title":"GDP, the Deflator and the CPI","stem":"A simple economy produces only three final goods: rice, phones and haircuts. The data below give quantities and prices for 2024 (the base year) and 2025.\nRice: 100 kg at $2.00 (2024); 110 kg at $2.20 (2025).\nPhones: 10 units at $50 (2024); 12 units at $45 (2025).\nHaircuts: 40 at $10 (2024); 42 at $11 (2025).\nAssume all three goods are bought by consumers, and that the CPI basket is fixed at the 2024 quantities.","parts":[{"q":"(a) Calculate nominal GDP in 2024 and 2025, and the growth rate of nominal GDP.","sol":"名义GDP按当年价格计算：\n2024：100 × 2 + 10 × 50 + 40 × 10 = 200 + 500 + 400 = 1,100。\n2025：110 × 2.2 + 12 × 45 + 42 × 11 = 242 + 540 + 462 = 1,244。\n名义增长率 = 1,244 ÷ 1,100 − 1 ≈ 13.09%。"},{"q":"(b) Using 2024 prices, calculate real GDP in 2025 and the growth rate of real GDP.","sol":"实际GDP_2025（按2024年价格）= 110 × 2 + 12 × 50 + 42 × 10 = 220 + 600 + 420 = 1,240。\n2024 为基年，实际GDP = 名义GDP = 1,100。\n实际增长率 = 1,240 ÷ 1,100 − 1 ≈ 12.73%。"},{"q":"(c) Calculate the GDP deflator for 2025 and the inflation rate it implies.","sol":"GDP平减指数_2025 = 名义GDP ÷ 实际GDP × 100 = 1,244 ÷ 1,240 × 100 ≈ 100.32（2024 = 100）。\n平减指数衡量的通胀率 ≈ 0.32%。\n检验：(1 + 13.09%) ÷ (1 + 12.73%) − 1 ≈ 0.32%，与上面一致。"},{"q":"(d) Calculate the CPI for 2025 using the fixed 2024 basket and the CPI inflation rate. Explain why the CPI and the GDP deflator give different inflation rates.","sol":"2024 篮子在2025年的成本 = 100 × 2.2 + 10 × 45 + 40 × 11 = 220 + 450 + 440 = 1,110；基年成本 = 1,100。\nCPI_2025 = 1,110 ÷ 1,100 × 100 ≈ 100.91，CPI 通胀率 ≈ 0.91%。\n差异原因：CPI 使用**固定的基期篮子** (Laspeyres 型)，而平减指数使用**当期产量**作权重 (Paasche 型)。手机价格下降 10%、而消费者在2025年多买了手机（10 → 12），平减指数给降价的手机更高权重，所以测得的通胀更低。CPI 忽略了消费者向相对变便宜商品转移的行为，即**替代偏差 (substitution bias)**，因此倾向于高估生活成本的上升。"}]},{"id":"P-M3-1","t":"M3","title":"Closing a Recessionary Gap: Multipliers and Money Creation","stem":"An economy's current real GDP is $1,800 billion, while potential real GDP is $2,000 billion. The marginal propensity to consume is 0.75. Assume a closed economy with no income taxes, a constant price level in the short run, and no crowding out unless stated. The required reserve ratio for banks is 12.5%.","parts":[{"q":"(a) Calculate the spending multiplier and the change in government purchases needed to close the output gap exactly.","sol":"产出缺口 = 2,000 − 1,800 = 200（十亿美元）。\n支出乘数 = 1 ÷ (1 − MPC) = 1 ÷ 0.25 = 4。\n所需 ΔG = 200 ÷ 4 = 50（十亿美元）。"},{"q":"(b) Instead of changing purchases, the government considers (i) a tax cut alone, or (ii) a balanced-budget increase in both purchases and taxes. How large must each policy be to close the gap?","sol":"(i) 税收乘数 = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3，需要减税 200 ÷ 3 ≈ 66.7（十亿美元）。减税规模大于 ΔG，因为第一轮只有 75% 的减税被消费。\n(ii) 平衡预算乘数 = 1：G 与 T 同时增加 200。验证：4 × 200 − 3 × 200 = 800 − 600 = 200。平衡预算方案所需规模最大，但不增加赤字。"},{"q":"(c) The government chooses the purchases increase in (a) and finances it by issuing bonds. To prevent interest rates from rising (and crowding out investment), the central bank buys $10 billion of government bonds from commercial banks. If banks lend out all excess reserves and the public holds no extra cash, what is the maximum increase in the money supply?","sol":"央行从银行买入债券，银行准备金增加 10，且这些全部是超额准备金（没有新增存款，不需要额外法定准备金）。\n简单货币乘数 = 1 ÷ rr = 1 ÷ 0.125 = 8。\n货币供给最大增加 = 10 × 8 = 80（十亿美元）。\n经济学意义：货币扩张使货币供给右移、抵消政府借款对利率的上推，即“货币政策为财政政策提供配合 (accommodation)”，减少挤出效应。"},{"q":"(d) Suppose banks decide to hold additional excess reserves equal to 7.5% of deposits, and some investment is still crowded out, reducing private investment by $10 billion. Calculate the new maximum increase in the money supply and the net change in real GDP from the fiscal package. Comment on the result.","sol":"银行实际准备金比率 = 12.5% + 7.5% = 20%，有效货币乘数 = 1 ÷ 0.2 = 5。\n货币供给最大增加 = 10 × 5 = 50（十亿美元），低于 (c) 的 80。\n产出：ΔG = 50，私人投资被挤出 10，自主支出净增加 = 50 − 10 = 40；ΔY = 4 × 40 = 160（十亿美元），缺口剩余 200 − 160 = 40，未能完全弥补。\n评论：银行惜贷（持有超额准备金，常见于衰退期）削弱了货币创造，使利率更难被压住，从而挤出效应仍然存在；政策制定者需更大规模的刺激或其他工具（如降低准备金利率、前瞻指引）来弥补。"}]},{"id":"P-M7-1","t":"M7","title":"Widgets, Tariffs, Quotas and a Falling Peso","stem":"A small open economy uses the peso. Its domestic market for widgets is described by demand Qd = 200 − 2P and supply Qs = 3P − 50, where P is the price in pesos. The world price of widgets is $10, and the country is a price taker. Initially the exchange rate is 4 pesos per dollar.","parts":[{"q":"(a) Find the autarky (no-trade) equilibrium price and quantity. Then find domestic consumption, domestic production and imports under free trade.","sol":"封闭均衡：200 − 2P = 3P − 50 ⇒ 5P = 250 ⇒ P = 50 比索，Q = 100。\n自由贸易：世界价格 = $10 × 4 = 40 比索 < 50，因此该国进口。\nQd = 200 − 80 = 120，Qs = 120 − 50 = 70，进口 = 120 − 70 = 50。"},{"q":"(b) The government imposes a tariff of 5 pesos per widget. Calculate the new domestic price, imports, tariff revenue, the change in consumer surplus, the change in producer surplus, and the deadweight loss.","sol":"国内价格 = 40 + 5 = 45。Qd = 200 − 90 = 110，Qs = 135 − 50 = 85，进口 = 25。\n关税收入 = 5 × 25 = 125。\n消费者剩余减少 = 5 × (120 + 110) ÷ 2 = 575。\n生产者剩余增加 = 5 × (70 + 85) ÷ 2 = 387.5。\nDWL = ½ × 5 × (85 − 70) + ½ × 5 × (120 − 110) = 37.5 + 25 = 62.5。\n检验：575 = 387.5 + 125 + 62.5 ✓。"},{"q":"(c) Suppose instead the government imposes an import quota that yields the same domestic price as the tariff. What quota level is required? Compare the country's welfare loss with the tariff if the import licenses are given free of charge to foreign exporters.","sol":"要使国内价格为 45，进口配额需为 25 单位（与关税后进口量相同）。\n价格与数量相同，所以生产者剩余增加 387.5、消费者剩余减少 575、DWL 62.5 都与关税相同。\n区别：原本 125 的关税收入变为配额租金 (quota rents)。若许可证免费给外国出口商，这 125 流向国外，本国净福利损失 = 62.5 + 125 = 187.5，是关税情形（62.5）的3倍。若政府拍卖许可证，则可收回租金，结果与关税等价。"},{"q":"(d) Now remove all trade barriers. Suppose higher interest rates abroad trigger capital outflows and the peso depreciates to 4.5 pesos per dollar. Find the new domestic price and imports. Explain why this depreciation reduces imports just like the tariff, yet the country's welfare loss relative to free trade at 4 pesos is larger.","sol":"国外利率上升 → 资本流出 → 比索供给增加 → 比索贬值至 4.5。\n国内价格 = $10 × 4.5 = 45 比索，与关税情形相同：Qd = 110，Qs = 85，进口 = 25。\n福利比较（相对于汇率为4时的自由贸易）：消费者剩余减少 575，生产者剩余增加 387.5，净损失 = 575 − 387.5 = 187.5。\n原因：关税情形中，每单位进口多付的 5 比索作为关税收入留在国内；贬值情形中，同样多付的 5 比索（25 × 5 = 125）支付给了外国，这是**贸易条件恶化 (terms-of-trade loss)** 带来的真实收入损失，因此总损失 = DWL 62.5 + 125 = 187.5，等于把配额租金送给外国的情形。另一方面，贬值会提高该国出口的竞争力，本题的单一进口市场分析没有计入这部分收益。"}]},{"id":"P-F1-1","t":"F1","title":"Should the Bakery Buy the Oven?","stem":"A bakery is considering a new industrial oven that costs $50,000 today. The oven will increase the bakery's net cash flow by $15,000 at the end of each year for 5 years. At the end of year 5 the oven can be sold for scrap for $5,000. The bakery's cost of capital is 8% per year. A bank offers to lend the full $50,000 at 6% per year, repaid in 5 equal end-of-year payments.","parts":[{"q":"(a) Calculate the NPV of the oven project at the 8% cost of capital. Should the bakery invest?","sol":"现金流：第 0 年 −50,000；第 1–4 年各 +15,000；第 5 年 +15,000 + 5,000 = +20,000。\n年金现值系数 (8%, 5 年) = [1 − 1.08⁻⁵] ÷ 0.08 ≈ 3.9927。\nPV(15,000 年金) = 15,000 × 3.9927 ≈ 59,890.65；PV(残值 5,000) = 5,000 ÷ 1.08⁵ ≈ 3,402.92。\nNPV = −50,000 + 59,890.65 + 3,402.92 ≈ **13,293.57 美元 > 0**，应投资。"},{"q":"(b) Show that the project's IRR lies between 17% and 18%. What does this tell the bakery?","sol":"IRR 是令 NPV = 0 的折现率。\nr = 17% 时 NPV ≈ +270.75；r = 18% 时 NPV ≈ -906.89。NPV 由正变负，所以 IRR 在 17% 与 18% 之间（线性插值约 17.2%）。\n含义：只要资本成本低于约 17.2%，项目就创造价值；8% 的资本成本留有很大的安全边际。即使资本成本升到 12%，NPV 仍约为 6,908.78 美元。"},{"q":"(c) If the bakery takes the bank loan, what is the annual loan payment? How much of the first payment is interest, and what is the total interest paid over the loan?","sol":"PMT = 50,000 × 0.06 ÷ [1 − 1.06⁻⁵] ≈ **11,869.82 美元/年**。\n第 1 年利息 = 50,000 × 6% = 3,000；偿还本金 = 11,869.82 − 3,000 = 8,869.82。\n总还款 = 5 × 11,869.82 = 59,349.10，总利息 = 59,349.10 − 50,000 ≈ **9,349.10 美元**。"},{"q":"(d) What is the minimum annual cash flow (years 1–5, keeping the $5,000 scrap value) for which the project still has a non-negative NPV at 8%? Briefly explain why the financing decision (the 6% loan) should not change the answer in (a).","sol":"令 NPV = 0：CF × 3.9927 + 3,402.92 = 50,000 → CF = (50,000 − 3,402.92) ÷ 3.9927 ≈ **11,670.54 美元/年**。预期现金流 15,000 比盈亏平衡水平高约 28.5%，项目对现金流下滑有一定缓冲。\n投资决策与融资决策应分开 (separation of investment and financing decisions)：项目是否创造价值取决于其现金流与反映风险的资本成本，而不是这笔钱从哪里来。以 6% 借款只是改变了现金流在银行与店主之间的分配；若 6% 低于店主的机会成本 8%，这笔贷款本身有小幅正价值，但它不应被用来“美化”一个本身 NPV 为负的项目。"}]},{"id":"P-F2-1","t":"F2","title":"Tech Stock vs Utility Stock","stem":"An investor is choosing between Stock A (a technology company) and Stock B (a utility). Next year's returns depend on the state of the economy: Boom (probability 0.25): A = 30%, B = 2%; Normal (probability 0.50): A = 12%, B = 6%; Recession (probability 0.25): A = −14%, B = 10%. The risk-free rate is 3%.","parts":[{"q":"(a) Calculate the expected return and standard deviation of each stock.","sol":"E(R_A) = 0.25×30 + 0.5×12 + 0.25×(−14) = 7.5 + 6 − 3.5 = **10%**。\nE(R_B) = 0.25×2 + 0.5×6 + 0.25×10 = 0.5 + 3 + 2.5 = **6%**。\nVar(A) = 0.25×(20)² + 0.5×(2)² + 0.25×(−24)² = 100 + 2 + 144 = 246（%²），σ_A = √246 ≈ **15.68%**。\nVar(B) = 0.25×(−4)² + 0.5×0² + 0.25×4² = 4 + 0 + 4 = 8，σ_B = √8 ≈ **2.83%**。"},{"q":"(b) Calculate the covariance and correlation between A and B. Explain in words why they move this way.","sol":"Cov = 0.25×(20)(−4) + 0.5×(2)(0) + 0.25×(−24)(4) = −20 + 0 − 24 = **−44**（%²）。\n相关系数 ρ = −44 ÷ (15.68 × 2.83) ≈ **-0.99**。\n几乎完全负相关：科技股是顺周期 (pro-cyclical) 的，繁荣时收益高；公用事业需求稳定，衰退时资金流向防御性股票，表现反而较好。"},{"q":"(c) The investor puts 60% in A and 40% in B. Find the portfolio's expected return and standard deviation. Compare σ with the weighted average of the two standard deviations and explain.","sol":"各情形组合收益：繁荣 0.6×30 + 0.4×2 = 18.8%；正常 0.6×12 + 0.4×6 = 9.6%；衰退 0.6×(−14) + 0.4×10 = −4.4%。\nE(R_P) = 0.6×10 + 0.4×6 = **8.4%**。\nVar(P) = 0.6²×246 + 0.4²×8 + 2×0.6×0.4×(−44) = 88.56 + 1.28 − 21.12 = 68.72，σ_P = √68.72 ≈ **8.29%**。\n加权平均 σ = 0.6×15.68 + 0.4×2.83 ≈ 10.54%，高于组合实际 σ。差异来自负相关带来的分散化 (diversification)：一只股票的损失被另一只的收益部分抵消。"},{"q":"(d) Compute the Sharpe ratio (E(R) − R_f) ÷ σ for A, B and the 60/40 portfolio. Then suppose A's beta is 1.4 and the expected market return is 9%. Using the CAPM, is A fairly priced? What would you advise?","sol":"夏普比率 (Sharpe ratio)：A = (10 − 3) ÷ 15.68 ≈ 0.45；B = (6 − 3) ÷ 2.83 ≈ 1.06；组合 = (8.4 − 3) ÷ 8.29 ≈ 0.65。B 的单位风险回报最高，A 最低。\nCAPM 要求收益 = 3% + 1.4 × (9% − 3%) = **11.4%**，而 A 的期望收益只有 10%，α = 10% − 11.4% = **−1.4%**，A 被高估 (overpriced)。\n建议：在此预测下减少 A 的权重、增加 B（或指数基金）。需要指出的风险：三种情形的概率只是估计，若繁荣概率被低估，结论可能改变。"}]},{"id":"P-F4-1","t":"F4","title":"BrewBox: Fixing a Coffee Subscription","stem":"BrewBox sells a monthly coffee-bean subscription box for $25. Each box costs $11 in beans and packaging and $4 in shipping and payment fees. Fixed costs (staff, rent, software) are $30,000 per month. BrewBox currently has 2,400 subscribers; monthly churn is 8%, and it spends on average $90 in online advertising to acquire each new subscriber. The founders ask your team to assess the business and recommend a strategy to a panel of investors.","parts":[{"q":"(a) Calculate the contribution margin per box, the break-even number of subscribers, and BrewBox's current monthly profit.","sol":"单位边际贡献 = 25 − 11 − 4 = **10 美元/箱**。\n盈亏平衡订阅数 = 30,000 ÷ 10 = **3,000 人**。\n当前月利润 = 2,400 × 10 − 30,000 = **−6,000 美元**（亏损）。"},{"q":"(b) Estimate customer lifetime value (LTV), the LTV/CAC ratio and the CAC payback period. Is the unit economics healthy?","sol":"平均客户寿命 = 1 ÷ 8% = 12.5 个月。\nLTV = 10 × 12.5 = **125 美元**。\nLTV/CAC = 125 ÷ 90 ≈ **1.39**；回本期 = 90 ÷ 10 = **9 个月**。\n行业常用健康标准为 LTV/CAC ≥ 3、回本期 ≤ 12 个月。BrewBox 虽能回本，但 LTV/CAC 偏低，扣除管理费用后获客几乎不赚钱——单位经济学 (unit economics) 不健康，单纯加大广告投放只会烧钱。"},{"q":"(c) Option 1: raise the price to $28, which the team expects to increase monthly churn to 10%. Option 2: launch a referral programme that cuts CAC to $60 with price and churn unchanged. Compare the LTV/CAC of each option. For Option 1, also compare the new break-even with the steady-state subscriber base if BrewBox keeps acquiring the same number of new subscribers per month as now.","sol":"**方案 1（涨价）**：边际贡献 = 28 − 15 = 13；寿命 = 1 ÷ 10% = 10 个月；LTV = 130；LTV/CAC = 130 ÷ 90 ≈ **1.44**；盈亏平衡订阅数 = 30,000 ÷ 13 ≈ **2,308 人**。\n短期看，2,400 人 × 13 − 30,000 = +1,200，似乎扭亏。但当前每月新增 = 2,400 × 8% = 192 人（稳态时新增 = 流失）。流失率升到 10% 后，稳态订阅数 = 192 ÷ 10% = **1,920 人**，低于 2,308 的盈亏平衡点，稳态月利润 = 1,920 × 13 − 30,000 = **−5,040 美元**。涨价的好处被更高的流失率侵蚀。\n**方案 2（推荐计划）**：LTV 仍为 125，LTV/CAC = 125 ÷ 60 ≈ **2.08**，回本期 = 60 ÷ 10 = 6 个月，单位经济学明显改善，且同样的营销预算可获取 1.5 倍的新用户。"},{"q":"(d) Prepare a 1-minute recommendation for the investor panel: state your recommendation first, support it with three numbers, and name the key risk and how you would test it.","sol":"**结论先行**：优先推出推荐计划（方案 2），暂不涨价；同时把降低流失率作为核心 KPI。\n**三个数字**：\n- 目前每位用户终身价值 125 美元，但获客成本 90 美元，LTV/CAC 仅 1.39；\n- 推荐计划把 CAC 降到 60，LTV/CAC 提升到约 2.1，回本期从 9 个月缩短到 6 个月；\n- 涨价看似短期扭亏 (+1,200)，但若流失率升到 10%，稳态订阅人数将降到约 1,920，每月亏损约 5,040。\n**下一步**：要达到 3,000 人的盈亏平衡点，还需把流失率从 8% 降下来（如按季度预付折扣、个性化口味推荐）——流失率降到 6% 时寿命从 12.5 个月增加到约 16.7 个月，LTV 升至约 167。\n**关键风险**：推荐计划的 CAC 假设（60 美元）可能过于乐观。检验方法：先在 10% 的用户中做为期 1 个月的 A/B 测试，测量每位推荐用户的实际获客成本与留存率，再决定是否全面推广。"}]}]}</script>
<script>const MARK = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"262 410 382 258\"><path fill-rule=\"nonzero\" fill=\"rgb(97.5%, 49.3%, 10.9%)\" fill-opacity=\"1\" d=\"M 638.7 473.1 L 565.7 516.1 L 456.7 418.0 L 356.2 548.1 L 267.6 638.0 L 267.6 663.3 L 393.1 663.3 C 398.6 663.3 404.1 662.3 409.2 660.4 C 409.3 660.4 409.4 660.3 409.4 660.3 C 422.2 654.7 428.3 640.6 433.8 628.8 C 434.4 627.7 434.8 626.7 435.3 625.6 C 440.0 615.2 442.4 610.1 444.1 604.3 C 444.1 604.3 446.5 595.8 445.7 575.3 C 445.5 570.8 442.1 571.1 437.8 571.9 C 437.6 571.9 437.3 571.9 437.1 572.0 C 433.4 572.7 429.8 574.2 426.4 575.9 L 415.3 580.8 C 409.5 583.3 403.7 583.7 398.0 582.5 C 393.9 581.7 389.9 580.0 386.2 577.7 C 383.8 576.2 381.6 574.4 380.3 571.9 C 377.0 565.1 384.1 559.4 388.1 554.9 C 394.2 548.0 400.6 541.4 406.8 534.6 C 416.1 524.2 425.4 513.7 434.0 502.7 C 434.0 502.6 434.1 502.5 434.1 502.5 L 443.5 474.2 L 443.5 474.2 C 444.3 472.3 447.0 472.3 447.9 474.1 L 450.9 480.2 C 456.3 491.2 465.1 498.0 475.5 504.1 C 485.6 510.2 495.7 517.7 503.9 526.6 C 505.4 528.2 506.8 529.8 508.2 531.6 C 514.3 539.3 518.5 548.4 524.1 556.6 C 527.3 561.2 530.8 565.6 534.5 569.8 C 549.8 587.0 565.6 597.2 575.8 600.2 C 579.8 601.4 583.0 602.2 585.3 602.6 C 602.7 606.0 579.8 591.5 577.2 582.9 C 576.9 582.0 576.8 581.3 577.0 580.5 C 577.6 578.5 580.2 577.3 594.5 574.1 C 606.3 571.4 612.2 570.0 616.3 569.5 C 636.6 566.8 658.9 564.1 681.1 574.2 C 697.0 581.4 709.3 594.1 720.5 607.1 C 729.9 618.2 739.3 629.3 748.8 640.3 C 751.3 643.3 757.0 649.2 762.0 654.3 C 767.6 660.1 775.3 663.3 783.4 663.3 L 808.5 663.3 L 808.5 646.7 Z M 638.7 473.1 \"/></svg>";</script>
<script>/* ---------- Interactive economics diagrams (SVG) ---------- */
const DG = (() => {
  const x0 = 46, y0 = 206, x1 = 306, y1 = 16;
  const X = v => +(x0 + (x1 - x0) * v / 10).toFixed(1);
  const Y = v => +(y0 - (y0 - y1) * v / 10).toFixed(1);
  const f1 = n => (Math.round(n * 100) / 100).toString();
  let uid = 0;
  function frame(xl, yl, inner) {
    const id = 'clip' + (++uid);
    return `<svg class="dg" viewBox="0 0 330 238" role="img" aria-label="${yl} / ${xl}">
<defs><clipPath id="${id}"><rect x="${X(0)}" y="${Y(10)}" width="${X(10) - X(0)}" height="${Y(0) - Y(10)}"/></clipPath></defs>
<g clip-path="url(#${id})">${inner.clip || ''}</g>
${inner.free || ''}
<path class="ax" d="M${X(0)} ${Y(10.3)} L${X(0)} ${Y(0)} L${X(10.3)} ${Y(0)}"/>
<text class="axl" x="${X(0) - 4}" y="${Y(10.3) - 3}" text-anchor="start">${yl}</text>
<text class="axl" x="${X(10.3)}" y="${Y(0) + 24}" text-anchor="end">${xl}</text>
<text class="axl" x="${X(0) - 6}" y="${Y(0) + 12}" text-anchor="end">0</text>
</svg>`;
  }
  function curve(fn, cls, a = 0, b = 10, n = 120) {
    let d = '', pen = false;
    for (let i = 0; i <= n; i++) {
      const q = a + (b - a) * i / n, p = fn(q);
      if (!isFinite(p) || p < -1 || p > 11) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(q) + ' ' + Y(p) + ' ';
      pen = true;
    }
    return `<path class="${cls}" d="${d}"/>`;
  }
  const vline = (q, cls, a = 0, b = 10) => `<path class="${cls}" d="M${X(q)} ${Y(a)} L${X(q)} ${Y(b)}"/>`;
  const hline = (p, cls, a = 0, b = 10) => `<path class="${cls}" d="M${X(a)} ${Y(p)} L${X(b)} ${Y(p)}"/>`;
  const poly = (pts, cls) => `<polygon class="${cls}" points="${pts.map(([q, p]) => X(q) + ',' + Y(p)).join(' ')}"/>`;
  const txt = (q, p, s, cls = '', anchor = 'start', dx = 0, dy = 0) => `<text class="${cls}" x="${X(q) + dx}" y="${Y(p) + dy}" text-anchor="${anchor}">${s}</text>`;
  const dot = (q, p) => `<circle class="pt" cx="${X(q)}" cy="${Y(p)}" r="3.4"/>`;
  function guides(q, p, ql, pl) {
    let s = `<path class="guide" d="M${X(0)} ${Y(p)} L${X(q)} ${Y(p)} L${X(q)} ${Y(0)}"/>`;
    let t = '';
    if (pl) t += `<text class="axl" x="${X(0) - 5}" y="${Y(p) + 3.5}" text-anchor="end">${pl}</text>`;
    if (ql) t += `<text class="axl" x="${X(q)}" y="${Y(0) + 12}" text-anchor="middle">${ql}</text>`;
    return { s, t };
  }
  // label at end of a curve
  const lab = (q, p, s, c, anchor = 'start') => txt(q, p, s, 'lb lb-' + c, anchor, anchor === 'start' ? 4 : -4, 3);

  const D = {};

  D.sd = {
    title: '供求均衡 Supply & Demand', xl: '数量 Q', yl: '价格 P',
    controls: [
      { id: 'dD', label: '需求移动 ΔD', min: -3, max: 3, step: 0.5, val: 0 },
      { id: 'dS', label: '供给移动 ΔS', min: -3, max: 3, step: 0.5, val: 0 }],
    draw(v) {
      const dD = +v.dD, dS = +v.dS;
      const Dn = q => 10 + dD - q, Sn = q => q - dS;
      const Q = (10 + dD + dS) / 2, P = 10 + dD - Q;
      const g = guides(Q, P, 'Q*', 'P*');
      let clip = poly([[0, 10 + dD], [0, P], [Q, P]], 'a-d') + poly([[0, P], [0, -dS], [Q, P]], 'a-s');
      if (dD) clip += curve(q => 10 - q, 'ghost');
      if (dS) clip += curve(q => q, 'ghost');
      clip += g.s + curve(Dn, 'cd') + curve(Sn, 'cs') + dot(Q, P);
      const free = g.t + lab(Math.min(9.6, 10 + dD - 0.6) , 0.6, 'D', 'd', 'start') + lab(Math.min(9.4, 9.4 + dS), Math.min(9.4, 9.4), 'S', 's', 'start')
        + txt(Q * 0.28, P + (10 + dD - P) * 0.3, 'CS', 'lb lb-d') + txt(Q * 0.28, P - 1.2, 'PS', 'lb lb-s');
      const msg = dD === 0 && dS === 0 ? '拖动滑块，观察均衡价格与数量的变化方向。' :
        `需求${dD > 0 ? '增加' : dD < 0 ? '减少' : '不变'}、供给${dS > 0 ? '增加' : dS < 0 ? '减少' : '不变'} → P ${P > 5 ? '上升' : P < 5 ? '下降' : '不变'}，Q ${Q > 5 ? '上升' : Q < 5 ? '下降' : '不变'}`;
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['P*', f1(P)], ['Q*', f1(Q)], ['', msg]] };
    }
  };

  D.fx = Object.assign({}, D.sd, {
    title: '外汇市场 Market for US$', xl: '美元数量 Q of $', yl: '汇率 ¥/$',
    controls: [
      { id: 'dD', label: '对美元的需求 ΔD$', min: -3, max: 3, step: 0.5, val: 0 },
      { id: 'dS', label: '美元的供给 ΔS$', min: -3, max: 3, step: 0.5, val: 0 }],
    draw(v) {
      const r = D.sd.draw.call({ xl: this.xl, yl: this.yl }, v);
      const dD = +v.dD, dS = +v.dS, Q = (10 + dD + dS) / 2, P = 10 + dD - Q;
      r.read[2] = ['', P > 5 ? '¥/$ 上升：美元升值、人民币贬值' : P < 5 ? '¥/$ 下降：美元贬值、人民币升值' : '例：美国加息 → 对美元需求增加 → 美元升值'];
      return r;
    }
  });

  D.tax = {
    title: '从量税 Per-unit Tax', xl: '数量 Q', yl: '价格 P',
    controls: [
      { id: 't', label: '单位税额 t', min: 0, max: 5, step: 0.5, val: 2 },
      { id: 's', label: '需求曲线斜率（越大越缺乏弹性）', min: 0.3, max: 3, step: 0.1, val: 1 }],
    draw(v) {
      const t = +v.t, s = +v.s;
      const Dn = q => 5 + s * (5 - q), Sn = q => q, St = q => q + t;
      const Qt = (5 + 5 * s - t) / (1 + s), Pp = Qt, Pc = Qt + t;
      let clip = poly([[0, Pp], [0, Pc], [Qt, Pc], [Qt, Pp]], 'a-3') + poly([[Qt, Pp], [Qt, Pc], [5, 5]], 'a-x');
      const g1 = guides(Qt, Pc, 'Qt', 'Pc'), g2 = guides(Qt, Pp, '', 'Pp');
      clip += g1.s + g2.s + `<path class="guide" d="M${X(0)} ${Y(5)} L${X(5)} ${Y(5)}"/>` + curve(Dn, 'cd') + curve(Sn, 'cs') + (t ? curve(St, 'c3') : '') + dot(Qt, Pc) + dot(Qt, Pp);
      const free = g1.t + g2.t + `<text class="axl" x="${X(0) - 5}" y="${Y(5) + 3.5}" text-anchor="end">P₀</text>` + lab(9.3, 9.3, 'S', 's') + (t ? lab(Math.min(9.3, 9.3 - t), 9.3, 'S+t', '3', 'end') : '') + lab(Math.min(9.8, 5 + 5 / s), 0.3, 'D', 'd', 'end');
      const share = t ? (Pc - 5) / t : 0.5;
      return {
        svg: frame(this.xl, this.yl, { clip, free }), read: [['消费者支付 Pc', f1(Pc)], ['生产者得到 Pp', f1(Pp)], ['税收收入', f1(t * Qt)], ['无谓损失 DWL', f1(0.5 * t * (5 - Qt))],
        ['消费者负担', Math.round(share * 100) + '%'], ['', '需求越缺乏弹性，消费者负担的税越多']]
      };
    }
  };

  D.floor = {
    title: '价格管制 Price Ceiling / Floor', xl: '数量 Q', yl: '价格 P',
    controls: [{ id: 'p', label: '管制价格（<5 为最高限价，>5 为最低限价）', min: 1, max: 9, step: 0.5, val: 7 }],
    draw(v) {
      const p = +v.p, Qd = 10 - p, Qs = p, Qm = Math.min(Qd, Qs);
      let clip = '';
      if (p !== 5) clip += poly([[Qm, 10 - Qm], [Qm, Qm], [5, 5]], 'a-x');
