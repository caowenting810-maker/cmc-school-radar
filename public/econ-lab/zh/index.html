      clip += hline(p, 'c3') + curve(q => 10 - q, 'cd') + curve(q => q, 'cs') + dot(Qd, p) + dot(Qs, p) + `<path class="guide" d="M${X(Qd)} ${Y(p)} L${X(Qd)} ${Y(0)} M${X(Qs)} ${Y(p)} L${X(Qs)} ${Y(0)}"/>`;
      const kind = p > 5 ? '最低限价 Price floor' : p < 5 ? '最高限价 Price ceiling' : '均衡价格';
      const free = lab(9.4, 9.4, 'S', 's') + lab(9.6, 0.4, 'D', 'd', 'end') + txt(10, p, kind.split(' ')[0], 'lb lb-3', 'end', 0, -5)
        + `<text class="axl" x="${X(Qd)}" y="${Y(0) + 12}" text-anchor="middle">Qd</text><text class="axl" x="${X(Qs)}" y="${Y(0) + 12}" text-anchor="middle">Qs</text>`;
      const gap = Math.abs(Qs - Qd);
      return {
        svg: frame(this.xl, this.yl, { clip, free }), read: [['类型', kind], ['Qd', f1(Qd)], ['Qs', f1(Qs)],
        [p > 5 ? '过剩 Surplus' : p < 5 ? '短缺 Shortage' : '缺口', f1(gap)], ['成交量', f1(Qm)], ['DWL', f1((5 - Qm) ** 2)]]
      };
    }
  };

  D.ppc = {
    title: '生产可能性曲线 PPC', xl: '消费品 Consumer goods', yl: '资本品 Capital goods',
    controls: [{ id: 'g', label: '经济增长（PPC 外移）', min: 0, max: 1.5, step: 0.25, val: 0 }],
    draw(v) {
      const g = +v.g, R = 8.5;
      const f = r => q => q <= r ? r * Math.sqrt(1 - (q / r) ** 2) : NaN;
      let clip = curve(f(R), 'cs', 0, R, 160);
      if (g) clip += curve(f(R + g), 'c3', 0, R + g, 160);
      const A = [5, f(R)(5)], B = [3, 3], C = [7, 6.6];
      clip += dot(...A) + dot(...B) + dot(...C);
      const free = txt(A[0], A[1], 'A 有效率', 'lb lb-k', 'start', 6, -4) + txt(B[0], B[1], 'B 未充分利用', 'lb lb-k', 'start', 6, 4) + txt(C[0], C[1], 'C 目前不可达', 'lb lb-k', 'start', 6, -4) + lab(R, 0.5, 'PPC₁', 's', 'end') + (g ? lab(Math.min(9.9, R + g), 1.4, 'PPC₂', '3', 'end') : '');
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['', g ? '技术进步 / 资源增加使 PPC 外移，原来不可达的 C 点变得可达' : '曲线向外凸：机会成本递增（资源不完全适用于两种生产）']] };
    }
  };

  // cost curves: VC = a q^3 - b q^2 + c q, FC = 6
  D.costs = {
    title: '成本曲线与完全竞争厂商 Cost curves', xl: '产量 q', yl: '成本 / 价格',
    controls: [{ id: 'P', label: '市场价格 P = MR', min: 1, max: 6, step: 0.1, val: 3.5 }],
    draw(v) {
      const a = 0.05, b = 0.6, c = 3.5, FC = 6;
      const AVC = q => a * q * q - b * q + c, MC = q => 3 * a * q * q - 2 * b * q + c, ATC = q => AVC(q) + FC / q;
      const P = +v.P;
      const disc = 1.44 - 0.6 * (3.5 - P);
      let q = 0;
      if (P >= 1.7 && disc >= 0) q = (1.2 + Math.sqrt(disc)) / 0.3;
      const atc = q ? ATC(q) : 0, profit = q ? (P - atc) * q : -FC;
      let clip = '';
      if (q) clip += poly([[0, atc], [0, P], [q, P], [q, atc]], profit >= 0 ? 'a-3' : 'a-x');
      clip += curve(MC, 'cs', 0.3, 10) + curve(ATC, 'cd', 0.75, 10) + curve(AVC, 'ck', 0.3, 10) + hline(P, 'c3');
      if (q) { const gg = guides(q, P, 'q*', ''); clip += gg.s + dot(q, P); }
      const free = lab(9.25, MC(9.25), 'MC', 's', 'end') + lab(9.9, ATC(9.9), 'ATC', 'd', 'end') + lab(9.9, AVC(9.9), 'AVC', 'k', 'end') + txt(10, P, 'P = MR', 'lb lb-3', 'end', 0, -5) + (q ? `<text class="axl" x="${X(q)}" y="${Y(0) + 12}" text-anchor="middle">q*</text>` : '');
      const st = !q ? 'P < AVC 最低点 (1.7)：停产 shutdown，亏损 = 固定成本' : profit > 0.05 ? '经济利润 > 0：长期将吸引新厂商进入' : profit < -0.05 ? '亏损但 P ≥ AVC：短期继续生产（覆盖可变成本）' : '收支相抵：正常利润（长期均衡）';
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['q*（P=MC）', f1(q)], ['ATC(q*)', q ? f1(atc) : '—'], ['经济利润', f1(profit)], ['', st]] };
    }
  };

  D.monopoly = {
    title: '垄断 Monopoly', xl: '数量 Q', yl: '价格 P',
    controls: [{ id: 'c', label: '边际成本 MC（常数）', min: 1, max: 5, step: 0.5, val: 2 }],
    draw(v) {
      const c = +v.c, Qm = (10 - c) / 2, Pm = 10 - Qm, Qc = 10 - c;
      let clip = poly([[0, 10], [0, Pm], [Qm, Pm]], 'a-d') + poly([[0, Pm], [0, c], [Qm, c], [Qm, Pm]], 'a-3') + poly([[Qm, Pm], [Qm, c], [Qc, c]], 'a-x');
      const g = guides(Qm, Pm, 'Qm', 'Pm');
      clip += g.s + `<path class="guide" d="M${X(Qm)} ${Y(Pm)} L${X(Qm)} ${Y(0)}"/>` + curve(q => 10 - q, 'cd') + curve(q => 10 - 2 * q, 'ck', 0, 5) + hline(c, 'cs') + dot(Qm, Pm) + dot(Qm, c);
      const free = g.t + lab(9.6, 0.4, 'D = AR', 'd', 'end') + lab(4.9, 0.4, 'MR', 'k', 'end') + txt(10, c, 'MC = AC', 'lb lb-s', 'end', 0, -5) + `<text class="axl" x="${X(Qc)}" y="${Y(0) + 12}" text-anchor="middle">Qc</text>` + txt(Qm + 0.5, (Pm + c) / 2 - 0.3, 'DWL', 'lb', 'start') + txt(Qm * 0.3, (Pm + c) / 2 - 0.3, '垄断利润', 'lb lb-3');
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['MR = MC → Qm', f1(Qm)], ['Pm', f1(Pm)], ['利润', f1((Pm - c) * Qm)], ['竞争产量 Qc', f1(Qc)], ['DWL', f1(0.5 * (Pm - c) * (Qc - Qm))]] };
    }
  };

  D.ext_neg = {
    title: '负外部性 Negative Externality', xl: '数量 Q', yl: '价格 / 成本',
    controls: [{ id: 'e', label: '单位外部成本（MSC − MPC）', min: 0, max: 4, step: 0.5, val: 3 }],
    draw(v) {
      const e = +v.e, Qm = 5, Qo = (10 - e) / 2;
      let clip = e ? poly([[Qo, 10 - Qo], [Qm, Qm + e], [Qm, 5]], 'a-x') : '';
      clip += curve(q => 10 - q, 'cd') + curve(q => q, 'cs') + (e ? curve(q => q + e, 'c3') : '') + dot(Qm, 5) + dot(Qo, 10 - Qo) + `<path class="guide" d="M${X(Qo)} ${Y(10 - Qo)} L${X(Qo)} ${Y(0)} M${X(Qm)} ${Y(5)} L${X(Qm)} ${Y(0)}"/>`;
      const free = lab(9.4, 9.4, 'MPC = S', 's', 'end') + (e ? lab(9.4 - e, 9.4, 'MSC', '3', 'end') : '') + lab(9.6, 0.4, 'MSB = D', 'd', 'end') + `<text class="axl" x="${X(Qo)}" y="${Y(0) + 12}" text-anchor="middle">Q*</text><text class="axl" x="${X(Qm)}" y="${Y(0) + 12}" text-anchor="middle">Qm</text>`;
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['市场产量 Qm', f1(Qm)], ['社会最优 Q*', f1(Qo)], ['DWL', f1(0.5 * e * (Qm - Qo))], ['庇古税', f1(e) + ' / 单位'], ['', '市场只看私人成本 → 过度生产']] };
    }
  };

  D.adas = {
    title: 'AD–AS 模型', xl: '实际 GDP (Real GDP)', yl: '价格水平 PL',
    controls: [
      { id: 'dAD', label: '总需求移动 ΔAD', min: -3, max: 3, step: 0.5, val: 0 },
      { id: 'dAS', label: '短期总供给移动 ΔSRAS', min: -3, max: 3, step: 0.5, val: 0 },
      { id: 'g', label: '长期增长（LRAS 右移）', min: 0, max: 2, step: 0.5, val: 0 }],
    draw(v) {
      const dA = +v.dAD, dS = +v.dAS, g = +v.g, Yf = 5 + g;
      const AD = q => 10 + dA - q, AS = q => q - dS;
      const Q = (10 + dA + dS) / 2, P = 10 + dA - Q;
      const gg = guides(Q, P, 'Y', 'PL');
      let clip = '';
      if (dA) clip += curve(q => 10 - q, 'ghost');
      if (dS) clip += curve(q => q, 'ghost');
      if (g) clip += vline(5, 'ghost');
      clip += gg.s + vline(Yf, 'c3') + curve(AD, 'cd') + curve(AS, 'cs') + dot(Q, P);
      const free = gg.t + lab(Yf, 9.6, 'LRAS', '3') + lab(Math.min(9.7, 9.7 + dA) - 0.2, 0.5, 'AD', 'd', 'end') + lab(Math.min(9.4, 9.4 + dS), 9.4, 'SRAS', 's', 'end') + `<text class="axl" x="${X(Yf)}" y="${Y(0) + 12}" text-anchor="middle">Yf</text>`;
      const gap = Q - Yf;
      const st = Math.abs(gap) < 0.01 ? '处于充分就业产出 Yf（长期均衡）' : gap < 0 ? `衰退缺口 Recessionary gap = ${f1(-gap)}：失业率高于自然率` : `通胀缺口 Inflationary gap = ${f1(gap)}：失业率低于自然率`;
      const extra = dS < 0 && Math.abs(dA) < .01 ? '；SRAS 左移 = 滞胀 Stagflation' : '';
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['Y', f1(Q)], ['PL', f1(P)], ['', st + extra]] };
    }
  };
  D.lras = Object.assign({}, D.adas, { controls: D.adas.controls.map(c => c.id === 'g' ? Object.assign({}, c, { val: 1 }) : c) });

  D.moneymkt = {
    title: '货币市场 Money Market', xl: '货币数量 Q of money', yl: '名义利率 i',
    controls: [
      { id: 'ms', label: '货币供给 Ms（央行）', min: 2, max: 8, step: 0.5, val: 5 },
      { id: 'dm', label: '货币需求移动 ΔMd', min: -2, max: 2, step: 0.5, val: 0 }],
    draw(v) {
      const ms = +v.ms, dm = +v.dm;
      const Md = q => 9 + dm * 0.9 - 0.9 * q, i = Md(ms);
      const gg = guides(ms, i, '', 'i*');
      let clip = (ms !== 5 ? vline(5, 'ghost') : '') + (dm ? curve(q => 9 - 0.9 * q, 'ghost') : '') + gg.s + vline(ms, 'cs') + curve(Md, 'cd') + dot(ms, i);
      const free = gg.t + lab(ms, 9.6, 'Ms', 's') + lab(9.7, Md(9.7) + 0.3, 'Md', 'd', 'end');
      const st = ms > 5 ? '扩张性货币政策（如公开市场买入债券）→ i 下降 → 投资增加 → AD 右移' : ms < 5 ? '紧缩性货币政策 → i 上升 → 投资减少 → AD 左移' : 'Md 右移（如名义 GDP 上升）会推高利率';
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['i*', f1(i) + '%'], ['', st]] };
    }
  };

  D.phillips = {
    title: '菲利普斯曲线 Phillips Curve', xl: '失业率 u (%)', yl: '通胀率 π (%)',
    controls: [{ id: 'pe', label: '预期通胀 πᵉ', min: 0, max: 4, step: 0.5, val: 2 }],
    draw(v) {
      const pe = +v.pe;
      const S = u => 18 / u - 3.6 + pe;
      let clip = (pe !== 2 ? curve(u => 18 / u - 1.6, 'ghost', 1.6, 10) : '') + vline(5, 'c3') + curve(S, 'cs', 1.6, 10) + dot(5, pe);
      const gg = guides(5, pe, 'uₙ', 'πᵉ');
      clip += gg.s;
      const free = gg.t + lab(5, 9.6, 'LRPC', '3') + lab(9.9, S(9.9) + 0.3, 'SRPC', 's', 'end');
      return { svg: frame(this.xl, this.yl, { clip, free }), read: [['自然失业率 uₙ', '5%'], ['', '短期：沿 SRPC 存在通胀—失业权衡；长期：LRPC 垂直于 uₙ。预期通胀上升 → SRPC 上移']] };
    }
  };

  return { D, render(id, host) {
    const d = D[id]; if (!d) return false;
    const vals = {}; d.controls.forEach(c => vals[c.id] = c.val);
    host.innerHTML = `<div class="row between"><h3>${d.title}</h3><button class="btn sm ghost" data-reset>重置</button></div>
      <div class="dg-host"></div>
      ${d.controls.length ? `<div class="ctrls">${d.controls.map(c => `<label class="ctrl" for="dg-${id}-${c.id}"><span>${c.label}<b class="mono" data-v="${c.id}">${c.val}</b></span><input type="range" id="dg-${id}-${c.id}" data-k="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}"></label>`).join('')}</div>` : ''}
      <div class="readout"></div>`;
    const draw = () => {
      const r = d.draw(vals);
      host.querySelector('.dg-host').innerHTML = r.svg;
      host.querySelector('.readout').innerHTML = r.read.map(([k, v]) => k ? `<span>${k} <b>${v}</b></span>` : `<span>${v}</span>`).join('');
    };
    host.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
      vals[inp.dataset.k] = inp.value; host.querySelector(`[data-v="${inp.dataset.k}"]`).textContent = inp.value; draw();
    }));
    host.querySelector('[data-reset]').addEventListener('click', () => {
      d.controls.forEach(c => { vals[c.id] = c.val; const i = host.querySelector(`[data-k="${c.id}"]`); i.value = c.val; host.querySelector(`[data-v="${c.id}"]`).textContent = c.val; });
      draw();
    });
    draw();
    return true;
  } };
})();
</script>
<script>/* ================= CMC EconLab ================= */
const DATA = JSON.parse(document.getElementById('econ-data').textContent);
const LESSONS = DATA.lessons, QS = DATA.questions, PROBS = DATA.problems;
const LBY = Object.fromEntries(LESSONS.map(l => [l.id, l]));
const QBY = Object.fromEntries(QS.map(q => [q.id, q]));
const UNITS = [
  { id: 'micro', zh: '微观经济学', en: 'Microeconomics' },
  { id: 'macro', zh: '宏观经济学', en: 'Macroeconomics' },
  { id: 'finance', zh: '金融 · 商业 · 制度', en: 'Finance, Business & Institutions' }];
const EXAMS = { AP: 'AP', IB: 'IB', AL: 'A-Level', IEO: 'IEO', NEC: 'NEC' };
const LV = { 1: '基础', 2: '进阶', 3: '竞赛' };
const GRADES = ['G8', 'G9', 'G10', 'G11', 'G12'];
const LETTERS = 'ABCDE';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const gnum = g => parseInt(String(g).replace(/\D/g, '')) || 10;

function md(s) {
  const lines = String(s || '').split('\n');
  let out = '', ul = false;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    const l = raw.trim();
    if (/^[-•]\s+/.test(l)) { if (!ul) { out += '<ul>'; ul = true; } out += '<li>' + inl(l.replace(/^[-•]\s+/, '')) + '</li>'; }
    else { if (ul) { out += '</ul>'; ul = false; } if (l) out += '<p>' + inl(l) + '</p>'; }
  }
  if (ul) out += '</ul>';
  return out;
}

/* ---------- icons ---------- */
const I = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  home: I('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  learn: I('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M8 7h7M8 11h5"/>'),
  practice: I('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'),
  mock: I('<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>'),
  prob: I('<path d="M4 4h16v12H8l-4 4z"/><path d="M9 9h6M9 12h3"/>'),
  wrong: I('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'),
  guide: I('<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>'),
  coach: I('<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>'),
  star: I('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'),
  more: I('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
  arrow: I('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  back: I('<path d="M19 12H5M11 6l-6 6 6 6"/>'),
};

/* ---------- state & persistence ---------- */
const KEY = 'cmc-econlab-v1';
const blank = () => ({ answers: {}, fav: [], lessons: {}, profile: { grade: 'G10', goals: ['AP', 'IEO'] }, mocks: [], days: [], probs: {}, updatedAt: 0 });
function loadLocal() { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch (e) { } return blank(); }
let S = loadLocal();
let dbRef = null, syncT = null, cloud = 'off';
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  if (dbRef) { clearTimeout(syncT); syncT = setTimeout(pushCloud, 1200); }
}
function pushCloud() {
  if (!dbRef) return;
  dbRef.set({ state: JSON.stringify(S), updatedAt: S.updatedAt }).then(() => setCloud('on')).catch(() => setCloud('err'));
}
function setCloud(s) { cloud = s; document.querySelectorAll('[data-sync]').forEach(el => el.innerHTML = syncLabel()); }
function syncLabel() {
  return cloud === 'on' ? '<span class="dot on"></span>进度已同步到你的账号' : cloud === 'err' ? '<span class="dot"></span>同步暂不可用，进度保存在本机' : '<span class="dot"></span>进度保存在本机浏览器';
}
async function initCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc('data/users/' + uid + '/progress');
    const snap = await dbRef.get();
    const r = snap.exists ? snap.data() : null;
    if (r && r.state && (r.updatedAt || 0) > (S.updatedAt || 0)) {
      S = Object.assign(blank(), JSON.parse(r.state));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
      if (!(view.name === 'quiz' || view.name === 'mockrun')) render();
    } else if (S.updatedAt && (!r || S.updatedAt > (r.updatedAt || 0))) pushCloud();
    setCloud('on');
  } catch (e) { setCloud('err'); }
}
let SAMPLE = null;
async function initSample() {
  try { if (window.claude && window.claude.use) SAMPLE = await window.claude.use('sample'); } catch (e) { SAMPLE = null; }
  if (SAMPLE && (view.name === 'coach')) render();
}

function markDay() { const d = today(); if (!S.days.includes(d)) { S.days.push(d); if (S.days.length > 400) S.days.shift(); } }
function streak() {
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (; ;) { const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); if (set.has(k)) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}
function record(qid, ok) {
  const a = S.answers[qid] || { c: 0, w: 0 };
  ok ? a.c++ : a.w++; a.last = ok; a.t = Date.now();
  S.answers[qid] = a; markDay(); save();
}
function topicStats(t) {
  const qs = QS.filter(q => q.t === t);
  let seen = 0, right = 0;
  qs.forEach(q => { const a = S.answers[q.id]; if (a) { seen++; if (a.last) right++; } });
  return { total: qs.length, seen, right, acc: seen ? right / seen : null };
}
function overall() {
  let n = 0, c = 0, att = 0;
  Object.values(S.answers).forEach(a => { n++; if (a.last) c++; att += a.c + a.w; });
  return { n, c, att };
}
const wrongIds = () => QS.filter(q => S.answers[q.id] && S.answers[q.id].last === false).map(q => q.id);
const isFav = id => S.fav.includes(id);
function toggleFav(id) { S.fav = isFav(id) ? S.fav.filter(x => x !== id) : S.fav.concat(id); save(); }

/* ---------- routing ---------- */
let view = { name: 'home' };
let quiz = null, mock = null, mockTimer = null, coachTurns = [];
const NAV = [
  { id: 'home', zh: '首页', ic: 'home' },
  { id: 'learn', zh: '知识地图', ic: 'learn' },
  { id: 'practice', zh: '刷题练习', ic: 'practice' },
  { id: 'mocks', zh: '模拟考试', ic: 'mock' },
  { id: 'problems', zh: 'IEO 大题', ic: 'prob' },
  { id: 'mistakes', zh: '错题本', ic: 'wrong' },
  { id: 'guide', zh: '竞赛与课程指南', ic: 'guide' },
  { id: 'coach', zh: 'AI 教练', ic: 'coach' }];
const TABS = [{ id: 'home', zh: '首页', ic: 'home' }, { id: 'learn', zh: '学习', ic: 'learn' }, { id: 'practice', zh: '刷题', ic: 'practice' }, { id: 'mocks', zh: '模考', ic: 'mock' }, { id: 'more', zh: '更多', ic: 'more' }];
const navOf = n => ({ lesson: 'learn', quiz: 'practice', mockrun: 'mocks', mockres: 'mocks', problem: 'problems' }[n] || n);

function go(name, arg) {
  if (mockTimer && name !== 'mockrun') { clearInterval(mockTimer); mockTimer = null; }
  view = { name, arg };

/* ---------- recommendation ---------- */
function lessonPath() {
  const g = gnum(S.profile.grade);
  return LESSONS.filter(l => gnum(l.level) <= g);
}
function nextLesson() { return lessonPath().find(l => !S.lessons[l.id]) || null; }
function weakTopic() {
  let best = null;
  LESSONS.forEach(l => { const s = topicStats(l.id); if (s.seen >= 3 && s.acc < 0.8 && (!best || s.acc < best.s.acc)) best = { l, s }; });
  return best;
}
function levelsForGrade() { const g = gnum(S.profile.grade); return g <= 9 ? [1, 2] : g === 10 ? [1, 2, 3] : [2, 3]; }
function dailySet(n = 10) {
  const lv = levelsForGrade(), goals = S.profile.goals;
  const g = gnum(S.profile.grade);
  const allowed = new Set(lessonPath().map(l => l.id));
  let pool = QS.filter(q => allowed.has(q.t) && lv.includes(q.lv) && (!goals.length || q.ex.some(e => goals.includes(e))));
  if (g <= 9) pool = pool.filter(q => q.lv === 1 || Math.random() < .3);
  const unseen = shuffle(pool.filter(q => !S.answers[q.id])), seen = shuffle(pool.filter(q => S.answers[q.id] && !S.answers[q.id].last));
  return unseen.concat(seen, shuffle(pool)).map(q => q.id).filter((v, i, a) => a.indexOf(v) === i).slice(0, n);
}

function vQuiz() {

  if (quiz.i >= quiz.ids.length) return quizDone();
  const q = QBY[quiz.ids[quiz.i]], pick = quiz.picks[q.id], done = pick !== undefined;
  afterFns.push(() => {
    document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(+b.dataset.opt));
    $('#q-next')?.addEventListener('click', nextQ);
    $('#q-prev')?.addEventListener('click', () => { quiz.i = Math.max(0, quiz.i - 1); render(); });
    $('#q-end')?.addEventListener('click', () => { quiz.i = quiz.ids.length; render(); });
    $('#q-star')?.addEventListener('click', () => { toggleFav(q.id); render(); });
    $('#q-ai')?.addEventListener('click', () => aiExplain(q, pick));
  });
  const right = Object.entries(quiz.picks).filter(([id, v]) => QBY[id].a === v).length;
  return `<div class="wrap"><div class="qwrap">
    <div class="qtop"><button class="btn ghost sm" id="q-end">结束</button><div class="bar"><i style="width:${pct(quiz.i + (done ? 1 : 0), quiz.ids.length)}%"></i></div><span class="num muted" style="font-size:13px">${quiz.i + 1} / ${quiz.ids.length} · 答对 ${right}</span></div>
    <div class="qcard">
      <div class="row between"><div class="qmeta">${qMeta(q)}</div><button class="star" id="q-star" aria-pressed="${isFav(q.id)}" aria-label="收藏">${IC.star}${isFav(q.id) ? '已收藏' : '收藏'}</button></div>
      ${qBody(q)}
      <div class="opts">${q.o.map((o, k) => {
        const cls = done ? (k === q.a ? 'right' : k === pick ? 'wrong' : '') : '';
        return `<button class="opt ${cls}" data-opt="${k}" ${done ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`;
      }).join('')}</div>
      ${done ? `<div class="expl"><span class="verdict ${pick === q.a ? 'ok' : 'no'}">${pick === q.a ? '回答正确' : '回答错误 · 正确答案 ' + LETTERS[q.a]}</span><p>${esc(q.e)}</p></div>
        <div id="ai-out">${quiz.ai[q.id] ? `<div class="ai-box"><span class="who">AI 教练</span>${esc(quiz.ai[q.id])}</div>` : ''}</div>` : '<span class="kbd">键盘：按 A–D 或 1–4 作答，Enter 下一题</span>'}
    </div>
    <div class="qnav">
      <button class="btn ghost" id="q-prev" ${quiz.i ? '' : 'disabled'}>${IC.back}上一题</button>
      <div class="row">${done && SAMPLE ? `<button class="btn" id="q-ai">${IC.coach}AI 教练讲解</button>` : ''}
      <button class="btn pri" id="q-next" ${done ? '' : 'disabled'}>${quiz.i === quiz.ids.length - 1 ? '查看结果' : '下一题'}${IC.arrow}</button></div>
    </div>
  </div></div>`;
}
function answer(k) {
  const q = QBY[quiz.ids[quiz.i]];
  if (quiz.picks[q.id] !== undefined) return;
  quiz.picks[q.id] = k; record(q.id, k === q.a); render();
}
function nextQ() { if (quiz.picks[quiz.ids[quiz.i]] === undefined) return; quiz.i++; render(); }
function quizDone() {
  const ans = quiz.ids.filter(id => quiz.picks[id] !== undefined), right = ans.filter(id => QBY[id].a === quiz.picks[id]);
  const wrong = ans.filter(id => QBY[id].a !== quiz.picks[id]);
  afterFns.push(() => {
    $('#qd-again')?.addEventListener('click', () => startQuiz(shuffle(quiz.ids), quiz.title));
    $('#qd-wrong')?.addEventListener('click', () => startQuiz(wrong, '本轮错题'));
  });
  return `<div class="wrap"><div class="qwrap">
    <div class="card" style="display:flex;flex-direction:column;gap:14px">
      <span class="eyebrow">${esc(quiz.title)} · 完成</span>
      <div class="score"><b class="num">${right.length}</b><span class="muted">/ ${ans.length} 正确 · ${pct(right.length, ans.length)}%</span></div>
      <div class="row">${wrong.length ? `<button class="btn pri" id="qd-wrong">重做本轮 ${wrong.length} 道错题</button>` : ''}<button class="btn" id="qd-again">再练一次</button><button class="btn ghost" data-go="practice">返回题库</button></div>
    </div>

}
function reviewList(ids, picks) {

    const q = QBY[id], p = picks[id], ok = p === q.a;

      <span class="tag ${ok ? 'l1' : 'l3'}">${ok ? '✓' : p === undefined ? '未答' : '✗'}</span><span class="num muted">${n + 1}.</span><span style="flex:1">${esc(q.q.split('\n')[0]).slice(0, 110)}${q.q.length > 110 ? '…' : ''}</span></summary>

/* ---------- AI ---------- */
function aiCopy(code) {
  return { not_granted: '你没有允许本页使用 Claude，AI 讲解已关闭。', rate_limited: '请求太频繁，稍等片刻再试。', cancelled: '已停止。' }[code] || 'AI 教练暂时无法回答，请稍后再试。';

async function aiExplain(q, pick) {
  if (!SAMPLE) return;

  if (btn) btn.disabled = true;
  out.innerHTML = '<div class="ai-box"><span class="who">AI 教练</span><span id="ai-t">正在思考…</span></div>';
  const prompt = `你是 CMC 师说的经济学竞赛教练，学生是 ${S.profile.grade} 的中国高中生，目标：${S.profile.goals.map(g => EXAMS[g]).join('、') || '经济学课程'}。
请用简体中文讲解下面这道题（关键术语保留英文），分三段、不用 Markdown 标题：
1）这道题考什么概念；2）一步步推理或计算到正确答案；3）${pick === q.a ? '一个同类题的变式思路' : '学生所选选项错在哪里'}，再给一个记忆技巧。总共不超过 260 字。

题目：${q.q}
${q.tbl ? '表格：' + q.tbl.map(r => r.join(' | ')).join('\n') : ''}
选项：
${q.o.map((o, k) => LETTERS[k] + '. ' + o).join('\n')}
正确答案：${LETTERS[q.a]}
学生选择：${LETTERS[pick]}
参考解析：${q.e}`;
  try {
    const { text } = await SAMPLE(prompt, { onText: ({ text }) => { const t = $('#ai-t'); if (t) t.textContent = text; } });
    quiz.ai[q.id] = text;
    const t = $('#ai-t'); if (t) t.textContent = text;
  } catch (e) {
    const t = $('#ai-t'); if (t) t.textContent = (e && e.text) ? e.text : aiCopy(e && e.code);
  }
}

function buildMock(cfg) {
  const pool = QS.filter(cfg.f), by = {};
  shuffle(pool).forEach(q => (by[q.t] = by[q.t] || []).push(q.id));
  const keys = shuffle(Object.keys(by)), ids = [];
  while (ids.length < cfg.n && keys.some(k => by[k].length)) for (const k of keys) { if (by[k].length && ids.length < cfg.n) ids.push(by[k].shift()); }
  return ids;
}
function vMocks() {
  afterFns.push(() => document.querySelectorAll('[data-mock]').forEach(b => b.onclick = () => {
    const cfg = MOCKS.find(m => m.id === b.dataset.mock), ids = buildMock(cfg);
    mock = { cfg, ids, picks: {}, i: 0, start: Date.now(), dur: Math.round(cfg.min * 60 * ids.length / cfg.n) * 1000, confirm: false };
    go('mockrun');
  }));
  const hist = S.mocks.slice().reverse().slice(0, 12);
  return `<div class="wrap">
    <div class="head"><span class="eyebrow">Timed mock exams</span><h1>模拟考试</h1><p>限时作答，交卷前不显示对错。交卷后给出分专题得分和逐题解析，成绩会记录在下方。</p></div>

    }).join('')}</div>

  </div>`;

const fmtT = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function vMockRun() {

function tick() {

function submitMock() {

/* ---------- coach ---------- */
const PRESETS = ['用一个中学生熟悉的例子解释“机会成本”和“比较优势”的区别', '给我出一道 IEO 难度的博弈论题，先不要给答案', '我总是分不清需求变化和需求量变化，帮我梳理一下', '讲讲美联储加息如何影响人民币汇率和中国出口', '帮我制定一个 8 周的 NEC 备赛计划', '如何准备 IEO 商业案例的 5 分钟英文陈述？'];
function coachRules() {
  const weak = LESSONS.map(l => ({ l, s: topicStats(l.id) })).filter(x => x.s.seen >= 3).sort((a, b) => a.s.acc - b.s.acc).slice(0, 3).map(x => x.l.title_zh);
  return `你是 CMC 师说「EconLab 经济学实验室」的 AI 教练，辅导 G8–G12 中国学生学习 AP / IB / A-Level 经济学并备战 IEO、NEC 竞赛。
学生信息：年级 ${S.profile.grade}；目标 ${S.profile.goals.map(g => EXAMS[g]).join('、') || '未设置'}；${weak.length ? '当前薄弱专题：' + weak.join('、') : '尚无做题数据'}。
规则：用简体中文回答，关键术语附英文；先讲直觉，再讲模型或计算；需要时用文字描述图形（哪条曲线怎么移动）；出题时先不给答案，等学生作答后再讲评；不承诺任何比赛或考试成绩；回答简洁，一般不超过 350 字，不使用 Markdown 标题。`;
}
function vCoach() {
  afterFns.push(() => {
    document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { $('#c-in').value = b.dataset.preset; sendCoach(); });
    $('#c-send')?.addEventListener('click', sendCoach);
    $('#c-in')?.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendCoach(); });
    $('#c-clear')?.addEventListener('click', () => { coachTurns = []; render(); });
  });
  if (!SAMPLE) return `<div class="wrap"><div class="head"><span class="eyebrow">AI Coach</span><h1>AI 教练</h1><p>AI 教练可以用你的年级和薄弱点来讲解概念、出题和批改。在 claude.ai 中打开本页并允许使用 Claude 后即可使用；它会使用你自己的 Claude 额度。</p></div><div class="empty">当前环境无法连接 AI 教练。题库、课程、模考和错题本都可以正常使用。</div></div>`;
  return `<div class="wrap"><div class="chat">
    <div class="head"><span class="eyebrow">AI Coach</span><h1>AI 教练</h1><p>问概念、要例题、请它批改你的推导。它知道你的年级、目标和薄弱专题。第一次提问时会请你允许本页使用 Claude（消耗你自己的额度）。</p></div>
    ${coachTurns.length ? '' : `<div class="chips">${PRESETS.map(p => `<button class="chip" data-preset="${esc(p)}">${esc(p)}</button>`).join('')}</div>`}
    <div class="msgs" id="msgs">${coachTurns.map(t => `<div class="msg ${t.role === 'user' ? 'u' : 'a'}">${esc(t.content)}</div>`).join('')}</div>
    <div class="composer"><textarea id="c-in" rows="2" placeholder="例如：为什么垄断厂商不在需求缺乏弹性的区间生产？（Ctrl/⌘ + Enter 发送）"></textarea><button class="btn pri" id="c-send">发送</button></div>
    ${coachTurns.length ? '<button class="btn ghost sm" id="c-clear" style="align-self:flex-start">清空对话</button>' : ''}
  </div></div>`;
}
let coachBusy = false;
async function sendCoach() {
  const inp = $('#c-in'); const text = inp && inp.value.trim();
  if (!text || coachBusy || !SAMPLE) return;
  coachBusy = true;
  coachTurns.push({ role: 'user', content: text });
  render();
  const box = document.createElement('div'); box.className = 'msg a'; box.textContent = '正在思考…'; $('#msgs').appendChild(box);
  const btn = $('#c-send'); if (btn) btn.disabled = true;
  try {
    const turns = [{ role: 'user', content: coachRules() + '\n\n（以上是设定，请回复“好的”后开始。）' }, { role: 'assistant', content: '好的。' }, ...coachTurns.slice(-12)];
    const { text: ans } = await SAMPLE(turns, { cache: false, onText: ({ text }) => { box.textContent = text; } });
    coachTurns.push({ role: 'assistant', content: ans });
  } catch (e) {
    coachTurns.push({ role: 'assistant', content: (e && e.text) ? e.text : aiCopy(e && e.code) });
  }
  coachBusy = false;
  if (view.name === 'coach') render();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { e.preventDefault(); go(g.dataset.go, g.dataset.arg); return; }
  const qt = e.target.closest('[data-quiz-topic]');
  if (qt) { const t = qt.dataset.quizTopic; const ids = QS.filter(q => q.t === t).map(q => q.id); const uns = shuffle(ids.filter(i => !S.answers[i] || !S.answers[i].last)); startQuiz(uns.concat(shuffle(ids.filter(i => !uns.includes(i)))).slice(0, 10), (LBY[t]?.title_zh || t) + ' · 专项练习'); return; }
  const qi = e.target.closest('[data-quiz-ids]');
  if (qi) { startQuiz(shuffle(qi.dataset.quizIds.split(',')), '错题重练'); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (view.name === 'quiz' && quiz && quiz.i < quiz.ids.length) {
    const k = e.key.toUpperCase(); let n = LETTERS.indexOf(k); if (n < 0 && /^[1-5]$/.test(k)) n = +k - 1;
    const q = QBY[quiz.ids[quiz.i]];
    if (n >= 0 && n < q.o.length) { answer(n); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.key === 'ArrowRight') && quiz.picks[q.id] !== undefined) { nextQ(); e.preventDefault(); }
  } else if (view.name === 'mockrun' && mock) {
    const k = e.key.toUpperCase(); let n = LETTERS.indexOf(k); if (n < 0 && /^[1-5]$/.test(k)) n = +k - 1;
    const q = QBY[mock.ids[mock.i]];
    if (n >= 0 && n < q.o.length) { mock.picks[q.id] = n; render(); }
    else if (e.key === 'ArrowRight' && mock.i < mock.ids.length - 1) { mock.i++; render(); }
    else if (e.key === 'ArrowLeft' && mock.i > 0) { mock.i--; render(); }
  }
});

/* ---------- boot ---------- */
(function boot() {
  const h = (location.hash || '').slice(1);
  const m = h.match(/^(lesson|problem)-(.+)$/);
  if (m && (LBY[m[2]] || PROBS.find(p => p.id === m[2]))) view = { name: m[1], arg: m[2] };
  else if (['learn', 'practice', 'mocks', 'problems', 'mistakes', 'guide', 'coach'].includes(h)) view = { name: h };
  render();
  initCloud();
  initSample();
})();
