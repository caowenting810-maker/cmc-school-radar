<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科研对接工作台</title>
<style>
:root{
  --bg:#F6F4EF; --panel:#FFFFFF; --ink:#1A1614; --ink2:#6B6259; --ink3:#9C9289;
  --line:#E6DFD4; --line2:#F1ECE3;
  --accent:#B8541B; --accent2:#D9762F; --accent-soft:#FBEEE4;
  --red:#B3372A; --red-soft:#FBEAE7; --amber:#9A6B14; --amber-soft:#FCF3DF;
  --green:#2C7250; --green-soft:#E8F3ED; --blue:#2A5C84; --blue-soft:#E9F1F7;
  --r:10px; --r2:7px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:14px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.35}
p{margin:0}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(184,84,27,.3)}
a:hover{border-bottom-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}

/* ---------- 布局 ---------- */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh}
.side{
  background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:18px 0 12px;
}
.brand{padding:0 16px 16px;border-bottom:1px solid var(--line2)}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.2px}
.brand-sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.side nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.navbtn{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:8px 10px;border-radius:var(--r2);font-size:13.5px;color:var(--ink2);
  text-align:left;transition:background .14s,color .14s;
}
.navbtn:hover{background:var(--line2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cnt{
  font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;
  border-radius:9px;background:var(--line);color:var(--ink2);padding:0 5px;font-weight:600;
}
.cnt:empty{display:none}
.cnt.hot{background:var(--red);color:#fff}
.cnt.warm{background:var(--amber);color:#fff}
.side-foot{padding:10px 12px 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:4px}
.side-foot button{
  font-size:12px;color:var(--ink2);text-align:left;padding:5px 6px;border-radius:5px;
}
.side-foot button:hover{background:var(--line2);color:var(--ink)}

.main{padding:0 0 96px;min-width:0}
.wrap{padding:24px 28px 0;max-width:1180px}
.view{display:none}
.view.on{display:block}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vhead h2{font-size:23px;line-height:1.3}
.vhead .sub{font-size:12.5px;color:var(--ink3);margin-top:4px}

/* ---------- 通用块 ---------- */
.block{margin-bottom:26px}
.block-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.block-head h3{font-size:14.5px;letter-spacing:.2px}
.block-head .hint{font-size:12px;color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.empty{
  background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);
  padding:22px;text-align:center;color:var(--ink3);font-size:13px;
}

/* ---------- 任务行 ---------- */
.tlist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.titem{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line2);
}
.titem:last-child{border-bottom:0}
.titem:hover{background:#FCFAF7}
.chk{
  width:16px;height:16px;border:1.5px solid var(--ink3);border-radius:4px;margin-top:3px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;
  transition:background .12s,border-color .12s;
}
.chk:hover{border-color:var(--accent)}
.chk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"]::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.tmain{min-width:0}
.ttitle{font-size:13.5px;word-break:break-word}
.titem.done .ttitle{color:var(--ink3);text-decoration:line-through}
.tmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--ink3)}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;
  background:var(--line2);color:var(--ink2);white-space:nowrap;
}
.tag.p0{background:var(--red-soft);color:var(--red);font-weight:600}
.tag.p1{background:var(--amber-soft);color:var(--amber);font-weight:600}
.tag.p2{background:var(--line2);color:var(--ink2)}
.tag.late{background:var(--red);color:#fff;font-weight:600}
.tag.soon{background:var(--amber-soft);color:var(--amber);font-weight:600}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.info{background:var(--blue-soft);color:var(--blue)}
.tacts{display:flex;gap:2px;flex-shrink:0}
.iconbtn{
  width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:13px;
}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn.danger:hover{background:var(--red-soft);color:var(--red)}

/* ---------- 统计条 ---------- */
.ledger{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:22px;
}
.ledger div{background:var(--panel);padding:11px 14px}
.ledger .k{font-size:11.5px;color:var(--ink3)}
.ledger .v{font-size:19px;font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums}
.ledger .v.red{color:var(--red)}
.ledger .v.amber{color:var(--amber)}
.ledger .v.green{color:var(--green)}

/* ---------- 科研项目卡 ---------- */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.pcard-top{padding:15px 18px 13px;border-bottom:1px solid var(--line2)}
.pcard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pcard-name{font-size:15.5px;font-weight:650}
.pcard-topic{font-size:13px;color:var(--ink2);margin-top:2px}
.pcard-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink3)}
.pcard-meta b{color:var(--ink2);font-weight:500}
.pipe{display:flex;gap:3px;margin-top:12px}
.pipe span{
  flex:1;height:5px;border-radius:3px;background:var(--line);
  transition:background .2s;
}
.pipe span.on{background:var(--accent2)}
.pipe span.cur{background:var(--accent)}
.stagelabel{font-size:11.5px;color:var(--accent);margin-top:6px;font-weight:600}
.pcard-body{padding:14px 18px 16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.sec-h h4{font-size:12.5px;color:var(--ink2);letter-spacing:.3px}

/* 文档 */
.docs{display:flex;flex-direction:column;gap:6px}
.doc{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);
  border-radius:var(--r2);background:#FCFAF7;font-size:12.5px;
}
.doc .dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dsize{color:var(--ink3);font-size:11px;white-space:nowrap}

/* 上课记录 */
.cls{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
.cls:last-child{margin-bottom:0}
.cls-top{display:flex;align-items:center;gap:9px;padding:8px 11px;background:#FCFAF7;flex-wrap:wrap}
.cls-date{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.cls-topic{font-size:12.5px;color:var(--ink2);flex:1;min-width:120px}
.cls-flags{display:flex;gap:5px;flex-wrap:wrap}
.flag{
  font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid transparent;
  background:var(--line2);color:var(--ink2);
}
.flag.off{background:var(--red-soft);color:var(--red);border-color:rgba(179,55,42,.2)}
.flag.on{background:var(--green-soft);color:var(--green)}
.flag.act{cursor:pointer}
.flag.act:hover{filter:brightness(.96)}

/* ---------- 合同 ---------- */
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.ccard.late{border-color:rgba(179,55,42,.35);background:#FFFCFB}
.ccard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ccard-name{font-size:14.5px;font-weight:600}
.ccard-sub{font-size:12px;color:var(--ink3);margin-top:2px}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:11px}
.step{
  font-size:11.5px;padding:3px 8px;border-radius:4px;background:var(--line2);color:var(--ink3);
  white-space:nowrap;
}
.step.done{background:var(--green-soft);color:var(--green)}
.step.cur{background:var(--accent);color:#fff;font-weight:600}
.ccard-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink2)}

/* ---------- 竞赛 ---------- */
.compcards{display:flex;flex-direction:column;gap:16px}
.compcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.compcard-h{padding:16px 18px 14px;border-bottom:1px solid var(--line2)}
.compcard-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.compcard-title h3{font-size:16px}
.compcard-tag{font-size:11px;color:var(--ink3);margin-top:2px}
.comp-intro{font-size:13px;color:var(--ink2);margin-top:9px;line-height:1.7}
.comp-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin-top:11px;font-size:12.5px}
.comp-meta dt{color:var(--ink3);white-space:nowrap}
.comp-meta dd{margin:0;color:var(--ink2)}
.topics{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:11px}
.topics-l{font-size:11.5px;color:var(--ink3);margin-right:3px}
.tag{font-size:11.5px;padding:2.5px 7px;border-radius:5px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.warnbox{
  margin-top:11px;padding:9px 11px;border-radius:var(--r2);background:var(--amber-soft);
  color:var(--amber);font-size:12px;line-height:1.6;
}
.nodetable{width:100%;border-collapse:collapse;font-size:12.5px}
.nodetable th{
  text-align:left;font-weight:600;font-size:11.5px;color:var(--ink3);
  padding:8px 10px;background:#FCFAF7;border-bottom:1px solid var(--line);
}
.nodetable td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.nodetable tr:last-child td{border-bottom:0}
.nodetable .nd{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600;font-size:12px}
.nodetable .nn{white-space:nowrap;font-weight:500}
.nodetable .nm{color:var(--ink2);line-height:1.6}
.nodetable tr.past .nd,.nodetable tr.past .nn{color:var(--ink3)}
.nodetable tr.next{background:var(--accent-soft)}
.nodetable tr.next .nd{color:var(--accent)}
.enrollbox{padding:12px 18px 15px;background:#FCFAF7;border-top:1px solid var(--line2)}
.enroll-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.enroll-h span{font-size:12.5px;color:var(--ink2);font-weight:600}
.enroll-row{
  display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);
  flex-wrap:wrap;
}
.enroll-row:last-child{border-bottom:0}
.enroll-name{font-size:13px;font-weight:600;min-width:64px}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.dot{
  width:22px;height:22px;border-radius:5px;background:var(--line2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink3);
  font-variant-numeric:tabular-nums;
}
.dot.done{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.dot:hover{filter:brightness(.95)}

/* ---------- 费用 ---------- */
.feebox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.feebox-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.feebox-h .tname{font-size:14.5px;font-weight:650}
.feebox-h .tmeta{font-size:11.5px;color:var(--ink3)}
.ftable{width:100%;border-collapse:collapse;font-size:12.5px}
.ftable th{
  text-align:left;font-size:11.5px;color:var(--ink3);font-weight:600;
  padding:8px 12px;background:#FCFAF7;border-bottom:1px solid var(--line);white-space:nowrap;
}
.ftable td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.ftable tr:last-child td{border-bottom:0}
.ftable .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ftable tfoot td{
  background:#FCFAF7;font-weight:650;border-top:1px solid var(--line);border-bottom:0;
}
.settle{
  font-size:11.5px;padding:2px 8px;border-radius:4px;border:1px solid transparent;white-space:nowrap;
}
.settle.no{background:var(--red-soft);color:var(--red)}
.settle.yes{background:var(--green-soft);color:var(--green)}
.settle.act{cursor:pointer}
.settle.act:hover{filter:brightness(.96)}

/* ---------- 链接 / 日志 ---------- */
.linkday{margin-bottom:18px}
.linkday-h{
  display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:12.5px;color:var(--ink2);
}
.linkday-h b{font-size:13.5px;color:var(--ink);font-weight:650}
.linkday-h .today{
  font-size:11px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:4px;font-weight:600;
}
.linkitem{
  display:flex;align-items:center;gap:11px;padding:9px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r2);margin-bottom:6px;flex-wrap:wrap;
}
.linkitem .lmajor{font-size:12px;font-weight:600;min-width:76px}
.linkitem .lurl{flex:1;min-width:150px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkitem .lnote{font-size:11.5px;color:var(--ink3)}

.logday{margin-bottom:20px}
.logday-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.logday-h b{font-size:13.5px}
.logday-h .wk{font-size:11.5px;color:var(--ink3)}
.logline{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;
  padding:8px 13px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r2);margin-bottom:5px;align-items:start;
}
.logline .lt{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:1px}
.logline .lx{font-size:13px;word-break:break-word}
.quick{
  display:grid;grid-template-columns:110px 88px minmax(0,1fr) auto;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:22px;
}
.quick input,.quick select{
  padding:7px 9px;border:1px solid var(--line);border-radius:var(--r2);background:#fff;
  font-size:12.5px;min-width:0;
}
.quick input:focus,.quick select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent2)}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r2);
  font-size:12.5px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink2);
  transition:background .14s,border-color .14s,color .14s;
}
.btn:hover{background:var(--line2);color:var(--ink);border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#A34A17;border-color:#A34A17;color:#fff}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.danger{color:var(--red);border-color:rgba(179,55,42,.3)}
.btn.danger:hover{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 悬浮按钮 ---------- */
.fab{
  position:fixed;right:26px;bottom:26px;width:50px;height:50px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:25px;line-height:1;
  box-shadow:0 4px 16px rgba(184,84,27,.32);display:flex;align-items:center;justify-content:center;
  transition:transform .16s,box-shadow .16s;z-index:40;
}
.fab:hover{transform:scale(1.06);box-shadow:0 6px 22px rgba(184,84,27,.4)}

/* ---------- 弹窗 ---------- */
dialog{
  border:0;border-radius:12px;padding:0;max-width:520px;width:calc(100% - 32px);
  background:var(--panel);color:var(--ink);box-shadow:0 18px 50px rgba(26,22,20,.22);
}
dialog::backdrop{background:rgba(26,22,20,.34)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line2)}
.dlg-h h3{font-size:15.5px}
.dlg-body{padding:16px 20px;max-height:calc(86vh - 128px);overflow-y:auto}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line2)}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r2);
  background:#fff;font-size:13px;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--accent-soft);border-color:var(--accent2);
}
.field textarea{resize:vertical;min-height:62px;line-height:1.6}
.field .fh{font-size:11.5px;color:var(--ink3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:var(--ink);color:#F6F4EF;padding:9px 17px;border-radius:20px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 响应式 ---------- */
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 0 8px}
  .brand{padding:0 14px 10px}
  .side nav{flex-direction:row;overflow-x:auto;padding:6px 10px;gap:5px}
  .navbtn{white-space:nowrap;padding:6px 11px;font-size:13px}
  .side-foot{flex-direction:row;flex-wrap:wrap;padding:8px 12px 0}
  .wrap{padding:18px 16px 0}
  .vhead h2{font-size:20px}
  .ledger{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:1fr 1fr}
  .quick input:nth-child(3){grid-column:1 / -1}
  .quick button{grid-column:1 / -1;justify-content:center}
  .nodetable{font-size:12px}
  .ftable th:nth-child(2),.ftable td:nth-child(2){display:none}
  .fab{right:16px;bottom:16px;width:46px;height:46px}
  .row2{grid-template-columns:1fr}
}

@media (max-width:640px){
  .nodetable thead{display:none}
  .nodetable tbody,.nodetable tr,.nodetable td{display:block;width:auto}
  .nodetable tr{padding:10px 15px;border-bottom:1px solid var(--line2)}
  .nodetable td{padding:0;border:0}
  .nodetable .nd{font-size:11.5px;color:var(--ink3);font-weight:500}
  .nodetable .nn{font-size:13px;margin-top:1px}

/* ================= IndexedDB 存课题文档 ================= */
var IDB = { db:null, failed:false };
function idbOpen(cb){
  if(IDB.db){ cb(null, IDB.db); return; }
  if(IDB.failed || !window.indexedDB){ cb("当前浏览器不支持本地文件存储"); return; }
  var req;
  try{ req = indexedDB.open("cmc_desk_files", 1); }
  catch(e){ IDB.failed = true; cb("无法打开本地文件库"); return; }
  req.onupgradeneeded = function(){
    var db = req.result;
    if(!db.objectStoreNames.contains("files")) db.createObjectStore("files");
  };
  req.onsuccess = function(){ IDB.db = req.result; cb(null, IDB.db); };
  req.onerror = function(){ IDB.failed = true; cb("本地文件库打开失败"); };
}
function idbPut(key, val, cb){
  idbOpen(function(err, db){
    if(err){ cb(err); return; }
    try{
      var tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put(val, key);
      tx.oncomplete = function(){ cb(null); };
      tx.onerror = function(){ cb("写入失败"); };
      tx.onabort = function(){ cb("写入被中断"); };
    }catch(e){ cb("写入失败"); }
  });
}
function idbGet(key, cb){
  idbOpen(function(err, db){
    if(err){ cb(err); return; }
    try{
      var tx = db.transaction("files", "readonly");
      var r = tx.objectStore("files").get(key);
      r.onsuccess = function(){ cb(null, r.result); };
      r.onerror = function(){ cb("读取失败"); };
    }catch(e){ cb("读取失败"); }
  });
}
function idbDel(key, cb){
  idbOpen(function(err, db){
    if(err){ if(cb) cb(err); return; }
    try{
      var tx = db.transaction("files", "readwrite");
      tx.objectStore("files").delete(key);
      tx.oncomplete = function(){ if(cb) cb(null); };
    }catch(e){ if(cb) cb("删除失败"); }
  });
}
function downloadDoc(docId, name){
  idbGet(docId, function(err, blob){
    if(err || !blob){ toast("文件读不出来，可能已被浏览器清理"); return; }
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name || "文档";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }catch(e){ toast("下载失败"); }
  });
}

function overdueTasks(){
  var td = todayStr();
  return S.tasks.filter(function(t){
    return !t.done && t.due && t.due < td;
  }).sort(function(a,b){ return a.due < b.due ? -1 : 1; });
}
function todayTasks(){
  var td = todayStr();
  var pv = {"P0":0,"P1":1,"P2":2};
  return S.tasks.filter(function(t){
    return !t.done && t.due === td;
  }).sort(function(a,b){ return pv[a.pri] - pv[b.pri]; });
}
function tomorrowTasks(){
  var d = new Date(); d.setDate(d.getDate() + 1);
  var tm = todayStr(d);
  return S.tasks.filter(function(t){ return !t.done && t.due === tm; });
}
function classAlerts(){
  var out = [], td = todayStr();
  S.projects.forEach(function(p){
    (p.classes || []).forEach(function(c){
      if(!c.d) return;
      var diff = dayDiff(td, c.d);
      if(diff < 1) return;
      var need = [];
      if(!c.replay) need.push("回放");
      if(!c.summary) need.push("课程总结");
      if(need.length) out.push({ p:p, c:c, need:need.join(" + "), days:diff });
    });
  });
  out.sort(function(a,b){ return b.days - a.days; });
  return out;
}
function todayClasses(){
  var td = todayStr(), out = [];
  S.projects.forEach(function(p){
    (p.classes || []).forEach(function(c){
      if(c.d === td) out.push({ p:p, c:c });
    });
  });
  return out;
}
function classNoLog(){
  var td = todayStr(), out = [];
  S.projects.forEach(function(p){
    (p.classes || []).forEach(function(c){
      if(c.d === td && (!c.replay || !c.summary)) out.push({ p:p, c:c });
    });
  });
  return out;
}
function contractAlerts(){
  var td = todayStr();
  return S.contracts.filter(function(c){
    return Number(c.status) === 5 && dayDiff(td, c.ts) >= 3;
  });
}
function nextNodeOf(comp){
  var td = todayStr();
  var up = comp.nodes.filter(function(n){ return n.d >= td; });
  if(!up.length) return null;
  up.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  return up[0];
}
function compSorted(){
  var arr = COMPS.slice();
  arr.sort(function(a,b){
    var na = nextNodeOf(a), nb = nextNodeOf(b);
    var da = na ? na.d : "9999-99-99";
    var db = nb ? nb.d : "9999-99-99";
    return da < db ? -1 : (da > db ? 1 : 0);
  });
  return arr;
}
function compSoon(){
  var td = todayStr(), out = [];
  COMPS.forEach(function(c){
    var n = nextNodeOf(c);
    if(!n) return;
    var diff = dayDiff(n.d, td);
    if(diff >= 0 && diff <= 14) out.push({ comp:c, node:n, days:diff });
  });
  out.sort(function(a,b){ return a.days - b.days; });
  return out;
}
function linksToday(){

function feesUnsettled(){
  return S.fees.filter(function(f){ return !f.settled; });

function taskRow(t, opts){
  opts = opts || {};
  var td = todayStr();
  var meta = [];

  if(t.pri) meta.push('<span class="tag ' + t.pri.toLowerCase() + '">' + esc(t.pri) + '</span>');

    var cls = "";
    var txt = fmtMD(t.due);
    if(!t.done && diff < 0){ cls = "late"; txt += " 逾期" + Math.abs(diff) + "天"; }
    else if(!t.done && diff === 0){ cls = "soon"; txt = "今天"; }
    else if(!t.done && diff === 1){ cls = "soon"; txt = "明天"; }
    else if(!t.done && diff > 1 && diff <= 3){ cls = "soon"; txt += " 还剩" + diff + "天"; }
    meta.push('<span class="tag ' + cls + '">' + esc(txt) + '</span>');

  if(t.note) meta.push('<span>' + esc(t.note) + '</span>');

  return '<div class="titem' + (t.done ? " done" : "") + '">' +
    '<button class="chk" type="button" aria-pressed="' + (t.done ? "true" : "false") +
      '" data-toggle-task="' + esc(t.id) + '" aria-label="标记完成"></button>' +

      '<button class="iconbtn" type="button" data-edit-task="' + esc(t.id) + '" title="编辑">✎</button>' +
      '<button class="iconbtn danger" type="button" data-del-task="' + esc(t.id) + '" title="删除">✕</button>' +
    '</div>' +
  '</div>';
}

function renderFee(){
  if(!S.fees.length){
    $("fee-body").innerHTML = '<div class="empty">还没有课时记录。<br><br>点「+ 记一笔课时」，填老师、日期、课时、单价就行。</div>';
    return;
  }
  var groups = {};
  S.fees.forEach(function(f){
    var k = f.teacher || "未填老师";
    (groups[k] = groups[k] || []).push(f);
  });
  var names = Object.keys(groups).sort();

  var h = "";
  names.forEach(function(nm){
    var rows = groups[nm].slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var th = 0, tm = 0, tuns = 0;
    var kinds = {};
    rows.forEach(function(r){
      var hrs = Number(r.hours) || 0;
      var rate = Number(r.rate) || 0;
      th += hrs; tm += hrs * rate;
      if(!r.settled) tuns += hrs * rate;
      kinds[r.kind] = true;
    });
    var kindTxt = Object.keys(kinds).map(function(k){
      for(var i = 0; i < FEEKINDS.length; i++) if(FEEKINDS[i][0] === k) return FEEKINDS[i][1];
      return k;
    }).join(" / ");

    var body = rows.map(function(r){
      var hrs = Number(r.hours) || 0;
      var rate = Number(r.rate) || 0;
      return '<tr>' +
        '<td>' + esc(r.date || "") + '</td>' +
        '<td>' + esc(feeKindLabel(r.kind)) + '</td>' +
        '<td class="num">' + money(hrs) + '</td>' +
        '<td class="num">' + money(rate) + '</td>' +
        '<td class="num">' + money(hrs * rate) + '</td>' +
        '<td><button class="settle act ' + (r.settled ? "yes" : "no") + '" type="button" ' +
          'data-settle="' + esc(r.id) + '">' + (r.settled ? "已结算" : "未结算") + '</button></td>' +
        '<td><button class="iconbtn" type="button" data-edit-fee="' + esc(r.id) + '" title="编辑">✎</button>' +
          '<button class="iconbtn danger" type="button" data-del-fee="' + esc(r.id) + '" title="删除">✕</button></td>' +
      '</tr>';
    }).join("");

    h += '<div class="feebox">' +
      '<div class="feebox-h">' +
        '<div><div class="tname">' + esc(nm) + '</div>' +
          '<div class="tmeta">' + esc(kindTxt) + '　共 ' + rows.length + ' 次</div></div>' +
        '<div class="tmeta">未结算 <b style="color:var(--red)">' + money(tuns) + '</b> 元</div>' +
      '</div>' +
      '<table class="ftable">' +
        '<thead><tr><th>上课时间</th><th>类型</th><th class="num">课时</th>' +
          '<th class="num">单价</th><th class="num">金额</th><th>状态</th><th></th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
        '<tfoot><tr><td colspan="2">合计</td>' +
          '<td class="num">' + money(th) + '</td><td></td>' +
          '<td class="num">' + money(tm) + '</td><td colspan="2"></td></tr></tfoot>' +
      '</table>' +
    '</div>';
  });
  $("fee-body").innerHTML = h;
}

var uiFilter = "all";
function renderTask(){
  var filters = [["all","全部"]].concat(CATS.map(function(c){ return [c[0], c[1]]; }));
  var bar = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">' +
    filters.map(function(f){
      return '<button class="btn sm' + (uiFilter === f[0] ? " pri" : "") + '" type="button" data-filter="' + f[0] + '">' +
        esc(f[1]) + '</button>';
    }).join("") + '</div>';

  var arr = S.tasks.slice().sort(function(a,b){
    if(a.done !== b.done) return a.done ? 1 : -1;
    var pv = {"P0":0,"P1":1,"P2":2};
    if(pv[a.pri] !== pv[b.pri]) return pv[a.pri] - pv[b.pri];
    return (a.due || "9999") < (b.due || "9999") ? -1 : 1;
  });
  if(uiFilter !== "all") arr = arr.filter(function(t){ return t.cat === uiFilter; });

  var open = arr.filter(function(t){ return !t.done; });
  var done = arr.filter(function(t){ return t.done; });

  var h = bar;
  h += '<div class="block"><div class="block-head"><h3>进行中</h3><span class="hint">' + open.length + ' 条</span></div>' +
    taskList(open, "这类没有进行中的任务") + '</div>';
  if(done.length){
    h += '<div class="block"><div class="block-head"><h3>已完成</h3><span class="hint">' + done.length + ' 条</span></div>' +
      taskList(done.slice(0, 40), "") + '</div>';
  }
  $("task-body").innerHTML = h;
}

var dlgState = { save:null };

function fieldHtml(f, val){
  var v = val == null ? "" : val;
  var h = '<div class="field' + (f.half ? ' half' : '') + '"><label for="f-' + f.k + '">' + esc(f.label) + '</label>';
  if(f.type === "select"){
    h += '<select id="f-' + f.k + '">' +
      (f.ph ? '<option value="">' + esc(f.ph) + '</option>' : '') +
      f.opts.map(function(o){
        var sel = String(o[0]) === String(v) ? " selected" : "";
        return '<option value="' + esc(o[0]) + '"' + sel + '>' + esc(o[1]) + '</option>';
      }).join("") + '</select>';
  }else if(f.type === "textarea"){
    h += '<textarea id="f-' + f.k + '" placeholder="' + esc(f.ph || "") + '">' + esc(v) + '</textarea>';
  }else{
    h += '<input id="f-' + f.k + '" type="' + f.type + '" value="' + esc(v) +
      '" placeholder="' + esc(f.ph || "") + '"' +
      (f.type === "number" ? ' step="0.5" min="0"' : '') + '>';
  }
  h += '</div>';
  return h;
}

function openForm(title, fields, data, onSave){
  var body = $("dlg-body");
  var html = "", half = "";
  fields.forEach(function(f){
    if(f.half){
      half += fieldHtml(f, data[f.k]);
    }else{
      if(half){ html += '<div class="row2">' + half + '</div>'; half = ""; }
      html += fieldHtml(f, data[f.k]);
    }
  });
  if(half) html += '<div class="row2">' + half + '</div>';

  body.innerHTML = html;
  $("dlg-title").textContent = title;
  dlgState.save = function(){
    var out = {};
    fields.forEach(function(f){
      var el = $("f-" + f.k);
      out[f.k] = el ? el.value.trim() : "";
    });
    return out;
  };
  dlgState.onSave = onSave;
  var dlg = $("dlg");
  if(typeof dlg.showModal === "function") dlg.showModal();
  else dlg.setAttribute("open", "");

  var first = body.querySelector("input,select,textarea");
  if(first) setTimeout(function(){ first.focus(); }, 60);
}
function closeDlg(){
  var dlg = $("dlg");
  if(typeof dlg.close === "function") dlg.close();
  else dlg.removeAttribute("open");
}

/* ================= 文档上传 ================= */
var pendingProjId = null;
function pickDocs(pid){
  pendingProjId = pid;
  var inp = $("doc-file");
  inp.value = "";
  inp.click();
}
function handleDocFiles(files){
  if(!pendingProjId || !files || !files.length) return;
  var p = null;
  for(var i = 0; i < S.projects.length; i++) if(S.projects[i].id === pendingProjId) p = S.projects[i];
  if(!p) return;
  p.docs = p.docs || [];

  var list = Array.prototype.slice.call(files);
  var ok = 0, fail = 0, left = list.length;

  list.forEach(function(file){
    var fid = uid();
    idbPut(fid, file, function(err){
      left--;
      if(err){ fail++; }
      else{
        ok++;
        p.docs.push({ id:fid, name:file.name, size:file.size, ts:todayStr() });
      }
      if(left === 0){
        save(); renderAll();
        if(ok && !fail) toast("已上传 " + ok + " 个文档");
        else if(ok && fail) toast("成功 " + ok + " 个，失败 " + fail + " 个");
        else toast("上传失败：" + (err || "浏览器不支持"));
        pendingProjId = null;
      }
    });
  });
}

function contractStep(id, delta){
  var c = null;
  for(var i = 0; i < S.contracts.length; i++) if(S.contracts[i].id === id) c = S.contracts[i];
  if(!c) return;

  if(nx >= CSTAGES.length) nx = CSTAGES.length - 1;
  c.status = String(nx);
  save(); renderAll();
  toast("当前状态：" + CSTAGES[nx]);

/* ================= 导出 / 导入 ================= */
function doExport(){
  var blob = new Blob([JSON.stringify(S, null, 2)], { type:"application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "科研对接工作台备份-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  toast("已导出。注意：上传的课题文档本体不在备份里");
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(String(r.result));
      if(!o || typeof o !== "object") throw new Error("格式不对");
      S.tasks = Array.isArray(o.tasks) ? o.tasks : [];
      S.projects = Array.isArray(o.projects) ? o.projects : [];
      S.contracts = Array.isArray(o.contracts) ? o.contracts : [];
      S.enroll = Array.isArray(o.enroll) ? o.enroll : [];
      S.fees = Array.isArray(o.fees) ? o.fees : [];
      S.links = Array.isArray(o.links) ? o.links : [];
      S.logs = Array.isArray(o.logs) ? o.logs : [];
      save(); renderAll();
      toast("导入完成");
    }catch(e){
      toast("导入失败：文件不是有效备份");
    }
  };
  r.onerror = function(){ toast("读取文件失败"); };
  r.readAsText(file);
}

/* ================= 事件 ================= */
document.addEventListener("click", function(e){
  var el;

  if((el = e.target.closest(".navbtn"))){
    go(el.getAttribute("data-v"));
    return;
  }
  if((el = e.target.closest("[data-add]"))){
    var kind = el.getAttribute("data-add");
    if(kind === "task") editTask(null);
    else if(kind === "proj") editProj(null);
    else if(kind === "contract") editContract(null);
    else if(kind === "fee") editFee(null);
    else if(kind === "link") editLink(null);
    return;
  }
  if(e.target.closest("#fab")){ editTask(null); return; }

  // 任务
  if((el = e.target.closest("[data-toggle-task]"))){
    var id = el.getAttribute("data-toggle-task");
    for(var i = 0; i < S.tasks.length; i++){
      if(S.tasks[i].id === id){ S.tasks[i].done = !S.tasks[i].done; break; }
    }
    save(); rerender();
    return;
  }
  if((el = e.target.closest("[data-edit-task]"))){ editTask(el.getAttribute("data-edit-task")); return; }
  if((el = e.target.closest("[data-del-task]"))){
    var tid = el.getAttribute("data-del-task");
    S.tasks = S.tasks.filter(function(t){ return t.id !== tid; });
    save(); renderAll(); toast("已删除");
    return;
  }

  // 项目
  if((el = e.target.closest("[data-edit-proj]"))){ editProj(el.getAttribute("data-edit-proj")); return; }
  if((el = e.target.closest("[data-del-proj]"))){
    var pid = el.getAttribute("data-del-proj");
    S.projects = S.projects.filter(function(p){ return p.id !== pid; });
    save(); renderAll(); toast("已删除");
    return;
  }
  if((el = e.target.closest("[data-next-stage]"))){ nextStage(el.getAttribute("data-next-stage")); return; }

  if((el = e.target.closest("[data-del-log]"))){
    var gid = el.getAttribute("data-del-log");
    S.logs = S.logs.filter(function(l3){ return l3.id !== gid; });
    save(); renderAll(); toast("已删除");
    return;
  }

  // 今日页跳转
  if(e.target.closest("[data-fix]")){ go("research"); toast("展开课程记录，点「未发」就能标记已发"); return; }
  if(e.target.closest("[data-goto-contract]")){ go("contract"); return; }
  if(e.target.closest("[data-goto-research]")){ go("research"); return; }
  if(e.target.closest("[data-goto-comp]")){ go("comp"); return; }

  // 筛选
  if((el = e.target.closest("[data-filter]"))){
    uiFilter = el.getAttribute("data-filter");
    renderTask();
    return;
  }

  // 弹窗
  if(e.target.closest("#dlg-cancel") || e.target.closest("#dlg-x")){ closeDlg(); return; }
  if(e.target.closest("#dlg-save")){
    if(dlgState.save && dlgState.onSave){
      var vals = dlgState.save();
      if(dlgState.onSave(vals) !== false) closeDlg();
    }
    return;
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $("dlg").hasAttribute("open")) closeDlg();
});

/* 表单回车不刷新 */
$("dlg-form").addEventListener("submit", function(e){ e.preventDefault(); });

/* 文档选择 */
$("doc-file").addEventListener("change", function(e){
  handleDocFiles(e.target.files);
});

/* 快速记一条 */
$("q-add").addEventListener("click", function(){
  var txt = $("q-text").value.trim();
  if(!txt){ toast("先写一句做了什么"); return; }
  var d = $("q-date").value || todayStr();
  var t = $("q-time").value || nowTime();
  S.logs.push({ id:uid(), date:d, time:t, text:txt });
  save(); renderAll();
  $("q-text").value = "";
  $("q-time").value = "";
  toast("已记下");
});
$("q-text").addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); $("q-add").click(); }
});

/* 侧栏操作 */
$("btn-export").addEventListener("click", doExport);
$("btn-import").addEventListener("click", function(){ $("file-import").click(); });
$("file-import").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) doImport(e.target.files[0]);
  e.target.value = "";
});
$("btn-demo").addEventListener("click", function(){
  if(S.tasks.length || S.projects.length || S.logs.length){
    if(!window.confirm("载入示例会覆盖现在所有数据，确定？")) return;
  }
  loadDemo();
});
$("btn-clear").addEventListener("click", function(){
  if(!window.confirm("确定清空所有数据？这个操作没法撤销，建议先导出备份。")) return;
  S = { tasks:[], projects:[], contracts:[], enroll:[], fees:[], links:[], logs:[] };
  save(); renderAll(); go("log"); toast("已清空");
});

/* ================= 启动 ================= */
load();
renderAll();
go("log");

})();
</script>
</body>
</html>
